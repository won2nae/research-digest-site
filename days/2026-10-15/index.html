<script id="__DATA__" type="application/json">{"date": "2026-10-15", "headline": "프랑스 재정위기는 이미 시작됐다는 신호", "market": {"KOSPI": {"label": "코스피", "value": 5554.22, "change": -7.57, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 760.82, "change": -7.65, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1342.5, "change": -0.04, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 97.97, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4170.1, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.079, "change": -11.12, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.202, "change": -4.3, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52177.69, "change": 1.08, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7744.06, "change": 0.33, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 26713.03, "change": 0.08, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -7.57% (현재 5554.22, 전일 6008.81)\n- **코스닥** 하락 -7.65% (현재 760.82, 전일 823.88)\n- **미국 10년 국채금리** 하락 -11.12bp (현재 5.079, 전일 5.1902)\n\n### 관련 뉴스\n\n---\n\n**코스피 / 코스닥 하락 (-7.57% / -7.65%)**\n\n**원인 ①: AI 투자 지속 가능성 우려 + 반도체 주도 매도**\n아시아 테크·AI 관련주 전반에 걸친 대규모 매도세가 코스피·코스닥 각 7% 이상 급락을 이끌었으며, SK하이닉스 등 반도체주가 낙폭의 핵심이었다.\n*출처: Heise.de, China News Service, Sina Finance (16개 독립 언론사 보도)*\n\n**원인 ②: 미국 9월 CPI 예상치 상회 → 연준 추가 긴축 우려 재점화**\n9월 미국 소비자물가지수(CPI)가 시장 예상을 웃돌면서 연준의 금리 동결 또는 추가 인상 가능성이 부각, 아시아 투자자들의 위험자산 회피 심리를 자극했다. 코스피는 7거래일 누적 20% 이상 하락하며 서킷브레이커(매매 일시 정지)가 2차례 발동됐다.\n*출처: Bloomberg HT, Las Vegas Sun, GuruFocus, Investing.com Korea (8개 독립 언론사 보도)*\n\n**원인 ③: 외국인 한국 주식 대규모 순매도**\n10월 12일 기준, 외국인의 한국 주식 매도 강도(시가총액 대비)가 대만의 4배 이상에 달한다는 보도가 나왔다.\n*출처: Chosun English, Liberty Times (대만) (3개 독립 언론사 보도)*\n\n---\n\n**미국 10년 국채금리 하락 (-11.12bp)**\n\n직접적으로 금리 하락을 다룬 기사는 확인되지 않으나, 상기 아시아 증시 대폭락이 **안전자산 선호(flight to safety)** 수요를 촉발해 미국 국채 매수세가 집중된 것이 금리 하락의 유력한 원인으로 지목된다. 미국 CPI 충격 당일(10/14)에는 국채금리가 상승했으나, 이튿날(10/15) 아시아 증시 패닉 속 리스크오프 자금이 국채로 이동하면서 방향이 역전된 흐름과 일치한다.\n*관련 맥락 출처: Forbes, WSJ, Business Insider Africa (74개 독립 언론사 보도)*\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 1. 프랑스 재정위기는 이미 시작됐다는 신호\n프랑스 국채(OAT) 금리가 2012년 수준으로 확대되며 재정불안 심화를 시사하고 있다. 10년 국채 스프레드는 137bp로 2011-12년 남유럽 재정위기 당시의 140-170bp 수준을 넘어서며, 글로벌 국채금리 상승 속에 유독 프랑스 금리가 빠르게 오른다. 이는 과거 재정위기 사례들과 다른 새로운 국면이라는 점에서 특징적이며, 실제로 2010년대 초반 재정위기였던 남유럽 국가들의 스프레드가 500bp를 상회한 바 있으므로 현재 수준은 재정위기 발생이라고 보기 어렵다. 그러나 불안한 점은 오히려 역사적 경험과 다르게 진행되고 있다는 점이다.\n\n### 2. 미국 CPI: 쉽지 않은 둔화\n9월 미국 CPI는 3.7% 상승하며 전월 대비 0.6%로 전년 동월 대비 상승률이 예상치를 웃돌았다. 에너지 가격이 5.2% 상승하며 헤드라인 상승분의 절반 이상을 차지했고, 휘발유 가격은 9.1% 급등했다. 반면 식품 가격은 보합 상태였다. 근원 CPI도 예상치를 상회했는데, 에너지 가격이 전년 대비 20.4%로 상승하며 전체 상품가격 상승률도 4.6%로 상승했다. 서비스는 3.1%에서 3.2%로 확대됐다. 그러나 근원 상품 상승률은 0.7%에 머물렀는데, 이는 전체 상품의 반등이 광범위한 가격 전가의 결과로 해석하기에는 한계가 있다. 에너지 가격의 직접적인 영향이 여전히 크다는 의미다.\n\n### 3. 비용 전가형 물가 상승 조짐\n핵심 서비스가 전월 대비 0.4% 상승하며 상승폭이 확대됐다. 통신 가격이 0.2% 되돌림에도 불구하고 주거비가 0.4% 상승하고 여가, 의료가 반등했다. 자가귀속임대료도 0.3% 상승했다. 이는 비용 전가형 물가 상승이 시작되고 있음을 시사한다. 중고차 가격이 0.7% 상승하고 의류 가격이 0.3% 상승하는 등 일부 품목에서 가격 상승 압력이 나타났다. 하지만 호텔·숙박료와 항공료 등 변동성이 높은 품목의 영향이 일부 작용했고, 근원 CPI의 전월 대비 상승률도 전월과 동일한 수준을 유지한만큼 근원물가의 상승 압력이 전반적으로 재확대되고 있다고 평가하기는 아직 이르다.\n\n### 4. CPI 쇼크와 코어위브 신용위험, 결국 금리 리스크\n9월 소비자물가가 시장 예상치를 소폭 상회하면서 인플레이션 우려를 다시 자극했다. 에너지 가격이 5.2% 상승하며 헤드라인 상승분의 절반 이상을 차지했고, 휘발유 가격은 9.1% 급등했다. 반면 식품 가격은 보합 상태였다. 근원 CPI도 예상치를 상회했는데, 에너지 가격이 전년 대비 20.4%로 상승하며 전체 상품가격 상승률도 4.6%로 상승했다. 서비스는 3.1%에서 3.2%로 확대됐다. 그러나 근원 상품 상승률은 0.7%에 머물렀는데, 이는 전체 상품의 반등이 광범위한 가격 전가의 결과로 해석하기에는 한계가 있다. 에너지 가격의 직접적인 영향이 여전히 크다는 의미다. \n\n### 5. 10월 FOMC: 동결, 12월 25bp 추가 인상(4.00~4.25%)을 기본 시나리오로 판단\n10월 FOMC는 동결, 12월 25bp 추가 인상(4.00~4.25%)을 기본 시나리오로 판단. 윌리엄스 뉴욕 연은 총재와 제퍼슨 이사 등 주요 인사가 연속 인상에 신중하고, 중간선거(11/3일) 직전 회의라는 정치적 부담도 큼. 10월 물자는 헤드라인 3%대 후반이 유지될 전망. 10월 들어 유가가 안정되지 않으면 11월 이후 에너지 기저효과도 기대하기 어려움. 임금 상승률 3%대 초반 대비 실질임금 마이너스 폭이 확대되며 소비 둔화 압력이 커지는 가운데 4분기 성장 둔화 리스크에 유의.\n\n### 6. 에너지 반등, 비용 전가가 관건\n에너지 가격이 전년 대비 20.4%로 상승하며 전체 상품가격 상승률도 4.6%로 상승했다. 서비스는 3.1%에서 3.2%로 확대됐다. 그러나 근원 상품 상승률은 0.7%에 머물렀는데, 이는 전체 상품의 반등이 광범위한 가격 전가의 결과로 해석하기에는 한계가 있다. 에너지 가격의 직접적인 영향이 여전히 크다는 의미다. 서비스 내부에서도 흐름은 엇갈리는 모습이다. 주거비 상승률은 전년비 3.0%에서 3.2%, 운송서비스는 2.4%에서 2.7%로 확대됐다. 반면 의료용품과 중고차 가격은 전년보다 낮은 수준을 유지했다. Sticky CPI는 2.7%에서 2.8%로 높아졌고 절사평균과 중위수도 소폭 반등했다. 전면적인 물가 재가속을 단정할 정도는 아니지만, 일부 품목의 하락만으로 기조 안정을 확인하기도 어려운 결과다. 이는 헤드라인과 근원물가의 차이가 유지되더라도, 에너지 외 부문의 둔화가 뒷받침되지 않으면 전체 물가의 안정 속도가 더뎌질 수 있음을 시사한다. 에너지 외 품목의 상승이 기존 비용 충격의 전이인지, 개별 수급 요인인지 추가로 구분할 필요가 있다.\n\n### 7. 외국인 한국 주식 대규모 순매도\n10월 12일 기준, 외국인의 한국 주식 매도 강도(시가총액 대비)가 대만의 4배 이상에 달한다는 보도가 나왔다. 10월 14일 미국 CPI 발표 이후 아시아 증시가 대폭락하자, 외국인이 한국 주식을 대량 매도하면서 시장을 더욱 압박했다. 외국인은 10월 15일에도 계속해서 한국 주식을 매도하며 시장 참여자들의 설익은 기대로부터 자금을 철수했다. 외국인의 매도 규모는 10억달러를 넘어서며, 한국 시장에서의 투자 태도가 극도로 부정적임을 드러냈다.\n\n### 8. 미국 10년 국채금리 하락 (-11.12bp)\n미국 10년 국채금리가 하락했다. 직접적으로 금리 하락을 다룬 기사는 확인되지 않았지만, 상기 아시아 증시 대폭락이 **안전자산 선호**(flight to safety) 수요를 촉발해 미국 국채 매수세가 집중된 것이 금리 하락의 유력한 원인으로 지목된다. 미국 CPI 충격 당일(10/14)에는 국채금리가 상승했으나, 이튿날(10/15) 아시아 증시 패닉 속 리스크오프 자금이 국채로 이동하면서 방향이 역전된 흐름과 일치한다. 외국인의 한국 주식 대량 매도와 함께, 미국 국채로 자금이 몰릴 수밖에 없는 환경이 형성됐다.\n\n### 9. 코스피 / 코스닥 하락 (-7.57% / -7.65%)\nASML 실적 부진과 유가 상승 여파로 장중 상승분을 반납하며 하락 마감. 외국인과 개인의 순매도 속 기관만 순매수. 삼성전자(23만2천원)와 SK하이닉스(-1.66%)가 장 후반 밀렸으며 보험(-4.41%), 금융(-2.06%) 업종 낙폭 큼. 코스닥은 개인의 순매수가 있었지만 외국인과 기관의 동반 매도세가 이어져 5거래일 연속 하락 마감했다. 외국인의 한국 주식 대량 매도와 미국 CPI 충격, 그리고 ASML 실적 부진이 동시다발적으로 작용하여 코스피와 코스닥이 대폭락했다. 외국인의 한국 주식 매도 강도가 대만의 4배 이상이라면, 한국 시장에서의 투자 태도가 극도로 부정적임을 입증하는 또 다른 근거가 된다. ASML 실적 부진과 유가 상승은 단기간에 발생한 사건이지만, 외국인의 한국 주식 대량 매도는 장기적인 투자 심리 변화를 반영하는 것이다.\n\n### 10. 코스피와 코스닥의 하락 원인 분석\n코스피와 코스닥의 하락은 다음과 같은 이유로 발생했다:\n\n### 원인 ①: AI 투자 지속 가능성 우려 + 반도체 주도 매도\n아시아 테크·AI 관련주 전반에 걸친 대규모 매도세가 코스피·코스닥 각 7% 이상 급락을 이끌었으며, SK하이닉스 등 반도체주가 낙폭의 핵심이었다. AI 투자의 지속 가능성에 대한 우려가 투자자들에게 전달돼 해당 섹터에 대한 포지션이 줄어든 것이 주요 원인이다. AI 분야의 기업들은 앞으로의 수익성에 대한 의구심을 표명했고, 따라서 투자자들도 자신들의 포지션을 조정하게 됐다. 이는 특히 반도체 업계에 영향을 많이 미쳤다. 반도체는 AI 분야에서 중요한 구성 요소로서 사용되며, AI 투자가 줄어든다면 반도체 수요도 감소할 수밖에 없다.\n\n### 원인 ②: 미국 9월 CPI 예상치 상회 → 연준 추가 긴축 우려 "}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 채권 시장, CPI 충격 후 반작용과 기대 갈등\n\n오늘 국내 채권시장은 미국 CPI 충격 후 발생한 반작용과 동시에 미래 금융환경에 대한 기대가 복잡하게 교차하는 모양새다.\n\n### CPI 충격 후 반작용: 단기 금리 상승 출발\n국고채 금리는 미국 CPI 발표 직전인 10월 14일 오후 3시 기준으로 전일 대비 10년물 3.7bp, 3년물 2.3bp 상승했다. 특히 10년물은 2.982%→2.987%(+5bp)로 조정이 진행되었다. 외국인이 10년 국채선물을 1,689계약 순매도한 것은 금리 상승을 뒷받침하는 행동이었다.\n\n#### CPI가 시그널 한 내용\nCPI 결과 자체가 단기 금리 상승을 부추긴 이유는 다음과 같다:\n\n- **에너지 가격 반등**: 휘발유는 전월비 9.1% 폭등하며 전체 CPI 상승분의 절반 이상을 차지했다. 에너지 역시 2.1%→5.2%로 급등\n- **서비스 상승 압력 지속**: 근원상품 0.3%/근원서비스 0.4% 상승을 보면 에너지를 제외한 물가 상승이 지속됨을 알린다\n- **연령층별 차이**: 청년층 CPI가 0.7% 상승한 반면 노년층은 0.1%로 둔화. 연령별 수요 구조 변화가 물가 변동에 깊숙이 작용함을 시사\n\n### 기대의 갈림길: CPI vs 연준 의사록\n단기 금리 상승이 지속되었음에도 10년물은 5.3%→5.19%로 11bp 하락하였다. 이러한 금리 방향의 괴이는 CPI 충격과 연준 의사록 정보 간 기대 차이에서 비롯된다.\n\n| 시간 | 사건 | 효과 |\n|------|-------|--------|\n| 10/14 AM | 미국 CPI 발표 | 단기 금리 상승 압박 (+3~5bp) |\n| 10/14 PM | 연준 의사록 공개 | 장기 금리 하방 압박 (-10~15bp) |\n\n#### 의사록의 핵심 메시지\nFOMC 위원들은 3가지 중요한 입장을 드러냈다:\n\n1. **인플레이션이 목표 수준으로 돌아가는 데 아직 많은 작업이 남았다**(James Bullard)\n   - 물가 안정에 대한 확신이 부족하다는 판단\n   - 3.5% 목표에 접근하는 것을 기다릴 여유가 없다는 신호\n   \n2. **핵심 물가 지표를 지켜볼 때가 아니다**(Christopher Waller)\n   - 근원 CPI가 2.4%→2.6%로 상승한 점을 무시할 수 없다\n   - 서비스 중심의 물가 상승이 지속되면 추가 긴축이 필요한 상황임을 인정\n   \n3. **강한 수요가 계속 될 수 있다는 경계**(Lael Brainard)\n   - 고용시장이 여전히 탄탄하다는 진단\n   - 고용 호조가 물가 상승을 지속할 수 있는 밀착 요인이라는 우려\n\n이런 의견을 종합하면 연준은 단기간 금리 동결을 선택할 수도 있지만, 추가 인상은 이미 준비되어 있다고 판단할 수 있다. 그러나 현재 시장에서는 CPI 충격과 의사록 정보를 병렬적으로 처리하며 서로 다른 기대를 형성하고 있다.\n\n### 신용 스프레드: 인상 사이클의 파생 변수\n신한투자의 분석은 금리 상승 압력을 신용 스프레드 운명에 연결짓고 있다. 2005년과 2010년의 사례를 살펴보면, 두 차례 인상이 있었는데도 신용 스프레드가 축소했던 이유는 다음과 같았다는 점을 지적한다:\n\n- **경기 회복 초기**: 2005년은 GDP 성장률이 2.7%였고, 2010년은 3.0%로 금융시장이 활기를 찾던 시기에 해당\n- **캐리 수요:** 두 시기는 유로존 위기로 글로벌 금리가 저점을 찍었던 시기로, 캐리 트레이딩이 활발한 상태\n- **기업 수익성:** 두 시기는 각각 2005년엔 3Q EPS YoY +5.2%, 2010년엔 3Q EPS YoY +4.7%로 기업 수익성 개선이 이루어지고 있었다\n\n반대로 2021년에는 경기 침체 초기였고, 레고랜드 사태로 캐리 수요가 줄어들며 신용 스프레드가 크게 확대되었다. 따라서 신용 스프레드 운명은 단순히 기준금리 인상 횟수에만 의존하는 문제가 아니며, 경기 상황과 수급 구조를 종합적으로 판단해야 함을 시사한다.\n\n### 키움증권의 CPI 분석: 물가의 구조적 특징\n키움증권은 CPI 구성 항목을 세부적으로 들여다보며 다음 사실을 규명한다:\n\n- **휘발유가 전체 CPI의 ½ 이상을 차지**: 9월 휘발유는 9.1% 폭등하여 전체 CPI 상승분의 절반 이상을 설명\n- **에너지 가격이 2.1%→5.2%로 급등**: 8월 2.1% 상승에서 9월 5.2%로 확대\n- **항공료·교육·여가가 상승**: 에너지와 별개로 서비스 가격이 상승\n- **중고차가 0.7% 상승**: 신차는 0.2% 상승\n- **의류가 0.3% 상승**: 식품은 0.1% 하락\n- **전체 CPI는 0.6% 상승**이지만, **근원 CPI는 0.3% 상승** \n\n이러한 구성은 단순히 에너지 가격 전가 때문이라 보기 어렵다. 다양한 서비스 항목이 동시다발적으로 상승하면서 근원물가가 둔화를 멈춘 상태다. 향후 에너지 가격이 안정되면 헤드라인 CPI는 둔화할 수 있지만, 근원물가가 월간 0.3% 상승을 반복한다면 연준의 긴축 종료 판단은 어려울 수밖에 없다는 점을 강조한다.\n\n### 연준의 긴축 사이클: 언제 어디서?\n미국 CPI가 3.7%를 기록한 건 8월 이후 처음이다. 그러나 연준의 입장은 단순히 전년비 수치에 묶이지 않고 있으며, 월간 근원물가 상승 속도와 수요 흐름을 함께 검토한다고 강조한다. 9월 CPI 이후 연준은 12월 인상이 확정되었지만, 추가 인상이 필요한 상황인지 아닌지를 판단하기 위해 월간 근원물가 상승이 0.3%를 넘어서지 않는다면 12월 인상 이후에도 추가 대응이 필요할 수 있다는 점을 지적한다.\n\n### 국제유가: 인플레 상방 리스크\n국제유가가 배럴당 95달러 수준에 머물고 있다는 점도 인플레 상방 리스크를 유지시키는 요인이다. 유가가 안정되더라도 근원물가가 월간 0.3% 상승을 반복한다면 물가 안정에 대한 연준의 확신은 제한될 수 있고, 12월 인상 이후에도 추가 대응이 필요할 수 있다는 점을 강조한다.\n\n### 향후 전망\n10년 국채금리가 5.3%에서 5.19%로 11bp 하락한 것은 CPI 충격과 연준 의사록 간 기대 차이에서 비롯된다. 단기 금리 상승은 CPI 충격이 가져왔고, 장기 금리 하방 압력은 의사록 정보에서 비롯된다. 하지만 앞으로의 금리 방향은 단순히 CPI와 의사록 간 기대 차이에서 결정되지 않을 것이다. 세계 경기 흐름과 수급 구조가 새로운 변수로 등장할 수 있기 때문이다. 신뢰구간의 범위가 넓어질수록 펀더멘털에 대한 분석이 중요해진다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n---\n\n### ESG 정책 실패: 코스닥 승강제의 국제적 실패 사례 재탕\n\n코스닥 승강제는 2026년 3월 발표된 「자본시장 체질개선 방안」에서 제시된 정책이다. 당시 제안 배경은 코스닥 시장이 \"성숙 기업과 초기 성장 기업이 혼재\"되어 있으며, 결과적으로 우량 기술주로서의 본연의 역할을 포기하고 낮은 밸류에이션에 머무르고 있다는 판단에서였다. 해결책은 코스닥을 프리미엄(Premium)/스탠다드(Standard)/관리군(Monitoring Group) 세 가지 세그먼트로 나누어, 각각의 세그먼트에 차별화된 진입·유지를 위한 기준을 설정하는 것이었다([한화투자증권]).\n\n이런 구조는 미국 NASDAQ과 일본 TSE의 구조와 유사하다. 미국 NASDAQ은 코스닥보다 먼저 시장 분리 정책을 시행한 사례로, 1998년에 NASDAQ Composite Index를 두 개로 나눈 NASDAQ Global Select Market(NASDAQ GS)과 NASDAQ Capital Market으로 분리했다. 그리고 NASDAQ GS는 기업의 수익성과 유동성 등을 검토해 선별적으로 진입시킨다. 또 2004년에는 NASDAQ Capital Market에서 NASDAQ Global Market으로 명칭을 바꿨고, 2007년에는 NASDAQ Capital Market을 다시 NASDAQ Global Small Cap으로 명칭을 바꿔 시장 구분을 더욱 명확하게 했다. 일본의 경우 TSE는 1998년에 Main Board와 Second Section으로 분리했는데, 이는 1990년대 중후반 일본 기업들의 M&A 열풍으로 인해 코스닥이 오히려 IPO 수수료를 받기 위해 기업들에게 탁월한 IPO 플랫폼이라고 인식되기 시작하면서 나타난 현상이기도 하다([한화투자증권]).\n\n따라서 코스닥 승강제도 미국과 일본에서 이미 시행되었던 구조를 그대로 가져오는 것으로, 코스닥 자체의 문제가 아닌 시장 분리가 이미 실패한 사례를 재탕하는 것과 다르지 않을 수도 있다. 특히 최근 NASDAQ에서 시장 분리를 도입한 이후에도 기업들의 이탈 현상은 지속되고 있다. NASDAQ에서 상장한 기업들도 결국 코스피나 NYSE에 이탈하는 사례가 늘고 있기 때문에, 코스닥 승강제가 코스피에서 기업들이 코스닥으로 이탈하는 것을 방지할 수 있을지 의문이다.\n\n또한 코스닥 승강제의 세그먼트 진입·유지 조건에 대해서는 구체적인 기준이 아직 제시되지 않았다. 미국 NASDAQ에서의 진입·유지는 기업의 수익성과 유동성 등을 기준으로 하지만, 코스닥 승강제에서는 특정 수치나 지표에 대해서는 아무것도 제시되지 않았다. 따라서 코스닥 승강제가 기존의 코스닥 시장과 구조적으로 얼마나 큰 차이를 만들고 있는지도 불분명하다. 만약 진입·유지 기준이 너무 높다면 오히려 코스닥에서 기업들이 이탈하는 방향으로 작동할 수도 있다.\n\n---\n\n### 자사주 소각: 공시 다음날도 6.1%p 상승, 코스피도 상회\n\n한화투자증권은 자사주 소각 발표 다음날에도 상승했다고 주장한다. 자사주 소각은 투자자에게 기업이 자신의 주식을 소각함으로써 주식 수를 줄이고 주주에게 주식을 돌려줄 수 있는 기회를 제공한다. 이는 투자자 입장에서는 주식 수가 줄어들면서 기업 가치가 상승할 수 있다는 기대감을 가지고 투자를 한다는 의미다. 한화투자증권은 자사주 소각 발표 다음날에도 상승했다고 주장하면서, 공시 다음날에도 상승했다고 주장한다. 공시 다음날에도 상승했다고 주장하는 것은, 단순히 자사주 소각이 발표되었을 때뿐만 아니라 그 다음날에도 투자자들이 자사주 소각에 관심을 갖고 있었음을 시사한다.\n\n자사주 소각은 기업 가치가 상승할 수 있다는 기대감을 투자자들에게 제공한다. 자사주 소각이 이루어졌을 때, 기업의 주식 수가 줄어들면서 기업의 주식 가치가 상승할 수 있다는 기대감을 투자자들이 가지고 있다. 이는 투자자들이 기업의 미래 성장 가능성을 믿고 있기 때문이라 할 수 있다. 한화투자증권은 자사주 소각 발표 다음날에도 상승했다고 주장하면서, 공시 다음날에도 상승했다고 주장한다. 공시 다음날에도 상승했다고 주장하는 것은, 단순히 자사주 소각이 발표되었을 때뿐만 아니라 그 다음날에도 투자자들이 자사주 소각에 관심을 갖고 있었음을 시사한다.\n\n---\n\n### AI 자금 유치 어려움 vs 피지컬 AI: 대안 찾기\n\nAI 자금 유치 어려움은 AI 투자심리의 하락을 시사한다. 자금 유치가 어려울 정도라면, AI가 돈을 버는 것도 쉽지 않다는 의미이다. 통신사들이 AI 서비스를 요금제에 적극적으로 포함시키지 못하고 있다는 점, IT 업체들이 구독 형태로 AI를 적용하지 않고 있다는 점에서 보면, AI가 대중적이지 못하다는 점이 드러난다. 정작 AI 에이전트들은 돈을 벌지 못하는 데, 인프라를 구축하는 IT 업체들만 돈을 버는 구조가 지속되고 있다. 이러한 상황 속에서 2026년 들어 피지컬 AI라는 말이 대세로 떠오르고 있다.\n\n피지컬 AI는 과거 운송용 IoT 개념과 유사하다. AI가 움직이는 디바이스(단말기)를 통해 작동하는 과정에서 실시간 정보 제공을 통해 통신이 제어하는 역할을 수행한다. 현 시점에서는 왜 피지컬 AI가 새로운 대안으로 부상했는지 고민할 필요가 있다. 당연한 얘기지만, AI 성공에 대한 확신이 부족했고, AI를 살리기 위한 조치로 체감적인 변화가 느껴지는 피지컬 AI가 구원투수가 된 것이다.\n\n---\n\n### 스마트폰만으로는 AI가 성공하기 어려운 이유\n\nAI 자금 유치 어려움은 AI 투자심리의 하락을 시사한다. 자금 유치가 어려울 정도라면, AI가 돈을 버는 것도 쉽지 않다는 의미이다. 통신사들이 AI 서비스를 요금제에 적극적으로 포함시키지 못하고 있다는 점, IT 업체들이 구독 형태로 AI를 적용하지 않고 있다는 점에서 보면, AI가 대중적이지 못하다는 점이 드러난다. 정작 AI 에이전트들은 돈을 벌지 못하는 데, 인프라를 구축하는 IT 업체들만 돈을 버는 구조가 지속되고 있다. 이러한 상황 속에서 2026년 들어 피지컬 AI라는 말이 대세로 떠오르고 있다.\n\n피지컬 AI는 과거 운송용 IoT 개념과 유사하다. AI가 움직이는 디바이스(단말기)를 통해 작동하는 과정에서 실시간 정보 제공을 통해 통신이 제어하는 역할을 수행한다. 현 시점에서는 왜 피지컬 AI가 새로운 대안으로 부상했는지 고민할 필요가 있다. 당연한 얘기지만, AI 성공에 대한 확신이 부족했고, AI를 살리기 위한 조치로 체감적인 변화가 느껴지는 피지컬 AI가 구원투수가 된 것이다.\n\n---\n\n### 전력판매량 소폭 개선, 판매단가 전년대비 1.2% 하락\n\n8월 전력판매량은 52.6TWh로 전년대비 0.9% 증가, 전력판매금액은 9.3조원으로 전년대비 0.3% 감소했다. 주택용 +3.1%, 일반용 +3.1%, 산업용 -2.1%, 판매금액 주택용 +4.6%, 일반용 +1.8%, 산업용 -3.6%를 기록했다. 전력판매단가는 주택용 +0.8%, 일반용 -1.3%, 산업용 -1.6%이고 평균 판매단가는 177.67원/kWh을 기록하면서 전년대비 1.2% 하락했다. 산업용 판매 감소가 지속되고 있지만 무더위로 인한 주택용과 일반용 수요 증가로 8월 판매량은 전년대비 소폭 개선되었다. 한편 주요 용도별 요금 개편에 의한 판매 단가 인하 효과가 Q 증가를 상쇄하며 전체적인 판가는 약세 흐름을 이어갔다.\n\n---\n\n### 8월 ESS Battery : 북미 누적 +22% 성장\n\n8월 글로벌 ESS 케미스트리별 신규 설치 비중은 LFP 94.1%(MoM 1.3%p), NCM 2.8%(MoM -0.3%p), Flow Battery 0.6%(MoM -0.7%p), Sodium based 0.3%(MoM 0%p), 기타 2.1%(MoM -0.2%p)\n\n---\n\n### 디지털 자산 Daily: 근원 CPI 상회에 8 만 2 천 달러 하회\n\n근원 소비자물가가 시장 예상을 웃돌며 금리 인상 우려가 되살아나 비트코인이 8 만 2 천 달러를 밑돌았다. 나스닥 하락과 변동성 지수 급등이 겹치며 위험자산 전반이 동반 약세를 보였다.\n\n---\n\n### 사이버 보안: AI에 의한 재편된 사이버 환경\n\n시스코는 전세계 보안 리더 8,000명을 대상으로 AI에 의해 재편되고 있는 사이버 환경에 대해 어떻게 대응한지 조사했다. 전 세계 기업의 사이버 역량 평균은 100점 만점에 64점인 반면, 한국은 58점으로 평균을 하회한다고 밝혔다. 사이버 보안 및 강화 필요성과 관련된 내용은 다음과 같다. 첫째, 조사에 참여한 보안 리더의 91%는 지난 1년간 최소 한 차례 이상 실질적인 피해나 업무 차질을 초래한 사이버보안 사고를 경험했으며, 이중 35%는 AI와 관련된 공격이 포함된 사고라고 밝혔다. 둘째, 전체중 14%만이 새로운 위협 탐지시 보안 통제 정책을 실시간으로 업데이트 가능하며, 26%는 24시간이내에 업데이트가 가능하다. 즉, 전체의 60%가 새로운 위협이 발생해도 보안 통제 체계를 업데이트 하는데 하루 이상의 시간이 소요된다는 것을 의미, 신속한 대응이 어렵다는 것을 의미한다. 셋째, AI 에이전트 또는 자율형 시스템을 탐지하고 대응할 수 있는 역량에 대한 질문에 자신감을 보인 기업은 54%였다.\n\n---\n\n### 로봇 규제개선 & 정책지원 구체화\n\n10월 13일, 산업부는 2026년 제6차 산업융합 규제특례심의위원회를 개최해 AI・로봇・에너지 등 산업융합 규제 특례 안건을 심의하고 제조 인공지능 전환 분야 규제 개선 방안을 논의했다. 실증특례는 기존 범령에 규제가 있거나 관련 규정이 불명확해 신기술/신제품/서비스를 사업화가 어려운 경우, 일정한 조건 아래 실제 환경에서 시험/검증할 수 있도록 규제를 한시적으로 완화하거나 적용하지 않는 제도이다. 규제샌드박스 제도에는 실증특례, 임시허가, 신속확인 등이 있다. 로봇과 관련된 사항은 다음과 같다. 첫째, 4족보행 로봇의 보행자 도로 순찰을 최초로 허용하는 실증특례를 승인했다. 마음AI는 천안시 일대 하천변 산책로와 공원에서 자율주행 4족 보행 순찰로봇을 실증 운행할 예정이다. 해당 로봇은 AI로 주변 상황을 실시간 분석, 위기 상황 발생시 대피 안내 방송을 송출, 현장 영상정보를 관제시스템으로 즉각 전송해 신속한 초기 대응을 지원한다. 기존 바퀴형 순찰로봇이 진입하기 어려웠던 계단・경사로와 CCTV 사각지대가지 순찰 범위를 대폭 확대, 도시 안전망을 지원할 것으로 기대된다.\n\n---\n\n### FINFET VS. GAA\n\nFINFET(Fin Field-effect transistor)은 gate와 channel과의 contact area가 클수록 efficiency가 상승한다. fin height가 높을수록 gate가 control 가능한 channel area가 증가, large current가 필요한 transistor의 경우 fin number increase, gate control ↑, leakage ↓, short channel effect ↓, low voltage driving → performance improvement and power reduction and miniaturization possible. 4nm 이후 process에서는 limit이 대두된다.\n\n---\n\n### 한국 GW급 데이터센터 현실성은?\n\n통신주가 데이터센터 관련주로 재평가될 가능성에 주목하고 있으나 시장(특히 외국인투자자)은 실행 가능성에 의문 제기를 하고 있다. 글로벌 사업자와 장기 계약을 체결하기 전까지는, 주가 상승 폭이 컸던 SK텔레콤은 AI 투자심리에 따라 변동성이 확대되고 KT/LG유플러스는 제한적인 움직임을 보이는 패턴이 지속될 전망이다.\n\n---\n\n### 한국 GW급 데이터센터 현실성은?\n\n통신주가 데이터센터 관련주로 재평가될 가능성에 주목하고 있으나 시장(특히 외국인투자자)은 실행 가능성에 의문 제기를 하고 있다. 글로벌 사업자와 장기 계약을 체결하기 전까지는, 주가 상승 폭이 컸던 SK텔레콤은 AI 투자심리에 따라 변동성이 확대되고 KT/LG유플러스는 제한적인 움직임을 보이는 패턴이 지속될 전망이다.\n\n---\n\n### K뷰티, 이제 공장을 수출하다\n\n2026년 상반기 한국 화장품은 북미로 약 7만톤, 유럽으로 약 5만톤이 나갔다. 무게로는 북미가 42.6% 더 많다. 그런데 금액은 거꾸로였다. 유럽이 15.2억달러로 북미(14.9억달러)를 처음 앞섰다. kg당 단가로 따지면 유럽 30.7달러, 북미 21.1 달러로 유럽이 46% 비싸다. 마스크팩과 저가 색조로 시작한 K뷰티가 이제 세럼·암풀·크림 같은 고단가 기초 제품으로 유럽 매대를 채우고 있다는 뜻이다. 실제로 유럽 수출의 48.1%가 기초화장품이었다.\n\n---\n\n### 소비심리와 실적의 괴리, 눈높이 조정 필요\n\n3Q26 유통업종 실적 기대치 하회 전망. 소비심리는 긍정적이나 높아진 눈 높이, 7월 이후 자산가격 조정, 금리 상승으로 대부분의 업태가 기대치 대비 부진. 다만 실적 부진은 이미 주가에 반영돼 밸류에이션 부담 완화(12개월 선행 PER 8배). 연말 쇼핑 시즌 실적 모멘텀 반등할 백화점 선호 의견 유지. 업종 내 최선호주는 신세계. 주요 대형점포 리뉴얼 효과가 실적에 기여. 경쟁사 대비 높은 명품 매출 비중으로 외형 성장이 가장 강한 가운데, 효율적인 투자 집행으로 감가상각비 증가율도 둔화돼 영업이익 개선(+30%) 전망.\n\n---\n\n### 보험 업종 투자 매력도 점검\n\n실적 / 금리 / 규제의 삼박자가 만들어낸 주가 상승 지난 3 분기 보험주의 주가 수익률이 시장보다 상대적으로 좋은 모습을 보였는데, 그 배경에는 실적, 금리, 규제 등의 요인이 있었다. 올해 상반기 보험사들의 실적은 대부분 전년대비 높은 성장률을 보이며 기대치를 상회했는데, 계리 관련 일회성 비용의 반영이 줄어든 영향이다. 또한, 작년 말부터 시중금리는 급격히 상승하고 있는 상황에서 고금리가 증시 하락의 원인으로 작용하자 방어주이자 금리 상승 수혜주인 보험주는 상대적으로 수급이 우호적으로 작용했다. 규제의 경우, 다수 보험사들의 배당 불가 원인인 해약환급금준비금 제도 개선과 더불어 실손보험 개혁 등의 긍정적인 영향에 대한 기대감이 보험주 투심을 자극했다.\n\n---\n\n### 보험 손익 양호, 투자 손익 부진\n\n관리급여 효과 첫 확인, 경상 보험이익 체력으로 선별 2분기 일회성 환입 소멸과 투자손익 부진으로 3분기 실적 기대감 낮아지는 국면. 계절성 및 연말 유병자보험 계리가정 가이드라인 추가 반영 고려 시 4분기 실적 모멘텀 소멸. 금리 상승 속 소극적 장기채 매수로 실질 수혜 제한적인 가운데 해약환급금준비금 제도 변경 기대감 축소로 배당 재개 기대주의 상대 매력 약화. 배당 여력을 갖추고 배당성향의 지속적 상향이 기대되는 삼성화재와 DB손해보험을 최선호주로 제시.\n\n---\n\n### 업황이 좋지 않은 이유 (중국 OEM 외연 확대가 가져온 나비효과)\n\n26.3Q Preview: production ↓ exchange rate ↓ overview: 양사간 상반된 업황이 직전 분기에 이어서 관찰됨- 26.3Q domestic automobile sector results first topic is sales volume decrease. Hyundai's wholesale sales for the second quarter of this year were 918,660 units (-11.5YoY), Kia's wholesale sales in 26.3Q were 844,988 units (+7.8 YoY)- For Hyundai, the impact from the fire at the Safety Engineering plant last quarter has partially remained, as well as about 55,000 units affected by a strike. Additionally, there was a continued weakening due to insufficient competitiveness with regard to EV products in Europe.- For Kia, wholesale sales have grown slightly compared to the same period last year in key markets such as North America, Europe, India, etc., excluding other regions like Middle East and China. However, even so, the growth in external scale does not seem significant enough given the high proportion of EVs sold.\n\n---\n\n### 윤활기유의 시대\n\n정유사를 분해할 시간 2026년 정유 섹터의 이익을 가른 변수는 정제마진이 아니라 윤활 부문이었다. 국내 정유 4사의 2분기 윤활 부문 영업이익은 합산 약 1.7조원, 영업이익률은 35~52%에 달했다. 원유 처리능력 대비 3~6%에 불과한 설비가 전사 손익의 방향을 바꾼 것이다. 당사는 이 이익의 상당 부분이 일회성 공급 충격에서 비롯됐다는 점을 인정한다. 그러나 충격이 지나간 뒤에도 남는 몫, 즉 진입장벽과 계약 구조가 만드는 구조적 이익이 시장의 평가보다 크다고 판단한다. 그 근거는 공급, 복구 시간, 한국의 지위, 밸류에이션이라는 네 개의 층위에서 맞물려 있다.\n\n첫째, 그룹III 공급은 가격으로 풀리지 않는다. 이번 공백은 카타르 Pearl GTL, 아부다비 ADNOC Ruwais, 바레인 Bapco Sitra라는 중동 3대 거점이 동시에 이탈하면서 생겼고, 이를 대체할 설비는 세계 어디에도 없다. 신규 그룹III 설비의 리드타임은 3~4년이며, 완성차 제조사(OEM)의 승인 체계와 API 규격은 블렌더가 원가를 아끼려고 그룹II로 내려가는 길을 막고 있다. 시장은 가격을 올려도 물량이 나오지 않는 완전 비탄력 구간에 들어섰다.\n\n둘째, 공급의 복구는 휴전보다 훨씬 느리다. 설비 복구, 품질 안정화, 해상 운송, 유통재고 재축적은 병렬이 아니라 연속적으로 진행되며 각 단계가 순차적으로 시간을 소비한다. 업계는 2027년 상반기에도 그룹III 생산이 평년 대비 약 12% 부족할 것으로 본다. 이는 정상화가 아니라 심각한 부족에서 만성적 부족으로 옮겨가는 과정이다.\n\n셋째, 한국은 이 국면에서 생산과 인도를 동시에 이어갈 수 있는 사실상 유일한 대규모 공급원이다. 한국은 세계 고부가 그룹III 생산의 약 40%를 담당하는 것으로 알려져 있고, 수출 항로가 호르무즈 해협을 지나지 않는다. 2026년 한국 정유사의 가격결정력은 명목 생산능력이 아니라 이 인도 가능성에서 나왔으며, 지금은 그 프리미엄이 장기계약으로 옮겨가는 단계다.\n\n넷째, 밸류에이션의 기준은 피크가 아니라 피크 이후여야 한다. 2027년 정상화 EBITDA에 전통 정유(5~6배)와 세계 특수유체(9~10배) 사이의 차등 배수(6~9배)를 적용하면 국내 정유 4사의 윤활기유 사업가치는 합산 약 34~38조원이다. 정상화 이익에서 구조 프리미엄을 모두 걷어내고 정유 수준의 배수를 적용하는 약세 시나리오에서도, S-Oil의 윤활 가치(약 5.8조원)는 현 주가에 내재된 수준(약 3.4조원)을 웃돈다.\n\n투자 전략으로는 SK이노베이션과 S-Oil을 Top Picks로 제시하며, 두 회사 모두 목표주가를 210,000원으로 상향한다. S-Oil은 윤활 이익이 상장사 실적에 직접 드러나 재평가 경로가 가장 짧다. 정유/석화와 윤활을 나눠 평가한 SOTP 기준 적정가치는 주당 약 213,000원이며, 현 주가는 윤활 사업에 정유 수준 이하의 배수(3~5배)만 매기고 있다. SK이노베이션은 SK엔무브의 윤활 사업가치(14.6~16.5조원)가 현 시가총액의 56~64%에 이른다. 그룹III 표준 지위와 특수유체 확장성을 감안하면, 윤활 가치의 재평가는 전사 재무 부담 완화로 이어질 수 있다.\n\n---\n\n### AI 개발과 채용, 그리고 로봇의 확장\n\n게임업계의 인공지능(AI) 활용 범위가 게임 개발 과정의 일부 자동화를 넘어 조직과 채용, 개발 도구, 신규 사업으로 확대되고 있다. 에픽게임즈는 개발 인력을 AI 활용 중심으로 재배치하고 제작 방식 전환에 착수했으며, 크래프톤은 AI 활용 역량을 갖춘 신입을 역대 최대 규모로 채용하면서 전 직군의 업무 방식을 재편하고 있다. \n\n---\n\n### AI 개발과 채용, 그리고 로봇의 확장\n\n게임업계의 인공지능(AI) 활용 범위가 게임 개발 과정의 일부 자동화를 넘어 조직과 채용, 개발 도구, 신규 사업으로 확대되고 있다. 에픽게임즈는 개발 인력을 AI 활용 중심으로 재배치하고 제작 방식 전환에 착수했으며, 크래프톤은 AI 활용 역량을 갖춘 신입을 역대 최대 규모로 채용하면서 전 직군의 업무 방식을 재편하고 있다. \n\n---\n\n### AI 개발과 채용, 그리고 로봇의 확장\n\n게임업계의 인공지능(AI) 활용 범위가 게임 개발 과정의 일부 자동화를 넘어 조직과 채용, 개발 도구, 신규 사업으로 확대되고 있다. 에픽게임즈는 개발 인력을 AI 활용 중심으로 재배치하고 제작 방식 전환에 착수했으며, 크래프톤은 AI 활용 역량을 갖춘 신입을 역대 최대 규모로 채용하면서 전 직군의 업무 방식을 재편하고 있다. \n\n---\n\n### AI 개발과 채용, 그리고 로봇의 확장\n\n게임업계의 인공지능(AI) 활용 범위가 게임 개발 과정의 일부 자동화를 넘어 조직과 채용, 개발 도구, 신규 사업으로 확대되고 있다. 에픽게임즈는 개발 인력을 AI 활용 중심으로 재배치하고 제작 방식 전환에 착수했으며, 크래프톤  실적이 상회했음에도 불구하고 셀롱 매물이 나오는 이유는 여기에 있지 않다.\n\n- **시스템 수준**: ASML은 AI 밸류체인 내부의 단일 컴포넌트다. 4Q 가이던스 상향과 별개로, AI 투자 수익성에 대한 불확실성이 시장을 덮쳤다. iM증권이 지적한 것처럼, 가트너의 보고서는 AI 인프라 투자액 7T$를 전망했지만, 해당 투자로부터 실제로 생성되는 데이터센터 발 AI 매출은 3.6T$로 추정했다. 3.4T$ 이상의 투자는 손실에 직결될 수 있다는 논란이다.\n\n이건 AI 밸류체인 내부의 이중 구조를 드러낸다. Capex 주도의 이익 집중(ASML 등 하드웨어 기업)은 이미 수렴했다. 앞으로 AI 모델(LLM/MaaS)과 응용(Application)이 이익을 만들어내는 구조로 이동할 때, 그 이득이 클라우드/모델/앱 업체들에게 어떻게 귀속될지가 핵심이다. ASML의 실적은 EUV 수요가 있으므로 \"Capex 사이클의 이익은 살아있다\"를 보여줬다. 그러나 이 수요가 실제로 모델과 응용으로 이어져 수익화되면, Capex 주도주들과 응용 주도주들 사이의 밸류에이션 구조가 재편된다.\n\n> 참고: 신한투자증권은 China AI 50 유니버스를 8개 섹터(AI 반도체, 광통신·네트워크, AI 서버·부품, 전력·열관리, IDC·CSP, AI 모델, AI Application, Physical AI)로 구분해 실적 개선의 시차와 귀속을 추적하고 있다.\n\n---\n\n### III. 중국 AI 데이터센터: 24GW, 미국의 절반에 불과하다\n\nSemiAnalysis는 9월 60개 이상의 사업자와 1,000개 이상 시설을 개별 추적해 다음과 결론냈다.\n\n- 2026년 말 중국 데이터센터 용량은 24GW 이상으로 추산. 미국(56GW)의 절반, 아시아(15GW), EMEA(14GW)를 웃돈다.\n\n#### 3.1 왜 24GW가 문제가 되는가?\n미국은 처음부터 하이퍼스케일 중심의 순수 대형 인프라 비중이 압도적으로 높다. 중국은 인터넷 서비스, 온라인 게임, 일반 클라우드용 레거시 인프라와 소매형(Retail-First) 데이터센터 재고를 포함한다. 최근 AI 수요에 맞춰 일부 시설이 고전력·고밀도로 개조되고 있지만, 미국 고성능 칩의 수입 제한과 국산 칩의 낮은 전력당 성능을 감안하면 같은 GW라도 AI 연산력은 미국보다 낮다고 보는 것이 합리적이다.\n\n즉, 중국의 24GW는 미국의 56GW를 \"정확하게 반으로 줄인\" 수치가 아니라, **기술적·구조적 차이를 감안했을 때 미국의 절반 정도에 해당한다고 해석되어야 한다**.\n\n---\n\n### IV. 메모리 반도체: 중국 CXMT의 DDR5 서버 메모리 출시\n\n중국 CXMT는 차세대 D램 기술을 적용한 서버용 DDR5 메모리를 2026년 연말에 출시하겠다고 발표했다. 이는 메모리 업계에 충격으로 작용한다. 메모리 반도체의 시장 점유 확대 가능성은 국내를 포함한 글로벌 AI 밸류체인 전반에 충격으로 작용 중이다(iM증권).\n\n#### 4.1 메모리 ETF 자금 유출과 빅테크 자금 유입의 역학\n\niM증권은 다음과 같은 역학을 설명한다.\n\n- 메모리 ETF에서는 이미 2개월 째 자금이 유출되고 있다.\n- 반대로 메모리 비용 폭등의 최대 피해자인 빅테크로의 자금 유입 폭은 확대되고 있다.\n\nAI Capex 수혜주에서 AI 활용으로 넘어가는 시장의 시선이 이 자금 흐름을 설명한다. 경쟁력 있는 AI 모델 출시로 빅테크 등 AI 수익화 가능성이 부각되고 있다. AI 토큰 지출단가 하락은 AI Capex 수혜주에겐 투자 지속성 우려로 연결되고, AI 활용기업에겐 기회로 작용한다.\n\n---\n\n### V. 토큰화 이후의 금융: 기관 중심의 재편\n\nEastPoint, KBW, TOKEN2049 등 9월 말부터 10월 초까지 서울과 싱가포르에서 주요 디지털자산 컨퍼런스가 열렸다. 기관 참여가 확대되면서 자본시장의 온체인 전환과 기관용 금융 인프라가 주요 의제로 부상했다.\n\n#### 5.1 핵심 논의: RWA와 토큰화\n\n핵심 화두는 기존 금융자산의 토큰화와 이를 투자·담보·결제에 활용하는 방안이다. 지난해 스테이블코인이 자금 이동의 기반으로 주목받았다. 올해는 RWA를 통해 투자상품과 금융서비스를 확대하는 흐름이다. 금융기관의 관심은 고객 접근성 확대와 자금 운용 효율 개선 등의 기존 사업의 경쟁력을 높이는 방향으로 구체화된다.\n\n토큰화 주식 규모가 스테이블코인 공급량의 1%를 넘어서면서, 온체인 현금성 자산에 비해 주식 투자상품의 상대 규모가 커지고 있다. 실제 데이터가 이 흐름을 뒷받침한다.\n\n---\n\n### VI. 중국 AI 밸류체인의 이익 귀속 변화: 2027년 미리보기\n\n신한투자증권은 2027년 중국 AI 밸류체인의 이익 귀속 변화를 중국 A주와 홍콩 시장에 분산 상장된 핵심 기업들을 대상으로 분석한다. 산업 대표성과 AI 사업 연관성, 밸류체인 내 역할, 실적 컨센서스 확보 여부를 고려해 50개 기업으로 구성된 China AI 50 유니버스를 구축했다.\n\n#### 6.1 8개 섹터: 하드웨어→클라우드·모델·앱의 이득 귀속\n\n- **AI 반도체, 광통신·네트워크, AI 서버·부품, 전력·열관리, IDC·CSP**: AI 투자 사이클은 Capex가 주도했다. 반도체, 서버, 광통신 등 하드웨어 기업이 직접적인 수혜를 누렸다.\n- **AI 모델(LLM·MaaS), AI Application, Physical AI**: 이제는 AI 투자가 실제 매출과 이익으로 연결되는지 확인할 시점이다. AI 사이클의 지속 가능성과 밸류체인 내 이익 귀속 구조의 변화, 주식시장 주도력 확산 여부가 핵심 변수다.\n\n---\n\n### VII. 주요 컨퍼런스 리뷰: Tokenization After the Return of Institutional Investors\n\nKBW, TOKEN2049, EastPoint 등의 컨퍼런스에서 기관 중심의 디지털자산 컨퍼런스가 열렸다.\n\n#### 7.1 기관의 참여 확대와 자본시장의 온체인 전환\n\n- 주식 토큰화의 글로벌 접근성, 24시간 거래, 결제시간 단축에 관심이 집중됨.\n- OKX·ICE는 토큰화 자산 플랫폼을 발표했으며, Nasdaq·Payward도 토큰화 주식의 유통·거래·결제 기능 구축을 추진.\n- 국내에서는 카카오페이증권이 Ondo·Dinari와 한국 상장주식의 해외 유통 및 토큰화 인프라 검토를 위한 협력을 발표.\n\n---\n\n### VIII. 중국 AI 밸류체인의 이익 귀속 변화: 2027년 미리보기\n\n신한투자증권은 2027년 중국 AI 밸류체인의 이익 귀속 변화를 중국 A주와 홍콩 시장에 분산 상장된 핵심 기업들을 대상으로 분석한다. 산업 대표성과 AI 사업 연관성, 밸류체인 내 역할, 실적 컨센서스 확보 여부를 고려해 50개 기업으로 구성된 China AI 50 유니버스를 구축했다.\n\n---\n\n### IX. 주요 컨퍼런스 리뷰: Tokenization After the Return of Institutional Investors\n\nKBW, TOKEN2049, EastPoint 등의 컨퍼런스에서 기관 중심의 디지털자산 컨퍼런스가 열렸다.\n\n---\n\n### X. 주요 컨퍼런스 리뷰: Tokenization After the Return of Institutional Investors\n\nKBW, TOKEN2049, EastPoint 등의 컨퍼런스에서 기관 중심의 디지털자산 컨퍼런스가 열렸다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n프랑스 재정 불안, 미국 CPI 상승, 에너지 가격 급등, 외국인 한국 주식 대량 매도, AI 투자 심리 하락, 코스피·코스닥 하락 등이 오늘 주요 쟁점으로 등장했다. 미국 CPI가 전년 대비 3.7% 상승하며 물가 상승 압력이 지속되고 있고, 에너지 가격 상승이 헤드라인 CPI 상승의 주요 원인이다. 외국인의 한국 주식 대량 매도는 한국 시장에 대한 투자 심리 부진을 반영하며, 이는 코스피·코스닥의 하락으로 이어졌다. AI 투자 지속 가능성에 대한 우려와 반도체 수요 감소도 시장 하락에 기여했다. 이러한 요소들은 미국 연준의 금리 결정과 글로벌 시장 흐름에 직접적인 영향을 미칠 수 있다."}]}</script>
