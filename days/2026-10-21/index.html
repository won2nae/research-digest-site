.29%)로 급등했다. 이는 외국인과 기관의 동반 매도를 배경으로 한 것으로 보이며, 동시에 개인이 순매수한 것으로 이뤄졌다. 그러나 이러한 상승은 오히려 코스피 지수의 전체적인 흐름과 다르게 진행되었다.\n\n#### ▶ 코스피 지수가 아닌 왜 코스피 지수가 중요한가?\niM증권은 다음과 같이 설명한다:\n\n> \"코스피 지수가 큰 폭의 조정을 보이고 있는 가운데 달러-원 환율은 1,326원까지 하락했다.\"\n\n즉, 외환시장이 반도체 수출호황을 기대하고 있는 상태인데도, 코스피 지수가 그러한 기대를 전혀 반영하지 않고 있다. 이것은 왜일까?\n\n#### ▶ AI 사이클의 영향이 무엇인지 살펴보자\n\nAI 사이클은 다음 두 가지 차원에서 중요하다:\n\n1. **업종별 영향**\n   - 반도체는 물론 AI 스택 전체에 걸쳐 필요한 부품이 다양하다. GPU(그래픽 처리 장치), ASIC(특수 목적 집적회로), 패브릭(Fabric) 등의 구성 요소가 모두 포함되기 때문이다. 따라서 AI 수요 증가는 해당 부품들의 생산량 증가로 이어지고, 그 결과로 반도체와 관련된 모든 제품군의 판매가 함께 증가한다.\n\n2. **글로벌 경쟁 구도 변화**\n   - 중국이나 일본, 유럽이 AI 개발을 위한 자원을 확보하기 위해 다양한 프로젝트를 추진하고 있다. 그만큼 경쟁이 치열하다는 것을 알 수 있다. 따라서 AI 개발이 이루어져도 특정 지역 또는 나라에서만 가능한 것이 아니며, 다양한 국가들이 참여하여 경쟁을 형성하고 있다.\n\n#### ▶ 국내 반도체 수출호황이 지속될 수 있는 이유\n\niM증권은 다음과 같은 사실을 들어 국내 반도체 수출호황이 계속 될 수 있다는 의견을 밝혔다:\n\n- 2026년 경상수지를 4,500억 달러 수준으로 전망했다.\n- 2027년 경상수지도 4,090억 달러 수준으로 전망했다.\n- 이는 국내 경제 펀더멘탈 측면에서 원화 강세 기조를 뒷받침해주고 있다는 의미이다.\n\n따라서 iM증권은 \"국내 반도체 수출호황 사이클 지속 가능성을 염두에 두고 있는 듯한 모습\"이라 표현했다. 다시 말하면, 국내 반도체 수출호황이 계속 되어야 하는데, 현재의 상황은 그렇지 않다는 것을 보여주는 것 같다.\n\n### ③ 국내 반도체 수출호황 사이클 지속 가능성\n\niM증권은 다음과 같은 사실을 들어 국내 반도체 수출호황이 계속 될 수 있다는 의견을 밝혔다:\n\n- 2026년 경상수지를 4,500억 달러 수준으로 전망했다.\n- 2027년 경상수지도 4,090억 달러 수준으로 전망했다.\n- 이는 국내 경제 펀더멘탈 측면에서 원화 강세 기조를 뒷받침해주고 있다는 의미이다.\n\n따라서 iM증권은 \"국내 반도체 수출호황 사이클 지속 가능성을 염두에 두고 있는 듯한 모습\"이라 표현했다. 다시 말하면, 국내 반도체 수출호황이 계속 되어야 하는데, 현재의 상황은 그렇지 않다는 것을 보여주는 것 같다.\n\n### ④ 코스피 지수가 반도체 수출호황을 반영하지 않는 이유\n\niM증권은 다음과 같은 사실을 들어 국내 반도체 수출호황이 계속 될 수 있다는 의견을 밝혔다:\n\n- 2026년 경상수지를 4,500억 달러 수준으로 전망했다.\n- 2027년 경상수지도 4,090억 달러 수준으로 전망했다.\n- 이는 국내 경제 펀더멘탈 측면에서 원화 강세 기조를 뒷받침해주고 있다는 의미이다.\n\n따라서 iM증권은 \"국내 반도체 수출호황 사이클 지속 가능성을 염두에 두고 있는 듯한 모습\"이라 표현했다. 다시 말하면, 국내 반도체 수출호황이 계속 되어야 하는데, 현재의 상황은 그렇지 않다는 것을 보여주는 것 같다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권\n\n### #1 금통위: 매파적 동결 vs 소수의견으로 인한 인상 가능성을 동시에 묶는 시그널\n### ▲ 매파적 동결 전망\n10월 금통위에서는 기준금리를 3.00%에서 동결할 전망이며, 기준금리 인상 소수의견은 1~2인으로 예상된다. 연도말 기준금리는 2026년말 3.00%, 2027년말 3.00%로 전망하며, 2027년 상반기에 기준금리를 인상하고, 연말 기준금리를 인하하는 경로를 따를 것으로 예상된다. 그러나 10월 금통위에서 기준금리를 인상하는 소수의견이 등장할 경우, 연내 추가인상보다는 커뮤니케이션 채널을 활용하여 외환시장 안정화에 초점을 맞춘다는 점에서 중요하다. \n\n### ▲ 외환시장 변동성에 대한 한계수요 버퍼 역할\n외환시장에서 발생하는 변동성과 금융안정 측면을 고려했을 때, 금통위원들의 의견이 분岐될 가능성이 있으며 특히 장용성 위원의 소수의견이 등장할 경우 외환시장 안정화에 기여할 수 있다. 이러한 소수의견은 외환시장이 임계점을 넘을 때 '반대세력'으로 기능할 수 있는 신뢰를 유지하는 데 필수적이며, 해당 시그널은 시장 참가자의 행동변화를 현재 조건부로 유도하는 중요한 요소로 작용할 수 있다.\n\n### ▲ 미래 금통위원장 후보들과의 연결고리\n2027년 상반기에 기준금리를 인상한다는 계획이 있지만, 이를 위해서는 먼저 외환시장 안정화가 이루어져야 한다. 이는 현재의 금통위원장 후보들에게도 중요한 문제가 된다. 만약 기존의 금통위원회 구성원들이 2027년 상반기에 기준금리를 인상하겠다는 의지를 가지고 있다면, 외환시장 안정화를 위해 새로운 금통위원장 후보들과 협력해야 할 수도 있다. 하지만 만약 기존 금통위원회 구성원들이 외환시장 안정화에 더 많은 책임을 요구한다면, 새롭게 참여할 금통위원장 후보들도 해당 문제에 대한 입장을 명확히 해야 할 것이다.\n\n### △ 관련 리포트\n- 한화투자증권은 \"10월 금통위, 인상 소수의견 있는 기준금리 동결 전망\"이라고 발표하였다.\n- IBK투자증권은 \"2026년 10월 금통위 통화정책방향 결정회의에서 기준금리를 3.00%에서 동결할 전망이다.\"라고 밝혔으며, \"기준금리 인상 소수의견은 1~2인으로 예상한다.\"라고 언급하였다.\n- 하나증권은 \"11월 점도표에는 중간값이 3.25%에서 3.50%로 상향 조정되고, 3.75%에도 점이 최소 3개 이상 등장할 것으로 예상\"한다고 주장하였다.\n\n### #2 단기물 금리 상승: 은행권의 시중자금 흡수가 유동성프리미엄을 확대시키는 배경\n### ▲ 단기금리 상승 배경\n최근 단기금리 상승의 주된 원인은 은행권의 시중자금 흡수에 따른 유동성프리미엄의 확대였다. 은행이 시중에서 자금을 흡수하는 행위 자체는 유동성프리미엄을 확대시키는 요인으로 작용한다. 특히, 단기간에 대규모의 자금 흡수가 이루어질 경우에는 금리 상승 압력이 더욱 커질 수 있다.\n\n### ▲ 단기물의 특징\n단기물의 경우 만기가 짧기 때문에 장기물에 비해 유동성리스크부담이 크지 않다. 그러나 단기물을 이용하여 금리를 설정할 때에는 '수급부담에 따른 프리미엄이 확대되었다'라고 표현하는 것이 더 적절하다. 이러한 수급부담은 단기물의 특성상 자연스럽게 발생할 수 있으며, 또한 단기물의 가격은 금리와 반대로 움직인다.\n\n### ▲ 단기물 금리 상승에 대한 시장의 반응\n단기물 금리 상승에 대한 시장의 반응은 매우 다양하다. 일부 투자자는 단기물 금리 상승을 긍정적으로 받아들일 수 있으며, 다른 투자자는 오히려 부정적인 태도를 취할 수도 있다. 단기물 금리 상승에 대한 시장의 반응은 결국 투자자 개인마다 다르므로, 이러한 차이는 단기물 금리 상승을 이해하는 데 있어 반드시 고려해야 할 변수이다.\n\n### △ 관련 리포트\n- 하나증권은 \"은행권의 시중자금 흡수에 따른 유동성프리미엄의 확대가 작용하고 있다고 진단한 바 있다.\"라고 밝혔다.\n- 유안타증권은 \"간밤 미국 금리 상승을 반영해 약세로 출발했으나 반도체주 중심의 국내 증시 급락으로 안전자산 선호가 강화되며 강세 전환, 외국인 국채선물 순매수도 가세해 중단기물 중심으로 금리 하락폭 확대.\"라고 설명하였다.\n- 유진투자증권은 \"간밤 프랑스 대규모 시위 등으로 유럽, 미국 금리 상승 여파로 국내 금리도 상승 출발, 이후 아시아 장에서의 미국 금리 소폭 하락, 주식시장 부진 등에 따라 금리 하락 전환했음.\"이라고 밝혔다.\n\n### #3 하이일드(HY) 아닌 하이센서티브(High-sensitive): 단기 및 초우량물에서 신용시장 시그널을 찾자\n### ▲ HY의 한계\nHY의 한계는 주로 다음과 같다. 첫째, 국내외 시장 간 상관성이 높지 않다는 점이다. 이는 HY의 가치가 국제적인 상황에 직接受影響 받는다는 의미이다. 둘째, 국내 하위등급채권의 경우 가격지표의 현실성이 많이 떨어진다는 점이다. 즉, HY의 실질적 가치는 실제 가격보다 낮을 수 있다는 의미이다. 이러한 한계는 HY의 사용을 어렵게 만들기도 한다.\n\n### ▲ 하이센서티브(High-sensitivity)의 중요성\n하이센서티브(High-sensitivity)의 중요성은 단기 및 초우량물에서 신청시장 시그널을 쉽게 발견할 수 있다는 점에서 크다. 단기 및 초우량물은 일반적인 금리 변화에도 민감하게 반응하는 경향이 있다. 이러한 특성은 신청시장의 작은 변화를 쉽게 포착할 수 있도록 해 준다. 따라서 단기 및 초우량물은 신청시장 시그널을 쉽게 발견할 수 있는 좋은 지표이다.\n\n### ▲ HY의 한계와 하이센서티브의 중요성의 관계\nHY의 한계와 하이센서티브의 중요성은 서로 밀접하게 연결되어 있다. HY의 한계는 단기 및 초우량물에서 신청시장 시그널을 쉽게 발견할 수 있다는 점에서 하이센서티브의 중요성을 증대시킨다. 반대로 하이센서티브의 중요성은 HY의 한계를 완화할 수 있는 또 다른 방식으로 작용한다. HY의 한계와 하이센서티브의 중요성은 서로 상호보완적인 관계이다.\n\n### △ 관련 리포트\n- 하나증권은 \"국내 하위등급채권의 경우 가격지표의 현실성이 많이 떨어진다는 점 등은 감안해서 보아야 할 것이다.\"라고 밝혔다.\n- 유안타증권은 \"국내 증시 급락으로 안전자산 선호가 강화되며 강세 전환, 외국인 국채선물 순매수도 가세해 중단기물 중심으로 금리 하락폭 확대.\"라고 설명하였다.\n- 유진투자증권은 \"주식시장 부진 등에 따라 금리 하락 전환했음.\"이라고 밝혔다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n### 1. AI 데이터센터: 구조적 성장 vs. 단기 리스크\n\n### 구조적 성장의 필연성과 구체적 수치\nAI 데이터센터 시장의 중장기 성장 방향성은 명확하다. 단순히 테마성 접근보다는 **현실적 AI 데이터센터 물량**(즉, 물리적 인프라 구축 가능성이 실제로 반영된 수치)을 보면 1.5GW로 판단된다. 이 중 국내 수요는 1GW로 추정되며, 나머지 0.5GW는 글로벌 AI 워크로드 유입이 필요하다([신한투자증권](https://www.shinhan.com/research/view.do?idx=11477)).\n\n#### 구체적 프로젝트 현황\n- 울산: 초기 0.1GW\n- 동해: 1단계 1.2GW\n- 네이버: 0.2GW  \n이 3곳의 합산이 1.5GW를 차지하며, 전력공급 구조가 이미 구체화된 상태다. 여기서 **한전의 대규모 신규 공용망 투자 의존도가 낮다**, 기존 발전원·접속경로와 임차시설을 활용한다는 점이 핵심 ([신한투자증권](https://www.shinhan.com/research/view.do?idx=11477)).\n\n#### 후속 투자: 전력망 보강이 핵심\n후속 AI데이터센터 사업들은 한전의 투자여력과 설비 준공 일정이 확장 속도의 주요 변수가 될 전망이다. \n- 2027년 한전 사채발행한도가 2배로 복귀하는 28년부터 **투자비가 투자재원을 초과**할 것으로 추정됨에 따라,\n    - 한전의 사채발행 한도 특례 연장\n    - 정부 지원\n    - 민간 참여 확대 여부를 주시해야 한다 ([신한투자증권](https://www.shinhan.com/research/view.do?idx=11477))\n\n> 🔺 참고: 2026년 10월 14일 교보증권은 \"글로벌 AI 인프라 기업을 중심으로 신용위험이 빠르게 확대되고 있다\"고 분석했으나, 당시 코어위브의 CDS 프리미엄이 1,100bp를 상회하고 있었던 것을 배경으로 했음. 당시 오라클의 CDS도 300bp에 근접했다.\n\n---\n\n### 2. 방산: 주가 급락은 근거 없는 하락, 극단적 우려는 과거와 역사적 근거로 반박\n\n### 극단적 우려: 미국 방위비 감소 → 국내 방산주 하락\n과거에도 다수당과 무관하게 방위비 지출이 증가했다. 1950-1960년 한국, 베트남 전쟁, 2007-2010 아프간・이라크 전쟁, 2021-2022 우크라이나 전쟁 시기도 모두 **민주당이 다수당이었던 시기**였다. 그리고 **미국의 방위비 분담은 초당적 합의 사항**이다. 설령 감소한다고 해도, 미국의 자주포 및 장약 사업은 정권과 무관하게 계속될 예정이다 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n### 주가 급락: 단기적 리스크, 극단적 우려는 과거와 역사적 근거로 반박\n10/20 한화에어로스페이스(-12.5%), LIG D&A(-9.2%), 한화시스템(-15.1%), 한국항공우주(-7.3%), 현대로템(-15.3%)으로 글로벌 방위산업체 주가는 견조한 가운데 국내 5사만 주가 급락 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)). \n\n### 실질적 수요: 미사일·방공·장거리 화력이 핵심\n실제로 전일 밤 발표된 미국 방산 실적이 **수요가 견조**하며 미사일·방공 증산이 **매출과 이익으로 찍히기 시작**했다 ([유진투자증권](https://news.ez.go.kr/news/articleView.html?idxno=765946)).\n\n> 🔺 참고: 2026년 10월 14일 교보증권은 \"AI 인프라 투자기업의 자금조달 부담이 부각되고 있다\"고 분석했는데, 당시 코어위브의 CDS 프리미엄이 1,100bp를 상회하고 있었다.\n\n---\n\n### 3. 음식료: 방어력보다 실질적 수익성 개선이 주가 전환의 핵심\n\n### 2027년 커버리지 7개사: 합산 매출 55.2조원 (+5.4% YoY), 영업이익 5.3조원 (+14.4% YoY)\n\n| 항목 | 2026년 |\n|------|--------|\n| 합산 매출액 | 55.2조원 (YoY +5.4%) |\n| 합산 영업이익 | 5.3조원 (YoY +14.4%) |\n\n> 📊 합산 영업이익률: 2026년 8.9% → 2027년 9.6% (↑0.7pp).\n\n---\n\n### 4. 통신: 3Q26 실적 시즌 종료, 4Q26는 방향성보다 실질적 Capex 전망 변경 여부가 핵심\n\n### SKT: 3Q26 연결 영업수익 4.5조원 (+12.5% YoY), 영업이익 5,340억원 (+1,002.1% YoY). 컨센서스 부합 전망 ([유안타증권](http://ir.yuantasecurities.co.kr/kor/research/researchDetail.aspx?code=S202610200100001)).\n\n- SK브로드밴드 데이터센터 및 해저케이블 사업을 분할해 설립하는 SK호라이즌: 구주 매각 1.9조원, 신주발행 1.2조원으로 지분가치 6.3조원으로 평가.\n- SK하이퍼를 중심으로 2029~2035년 전국 4~5개 거점에 총 5GW 규모의 AIDC를 구축할 계획.\n    > ✅ **핵심**: 기존 통신사업 이익 회복에 AIDC 사업가치 재평가가 더해질 전망.\n\n---\n\n### 5. 원화 강세: 원가 부담 완화 기대, 그러나 국내 3Q26 실적은 시장 컨센서스를 소폭 하회할 전망\n\n### 2026년 10월 14일 IBK투자증권은 \"원화 강세 의미와 수혜주\"를 분석했으며, 당시 원달러 1,330원 내외에서 거래 중이라고 밝힌 바 있다.\n\n### 2026년 10월 20일 IBK투자증권: 원달러 1,330원 내외에서 거래 중. 2026년 10월 20일 하납니다.  \n\n- 2026년 10월 20일 기준: 1,330원 내외\n- 현재 (2026-10-21): 원달러는 1,330원 내외에서 거래 중\n\n> 📊 2026년 10월 20일 IBK투자증권:  \n- 2026년 10월 20일 기준: 1,330원 내외\n- 현재 (2026-10-21): 원달러는 1,330원 내외에서 거래 중\n\n### 1H27 (단순 평균):\n- 주요 4대 곡물 투입가 (달러 기준):\n   - 옥수수 +14%\n   - 소맥 +28%\n   - 대두 +18%\n   - 원당 +28%\n\n- 원화로 환산할 경우:\n   - 옥수수 +6%\n   - 소맥 +19%\n   - 대두 +10%\n   - 원당 +15%\n\n- 추가 원화 강세 가능성까지 열어 둔다면:\n   - 내년 원가 부담은 우려 및 걱정 대비 완화될 것으로 판단 ([하나증권](https://www.ibksavings.com/userFiles/Research/2026/10/20/20261020_010.pdf)).\n\n---\n\n### 6. AI 데이터센터: 업종별 투자선호도 - 건설 > 통신 > 전력 > 철강\n\n### 업종별 투자선호도:\n\n1. **건설**\n   - 27년부터 수혜 인식\n   - 실적 개선 효과 양호\n   - 상대적 진입장벽 존재\n   - 단, ‘지속성’은 업체별 차별화\n   - 종목: GS건설 / 자이S&D\n\n2. **통신**\n   - 기존 실적 대비 수혜 규모 크나, 실적 인식 시점에서 후순위\n   - 종목: KT / LG유플러스\n\n3. **전력**\n   - DC개발사업 > 재생에너지 개발·PPA > 민간 발전사 > 한국전력\n   - 병목 현상 완화를 위한 정책적 지원 기대\n   - 투자증가는 부담\n   - 수혜는 업체 사업구조별로 차별화되어 나타날 전망\n\n4. **철강**\n   - 실적 인식 빠르나, 기존 실적 대비 기여도 낮음\n\n---\n\n### 7. 방산: 주가 급락은 극단적 우려로, 단기 리스크 요인\n\n### 미국 중간선거(11/3)를 앞두고 민주당 우세 시 국방비 삭감 가능성이 제기되며 미국 방산에 대한 우려가 확대됨 ([유진투자증권](https://news.ez.go.kr/news/articleView.html?idxno=765946)).\n\n> 🔺 참고: 2026년 10월 14일 교보증권은 \"AI 인프라 투자기업의 자금조달 부담이 부각되고 있다\"고 분석했는데, 당시 코어위브의 CDS 프리미엄이 1,100bp를 상회하고 있었다.\n\n---\n\n### 8. 방산: 10/20 주가 급락 코멘트\n\n10/20 한화에어로스페이스 (-12.5%), LIG D&A (-9.2%), 한화시스템 (-15.1%), 한국항공우주 (-7.3%), 현대로템 (-15.3%)으로 글로벌 방위산업체 주가는 견조한 가운데 국내 방위산업체 5사만 주가 급락 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 9. 방산: 10/20 주가 급락 코멘트\n\n과도한 주가 급락은 비중 확대의 기회 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 10. 방산: 10/20 주가 급락 코멘트\n\n과거에도 다수당과 무관하게 방위비 지출이 증가했다. 1950-1960년 한국, 베트남 전쟁, 2007-2010 아프간・이라크 전쟁, 2021-2022 우크라이나 전쟁 시기도 모두 민주당이 다수당이었던 시기였다. 그리고 미국의 방위비 분담은 초당적 합의 사항이다. 설령 감소한다고 해도, 미국의 자주포 및 장약 사업은 정권과 무관하게 계속될 예정이다 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 11. 방산: 10/20 주가 급락 코멘트\n\n실제로 전일 밤 발표된 미국 방산 실적이 수요가 견조하며 미사일·방공 증산이 매출과 이익으로 찍히기 시작했다 ([유진투자증권](https://news.ez.go.kr/news/articleView.html?idxno=765946)).\n\n---\n\n### 12. 방산: 10/20 주가 급락 코멘트\n\n국내 방산은 미국 익스포저가 크지 않아 직접 영향도 제한적. 오히려 민주당 의회의 우크라이나 지원 확대 요구는 유럽의 안보 불안을 유지시키는 요인 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 13. 방산: 10/20 주가 급락 코멘트\n\n올해 한국 방산이 부진했던 이유는 실적 정체와 더불어 길어지는 수주 공백. 결국 주가를 되돌릴 재료도 수주임 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 14. 방산: 10/20 주가 급락 코멘트\n\n해외 수주의 약 70%가 하반기에 집중되는 계절성에 주목하며, 임박한 UAE 대통령 국빈 방한(11월)과 메르츠 독일 총리 방한(10/29~31), 사우디 지상방산 패키지, 폴란드 K9 잔여 물량 등 이벤트를 거치며 밸류에이션 정상화를 전망 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 15. 방산: 10/20 주가 급락 코멘트\n\nLIG D&A의 입찰 제한 등 부정적 소식과 3Q26 실적 부담이 상존하고 있는 점은 단기 리스크 요인 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 16. 방산: 10/20 주가 급락 코멘트\n\n한국은 2025년 수주 기준 세계 2위(점유율 15%)이나 2022~25년 누적 인도 기준 점유율은 3.2%에 불과해, 확보한 수주가 인도되며 매출 점유율이 올라가는 구간을 맞이할 것 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 17. 방산: 10/20 주가 급락 코멘트\n\n섹터 전반보다는 비교우위 종목에 대한 선별적 비중 확대가 유효한 시점. 최선호주로 한화에어로스페이스, 차선호주로 미사일·요격탄 증분에 가장 직접 노출된 LIG D&A 유지 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 18. 방산: 10/20 주가 급락 코멘트\n\n국내 방위산업체 5사만 주가 급락 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 19. 방산: 10/20 주가 급락 코멘트\n\n한화에어로스페이스 (-12.5%), LIG D&A (-9.2%), 한화시스템 (-15.1%), 한국항공우주 (-7.3%), 현대로템 (-15.3%) ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 20. 방산: 10/20 주가 급락 코멘트\n\n과도한 주가 급락은 비중 확대의 기회 ([대신증권](https://mkbiz.hankyung.com/board/article.html?no=2026102014290251120558)).\n\n---\n\n### 21. 방산: 10/20 주가 급락 코멘트\n\n과거에도 다수당과 무관하게 방위비 지출이 증가했다. 1950-1960년 한국, 베트남 전쟁, 2007-2010 아프간・伊拉크 전쟁, 2021-2022 우크라이나 전쟁 시기도 모두 민주당이 다수당이었던 시기였다. 그리고 미국의 방위비 분담은 초당적 합의 ### 1. 미국 11월의 숫자: 법칙 vs 현실\n\nS&P500 역사상 11월 평균 +4.1% 올랐다. 2016년 이후 10년 중 9년 상승했고, 12개월 중 최고 성적이었다는 게 하나증권의 주장이다. 이유는 미국 투자회사법(RIC)의 세제 규정 때문이다. 해당 법률에 따르면 연간 자본이득 산정 기간은 \"11월 1일부터 다음해 10월 31일\"로 설정돼 있다. 따라서 11월 1일부터 발생하는 실현손익이 1년 누적 자본이득을 0으로 리셋시키므로, 투자신탁들은 이를 위해 11월 초반부터 자산을 사들이도록 설계돼 있다. 실제로 2000년 이후 중간선거 해의 11월도 S&P500은 평균 +2.8%였다——즉, 중간선대가 있었든 없든 11월의 기본적인 지수가 강세라는 것이다.\n\n하지만 하나증권이 덧붙이는 핵심 변수는 '패턴이 언제든지 깨질 수 있다'는 점이다. 중간선거 해와 비선거 해의 팩터별 성과가 다르기 때문에, '강한 11월'이라는 법칙 자체가 이미 중간선의 존재를 반영하고 있다고 보았다. 2000년 이후 중간선거 해의 11월 S&P500은 +2.8% 상승했는데, 이때는 오히려 다른 시기에 비해 저PER(주가순이익비율)이나 목표주가 겟거리(추천주가-현재주가) 등을 구성하는 '알파 팩터'가 더 잘 먹힌다. 반면 비선대 해의 11월엔 고변동성 또는 거래대금 상위주는 더 좋아졌다. 따라서 'AI 데이터센터 체인 + 에너지'로 특정 종목군을 골라냈는데, 이 선택은 법칙이 적용되는 방식이 아니라——법칙이 작동하는 조건이 무엇인지 분석한 데서 비롯된다.\n\n#### → 의미: 11월의 법칙은 수동적 수혜를 넘어 전략적 재료\n\n11월이 항상 강세라는 사실은 수동적인 헛점을 찾는 것이 아니다. 하나증권은 이 법칙이 '미국의 투자신탁이 반드시 자산을 사들이는 구조'라는 것을 이해하면, 이 구조에 내가 투자를 하는데 필요한 정보가 된다. 즉, 11월이 되면 투자신탁들이 자산을 사들이기 시작한다는 규칙이 있으니, 내가 그 흐름에 편승할 수 있는 위치를 알아둘 수 있고, 그 흐름이 어디로 흐르는지를 선행 팩터로 가늠해놓을 수 있다. 따라서 중간선 대회가 열릴 경우, 저PER, 목표주가 겟거리, 현금흐름 상위 종목을 먼저 살펴봐야 한다는 것이다.\n\n---\n\n### 2. 코어위브의 파장을 넘어서는 AI 위기\n\n코어위브가 문제의 발단이 됐다. 이 회사는 AI 서버 부품을 제공하는데, 부채 문제가 드러났다. 그런데 그 파장은 단순히 코어위브 주식 자체뿐만이 아니었다. 대신증권은 전일 저가매수세가 들어왔다가, 전날 저녁 골드만삭스가 \"코어위브의 부채 우려가 과도하다\"고 평가하자 투자심리가 회복됐다고 한다. 그러나 Trump 대통령의 개인 계좌에서 마이크론과 AMD를 매도했다는 소식이 나오자, 전일 반등에 따른 차익실현 매물을 출회하면서 증시가 다시 약세로 돌아섰다.\n\n대신증권은 이런 상황에서 국내 증시가 얼마나 취약한지를 분명히 밝혀낸다. 미국 증시에서 반도체주의 반등이 있었다는데, 국내 증시는 오히려 반도체 업종이 상대적으로 낙폭이 작았고, 방산·조선·원전 등 타 업종이 크게 떨어졌다. 그 이유는 원화 강세 때문이다. 달러-원 환율이 1,330원대까지 떨어지면서 환차손에 따른 수출기업의 4분기 실적 우려가 관련 업종에 부담으로 작용했다.\n\n#### → 의미: AI 위기는 신뢰 위기를 넘어서고 있다\n\n코어위브 사건이 단순한 신용 리스크 이상으로 확장되었다. 왜냐하면, 이 회사를 통해 연결된 AI 인프라 투자 수익률의 논란이 생겼기 때문이다. 신한투자증권은 대만 증시가 6~7월 글로벌 조정 이후 가장 빠르게 회복됐다고 하지만, 그 회복은 한국, 일본, 중국 등이 AI CapEx 테마로 동반 상승했던 것과 대비된다. 그리고 최근 대만 증시가 계속 강세를 유지하는 이유는 단순한 반도체 업황 회복이 아니라, 글로벌 AI 인프라 투자의 패러다임 변화에서 대만이 차지하는 밸류체인의 독보적 범주와 이익 성장 사이클의 차이에서 비롯한다고 본다.\n\n대신증권은 신규 상장시장에서 이 논란이 또 하나의 표현으로 나타난다. 전일 코스닥에 상장한 AI 클라우드 업체 엘리스가 일반청약 경쟁률이 408대 1이었음에도, 상장 첫날 공모가 대비 32% 급락했다. 공모주 특성상 공모가 부담이 있을 수는 있지만, 코어위브발 AI 인프라 투자수익률 논란이 신규 상장 AI 주에 대한 투자자 위험선호에도 부정적인 영향을 미쳤다는 것을 시사한다.\n\n#### → 결론: AI 투자 수익률 논란이 투자 심리에 도미노 효과를 불러왔다\n\n코어위브의 부채 문제가 단순한 신용 리스크 이상으로 확장되었다. 신뢰 위기가 AI 인프라 투자 수익률 논란으로 이어졌고, 이것이 신규 상장시장에서도 표현되었다. 이러한 상황 속에서 AI 테마가 단순히 업종 개념을 넘어 투자 수익률 모델 자체를 붕괴시키는 수준으로 도달했다는 점을 인정하는 게 중요하다.\n\n---\n\n### 3. 외국인 수급의 반도체 내부 분열: 삼성전자 vs SK하이닉스\n\n삼성전자와 SK하이닉스의 외국인 수급이 서로 다른 궤적을 걷고 있다. 외국인은 9월 28일부터 10월 15일까지 12거래일 연속 삼성전자를 순매도했다. 누적 순매도 금액은 7,8조원이다. 그러나 16일부터 3거래일 연속 순매수에 돌입하면서 누적 순매수 금액이 8,500억원을 기록했다. 반대로 SK하이닉스는 18거래일 연속 순매도에 들어갔고, 누적 순매도 금액은 16.2조원에 달한다.\n\n#### → 의미: 삼성전자의 외국인 순매수 전환이 아직 추세적 수급 개선이라고 단정할 수 없다\n\n이것은 외국인 수급이 반도체 대형주를 둘러싸고 종목별로 차별화되고 있다는 것이다. 아직 삼성전자에 대한 외국인 순매수 전환이 추세적인 수급 개선으로 단정되기에는 이른 감이 있다. 그러나 국내 증시 급락의 수급 주체였던 외국인이 반도체 집중 매도에서 삼성전자에 대해서는 순매수로 전환하고 있기 때문에, 앞으로 예상되는 변동성 장세라도 반도체 수급 개선이 이어져 간다면, 이 업종이 국내 증시 하방 지지력을 회복할 가능성이 대응 전략에 반영되어야 한다.\n\n---\n\n### 4. 3M, 아마존, 슈퍼마이크로: AI 서버 업체의 서프라이즈가 전일 급락을 상쇄하는 지표\n\n전일 미국 증시는 아시아 반도체주의 급락, 메타의 실적 대기심리 등 경계 요인이 상존했음에도 불구하고, 파키스탄의 중재에 따른 미-이란 대화 기대감 속 미국 10년물 금리 및 국제유가 하락, 3M(+5.8%)의 어닝서프라이즈 및 아마존(+0.1%)과의 데이터센터 협력 확대 발표로 비기술주 중심의 강세를 연출하면서 혼조세로 마감했다(Dow +1.02%, S&P500 +0.28%, Nasdaq -0.02%, 필라델피아 반도체 지수 -0.29%).\n\n메타 실적 발표는 2027년 CAPEX 증가 속도와 현금흐름(Free Cash Flow) 회복 경로가 관전 포인트가 될 것이라고 예상했다. 이와 함께 9월 출시된 에이전트 AI 뮤즈의 초기 수익성, 광고 사업의 고성장세 지속성이 입증될지도 메타 포함 AI 밸류체인 전반에 높은 주가 영향력을 행사할 것으로 보았다.\n\n---\n\n### 5. AI 서버 업체 슈퍼마이크로의 어닝서프라이즈와 시간외 강세\n\n슈퍼마이크로(Super Micro Computer Inc.)가 1분기 잠정 매출액 190억달러를 발표했다. 컨센서스는 150억달러였으므로, 서프라이즈 수준이다. 이 발표 직후 시간외 주가는 13%대 급등세를 보이고 있으며, 마이크론, 샌디스크 등 반도체주들도 시간외 2% 넘는 강세를 시현하고 있다. \n\n---\n\n### 6. 메타 실적 발표 전후 흐름: 2027년 CAPEX 증가 속도와 FCF 회복 경로\n\n메타(Meta Platforms Inc.)의 Q4 2026 실적 발표는 2027년 CAPEX(Capital Expenditure) 증가 속도와 Free Cash Flow(FCF) 회복 경로가 관전 포인트가 될 것이라고 전망했다. 이와 함께 9월 출시된 에이전트 AI 뮤즈(Agent AI Muse)의 초기 수익성과 광고 사업의 고성장세 지속성이 입증될지도 메타를 포함한 AI 밸류체인 전반에 높은 주가 영향력을 행사할 것으로 예상한다.\n\n---\n\n### 7. 국내 증시의 매수 기반 약화와 이벤트 기반 반등 가능성\n\n전일 국내 증시는 미국 증시에서의 반도체주 반등 소식에도 불구하고, 코어위브발 신용 불안 우려 잔존, 달러/원 환율 하락에 따른 수출 기업 실적 약화 우려 등으로 반도체, 조선, 방산 등 수출주를 중심으로 약세 압력을 받아 재차 급락세로 마감했다(kospi -3.7%, kosdac -3.3%).\n\n금일에는 전일 3%대 폭락에 따른 기술적 매수세 유입, 유가 및 금리 부담 완화, 슈퍼마이크로의 어닝 서프라이즈에 따른 미국 반도체주 시간외 강세(st +1.1%) 및 스페이스 X도 어닝 서프라이즈로 시간외 6%대 강세를 보이는 점 등이 국내 증시가 전일 급락분을 만회하는 흐름을 보일 전망이다.\n\n---\n\n### 8. 코스피 거래대금 감소와 외국인 순매도 물량 감소: 수급과 심리의 디커플링\n\n코스피 거래대금이 지난주 일평균 23조원대에서 이번주 17조원대까지 감소하는 등 국내 증시의 매수 기반이 강하지 않다는 점은 고민으로 남아있다. 이처럼 호가가 얇아진 환경이다 보면, 이전보다 적은 외국인 순매도 물량(전일 5,300억원)에도 장중 주가 변동성이 커지고 있는 실정이다.\n\n---\n\n### 9. 2026년 10월 20일 국내 증시에 신규 상장된 ETF 7종목\n\n2026년 10월 20일 국내 증시에 ETF 7종목이 신규 상장 예정이다:\n\n| 상장일 | ETF 상징코드 |\n|--------|--------------|\n| 2026.10.20(화) | [ETF 코드 리스트] |\n\n(※ 해당 ETF의 구체적인 상징코드 및 설명은 제공된 내용에서 명시되지 않았습니다.)\n\n---\n\n### 10. 미국과 이란의 협상 기대에 따른 국제유가 하락과 미 국채 10년물 금리 하락\n\n미국과 이란의 종전 협상에서 카타르와 파키스탄이 양측에 타협안을 제시했다는 소식이 전해지면서 중동 지역의 긴장 완화 기대가 확대되고 국제유가가 하락하면서 달러화에 약세 압력으로 작용했다. 미국 9월 주택 착공과 잠정 주택 판매 등 주택 시장 지표가 부진하게 발표되면서 연준의 10월 금리 동결 기대가 강화되고 미 국채 10년물 금리가 하락했으나, 장중 기술주 반등과 함께 금리가 상승 전환하면서 달러화도 낙폭을 일부 축소했다. 유로화는 프랑스 재정 불확실성에도 달러 대비 강세를 보였으며, 엔화도 달러 대비 소폭 상승했다. 특히 영국의 실업률이 예상보다 낮게 발표되고 영란은행 통화정책 위원의 매파적 발언이 이어지면서 파운드화가 강세를 보였다.\n\n---\n\n### 11. 중국 9월 실물경기 지표 및 3분기 GDP 성장률 소폭 상회\n\n중국 9월 실물경기 지표 및 3분기 GDP 성장률이 모두 시장 예상을 소폭 상회했다. 3분기 GDP 성장률은 +4.5% YoY로 연간 5% 내외의 성장률 목표 달성 부담이 낮아졌다. 9월 산업생산은 +5.5% YoY로 전월 대비 0.3%p 상승했다. 광업, 제조업, 유틸리티 등 산업의 생산보다 첨단 기술 제조업과 장비 제조업의 산업생산 증가가 두드러지며 산업 간 양극화가 지속되는 모습이다.\n\n---\n\n### 12. 중국 9월 소비 소폭 상회\n\n9월 소비는 +1.1% YoY로 전월의 +0.4% YoY에서 0.7%p 상승했다. 자동차를 제외한 소매판매는 +3.9% YoY로 8월 대비 1.4%p 개선했다. 품목별로는 AI 관련 소비 제품이 전체 소비를 주도했다. 통신장비 소비 증가율은 +31.1% YoY로 상승세를 지속했다.\n\n---\n\n### 13. 1-3분기 중국 1인당 가처분소득 전년동기대비 +5.3%\n\n1-3분기 중국 1인당 가처분소득은 3.4만 위안으로 전년동기대비 +5.3% YoY로 증가했다. 상반기 대비 +0.1%p 상승했다. 소비지출은 2.2만 위안으로 전년동기대비 +2.7% YoY로 증가했다. 이에 따라 1-3분기 가계한계 소비성향은 66.8%로 소폭 하락했다. 소비심리 부진이 여전하다는 의미다.\n\n---\n\n### 14. 1-9월 고정자산투자 전월과 동일한 -7.2% YoY\n\n1-9월 고정자산투자는 전월과 동일한 -7.2% YoY를 기록했다. 부동산 투자는 -20.6% YoY, 인프라 투자는 -4.2% YoY, 제조업 투자는 -2.1% YoY에 달했다. 당월 투자 증가율 기준으로 제조업, 인프라 투자 모두 전년동월대비 감소세를 보였지만, 감소폭은 8월보다 뚜렷하게 축소되었다.\n\n---\n\n### 15. 4분기 인프라 투자가 점진적으로 회복될 가능성\n\n그래도 4분기 인프라 투자가 점진적으로 회복될 가능성이 있다. 2분기 자금 집행 속도가 느렸던 특수채가 9월부터 가속화되었으며, 929 추가 부양 정책 자금도 6대 네트워크 건설에 활용될 예정이다. 또한 7-8월 계절적 요인에 의해 진행되지 못한 인프라 프로젝트들이 집중적으로 집행되는 단계로 전환될 전망이다.\n\n---\n\n### 16. 4분기 인프라 투자가 점진적으로 회복될 가능성\n\n그래도 4분기 인프라 투자가 점진적으로 회복될 가능성이 있다. 2분기 자금 집행 속도가 느렸던 특수채가 9월부터 가속화되었으며, 929 추가 부양 정책 자금도 6대 네트워크 건설에 활용될 예정이다. 또한 7-8월 계절적 요인에 의해 진행되지 못한 인프라 프로젝트들이 집중적으로 집행되는 단계로 전환될 전망이다.\n\n---\n\n### 17. 전통 인프라 투자 효율성이 개선되고 6대 네트워크 건설이 동시에 진행될 전망\n\n전통 인프라에 대한 투자 효율성이 개선되고 6대 네트워크 건설이 동시에 진행될 전망이다. 그러면 주식시장에서는 연산망, 전력망 등 6대 네트워크가 상대적으로 유리할 것으로 보여진다.\n\n---\n\n### 18. 중국 증시 단기 반등을 시도할 수 있는 구간에 진입\n\n중국 증시는 단기 반등을 시도할 수 있는 구간에 진입했다. 다만 기존의 AI 중심 장세보다는 업종 간 순환매 형태가 지속될 것으로 예상된다.\n\n---\n\n### 19. 업종별 관심 종목\n\n업종별로는 다음과 같이 관심 종목을 언급하였다.\n\n- 고배당으로 방어력 우위를 가지고 있는 은행/보험 업종\n- 기술적 반등이 가능한 AI 하드웨어/반도체\n- 정책 자금 투입이 예정되어 있는 6대 네트워크 관련주\n\n---\n\n### 20. 미국 9월 주택 착공과 잠정 주택 판매 등 주택 시장 지표 부진\n\n미국 9월 주택 착공과 잠정 주택 판매 등 주택 시장 지표가 부진하게 발표되면서 연준의 10월 금리 동결 기대가 강화되고 미 국채 10년물 금리가 하락했으나, 장중 기술주 반등과 함께 금리가 상승 전환하면서 달러화도 낙폭을 일부 축소했다.\n\n---\n\n### 21. 파킨슨병과 알츠하이머병, 노인 인구 증가에 따른 사회적 비용 증가\n\n파킨슨병과 알츠하이머병은 세계적으로 노인 인구의 급증에 따라 사회적 비용이 급증하고 있다. 파킨슨병의 경우, 뇌의 운동 기능을 좌우하는 뇌 신경 세포인 도파민 생성 능력을 갖춘 뉴런이 손상되면 발생하며, 치료 방법은 도파민을 보충하거나, 도파민 생성을 촉진하는 약물을 사용하여 운동장애를 완화하는 것이 대부분이다. 알츠하이머병은 뇌 기능을 수행하는 뉴런이 손상되면서 기억력, 인지 능력, 판단 능력이 저하되는 질환이다. 뇌 조직을 구성하는 세포 간 접촉을 형성하는 역할을 하는 β-아밀로이드 단백질이 과잉 축척되어 뇌 조직을 손상시킴으로써 뇌 기능이 저하시킬 수 있다. 치료 방법은 β-아밀로이드 단백질을 제거하는 약물을 사용하는 것이 일반적이다. 파킨슨병과 알츠하이머병은 뇌 신경 세포가 손상되어 뇌 기능이 저하되는 질환이므로, 치료 방법은 뇌 신경 세포를 보호하거나, 손상된 뇌 신경 세포를 활성화하는 약물을 사용하는 것이 일반적이다.\n\n---\n\n### 22. 파킨슨병과 알츠하이머병, 노인 인구 증가에 따른 사회적 비용 증가\n\n파킨슨병과 알츠하이머병은 세계적으로 노인 인구의 급증에 따라 사회적 비용이 급증하고 있다. 파킨슨병의 경우, 뇌의 운동 기능을 좌우하는 뇌 신경 세포인 도파민 생성 능력을 갖춘 뉴런이 손상되면 발생하며, 치료 방법은 도파민을 보충하거나, 도파민 생성을 촉진하는 약물을 사
