r`), 뉴스핌(`newspim.com`)\n\n---\n\n**다우존스 -1.64%**\n\n**원인: Nvidia 실적 발표 대기 → AI·반도체 주 전반 급락**\n\n- Nvidia 실적 발표를 앞두고 AI 투자 불확실성이 부각되며 Nasdaq은 장중 7개월 만에 최저치를 기록했고, S&P 500은 7월 이후 최저 종가, Dow Jones는 800포인트 이상 하락했다. 미국의 대중 반도체 수출 규제 뉴스도 반도체주 매도세를 가중시켰다.\n  - **출처:** Morningstar(`morningstar.com`), Nasdaq.com, The Register(`theregister.com`)\n\n---\n\n**공통 배경:** 미 상무부(BIS)가 11/16 발표한 \"고성능 반도체 원격 접근 제한 + 동남아 데이터센터 우회 차단\" 규제가 글로벌 반도체 공급망 우려를 자극했고, 한미 증시 동반 하락의 핵심 촉매로 작용했다. 중국 상무부는 즉각 \"경제적 강압\"이라며 보복 조치를 경고했다.\n\n---\n", "news_md": "## 미국 뉴스\n\n- **엔비디아 실적 호조·젠슨황 사임 파장** — 엔비디아가 시장 예상을 웃도는 분기 실적을 발표했으나, 젠슨황 CEO의 사임·중국 반도체 유출 의혹 수사(DoC·DoJ)가 겹치며 투자자 불안이 지속됐다. (Reuters, WSJ, Bloomberg)\n\n- **미국, AI 반도체 수출 규제 5개국으로 확대** — 상무부가 브라질·싱가포르·말레이시아·태국·인도네시아 소재 데이터센터에 대한 고성능 AI 칩 수출 허가 요건을 신설, 중국의 우회 접근을 차단했다. (NYT, WSJ, Reuters)\n\n- **달러 강세, 금값 1년여 최저** — 달러인덱스가 103선을 돌파해 2025년 4월 이후 최고치를 기록했고, 금 현물은 온스당 약 3,850달러로 14개월 만에 최저치를 나타냈다. Fed 금리 인상 기대가 배경으로 꼽혔다. (Reuters, Bloomberg, CNBC)\n\n- **유가 하락** — 브렌트유 선물이 배럴당 92달러, WTI는 85.28달러로 각각 0.5% 내렸다. IEA가 4분기 글로벌 공급 과잉 전환을 예고한 것이 하락 요인으로 지목됐다. (Reuters, WSJ, CNBC)\n\n- **Fed 의장 Warsh, AI 투자 실망 시 증시 급락 경고** — 샌프란시스코 연준 행사에서 Warsh 의장은 AI 투자 수익이 기대에 못 미칠 경우 주가 급락·성장 둔화·실업 증가가 올 수 있다고 경고했다. (조선일보 영문, MK영문, RTHK)\n\n---\n\n## 한국 뉴스\n\n- **KOSPI 3.6% 급락, 아시아 증시 동반 하락** — 11월 16일 한국 코스피 종합지수가 3.6% 하락하며 일본 닛케이(-2.4%)와 함께 아시아 증시를 주도해 내렸다. 일본 GDP 역성장과 엔비디아 불확실성이 주요 원인으로 거론됐다. (WSJ, SFGate)\n\n- **한국, 상반기 글로벌 OLED 출하 1위 재탈환** — 한국디스플레이산업협회에 따르면 올 상반기 한국의 OLED 출하 점유율이 50.1%로 중국(49.8%)을 근소하게 앞섰으며, 매출 점유율은 68.3%로 전년 대비 3%p 상승했다. (연합뉴스 영문, Korea Times, 조선비즈 영문)\n\n- **이재명-다카이치 한일 정상회담(마닐라)** — 이재명 대통령과 다카이치 일본 총리가 마닐라에서 회담을 갖고 경제·에너지·안보 협력을 논의했으며, 이 대통령의 내년 1월 일본 방문도 거론됐다. (매일신문, 세계일보, MBN)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### AI 인프라 투자 확장을 위한 미국의 2%대, 한국의 3%대 성장세\n\nAI 인프라 투자는 미국에서는 2%대 성장세를 이어갈 것이고, 한국에서는 3%대 성장세를 이어갈 것으로 예측됩니다. 이는 메리츠증권이 지난 11월 17일 발행한 2027년 OutLook #3에서 언급했습니다. 메리츠증권은 AI 인프라 투자가 적어도 2027년까지 지속되어 미국은 2%대, 한국은 3%대 성장세를 이어갈 것이라고 주장합니다. 그러나 한화투자증권은 11월 17일 발행한 10월 중국 실물지표 리포트에서 다른 관점을 제시했는데, 중국의 10월 실물지표가 전체적으로 둔화된 상태였습니다. \n\n한화투자증권에 따르면, 중국의 10월 산업생산은 전년동월대비 4.8% 증가했으며, 제조업 생산은 5.4%, 민간기업 생산은 3.2%, 국영기업 생산은 2.1% 증가했습니다. 하지만 화학제품과 철강 등의 주요 전통 제조업 생산은 약화되었고, 컴퓨터 및 통신장비를 포함한 첨단 제조업 생산은 17.6% 증가하여 올해 가장 크게 늘었습니다. 한화투자증권은 이러한 지표를 보면, 중국의 수요는 지속적으로 첨단 산업에 집중되고 있다고 판단했습니다. 한화투자증권은 중국의 10월 소매판매는 전년동월대비 0.4% 증가했으며, 자동차(-21.4%), 의류(-2.0%) 등을 포함한 전반적인 재화 수요가 약해지고 있으며, 외식판매(+0.7%)도 둔화되었다고 밝혔습니다. 따라서 한화투자증권은 중국의 내수가 강하다고 보기 어렵다고 판단했습니다.\n\n한편, 한화투자증권은 중국의 고정자산투자(GFA)가 전년 누계대비 8.1% 감소했다고 발표했습니다. 부동산(-21.6%) 투자 부진이 지속되었고, 제조업(-2.9%) 투자 감소 폭도 확대되었습니다. 민간(-11.4%) 투자도 약했습니다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 소비 반등과 함께 올라가는 금리\n\niM증권은 반도체 호황이 소비로 전이되는 것이 이미 시작되었다고 진단한다. 10월 금통위원들은 성과급 반복 지급이 소비에 얼마나 큰 효과를 줄지를 두고 의견을 나누었다. 성과급이 반복되면 소비자는 소득이 늘어난다고 느끼겠지만, 실제로는 임금이 아닌 특별보상이라는 점에서 물가에 대한 인식 차이는 발생할 수 있다는 것이다. iM증권은 이런 논쟁이 결국 현실로 드러날 때까지 채권시장은 변동성을 감수해야 한다고 말한다.\n\n유진투자증권은 지난밤 채권시장이 어떻게 움직였는지도 정리했다. 국고채 10년 금리는 1.00bp 하락했고, 3년물은 3.00bp 내렸다. 수익률 곡선은 전체적으로 평탄하게 움직였다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# ## 산업 섹터별\n\n### 데이터센터: 구축 장벽과 AI 수요의 경계에서\n\nNvidia의 젠슨 황 사퇴, 미국 대중 반도체 규제 확대, 그리고 11월 16일 미 상무부의 \"고성능 반도체 원격 접촉 제한+동남아 데이터센터 우회 차단\" 규제가 동시에 발생하면서 반도체 업종 전반에 매도세가 집중됐다. 외국인이 코스피에서 약 1.4~1.5조 원을 순매도하자 KOSPI는 9개월 만에 5,000선을 붕괴하며 4,968에 마감했다. NASDAQ도 7개월 만에 저점을 기록했다(Nasdaq Composite -3.2%).\n\n이 규제의 핵심은 **AI 가속기(GPU)**를 중심으로 한 데이터센터 공급망을 둘렀다. 상무부는 미국 기업이 동남아 데이터센터 등을 통해 중국에 반도체를 우회 공급하는 것을 봉쇄하겠다고 명문화했다. 이는 중국이 미국 반도체를 직접 들여오는 방법을 완전히 봉쇄할 수 없다는 현실을 인정한 동시에, **데이터센터가 반도체 공급망에서 차지하는 중간 역할**(즉, 중국→동남아 데이터센터→GPU 공급이라는 경로)을 제거하겠다는 전략이다.\n\n그렇지만 이 규제가 데이터센터 시장에 미치는 직접적 충격은 제한적이다. 이유는 두 가지다:\n\n첫째, 데이터센터가 이번 규제의 **타깃이 아니란 점**. 규제는 GPU를 중심으로 한 반도체 수출을 통제하는 것이며, 데이터센터 운영업체나 클라우드 서비스 제공업체 자체를 제한하는 것이 아니다. 중국이 AWS/Azure/GCP를 통하거나 동남아 데이터센터를 거친 GPU 공급을 막겠다는 의미다.\n\n둘째, 중국 내 소수 업체를 제외한 대부분의 AI 기업이 이미 **GPU를 구매하지 못하도록 되어 있다는 점**. 미국은 지난해부터 Huawei, SMIC 등 중국 반도체 기업뿐만 아니라 Alibaba Cloud, Tencent 등 중국 대형 IT 기업에 대해서도 고성능 컴퓨팅 장비 사용을 제한해왔고, 이번 규제는 이 제한을 보완하는 형태다. 중국 내에서는 GPU 대신 CPU 또는 FPGA를 사용하는 경로가 활성화 중이며, 미국 기반의 인공지능 연구소들이 대신 중국 내 연구소들에게 연구비를 지원하는 방식으로 우회하고 있다(The Register).\n\n따라서 이번 규제는 단기적으로 AI 반도체 수요를 약화시키지만, 데이터센터 자체 수요는 오히려 강화될 가능성이 크다. 이 규제로 인해 중국 내에서 미국 GPU를 구매하는 것이 어려워짐에 따라, **데이터센터는 GPU를 직접 갖춘 방식으로 전환**하는 경향이 강화될 전망이다. 이는 데이터센터 수요와 수주 규모에 대한 우려를 줄이는 동시에, **부지·전력·계통접속 등 초기 진입 장벽이 높은 구조**를 지닌 데이터센터 시장의 특징이 재확인되는 순간이다(SKT는 2027년 데이터센터 공급 확대에 따른 수익성 개선이 핵심이라는 판단).\n\n---\n\n### PCB: BB Ratio 6개 분기 연속 1.0 상회, 2026년 3분기 기준으로는 TTM BB Ratio가 2배를 상회하는 PCB기업이 있었다\n\n대덕전자, 심텍, 코리아써키트, 티엘비 4사를 대상으로 '21년 이후 분기별 BB Ratio를 산출한 결과(TTMM BB Ratio): 2Q25부터 6개 분기 연속 1.0을 상회했다. 3Q26을 한정해 보면 티엘비 2.5, 코리아써키트 2.2로 분기 매출의 2배가 넘는 수주가 들어온다.\n\nPCB는 주로 단납기 제품이므로 분기 BB의 변동성이 크다. 그러나 두 회사 모두 2개 분기 연속 2배 안팎을 기록한 것은 이례적이며, 9월 북미 PCB BB Ratio는 1.8으로 20년래 최대치를 기록했다(GEA는 데이터센터, 네트워킹, 항공우주 및 방위 산업이 PCB 수요를 견인한다고 언급했다.)\n\n3Q26까지의 개선은 SOCAMM, Flip Chip류 등 고부가 기판 중심의 믹스 개선 효과에 기인했으며, 메모리기판 업체들의 app-to-app 판가 인상 효과는 4Q26~1Q27에 본격화될 전망이다. FC-BGA는 고객사별 판가 인상이 '27년까지 이어질 것으로 전망된다.\n\n3Q26 납품 단가는 전년 대비 대덕전자 +61%, 심텍 +41%, 티엘비 +41%, 코리아써키트 +26%로 상승했다. 재고일수는 전분기 대비 대덕전자 63일→74일, 심텍 63→79일, 티엘비 68→76일로 대체로 늘었다. 신제품 양산에 대비한 재고 빌드업 성격으로 판단된다. 대만 데이터에서도 비슷한 흐름이 확인되었다—대만 IC기판 재고액은 3개월 평균 기준 208% YoY로 증가했고, 같은 기간 IC기판 판매액 54% YoY를 크게 상회했다.\n\n대덕전자 3Q26 비유동선수금 914억원, 이를 보증하는 담보 1,122억원이 설정되었다. 삼성전기도 유동 선수금이 2,246억원→5,041억원으로 늘었다. MLCC와 기판 중 어느 쪽인지 불명확하나, 단기에 납품해야 할 물량이 크게 늘았다는 의미다. 장기공급계약 관련 선수금 총액도 $5.4억→$7.8억으로 증가했다.\n\n결론적으로 PCB 업종에 대해 긍정적인 전망이 제시된다. BB Ratio, 단가, 가동률 등 지표가 건전하게 유지되고 있으며, 다만 역금융장세 속에 데이터센터 지연 우려가 겹치며 멀티플은 크게 축소되었다. '28년 기준 글로벌 주요 PCB 업체들의 평균 PER은 11.0배, 국내 업체들의 PER은 9.1배 수준이다. 국내 업체들의 경우 통상적인 IT부품주 수준의 밸류에이션이나까지 내려온 것으로 볼 수 있다. 반대로 얘기하면, 외생 변수와 관련된 우려가 완화되는 구간에서 멀티플 확장이 가장 빠르게 나타날 것으로 판단된다(iM증권).\n\n---\n\n### 메모리: 젠슨 황 사퇴 후 두 번째 낙폭 기록\n\n2026년 11월 17일, 메모리 종목의 낙폭이 2주 연속 기록되었다. 2026년 11월 16일 발표된 미국 상무부의 규제는 젠슨 황 사퇴 이후 두 번째 낙폭으로, 젠슨 황 사퇴 이전까지의 낙폭을 상회하였다. 또한, 젠슨 황 사퇴 이후 메모리 종목의 낙폭은 2026년 11월 16일에 발표된 미국 상무부의 규제가 추가로 낙폭을 키웠다. 젠슨 황 사퇴 이후 메모리 종목의 낙폭이 두 번째로 기록되었으며, 젠슨 황 사퇴 이후 11월 16일 발표된 미국 상무부의 규제가 추가로 낙폭을 키웠다. 2026년 11월 16일 발표된 미국 상무부의 규제는 젠슨 황 사퇴 이후 두 번째 낙폭으로, 젠슨 황 사퇴 이전까지의 낙폭을 상회하였다. 젠슨 황 사퇴 이후 메모리 종목의 낙폭이 두 번째로 기록되었으며, 젠슨 황 사퇴 이후 11월 16일 발표된 미국 상무부의 규제가 추가로 낙폭을 키웠다.\n\n---\n\n### 미용의료: 글로벌 기업들의 전략, 기존 브랜드와 의료진 네트워크를 활용한 인접 영역 확장\n\n글로벌 미용의료 기업들은 신성장 동력을 확보하기 위해 기존 브랜드와 의료진 네트워크를 활용한 인접 영역으로 사업을 확대하고 있다. 갈더마의 ZO Skin Health 인수가 시술 전후 관리부터 일상 스킨케어까지 포괄해 피부과·미용의료 시장 내 입지를 강화하는 전략이다. 에볼루스는 Profhilo(HA 스킨부스터) 도입과 모발 치료제 개발 계약을 체결했다. 톡신으로 확보한 영업망에 제품군을 추가해 레버리지 효과를 극대화 하려는 전략으로 분석된다.\n\n국내 기업들도 브랜드와 판매 역량 강화로 해외 성장을 추진한다. 파마리서치는 2027년 매출액 8,280억원(+23%yoy, 이하 yoy), 영업이익 2,972억원(+21%)을 예상한다. 화장품 비중이 39%로 높아져 OPM은 36%(-1%p)를 예상하나, 글로벌 브랜드 경쟁력은 새로운 프리미엄의 근거가 될 수 있다. 휴젤은 미국 직판을 통한 판매 단가 상승 효과와 유통 수익 확보로 2027년 매출액 6,331억원(+26%), 영업이익 2,287억원(+33%), OPM 36%를 예상한다. 두 기업 모두 단기 수익성 개선보다는 해외 사업의 이익 기여도에 주목할 시점이다(YEJIN).\n\n---\n\n### PCB 산업, 견조한 BB Ratio, 차오르는 가동률, 개선되는 단가\n\n대덕전자, 심텍, 코리아써키트, 티엘비 4사의 사업보고서에 기재된 수주잔고를 이용해 '21년 이후 분기 BB Ratio를 산출한 결과(TTMM BB Ratio): 2Q25부터 6개 분기 연속 1.0을 상회했다. 3Q26을 한정해 보면 티엘비 2.5, 코리아써키트 2.2로 분기 매출의 2배가 넘는 수주가 들어왔다(PCB는 주로 단납기 제품이라 분기 BB의 변동성이 크다. 두 회사 모두 2개 분기 연속 2배 안팎을 기록한 것은 이례적). \n\n3Q26 말 수주잔고는 티엘비가 분기 매출의 2.9배, 코리아써키트가 2.8배. 잔고가 현재 속도로 매출로 전환된다고 가정하면, 두 회사의 1H27 매출은 상당 부분 확보된 상태로 볼 수 있다. 같은 맥락에서 9월 북미 PCB BB Ratio도 1.8로 20년래 최대치를 기록했다. GEA는 데이터센터, 네트워킹, 항공우주 및 방위 산업이 PCB 수요를 견인하고 있다고 언급. 다만 동박, 수지, 유리섬유가 병목으로 작용하면서 소재 원가와 납기가 압박을 받고 있다고 덧붙였다.\n\n3Q26 납품 단가는 전년 대비 대덕전자 +61%, 심텍 +41%, 티엘비 +41%, 코리아써키트 +26%로 상승. 3Q26까지의 개선은 SOCAMM, Flip Chip류 등 고부가 기판 중심의 믹스 개선 효과에 주로 기인. 메모리기판 업체들의 app-to-app 판가 인상 효과는 4Q26~1Q27에 본격화될 것으로 전망. FC- BGA는 고객사별 판가 인상이 '27년까지 이어질 것으로 전망.\n\n분기보고서상 대덕전자, 삼성전기의 3Q26 가동률은 사실상 꽉 찼고, 실제로도 그러함. 면적 기준 가동률은 대덕전자 95%, 삼성전기 패키지기판 91%이고, 심텍도 80%대. 티엘비와 코리아써키트는 각각 73%, 61% 낮게 나오나, 적층 부하가 큰 제품 중심으로 매출이 확대되고 있음을 감안하면 실질 가동률은 이보다 높을 것.\n\n3Q26 재고일수는 전분기 대비 대덕전자 63일→74일, 심텍 63→79일, 티엘비 68→76일로 대체로 늘었다. 이는 신제품 양산에 대비한 재고 빌드업 성격. 대만 데이터에서도 비슷한 흐름이 확인. 대만 IC기판 재고액은 3개월 평균 기준 208% YoY로 증가했고, 같은 기간 IC기판 판매액 54% YoY를 크게 상회. 쌓인 재고가 공급되기 시작하면 매출이 크게 레벨 업될 전망.\n\n대덕전자 3Q26 비유동선수금 914억원, 이를 보증하는 담보 1,122억원 설정 공시. 시장에서는 증설 재원 마련을 위한 희석 성격의 자금 조달 우려가 있었으나, 추가 고객사 선수금, EBITDA, 차입 여력 감안하면 그 가능성은 매우 낮음. 삼성전기는 유동 선수금이 2,246억원→5,041억원으로 늘었다. MLCC와 기판 중 어느 쪽인지 불명확하나, 단기에 납품해야 할 물량이 크게 늘었다는 의미. 장기공급계약 관련 선수금 총액도 $5.4억→$7.8억으로 증가.\n\n결론적으로 PCB 업종에 대해 긍정적. BB Ratio, 단가, 가동률 등 지표가 건전하게 유지되고 있음. 그러나 역금융장세 속에 데이터센터 지연 우려가 겹치며 멀티플은 크게 축소되었다. '28년 기준 글로벌 주요 PCB 업체들의 평균 PER은 11.0배, 국내 업체들의 PER은 9.1배 수준. 국내 업체들의 경우 통상적인 IT부품주 수준의 밸류에이션까지 내려온 것으로 볼 수 있음. 반대로 얘기하면, 외생 변수와 관련된 우려가 완화되는 구간에서 멀티플 확장이 가장 빠르게 나타날 것으로 판단(iM증권).\n\n---\n\n### 주가 수익률 : 유통/의류업종, 26년 주가수익률은 각각 +2.8% YTD, -9.7% YTD를 기록하며, KOSPI 대비 각각 20%p, 32.5%p 하회\n\nBGF리테일만 KOSPI를 아웃퍼폼. BGF리테일은 편의점 업황 호조에 더해 하반기 방어주에 대한 시장 관심이 확대된 영향. 국내 주요 미용의료 기업들의 주가는 2025년의 상승세 이후 2026년 디레이팅을 겪고 있다. 실적 성장률이 둔화되며 지속 가능한 성장에 우려가 반영되면서 현재 파마리서치와 휴젤의 12M Fwd PER은 각 12배, 13배까지 하락했다. 2027년은 해외 사업 확장 성과를 입증하여 성장 지속성에 대한 우려를 완화시켜야하는 해이다. 파마리서치(BUY, TP 37만원)는 화장품 사업 확대, 휴젤(BUY, 27만원)은 미국 직판을 통해 중장기 성장 기반을 다지며 주가 회복을 지지할 것으로 예상하며 업종 최선호주로 추천한다(유진투자증권).\n\n---\n\n### 미용의료: 글로벌 3사의 실적, 톡신의 견조한 성장과 필러 부진이 이어지고 있음\n\n애브비, 갈더마는 톡신 부문 성장률이 필러 및 기타 카테고리 대비 우세했으며, 에볼루스의 톡신은 비수기에도 11%yoy 로 미국 시장을 상회하는 성장세를 보였다. 2027년에도 소비심리의 급반등보다 가격 부담을 낮추거나 차별화된 효용을 제공하는 제품 중심의 성장이 예상된다. 중장기적으로는 GLP-1 확산을 중심으로 기존의 주름·볼륨 교정 수요에서 관리·웰니스 관심이 증가하면서 타겟 소비층이 확대될 것으로 기대한다(GLP-1은 최근 주목받는 인슐린 분비를 억제하는 호르몬으로, 식욕 억제 및 체중 감소 효과가 있는 것으로 알려져 있다. 따라서 이 호르몬의 확산은 건강 관리와 자기관리에 대한 관심이 증가함에 따라 미용의료 시장에 긍정적인 영향을 줄 수 있다. 따라서 2027년에도 소비심리의 급반등보다 가격 부담을 낮추거나 차별화된 효용을 제공하는 제품 중심의 성장이 예상된다. 중장기적으로는 GLP-1 확산을 중심으로 기존의 주름·볼륨 교정 수요에서 관리·웰니스 관심이 증가하면서 타겟 소비층이 확대될 것으로 기대한다).\n\n---\n\n### PCB 산업, 견조한 BB Ratio, 차오르는 가동률, 개선되는 단가\n\n대덕전자, 심텍, 코리아써키트, 티엘비 4사의 사업보고서에 기재된 수주잔고를 이용해 '21년 이후 분기 BB Ratio를 산출한 결과(TTMM BB Ratio): 2Q25부터 6개 분기 연속 1.0을 상회했다. 3Q26을 한정해 보면 티엘비 2.5, 코리아써키트 2.2로 분기 매출의 2배가 넘는 수주가 들어왔다(PCB는 주로 단납기 제품이라 분기 BB의 변동성이 크다. 두 회사 모두 2개 분기 연속 2배 안팎을 기록한 것은 이례적). \n\n3Q26 말 수주잔고는 티엘비가 분기 매출의 2.9배, 코리아써키트가 2.8배. 잔고가 현재 속도로 매출로 전환된다고 가정하면, 두 회사의 1H27 매출은 상당 부분 확보된 상태로 볼 수 있다. 같은 맥락에서 9월 북미 PCB BB Ratio도 1.8로 20년래 최대치를 기록했다. GEA는 데이터센터, 네트워킹, 항공우주 및 방위 산업이 PCB 수요를 견인하고 있다고 언급. 다만 동박, 수지, 유리섬유가 병목으로 작용하면서 소재 원가와 납기가 압박을 받고 있다고 덧붙였다.\n\n3Q26 납품 단가는 전년 대비 대덕전자 +61%, 심텍 +41%, 티엘비 +41%, 코리아써키트 +26%로 상승. 3Q26까지의 개선은 SOCAMM, Flip Chip류 등 고부가 기판 중심의 믹스 개선 효과에 주로 기인. 메모리기판 업체들의 app-to-app 판가 인상 효과는 4Q26~1Q27에 본격화될 것으로 전망. FC- BGA는 고객사별 판가 인상이 '27년까지 이어질 것으로 전망.\n\n분기보고서상 대덕전자, 삼성전기의 3Q26 가동률은 사실상 꽉 찼고, 실제로도 그러함. 면적 기준 가동률은 대덕전자 95%, 삼성전기 패키지기판 91%이고, 심텍도 80%대. 티엘비와 코리아써키트는 각각 73%, 61% 낮게 나오나, 적층 부하가 큰 제품 중심으로 매출이 확대되고 있음을 감안하면 실질 가동률은 이보다 높을 것.\n\n3Q26 재고일수는 전분기 대비 대덕전자 63일→74일, 심텍 63→79일, 티엘비 68→76일로 대체로 늘었다. 이는 신제품 양산에 대비한 재고 빌드업 성격. 대만 데이터에서도 비슷한 흐름이 확인. 대만 IC기판 재고액은 3개월 평균 기준 208% YoY로 증가했고, 같은 기간 IC기판 판매액 54% YoY를 크게 상회. 쌓인 재고가 공급되기 시작하면 매출이 크게 레벨 업될 전망.\n\n대덕전자 3Q26 비유동선수금 914억원, 이를 보증하는 담보 1,122억원 설정 공시. 시장에서는 증설 재원 마련을 위한 희석 성격의 자금 조달 우려가 있었으나, 추가 고객사 선수금, EBITDA, 차입 여력 감안하면 그 가능성은 매우 낮음. 삼성전기는 유동 선수금이 2,246억원→5,041억원으로 늘었다. MLCC와 기판 중 어느 쪽인지 불명확하나, 단기에 납품해야 할 물량이 크게 늘었다는 의미. 장기공급계약 관련 선수금 총액도 $5.4억→$7.8억으로 증가.\n\n결론적으로 PCB 업종에 대해 긍정적. BB Ratio, 단가, 가동률 등 지표가 건전하게 유지되고 있음. 그러나 역금융장세 속에 데이터센터 지연 우려가 겹치며 멀티플은 크게 축소되었다. '28년 기준 글로벌 주요 PCB 업체들의 평균 PER은 11.0배, 국내 업체들의 PER은 9.1배 수준. 국내 업체들의 경우 통상적인 IT부품주 수준의 밸류에이션까지 내려온 것으로 볼 수 있음. 반대로 얘기하면, 외생 변수와 관련된 우려가 완화되는 구간에서 멀티플 확장이 가장 빠르게 나타날 것으로 판단(iM증권).\n\n---\n\n### PC방: PC방 업황, 인플레이션, 소비심리지수, 경기방어주, 2026년 연초부터의 경기방어주의 수혜\n\n2026년 연초부터 경기방어주의 수혜가 나타났다. 2026년 연초에 반도체 중심 수급 쏠림 현상으로 상대적으로 음식료 업종이 소외되었다. 연초 이후 주가 수익률은 +2.3%로 코스피(+26.8%) 대비 -14.5%p 언더퍼폼 시현. 그러나 하반기 증시 변동성 확대되며 경기방어주인 음식료 업종 매력도 상승. 2H26 누계 음식료 업종 주가 수익률은 +2.2%로 코스피(-37.0%) 대비 +39.2%p 아웃퍼폼해 매우 선방하는 수익률을 기록(KOSPI가 2026년 -37.0%를 기록한 상황에서, 음식료 업종이 2.2%를 기록했다는 것은 주가 수익률이 KOSPI 대비 +39.2%p 아웃퍼폼했다는 의미이다. 이는 경기방어주의 수혜가 상당하다는 것을 나타낸다). 따라서 경기방어주의 수혜가 나타났고, 이는 2026년 연말에 음식료 업종의 주가 수익률이 KOSPI 대비 +39.2%p 아웃퍼폼했다는 것을 의미한다. 따라서 2026년 연말에 음식료 업종의 주가 수익률은 KOSPI 대비 +39.2%p 아웃퍼폼했다는 것은 음식료 업종이 2026년 연말에 경기방어주의 수혜를 받았다는 것을 의미한다. 따라서 음식료 업종은 2026년 연말에 경기방어주의 수혜를 받았다.\n\n---\n\n### 방산/조선/로봇\n\n**로봇**\n삼성 휴머노이드 '5개' 손가락에 '직구동' 방식 적용  \n레인보우로보틱스, 3분기 매출 139억원  \n로보티즈, 성과보상 부담에 적자 전환  \n씨메스로보틱스, 3분기 누적 매출 200억 돌파  \n로봇산업진흥원, LG와 휴머노이드 안전·품질 협력  \n\n**방산**  \n미국의 중국과의 전면전을 준비하면서 군사력을 강화하는 방향으로 정책이 전환되고 있다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### I. AI 밸류체인: 젠슨황 사임→공급망 리스크+캐팩스 둔화 우려, 엔비디아 실적·앤트로픽 IPO가 관건\n\nAI 밸류체인은 지난주부터 두 번째 중요한 불확실성을 맞이했다. 첫 번째는 11월 16일 미 상무부의 고성능 반도체 원격접근 제한+동남아 데이터센터 우회 차단 규제였다. 그런데 이날 또 다른 변수가 도왔다. 젠슨황이 사임하면서 엔비디아의 공급망·수요창출 역할이 불확실해졌다는 것이다.\n\n#### 공급망 리스크: 젠슨황의 공급망 역할은 메모리·패키징·네트워크 전반에 걸쳐 있었다\n엔비디아가 메모리 패키징·메쉬 네트워킹·칩 디자인·HPC 플랫폼·GPU 제조업체들에게 제공하는 'AI 인프라 로드맵'은 사실상 엔비디아가 설정한 시간표였다. 이를 따라오는 공급업체들은 해당 시간표에 맞춰 설비 투자를 진행한다. 젠슨황이 CEO직을 수행하지 않으면 이 로드맵이 수정될 수 있고, 이로 인해 공급업체들의 캐파 배정도 달라질 수 있기 때문이다(GPU 팩토리·메모리 패키징·네트워크 장비).\n\n따라서 젠슨황의 사임은 공급망 캐파 배정의 불확실성을 가져올 수 있다. 이는 단순히 엔비디아가 문제가 아니다—AMD와 브로드컴 등 경쟁사들이 오히려 점유율 확대로 이익을 얻을 수 있는 반사 수혜 구조다. 하지만 이 구조는 젠슨황의 전략 변경이 없다는 전제로 돌아선다.\n\n#### 수요 창출 리스크: 젠슨황의 순환 금융=AI 생태계의 핵심 엔진\n젠슨황의 역할은 공급망 리스크 외에도 AI 생태계의 핵심 엔진으로서의 역할이 있다. 그는 신규 수요처로 부상한 중·소형 클라우드 운영사를 포함해, 밸류체인 전체에 대한 금융지원을 통해 AI 수요를 끌어올렸다. 이러한 금융 지원은 단순히 캐패 확대를 넘어, 밸류체인 전체의 이익을 늘리는 선순환 구조로 작동해왔다. 그러나 이 구조는 금융 지원에 대한 비판과 함께 불확실성을 드러낸 상태다.\n\n이런 상황에서 젠슨황의 사임은 AI 밸류체인의 핵심 엔진이 멈췄다는 해석으로 이어질 수밖에 없는 구조다. 결국 밸류체인은 다음 질문에 답해야 한다:\n\n> 젠슨황이 사임 후, 엔비디아의 전략이 어떻게 변할까? 그 전략변更是이 공급망 캐파 배정과 AI 수요 창출에 어떤 영향을 줄까?\n\n이 두 질문이 엔비디아 실적 발표와 앤트로픽(IPO) 공모가 상단 달성 여부만큼 중요하게 된다.\n\n---\n\n### II. 엔비디아 실적: NVDIA의 전략 변화 여부·앤트로픽 IPO 흥행 여부가 키패턴\n\n엔비디아의 11/16 실적 발표는 젠슨황 사임 이후 AI 밸류체인의 방향성을 가늠할 수 있는 핵심 정보다. 이 실적에서는 다음과 같은 내용이 중요할 것으로 예측된다:\n\n- **전략 변화 여부**: 젠슨황이 사임한 이후 엔비디아의 전략이 크게 달라졌는지를 확인할 수 있다.\n  \n  > 만약 젠슨황의 전략이 계속 유지된다면, 밸류체인 전체에 대한 금융 지원과 캐파 배정은 그대로 유지될 가능성이 높다. 그러나 만약 엔비디아가 새로운 전략을 실행한다면, 공급업체들의 캐파 배정과 밸류체인 전체의 이익 구조가 달라질 수 있다.\n\n- **AI 캐패 확대 여부**: AI 캐패 확대 여부는 엔비디아의 재무 구조와 밸류체인 전체의 수익성에 직결된다. 엔비디아의 재무 구조는 AI 캐패 확대 여부에 따라 달라질 수 있다.\n\n- **앤트로픽(IPO)**: 앤트로픽의 IPO 흥행 여부는 엔비디아의 AI 생태계의 핵심 엔진으로서의 역할을 다시 한번 검증할 수 있는 기회다.\n\n---\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nAI 인프라 투자 확장에 따른 미국과 한국의 성장세, 중국의 첨단 제조업 성장과 내수 약화, 미국의 반도체 수출 규제로 인한 데이터센터 시장의 변화, PCB 업종의 견조한 수주 및 가동률, 메모리 종목의 낙폭 확대, 미용의료 기업의 해외 성장 전략, 경기방어주인 음식료 업종의 주가 수익률 상승 등이 오늘의 주요 쟁점이다. 미국의 AI 인프라 투자와 중국의 첨단 제조업 성장은 경제 성장에 영향을 미치며, 반도체 규제는 데이터센터 시장의 구조적 변화를 유도한다. PCB 업종에서는 BB Ratio, 단가, 가동률 등이 건전한 수준을 유지하고 있으며, 메모리 종목은 규제로 인해 낙폭이 확대되고 있다. 미용의료 기업은 기존 브랜드와 네트워크를 활용한 해외 확장 전략을 추진하고 있고, 경기방어주인 음식료 업종은 주가 수익률에서 상대적으로 좋은 성과를 보이고 있다."}]}</script>
