<script id="__DATA__" type="application/json">{"date": "2026-09-14", "shock_md": "## 매크로(경제)\n\n### 1. **9월 FOMC 금리 인상 확률 상승, 25bp 인상 기대**\n유안타증권은 8월 CPI가 시장 예상치를 상회하며 9월 FOMC에서 25bp 인상이 예상된다고 분석했다. 근원물가 상승과 중동 리스크에 따른 유가 상승을 고려할 때, 9월과 12월 각각 25bp 인상이 기본 경로로 상정된다. 다만 유진투자증권은 8월 CPI 발표 직후 9월 25bp 인상 확률이 86.2%로 급등했으며, 2년물 금리가 4.57%에 달하며 금리 인상 기대가 강화되고 있다고 보았다.\n\n### 2. **에너지 충격으로 인한 물가 불안 재등장**\n한화투자증권과 SK증권은 8월 CPI에서 에너지 가격 상승이 헤드라인 물가 상승을 주도했으며, 휘발유와 연료유 가격이 전년 대비 크게 상승한 점을 강조했다. iM증권은 유가가 100달러를 상회하며 물가 압력이 지속되고 있으며, 이는 연준의 금리 인상 결정에 영향을 줄 수 있다고 분석했다. 신한투자증권도 유가 상승이 지표와 무관하게 긴축 경계를 높이고 있다고 지적했다.\n\n### 3. **환율과 수출의 관계, 기존 인식과 차이**\n한화투자증권은 원화 약세가 수출 증가로 이어지지 않는다는 점을 강조하며, 환율 변화가 수출물량에 직접적인 영향을 미치지 않는 것으로 분석했다. 이는 글로벌 경기 둔화나 국제가격 하락이 원화 약세와 동시에 수출 감소를 유발했기 때문이라고 설명했다. 이에 대해 유진투자증권은 환율이 수출에 미치는 영향이 품목별로 다르며, 기업별 가격 전략과 원가 구조에 따라 달라질 수 있다고 보았다.\n\n### 4. **국채금리와 유가 동반 상승, 금리 인상 우려 지속**\niM증권은 국채금리와 유가가 동반 상승하며 인플레이션과 금리 인상 우려를 증폭시키고 있다고 분석했다. 미국 10년 국채금리가 5%대에 다가섰고, 유가가 100달러선을 유지하고 있는 상황에서, 중앙은행의 금리 안정화 노력이 시급하다고 보았다. 신한투자증권도 유가 상승과 함께 금리 인상 우려가 지속되고 있으며, 이는 주요국의 긴축 경계가 높아졌기 때문이라고 설명했다.\n\n### 5. **9월 FOMC 이후 금리 경로, 25bp 인상 vs 동결 논쟁**\n유안타증권은 9월 25bp 인상이 지난해 인하분의 되돌림 성격이며, 10월 회의에서는 중간선거를 앞두고 유보할 것으로 보인다고 전망했다. 반면 iM증권은 9월 FOMC에서 금리 동결이 시장 컨센서스이며, 금리 인상은 12월로 미뤄질 가능성이 있다고 보았다. 신한투자증권도 8월 CPI 발표 이후 9월 인상 확률이 급등했지만, 블룸버그 서베이에서는 금리 동결이 우세하다고 분석했다.\n\n### 6. **국제 유가 상승에 따른 경제적 영향 확대**\niM증권과 신한투자증권은 유가 상승이 교역조건 악화와 원/달러 환율 상승을 유발하며, 경상수지 흑자 기조가 유지되더라도 외환시장에 부담을 줄 수 있다고 지적했다. 한화투자증권은 유가 상승이 에너지 충격의 2차 파급으로 이어질 수 있으며, 이는 물가 압력 지속의 주요 요인이라고 분석했다.\n\n---\n", "tabs": [{"title": "채권", "md": "## 채권\n\n### 1. 연준 9월 기준금리 인상 확정적\n한화투자증권과 하나증권, 유진투자증권, 키움증권, iM증권 등 주요 증권사는 9월 연준 기준금리 인상이 불가피하다고 판단했다. 특히 하나증권은 8월 CPI와 근원 CPI가 예상치를 상회하며 연준의 인상 트리거가 되었고, 유진투자증권은 국제유가 상승과 물가지표가 인상의 시급성을 높였다고 분석했다. 다만, 하나증권은 12월까지 기다릴 명분이 사라졌다고 보며 9월 인상으로 전망을 수정했다.\n\n### 2. 유가 상승이 채권시장에 악영향\n유안타증권, 유진투자증권, 키움증권, 신한투자증권 등은 국제유가 급등이 채권시장에 악영향을 미쳤다고 분석했다. 유안타증권은 전일 국내 채권시장에서 외국인의 국채선물 대규모 순매도로 인해 약세 압력이 커졌다고 보고, 유진투자증권은 유가 상승이 물가 부담을 급격히 높여 채권시장에 투매를 유발했다고 지적했다.\n\n### 3. 미국 10년물 금리 5% 돌파 가능성\niM증권과 키움증권은 미국 10년물 금리가 5%를 상회할 가능성이 높다고 전망했다. iM증권은 9월 인상이 기대인플레이션을 안정시키는 보험성 인상으로 받아들여지면 5% 상회는 짧게 지속될 수 있으나, 연준이 공급 충격으로 해석하거나 추가 긴축 가능성을 열어두면 장기금리 상승이 지속될 수 있다고 분석했다. 키움증권은 10년물 연말 예상 범위를 4.85~5.20%로 제시하며 고유가와 국채 공급 부담으로 상승 리스크가 여전히 높다고 보았다.\n\n### 4. 연준의 긴축 경로에 대한 불확실성\n하나증권과 키움증권은 연준의 긴축 경로에 대한 불확실성이 여전히 존재한다고 지적했다. 하나증권은 10월 연속 인상 가능성은 낮으나, 9월 인상 이후 데이터를 바탕으로 점진적으로 추가 인상 여부를 결정할 것으로 보았고, 키움증권은 연내 1회 인상 후 연말까지 동결하며 정책 효과를 확인할 가능성이 높다고 전망했다.\n\n### 5. 한국 채권시장에 대한 부정적 영향\n하나증권과 키움증권, 신한투자증권 등은 미국의 금리 인상이 한국 채권시장에 부정적 영향을 미칠 수 있다고 분석했다. 하나증권은 한국은행이 미국의 통화정책을 크게 반영하지 않은 상태에서 강한 인상 사이클을 시작했기 때문에, 미국의 인상이 지속되면 한국은행의 인상 여력과 최종 기준금리에 대한 불확실성이 커질 수 있다고 보았다.\n\n### 6. 국내 채권 금리 상승과 커브 플래트닝\n다올투자증권은 국내 채권 금리가 상승하고 커브가 플래트닝 양상을 보이고 있다고 분석했다. 전일 국고채 3년과 10년 금리가 각각 상승했으며, 10년/3년 스프레드는 소폭 감소했다. 한화투자증권과 유진투자증권 등은 미국의 금리 상승과 유가 상승이 국내 채권시장에 전반적인 압력을 주고 있다고 보았다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. K-방산, 국방예산 확대에 따른 성장 가속화\nDS투자증권은 2027년 한국 국방예산이 73.2조원으로 편성되며, 방위력개선비가 22.7조원(전년 대비 13.8% 증가)에 달했다고 분석했다. 특히, KF-21 양산 예산이 2026년 대비 2.4배 증가했고, Block-2 생산 일정이 2035년까지 밀릴 수 있다는 우려를 해소한 것으로 보인다. 이는 KF-21의 빠른 전력화가 수출 확대에 긍정적 영향을 미칠 수 있다고 판단했다. 이에 따라 인도네시아·필리핀 등 수출국과의 논의가 가속화될 것으로 전망한다.  \n반면, 다른 리포트에서는 K-방산의 성장에 대한 직접적인 언급이 없으며, 이에 따라 K-방산의 확대가 주요 이슈로 부상했다.\n\n### 2. 디지털자산 시장, 연준의 인상 결정에 따른 시장 반응\n유안타증권은 연준이 9월 16일 FOMC에서 인상 결정을 내리며, 시장에서는 '인플레가 아닌 월가 논리'라는 진단이 나왔다고 보도했다. 골드만삭스 역시 인플레 전망은 변하지 않았으나, 인상으로 선회했다고 분석했다. 이에 따라 디지털자산 시장에서는 연준의 정책 변화가 주요 변수로 작용할 것으로 보인다.  \n과거 리포트에서는 디지털자산 시장의 움직임에 대한 구체적인 언급이 없었으나, 현재의 연준 정책 변화는 디지털자산 시장에 영향을 미칠 것으로 예상된다.\n\n### 3. 바이오연료 수요 증가, SAF 혼합 의무 시행으로 주목\n교보증권은 유럽 SAF 가격이 이란 전쟁 이후 31% 상승하며, 고유가에 따른 판가 상승과 함께 2027년 국내 SAF 혼합 의무 시행이 예정되어 있어 바이오연료에 대한 수요가 증가할 것으로 전망했다. 특히, SAF는 2027년 1% 혼합 의무가 확정되었고, 2030년 3~5%로 확대될 예정이다. 이에 따라 DS단석, KG에코솔루션, 제이씨케미칼 등이 주목받고 있다.  \n이와 관련해 과거 리포트에서는 SAF 혼합 의무에 대한 구체적인 언급이 없었으나, 현재의 정책 변화는 바이오연료 시장에 중요한 영향을 미칠 것으로 보인다.\n\n### 4. AI 인프라 투자 확대, 그러나 개발 속도 조절 논의로 투자 지연 우려\n교보증권은 AI 인프라 투자 확대에 따른 성장 기대가 시장의 주요 기대였으나, AI가 위험할 만큼 강력하다는 논의가 확산되며 투자 지연 우려가 커지고 있다고 분석했다. AI 개발의 안전성 검증이 다음 단계의 개발을 위한 조건으로 작용할 경우, 모델 개발뿐 아니라 투자 의사결정에도 영향을 줄 수 있다고 보았다.  \n이에 따라 단기적으로 AI 성장의 종료보다, 시장이 기대한 성장의 실현 시점이 늦어질 가능성이 높아 보인다.\n\n### 5. 미국의 배터리 탈중국 정책, 한국 기업 수혜 기대\n하나증권은 미국이 중국산 배터리 사용을 제한하는 방향으로 정책을 확대하고 있으며, 이에 따라 한국 배터리 기업이 수혜를 받을 것으로 전망했다. 특히, 미국 행정부가 배터리를 안보자산으로 다루고 있으며, 중국산 배터리의 디지털 백도어 문제로 인해 미국 내 중국 배터리 사용이 제한될 것으로 보인다.  \n이에 따라 LG에너지솔루션과 삼성SDI 등 대형 배터리 기업이 우선적으로 수혜할 것으로 예상된다.\n\n### 6. 메모리 반도체 수출 급증, SK하이닉스 주가 상승\n하나증권은 9월 10일까지 메모리 반도체 수출금액이 전년 동월 대비 206% 증가한 13.0억 달러를 기록하며, DRAM과 NAND, MCP가 세 자릿수 증가율을 기록했다고 보고했다. SK하이닉스 주가가 10% 상승하며 코스피 지수 대비 아웃퍼폼한 것으로 보인다.  \n이에 따라 메모리 반도체 수출의 견조한 흐름이 SK하이닉스의 주가 상승으로 이어지고 있으며, 이는 향후 지속적인 성장 가능성을 시사한다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. **연준 금리 인상 기대 상승, 9월과 12월 총 50BP 인상 전망**\n유안타증권은 9월과 12월 각 25BP씩 총 2회 금리 인상이 예상되며, 이는 연준의 물가 리스크 통제를 위한 선언적 의미의 단발성 인상으로 한정될 것이라고 분석. 이는 8월 Core CPI/PPI 상승과 잭슨홀 미팅 당시 워시의 발언 등을 고려한 전망이다. 다만, 유진투자증권은 베센트 장관의 국채 시장 개입 시도가 위험하다고 지적하며, 연준이 제때 기준금리를 올리지 않으면 장기금리와 기간 프리미엄이 불안정해질 수 있다고 경고.\n\n### 2. **AI 인프라 투자 모멘텀 재차 강화, 반도체·IT 부문 주도**\nDS투자증권은 OpenAI의 GPT-6.0 Astra 출시로 AI 인프라 투자 모멘텀이 강화될 것으로 전망하며, 이는 AI 인프라 사이클의 성공과 맞물려 투자심리 개선에 긍정적 영향을 줄 것이라고 설명. 대신증권도 AI 모멘텀과 금리, 유가 힘겨루기 중 AI 관련 투자심리가 확대되며 지수 상승을 견인했다고 분석. 특히, 키움증권은 오픈AI의 국내 AI 추론 데이터센터 구축 추진과 GPT-6 아스트라 출시 기대가 반도체·이차전지주를 중심으로 매수세를 유도했다고 밝힘.\n\n### 3. **국제유가 상승과 금리 인상 우려로 인한 주식시장 변동성 확대**\n대신증권과 키움증권은 국제유가 상승과 미국 10년물 국채금리 상승이 인플레이션 및 통화긴축 장기화 우려를 자극하며 주식시장 변동성을 확대했다고 지적. 특히, 유가가 100달러를 돌파하고 미국 10년물 국채금리가 5%에 근접하면서 외국인과 기관의 동반 순매도가 발생했으며, 코스피는 7,000선을 재차 하회했다. 유안타증권도 유가 상승에 따른 물가 리스크와 금리 불확실성으로 주식시장의 변동성이 커질 수 있다고 분석.\n\n### 4. **주식형 펀드 자금 흐름 분기별 변동, 액티브 자금 이탈 지속**\n유안타증권은 주식형 펀드에서 액티브 자금이 순유출을 지속하고 있으며, 이는 8월 비농업 고용 상승으로 인한 9월 금리 인상 확률 상승과 관련이 있다고 설명. 반면, 채권형 펀드에서는 단기채로의 쏠림과 하이일드 유입 감소, 국채와 회사채의 격차 확대 등이 관찰되며, 이는 정책금리 불확실성에 대한 헤지와 신용위험 회피에 해당한다고 분석.\n\n### 5. **국내 AI 반도체 및 소부장 테마 ETF 신규 상장, 투자 유도**\n하나증권은 9월 15일 신규 상장된 K-HBM반도체, AI반도체 소부장 액티브 ETF가 AI 반도체 수요 증가 추세와 맞물려 투자 유도에 긍정적 영향을 줄 것으로 전망. 이 ETF들은 국내 AI 반도체 산업의 성장과 함께 수혜를 기대할 수 있는 소재·부품·장비 기업들을 포트폴리오에 포함하고 있다.\n\n### 6. **중국 AI 스타트업 상장 러시 지속, 딥시크와 문샷 AI 주목**\n하나증권은 중국 AI 스타트업의 상장 러시가 지속되고 있으며, 딥시크와 문샷 AI가 주목받고 있다고 분석. 딥시크는 상하이 과창판 IPO 준비에 착수했으며, 문샷 AI는 홍콩과 상하이 과창판 이중 상장을 검토 중이라고 보도됨. 다만, 홍콩 상장 대기 기업 과밀과 홍콩 AI 종목의 부진한 수익률이 이중 상장 검토의 배경이 되고 있다고 설명.\n\n---\n\n**과거 관련 리포트**: 과거 관련 리포트가 제공되지 않았으므로, 해당 내용은 생략합니다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n매크로, 채권, 산업섹터 전반에서 금리 인상 기대와 유가 상승이 시장에 지속적인 압력을 주고 있으며, 이는 채권시장 약세와 금리 상승 리스크를 동반하고 있다. 에너지 충격과 물가 압력이 연준의 긴축 경로 결정에 영향을 미치고 있고, 이에 따라 향후 금리 경로에 대한 불확실성이 여전히 존재한다. 한편, K-방산, 바이오연료, 배터리 등 일부 산업에서는 정책 변화와 수요 확대에 따른 성장 기대가 나타나고 있어, 이러한 분기별 흐름을 고려한 다각적 시각이 필요해 보인다."}]}</script>
