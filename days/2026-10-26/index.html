026년 10월에 접어든 지금, 기준금리가 3.00%에서 멈춰야 하는지, 아니면 계속 3.50%로 올라가야 하는지. 그런데 이런 선택의 시간이 오히려 금리 인상이 필요한 시점이라는 사실이 드러난다. 한화투자에 따르면 \"미국은 소비와 투자의 안정적인 흐름이 장점\"이라고 진단했다. 그러나 대신증권은 \"경기 둔화의 강도가 될 것으로 예상\"한다고 덧붙였다.\n\n### 물가-인플레이션-통화정책: 딱 한 가지 해결책\n\n중동에서 발생한 지정학적 위기가 물가 전망을 새롭게 만들었다. 한화투자는 \"에너지 이외 물가의 더딘 둔화는 끈적끈적한(sticky) 인플레이션을 시사한다\"고 진단했다. 그리고 \"국제유가 하락 가능성은 피크아웃 전망의 근거\"라고 설명했다. 그러나 iM증권은 다르게 접근했다. \"WTI 기준으로 국제유가는 103.27달러/배럴\"이라는 수치를 들어 \"40달러 수준과는 아직 격차가 있지만... '장대한 분노' 작전으로 국제유가가 큰 폭으로 추가 상승할 경우 실질유가 역시 40달러 수준에 근접할 여지가 크다\"고 경고했다.\n\n두 시각이 만나는 지점은 어디인가? 한화투자가 \"에너지 이외 물가의 더딘 둔화\"라는 표현을 사용한 건 아마도 국제유가가 하락하기 때문에 피크아웃이 가능하다는 믿음에서 비롯된 것일 것이다. 하지만 iM증권은 반대로 생각한다. 트럼프 대통령의 발언이 국제유가를 112.95달러까지 밀어올랐던 것을 기억해야 한다. 그렇다면 국제유가가 다시 오를 가능성도 있다는 얘기다.\n\n두 시각이 서로 다루는 문제가 다르다. 한화투자는 국제유가가 하락하는 미래를 묻는다. iM증권은 국제유가가 다시 오를지도 모르는 현재를 걱정한다. 하지만 두 시각이 같게 지적하는 건 \"에너지 이외 물가의 더딘 둔화\"라는 표현이다. 즉, 물가가 너무 느릿느릿 떨어진다는 점을 모두 인정하고 있다는 이야기다.\n\n### 유가-인플레이션-통화정책: 중립이 아닌 선택\n\niM증권은 \" WT I 기준으로 국제유가는 103.27달러/배럴\"이라는 수치를 들어 \"40달러 수준과는 아직 격차가 있지만...\"이라며 실질유가가 40달러에 근접할지도 모른다고 경고했다. 한화투자는 \"에너지 이외 물가의 더딘 둔화는 끈적끈적한(sticky) 인플레이션을 시사한다\"고 진단했다. 그리고 \"국제유가 하락 가능성은 피크아웃 전망의 근거\"라고 설명했다.\n\n이 두 시각은 서로 다른 시나리오를 준비하고 있다. 한쪽은 국제유가가 하락할 미래를, 다른 쪽은 국제유가가 다시 오를 현재를 걱정한다. 하지만 두 시각이 모두 공통적으로 받아들이는 건 \"에너지 이외 물가의 더딘 둔화\"라는 표현이다. 즉, 물가가 너무 느릿느릿 떨어진다는 점을 모두 인정하고 있다는 이야기다.\n\n두 시각이 서로 다루는 문제가 다르다. 한화투자는 국제유가가 하락하는 미래를 묻는다. iM증권은 국제유가가 다시 오를지도 모르는 현재를 걱정한다. 하지만 두 시각이 같게 지적하는 건 \"에너지 이외 물가의 더딘 둔화\"라는 표현이다. 즉, 물가가 너무 느릿느릿 떨어진다는 점을 모두 인정하고 있다는 이야기다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 국채 금리: 단기·장기 동시 급등\n\n오늘 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0). \n\n**왜 이런가**: 외국인 국채선물 매수 축소와 아시아장 미국 금리·코스피 반등이 하락폭을 줄였다. 그러나 장기물 금리 하락폭이 더 커져 수익률곡선이 평탄화했다. 유안타증권은 \"국내 채권시장 불 플래트닝 마감\", \"간밤 메타 실적발표 후 주가 급락 여파로 국내 금리도 급락 출발... 외국인의 국채선물 매수 축소로 낙폭이 줄었으며 장기물 금리 하락폭이 더 커 수익률곡선 평탄화\"라고 분석했다.\n\n**어떤 의미인가**: 오늘 하락은 단기·장기 금리 동시에 상승하는 구조가 붕괴되지 않음을 의미한다. 3년물은 전일 대비 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 10년물은 4.10%로 4.10% 아래로 내려섰다. 하지만 10년물은 전일 대비 -3.6bp로 하락했으며, 지난주 대비 +4.5bp로 상승했다. 3년물은 전일 대비 -1.6bp로 하락했으며, 지난주 대비 +6.3bp로 상승했다.\n\n### 채권 수급: 교보증권 \"구조적으로 하락 어려움\"\n\n교보증권은 \"2027년 채권시장 전망: The Long Ridge - 짧은 오르막, 긴 능선\"이라는 제목의 리포트에서 \"양호한 성장과 남겨진 구조적 긴장\", \"2027년 글로벌 경제는 전반적으로는 견조한 성장 흐름을 유지할 것으로 전망. 높은 공공부채와 장기금리, 지정학적 갈등, 정책 불확실성 등이 상존하고 있지만, AI 관련 투자 등이 글로벌 경기의 하방을 제한해 줄 것으로 판단. 물가 상승률은 2026년 대비 점차 둔화되겠지만, 여전히 높은 수준을 유지하면서 주요국 중央은行의 물가 목표(2.0%)를 상회하는 흐름이 이어질 것으로 예상\"이라고 전망했다.\n\n**한화투자증권**: \"불안한 지루함\". \"2027년 채권시장 전망: 지루한 박스. 특이하게 좋은 소식도, 새롭게 나타날 나쁜 소식도 딱히 보이지 않는다.\"\n\n**교보증권**: \"The Long Ridge - 짧은 오르막, 긴 능선\".\n\n**유안타증권**: \"국채 금리 변동성이 커진 것은, 단기자금 조달 환경과 수익률곡선의 변화가 레버리지 채권 포지션에 영향을 미쳤기 때문이다.\"\n\n**대신증권**: \"27년 1Q 정점 확인 이후 더딘 하향 안정\".\n\n**iM증권**: \"B와 D 사이의 C (2)\".\n\n**하나증권**: \"미국 중간선거 이후 금리 (feat. 분점정부)\", \"룰라의 역전승\".\n\n**키움증권**: \"10월 FOMC Preview: 긴축의 끝은 아닌 동결\".\n\n**유진투자증권**: \"중앙은행, 잠깐의 휴식\".\n\n**다올투자증권**: \"Daily Bond Morning Brief(2026.10.26)\".\n\n**한화투자증권**: \"2027년 채권시장 전망: 지루한 박스\".\n\n**교보증권**: \"2027년 채권시장 전망: The Long Ridge - 짧은 오르막, 긴 능선\".\n\n**하나증권**: \"미국 중간선거 이후 금리 (feat. 분점정부)\", \"룰라의 역전승\".\n\n**유안타증권**: \"채권 Daily (2026.10.26)\".\n\n**유안타증권**: \"元大金利: 금리 급등락은 이어진다\".\n\n**대신증권**: \"고(高)금리? 고(苦)금리!\".\n\n**다올투자증권**: \"Daily Bond Morning Brief(2026.10.26)\".\n\n**다올투자증권**: \"Daily Bond Morning Brief(2026.10.23)\".\n\n**유진투자증권**: \"FI Weekly - 중앙은행, 잠깐의 휴식\", \"Eugenes FICC Update\".\n\n**키움증권**: \"10/26 Kiwoom Fixed Income Weekly Review\", \"10월 FOMC Preview: 긴축의 끝은 아닌 동결\".\n\n**iM증권**: \"40bp에서 10bp로, 초장기채 강세의 다음 조건\", \"글로벌 크레딧 리스크 모니터 11월호: B와 D 사이의 C (2)\", \"27년 전망 Re: 위상도로 본 연말연시 계절성\".\n\n**과거 관련 리포트**: \n- 한화투자증권 2025-10-01 [FI 2026년 전망] 위로 열린 박스\n- 하나증권 2021-11-18 고민이 많아지는 시간\n- 하이투자증권 2024-01-24 채권시장의 차기 고민과 1월 FOMC 관전포인트\n- 한화투자증권 2025-12-15 [FI Weekly] 2019년도, 2021년도 아니다\n- 하나증권 2020-11-25 미국 금리, 눌러도 눌리지 않는다\n\n**매크로 충격 지표**:\n\n- 코스닥 -3.26%\n\n> 외국인 매도 + 유가 급등 + 미 증시 불안\n\n### 금리 변동성: 유안타증권 \"변동성 확대\"\n\n유안타증권은 \"국내도 채권 관련 파생상품과 레버리지 포지션이 확대되어 금리 변동성이 커졌으며, 대외금리 흐름에도 밀접하게 연동하게 되었다. 여기에 빅테크 기업들의 자금 조달 확대와 우리나라의 외화자금 유출입이 확대 등 대내외 금리 변동성 확대로 이어지고 있다. 단기자금에 연동된 채권 투자포지션이 확대된 후, 헤지펀드 중심으로 단기금리 숏 포지션이 크게 늘어난 점이 있다. 국채 대기 매수세와 금리 매력이 높아지면서, 헤지펀드의 숏커버링 수요가 몰리면서 장기금리 반락 폭이 커질 수 있는 구조이다. 수익률곡선의 변동과 함께 장기금리 변동성이 커지는 양상은 당분간 불가피해 보인다\"라고 전망했다.\n\n**유안타증권**: \"국채 금리 변동성이 커진 것은, 단기자금 조달 환경과 수익률곡선의 변화가 레버리지 채권 포지션에 영향을 미쳤기 때문이다. 반면 채권 매수 여력이 형성되고 있으며, 신용위험 강도에 따라 국채 수요 강도에 영향을 미칠 것이다. 국내도 채권 관련 파생상품과 레버리지 포지션이 확대되어 금리 변동성이 커졌으며, 대외금리 흐름에도 밀접하게 연동하게 되었다. 여기에 빅테크 기업들의 자금 조달 확대와 우리나라의 외화자금 유출입이 확대 등 대내외 금리 변동성 확대로 이어지고 있다. 단기자금에 연동된 채권 투자포지션이 확대된 후, 헤지펀드 중심으로 단기금리 숏 포지션이 크게 늘어난 점이 있다. 국채 대기 매수세와 금리 매력이 높아지면서, 헤지펀드의 숏커버링 수요가 몰리면서 장기금리 반락 폭이 커질 수 있는 구조이다. 수익률곡선의 변동과 함께 장기금리 변동성이 커지는 양상은 당분간 불가피해 보인다.\"\n\n### 채권 수급: iM증권 \"초장기물 집중\"\n\niM증권은 \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0). 10년물은 4.10%로 4.10% 아래로 내려섰다. 하지만 10년물은 전일 대비 -3.6bp로 하락했으며, 지난주 대비 +4.5bp로 상승했다. 3년물은 전일 대비 -1.6bp로 하락했으며, 지난주 대비 +6.3bp로 상승했다. 3년물은 2.23%로 2.23% 아래로 내려섰다.\"라고 분석했다.\n\n**iM증권**: \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0).\" \n\n**iM증권**: \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0).\n\n### 채권 수급: 유진투자증권 \"잠시 쉬어가는 시기\"\n\n유진투자증권은 \"10월 금통위, 예상대로 만장일치 동결. 전쟁 및 미국 선거 등 여러 대외 불확실성 속에서 두 번의 선제적 인상 효과를 지켜볼 시간이 필요했기 때문.\" 이번 동결은 긴축 경로 상에 있는 잠깐의 휴식으로 한은의 긴축 의지는 여전했음. 11월 경제전망 상향을 예고하며 긴축 필요성 언급. 함.추가 인상이 선반영 됐기 때문에 금리 영향이 적었을 뿐이지 절대적으로는 매파적 의지를 확인할 수 있었던 회의. 11월 인상 전망 유지\" 11월 경제전망을 확인해봐야 겠으나, 한은의 경기에 대한 자신감은 강함. 반도체 주가 하락에도 불구하고 반도체 가격 상승, 관련된 수출과 소득 여건 등의 효과를 훨씬 크게 보고 있어 올해와 내년 성장률 전망 모두 ‘상당폭 상회’를 언급. 물가 역시 당장 내년에 목표치 도달은 어렵다고 언급하는 것으로 보아 수요 측 물가 압力を 높게 보고 있음. 올해 11월 인상 및 내년 1분기 추가 인상을 한국 기준금리 3.50%까지는 무난하게 도달 가능. 그 이상은 내년 실제 경기 상황, 반도체 사이클 등에 달려있음.\" 10월 FOMC 회의에서는 기준금리를 동결할 것으로 예상되나 12월 인상 시그널이나 추후 인상 경로를 적극적으로 제시하지는 않을 것. 9월 회의 이후 물가 압력이 낮아지지 않았기 때문에 9월 점도표(중간값 4.1%)가 현실화될 가능성이 높다는 점에서 12월 인상은 유력하다는 기존 전망 유지.\" 주목할 부분은 9월 긴축 후 지금까지 금융환경에 대한 평가. 그간 중동 불확실성과 물가 압력 지속 외에도 빅테크 중심 주가 급락, 프랑스 재정 우려와 금리 급등과 같은 변화가 있었기 때문에 이를 긴축 연력과 연결해 어떤 평가를 내릴지가 중요함. 금융기관의 대출태도나 여건, 예금 및 대출 증가율 등 지표에 의하면 아직 미국 경제의 금융시장 상황이나 신용여건은 양호한 편임. 다만 현재 미국 실질금리는 국채 10년물 기준 1.59%로 상승 중이며 HY 회사채 스프레드 역시 대부분의 섹터에서 확대되며 금융환경의 변화는 나타나고 있음.\" 글로벌 채권 투매는 멈췄으나 금리 등락은 주요 주체의 적극적인 매수 유입이라기 보다는 주식시장 부진에 따른 안전자산 선호와 단기 투자자들의 유입에 따른 것. 주가 연동된 등락 지속될 것으로 보이나 내부적인 요인 고갈로 속도 조절 예상.\n\n**유진투자증권**: \"10월 금통위, 예상대로 만장일치 동결. 전쟁 및 미국 선거 등 여러 대외 불확실성 속에서 두 번의 선제적 인상 효과를 지켜볼 시간이 필요했기 때문.\" 이번 동결은 긴축 경로 상에 있는 잠깐의 휴식으로 한은의 긴축 의지는 여전했음. 11월 경제전망 상향을 예고하며 긴축 필요성 언급. 함.추가 인상이 선반영 됐기 때문에 금리 영향이 적었을 뿐이지 절대적으로는 매파적 의지를 확인할 수 있었던 회의. 11월 인상 전망 유지\" 11월 경제전망을 확인해봐야 겠으나, 한은의 경기에 대한 자신감은 강함. 반도체 주가 하락에도 불구하고 반도체 가격 상승, 관련된 수출과 소득 여건 등의 효과를 훨씬 크게 보고 있어 올해와 내년 성장률 전망 모두 ‘상당폭 상회’를 언급. 물가 역시 당장 내년에 목표치 도달은 어렵다고 언급하는 것으로 보아 수요 측 물가 압력을 높게 보고 있음. 올해 11월 인상 및 내년 1분기 추가 인상을 한국 기준금리 3.50%까지는 무난하게 도달 가능. 그 이상은 내년 실제 경기 상황, 반도체 사이클 등에 달려있음.\" 10월 FOMC 회의에서는 기준금리를 동결할 것으로 예상되나 12월 인상 시그널이나 추후 인상 경로를 적극적으로 제시하지는 않을 것. 9월 회의 이후 물가 압력이 낮아지지 않았기 때문에 9월 점도표(중간값 4.1%)가 현실화될 가능성이 높다는 점에서 12월 인상은 유력하다는 기존 전망 유지.\" 주목할 부분은 9월 긴축 후 지금까지 금융환경에 대한 평가. 그간 중동 불확실성과 물가 압력 지속 외에도 빅테크 중심 주가 급락, 프랑스 재정 우려와 금리 급등과 같은 변화가 있었기 때문에 이를 긴축 연력과 연결해 어떤 평가를 내릴지가 중요함. 금융기관의 대출태도나 여건, 예금 및 대출 증가율 등 지표에 의하면 아직 미국 경제의 금융시장 상황이나 신용여건은 양호한 편임. 다만 현재 미국 실질금리는 국채 10년물 기준 1.59%로 상승 중이며 HY 회사채 스프레드 역시 대부분의 섹터에서 확대되며 금융환경의 변화는 나타나고 있음.\" 글로벌 채권 투매는 멈췄으나 금리 등락은 주요 주체의 적극적인 매수 유입이라기 보다는 주식시장 부진에 따른 안전자산 선호와 단기 투자자들의 유입에 따른 것. 주가 연동된 등락 지속될 것으로 보이나 내부적인 요인 고갈로 속도 조절 예상.\n\n### 채권 수급: 하나증권 \"분점정부\"\n\n하나증권은 \"11월 3일 중간선거. 통합정부에서 분점정부로 11월 3일 미국 중간선거가 치러진다. 예측시장에 따르면 민주당의 하원 다수당 탈환 가능성이 매우 높고, 상원 다수당까지 위협하고 있다 [도표 1, 2]. 대통령과 양원 모두 공화당이 차지하는 통합정부에서 하원 혹은 양원을 민주당에 넘겨주는 ‘분점(Divided)정부’로 전환될 가능성이 높다. 중간선거의 금융시장, 특히 금리 영향은 (1) 중간선거가 없는 해와의 비교뿐만 아니라 (2) 중간선거 결과에 따른 차이까지 고려해야 한다.\"라고 전망했다.\n\n**하나증권**: \"11월 3일 중간선거. 통합정부에서 분점정부로 11월 3일 미국 중간선거가 치러진다. 예측시장에 따르면 민주당의 하원 다수당 탈환 가능성이 매우 높고, 상원 다수당까지 위협하고 있다 [도표 1, 2]. 대통령과 양원 모두 공화당이 차지하는 통합정부에서 하원 혹은 양원을 민주당에 넘겨주는 ‘분점(Divided)정부’로 전환될 가능성이 높다. 중간선거의 금융시장, 특히 금리 영향은 (1) 중간선거가 없는 해와의 비교뿐만 아니라 (2) 중간선거 결과에 따른 차이까지 고려해야 한다.\" \n\n**하나증권**: \"11월 3일 중간선거. 통합정부에서 분점정부로 11월 3일 미국 중간선거가 치러진다. 예측시장에 따르면 민주당의 하원 다수당 탈환 가능성이 매우 높고, 상원 다수당까지 위협하고 있다 [도표 1, 2]. 대통령과 양원 모두 공화당이 차지하는 통합정부에서 하원 혹은 양원을 민주당에 넘겨주는 ‘분점(Divided)정부’로 전환될 가능성이 높다. 중간선거의 금융시장, 특히 금리 영향은 (1) 중간선거가 없는 해와의 비교뿐만 아니라 (2) 중간선거 결과에 따른 차이까지 고려해야 한다.\" \n\n### 채권 수급: 하이투자증권 \"AI 투자\"\n\n하이투자증권은 \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0). 10년물은 4.10%로 4.10% 아래로 내려섰다. 하지만 10년물은 전일 대비 -3.6bp로 하락했으며, 지난주 대비 +4.5bp로 상승했다. 3년물은 전일 대비 -1.6bp로 하락했으며, 지난주 대비 +6.3bp로 상승했다. 3년물은 2.23%로 2.23% 아래로 내려셨다.\"라고 분석했다.\n\n**하이투자증권**: \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0). 10년물은 4.10%로 4.10% 아래로 내려셨다. 하지만 10년물은 전일 대비 -3.6bp로 하락했으며, 지난주 대비 +4.5bp로 상승했다. 3년물은 전일 대비 -1.6bp로 하락했으며, 지난주 대비 +6.3bp로 상승했다. 3년물은 2.23%로 2.23% 아래로 내려셨다.\" \n\n**하이투자증권**: \"10월 26일 국고채 3년물은 2.23%, 10년물은 4.10%로 마감했다. 전일 대비 3년물은 -1.6bp, 10년물은 -3.6bp로 하락했지만, 지난주 대비 3년물은 +6.3bp, 10년물은 +4.5bp로 상승했다. 수익률곡선은 플랫닝을 이어갔다. 국5/3은 14.7bp(-0.4), 국10/3은 30.0bp(-1.0). 10년물은 4.10%로 4.10% 아래로 내려셨다. 하지만 10년물은 전일 대비 -3.6bp로 하락했으며, 지난주 대비 +4.5bp로 상승했다. 3년물은 전일 대비 -1.6bp로 하락했으며, 지난주 대비 +6.3bp로 상승했다. 3년물은 2.23%로 2.23% 아래로 내려셨다.\"\n\n### 채권 수급: 유진투자증권 \"FOMC 동결\"\n\n유진투자증권은 \"10월 FOMC Preview: 긴축의 끝은 아닌 동결 Check Point- 미 연준, 10 월 FOMC 에서 기준금리 동결 전망. 9 월 인상 이후 연준 위원들은 추가 긴축 필요성을 인정하면서도 연속 인상에는 신중한 입장. 최근 AI 투자 수익성 우려에 따른 금융시장 변동성 확대까지 고려하면, 연준은 추가 인상에 앞서 기존 긴축의 파급효과를 점검할 것으로 예상. 추가 인상 여지는 유지하되, 시장 우려보다 덜 매파적인 FOMC 예상. 높은 물가와 견조한 경기 여건을 고려하면 연준은 12 월 이후 추가 인상 가능성을 열어둘 전망. 다만 이번 긴축이 물가 상승의 고착화를 방지하기 위한 보험성 대응이라는 점에서 연속 인상이나 인상폭 확대의 필요성은 낮다고 판단. 인상 가능성을 유지하면서도 속도 조절을 강조하는 매파적 동결 예상. 최근 미국채 금리는 위험회피 심리와 과도한 긴축 기대의 일부 되돌림으로 하락. 10 월 동결과 추가 인상 여지를 남기는 결정은 상당 부분 시장에 반영된 것으로 판단. 향후 금리의 추세적 하락 여부는 국제유가 안정과 물가 상승 압력 완화가 확인되는지에 달려 있을 전망.\"라고 전망했다.\n\n**유진투자증권**: \"10월 FOMC Preview: 긴축의 끝은 아닌 동결 Check Point- 미 연준, 10 월 FOMC 에서 기준금리 동결 전망. 9 월 인상 이후 연준 위원들은 추가 긴축 필요성을 인정하면서도 연속 인상에는 신중한 입장을 취한다. 최근 AI 투자 수익성 우려에 따른 금융시장 변동성 확대까지 고려하면, 연준은 추가 인상에 앞서 기존 긴축의 파급효과를 점검할 것으로 예상. 추가 인상 여지는 유지하되, 시장 우려보다 덜 매파적인 FOMC 예상. 높은 물가와 견조한 경기 여건을 고려하면 연준은 12 월 이후 추가 인상 가능성을 열어둘 전망. 다만 이번 긴축이 물가 상승의 고착화를 방지하기 위한 보험성 대응이라는 점에서 연속 인상이나 인상폭 확대의 필요성은 낮다고 판단. 인상 가능성을 유지하면서도 속도 조절을 강조하는 매파적 동결 예상. 최근 미국채 금리는 위험회피 심리와 과도한 긴축 기대의 일부 되돌림으로 하락. 10 월 동결과 추가 인상 여지를 남기는 결정은 상당 부분 시장에 반영된 것으로 판단. 향후 금리의 추세적 하락 여부는 국제유가 안정과 물가 상승 압력 완화가 확인되는지에 달려 있을 전망.\"\n\n**유진투자증권**: \"10월 FOMC Preview: 긴축의 끝은 아닌 동결 Check Point- 미 연준, 10 월 FOMC 에서 기준금리 동결 전망. 9 월 인상 이후 연준 위원들은 추가 긴축 필요성을 인정하면서도 연속 인상에는 신중한 입장을 취한다. 최근 AI 투자 수익성 우려에 따른 금융시장 변동성 확대까지 고려하면, 연준은 추가 인상에 앞서 기존 긴축의 파급효과를 점검할 것으로 예상. 추가 인상 여지는 유지하되, 시장 우려보다 덜 매파적인 FOMC 예상. 높은 물가와 견조한 경기 여건을 고려하면 연준은 12 월 이후 추가 인상 가능성을 열어둘 전망. 다만 이번 긴축이 물가 상승의 고착화를 방지하기 위한 보험성 대응이라는 점에서 연속 인상이나 인상폭 확대의 필요성은 낮다고 판단. 인상 가능성을 유지하면서도 속도 조절을 강조하는 매파적 동결 예상. 최근 미국채 금리는 위험회피 심리와 과도한 긴축 기대의 일부 되돌림으로 하락. 10 월 동결과 추가 인상 여지를 남기는 결정은 상당 부분 시장에 반영된 것으로 판단. 향후 금리의 추세적 하락 여부는 국제유가 안정과 물가 상승 압력 완화가 확인되는지에 달려 있을 전망.\"\n\n### 채권 수급: 하나증권 \"브라질 대선\"\n\n하나증권은 \"10월 25일 브라질 대선서 룰라 당선 확정. “1989년 이후 1차 패자가 결선에서 이긴 적 없다”는 경험칙이 깨짐. 룰라 승리의 동인은 예상보다 높은 투표율과 북동부 지지 기반의 결집- 룰라 변호인 출신 자닌 대법관이 룰라 캠프 요청으로 바이아주 3개 여부  \n4. 가장 강한 촉매인 대형 수출계약  \n\n해외 수주의 약 70%가 하반기에 집중되는 계절성 속에 메르츠 독일 총리 방한(10/29~31), UAE 대통령 국빈 방한(11월), 사우디·폴란드·페루 등 4Q26~2027년 수주 일정이 대기 중.\n\n과거 반등이 대부분 1개월 내 나왔다는 통계는 유효하나, 추세 전환은 실적 바닥 확인과 신규 수주가 결정할 것. 섹터 전반보다는 수주·실적 가시성이 높은 종목 중심의 선별적 비중 확대가 유효하다는 판단.\n\n---\n\n### AI: 방위산업의 새로운 전장\n\n새로운 폼팩터는 새로운 부품시장을 창출한다\n\n- 전기전자 산업은 새로운 폼팩터의 등장과 함께 성장해온 산업. 스마트폰의 등장으로 가전 대비 기기당 높은 부품 가치의 시장이 창출. 카메라모듈, FPCB, MLCC 등 관련 부품 시장 크게 성장\n- 이후 완성차 시장의 전동화 추세로 대당 전자부품 탑재량이 급증하며 전기전자 기업들의 새로운 먹거리로 전장 부품이 부상\n- 전동화에 따라 완성차 내 전자부품 비중은 19년 16% 수준에서 25년 35%까지 확대\n- 전장 부품시장은 연간 약 3,080억 달러 규모의 시장으로 성장했고 세트 부품 시장 규모 이상의 시장으로 성장\n- 35년까지의 연평균 성장률도 세트 부품 시장의 성장률을 상회할 전망으로 새로운 폼팩터는 전기전자 업체에 성장 동력이라는 사실을 다시 한번 확인\n\n---\n\n### 방산: Blue Wave가 국방비를 줄인다는 오해\n\nBlue Wave 우려에 흔들린 미국 방산주: 하지만 정당보다 중요한 것은 소요\n\n- 최근 미국 방산주 조정에는 중간선거에서 민주당이 상·하원을 모두 장악하는 ‘Blue Wave’에 대한 경계감이 반영. 민주당의 의회 장악이 트럼프 대통령의 대규모 국방비 증액 구상을 제약할 것이라는 우려\n- 그러나 민주당의 의회 장막을 국방비 감소로 연결하는 것은 과도한 해석. 민주당이 양원 다수당이었던 2007~2010년에도 미국 국방 지출은 증가했으며, 2012~2015년의 감소는 이라크·아프간 전쟁 축소와 예산통제법(BCA)에 따른 재정긴축이 겹친 결과\n- 국방비를 좌우하는 것은 정당 구성보다 군사적 소요와 재정정책. 증액 폭이 조정될 가능성은 있으나 이를 방위산업 전반의 성장 둔화로 확대 해석할 필요는 없다고 판단\n- 특히 이번 실적발표에서 확인된 탄약·미사일의 중장기 수요에 주목. RTX는 10월 20일 컨퍼런스콜에서 기본합의가 약 700억 달러 규모의 계약으로 전환되며 약 10년의 수요 가시성을 확보했다고 설명. 관련 탄약 생산 속도를 기존 대비 2~4배로 확대하고, 향후 2년간 증산을 본격화해 2030년경 본격 양산 수준에 도달할 계획을 제시\n- 록히드마틴도 10월 22일 실적발표에서 PAC-3·THAAD·GMLRS·PrSM 증산에 힘입어 3분기 미사일·화력통제(MFC) 부문 매출과 영업이익이 각각 전년 대비 24% 증가했다고 발표\n- 미국의 탄약 증산은 러우전쟁과 중동 전쟁 장기화로 미군 보유 재고가 역사적 저점까지 떨어진 데 따른 것으로 의회 구성과 관계없이 초당적 지지를 받을 수밖에 없는 정책으로 판단\n\n---\n\n### 화장품: 로레알 실적 함의: K-뷰티에는 ODM도 있다!\n\n3Q26 Review: 시장기대치 상회. 프로페셔널 및 더마 고성장\n\n- 3분기 로레알 매출액은 115.6억유로(YoY 12%, 조정 LFL 8%)를 기록하며 시장 기대치 상회(컨센서스 조정LFL +5.4~5.9%). 실적 발표 이후 주가는 2024년 6월 이후 최고치 기록. 4개 사업부 모두 판매량 성장 시현하며 긍정적. 사업부별로는 프로페셔널(조정 LFL 기준, 이하 동일) +14%, 컨슈머 +4%, 럭스 +7%, 더마 +14%를 기록. 특히 프로페셔널과 더마 부문 강세 시현. 프로페셔널 부문은 시장 대비 약 2배 이상 성장했으며, 로레알 글로벌 점유율은 3년전 2위에서 1위로 상승. 더마 부문은 시장 대비 1.5배 이상 성장. 특히 유럽 폭염과 유럽 세라비 신제품 출시 영향으로 더마 사업부의 선케어 매출이 YoY 20% 증가. 지역별로는 유럽 +9%, 북미 +6%, 북아시아 +8%, SAPMENA-SSA +20%, 중남미 -3%를 시현.\n\n[전체 시장 성장률] 3분기 글로벌 화장품 시장은 YoY 5% 증가해 상반기와 유사한 성장률을 기록했으며, 4Q도 유사한 수준으로 전망. 더마 시장은 10% 성장하며, 로레알 산하 브랜드(라로슈포제, 세라비, 스킨수티컬즈) 모두 두 자릿수 성장을 지속했음. 특히 의료 에스테틱 시술을 받은 소비자들의 더마 스킨케어 수요가 확대되는 중이며, GLP-1 확산으로 스킨케어 소비에 영향을 미치고 있다고 언급. 중국에서는 프리미엄 화장품 시장이 매스 시장 대비 상대적으로 견조한 흐름을 보이고 있다고 언급.\n\n---\n\n### 반도체: 메모리 반도체 수출 급증, 낙폭 축소\n\n데이터 포인트 및 주간 리뷰: 낙폭은 축소\n\n- 10월 20일까지 영업일 평균 메모리 반도체 수출금액은 전년 동월 대비 219% 증가한 15.8억 달러를 기록했다. 10월 10일까지의 잠정치인 12.3억 달러와 비교하면 28.6% 증가했으며, 전월 대비 감소폭도 16%로 축소됐다. 구체적으로 DRAM은 전년 동월 대비 475% 증가한 9.1억 달러, NAND는 303% 증가한 1.5억 달러를 기록했으며, MCP와 SSD는 각각 78%, 304% 증가한 4.7억 달러와 1.8억 달러를 달성했다. 전월 대비로는 DRAM이 9% 증가한 반면 NAND와 MCP, SSD는 각각 9%, 38%, 45% 감소했다. 전년 동월 대비 전 품목의 증가세가 이어진 가운데, 10월 초 대비 수출금액이 빠르게 회복되고 있다. 지난주에 언급했듯이 9월이 분기 말이었기 때문에 전월 대비 감소가 확인될 가능성은 배제할 수 없다.\n\n코스피 지수는 2.1% 하락하며 4주 연속 부진이 이어졌다. 삼성전자는 보합, SK하이닉스는 0.4% 상승해 오랜만에 지수 대비 선방했다. 국내 메모리 업체들의 주가는 Meta 실적 발표에서 FCF 음전환과 내년 Capex에 대한 부담으로 인해 AI 투자 관련 우려가 재차 불거지며 주가 하락폭이 커졌는데, 저가 매수가 유입되며 낙폭을 만회했다. 예상보다 양호한 메모리 가격이 형성되고 있지만, 여전히 매크로 및 AI 투자 관련 우려가 상존하는 상황이다. 이번 주 실적 발표에서 유의미한 주주환원 및 2027년 및 2028년 업황 관련 코멘트가 중요할 것으로 예상된다.\n\n코스닥 지수는 5.4% 하락해 3주 연속 하락했다. 하나증권이 커버하는 업체들의 주가 역시 모두 하락 마감했다. 최근 지수 하락 속에 차익 실현 매도도 일부 진행된 것으로 파악된다. 그래도 실적 모멘텀이 양호한 업체들의 낙폭이 상대적으로 작았다. 단기뿐만 아니라 2027년 실적에 대한 기대감이 유효해야 한다. 피에스케이홀딩스, 피에스케이, 테스는 3~4분기는 물론 내년 외형 성장률이 업종 내에서도 차별화될 것으로 기대되어 지속 추천한다.\n\n---\n\n### 원자재: 10월 5주차 코멘트\n\n- 국내 재생에너지 설비는 10/21 기준 41.04GW로 석탄(40.76GW)을 처음으로 상회. 다만 지역별 전기요금제 도입이 재생에너지 투자 확대의 변수로 부상. 정부는 비수도권 산업용 전기요금 인하를 추진하고 있으나, 지역별 도매가격제(LMP) 도입 시 발전사업자의 판매단가 하락과 기업의 직접 PPA 계약 유인 약화 우려로 인한 재생에너지 업계 반발이 부상할 것으로 예상\n\n미국 태양광의 경우, T1 Energy가 Section 232 재고축적 규정 관련 셀 1.7GW 수입 웨이버(예외)를 승인받음. 텍사스 모듈 공장 가동에 수입셀이 필요하며, 신규 셀 공장은 1Q27 첫 생산 목표. 이번 승인은 재고축적 제재 면제로 12/4 시행 MIP 및 15% 관세 면제와는 별개. Texas 자료(10/19 발간)에서 다룬 바와 같이 미국 셀 생산 확대 전까지 수입 의존이 불가피한 상황으로 보임\n\n풍력의 경우, 10/22 미 상무부는 Section 232 조사에서 수입 풍력터빈 및 부품이 국가안보를 위협한다고 판단했으며, 트럼프 대통령은
