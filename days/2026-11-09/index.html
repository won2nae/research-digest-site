n\n**WTI 유가 하락 -4.91%**\n\nWTI 선물이 뉴욕상업거래소(NYMEX)에서 배럴당 약 86달러로 마감, 전일 대비 3.98달러 하락해 약 2개월 반 만의 최저치를 기록했다. 유가 하락이 인플레이션 우려를 완화하면서 주식 시장 반등과 맞물린 흐름이었다.  \n출처: *Daily Kochi* (daily.co.jp), *Shikoku Shimbun*, *Kumamoto Nichinichi Shimbun* (일본 언론 복수)\n\n---\n\n**원/달러 환율 하락 -1.61%**\n\n4거래일 연속 하락 이후 원화가 반등해 달러당 1,347.1원에 마감했다. 위험선호 심리 회복과 수출업체의 달러 매도가 원화 강세를 이끌었다.  \n출처: *세계일보*, *강원도민일보*, JKN뉴스\n\n---\n", "news_md": "## 미국 뉴스\n\n- **Nvidia 주가 3~5% 급락**: 젠슨 황 CEO가 혼외 관계를 인정하고 이사회가 중국 스파이 의혹 조사를 착수한다고 밝히면서 시간외 거래에서 주가가 하락했다. *(NYT, The Guardian, Forbes)*\n\n- **트럼프 발언에 국제유가 하락**: 트럼프 대통령이 이란 추가 공습 가능성이 낮다고 밝히며 브렌트유는 배럴당 약 97달러, WTI는 약 90달러로 떨어졌다. *(Reuters, WSJ, CNBC)*\n\n- **중국, 미국산 추가 관세 2개월 추가 유예**: 국무원 관세위원회가 11월 10일부터 2개월간 대미 추가 관세 부과 유예를 연장하기로 결정했으며, 기존 10% 관세는 유지된다. *(Reuters, Bloomberg)*\n\n- **금 현물가 1.6% 상승**: 유가 하락으로 인플레이션 우려가 완화되면서 금 현물가는 온스당 4,129.69달러를 기록했으며, 시장은 미국 CPI 발표와 연준 신호를 주시하고 있다. *(Reuters, CNBC)*\n\n- **나스닥 반등에 아시아 증시 동반 회복**: 반도체주 회복과 유가 하락이 긍정적 재료로 작용하며 닛케이가 전 거래일 대비 2.4% 상승했다. *(Reuters, WSJ)*\n\n## 한국 뉴스\n\n- **여야, 증시 급락 책임 공방**: 한국 증시 하락을 둘러싸고 국민의힘이 대통령 사과와 경제 당국자 책임을 요구하는 등 정치권 논쟁이 벌어졌다. *(한겨레, YTN, 데일리안)*\n\n- **FBI, 바이낸스 역대 최대 해킹 북한 연계 그룹 소행 지목**: 10월 29일 발생한 바이낸스 가상자산 대규모 도난 사건을 FBI가 북한 연계 해킹 조직 TraderTraitor(라자루스 그룹)의 소행으로 특정했다. *(매일경제, 블록미디어)*\n\n- **황우석, UAE 국적 취득으로 한국 국적 상실**: 줄기세포 조작 사건으로 실형을 받은 황우석 전 교수가 UAE 국적을 취득해 한국 국적을 잃었다고 관보에 공고됐다. *(조선일보, 연합뉴스)*", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 미국 고용: 서프라이즈 상회로 경기 하방 우려 완화\n\n10월 미국 비농업 고용이 16.5만 명 증가해 시장 예상치(6.5만 명)를 크게 상회했다. 8~9월 고용도 8.4만 명 상향 조정되어 최근 3개월 평균 증가폭이 13.7만 명으로 올해 월평균(8.6만 명)을 웃돈다. 전문·사업서비스(+7.0만 명), 교육·보건(+5.3만 명), 운송·창고(+2.5만 명)이 증가를 이끌었고, 민간 고용이 15.9만 명 늘어 증가분 대부분을 차지했다. 경제활동참가율이 61.8%에서 61.9%로 높아진 가운데 실업률은 4.2%에서 4.1%로 하락했다. 노동공급이 늘어나는 과정에서 실업률이 낮아지고 이전 고용 흐름도 개선됐다는 점에서, 노동시장 약화와 경기 둔화에 대한 우려를 일부 덜어낸 결과다.\n\n고용의 질은 양호했지만, 일부 근로자의 불완전취업과 장기 실업에 대한 부담은 남은 모습이다. 가계 조사에서 풀타임 고용이 71.4만 명 늘고 파트타임 고용은 24.2만 명 감소하면서 고용 구성은 개선됐다. 그러나 근로시간 단축형 비자발적 파트타임이 35.6만 명 늘었고, 평균 실업기간도 24.8주에서 27.1주로 길어졌다. 27주 이상 장기실업자는 3개월 연속 늘어 전체 실업자의 약 28%를 차지했다. 기업 전반의 노동 투입 축소로 해석하긴 어렵지만, 기업이 인원 대신 근로시간을 조정하고 실직자의 재취업은 더뎌지고 있는 만큼 헤드라인 증가를 노동수요의 전반적인 회복으로 해석하기는 이르다고 생각한다.\n\n소득 측면에서는 고용 반등이 근로자의 구매력 개선으로 연결되지 못하고 있는 점이 이어지고 있다. 시간당 평균임금 상승률은 전년 동월 대비 3.1%로 소폭 둔화됐고, 실질임금은 4월부터 9월까지 연속 마이너스 증가율을 기록했다. 3분기 비농업 기업부문 노동생산성이 전년 대비 2.1% 증가하는 동안 실질 시간당 보수는 1.0% 증가에 그쳤고, 노동소득분배율은 53.0%로 1947년 집계 이후 최저 수준까지 낮아졌다. 생산 확대에도 노동보상의 몫은 줄어든 것으로, 성장의 성과가 노동소득으로 충분히 확산되지 못하고 있음을 시사한다. 10월 고용은 일자리 증가세가 개선됐지만, 소비 확대를 뒷받침할 소득 여건의 회복은 제한적이라는 판단이다.\n\n### AI 투자 공포 과도: 증가율 속도의 문제일뿐\n\n블루웨이브가 데이터센터 건설 중단 우려를 자극하면서 AI 공포가 글로벌 금융시장에 큰 충격을 주었다. 그러나 주목되는 것은 AI 투자 공포가 부각되었지만 충격이 전방위로 확산되는 분위기는 아니다. AI 사이클을 주도하고 있는 하이퍼스케일러보다 미국 경우 반도체업체, 국가별로는 한국, 일본 및 대만 등 반도체 벨류체인 국가에 충격이 국한되었다. <그림1>에서 볼 수 있듯이 미국 중간선거 직전일 대비 미국 주요 주가와 주요국 주가지수간에는 확연한 차이를 보여주고 있다. AI 투자 공포 쓰나미의 직격탄을 맞은 것은 하이퍼스케일러보다 필라델피아 반도체지수 및 국가별로는 한국, 일본 및 대만이다.\n\n이러한 주가 차별화는 이번 블루웨이브 쇼크를 닷컴 버블 붕괴와 같은 금융위기 충격으로 확대 해석하는 것을 경계해야 함을 의미한다. 즉, AI 투자 붐의 종료보다는 데이터센터 건설지출, 더 나아가 하이퍼스케일러 자본지출 전망치의 일부 하향 조정 리스크가 부각된 정도로 해석해야 한다.<표1>에서 볼 수 있듯이 그 동안 금융시장은 27년 데이터센터를 포함한 하이퍼스케일러 자본지출에 대해 긍정적 시각을 유지해왔다. 27년에도 데이터센터 지출은 10% 초반~30% 증가하고 하이퍼스케일러 자본지출 규모는 약 40% 내외 증가한 1조 달러를 전망했다. 그런데 이러한 낙관적 AI 투자 지출에 대해 투자 수익성 우려와 함께 블루웨이브발 데이터센터 건설 우려가 동시에 부각되면서 낙관적 AI 투자 시나리오에 불확실성이 드리워진 것이다.\n\n텍사스 등 데이터센터 건설이 활발하게 진행되던 일부 주에서 민주당 상원 의원뿐만 아니라 민주당 주지사가 당선되면서 데이터센터 건설이 차질을 빚을 가능성은 커졌다. 당선인 입장에서 데이터센터 건설지출과 관련된 주민들의 반발을 무시하기 어렵기 때문이다. 그러나 이러한 분위기가 곧바로 데이터센터 건설 중단을 의미하지는 않는다. 지역 여론을 의식해 건설 지연 내지 일부 축소 정도로 이어질 공산이 높아 보인다. 데이터건설 지출액 및 하이퍼스케일러 자본지출 증가율이 다소 둔화될 수 있음을 시사할 뿐이다.\n\n하이퍼스케일러의 전체 자본지출액대비 데이터선터 건설비 지출액은 약 11% 수준에 불과하다. 따라서 데이터선터 건설 지연이 하이퍼스케일러 자본지출에 미치는 영향도 크지 않을 수 있다. 하이퍼스케일러 자본지출 증가율이 블루웨이브으로 소폭 둔화될 수 있지만 하이퍼스케일러 자资本지출이 중단 내지 급격히 감소할 가능성이 극히 낮다. 더욱이 투자 수익성 우려가 제기되고 있음에도 하이퍼스케일러는 자본지출을 위한 대규모 회사채 발행 등을 이어가고 있음은 올해는 물론 내년에도 자본지출을 확대하겠다는 의지로 해석된다. 물론 일부 중소형 AI 기업들을 중심으로 생존게임이 격화되면서 파산 혹은 M&A 등이 증가할 여지는 있지만 이러한 현상이 하이퍼스케일러 자본지출의 급격한 둔화를 의미하지는 않는다는 판단이다.\n\n### AI 투자 불확실성에 달러와 원화 동시 약세\n\n달러화지수 101p선 중반 등락. 미국 중간선거 이후 민주당의 데이터센터 규제 강화 가능성이 AI 투자와 성장 기대 낮추며 약 달러 요인 작용. 미국 국채금리 하락과 추가 인상 기대 후퇴 동반되며 101p 초반까지 하락. 다만 주 후반 기술주 급락에 따른 안전자산 수요와 미국 고용보고서 발표 경계 맞물려 하락 제한. 달러/유로 1.12달러대 등락. 미국 금리 하락과 성장 기대 조정에 반등했으나 주 후반 위험회피 심리 확산되며 상승분 일부 반납. 엔/달러는 157~158엔대 등락하며 완만한 엔화 강세 전개. 미국 국채금리 하락과 안전자산 선호가 엔화 가치 지지. 원/달러 주중 1,340원대에서 등락하다 1,350원 후반대까지 상승. 수출업체 네고 물량과 외국인 주식 매도 관련 달러 수요 상충하며 원/달러 박스권 흐름 이어가다 미국 AI 및 반도체주 급락으로 위험회피 확산되며 상방 우위 전환. 대외 강 달러 압력 완화 및 반도체 수출업체 달러 매도에 따른 상단 제한에도 외국인 자금 이탈과 국내 위험자산 조정 영향 우세.\n\n### AI 투자 방향 자체 전환보다 인허가 및 전력비 부담에 따른 집행 속도 조절에 무게\n\n미국 중간선거에서 민주당이 상원과 하원 모두 다수당 확보. 행정부 견제와 조사 강화, 데이터센터 규제 가능성이 정책 불확실성으로 부각. AI 투자 방향 자체 전환보다 인허가 및 전력비 부담에 따른 집행 속도 조절에 무게. 투자 회수와 수익화까지 시차 길어지며 데이터센터 중심 성장 지속성 의구심 부상.\n\n### 미국 10월 ISM 제조업지수 54.5→55.5로 상승한 반면 비제조업 54.9→54.5로 하락하며 경기 모멘텀 차별화\n\nISM 제조업지수 54.5→55.5로 상승한 반면 비제조업 54.9→54.5로 하락하며 경기 모멘텀 차별화. 지불가격은 제조업 75.2, 비제조업 73.0으로 모두 둔화됐으나 높은 수준 유지. 서비스업 납기 지연과 연료비 상승 이어져 중동 사태 장기화에 따른 비용 부담 및 향후 가격 전가 위험 잔존.\n\n### 미국 10월 ADP 민간고용 8.6만명 증가\n\n시간당평균임금 상승률 전년대비 3.2%로 안정적. 3분기 생산성은 전기대비연율 3.6% 올라 시간당 보상 증가율(2.9%) 상회. 단위노동비용 0.7% 감소. 고용 증가에도 생산성 개선이 임금 부담 흡수해 노동비용발 물가 압력은 미미.\n\n### 한국 10월 수출 전년대비 93.7%, 일평균 기준 76.0% 증가\n\n반도체 단가 상승 속 데이터센터 투자 관련 품목 수출 호조세가 확산. 다만 투자 연관 품목 제외한 수출 부진해 광범위한 수요 회복 해석하기엔 제한. 소비자물가는 신선식품 안정에 전년대비 2.8% 상승해 둔화. 다만 핵심물가 오름세 유지.\n\n### AI 자금 흐름이 결정하는 환율과 달러화 가치\n\n기술 혁신 구간 환율은 금리 차보다 미래 이익을 어느 국가가 향유하는지에 민감하다. AI 밸류체인을 따라 움직이는 교역 대금 환전과 주식 자금 배분이 주된 설명 변수로 부상했다. 환율은 자금 유입 규모보다 증분에 반응한다. 2027년 상반기는 미국 금리 인상 경계 완화 속 달러 숨고르기를 예상한다. 하반기에는 AI 수익화 기대에 선택적 달러 강세가 나타날 전망이다. 달러지수는 연간 보합 수준이나 상반기보다 하반기 중 상대적 강세가 예상된다.\n\n### 공급 복원 이후 원자재 가격 차별화\n\n가용 물량 복원과 재고 흡수 속도가 가격 차별화 결정 2027년 원자재 시장은 2026년 위축된 가용 공급이 복원되는 국면이다. 2026년 충격은 생산 감소보다 호르무즈 물류 병목과 관세 등 교역 정책이 가용 물량을 줄인 결과였다. 2027년에는 중동 생산과 기존 교역 경로가 회복되지만 실수요는 충격 이전 수준 복귀에 그치고 공급원 다변화도 제한적이다. 가격은 가용 물량, 재고 복원과 비축의 흡수 속도, 정책 및 금융 여건에 따라 품목별로 차별화된다.\n\n### 자산배분에서 위험배분으로\n\n주식과 채권의 동행 시대. 위험 배분 방식 변화 요구 주식과 채권이 반대로 움직인다는 전제가 약해졌다. 미국 주식과 국채의 상관계수는 2001~2020년 -0.35에서 2022~2023년 +0.69로 바뀌었다. 2026년에도 양의 상관관계를 이어간다. 2022년 6:4 포트폴리오 수익률은 -16.5%로 채권이 손실을 거의 줄이지 못했다. 자산을 나눠 담아도 위험의 90% 이상은 주식에서 발생했다. 2026년에도 주식이 오르는 동안 한국 국채 30년은 -18.1% 수익률을 기록했다. 2027년에는 AI 투자 둔화, 재정 부담, 물가 재상승 위험, 원화와 주가의 관계 변화로 같은 위험이 여러 자산에 중첩된다. 따라서 어떤 자산을 담을지보다 어떤 위험을 얼마나 질지를 먼저 정해야 한다. 위험 출처마다 감수할 손실의 한도를 정하고 방어 수단은 충격의 종류별로 나눈다.\n\n### AI 사이클 중반부, 투자 고원과 조달 의존 확대\n\nAI와 국가자본주의의 성장 효과에 주목했던 시장은 2026년 하반기부터 투자 회수와 조달 비용을 검증하고 있다. 2027년 하이퍼스케일러 AI 투자는 1조달러를 넘어서나 증가율은 30%대 중반으로 낮아지는 고원 구간이다. 누적 공사와 장비 설치가 투자를 지지하나 신규 착공 지연은 중반 이후 미국 건설 파생 수요를 약화시킨다. 건설과 장비의 시차로 미국 내수와 하드웨어 공급국의 수혜 경로도 달라진다. 수익이 투자비를 따라잡기 전까지는 외부 차입이 필요하기에 자금 조달 여건이 AI 사이클의 지속 여부를 가른다.\n\n### Time of Tempering\n\nAI 사이클 중반부, 투자 고원과 조달 의존 확대 AI와 국가자본주의의 성장 효과에 주목했던 시장은 2026년 하반기부터 투자 회수와 조달 비용을 검증하고 있다. 2027년 하이퍼스케일러 AI 투자는 1조달러를 넘어서나 증가율은 30%대 중반으로 낮아지는 고원 구간이다. 누적 공사와 장비 설치가 투자를 지지하나 신규 착공 지연은 중반 이후 미국 건설 파생 수요를 약화시킨다. 건설과 장비의 시차로 미국 내수와 하드웨어 공급국의 수혜 경로도 달라진다. 수익이 투자비를 따라잡기 전까지는 외부 차입이 필요하기에 자금 조달 여건이 AI 사이클의 지속 여부를 가른다.\n\n### Capital Race\n\nTime of Tempering경제전망 시장의 관심은 AI Capex에서 투자한 돈을 언제 회수하고 비용을 감당할 수 있는지로 옮겨갔다. 2027년 하이퍼스케일러 투자는 약 1조 700억달러로 늘지만 증가율은 2026년 4분기 109%에서 2027년 4분기 20%로 낮아진다. 투자 규모는 커지지만 늘어나는 속도는 꺾이는 구간이다. 수익이 투자비를 따라잡기 전까지는 외부 차입이 필요하기에 자금 조달 여건이 AI 사이클의 지속 여부를 가른다.지금의 고금리는 성장 기대가 아니라 물가와 국채 공급 부담이 끌어올린 '불편한 고금리'다. 미국 10년 금리 상승분의 80%가 금리 인상 기대에서 나왔다. 물가를 낮출 열쇠는 공급 충격 회복이다. 중동 원유 생산 차질은 5월 하루 1,090만배럴에서 9월 480만배럴로 줄었고, 2027년 2분기 말 정상화가 기대된다. 비용 부담이 주거비와 인건비로 번지지 않으면 물가는 연초부터 둔화되고 중반 이후 안정 속도가 빨라진다. 연준은 1분기까지 1~2차례, 한국은행은 2차례 인상한 뒤 동결하고, 하반기에는 금리 인하 기대가 다시 나올 수 있다.주요국 성장은 AI 수혜와 내수 회복 속도에 따라 갈린다. 2027년 성장률은 미국 2.1%, 유로존 1.3%, 중국 4.1%, 한국 3.0%로 예상한다. 한국은 반도체 이익이 투자, 재정, 성과급으로 퍼지며 3% 성장을 이어간다. 가장 큰 위험은 AI 투자 회수가 늦어지는 가운데 금융회사의 자금 공급 여력까지 약해지며 신용 불안이 AI 밖의 부문으로 번지는 경로다. 2027년은 투자가 확산되느냐, 금융위험이 번지느냐의 갈림길이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 채권 시장의 파노라마\n\n### ① AI 위협에 연준이 할 수 있는 모든 것을 다 해봤다\n\nAI 산업의 탄핵 위기로 연준이 비금융기업을 구제할 수 있는 법적 도구를 검토하고 있다. 연준법 제13-3조가 최후의 버팀목인데, 2010년 Dodd-Frank법 이후 개별 기업 구제는 사실상 불가능하다. CARES Act 같은 특별법이 없다면 2020년 통합세출법에 의해 ESF를 통해 기업에 출자를 할 수도 없는 상황이다.\n\nCPFF처럼 기업어음을 매입하는 방식이 가장 현실적이라는데, 여기서 문제가 된다. 초우량(A1)이며 만기가 3개월 이내인 기업어음만 해당된다. 하이퍼스케일러 5개사 중 초우량을 충족하거나 충족할 수 있는 건 아마존과 MS 정도다. 오라클은 A3 등급이라 제외되고, 기업어음 잔액이 있는 것도 아니다. \n\n두 번째로 생각되는 것은 PDCF와 유사한 방식으로 AI 회사채와 CP를 거래하는 딜러들을 지원하는 방식이다. 시장조성이라는 명분으로 출자는 필요없다. 하지만 이건 기업을 직접 구제하는 것이 아니라 간접 지원이므로 효과는 의문이다. 세 번째로는 AI 기업 대출 익스포저가 많은 은행을 지원하는 BTFP 방식이다. 역시 간접 지원에 머무르고 있다.\n\n### ② 연준의 인상 사이클이 아직 끝나지 않은 이유\n\n10월 고용보고서가 연준의 인상 사이클을 멈추지 않도록 만들었다. 비농업고용이 16.5만 명 증가하며 예상치(7만 명)와 전월 수정치(6만 명)를 크게 상회했다. 8, 9월 수치도 8.4만 명 상향 조정됐다. 다만 월별 변동성이 큰 고용데이터를 그냥 추세로 보기엔 무리다. 민간 고용지표와 이동평균을 함께 보면 월 5만~10만 명 수준의 완만한 고용 증가는 이어지고 있다.\n\n민간 고용이 증가했는데, 정부(0.6만 명)보다 민간(15.9만 명)에서 증가했다. 세부적으로 전문 및 사업서비스, 운송업, 제조업이 두드러졌다. 기업의 단기 인력 수요를 보여주는 임시인력 서비스 고용도 증가했다. 전체 고용에 선행하는 업종의 회복은 노동수요 회복이 이어질 가능성을 시사한다.\n\n실업률(10월 4.14%) 하락 압력으로 작용하고 있는데, 실업률을 변화시키지 않는 월간 균형 고용이 5만 명 안팎으로 추정된다. 10월에는 경제활동참가율 상승과 취업자 증가가 동시에 나타났다. 실업률 하락을 긍정적으로 평가한다. 다만 비자발적 시간제 취업자가 늘고 광의실업률이 상승한 점은 기업의 인력 수요 회복이 충분한 근로시간 확보로 이어지지는 못했음을 보여준다.\n\n임금 상승률은 낮아지는 추세지만 추가 하락 여력은 제한적이다. 시간당 평균임금은 전년동월대비 +3.1%로 9월(3.2%)보다 하락했다. 그러나 최근 3개월 연율 기준 +3.9%로 높아졌다. 임금 상승률은 노동시장 수급 여건에 후행한다. 9월 실업자 1명당 구인건수는 1.06건으로 v/u 비율은 1.06배다. 2022년 2배에서 2025년 0.9배까지 하락하면서 노동시장 수급이 완화됐지만, 지금은 그 추세가 끝났다. 임금 상승률 둔화 추세가 약해지고 있다는 의미다.\n\n### ③ 연준보다 금융시장이 먼저 반응한다\n\n고용 서프라이즈와 이전치 상향으로 노동시장 둔화 우려가 완화되면서 연준이 물가 대응에 집중할 여지가 커졌다. 올해 12월, 내년 3월 2회 추가 인상 전망을 유지한다. 단, 투자자들은 연준보다 금융시장(주가)에 보다 민감하다. 잠재적인 경기 둔화 리스크를 우려하는 상황에서 주가 반등이 뚜렷하지 않을 경우 시장금리의 상승 폭은 제한적일 전망이다. 금리선물시장에 반영된 12월 금리 인상 확률은 68.4%에서 77.5%로 상승했다.\n\n### ④ AI 투자 위축 우려와 증시 급락에 위험회피가 확산\n\nAI 투자 위축 우려와 증시 급락에 위험회피가 확산하면서 달러-원 1,356.60원으로 14.50원 상승했다. 높아진 환율에 수출업체 네고가 나오며 오름폭이 축소됐다. 안전자산 선호와 코스피 급락이 강세를 이끌고 외국인의 3년 국채선물 매수가 가세했으며, 중단기 금리가 더 크게 내려 수익률곡선이 가팔라진 가운데 장 막판 장기물 강세 일부 축소.\n\n### ⑤ 인상 종료 기대를 앞서 반영한 금리\n\n10월 이후 국고채 시장은 전반적인 금리 하락 속에서 장기물의 상대 강세가 두드러졌다. 9월 말부터 10월 말까지 국고 3년 금리는 4.015%에서 3.710%로 30.5bp 하락한 반면, 10년과 30년 금리는 각각 41.0bp, 41.8bp 하락했다. 이에 국고 3/10년 금리차는 40.0bp에서 29.5bp로 축소됐다. 추가 인상에 대한 경계 완화와 함께 미국 국채금리 하락, 국내 장기물 수요 등이 복합적으로 작용한 흐름으로 해석된다. 11월 초에도 이러한 흐름은 이어졌다. 10월 말부터 11월 6일까지 국고 3년 금리는 9.5bp, 5년·10년·30년 금리는 각각 14.0bp, 15.0bp, 14.0bp 하락했고, 3/10년 금리차는 24.0bp까지 좁혀졌다. 강세의 중심이 중단기물로 이동했다기보다 장기물 우위가 유지되는 가운데 중기 구간에서도 금리 하락이 이어진 모습이다.\n\n### ⑥ 추가 인상에 대한 부담보다 이후 인상의 폭과 지속 기간에 대한 기대가 낮아지고 있을 가능성을 시사한다\n\n11월 초 국고 1년 금리는 3.555%에서 3.590%로 3.5bp 상승했지만, 2년과 3년 금리는 각각 10.8bp, 9.5bp 하락했다. 그 결과 11월 6일 1년·2년·3년 금리는 각각 3.590%, 3.597%, 3.615%로 수렴했고, 1/3년 금리차는 15.5bp에서 2.5bp로 축소됐다. 만기별 수급의 영향을 함께 고려해야 하지만, 이러한 움직임은 당장의 추가 인상에 대한 부담보다 이후 인상의 폭과 지속 기간에 대한 기대가 낮아지고 있을 가능성을 시사한다. 시장이 11월 인상 여부를 넘어 인상 종료 시점과 이후 정책 경로를 선제적으로 반영하고 있다는 해석이다.\n\n### ⑦ 추가 인상 필요성을 재확인한다면 낮아진 최종금리 기대가 일부 되돌려질 수 있다\n\n9월 말 이후 11월 6일까지 국고 3년은 40.0bp, 10년과 30년은 각각 56.0bp, 55.8bp 하락했다. 특히 1~3년 구간의 금리차가 크게 축소되면서 만기를 늘려 확보하는 추가 금리 보상도 줄었다. 오는 11월 금통위에서 한은이 추가 인상 필요성을 재확인한다면 낮아진 최종금리 기대가 일부 되돌려질 수 있다. 따라서 최근 하락 추세만을 근거로 매수를 확대하기보다, 현재 금리에 반영된 정책 기대가 한은의 실제 판단으로 뒷받침되는지 확인하고 만기별 금리 매력 역시 비교할 필요가 있다.\n\n### ⑧ CP금리를 중심으로 단기 조달 비용이 급격히 상승했다\n\n국고 3년 금리는 9월 말 이후 하락 흐름을 이어가며 주중 3.6%대까지 진입한 반면, CP 91일물(A1) 금리는 같은 기간 꾸준히 상승하며 11/4일 기준 3.82% 수준을 기록했다. 그간 국고 3년물을 크게 밑돌던 CP금리가 두 달 사이 국고 3년물 수준을 넘어선 것이다. 7~8월 두 차례의 기준금리 인상 이후 장기 금리(CP 대비 상대적)는 추가 인상 기대를 일부 되돌리는 흐름을 보였으나, 단기 조달시장에서는 오히려 금리 상승 압력이 이어진 셈이다.\n\n그 결과 CP 91일물과 국고 3년물 간 금리차는 9월 말 -70bp에서 최근 +10bp 초반 수준으로 전환되었다. 회사채 AA- 3년물과 CP 91일물 간 금리차 역시 137bp에서 약 60bp로 절반 이하로 좁혀졌다. 같은 기간 회사채 AA- 3년 스프레드가 70bp 내외에서 안정적이었던 점을 감안하면, 금리차 축소는 회사채 금리 하락보다는 CP금리 상승에서 비롯된 부분이 컸다.\n\n1)올해 들어 상대적으로 금리 부담이 낮았던 CP를 중심으로 단기 조달이 증가한 측면이 컸다. 2)공급 간 차이에서 형성된 금리차가 단기와 장기 조달 간 비용 격차가 빠르게 축소되는 형태로 나타났고, 3)이러한 비용 우위는 상당 부분 희석된 것으로 판단된다.\n\n단기금리의 가파른 상승세가 일반적으로 크레딧 시장 자금경색의 신호로 활용되는 만큼, 상승의 원인이 어디에 있는지를 먼저 구분해 볼 필요가 있다. 이에 본 자료에서는 CP금리 상승의 배경을 1)조달 구조, 2)만기별 금리, 3)단기자금 수급의 세 가지 측면에서 점검하고, 당사 향후 기준금리 시나리오 하에서 CP금리가 어떤 곡선을 그릴지 방향성을 살펴보았다.\n\n### ⑨ 신용 위험으로는 확산되지 않았다\n\n2026년 금리 상승 위험이 시장을 지배했으나 신용 위험으로는 확산되지 않았다. 제이알글로벌리츠와 중앙그룹 부도 사태에도 그 외 발행사들은 견고한 현금흐름과 실적 기반 펀더멘털이 뒷받침됐다. 정부의 전략산업에 대한 금융지원이 본격화돼 민간의 신용 위험을 분담해주고, 기업대출 중심 은행권의 유동성 공급으로 조달 여력이 개선되며 신용 위험이 안정적으로 관리될 수 있었다.\n\n올해 시작된 반도체 기업들의 대규모 잉여현금 유입 역시 시장 강세를 지지하는 근거다. 증권·투신에 대규모 자금이 유입되며 크레딧 직접 투자가 이뤄지고 있다. 한편 은행 수신으로 유입된 자금은 기업대출로 이어지고, 결국 간접적인 크레딧 유동성 확대로 귀결됐다. 내년 금리 변동성 완화 및 신용 위험이 제한되는 상황에서 크레딧 채권에 대한 양호한 유동성 수요가 발현될 것으로 기대한다.\n\n### ⑩ 내년 금리 고점 형성을 기대한다\n\n내년 초 금리 인상 사이클 본격화가 아닌 보험성 금리 인상 경로가 확인되면서 금리 고점 형성을 기대한다. 생산성 확산에 대한 논의는 내년부터 한층 심화되겠으며 경제 전반의 확산보다는 낙수효과가 소수 기업에 집중될 가능성이 높아 중장기 금리 안정 요인으로 평가될 전망이다. 수급 측면에서 확장적 재정 지속 및 외국인 자금 이탈 등이 구조적인 위험 요인으로 자리하나 만기 구성 조정 또는 바이백 등 안전장치는 유효하다. 듀레이션 중립 이상을 권고하며 금년 말~내년 초 금리 반등 구간을 적극 활용할 필요가 있다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n### AI x 바이오: 2027년 AI 신약개발, 3개 조건이 동시에 충족\n\nAI 신약개발이 빅파마와 스타트업 모두에서 동시다발적으로 이익화 단계에 진입한 시점이다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n# 투자전략\n\n### 미국 중간선거: AI 데이터센터 규제 우려 vs. 기술주 반등\n\n미국 중간선거 결과 민주당이 상하원을 장악하자 시장은 데이터센터 규제 강화 가능성에 주가를 급락시켰다. 텍사스·조지아·오하이오 등 AI 데이터센터 밀집 지역에서 건설 중단 공약이 부각되었고, 전국 주민투표 41건 중 40건이 건설 반대를 선택했다. 미국 전체 AI 데이터센터 용량은 2026년 49GW→2030년 150GW로 성장할 전망인데, 2027년 완공 예정 용량의 약 75%(59GW)가 이미 착공 단계에 들어갔다. 건설 중단은 2028년 이후 착공분에 국한될 것이며, 2027년 가동 물량은 사라지기보다는 시차를 두고 이연될 가능성이 크다.\n\n기술주 급락은 AI 데이터센터 규제 우려가 단순히 건설 지연을 넘어 메모리 수요 둔화로 이어질 수도 있다는 우려를 반영한 것이었다. 하지만 미국 주식시장은 이날 반등하며 기술주 반등을 이끌었다. AMD·테슬라가 주도해 시가총액 1.5조 달러가 하루 만에 회복되었다. 엔비디아는 내부 조사 관련 불확실성으로 약 5% 하락하며 이 흐름에서 예외였다.\n\n### 데이터센터 규제: 미국 내 지역별 영향과 주민의 반응\n\n데이터센터 규제 우려는 미국 내 지역별로 그 영향이 달랐다. 텍사스·버지니아·조지아가 미국 내 데이터센터 건설 1~3위 지역이다. 이들 지역에서 민주당이 주지사를 탈환하며 건설 중단 공약을 내놓았다. 그러나 이는 신규 건설 중단이지, 이미 착공한 현장은 영향을 받지 않는 구조다. 또한, 주의회가 보호 법안을 통과시킬 때까지의 한시적 승인 중단이라, 기존 병목의 심화라기보다 막힌 건설이 재개될 조건이 구체화된 것이었다.\n\n미국 유권자들의 실제 반응도 규제 우려를 뒷받침했다. 텍사스 유권자의 56%가 데이터센터 건설에 반대했고, 전국 단위로 등록 유권자의 42%가 AI 데이터센터 건설 제한을 매우 중요하거나 가장 중요한 이슈로 꼽았다. 선거 전에도 지연은 이미 진행 중이었다—2026년 가동 예정 용량 16GW 중 실제 착공한 것은 약 5GW였다. 주의회 입법이 끝나면 승인이 재개될 가능성이 있어, 지연 기간은 2~3개 분기에 그칠 수 있었다.\n\n### 기술주 급락: 모멘텀 투자전략의 과밀화와 AI 인프라 가격 하락\n\nAI 데이터센터 건설 지연 우려는 단기적 반도체 투자 지연에 그쳤다가, 모멘텀 투자전략의 과밀화가 기술주 급락을 악화시켰다. 주식 레버리지 수요를 대변하는 주식 차입비용이 7월 이후 급락했는데, 이는 과밀화된 포지션이 청산 압력에 직면한 신호였다. 또, 주식 차입비용이 7월에 이어 10월 이후 급락했고, 모멘텀/추세추종 포지션의 붕괴가 가장 심했다는 데이터도 이를 뒷받침했다.\n\n과밀화된 모멘텀 전략이 반도체 주가-펀더멘탈 궤적을 어그러뜨렸다. 반도체 업종의 12MF PER은 12.3배에 불과했다. 역사적 평균(19배)과 비교할 때 EPS가 35% 하락해야 가격이 정당화되는데, EPS는 상향 중이다. 결국 AI 인프라 가격 하락은 AI 수익성과 AI 인프라 가격 사이의 괴리를 좁힐 것이고, 한쪽 진영만 오랜 기간 높은 수익을 가져가기는 어렵다.\n\n### 반도체 주가-펀더멘탈: 과도한 낙폭과 AI 투자 지연의 파급\n\n반도체 주가-펀더멘탈의 역설적 관계는 2008년 글로벌 금융위기 이후 가장 낮은 코스피 반도체 12MF PER(6배)을 만들었다. 이 수준에서 반도체 영업이익은 단기 정점이었고, 역사적 PE 역사는 10년 3Q, 14년 2Q, 18년 3Q에 해당했다. 현재 반도체 주가-펀더멘탈 역설은 과도한 낙폭이었음을 보여주는 단서다. 반도체 업종 주가가 급락했지만, 국내 증시에서 차지하는 비중은 52.8%로 높았다. 삼성전자·SK하이닉스 두 종목 비중은 47.9%. 다른 업종이 대안이 될 여력도 많지 않았다.\n\n### 반도체 업종: 반등 조건과 기술적 반등 가능성\n\n반도체 주가-펀더멘탈 역설의 해결 조건은 AI 인프라 가격 하락의 수혜를 받는 소프트웨어·빅테크가 이끄는 미국 주식시장의 반등이다. 미국 증시가 반등해도 한국 증시 반등으로 이어지지 않을 가능성이 크다. 두 시장은 미국 주도주의 낙수효과가 한국까지 닿을 때 함께 움직인다. 미국 증시 반등을 AI 인프라 가격 하락의 수혜를 받는 소프트웨어·빅테크가 이끈 경우 한국 시장은 소외될 수 있다.\n\n기술적 반등의 가능성은 낮지만, 반도체 업종의 주가-펀더멘탈 역설이 현재 수준에서 해결될 수 있는 조건은 AI 인프라 가격 하락의 수혜를 받는 소프트웨어·빅테크가 이끄는 미국 주식시장의 반등이다. 미국 증시가 반등해도 한국 증시 반등으로 이어지지 않을 가능성이 크다. 두 시장은 미국 주도주의 낙수효과가 한국까지 닿을 때 함께 움직인다. 미국 증시 반등을 AI 인프라 가격 하락의 수혜를 받는 소프트웨어·빅테크가 이끈 경우 한국 시장은 소외될 수 있다.\n\n### AI 인프라: 인프라 가격 하락과 M7의 투자 비용 부담\n\nAI 인프라 가격 하락이 M7의 투자 비용 부담을 줄여줄 것이다. 한국에서는 PI-AI와 국내 데이터센터 관련 종목이 새로운 주도주가 될 수 있다. 미국 기술주 급락 여파로 AI 하드웨어 및 소프트웨어 기업들의 낙폭이 두드러졌으나, 장 후반 저가 매수세 유입과 당국의 시장 안정 조치에 낙폭 일부 축소했다.\n\n### 반도체 이외 산업: 수출보다는 내수, AI 인프라보다 전통 산업\n\n반도체 업종의 주가-펀더멘탈 역설을 빗겨나간 산업을 찾아야 한다. 수출보다는 내수, AI 인프라보다 전통 산업에서 기회가 있을 전망이다. 지난 1년 동안 반도체와 주가 상관계수가 낮은 업종은 미디어·호텔레저·유틸리티, 소프트웨어, 제약바이오 등이다. 2008년 글로벌 금융위기 이후 가장 낮은 코스피 반도체 12MF PER(6배)이 기저로 작용해, 반도체 업종의 주가-펀더멘탈 역설은 과도한 낙폭이었음을 보여주는 단서다.\n\n### AI 인프라 투자 지연과 M7의 투자 비용 부담\n\nAI 인프라 가격 하락은 M7의 투자 비용 부담을 줄여줄 것이다. 한국에서는 PI-AI와 국내 데이터센터 관련 종목이 새로운 주도주가 될 수 있다. 미국 기술주 급락 여파로 AI 하드웨어 및 소프트웨어 기업들의 낙폭이 두드러졌으나, 장 후반 저가 매수세 유입과 당국의 시장 안정 조치에 낙폭 일부 축소했다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n미국 고용 증가가 시장 예상치를 크게 상회하며 경기 하방 우려를 완화했으나, 고용 질은 여전히 부족한 상태로 실질임금 상승이 둔화되고 노동소득분배율이 최저 수준을 기록하고 있다. AI 투자에 대한 공포가 반도체 및 관련 국가에 집중적으로 영향을 미쳤으나, 이는 AI 투자 사이클의 전반적인 종료보다는 데이터센터 건설 지출의 속도 조절과 관련된 불확실성에 기반한다. 미국 고용 상승과 ISM 제조업지수 상승은 경기 모멘텀 차별화를 보여주며, 비제조업 지수 하락과 서비스업 납기 지연은 물가 압력 지속 가능성을 시사한다."}]}</script>
