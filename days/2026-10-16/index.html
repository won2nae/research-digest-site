p 상회했다. 하지만 여기서 주목할 점은 **주거비를 제외한 근원 물가의 월간 연율**이 +4.1%에서 +3.0%로 낮아졌다는 점이다. 이는 단순히 물가가 둔화된 것이 아니라, **에너지 가격 상승+주택 건설물가 상승 등의 일회성 요인이 사라졌다**는 뜻이다.\n\n유안타증권은 \"9월 CPI 발표 직후 美 10년물 금리는 장중 5.33% 부근까지 상승한 뒤 5.19% 수준으로 반락\"했다고 진단한다. 이는 고금리의 성장·투자 부담을 반영한 **방어적 국채 매수가 진행**됐다는 해석이 된다. 즉, CPI가 상회해도 금리가 다시 내렸다는 사실은 **물가 지속성보다 고금리에 대한 민감도가 더 크다는 시장을 반영**하는 것이며, 이는 **연준의 추가 긴축에 대한 시장 참여자의 걱정이 아직 계속되고 있음을 시사**한다.\n\n### ② PPI가 노출하는 '물가 전이'의 속도와 깊이\n\n9월 PPI는 헤드라인 MoM +1.3%, 식품·에너지 제외 +0.7% 상승하며 예상치를 대폭 상회했다. SK증권은 \"식품·에너지·유통서비스 제외 지수의 3개월 연율은 +5.1%\", \"Stage 4 투입비용은 MoM +1.1%\"라고 분석하며 **공급망에서부터 생산단계에 이르는 모든 물가 압력이 확대되고 있음을 시사**한다. 특히 유통마진과 운송·보관 가격의 상승은 **최종 소비자에게 물가 전이가 실제로 발생하고 있음을 보여주는 실증데이터**로, 이는 **CPI에서 '재평가'를 포괄한다고 주장했던 연준의 판단이 너무 빠른데다**, **현재 물가가 공급망에서부터 소비자까지 전이되고 있음에도 불구하고 CPI에만 집중하고 있다는 문제가 존재**한다.\n\n### ③ RPM과 TGA의 움직임: 금융시장의 '긴축 여유 공간'\n\nRPM(Rate Policy Meeting)에서 기준금리 결정이 이루어지면서 **RPM 순매입 중단을 3개 운영기간 연속 유지**하는 모습을 보였다. 그러나 동시에 역레포 완충 여력이 소진되어 10월 말 TGA(Treasury General Account) 증가가 자금조달 부담을 높이는 모습이기도 하다. 유안타증권은 \"역레포 완충 여력이 소진돼 10월 말 TGA 증가가 자금조달 부담을 높이겠지만, 이후 정부 지출에 따른 현금 환류로 압력은 완화될 전망\"이라고 진단하며, **10월말 TGA 증가로 인한 금융시장의 압박이 있지만, 정부 지출에 따른 현금 환류로 이 압박이 부분적으로 완화될 것**이라 예측한다. \n\n즉, 현재 금융시장은 **긴축 여유 공간이 없어 10월말 TGA 증가로 인한 자금조달 부담이 발생하겠지만, 이 부담이 정부 지출에 의해 부분적으로 완화될 것**이며, 이는 **연준의 추가 긴축에 대한 시장 참여자의 걱정이 아직 계속되고 있음을 시사**한다.\n\n### ④ CPI/PPI/RPM/TGA의 관계: 금리 전망의 또 다른 관점을 제공\n\nCPI와 PPI의 상승은 연준이 물가 목표를 충족시키고 있다고 판단하는 것을 넘어서 **물가 지속성과 공급망에서부터 소비자까지의 물가 전이가 실제로 발생하고 있음을 보여주고** 있다. 그리고 RPM의 결정과 TGA의 증가는 **연준이 추가 긴축에 대한 준비를 하고 있으나, 금융시장의 압박이 존재하여 이 긴축이 실행되지 않을 수도 있음을 시사**한다. 이는 **연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 현재 물가가 공급망에서부터 소비자까지 전이되고 있음을 보여주는 실증데이터**로서, **현재의 물가 상승이 연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 공급망에서부터 소비자까지의 물가 전이가 실제로 발생하고 있음을 시사**한다. 이는 **연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 현재 물가가 공급망에서부터 소비자까지 전이되고 있음을 보여주는 실증데이터**로서, **현재의 물가 상승이 연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 공급망에서부터 소비자까지의 물가 전이가 실제로 발생하고 있음을 시사**한다. \n\n따라서, 현재의 물가 상승이 연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 급망에서부터 소비자까지 전이되고 있음을 보여주는 실증데이터로서, 현재의 물가 상승이 연준의 물가 목표를 충족시키고 있다고 판단하는 것이 아니라, 공급망에서부터 소비자까지의 물가 전이가 실제로 발생하고 있음을 시사한다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권  \n\n---\n\n### # 국고채 금리 하락: 추격 매수 vs. 내년 초 진입 시점  \n국고채 금리가 전 구간 하락한 배경엔 세 가지 요인이 맞물렸다. 첫째, **우려 요인의 선반영 완화**(신한투자증권). 두 번째, **국내 펀더멘탈이 대외 금리 연동을 약화시키는 구조**(신한투자증권). 세 번째는 **안전자산 선호 심리 확대**(유진투자증권). 그러나 추격 매수의 실익은 제한적이어서 **내년 초 진입 시점을 모색하는 전략이 오히려 유리하다**(신한투자증권).  \n\n#### ▶ 왜 추격 매수는 어려움?  \n- **추격 매수의 실익은 제한되어 있고**, 4분기 에너지발 비용 상승과 내년 1분기 성과급 지급이 맞물린 수요 측 물가 상승 압력이 잔존한다(신한투자증권).  \n- **국내 채권 시장의 기본 면에서는**, 내년 초 최종금리 윤곽이 드러나고 미래대응기금의 여유재원이 집행되기 시작하면서 완만한 강세 흐름이 전개될 것으로 기대된다(신한투자증권).  \n\n#### ▶ 그런데 안전자산 선호 심리가 왜 이렇게 강력했을까?  \n- **글로벌 주가 하락과 국내 증시 하락폭이 두드러져서** 안전자산 선호가 확대되었다(유진투자증권).  \n- **국내 증시 하락폭이 두드러진 이유**: 10월 14~15일 AI 인프라 투자 우려로 코스피·코스닥이 각 7% 이상 급락하며 사이드카·서킷브레이커가 발동되었기 때문(시장 참조).  \n\n#### ▶ 추격 매수 대신 내년 초 진입 시점 모색이 유리한 이유  \n- **추격 매수보다 내년 초까지 유리한 진입 시점을 모색하는 전략이 오히려 유리하다**. 4분기 에너지발 비용 상승과 내년 1분기 성과급 지급이 맞물린 수요 측 물가 상승 압력이 잔존하기 때문이다(신한투자증권).  \n\n---\n\n### # 한국은행: 속도 조절은 아니지만 인상 종료도 아니다  \n한국은행 금통위는 **10월 22일 기준금리를 3.00%로 만장일치 동결**할 전망이다. 7, 8월 연속 인상 후, 8월 연속 인상 가능성에 무게를 두었던 모습이다. 8월 금통위 이후로 유가는 소폭 반등했으나, 9월 CPI 상승률은 전년동월비 2.9%로 낮아지고 소비자의 1, 3년 후 기대 인플레이션율은 3개월 연속 각 2.7%, 2.6%로 유지되고 있다.  \n\n#### ▶ 왜 10월 금통위에서 기준금리를 동결했을까?  \n- **기준금리 3.0%는 긴축적인 영역으로 본격적으로 진입한 레벨**이다. 여기서부터는 추가 인상이 실물 경제에 본격적인 부담을가할 수 있으므로 신중함이 요구된다(하나증권).  \n\n#### ▶ 속도 조절은 아니지만 인상 종료도 아니다  \n- **속도 조절은 아니지만 인상 종료도 아니다**. 9월 인플레이션율은 낮아졌으나, 기저 인플레이션 압력이 상존하기 때문이다.  \n\n#### ▶ 근원 물가 압력을 보면?  \n- CPI 품목 중 물가 상승률이 3%를 넘는 품목의 비중은 37%로 지난 4월(29%) 이후 5개월 연속 상승하고 있다.  \n- **GDP 갭률은 이미 2026년 2분기부터 (+)**로 전환됐다. 수출 호조가 설비투자 중심으로 내수로도 확산되고 있으며, 최소한 내년 상반기까지 견조한 성장이 예상된다.  \n- 한국 경제가 완연한 경제 확장 국면에 진입하면서 2027년에는 GDP 갭률이 1%를 넘어설 전망이다. GDP 갭률과 근원 인플레이션의 양의 상관성을 고려하면 근원 물가 압력이 지속될 것이라는 판단을 내릴 수밖에 없다.  \n\n#### ▶ 근원 인플레이션은 어떻게 전개될까?  \n- 2027년은 헤드라인보다 근원 인플레이션이 높아질 것으로 예상되며, 한국은행은 이번 회의에서 근원 물가상승률의 경로를 끌어내리기 위해 추가 긴축 가능성을 시사할 전망이다(하나증권).  \n\n---\n\n### # 국고채 발행 축소: 금리 경로에 의존적이다  \n- 국고채 발행 축소는 **금리 경로에 의존적이다**. 금리가 급격히 하락한만큼 11, 12월에 국고채 발행을 크게 축소할 유인이 사라진다(하나증권).  \n- **통안채 3개월 금리는 기준금리보다 약 20bp 높은 수준**이다. 10월 동결, 11월 인상을 80%에 가까운 확률로 반영하고 있는 상태이고, 최종 기준금리 수준에 대한 불확실성은 여전히 크다.  \n\n#### ▶ 왜 미국도 유사한 상황인가?  \n- **10, 11월 금통위를 앞두고 통안채 3개월 금리는 기준금리보다 약 20bp 높은 수준**이다. 10월 동결, 11월 인상을 80%에 가까운 확률로 반영하고 있는 상태이고, 최종 기준금리 수준에 대한 불확실성은 여전히 크다.  \n\n#### ▶ 주가 조정은 금리 추세 하락을 만들어낼 수 있는 요인 중 하나다  \n- **주가 조정은 금리 추세 하락을 만들어낼 수 있는 요인 중 하나다**. 다만 금리 하락 추세를 전망하기 위해서는 S&P 500 기준으로 약 8%의 조정이 필요하다고 판단하며 (‘10/12, 주가가 얼마나 하락해야 금리가 꺾일까’), 아직 그 지점에는 도달하지 못했다.  \n\n#### ▶ 최근 금리 급락은 추세 전환보다는 이전 1개월 간의 급등을 되돌리는 성격이 강하다  \n- **최근 금리 급락은 추세 전환보다는 이전 1개월 간의 급등을 되돌리는 성격이 강하다**.  \n\n---\n\n### # 수익률 곡선: 장단기 금리차는 상대적으로 일정했다  \n- **2026년 시장금리 레벨이 빠르게 상승한 것에 비하면, 주요국 국채10년-2년물 장단기 금리차는 상대적으로 일정했다**. 2025년 이후의 채권시장 약세가 수익률곡선 스티프닝이 주도했다면, 올해는 ‘스티프닝에 더해서’ 레벨이 상승한 국면이다.  \n\n#### ▶ 단기구간이 먼저 상승했다면 통화정책 기대경로를 반영한 결과일 가능성이 높다  \n- **단기구간이 먼저 상승했다면 통화정책 기대경로를 반영한 결과일 가능성이 높다**. 반면에 중장기물 금리가 상승한 국면은 중동전쟁發 공급충격, 인플레이션, 성장갭 변화, 재정적자와 같이 장기시계에서 움직이는 위험 프리미엄 구성요인이 향후 통화정책 기대경로에 반영된 결과다.  \n\n#### ▶ 이런 수익률곡선 동학은 어떻게 압축할 수 있을까?  \n- **압축Shrinkage은 내가 주목하는 위험(패턴)에 가중치를 할당하는 과정이다**. 아래 [그림 3]에서 잔존만기별로 직관적인 가중치를 부여해 비교했다.  \n\n---\n\n### # 미국 금리 하락: 물가 효과와 실질구매력·기업 수익성 악화를 평가하기 시작했음을 시사  \n- **미국 10년 금리는 9월 중순 5.0% 수준이었던 것이 9월 말~10월 초 5.3%대로 상승했으나, 최근에는 5.1% 안팎으로 반락했다**.  \n- **년과 10년 금리차도 10월 초 약 47bp에서 최근 약 34bp로 축소**됐다.  \n\n#### ▶ 왜 10년 금리는 5.3%까지 상승했다가 다시 5.1% 안팎으로 반락했을까?  \n- **CPI와 PPI 상승에도 장기금리가 하락했다**. 이는 시장이 비용 충격의 물가 효과와 함께 실질구매력·기업 수익성 악화를 평가하기 시작했음을 시사한다.  \n\n#### ▶ 단기물에는 연준의 추가 인상 가능성이 남아 있는 반면  \n- **장기물에는 AI 투자와 자금조달 부담, 위험자산 변동성에 따른 안전자산 수요가 반영되고 있다**.  \n\n---\n\n### # 외환시장: 달러-원 환율 1,344.60원으로 6.30원 상승  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n#### ▶ 왜 외국인 대규모 주식 순매도가 커스터디 달러 매수가 상승 압력으로 작용했을까?  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따라 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n---\n\n### # 시장 흐름: 반도체 중심의 주가 조정 → 위험회피 → 국고채 금리 하락  \n- **반도체 중심의 주가 조정이 위험회피를 자극**했고, 외국인의 국채선물 순매수가 강세에 힘을 보탰다.  \n- **국내 채권시장 불 플래트닝 마감**. 안전자산 선호 확대.  \n- **CXMT 이후 약해진 기술주 모멘텀으로 글로벌 주가 하락하는 가운데 국내 증시 하락폭이 두드러지면서 안전자산 선호가 확대**되고 있음. 간밤 미국 CPI가 근원, 근원서비스물가 등 모두 예상치를 상회했지만 미국 금리 역시 기술주 매도에 따른 반사효과로 하락한 영향도 컸음.  \n- **국내 금리 역시 개장 초 큰 폭으로 하락 출발했고 장중 아시아 증시 하락, 아시아 장중 미국 금리 하락 등에 힘입어 추가 하락 보였음**.  \n\n#### ▶ 반도체 중심의 주가 조정이 위험회피를 자극했고 외국인의 국채선물 순매수가 강세에 힘을 보탰다  \n- **반도체 중심의 주가 조정이 위험회피를 자극**했고, 외국인의 국채선물 순매수가 강세에 힘을 보탰다.  \n\n#### ▶ CXMT 이후 약해진 기술주 모멘텀으로 글로벌 주가 하락하는 가운데 국내 증시 하락폭이 두드러지면서 안전자산 선호가 확대되고 있음  \n- **CXMT 이후 약해진 기술주 모멘텀으로 글로벌 주가 하락하는 가운데 국내 증시 하락폭이 두드러지면서 안전자산 선호가 확대**되고 있음. 간밤 미국 CPI가 근원, 근원서비스물가 등 모두 예상치를 상회했지만 미국 금리 역시 기술주 매도에 따른 반사효과로 하락한 영향도 컸음.  \n\n#### ▶ 국내 금리 역시 개장 초 큰 폭으로 하락 출발했고 장중 아시아 증시 하락, 아시아 장중 미국 금리 하락 등에 힘입어 추가 하락 보였음  \n- **국내 금리 역시 개장 초 큰 폭으로 하락 출발했고 장중 아시아 증시 하락, 아시아 장중 미국 금리 하락 등에 힘입어 추가 하락 보였음**.  \n\n---\n\n### # 외환시장: 코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n#### ▶ 왜 외국인 대규모 주식 순매도가 커스터디 달러 매수가 상승 압력으로 작용했을까?  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따라 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n---\n\n### # 외환시장: 수출업체 네고물량이 유입되며 장중 상승폭 축소  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n#### ▶ 왜 수출업체 네고물량이 유입되며 장중 상승폭이 축소했을까?  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n---\n\n### # 외환시장: 수출업체 네고물량이 유입되며 장중 상승폭 축소  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.  \n\n#### ▶ 왜 수출업체 네고물량이 유입되며 장중 상승폭이 축소했을까?  \n- **코스피·코스닥 급락과 외국인 대규모 주식 순매도에 따른 커스터디 달러 매수가 상승 압력으로 작용**했으나, 수출업체 네고물량이 유입되며 장중 상승폭 축소.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n### 메모리 반도체: 극단적 하락의 합리성 검토\n\n삼성전자·SK하이닉스 12개월 선행 PER이 3.3x→3.0x로 2010년 이후 최저점을 돌파했다. 5년 전(2010년) 당시 삼성 PER은 5.5x, SK하이닉스는 3.0x였다는 점에서, 이 수치는 역사적으로 매우 극단적인 수준이다. 그러나 이 하락이 모든 메모리 업황을 반영하는 것은 아니다.\n\nSK증권은 두 가지 핵심 변수로 하락이 과도하다고 판단한다:\n\n첫째, 2027년 HBM4 12H 가격은 Gb당 4달러 중후반으로 형성될 전망이다. 8H 디스펙 가격 디스카운트 가능성은 극히 제한적이라는 게 SK측 근거다. 여기에 D5 고용량 모듈(DRAM)의 현물 프리미엄이 확대되고 있다는 점을 더하면, 2027년 실적 전망치는 이미 상향 중이다.\n\n둘째, LTA(Lifetime Take-or-Pay) 본격화는 가격 하단을 높이고 생산능력을 잠그는 계약이다. 마이크론이 신제품 가격 프리미엄을 협상에 반영하겠다고 밝힌 것도 LTA가 단순 가격 상한 설정이 아니라는 증거다. 낮은 P/E 자체가 \"사이클 후반\"을 의미했던 과거 시장 인식은, AI 시대 메모리 특성(수요·공급의 극단적 불균형)과 맞지 않는다.\n\n시장 참여자 중 이 두 논리를 동시에 인정하지 않는 이는 없다. 다만, SK증권이 \"P/E가 낮다는 자체가 매도 신호\"라는 기존 인식을 전면 번복하는 입장은 아니다. 낮은 P/E는 향후 실적 가시성의 불확실성을 반영한 것이기도 하므로, 주주환원 논리가 현실화될 때까지 기다릴 수밖에 없는 구조적 문제가 동시에 존재한다.\n\n---\n\n### 통신 3사: 배당수익률과 금리 틀의 교차점\n\n하나증권은 SKT·KT·LG U+의 기대배당수익률이 4.5%-4.7% 수준인데, 이 수치가 시중 금리 대비 낮지는 않지만 그렇다고 매력적이지도 않다고 평가한다. 즉, 배당수익률과 금리의 상대 위치가 현재는 중립적이다.\n\nSKT의 경우 2027년 비과세 배당, 엔트로픽 상장, AI 데이터센터·기지국 사업 확장이 동시기에 집중적으로 호재로 작용할 수 있다. 반면 KT·LGU+는 SKT 주가 상승에 따른 피치fork 효과가 예상된다. 하나증권은 이 가중치를 SKT > KT = LGU+로 제시했는데, 이는 SKT의 미래 배당·사업 모멘텀이 현재 주가에 미리 반영되지 않았다는 가정 위에 세워진다.\n\n금리 흐름 측면의 관건은 정책 금리 인상의 연내 마무리 여부다. 경기 성장률이 1~2%대에 머무른다면, 금리가 내려갈 수 있는 공간은 제한적이다. 반도체를 제외한 대부분의 산업에서 GDP 성장이 금리 인상으로 인한 경기 둔화 우려를 상쇄할 정도로 높지 않다는 점을 감안하면, SKT의 DPS 상승(비용 효율화)과 시중 금리 하향 안정화의 시기가 2027년 초까지 겹친다는 전제가 이 투자 논리의 핵심이다.\n\n---\n\n### 중국 자동차: 내수 부진 vs. 글로벌 수출 물량 증가\n\n9월 중국 내수 소매판매는 YoY -28%, 신에너지차도 -17%로 6개월 연속 20%대 감소를 기록했다. 9월 누적 -22%, 신에너지차 -13%로 2025년 11월 이후 감소폭이 전년 대비 기저 효과로 축소될 전망이다. 신에너지차에 대한 부정적 정책 변경 효과가 지속적으로 영향을 준 상태에서, 11월부터 전년 동월 대비 기저 효과가 시작되면 감소폭이 둔화하거나 증가세로 전환이 가능하다는 게 하나증권의 해석이다.\n\n반면 중국 수출은 9월 YoY +73%, 9월 누적 +71%로 신에너지 승용차가 9월 YoY +164%, 9월 누적 +139%로 급증했다. 유럽·동남아·중남미 지역에 CKD 공장이 완공 또는 건설 중이라는 점에서, 중국발 전기차 경쟁이 글로벌 시장에 미치는 압력은 지속적이다.\n\n현대차·기아는 중국 내수·도매 판매가 시장과 유사한 수준에서 감소 중이며, 중국 비중이 낮아 주가에 영향은 크지 않은 편이다. 그러나 유럽·신흥국에서 중국 업체들과의 가격 경쟁이 노출된 업체들에게는 원가구조·차별화 부재 시 수익성에 부담이 된다는 점에서, 해당 기업들은 현지 투입 중소형 전기차 모델들의 판매 성과를 통해 상대 경쟁력을 확인해야 한다는 게 하나증권의 주문이다.\n\n---\n\n### 반도체·AI: 가격 저항·CoreWeave·中 CXMT의 4F Square 개발이 동시에 작용\n\n메모리 가격 저항, CoreWeave 회사채 이슈, 중국 CXMT의 4F Square 개발, 그리고 2028년 중국 메모리 생산 급증 우려가 동시에 작용하며 주가를 급락시키고 있다. 대신증권은 이 시점에서 메모리 이익 가치가 \"철저히 부정당하고 있다\"고 진단하며, 이 하락이 과도하다고 판단한다. 이들의 논리는 앞서 SK증권의 LTA 논리와 연결된다—즉, CoreWeave의 단기적인 회사채 이슈와 CXMT의 4F Square 개발이 2028년에야 실현 가능한 중국 생산량 증가를 이미 과도하게 반영했다는 해석이다.\n\n---\n\n### 방산·조선·플랜트: 원클릭 모듈 공급망과 SMR·FGSS·CO₂ 액화 플랜트\n\n대우증권은 조선해양 부문에서 FGSS(친환경 연료가스 공급시스템), 선각블록을 공급하는 업체로, 플랜트 부문에서는 열교환기·압력용기 등을 공급한다. 핵심 역량은 배관·철골·기계·전기·계장을 하나의 프레임에 통합한 대형 모듈을 기본설계부터 제작·설치·시운전까지 일괄 수행하는 '원클릭' 엔지니어링이다.\n\n조선소 엔진룸 유니트 시장 점유율은 2023년 37.1%, 2024년 49.6%, 2025년 31.7%로, 2024년은 HD현대중공업 물량의 절반 이상, 삼성중공업의 약 30%를 담당했다. 7개국 선급, 수소제조 인증 등 해외 플랜트 입찰 요건도 갖춰놓았다.\n\n2025년 매출은 저수익 수주 축소, 고객사 컨테이너선 건조 일정에 따른 블록 공백, 진행률 기준 매출 인식 시점 영향으로 감소했으나, 영업이익률은 2023년 2.7%에서 2024년 9.9%, 2025년 10.9%로 개선됐다. 2026년 상반기 매출 591억원, 영업이익 54억원(영업이익률 9.1%), 수주잔고 2,022억원(2023년 말 대비 +35%).\n\n---\n\n### 전력·SMP: 10월 일별 SMP 110원대 지속, 11월까지도 상승 불확실\n\n10월 3번째 주 들어 전력 공급능력이 90GW를 하회했고, 최대전력수요는 10월 초부터 전년대비 증가하는 가운데, 일별 SMP는 평일 110원/kWh을 지속적으로 하회해왔다. 원전을 비롯한 기저전원 비중이 회복되고 있지만, 11월도 전력수요가 크게 늘어나지 않는 점을 감안하면 10월의 기조가 장기화될 가능성이 있다. 원전·기저전원 비중이 높아짐에도 불구하고, 110원/kWh 대로 머무르는 점은, LNG 연료비보다 SMP가 낮더라도 변동비는 실제 비용을 기반으로 정산되기 때문에 SMP를 통해 기대할 수 있는 비용 감소폭이 크지 않을 수 있다는 뜻이다.\n\n---\n\n### 유럽·아시아 가스: 재고 수준 하회 + 겨울철 수요 증가 예상\n\n10월 15일 기준 유럽 천연가스 저장률은 74.0%로 과거 평균을 하회하고 있다. 겨울철 성수기로 진입할수록 천연가스 소비량은 점차 증가할 전망이다. 유럽 가스 가격은 MWh당 80유로 후반대를 기록하면서 연중 최고치를 기록했다. 아시아 가격은 프리미엄이 붙어서 유럽 가격 상승보다 더 빠르게 상승하는 경향이 있는데, 카타르 공급이 물리적 차질로 줄어든 점에서 단기 수급 밸런스 안정화 트리거는 따뜻한 날씨 외에 없을 전망이다.\n\n---\n\n### 로켓·방산·조선: 루빈·뉴글렌·블루오리진·테슬라·스페이스엑스의 합병설\n\n루빈은 10월 9일, 블루오리진이 텍사스 중부 허토(Hutto)에 위성·통신 하드웨어 생산단지 컨스테렐레이션 파크(Constellation Park)를 조성한다고 발표했다. 약 48만 제곱미터 부지에 연면적 약 12만 제곱미터 규모의 복합 생산시설을 짓는 약 5억 5,000만 달러 투자 프로젝트다. 생성품목은 블루오리진의 통신 라인업인 테라웨이브(TeraWave)(최대 6Tbps 대칭형 데이터 전송), 쿼츠(Quartz)의 지상 장비, 태양전지판·항공전자·통신 장비 등 핵심 서브시스템 생산도 확장된다. 이는 아마존 레오와 별개로 자체 브랜드의 통신 인프라 사업을 본격화하는 의미다.\n\n베조스는 최근 방송 인터뷰에서 블루오리진이 IPO를 할 것이라고 말했고, 시점은 수년 뒤라고 밝혔다. 이는 사실상 처음으로 IPO 가능성을 공개 언급한 것으로, 자본 구조 변화의 의미를 담고 있다. 2000년 창사 이후 베조스 개인 출자(누적 약 280억 달러)로 운영해온 회사가 올해 처음으로 외부 투자자들로부터 100억 달러를 조달했고, 이 과정에서 기업가치를 1,300~1,400억 달러 수준으로 평가받았다는 게 알려진 배경이다.\n\n사업 모멘텀도 회복 국면이다. 5월 뉴글렌이 지상 연소시험 중 발사대 폭발로 시험 발사 중단 이후 BE-4 엔진 밸브 결함을 규명하고 복구를 진행해 왔으며, 12월 발사 재개를 목표로 하고 있다. 그 사이에도 제2 발사대 증설과 NASA 화성 통신 궤도선 수주 등 수주·인프라 확장은 꾸준히 이어졌다. 이 발표들은 베조스의 자금으로 움직이던 연구소형 조직이 외부 자본과 생산능력 확장, 상장까지 바라보는 상업 기업으로 전환하고 있음을 보여주는 사건들이다. 관건은 12월 뉴글렌 비행 복귀와 발사 빈도 회복, 신규 통신 사업의 수주 가시화다.\n\n---\n\n### KB금융·DB손보: 보험손익 개선 vs. 투자손익 부진\n\nKB금융은 2026년 3분기 커버리지 원수 손해보험사 4사의 합산 당기순이익이 1.06조원(-2% YoY)으로 컨센서스를 하회할 것으로 예상한다. 3분기 신계약 CSM 환산배수는 전분기 대비 축소될 것으로 예상되는데, 2분기 중 적용된 계리적 가정 강화에 따른 영향이 신계약 현금흐름 가정에 반영될 것으로 예상되기 때문이다. 일부 보험사들은 요율 인상을 통해 마진 방어를 지속하고 있으나, 이전 수준의 환산배수를 유지하는 수준에 그칠 것으로 전망된다. 3분기 중 CSM 가정 조정은 대체로 축소될 것으로 예상되는데, 과거 신계약 경쟁이 심화되던 시기에는 승환계약 등 이슈가 심화되어 계약 해지로 인한 CSM 가정 조정이 대거 나타났으나, 최근에는 신계약 경쟁이 둔화되고 있는 만큼 승환계약 등 이슈가 축소될 것으로 예상되기 때문이다. 향후 4분기의 경우 간편보험 계리적 가정 강화에 따른 CSM 가정 조정이 나타날 것으로 예상된다.\n\n3분기 보험금 예실차는 전년 동기대비 큰 폭으로 적자가 축소될 전망이다. 8월 강수량이 증가했으나, 이전 대비 분기 전체적인 강수량이 줄어들었으며, 지속적인 요율 인하 영향으로 할인특약 축소 등 마진 방어를 위한 노력이 지속된 결과로 추정된다. 9월 10일부터 경상환자에 대한 8주룰이 시행되었으나, 관련 영향은 8주가 경과한 11월 이후부터 본격적으로 확인할 수 있을 것으로 예상된다. 일반보험 손익은 쿠팡 인천 물류센터 화재사고 등 대형 사고가 있었으나, 재보험을 통해 대부분 방어할 수 있을 것으로 예상되는 반면, 중형사고 영향이나 해외 IBNR 적립 등이 일부 발생하는 등 영향이 나타날 전망이다.\n\n3분기 투자손익은 전분기 및 전년 동기 대비 위축될 것으로 예상된다. 증시 조정, 금리 상승 등 영향으로 주식/출자금, 구조화채권, 대체 투자, 채권형 펀드 등 FVPL자산 상당 부분과 관련하여 평가처분손실이 발생했을 것으로 추정되기 때문이다. 금리 상승에 따라 보험금융비용도 증가할 것으로 예상되는 만큼, 이전보다 타이트한 투자손익이 불가피할 전망이다.\n\n최근 해약환급금준비금 제도 개편에 대한 언론 보도가 이어지고 있으나, 제도 개편에 따른 실익에 대해서는 보수적인 시각을 유지한다. 해약환급금준비금 적립액이 축소될 경우 법인세 부담이 큰 폭으로 확대될 가능성이 존재하는만큼, 현재 배당가능이익이 확보되는 회사의 경우 제도 개편에 대해 유보적인 스탠스가 나타날 수 있다고 판단한다. 그 외에도 1) 기본자본 K-ICS와 2) 신계약비 등 다양한 항목에 걸쳐 영향을 미칠 수 있는만큼, 당장 제도 개편이 나타나기보다는 유의미한 신계약비 절감 등 이후 제도 개편으로 이어질 것으로 전망한다.\n\n해약환급금준비금 제도 개편에 대한 명확한 내용이 나타나고 있지 않은 상황임을 감안하면 26년 연간 결산배당 측면에서도 이전과 유사한 흐름이 나타날 것으로 전망한다. 현재 예상 배당수익률을 기준으로 주주환원 측면의 매력은 다소 낮다고 판단한다. 주주환원 외에 1) 예실차 개선 등 본업 측면의 이익 확대 가능성 및 2) 금리 상승 등에 따른 헟지 관점의 매력 등의 추가적인 투자포인트 확보가 필요할 전망이다.\n\n보험업종은 상반기 중 전반적으로 시장 내에서 소외되어 왔으나, 하반기부터 시장 금리 상승세가 부각됨에 따라 방어주 관점에서 주목을 받아왔다. 다만 단기적으로는 투자손익이 부진한 가운데 실손 중심 장기보험 손익 개선이 이를 상쇄하지 못하며 컨센서스를 하회하는 실적이 예상되는 상황이다. 추가적으로 일부 보험사들의 배당가능이익을 제약하던 해약환급금 관련 제도 개편 여부에 대해서도 불확실성이 지속되며 배당 재개에 대한 기대감도 이전보다 약화되었다고 판단한다. 그럼에도 이전까지 보험사 손익 측면의 부담요인으로 작용하던 실손의 도수치료, 자동차보험 경상환자 향치비 등 모럴성 청구가 제도적 개편에 힘입어 개선될 것으로 예상되는만큼, 본질적인 보험손익 개선세는 27년에도 지속될 것으로 전망한다. 따라서 단기적인 실적 부진에도 보험손익 측면의 본질적인 이익 개선에 대한 기대감은 유효하다고 판단한다.\n\n커버리지 손보사 중 DB손보를 Top pick으로 제시한다. 3분기 손해보험 업종 전반적으로 보험손익 개선+투자손익 부진 추세가 나타나고 있는 만큼, 상대적으로 안정적으로 주주환원을 지속할 수 있는 회사를 선호하는 상황에서 밸류업 공시로 인해 자본정책 측면의 안정성이 높기 때문이다. 삼성화재는 전자 배당의 주주환원 활용 여부에 대한 신뢰 확보가 필요하다고 판단하며, 차선호주로 제시한다.\n\n---\n\n### 유통/화장품·자동차·가공식품·음악·드라마·방산·조선·플랜트·로켓·방산·조선·플랜트·로켓·방산·조선·플랜트\n\nIBK투자증권은 카카오프리에서 AI 서비스의 기획부터 운영까지 적용할 AI 윤리 원칙 'SPIRIT'(안전, 프라이버시, 포용, 책임, 이용자 주체성, 투명성과 신뢰성)과 이행 가이드를 마련했다고 밝혔다. SPIRIT은 3단계로 운영되는 'AI 윤리 이행 체크리스트'를 연내 적용할 계획이다.\n\nIBK투자증권은 TSMC 26년 3분기 매출액이 NT$1,494.2B (+50.9% YoY, +17.6% QoQ)로 컨센서스 NT$1,463.3B를 상회했다. EPS는 NT$29.43 (+68.7% YoY). OP margin은 58.7%.\n\n26년 4분기 매출액 가이던스는 NT$1,694.9B (+/-1.9%)로 컨센서스 NT$1,607.5B를 상회한다. 환율은 $1당 NT$31.8 가정. GP margin은 65.0%로 전망 (+/-100bp).\n\nKEY INSIGHT: 2026년 9월 중국 내수 -28%, 수출 +73%. 중국발 글로벌 경쟁심화 지속\n\n시사점: \n- 9월 및 9월 누적 중국 자동차 소매판매 -28%/-22% (YoY). 6개월 연속 20%대 감소\n- 신에너지차 소매판매 9월 및 9월 누적 -17%/-13%\n- 신에너지차 부정적 정책 변경 효과 지속\n- 당분간 현 상황 유지. 11월부터 감소폭 축소 및 증가세 전환 기대\n- 중국 내수 부진을 타개하기 위해 중국 자동차 업체들의 수출 지속 증가. 9월 및 9월 누적 +73%/+71% (YoY)\n- 신에너지 승용차 수출 9월 및 9월 누적 +164%/+139% (YoY)\n- 유럽/동남아/중남미 현지 CKD 공장 완공 또는 건설 중. 중국발 전기차 경쟁심화 요인\n- 중국 전기차들과 가격 경쟁에 노출된 업체들 중 원가구조 및 차별화를 갖추지 못한다면 수익성에 부담\n- 현대차/기아 중국 소매/도매 판매 시장과 유사한 수준에서 감소 지속. 중국 비중 낮아 주가에 영향 크지 않은 편\n- 다만 유럽/신흥국 시장에서 중국 업체들과 경쟁이 늘어난다는 점에서 실적 및 Valuation의 제약 요인\n- 현지 투입하는 중소형 전기차 모델 판매 성과를 통한 상대 경쟁력 확인이 진행되어야 관련 부담 완화될 것\n\n---\n\n### 블랙록의 AI 투자·부채 지속 가능성 우려 + 고유가 부담이 겹치며 나스닥 572.99p (-2.15%)\n\nAI 투자·부채 지속 가능성 우려 + 고유가 부담이 겹치며 나스닥 572.99p (-2.15%). Bloomberg는 “AI 충격에 $110 유가 쇼크 겹쳐 월가 불안 확산”이라고 보도. AMD·인텔 -3% 이상, 메타·브로드컴 -2% 이상. \n\nAI 충격에 유가 쇼크가 겹쳤다. AMD·인텔은 -3% 이상, 메타·브로드컴은 -2% 이상 하락했다. AI 투자는 지속 가능할까? AI 부채는 얼마나 되는가? 고유가가 AI 투자에 어떤 영향을 미치는가?\n\n---\n\n### 금융시장·주식시장·원자재·주요국 시장·통화\n\n### KOSPI +2.05%\n\n10월 14~15일 AI 인프라 투자 우려로 코스피·코스닥이 각 7% 이상 급락하며 사이드카·서킷브레이커가 발동된 직후의 **기술적 반등**으로 해석됨. 10월 16일에는 야당(정점식 의원 측)이 \"레버리지 ETF 도입, 국민연금 리밸런싱 지연 등 과잉 시장 부양\"을 문제 삼아 정부 조사를 요청했다고 보도됨. *(조선일보, 매일경제, 한국경제)*\n\n---\n\n### KOSDAQ +4.46%\n\nAI 인프라 투자 우려로 코스피·코스닥이 각 7% 이상 급락하며 사이드카·서킷브레이커가 발동된 직후의 **기술적 반등**으로 해석됨. 10월 16일에는 야당(정점식 의원 측)이 \"레버리지 ETF 도입, 국민연금 리밸런싱 지연 등 과잉 시장 부양\"을 문제 삼아 정부 조사를 요청했다고 보도됨. *(조선일보, 매일경제, 한국경제)*\n\n---\n\n### WTI +3.51%\n\n미국 원유 재고 급감과 미국-이란 갈등에 따른 공급 차질 우려가 겹치며 WTI가 $97.97까지 상승; Brent는 $110 근접, 수개월 만의 최대 주간 상승폭 기록. *(Livemint, Channel News Asia, merca2.es)*\n\n---\n\n### NASDAQ -2.15%\n\nAI 투자·부채 지속 가능성 우려 + 고유가 부담이 겹치며 나스닥 572.99p (-2.15%) 하락. Bloomberg는 \"AI 충격에 $110 유가 쇼크 겹쳐 월가 불안 확산\"이라고 보도. AMD·인텔 -3% 이상, 메타·브로드컴 -2% 이상. *(Bloomberg, en.sedaily.com, 닛케이)*\n\n---\n\n### 원자재\n\n---\n\n### 주요국 시장\n\n---\n\n### 통화\n\n---\n\n### 오늘의 매크로 충격 지표: 합리성 분석\n\n10월 14~15일 AI 인프라 투자 우려로 코스피·코스닥이 각 7% 이상 급락하며 사이드카·서킷브레이커가 발동된 직후의 **기술적 반등**으로 해석됨. 10월 16일에는 야당(정점식 의원 측)이 \"레버리지 ETF 도입, 국민연금 리벨런싱 지연 등 과잉 시장 부양\"을 문제 삼아 정부 조사를 요청했다고 보도됨. 이는 시장이 단기적으로 과냉각된 상태에서 반등을 경험했음을 시사한다.\n\n---\n\n### 참고: 과거 리포트 (해당 시점과 맥락이 같다면 본문 분석과 대조해 활용 가능)\n\n| 날짜 | 증권사 | 제목 |\n|------|--------|------|\n| 2015-11-09 | IBK투자증권 | 유통/화장품 한 주 따라잡기 |\n| 2019-10-21 | 하나증권 | 매출 대비 재고자산 감소, 긍정적 |\n| 2013-05-07 | 신한투자증권 | 주간 동향: 일본업체 실적 전망 상승세는 둔화되었으나… |\n| 2009-06-05 | 대우증권 | Global Sector Navigation |\n| 2017-10-17 | 현대차증권 | 前日 銅價上漲關聯，供給側因素點檢 |\n\n*참고로 과거 리포트와 오늘의 매크로 충격 지표는 서로 다른 시점과 데이터를 다루므로, 단순히 숫자만 대조하는 것은 잘못입니다.*\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n# 투자전략\n\n### AI 투자의 파괴적 역풍: 자본 효율성과 가치의 새로운 교차점\n\n최근 7거래일간 코스피·코스닥은 각각 16.2%/14.7% 급락하며 2005년 이후 역대 3위를 기록한 7거래일 연속 조정을 경험했다. 이 급락의 본질은 두 축으로 이해해야 한다:\n\n1. **AI 투자 지속성의 질적 회의**\n   - 가트너(Gartner): 2030년 AI 인프라 투자에 필요한 매출 규모는 8.5조 달러로 추정되지만, 실제로는 3.6조 달러에 그칠 것이라고 주장. 단기CAPEX(총자본 설비투자) 대비 장기 매출창출력의 비약적 해빙이 없는 한, AI 투자는 단순히 투자 유도의 초기 단계에 머무를 가능성이 크다.\n   - 오라클(CRWV): AI 인프라 기업의 회사채 금리가 15%를 기록함. 이는 자본 조달 비용이 AI 사이클의 제약 요인으로 부상했음을 시사한다. AI 투자의 비용-수익 구조에서 자본 효율성 문제가 급부상하고 있다.\n   - 코어위브: 무담보채권의 유통금리가 15% 수준에 달함. 이는 AI 인프라 투자 기업의 신용 위험이 단순히 사업 모델의 불확실성에 그치지 않고, 실질적인 자금 조달 채널의 붕괴로 번지고 있음을 드러낸다.\n\n2. **맥로적 불확실성의 캐럴리지 효과**\n   - 미국 9월 CPI: 헤드라인 +0.6% (+3.7YoY), 근원 +0.3% (+2.6YoY). 에너지를 제외한 서비스·상품 전반의 인플레이션 압박인이 지속됨. 9월 PPI는 헤드라인 +6.3%로 컨센서스 +5.3%를 크게 상회하며, 고금리 장기화 우려를 재확인시킴.\n   - WTI: $97.97까지 상승하며 3개월 만의 최고치를 기록. 에너지 가격 상승은 서비스·상품 인플레이션 압력의 상승을 재확인시키며, 고유가가 GDP 성장률을 둔화시키는 경로가 활성화된다.\n\n이 두 축이 서로를 강화하는 파생적 메커니즘이 존재한다. AI 투자에 대한 자본 조달의 비용 증가(=> 자본 효율성 저하)는 단기 실적 개선의 힘을 약화시키며, 이는 AI 투자 지속성에 대한 의혹을 재불태운다. 반대로 고유가-고물가-고금리의 경로는 AI 인프라 투자의 비용 구조를 더욱 악화시키며, 자본 조달의 비용-수익 비율을 악화시킨다. 이 두 축은 AI 투자에 대한 시장의 신뢰도를 동시에 훼손하고 있다.\n\n### 5,100P: 선행 PBR 기반의 하단 루퍼트\n\n현재 코스피 선행 PER 4.24배는 2000년 이후 최저 수준이지만, 이 수치의 해석에는 중요한 제약이 존재한다. 2026년 7월 이후 선행 PER은 8.0배를 하회했고, 이후 8~9월 반등장에서 5.7배에 머물렀다. 선행 PER이 역사적 하단을 하회하고 있음에도 주가가 반등하지 않은 이유는 단순히 선행 PER의 수치가 아니라, 2027~2028년 이익 지속성에 대한 시장의 불신에서 비롯된다. 이 불신은 AI 투자 지속성과 자본 조달의 비용-수익 비율의 불확실성에서 비롯된다.\n\n선택 가능한 또 다른 밸류에이션 기준은 선행 PBR이다. 선행 PBR은 단기 이익 변동에 대한 민감도가 PER보다 낮고, 기존 자기자본에 향후 이익이 누적되는 구조를 반영한다. 선행 PBR 1.0배는 향후 12개월 예상 자기자본을 장부가치 수준으로 평가하는 것이다. 이는 현재 이익 전망이 유지되고, 이익이 실제 자기자본 증가로 이어진다는 전제 하에서 적용 가능한 보수적인 하단 산정 기준이다.\n\n10월 16일 현재 코스피 선행 PBR은 약 0.9배 수준에 이른다. 이 수치는 선행 PBR 1.0배에 해당하는 5,100P를 하단 라인으로 삼는 근거를 제공한다. 국내 기업들의 구조적 수익성 훼손이 발생하지 않는다는 전제 하에서는, 선행 PBR 1.0배를 기본적인 하단 시나리오로 설정하는 것이 적절하다. 따라서, 코스피 5,100P 이하에서는 추가 하락 위험에 베팅하기보다는 3분기 빅테크 실적시즌을 통해 이익 신뢰성 회복과 AI주의 불안 완화 여부를 확인해가면서 최근 급락분을 만회해 나가는 전략이 유효하다.\n\n### 10월 1~20일 수출: 반도체 모멘텀의 최종 검증\n\n메타(10/21), 램리서치(10/21), IBM(10/21), TI(10/21), 웨스턴디지털(10/22) 등의 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 된다. 하지만 이들의 실적 발표 이전에, 10월 1~20일 수출 데이터가 먼저 발표된다. 반도체 수출 모멘텀이 여전히 견고한지 확인하는 것이 10월 1~20일 수출 데이터의 핵심 목적이다.\n\n10월 1~20일 수출에서 반도체 수출이 견조한 모습을 보인다면, 10월 중순 이후의 실적 발표까지 반도체 업종의 저평가 매력을 높일 수 있다. 반도체 Top2의 자사주 매입은 10월 6일 종료되었고, 이후 매수가 1일 평균 0.79조원 수준으로 감소하였다. 10월 들어 외국인 순매도는 약 18조원에 달하고 있으며, 외국인 투매를 흡수할 수 있는 매수 주체가 부재한 상황이다. 따라서, 10월 1~20일 수출에서 반도체 수출 모멘텀이 견조한 모습을 보인다면, 10월 중순 이후의 실적 발표까지 반도체 업종의 저평가 매력을 높일 수 있다.\n\n### 실적 대비 저평가 구간의 업종 선별적 접근\n\n주 후반 예정된 국내 기업 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 된다. 최근 1개월 기준 23개 업종이 실적 대비 저평가 구간에 위치하고 있으며, 특히 최근 급락의 중심에 자리한 IT 하드웨어, 반도체, 기계, 조선은 물론, 보험, 소매(유통), 상사/자본재 등이 극심한 저평가 영역에 위치하고 있다.\n\n매크로 압박이 완화/해소되기 전까지는 실적 가시성과 저평가 매력이 유효한 업종을 중심으로 선별적 접근이 필요하다. 최근 급락의 중심에 있었던 IT 하드웨어, 반도체, 기계, 조선은 물론, 보험, 소매(유통), 상사/자본재 등이 극심한 저평가 영역에 위치하고 있으므로, 이 업종들의 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 될 가능성이 높다.\n\n### 10월 1~20일 수출: 반도체 모멘텀의 최종 검증\n\n메타(10/21), 램리서치(10/21), IBM(10/21), TI(10/21), 웨스턴디지털(10/22) 등의 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 된다. 하지만 이들의 실적 발표 이전에, 10월 1~20일 수출 데이터가 먼저 발표된다. 반도체 수출 모멘텀이 여전히 견고한지 확인하는 것이 10월 1~20일 수출 데이터의 핵심 목적이다.\n\n10월 1~20일 수출에서 반도체 수출이 견조한 모습을 보인다면, 10월 중순 이후의 실적 발표까지 반도체 업종의 저평가 매력을 높일 수 있다. 반도체 Top2의 자사주 매입은 10월 6일 종료되었고, 이후 매수가 1일 평균 0.79조원 수준으로 감소하였다. 10월 들어 외국인 순매도는 약 18조원에 달하고 있으며, 외국인 투매를 흡수할 수 있는 매수 주체가 부재한 상황이다. 따라서, 10월 1~20일 수출에서 반도체 수출 모멘텀이 견조한 모습을 보인다면, 10월 중순 이후의 실적 발표까지 반도체 업종의 저평가 매력을 높일 수 있다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로, 채권, 산업섹터 분야에서 오늘 반복적으로 등장하거나 서로 연결되는 핵심 쟁점은 다음과 같다.  \n- 미국 CPI와 PPI 상승은 공급망에서 소비자까지의 물가 전이가 실제로 진행되고 있음을 시사하며, 연준의 물가 목표 달성 여부보다는 물가 지속성에 대한 우려가 커지고 있다.  \n- 10월 TGA 증가로 인한 금융시장 압박이 존재하지만, 정부 지출에 따른 현금 환류로 이 압박이 부분적으로 완화될 것으로 예상되며, 연준의 추가 긴축 가능성에 대한 시장의 불확실성이 여전히 남아 있다.  \n- 국내 채권 시장에서는 추격 매수의 실익이 제한적이어서 내년 초 진입 시점을 모색하는 전략이 유리하다는 분석이 나오고 있으며, 안전자산 선호 심리 확대가 주요 요인으로 작용하고 있다."}]}</script>
