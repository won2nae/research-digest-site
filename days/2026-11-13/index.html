ws, 11/13)\n- **젠슨 황·루트닉, 상원 청문회 요청 — Nvidia 국가안보 우려** — 미 상원 금융위원장이 젠슨 황 전 Nvidia CEO와 루트닉 상무장관을 대상으로 중국 정보 연계 의혹 관련 증언을 요청했다. (NYT, Reuters, 11/12~13)\n- **FAA, 전국 항공기 지상 대기 명령** — 항공교통관제 통신 장애로 FAA가 미국 전역 출발편에 지상 대기령을 발동했다. (NYT, Forbes, Guardian, 11/13)\n\n## 한국 뉴스\n- **삼성전자, 아산 온양 HBM 패키징 공장 착공** — 삼성전자가 충남 아산 온양 캠퍼스에 차세대 HBM 패키징 공장 착공식을 열었으며, 이재명 대통령이 참석해 정부 지원을 약속했다. (연합뉴스, 조선비즈, 코리아헤럴드, 11/12)\n- **한국 반도체 수출 11월 초 331% 급증** — AI 데이터센터 수요 급증으로 11월 1~10일 한국 반도체 수출이 전년 동기 대비 331.2% 증가해 166억 달러를 기록했다. (Bloomberg Línea, 11/7~12)\n- **한국, 알래스카 LNG 사업 조건부 참여 의사 재확인** — 강경화 측이 미국 측의 540억 달러 규모 알래스카 LNG 프로젝트에 대한 조건부 참여 의사를 재확인했다. (코리아헤럴드, 11/12)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 물가 압력이 금리를 다시 들썩거리게 한다\n\n### 미국의 물가가 금리를 먹먹하게 만들고 있다\n10월 소비자물가가 시장 예상을 웃돌았다. 10월 CPI는 전월 대비 +0.3%, 연평균 +3.4%로 집계됐다. 이는 0.2% 상승이 예상됐던 시장 기대를 넘어섰으며, 12월 FOMC에서 50bp 금리 인상 가능성까지 제기되고 있다. \n\n이 같은 물가 동향은 물가 안정 의지를 표명하기 위한 연준의 추가 긴축 필요성을 강화한다. 하지만 동시에 물가 상승이 지속되면 경기를 너무 많이 억누르는 긴축으로 이어질 수도 있다. 이런 딜레마는 10월 FOMC 의사록과 연준 위원들의 발언을 통해 얼마나 매파적인 입장을 확인할 수 있는지에 따라 결과가 달라진다.\n\n### 물가 압력이 금리를 먹먹하게 만들고 있다\n미국의 수입물가지수가 여전히 강한 압력을 받고 있다. 10월 수입물가는 전월 대비 +0.3% 상승하며 12월 FOMC에서 50bp 인상 가능성까지 제기되고 있다. 이는 물가 안정 의지를 표명하기 위한 연준의 추가 긴축 필요성을 강화한다. 하지만 동시에 물가 상승이 지속되면 경기를 너무 많이 억누르는 긴축으로 이어질 수도 있다. 이런 딜레마는 10월 FOMC 의사록과 연준 위원들의 발언을 통해 얼마나 매파적인 입장을 확인할 수 있는지에 따라 결과가 달라진다.\n\n### 물가 압력이 금리를 먹먹하게 만들고 있다\n미국의 수입물가지수가 여전히 강한 압력을 받고 있다. 10월 수입물가는 전월 대비 +0.3% 상승하며 12월 FOMC에서 50bp 인상 가능성까지 제기되고 있다. 이는 물가 안정 의지를 표명하기 위한 연준의 추가 긴축 필요성을 강화한다. 하지만 동시에 물가 상승이 지속되면 경기를 너무 많이 억누르는 긴축으로 이어질 수도 있다. 이런 딜레마는 10월 FOMC 의사록과 연준委员들의 발언을 통해 얼마나 매파적인 입장을 확인할 수 있는지에 따라 결과가 달라진다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 1. **국고채 금리: 바닥 타당성 vs 반등 속도**\n**현황**: 지난달 중순부터 국고채 10년금리는 4.0%대 후반이던 수준에서 3.9%대로 하락했다. 다만 최근 3일 폭등을 반추하면서 다시 4.0%대 초기값을 돌파했다.  \n**근거**:  \n- **하락세**: 11월 12일에는 국5-3 스프레드(-1bp)와 국10-3 스프레드(-1bp) 모두 줄었다. 11월 13일에도 국5-3 스프레드(-1bp), 국10-3 스프레드(-1bp)가 유지되며 국채금리 자체는 보합권에서 움직였다.  \n- **강세 여건**: 미국장 휴장을 앞둔 11월 13일 아침엔 외국인이 국채선물을 순매수했다. 그러나 오후 들어 미국 12월 FOMC 인상 가능성이 커지면서 채권 강세가 약해졌다(유진투자증권).  \n\n**왜 중요한가?**  \n- **바닥 타당성**: 신한투자증권은 \"외국인 선물 수급 유입 모멘텀이 약화되고 연말을 맞아 추가 매수가 제한돼 우호적이지 않은 분위기\"라고 진단했다. 하지만 같은날 10년 국채금리가 4.0%를 넘어서는 모습은 오히려 수급 방향이 아직 안갯속이라는 걸 시사한다.  \n- **반등 속도**: 11월 12일 국5-3 스프레드가 -0.6bp였다가 다음날 -1bp로 좁혀졌는데, 이는 5년 금리가 3년 금리를 따라잡는 양상을 보이는 것이다. 이는 일반적으로 5년이 3년보다 더 민감하게 금융환경 변화에 반응한다는 관찰과 어긋난다.  \n\n**의미**: 현재 국고채 금리는 4.0%대 초기값을 회복했다. 그런데 이 수준에서도 외국인 수급이 꺾이지 않고 있고, 5년 금리가 3년 금리를 따라가는 특이한 형태를 보이고 있다는 점은 단기 바닥을 넘어 반등을 준비중이라고 보는 것이 부담스럽다. \n\n### 2. **달러-원: 1,330원이란 파워 스윙 포인트**\n**현황**: 11월 13일 달러-원은 1,330.70원에 마감됐다. 이는 12거래일 만에 최저점을 찍으며 1,330원대를 붙든 첫날이다.  \n**근거**:  \n- **움직임**: 전일 종가 1,333.70원에서 2.90원 하락했다. 장초반 저가 매수로 올랐지만, 오후 들어 수출업체들의 달러 매도가 상단을 눌렀다.  \n- **맥락**: 코스피가 약세로 전환된 것도 달러-원 하락을 부추겼다. 동시에 외국인이 달러선물을 순매도했다(유안타증권).\n\n**왜 중요한가?**  \n- **기술적 중요성**: 1,330원은 2023년 8월 이후 가장 먼저 도달했던 수준이다. 당시 KOSPI200 지수가 920을 넘었던 것을 감안하면, 이번 1,330원은 비슷한 수준의 지수와 함께 나타났다.  \n- **외교적 배경**: 중국의 환율 조작국 판정이 무산된 것이 영향을 미쳤다. 이는 달러-원이 1,330원대를 붙드는 데 있어 한몫을 한다.  \n\n**의미**: 1,330원은 앞으로 달러-원이 1,320원으로 떨어지느냐, 아니면 1,340원으로 올라가느냐 하는 결정적인 교착 상태를 만들어낸다. 여기서 수출업체들의 달러 매도가 계속되면 1,320원으로의 접근이 현실화될 가능성이 있다.\n\n### 3. **국고채 30-10년 스프레드: 8bp로 3주 만에 최소**\n**현황**: 11월 13일 국30-10년 스프레드는 8.0bp로 마감했다. 이는 3주 만에 최소 수준이다.  \n**근거**:  \n- **변화**: 11월 12일 국30-10년 스프레드는 6.7bp였다. 다음날 1.3bp 상승했다.  \n- **전체 흐름**: 11월 13일 국5-3 스프레드(-1bp), 국10-3 스프레드(-1bp) 모두 줄었다. 10년-5년 스프레드는 13.8bp로 유지되었다.  \n\n**why important?**  \n- **기간별 격차**: 국30-10년 스프레드가 8bp로 작아지고 있으나, 국10-5년 스프레드(13.8bp)는 큰 차이를 보인다. 이는 10년 이상 국채에 대한 수요가 늘고 있지만, 5년 국채에 대해서는 그렇지 않다는 의미다.  \n- **공급량**: 국30-10년 스프레드가 작아지면 10년 이상 국채에 대한 수요가 많음을 의미한다. 그러나 국10-5년 스프레드가 크게 나오는 건 5년 국채에 대한 수요가 없다는 이야기다.  \n\n**meaning**: 국30-10년 스프레드가 8bp로 작아져 3주 만에 최소를 기록했는데, 이는 10년 이상 국채에 대한 수요가 늘고 있다는 의미다. 그러나 국10-5년 스프레드가 13.8bp로 크게 나오는 건 5년 국채에 대한 수요가 없다는 의미다. 따라서 10년 이상 국채에 대한 수요가 늘고 있지만, 5년 국채에 대해서는 그렇지 않다는 점을 알 수 있다. 이러한 격차는 앞으로 10년 이상 국채에 대한 수요가 얼마나 지속될지를 알려주는 계기를 제공한다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### ① 철강: 수입 규제 확대와 원가 하락이 동시에 작동하는 2027년\n\n2027년 글로벌 철강시장은 **원가 하락**이라는 긍정적 변수와 **수요 감소+수입 규제 강화**라는 부정적 변수가 동시에 작동하는 국면이다.\n\n- **원가 부담 완화**: 철광석은 글로벌 공급 확대 + 중국 철강 생산 감소로 **약세**가 예상되며, 원료탄도 공급 정상화로 추가 상승 여력이 제한적 → 철강업체들의 원가 부담은 점차 **완화**될 전망이다 (하나증권).\n  \n- **수요 측면**: 중국은 부동산 경기 침체 + 인프라 투자 부진에도 불구하고 정부의 재정 확대 + 부동산 투자 감소세 둔화로 철강 수요 감소폭이 **2026년 2.0% → 2027년 1.0%**로 축소될 전망 (하나증권). 공급 측에서는 생산능력 치환 규제 강화 + 철강사들의 감산으로 조강 생산 감소세가 이어짐. 하지만 **구조적인 공급과잉**과 높은 수출 압력이 남아 있어 철강가격의 **본격적 반등은 제한적** (하나증권).\n\n- **수입 규제 강화**: 미국은 높은 철강 관세 + 인프라 투자 확대, 유럽은 수입쿼터 축소 + CBAM 시행 → 상대적인 **가격 강세**가 예상되며, 지역별 가격 차별화가 지속될 전망 (하나증권). \n\n→ 따라서 2027년 철강주 투자는 **원가 하락**이 진행되는 동안, **수입 규제 강화로 수급이 꾸준히 타이트한 지역**(미국, 유럽 등)에 집중되어야 한다. 중국 자체는 수요 부진+과잉 공급이 동시에 작동하여 주춤할 전망이다.\n\n---\n\n### ② 항공우주: 스타십 15차, 사상 첫 궤도 발사체 완전 회수 도전\n\nSpaceX는 11월 14일(한국 시간) 텍사스 스타베이스에서 **스타십 15차 비행**을 발사한다. 이번 발사의 핵심 목표는 **사상 첫 궤도 발사체 완전 회수**다:\n\n- 1단 슈퍼헤비 부스터는 발사 후 발사탑의 젓가락 팔로 잡아 회수. 2단 스타십은 약 22시간 반의 궤도 비행을 마친 뒤 **같은 방식으로 회수**. 성공하면 궤도 로켓의 1·2단이 모두 온전히 돌아오는 **역사상 첫 사례** (유진투자증권).\n\n- 2단 스타십은 고도 약 275km에서 지구를 약 14바퀴 돌고, 발사 후 90분 안에 스타링크 V3 위성 26기를 **실전 배치**. 2단의 발사장 복귀는 재진입과 착륙 연소, 타워 접근에 필요한 시스템이 모두 정상일 때만 시도. 만약 이중 이상이 발생하면 **사전 지정 해역에 착수**하는 안전 설계가 적용 (유진투자증권).\n\n- **완전 회수**는 스타십 경제성의 전제 조건. 스타링크 V3 군집과 궤도 AI 데이터센터, 2028년 아르테미스 달 착륙까지 SpaceX의 로드맵은 모두 1·2단의 회수·재비행을 기반으로 설계. 스타십 V3는 완전 재사용 기준 저궤도 수송 능력이 100톤 이상 (팔콘9의 6배), 발사 단가도 완전 재사용이 정착되면 **수백 달러대**, 장기적으로는 머스크가 제시한 **100달러 이하**까지 낮아지는 것이 목표 (유진투자증권).\n\n→ 스타십 15차 성공 여부는 스페이스X의 **궤도 경제성 프랜키**를 결정짓는 시험대다. 실패 시 기술적 문제 해결이 필요할 것이며, 성공 시 스타링크 V3와 궤도 데이터센터의 초기 운영 가동 시기도 앞당길 전망이다.\n\n---\n\n### ③ 통신 및 IT: 로봇, 자율주행, ESG 지분거래\n\n#### A. 로봇: 수주 확대에 따른 추정치 상향, 데이터센터·공공주택 주목\n\n- **데이터센터 수주**: GS건설이 11월 10일 SK텔레콤과 12년간 500억원 규모의 데이터센터 공사를 수주 (GS건설 수주 금액은 당초 추정치인 150억원을 크게 상회). 반도체 팹 수주 역시 삼성전자로부터 650억원 규모의 ‘삼성 반도체 팹’ 공사를 수주한 것으로 파악 (삼성E&A의 수주 금액은 추정치인 500억원을 넘어서는 듯 함) (하나증권).\n\n→ **Top Pick**: 데이터센터 GS건설, 공공주택 계룡건설 / 관심종목: 반도체 팹 수주 금액이 예상을 상회할 가능성을 담은 삼성E&A.\n\n- **민간주택 종목 매수 시기**: 2027년 하반기에 이르렀을 때 민간주택 종목 매수를 제시. 이유는 수주 금액이 이미 대부분 공개되었으며, 추정치 상향 효과가 누적되기 때문이라고 판단 (하나증권).\n\n→ 종합: 2027년 상반기에는 데이터센터와 공공주택에 집중. 하반기에는 민간주택 종목으로 포트폴리오를 전환하는 것이 전략적이다.\n\n#### B. 자율주행 및 EV: 글로벌 자동차 판매는 완만한 증가, 전기차는 반등\n\n- **판매 전망**: 2026년 1%에 이어 2027년 인도/유럽 중심으로 **2% 성장**. 친환경차는 **10% 증가**하며 침투율 38%. 전기차는 **12% 증가**하며 침투율 25%로 반등. 하이브리드차는 미국(+10%)/유럽(+3%) 위주로 6% 증가, 침투율 13%.\n\n- **지역별 성장**: 유럽(+17%)의 성장률은 다소 낮아지고 있으나, 2026년 감소했던 미국(+10%)/중국(+4%)이 증가로 돌아서며 기여 (하나증권).\n\n- **중국 업체의 현지 생산 확대**: 중국 업체들의 전기차 수출은 여전히 늘고 있으며, 각국이 관세와 수입 규제를 강화하자 중국 업체들이 현지 생산을 늘리며 대응하고 있다. 지역별 파워트레인 대응력이 2027년 완성차의 성과를 가를 것 (하나증권).\n\n→ 2027년 글로벌 자동차 판매 성장은 완만하지만, 친환경차 특히 전기차는 반등하고 있다. 지역별 성장률은 유럽 > 미국 > 중국의 순으로 예상되며, 중국 업체들의 현지 생산 능력이 글로벌 시장 경쟁력을 좌우할 핵심 요소다.\n\n#### C. ESG: 장금상선 지분 보고, 주주제안 지분율 요건과 연대 권리\n\n##### i. 장금상선 지분 보고와 한진의 주가 반응\n\n- 11/10 장 마감 뒤 한진(002320)은 장금상선(비상장)의 지분 **7.34% 보고** 발표. 주가는 그날 이미 7.11% 상승. 의결권 기준 지분은 **7.8%**, 목적은 단순투자. 2대 주주 HYK 사모펀드를 더해도 **17.8%**, 최대주주 측 31.9%보다 14.1pP 적음 (한화투자증권).\n\n- 장금상선의 순이익 6,637억원, 현금 2.09조원. 주가는 추가 매수 공시 없이 이틀새 23.8% 상승. 11/11 종가는 주당순자산(약 9.3만원)의 0.23배. 2025년 금융원가 1,269억원이 영업이익 1,122억원보다 큰데, **낮은 PBR만으로는 매수 근거 부족**. 투자 기회는 **지배구조 변화**에서 나옴 (한화투자증권).\n\n- 한진의 할인을 줄일 계기는 장금상선의 현금보다 **지분이 누구에게 넘어갈지**. 지분 거래가 일어나면 할인이 줄어들 수 있다고 판단. 11/3에 하루 23.1% 오른 뒤 다음 날 17.9% 내려갔고, 12/2 전환 주식이 상장 예정. 장금상선 매수 단가와 전환가액이 있는 1.6만원대로 되돌릴 때 **소규모로 나눠 담는 이벤트 투자**가 적절하다고 판단 (한화투자증권).\n\n##### ii. 주주제안 권한: 지분율 요건 미달 시에도 연대 가능\n\n- 주주제안을 할 수 있는 자격은 회사의 상장 여부에 따라 다르다. 상법 제542조의6: 최근 사업연도 말 자본금 1천억원 이상의 상장회사는 지분 *0.5% 이상을 6개월 전부터 계속 보유해야 한다. 자본금 1천억원 미만의 상장회사는 지분 *1% 이상 보유. 비상장회사는 3% 이상 보유하면 주주제안 가능, 보유기간 요건 없음 (*의결권 없는 주식 제외, 발행주식총수 기준) (한화투자증권).\n\n- 비상장회사의 주주가 3% 이상의 지분을 확보하면, 보유기간과 관계없이 주주제안이 가능하다. 이는 상법 제542조의6 제10항에 근거. 즉, 경영권 분쟁으로 단기에 지분을 매집한 주주라도 3% 이상의 지분을 확보하면 주주제안권 행사 요건을 충족. 상장회사 특례가 일반 규정에 따른 소수주주권 행사에 영향을 미치지 않는다 (한화투자증권).\n\n→ 주주제안 권한은 회사의 상장 여부와 자본금 규모에 따라 다르지만, 비상장회사라면 **3% 지분 확보만으로 보유기간 제한 없이 제안 가능**. 상장회사라 하더라도 3% 지분 확보 시 일반 규정에 따라 제안 가능. 경영권 분쟁으로 지분을 단기에 매집한 주주라도 이를 통해 소수주주권을 행사할 수 있다.\n\n---\n\n### ④ 유틸리티 & 발전: 일별 SMP 상승 확인, KAU26 가격 YoY +188%\n\n#### A. 일별 SMP 상승: 11월 초 일별 SMP가 150원대까지 상승\n\n- 10월 월평균 SMP는 110.02원/kWh였다. 10월말과 11월 초 전력수요는 비슷하고, 공급능력도 평균 1GW 가량 줄어들었음에도 불구하고, **SMP가 150원대까지 상승**. 10월 말과 11월 초 전력수요가 비슷하면서 공급능력도 평균 1GW 가량 줄어든 점을 감안하면, **LNG 연료비 단가 상승만큼 SMP가 반영된 상태**. 따라서 규제와 같이 다른 요인이 작동한 것으로 보이나, 추이를 좀 더 관찰해야 (하나증권).\n\n- 9월 초중순부터 이어졌던 **SMP 약세 현상**이 11월 부로 어느 정도 마무리된 것으로 보이지만, 추이를 좀 더 관찰해야. 전력수요가 상승하면 SMP도 높아진 LNG 연료비 단가에 일정 부분 수렴할 것으로 예상 (하나증권).\n\n→ SMP는 10월 월평균 대비 **상승 추세**를 보이고 있으며, 11월 초 일별 SMP가 150원대까지 상승한 것은 일회성인지 아닌지를 며칠 더 지켜봐야 할 것으로 판단된다. 원인은 규제와 같은 또 다른 요인이 작용한 것으로 추정되나, 10월 말과 11월 초 전력수요가 비슷하고, 공급능력도 평균 1GW 가량 줄어든 점을 감안하면 LNG 연료비 단가 상승만큼 SMP가 반영된 상태로 판단하기 어렵지 않다.\n\n#### B. KAU26 가격: 12일 종가 기준 30,000원(YoY +188%)\n\n- 온실가스 배출권(KAU26) 가격은 12일 종가 기준 30,000원으로 전주대비 +1.7% 상승, YTD 188.5% 상승. 상승폭이 매우 크다. YTD 상승률이 거의 2배에 달하는 것을 보면, **KAU26 가격이 전년 대비 약 3배 수준에 위치**하는 것으로 추정된다 (하나증권).\n\n→ KAU26 가격의 급등은 온실가스 배출권 거래 시장의 **변동성**을 반영한다고 볼 수 있다. 10월 말과 11월 초 전력수요가 비슷하고, 공급능력도 평균 1GW 가량 줄어든 점을 감안하면, **LNG 연료비 단가 상승만큼 SMP가 반영된 상태**. 그러나 KAU26 가격은 이러한 사실과는 별개로 **YoY +188%**라는 매우 큰 폭의 상승을 기록하고 있어서, 이 가격이 얼마나 지속 가능한지에 대해서도 추가적인 관측이 필요하다.\n\n---\n\n### ⑤ 디펜딩&엔터메인터먼트: 크래프톤 <서브노티카 2>, 골든 조이스틱 어워드 수상\n\n- 크래프톤의 크리에이티브 스튜디오 언노운 월즈가 개발한 <서브노티카 2>가 골든 조이스틱 어워드 2026에서 **‘최고의 얼리 액세스 게임’ 부문 수상**. <서브노티카 2>는 미지의 외계 해양 행성을 배경으로 한 오픈월드 생존 제작 게임으로, 5월 얼리 액세스 출시 22일 만에 500만 장을 판매할 정도로 인기를 끌었다 (IBK투자증권).\n\n→ <서브노티카 2>는 발매 직후부터 좋은 판매 성과를 거두었고, 골든 조이스틱 어워드 수상으로 국제적인 인정을 받았음을 보여준다. 크래프틴의 IP와 크리에이티브 스튜디오의 역량이 잘 결합된 작품으로, 앞으로 더욱 다양한 제품군을 선보일 것으로 기대된다.\n\n---\n\n### ⑥ 기타: PCB, MLCC, 납기 연장, 가격 상승\n\n- 10월 대만 전자광학 PMI는 60으로 전월 대비 2.6pt 하락하며 ’26년 3월 이후 가장 느린 확장 속도를 기록. 신규주문과 생산도 상반기에 비해 크게 둔화됨. 원자재와 부품의 수급 불균형으로 납품 차질이 발생한 것으로 파악. 리드타임은 여전히 길게 유지되고 있음. 납기 지수와 가격 지수가 각각 70, 80 전후의 고점을 유지하고 있기 때문에, 부족이 해소되지 않았다는 의미로 해석 (iM증권).\n\n- MLCC는 ’29년까지 공급부족이 이어질 것으로 전망하며, FC-BGA는 ’30년 이후 물동을 두고 고객과 논의할 정도. 기판의 경우 선두업체들을 중심으로 ’28~’32년 캐파 할당을 마쳤고, MLCC에서도 일부 고객이 2~3년 단위 계약을 요청하고 있음. 수급환경이 타이트해질수록 LTA 확대와 가격 조건도 개선될 것으로 전망 (iM증권).\n\n→ PCB 및 MLCC 시장은 납기 연장과 함께 가격 상승이 이루어지고 있음. 납기 연장은 부족이 해소되지 않은 것으로 해석. 또한, MLCC는 ’29년까지 공급부족이 이어질 것으로 전망되며, FC-BGA는 ’30년 이후 물동을 두고 고객과 논의할 정도임. 기판의 경우 선두업체들 중심으로 ’28~’32년 캐파 할당을 마쳐, MLCC도 일부 고객이 2~3년 단위 계약을 요청하고 있음. 수급환경이 타이트해질수록 LTA 확대와 가격 조건도 개선될 것으로 전망 (iM증권).\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 젠슨 황 엔비디아 CEO 사임: 구조적 불확실성 vs 단기 시그널\n\n엔비디아의 경영진 교체는 3단계 파급 효과를 동시에 열었다:\n\n**A. 구조적 불확실성의 본질**\n- **기술 주도권 재편**: 사임 직후 엔비디아 낙폭(-4.3%)은 AI 투자심리를 즉각 손상시키겠지만, 시장의 빠른 반등과 경쟁사(AVDGO +5.5%, AMD +5.9%)의 동시 강세는 해당 투자심리가 엔비디아 특정에 집중된 것이 아니라는 것을 입증. AI 전체 수요 둔화보다는 엔비디아의 시장 지배력 약화가 주가 폭락의 핵심 이유였다(KIOM).\n  \n- **공급망 노동자 권리 요구**: 사임 직전 추가 불륜 의혹과 이사회 해임 준비 보도는 단순 경영난 넘어 조직 문화까지 불신을 촉발. 이사는 경영진교체의 형식적 처리에 집착했던 젠슨 황의 경영스타일을 반영한다(SHIN).\n\n**B. 단기 시장 반응의 이중성**\n- **낙폭 축소 패턴**: 사임 당일 낙폭 최대 14%(SHIN) → 1시간 후 4.3%p 축소 → 다음 날 0.6%p 추가 상승. 이는 이미 엔비디아가 주도하는 AI 시장을 상품화한 공급망(ASML, ASX, AVDV)이 젯슨 황의 개인 능력을 넘어선 시장 운용이라는 현실을 인정하고 있음을 보여줌(IBK). \n- **미-중 수출규제 연결**: 미 의회 내 대중 반도체 수출 감독 강화 논의와 함께, 젠슨 황 사임이 이를 가속화한다는 인식이 확산됨. 2027년 1월 수출규제 유예 종료 시점과 맞물려, 경영진 교체가 단기 공급망 불확실성 이상으로 중국 규제 강도를 증폭시키는 도화선 역할(KIOM).\n\n**C. 경영공백의 질적 평가**\n- **임시 CFO 임명의 신호**: 콜렉 크레스(CFO)가 임시CEO로 선임되어 17일 실적발표를 앞둔 시점까지 경영 공백이 사실상 없다는 점은 시장 충격의 러닝타임을 줄이는 안전판(KIOM).\n- **과거 CEO 교체 사례**: 애플(잭스 사임 시 14% 급락 후 3개월 내 복귀), 인텔(브라이언 크르자니크 사임 시 1년간 8% 하락) 등을 통해 실적 전망과 후임 선임 속도가 주가 반등 속도를 좌우하는 구조를 검증. 엔비디아는 후임 선임 속도가 중요 변수(KIOM).\n\n> ⚠️ 리스크 포인트: 17일 실적발표에 포함된 AI 수요 전망 수정 또는 차세대 제품(BEV RUBIN) 양산 일정 변경이 단기 공급망 충격으로 작용할 수 있으며, 정책변수로서 중국 반도체 규제 강화 여부 또한 엔비디아의 기술 경쟁력과 별개로 또 다른 불확실성을 덧붙임(SHIN-KIOM).\n\n---\n\n### 2. AI 투자심리의 구조적 지지: 광학 설비 & 중국 반도체 국산화\n\n#### A. 광학 설비 수급: 수익성 전환의 전초\n광통신(PON)과 PCB, GPU(AMD/ALD)로의 매수가 순차적이라면서도, 주말에는 차익실현 반복된 배경이 있다(SHN):\n\n**1) 10월 중국 수출 (+35.2% YoY)**은 AI 수요에 대한 실질 지지를 보여주는 실증 데이터. 1-10일 반도체 수출은 +331.2% YoY로 이 수요가 이미 시장에 반영된 상태.\n\n**2) 알리바바 T-Head 홍콩 IPO**, 이노라이트 3Q 800G·1.6T 주문 증가, 2027년 수요 확보 확인 등은 중국 내 반도체 국산화가 디램 공급 부족에 대한 대응 수단으로 자리 잡았음을 표시(SHN).\n\n**3) 미국 데이터센터 규제 우려 완화**로 CPO/PCB/GPU로 저가 매수세 유입. 그러나 기존 3분기 말 기준 56.3%라는 활성 펀드 기술주 편입 비중이 역사적 고점을 기록한 점에서, 단기 매수세가 기관 보유 물량이 상당 부분 남아 있는 상황에서의 \"수급 부담\"을 피할 수 없는 구조임(SHN).\n\n---\n\n### 3. 3Q 어닝: 실적 우려 vs 대형주 성과의 이중성\n\nKB투자는 3Q 실적 발표가 진행되었음에도 불구하고, **대형 주요 기업**(삼성전자, SK하이닉스, 현대차, SK이노베이션)을 제외하면 일반 기업군이 영업이익 컨센서스를 약 3.2% 하회했음을 확인했다:\n\n- **삼성전자·현대차·SK하이닉스·SK이노베이션** 4종목 제외하면, 영업이익 컨센서스를 약 3.2% 하회했고 종목수 비율도 상회 > 하회 비율이 반전되었다(KBK).\n\n- **대형주 제외 시 하회**라는 결과는, 이 4종목의 실적이 시장의 우려를 훨씬 깨버렸다는 것을 뜻함. 이들의 실적이 시장의 기대치를 상회한 정도는 상대적으로 4종목이 아닌 전체 기업군에 비해 더 컸다.\n\n- **S&P500 +2.9%, NASDAQ +3.2%**를 기록했음에도 불구하고, 이러한 실적 발표 전후의 충격이 오히려 시장의 우려보다 **작았다**는 것이다(KBK).\n\n이 이중성은 KB투자가 지적하는 바와 같이, 3Q 어닝 시즌이 리스크 대부분을 반영했음을 시사하는 동시에, 아직도 실적 발표 전후의 충격이 시장의 우려보다 작은 상황이므로, 3Q 어닝 시즌이 완전히 끝난 후에는 다시 상승 모멘텀이 출발할 수 있는 조건이 마련된다는 해석으로 이어진다(KBK).\n\n---\n\n### 4. 외국인 수급: 환율·금리·기관 세력의 3중 겹침\n\n#### A. 환율-수급의 단기 반사\n- SHIN/KIOM 모두 **원달러 환율이 6개월 이동평균 하회 시 외국인이 매수우위로 전환** 되는 경향을 지적. 그러나 동시에 미국-한국 금리차 관점에서는 외국인 수급의 장기 추세적 유입 가능성이 제한적임을 밝힘.\n\n- SHIN은 이 주에 광통신→GPU로 매수세가 순차적으로 유입되었으나, 상승 직후 차익실현이 반복되었는데, 이는 AI 영상·숏폼 드라마 관련 기업들이 실제 사업 매출 비중이 낮다는 공시로 테마주 조정이 심화되기 때문이라고 진단. 이 조정은 외국인 매수세가 유입된 후에도 지속됨.\n\n#### B. 기관·개인의 세력 구조\n- QWER: 7월 이후 개인의 매수세가 둔화되었고, 증시 내 주요 순매수 주체는 부재한 상황. 이에 따라 외국인 수급 민감도가 확대됨.\n\n- 개인이 매수세의 주요 축인데도 둔화되었음에도 불구하고, 외국인이 주요 순매수 주체가 될 수 있으리라는 전제는 외국인 수급 민감도가 확대된다는 QWER의 주장과 일치함. 그러나 이 외국인 수급의 장기 추세적 유입 가능성이 금리차 관점에서 제한적이라는 SHIN의 진술은, 외국인 수급 민감도가 확대된다는 QWER의 진술과 모순되지 않으며, 오히려 같은 맥락에서 서로 다른 시간대에 적용 가능한 관찰로 볼 수 있음(QWER-SHIN).\n\n---\n\n### 5. 실적발표 전략: 어닝 서프라이즈 확률과 셀론의 조절\n\nQWER의 전략 제안은 다음과 같다:\n\n1. **실적발표 전 어닝 서프라이즈 확률이 높은 종목 선별**\n\n   - 어닝 서프라이즈 확률이 높은 종목 선별이라는 전략은, 단순히 어닝 서프라이즈 자체가 아니라 그 확률이 높은 종목에 집중한다는 데 의미가 있다. 어닝 서프라이즈 확률 자체가 높다면, 서프라이즈가 실제로 발생할 확률도 높다는 뜻이다.\n\n2. **실적발표 후 서프라이즈 강도와 셀론에 따른 비중 조절**\n\n   - 서프라이즈 강도는 서프라이즈의 크기를, 셀론은 서프라이즈가 발생한 후 주가가 얼마나 많이 올랐는지를 측정하는 지표이다. \n\n     - 만약 서프라이즈 강도가 크면서 셀론이 작다면, 서프라이즈가 이미 반영되었다고 보기 어렵지 않을까? 반대로 서프라이즈 강도가 크고 셀론이 크면, 서프라이즈가 시장에 의해 잘 반영되지 못했을 가능성이 있다.\n\n     - 그러나 QWER는 이 두 지표를 따로 사용한다고 한다. 즉, 서프라이즈 강도를 이용해 어떤 종목이 정말로 좋은 실적을 냈다는 것을 먼저 확인하고, 그 후에 셀론을 이용해 그 서프라이즈가 이미 반영되었는지 여부를 판단하여 비중을 조절한다는 것.\n\n   - 이는 단순히 서프라이즈가 클 수도 있고, 셀론이 클 수도 있기 때문에, 서프라이즈가 클 때는 그만큼 많은 비중을 주어야 하고, 셀론이 클 때는 그만큼 비중을 줄여야 한다는 의미로 해석할 수 있다.\n\n---\n\n### 6. 3Q 어닝의 리스크 완화: 대형주와 중소형주의 이중성\n\nIBK는 3Q 어닝 리스크가 완화되었다고 판단했는데, 그 근거는 다음과 같았다:\n\n- 3Q 어닝 리스크가 완화되었다는 근거는, 삼성전자, SK하이닉스, 현대차, SK이노베이션이 모두 실적이 시장의 우려보다 양호하게 발표되었다는 점에서 찾을 수 있다.\n\n- 영업이익 컨센서스가 존재하는 226개 기업을 대상으로 분석하면, 3Q 영업이익은 시장의 예상을 약 3.9% 상회한다. 이는 전체 기업의 실적 평균이 컨센서스를 상회하는 것을 의미한다. 그런데 이 226개 기업 중에서도, 삼성전자, SK하이닉스, 현대차, SK이노베이션을 제외하면, 시장의 예상을 약 3.2% 하회한다. 즉, 이 4개 기업이 시장의 예상을 상회한 정도가 전체 기업군에 비해 더 컸다는 뜻이다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로 분야에서는 미국의 10월 CPI와 수입물가지수가 시장 예상치를 상회하며 물가 상승 지속 우려를 강화하고 있다. 이는 연준의 추가 긴축 필요성을 높이지만, 경기 억제 우려도 동시에 제기된다. 이러한 딜레마는 12월 FOMC 의사록과 연준 위원들의 발언에 따라 결과가 달라질 수 있다. 채권 시장에서는 국고채 금리가 4.0%대 초기 수준으로 회복했으며, 5년-3년 스프레드의 이례적 축소와 외국인 수급의 지속성 등으로 단기 바닥을 넘어서는 반등 가능성이 제기되고 있다. 산업 섹터에서는 철강업계가 2027년 원가 하락과 수입 규제 강화에 따른 수급 타이트화로 지역별 수요 차별화가 예상되며, 항공우주 분야에서는 스타십 15차 발사 성공 여부가 궤도 경제성에 중요한 영향을 미칠 것으로 보인다."}]}</script>
