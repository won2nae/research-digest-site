예상치(+0.2%)를 상회하면서 국채 대규모 매도세가 출현했다. Fed 위원 Christopher Waller의 매파적 발언이 더해져 12월 0.5%p 인상 가능성까지 베팅이 커졌다.\n\n> *Reuters, Bloomberg, Investing.com*\n\n---\n\n**한국 10년 국채금리 +10.10bp**\n\n위 미국 CPI 쇼크가 **글로벌 채권 동반 매도세**로 전이되며 한국 국채도 함께 약세를 보였다. 아시아 주식 반등과 채권 약세가 같은 날 공존하는 양상을 복수 외신이 보도했다.\n\n> *biz.chosun.com(English), Investing.com*\n\n---\n", "news_md": "## 미국 뉴스\n\n- **10월 CPI 예상 상회 → 뉴욕 증시 일제 하락** | 10월 소비자물가지수(CPI)가 전월 대비 0.4% 상승해 예상치(0.3%)를 웃돌며 S&P 500·나스닥·다우 모두 하락 마감. *(Reuters, CNBC)*\n\n- **Fed 월러 위원 \"12월 금리 인상 지지, 50bp도 가능\"** | 연준 이사 크리스토퍼 월러가 런던 연설에서 추가 긴축 필요성을 강조하며 12월 25bp 인상을 지지하되 10월 근원물가에 따라 50bp도 열려 있다고 밝힘. *(Bloomberg, Reuters)*\n\n- **달러 강세** | 예상 상회 CPI와 연준 긴축 기대가 맞물리며 달러화가 주요 통화 대비 강세 전환. *(CNA, Investing.com)*\n\n- **호르무즈 해협 선박 공격으로 유가 반등** | 이란 휴전 기대로 2개월 저점까지 밀렸던 브렌트유가 반등해 $92.20 기록. 호르무즈 해협 공격 보도가 하방 압력을 상쇄. *(Reuters, CNBC)*\n\n- **마이크로소프트, 중국산 광트랜시버 수입 금지 반대** | 트럼프 행정부가 AI 데이터센터용 중국산 광트랜시버 수입 제한을 검토 중인 가운데 마이크로소프트가 공급 차질·데이터센터 확장 지연 우려를 들어 반대 의사 표명. *(Reuters, Business Insider)*\n\n## 한국 뉴스\n\n- **코스피 4.55% 급등, 양 시장 매수 사이드카 발동** | 미국 반도체·기술주 반등을 따라 삼성전자·SK하이닉스가 주도하며 코스피·코스닥 동반 급등. 거래소가 양 시장에 매수 사이드카를 발동해 프로그램 매매를 일시 중단. *(조선비즈, 세계일보)*\n\n- **한국 정부, 유류세 인하 1월까지 2개월 연장** | 기획재정부가 중동 불안과 고유가를 감안해 휘발유 15%, 경유·부탄 25% 유류세 인하 조치를 2027년 1월까지 유지한다고 발표. *(연합뉴스, Korea Times)*\n\n- **박홍근, 반도체 쏠림 위험 경고** | 박홍근 의원이 증시 하락을 반도체 집중 경제구조에 대한 경고 신호로 보고 성장 동력 다각화와 미국 중간선거 이후 경제 영향 평가를 촉구. *(아시아경제, 헤럴드경제)*", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 매크로(경제): 오늘의 매크로 충격 지표\n\n### ② 미국 CPI: 근원 +0.3%로 3개월 연속 기준 상회\n\n#### ■ 무슨 일이 일어나고 있는가?\n10월 미국 소비자물가는 전월대비 0.4% 상승(예상 0.3% 상회), 근원 물가도 0.3% 상승(예상 0.2% 상회)하며 3개월 연속 기준 상회. 에너지 상승세는 둔화(전월 5.2%→+0.7%)했지만 식품(+0.5%)과 서비스(+0.3%) 물가가 계속 상승하며 헤드라인을 끌어올렸다. 특히 주거비(+0.3%)가 전월비 30% 이상을 차지하며 물가 둔화를 제한.\n\n#### ■ 왜 그런가? (경제적 메커니즘)\n1. **에너지 상승세 둔화**: 9월 5.2% 상승 후 10월 0.7%로 급격히 낮아짐(휘발유 +1.0%). 하지만 이는 8월 8.5% 상승 후 정점을 넘어서는 것이므로 단기 변동.\n2. **식품과 서비스의 지속적 상승**: \n   - 식품(+0.5%)은 9월 보합에서 반등(쇠고기 +0.9%, 외식 +0.5%).\n   - 서비스(+0.3%)는 교통서비스(+0.8%), 여가(+0.8%), 의료(+0.3%) 등 다양한 항목에서 상승.\n   - 주거비(+0.3%)는 OER(임대료)+0.2%로 전월비 30% 이상을 차지.\n3. **중고차 하락이 근원 물가를 일부 낮춤**: 중고차는 -1.2% 하락했지만, 이를 제외한 근원 상품은 +0.4%로 9월보다 내용은 나쁘다. \n\n#### ■ 그래서 어떤 의미/파급효과가 있는가?\n- **12월 추가 인상 확률 100%**: 연준은 10월 FOMC에서 기준금리를 동결했지만, CPI 발표 전 월러 이사는 \"근원 +0.3% 이상이면 12월 빅스텝(50bp 인상) 고려\", 로건 총재는 \"최소 2회 추가 인상\"을 언급. 시장은 연준의 12월 인상 확률을 100%(25bp 88.5%, 50bp 11.5%)로 기정사실화.\n- **근원 CPI가 3개월 연속 +0.3% 고착**: 근원 CPI는 3개월 연속 +0.3%를 기록하며 기조 물가의 안정 여부가 아직 확인되지 않음. 근원 CPI가 +0.2% 대로 내려올 때까지 연준은 추가 인상 기조를 유지할 것으로 판단.\n- **PCE vs CPI**: 10월 PCE(11/25)는 전월비 근원 +0.3%, 전년비 3.1~3.2%로 CPI보다 높을 것으로 예상. 12월 근원 CPI +2.7~2.8% 전망은 유지하되, 헤드라인은 유가 급락을 반영해 +3.8~4.0%에서 +3.4~3.6%로 하향. 방향이 '상방'에서 '둔화'로 바뀐 것은 전적으로 유가 요인이며 근원 물가는 변화가 없음.\n\n---\n\n### ③ 글로벌 채권 동반 매도세: 미국 CPI 쇼크→한국 국채도 약세\n\n#### ■ 무슨 일이 일어나고 있는가?\n10월 미국 근원 CPI가 전월 대비 +0.3%로 시장 예상치(+0.2%)를 상회하면서 국채 대규모 매도세가 출현. Fed 위원 Christopher Waller의 매파적 발언(\"12월 0.5%p 인상\")이 더해져 12월 0.5%p 인상 가능성까지 베팅이 커졌다. 이에 따라 **미국 10년 국채금리는 +13.80bp**, **한국 10년 국채금리는 +10.10bp** 상승하며 글로벌 채권 동반 매도세가 진행되고 있다.\n\n#### ■ 왜 그런가? (경제적 메커니즘)\n1. **미국 CPI 쇼크**: 근원 CPI가 3개월 연속 +0.3% 고착되며 기조 물가의 안정 여부가 아직 확인되지 않음. 근원 CPI가 +0.2% 대로 내려올 때까지 연준은 추가 인상 기조를 유지할 것으로 판단.\n2. **Waller의 매파적 발언**: Waller는 \"12월 0.5%p 인상\"을 언급하며 50bp 인상 가능성이 커지고 있음.\n3. **한국 국채의 위험 선호:** 한국 국채는 미국 CPI 쇼크와 중국의 위안화 급락(+)을 동시에 받았지만, 한편으로는 KOSPI가 +2.6% 반등하며 위험 선호가 회복되어 국채 약세가 이어졌다.\n\n#### ■ 그래서 어떤 의미/파급효과가 있는가?\n- **미국 CPI 쇼크→국채 대규모 매도**: 미국 CPI가 기준 상회하자 국채 대규모 매도세가 출현. Fed委员Christopher Waller의 매파적 발언이 더해져 12월 0.5%p 인상 가능성까지 베팅이 커졌다.\n- **한국 국채도 동반 약세**: 미국 CPI 쇼크와 중국의 위안화 급락(+)을 동시에 받았다. 다만 KOSPI가 +2.6% 반등하며 위험 선호가 회복되어 국채 약세가 이어졌다.\n\n---\n\n### ④ 미·이란 공격 중단→유가 급락, 12월 25bp(4.00~4.25%) 기본\n\n#### ■ 무슨 일이 일어나고 있는가?\n미·이란 공격이 중단되며 호르무즈 해협 재개 기대로 브렌트유는 $90 내외로 급락. 11월 휘발유 하락이 헤드라인을 끌어내림. 10월 고용 +16.5만, 실업률 4.1%로 견조하나 임금 둔화세로 실질 임금은 여전히 마이너스임.\n\n#### ■ 왜 그런가? (경제적 메커니즘)\n1. **미·이란 공격 중단→유가 급락**: 미·이란 공격이 중단되며 호르무즈 해협 재개 기대로 브렌트유는 $90 내외로 급락.\n2. **11월 휘발유 하락→헤드라인 둔화**: 11월 휘발유 하락이 헤드라인을 끌어내림.\n3. **고용 견조→임금 둔화**: 10월 고용 +16.5만, 실업률 4.1%로 견조하나 임금 둔화세로 실질 임금은 여전히 마이너스임.\n\n#### ■ 그래서 어떤 의미/파급효과가 있는가?\n- **유가 급락→헤드라인 둔화**: 11월 휘발유 하락이 헤드라인을 끌어내림. 12월 근원 CPI +2.7~2.8% 전망은 유지하되, 헤드라인은 유가 급락을 반영해 +3.8~4.0%에서 +3.4~3.6%로 하향.\n- **임금 둔화→실질 임금 마이너스**: 10월 고용 +16.5만, 실업률 4.1%로 견조하나 임금 둔화세로 실질 임금은 여전히 마이너스임. 이는 소비 부양 효과를 제한.\n\n---\n\n### ⑤ 12월 25bp(4.00~4.25%) 기본, 50bp 인상 가능성 낮음\n\n#### ■ 무슨 일이 일어나고 있는가?\n12월 25bp(4.00~4.25%)를 기본으로, 50bp 인상 가능성은 낮다고 판단됨. 1) 미·이란 공격 중단과 호르무즈 해협 재개 기대로 브렌트유는 $90 내외로 급락, 11월 휘발유 하락이 헤드라인을 끌어내림. 2) 10월 고용 +16.5만, 실업률 4.1%로 견조하나 임금 둔화세로 실질 임금은 여전히 마이너스임.\n\n#### ■ 왜 그런가? (경제적 메커니즘)\n1. **유가 급락→헤드라인 둔화**: 11월 휘발유 하락이 헤드라인을 끌어내림. 12월 근원 CPI +2.7~2.8% 전망은 유지하되, 헤드라인은 유가 급락을 반영해 +3.8~4.0%에서 +3.4~3.6%로 하향.\n2. **임금 둔화→실질 임금 마이너스**: 10월 고용 +16.5만, 실업률 4.1%로 견조하나 임금 둔화세로 실질 임금은 여전히 마이너스임. 이는 소비 부양 효과를 제한.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n\n### 금리 하락의 진실 - 외국인 숏커버가 아닌 캐리 매력의 역습\n\n오늘 국내 채권시장은 3%대 국고채 금리로 마감했는데, 이는 두 가지 다른 메커니즘이 서로 먹물을 만들어낸 결과다. 먼저 외국인 국채선물의 숏커버가 있다는 주장이 있지만, 실제로는 1,2년 구간의 금융채 캐리가 오히려 장기금리를 더 깊숙이 밀어내고 있었다.\n\n유안타증권의 관찰은 중요한 단서를 제공한다. 외국인 국채선물 미결제량이 9월물보다 감소했다는 사실은, 숏커버가 새로운 매수를 창출하는 것이 아니라 기존 포지션을 정리하는 행위라는 것을 입증한다. 즉, 외국인의 선물 매수세가 기존 매도포지션을 정리하는 숏커버의 성격을 갖는다는 것이다. 그런데 왜 이런 숏커버가 발생했는지를 살펴봐야 한다.\n\n이것은 결국 1,2년 구간의 금융채 캐리 매력을 설명해주어야 한다. 유안타증권은 IRS금리변동과 신용스프레드 등의 수치를 들며, 금융채의 캐리 매력이 높아졌다고 설명한다. 그리고 이 캐리 매력이 외국인들의 포지션 구조에 영향을 준다. 외국인의 포지션 변동 원인이 무엇인지 파악해야 적절한 시장을 대응할 수 있는데, 이때 FX Swap이 상대적으로 상승했던 점이 외국인의 선물 숏커버를 확대시키는 요인이 된다.\n\n그렇다면 외국인들이 왜 именно 1,2년 구간의 캐리를 선택했을까? 이는 단순한 수학 문제가 아니다. 금융채 캐리 매력은 단기금리 커브의 플랫테닝 요인에 의해 결정된다. 외국인들은 이러한 요인을 잘 알고 있기 때문에, 자신들에게 가장 매력적인 구간을 찾아내는 것이다.\n\n따라서 오늘 국채 가격의 변동성은 외국인의 포지션 변동 때문이라고 보기 어렵다. 외국인의 포지션 변동의 원인을 알아야 적절한 시장 대응이 가능한데, 외국인들이 단기금리 커브의 플랫테닝 요인에 따라 1,2년 구간의 캐리를 선택했다는 점을 이해해야 한다.\n\n### 10년물의 숏커버 vs 5년물의 매수강화 - 외국인의 포지션 구조 변화\n\niM증권의 분석은 외국인 포지션 구조의 변화를 매우 세밀하게 묘사한다. 자산운용사는 5년물에서 32.6만계약의 순매수를 기록했고, 이 중 23.9만계약이 최근 1주에 집중됐다. 그러나 울트라 10년물 순매수는 1.9만계약에 그친 상태다. 반대로 10년물은 15.5만계약의 순매도가 추가됐는데, 이는 매수 청산보다 매도 잔고 증가에서 비롯됐다.\n\n이런 변화는 외국인들이 10년물에서의 매수 참여가 사라진 것이 아니라, 오히려 매도 포지션이 더 빠르게 쌓이고 있다는 의미다. 기관의 순매수가 유지되면서 일반 10년물 매도 잔고가 감소한다면 금리 하락을 뒷받침하는 수급 근거가 넓어질 수 있지만, 반대로 기관의 매수 속도가 둔화되고 매도 잔고 증가가 이어진다면 수급에 기반한 추가 금리 하락의 지속성은 약해질 수 있다.\n\n이런 변화는 외국인들의 포지션 구조가 10년물에서 5년물로 이동하고 있음을 시사한다. 외국인들이 10년물에서의 매수 참여가 사라진 것이 아니라, 오히려 매도 포지션이 더 빠르게 쌓이고 있다는 의미다.\n\n### 외국인의 숏커버와 캐리 매력 - 두 가지 모델의 경쟁\n\n두 가지 접근 방법이 존재한다. 하나는 외국인의 숏커버를 중심으로 하는 모델이고, 다른 하나는 캐리 매력을 중심으로 하는 모델이다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. AI 인프라: 서버 수요 우려 완화 vs. 정치적 불확실성 확대  \nAI 서버기업 CoreWeave의 실적이 호조를 보이며 AI 인프라 수요에 대한 우려가 완화되었다. 이에 따라 삼성전자·SK하이닉스 등의 반도체주가 급등하며 외국인과 기관의 동반 매수가 이뤄지고 있다.  \n\n반면, SpaceX의 Boca Chica 주립공원 부지를 매입하려는 계획에 제동이 걸렸다. 주민 보호 입법이 완료되기 전까지 신규 데이터센터 승인이 유예되어, 전력과 용수 사용에 관한 규제가 강화될 가능성이 제기되고 있다. 또한, 민주당 주지사 당선자의 요청으로 공공토지 매각 절차가 중단될 수도 있어, 우주의 구조적 성장 방향성은 유효하나, 정치적 불확실성 확대로 인해 인프라 투자 일정이 지연되고 단기 밸류에이션이 할인될 가능성이 있다. \n\n따라서 AI 수요가 생성하는 고성능이 가격 상승 및 탑재량 증가를 통해 반영되고 있는지에 대한 확인이 필요한 시점이다. 전기전자 섹터에서는 이러한 고성능 수요에 충분히 부합하는 기업이 많다는 것이 교보증권의 판단이다.\n\n---\n\n### 2. 메모리 반도체: 초과 수요와 수급 불균형  \nDRAM 3사(삼성전자, SK하이닉스, 마이크론)의 2027년 Capex는 전년 대비 40% 이상 증가할 전망이다. 이는 DRAM 투자 풀링(Pulling)과 NAND 전환 투자가 동시에 가속화되고 있기 때문이다. 그러나 타임라인을 고려할 때 유의미한 수급 불균형의 완화는 1H28 이후 반영될 것으로 추정된다. 2027년 DRAM은 HBM 생산 비중 확대에 따라 예상 대비 B/G가 제한적 수준에 그칠 가능성도 상존한다. NAND는 공간 제약 때문에 전환(Migration) 중심의 투자가 지속될 것으로 예상된다. 따라서 타이트한 수급 환경이 유지될 것으로 보인다.  \n\n이와 별개로, 1Q27 DRAM은 HBM 단가 인상 효과로 Blended ASP가 +10~15% 상승할 전망이다. 스마트폰 출하 감소 우려에도 불구하고 SOCAMM 공급 본격화로 LPDDR(저전력 DRAM) 가격도 인상될 것으로 예상된다. 또한, 견조한 범용 DRAM 가격과 신규 애플리케이션 확장 효과가 맞물리는 시기다. HBM 수요는 2026년 350억GB에서 2027년 590억GB로 69% 증가가 기대된다.  \n\nLTA 체결 비중(CAPA 기준)은 2026년 말 35~40%로 추정되며, 2027년부터는 50%를 상회할 것으로 전망된다. 계약 구조상 가격밴드는 공급사 수익성에 맞춰 단가변동을 반영할 가능성도 존재한다. 가격 하락을 가정하더라도 최소 50%를 상회하는 수익성이 기대된다. 글로벌 메모리 시장은 2026년 9,750억달러에서 2027년 1조6,771억달러로 성장할 전망이다(DRAM 1조2,179억달러, NAND 4,592억달러).\n\n---\n\n### 3. AI 반도체: 메모리 접근 효율화와 아키텍처 조정  \nCompute와 AI 모델이 모두 메모리 접근의 효율화를 요구하고 있다는 점에서, 2027년 AI 반도체를 이해하는 핵심 변수는 메모리를 얼마나 빠르게, 어떤 구조로 읽느냐다. 과거 사이클의 수요 둔화가 재고 조정이었던 것과 달리, 지금의 변화는 \"아키텍처 조정\"이다.  \n\nCompute에서 연산 성능이 메모리 대역폭보다 빠르게 늘어나면서, 가속기 설계의 초점이 연산기의 숫자를 늘리는 것에서 필요한 데이터를 연산 유닛 가까이에 두는 것으로 옮겼다. AI 모델에서 추론이 길어질수록 연산기가 데이터를 기다리는 Decoding 비중이 커져, 메모리 대역폭과 데이터 이동 효율이 추론의 속도와 비용을 결정한다. 이에 맞춰 새로운 메모리가 존재감을 드러내고 있다. 베이스다이가 로직 공정으로 넘어가 데이터 이동 경로의 일부가 되는 Custom HBM, 대역폭 한계를 푸는 MRDIMM, 연산 일부를 메모리 안에서 처리하는 PIM이 대표적이다. \n\n---\n\n### 4. 데이터센터: 수요와 공급의 냉정한 현실  \nAI 데이터센터에 대한 수요가 확대되고 있지만, 공급 측면의 문제는 해결되지 않았다. 먼저, 미국 10년 국채금리가 +13.8bp 상승한 것은 10월 근원 CPI가 전월 대비 +0.3%로 시장 예상치를 상회했기 때문이다. Fed 위원 Christopher Waller의 매파적 발언이 더해져 12월 0.5%p 인상 가능성이 베팅되면서, 미국의 금융비용 상승이 글로벌 AI 데이터센터 건설에 대한 자본 확충을 어렵게 만들고 있다.  \n\n추가로, 미국에서 새롭게 제정된 법률은 데이터센터 건설의 인허가 기간을 단축시키지만, 동시에 데이터센터 비용 회수 조항을 포함하였다. 데이터센터 건설에 대한 비용 회수가 어려워지면, 공급 측의 이익성 문제가 대두될 수밖에 없다. 이는 Data Center의 수요가 실제로 공급 측의 비용 회수 가능 여부와 밀접하게 연동됨을 의미한다. 따라서, 앞으로 AI 데이터센터의 수요와 공급 사이의 격차는 더욱 크고 깊어질 가능성이 있다. \n\n---\n\n### 5. 엔터/미디어: 27년 홀수 해의 특별함  \n2027년 엔터/미디어 섹터는 특별한 홀수 해를 맞이한다고 신한투자증권은 주장한다. 합산 매출액 7.2조원, 손익 9,946억원으로 전년 대비 9%, 4% 감소할 전망이다. 하지만 주가는 2024~2025년을 제외하면 늘 증익하면서 W자 패턴을 반복했다. 공통점은 불확실성 해소, 모멘텀 포착, 미래가치 선반영이다. 2026년 짝수 해 말에도 반등이 유효하다는 것이다.\n\n2026년 합산 시가총액이 11조원이라 '저점 레벨'에 부합한다. PER은 11~20배로 역사적 저점이다. 우려는 해소돼가는 중이다. 슈퍼 IP 레버리지의 불확실성은 분기 실적으로 점차 입증해가고 있으며, 월드투어 이후에도 BTS 활동이 지속될 것이라는 공식 코멘트로 2H27 공백 우려가 사라질 것이다. 5세대 IP의 Ramp-Up은 빠르게 확인된다. 하이브 26년 투어 관객 중 non-BTS가 49%다. 5세대 IP의 투어 + 굿즈 본격화로 이익 기여 상승이 자명하다. 2028년은 BTS 컴백 + 세븐틴 완전체 + 5세대 IP 성장 + 고연차 IP의 2년 주기 활동이 맞물린다. 2026년보다 큰 이익 사이클이다. 주가는 현재 하단~2027년에 2028년 재료를 선반영할 가능성이 높다.\n\n---\n\n### 6. 레저: 관광수입 50조원, 27년 2,600만명의 인바운드 호황  \n레저는 2027년 2,600만명, 관광수입 50조원으로 인바운드 호황이 지속될 전망이다. 2028년 정부 목표인 3천만명을 위해서라도 비자 규제 완화 등 우호적인 정책이 펼쳐질 가능성이 높다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### AI 인프라 투자 우려 → 이익 전망 훼손 X\n\n#### 극단치 지표 7개 동시에 상승: 역사적 바닥 신호\n코스피 PBR(0.94배)은 과거 최저치인 0.68배보다 높다. 그런데 동시에 발생하는 극단치 지표는 총 7개다:\n\n- 배당수익률(예상 3.4%) → 역대 2위 높은 수준  \n- 외인이 사는 강도(순매수 강도)  \n- 시총대비 거래대금(0.54%)  \n- MDD(최대낙폭)  \n- PER(현재치)  \n- 변동성  \n\n과거 이런 지표들이 동시에 극단치를 넘어서면 1개월 이후 +3%, 3개월 +4%, 6개월 +15%, 1년 +24% 반등이 관측되었다(1년 승률 95%).\n\n특히 배당수익률 3.4%는 과거 극단치 시점에서 6개월 +23%, 1년 +42% 상승을 기록한 적이 있다. 당시 배당수익률 자체가 주가 결정변수였다.\n\n#### 외인 순매수 전환: 8거래일 만에 돌아왔다\n삼성전자·SK하이닉스 등 대형주는 전날 저가 매수세가 들어올 때부터 반등했다. 외국인은 8거래일 만에 순매수로 돌아섰다. 이날 기관도 함께 매수하면서 프로그램 매매 일시정지를 여러 차례 실행했다('매수 사이드카').\n\n#### 반도체 밸류체인 전반 반등: 엔비디아 주춤했지만 전체 흐름\n필라델피아 반도체지수가 전일 -2%대에서 -0.4%대로 낙폭을 축소했다. 엔비디아는 젠슨 황 스캔들과 관련한 정보 충격으로 -4.5%가 됐지만, 전체 반도체 업종은 마이크론(+6.3%), 샌디스크(+6.2%) 등을 중심으로 +6.9% 올랐다.\n\n### 2026년 미국 CPI 패턴: 서비스→에너지로 전이되고 있어?\n\n#### 10월 MoM CPI 전월대비 0.4%\n헤드라인 CPI는 전월(0.6%) 대비 둔화되었지만, 시장 컨센서스(0.3%)를 상회했다. 근원 CPI도 0.3%로 0.2%를 상회했다.\n\n핵심은 에너지 항목이 9월 +5.2%에서 10월 +0.7%로 급락했는데, 식료품(+0.5%), 자동차보험료(+0.7%), 교통비(+0.8%) 등의 상승이 있었기 때문이다.\n\n에너지 물가가 하락했지만 서비스 비용이 계속 올라가고 있다는 점에서 인플레이션이 전반으로 확산되어 있다는 해석이 가능한 것이다.\n\n#### 월러 연준 이사의 50bp 발언: 조건부 기준 설정\nWaller 이사는 12월 50bp 인상 가능성을 제시하면서 전제 조건으로 \"10월 근원 CPI가 MoM +0.3%\" 이상이라고 밝혔다. 실제로 그 조건이 충족돼 있으므로 50bp를 제시한 것인데, 이는 50bp를 선택한 이유로서도 의미가 있다. 다만 Waller 개인의 의견일 뿐 다른 연준 책임자는 이를 명시적으로 지지하지 않았고, FedWatch 기준으로 12월 50bp 확률은 11%에 불과하다.\n\n#### Fed 내부의 불일치: 왜 50bp 확률은 낮아?\nDallas Fed Chair Cline, Federal Reserve Vice Chairman Brainard 등 다른 연준 인사들은 50bp 인상에 대해서는 명시적으로 지지하지 않았다. 따라서 12월 FOMC(12월 8~9일) 개최 전까지 50bp 공감대가 형성되기 어렵다는 점에서, 시장이 50bp를 기대한다고 판단하는 것은 오히려 과도하다는 해석이 된다.\n\n### 국내 증시: 11월 10일 4,800p 하회 이후 반등 시도\n\n#### 10월 10일 이후 KOSPI: 하회 → 반등\nKOSPI는 11월 10일 4,800p 하회(4,800p를 하회한 적은 지난 2023년 이후 처음) 후 11월 10일 5,239p로 4.4% 상승했다. \n\n11월 10일 이후 전 거래일 대비 4.4% 상승(4,800p 하회 이후). 그리고 11월 10일은 10월 CPI가 발표되기 직전이었다. 그러므로 4,800p 하회의 이유가 CPI 발표 이후에도 동일하게 작용한다는 것을 검증할 수 없다. 또한 10월 CPI가 발표된 후 반등을 보면, 4,800p 하회 이후 반등이 11월 10일부터 이루어졌다는 사실은 단기간의 반등이었다는 의미로 해석할 수도 있다.\n\n#### 2027년 삼성전자·SK하이닉스 이익 전망: 핵심 관건은 2028년 단가·마진\n2026년 6월 중순 이후 삼성전자·SK하이닉스 합산 시가총액이 절반이나 감소했음에도 불구하고 2027년과 2028년 영업이익 전망은 모두 상향되었다.\n\n즉, 2026년 6월 중순 이후 삼성전자·SK하이닉스 합산 시가총액이 절반이나 감소했음에도 불구하고 2027년과 2028년 영업이익 전망은 모두 상향되었다. 2027년과 2028년 영업이익 전망이 상향된 것은 2026년 6월 중순 이후 삼성전자·SK하이닉스 합산 시가총액이 절반이나 감소했음에도 불구하고 진행된 것이다. \n\n2028년 단가·마진에 대한 의심이 2027년 발주와 출하로 번지느냐 아니냐가 다음 반등의 핵심 조건이다. 즉, 만약 2028년 단가·마진에 대한 의심이 2027년 발주와 출하로 번지면, 2027년 이익이 장부가에 온전히 쌓인다는 전제에서 지수를 평가할 수 있고, 이 경우 1년 뒤 장부가를 낮춰 4,800p의 하방 기준도 다시 계산해야 한다.\n\n### 코어위브 실적 발표 효과: 3분기 매출 36.6억 달러 상회, 연간 가이던스 131.5억 달러 상회\n\n#### 매출과 연간 가이던스 모두 컨센서스 상회\n코어위브(COREWEAVE)의 3분기 매출액은 36.6억 달러로 컨센서스 35억 달러를 상회했다. 연간 가이던스는 131.5억 달러로 컨센서스 129억 달러를 상회했다.\n\n#### 수주잔고 확대: 1,325억 달러(3분기)\n수주잔고는 2분기 1,040억 달러에서 3분기 1,325억 달러로 확대됐다.\n\n#### 부담 요인: 순 이자비용 상승 및 CAPEX 상향\nCAPEX 상향 및 순 이자비용 상승 등 부담 요인이 동시에 존재했다.\n\n---\n\n### 외국인·기관 순매수: 영국 계정 중심\n\n#### 2026년 1~9월 외국인 순매도: 총 214.0조원\n이 중 영국 계정이 97.5조원(45.6%)을 차지했다.\n\nIMF에 따르면 영국 거주자의 한국 주식 보유는 금융감독원 영국 계정 보유의 0.53배다. 따라서 영국 계정 자금의 절반은 비거주자 자금이고, 프라임브로커를 경유한 헤지펀드의 레버리지 축소가 주된 매도 경로였다.\n\n---\n\n### 외국인·기관 순매수: 8거래일 만에 돌아왔다\n\n#### 10월 10일 이후 국내 증시: 외국인·기관 동반 매수\n삼성전자·SK하이닉스 등 대형주의 강세로 외국인·기관이 동반 매수하면서 코스피·코스닥에서 프로그램 매매 일시정지(매수 사이드카)가 발동됐다.\n\n---\n\n### 외국인·기관 순매수: 8거래일 만에 돌아왔다\n\n#### 10월 10일 이후 국내 증시: 외국인·기관 동반 매수\n삼성전자·SK하이닉스 등 대형주의 강세로 외국인·기관이 동반 매수하면서 코스피·코스닥에서 프로그램 매매 일시정지(매수 사이드카)가 발동됐다.\n\n---\n\n### KOSPI·KOSDAQ 매수 사이드카 발동: 외국인·기관 동반 매수\n\n#### 국내 증시: AI·반도체주 강세에 강보합\nSMIC·화홍반도체 등 반도체 관련주 중심으로 강세. 국제 유가 하락에 에너지주 약세를 보이며 상승폭은 제한됐으나, 전 거래일 대비 0.08% 상승한 3,663.72P로 마감.\n\n---\n\n### KOSPI·KOSDAQ 매수 사이드카 발동: 외국인·기관 동반 매수\n\n#### 국내 증시: AI·반도체주 강세에 강보합\nSMIC·화홍반도체 등 반도체 관련주 중심으로 강세. 국제 유가 하락에 에너지주 약세를 보이며 상승폭은 제한됐으나, 전 거래일 대비 0.08% 상승한 3,663.72P로 마감.\n\n---\n\n### AI 서버 기업 CoreWeave 실적 호조: 3분기 매출 36.6억 달러 상회, 연간 가이던스 131.5억 달러 상회\n\n#### 매출과 연간 가이던스 모두 컨센서스 상회\nCoreweave(COREWEAVE)의 3분기 매출액은 36.6억 달러로 컨센서스 35억 달러를 상회했다. 연간 가이던스는 131.5억 달러로 컨센서스 129억 달러를 상회했다.\n\n#### 수주잔고 확대: 1,325억 달러(3분기)\n수주잔고는 2분기 1,040억 달러에서 3분기 1,325억 달러로 확대됐다.\n\n#### 부담 요인: 순 이자비용 상승 및 CAPEX 상향\nCAPEX 상향 및 순 이자비용 상승 등 부담 요인이 동시에 존재했다.\n\n---\n\n### 미국 CPI 상회에 따른 미 국채금리 상승: 10년물 5.0%\n\n#### 10월 MoM CPI 전월대비 0.4%\n헤드라인 CPI는 전월(0.6%) 대비 둔화되었지만, 시장 컨센서스(0.3%)를 상회했다. 근원 CPI도 0.3%로 0.2%를 상회했다.\n\n#### 월러 연준 이사의 50bp 발언: 조건부 기준 설정\nWaller 이사는 12월 50bp 인상 가능성을 제시하면서 전제 조건으로 \"10월 근원 CPI가 MoM +0.3%\" 이상이라고 밝혔다. 실제로 그 조건이 충족돼 있으므로 50bp를 제시한 것인데, 이는 50bp를 선택한 이유로서도 의미가 있다. 다만 Waller 개인의 의견일 뿐 다른 연준 책임자는 이를 명시적으로 지지하지 않았고, FedWatch 기준으로 12월 50bp 확률은 11%에 불과하다.\n\n#### Fed 내부의 불일치: 왜 50bp 확률은 낮아?\nDallas Fed Chair Cline, Federal Reserve Vice Chairman Brainard 등 다른 연준 인사들은 50bp 인상에 대해서는 명시적으로 지지하지 않았다. 따라서 12월 FOMC(12월 8~9일) 개최 전까지 50bp 공감대가 형성되기 어렵다는 점에서, 시장이 50bp를 기대한다고 판단하는 것은 오히려 과도하다는 해석이 된다.\n\n---\n\n### 미국 CPI 상회에 따른 미 국채금리 상승: 10년물 5.0%\n\n#### 10월 MoM CPI 전월대비 0.4%\n헤드라인 CPI는 전월(0.6%) 대비 둔화되었지만, 시장 컨센서스(0.3%)를 상회했다. 근원 CPI도 0.3%로 0.2%를 상회했다.\n\n---\n"}, {"title": "기업 공시 검증 (DART)", "md": "## 기업 공시 검증 (DART)\n\n> **아래는 위 투자전략·섹터 리포트에서 비중 있게 다뤄진 기업을 DART 전자공시로 대조한 것입니다. 증권사 주장과 실제 공시·재무제표가 일치하는지만 확인하며, 투자 판단을 제시하지 않습니다.**\n\n---\n\n### 하이브 (352820)\n\n- **공시**: 11/3 잠정실적(3Q26 연결), 10/27 종속회사 유상증자결정·타법인주식 취득/처분 3건. 10/27 공시는 리포트에 언급되지 않은 대형 자본 거래로 확인 필요.\n- **재무**: 2026 반기 연결 매출 약 1.45조원, 자산 6.09조원(전기 5.49조원). 영업이익 항목 미조회.\n- **리포트 주장**: 2027F 합산 매출 7.2조원·영업이익 9,946억원은 미래 추정치로 공시로 검증 불가. 시총 11조원·BTS 비BTS 비중 49% 등 정성 주장은 공시 근거 없음.\n- **추세**: 1건만 쌓여 비교 불가.\n\n---\n\n### 삼성전기 (009150)\n\n- **공시**: 10/28 잠정실적(3Q26), 10/19·10/30 단일판매·공급계약체결 2건 확인. 리포트가 주장한 \"2026년 8건/5.19조원\" 중 최근 30일 범위에 2건만 포착 — 나머지 6건은 30일 이전 공시이므로 조회 범위 밖. 누적 수주 주장 자체는 공시 존재로 방향성 부합하나 건수·금액 합산 직접 검증 불가.\n- **재무**: 2026 반기 매출 3.46조원, 영업이익 4,404억원, OPM 12.7%. 리포트가 제시한 2027F OPM 31.5%는 현재 대비 2.5배 목표로, 현 공시 수치로 판단 불가.\n- **추세**: 1건만 쌓여 비교 불가.\n\n---\n\n### SK텔레콤 (017670)\n\n- **공시**: 11/4 연결·별도 잠정실적(3Q26) 2건 동시 확인. 10/29 분기 현금배당결정 공시 확인.\n- **재무**: 2026 반기 연결 매출 4.36조원, 영업이익 5,660억원, OPM 13.0%.\n- **리포트 주장**: 3Q26 통신3사 합산 영업이익 +81.1% YoY 주장 — 3분기 보고서 미제출로 공시 수치 직접 대조 불가. 단, 2025년 3분기 \"고객감사 비용\" 기저효과는 공개된 사실로 큰 폭 YoY 성장 주장의 근거 자체는 타당. AIDC 계획(글로벌 사업자 3~4곳 협의, 1H27 초기 가동) 공시 미확인 — 풍문 해명 공시(10/13)가 존재하므로 관련 내용 주의 필요.\n- **추세**: 1건만 쌓여 비교 불가.\n\n---\n\n### 데브시스터즈 (194480)\n\n- **공시**: 11/10 잠정실적(3Q26 연결) — 조회 기준일(11/11) 하루 전 공시, 가장 최신.\n- **재무**: 2026 반기 자산 2,802억원, 자본 1,399억원. P&L 항목 미조회.\n- **리포트 주장**: 3Q26 매출 812억원·영업이익 72억원·흑자전환, '쿠키런: 크럼블' 출시 1개월 내 누적 매출 200억원. 11/10 공시 타이밍과 일치하나 공시 내 수치 직접 확인 불가(잠정치 텍스트 조회 미지원).\n- **추세**: 1건만 쌓여 비교 불가.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n미국 CPI가 3개월 연속 기준 상회하며 근원 CPI가 +0.3% 고착되고 있어 연준의 추가 금리 인상 기조가 지속될 가능성이 높다. 이에 따라 미국 10년 국채금리와 한국 10년 국채금리가 상승하며 글로벌 채권시장에서 동반 매도세가 나타났다. 미·이란 갈등 완화로 유가가 급락하면서 헤드라인 CPI는 하락했지만 근원 CPI는 안정세를 유지하고 있어 연준의 금리 결정에 영향을 미쳤다. 외국인 투자자들의 포지션 변화와 금융채 캐리 매력이 국내 채권시장에 영향을 주고 있으며, AI 인프라와 메모리 반도체 등 산업 섹터에서는 수요와 공급 간의 격차가 지속되고 있다."}]}</script>
