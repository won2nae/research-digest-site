)\n- **데이터센터 건설 지연**이 투자회수 부담으로 작용\n- **물가·연준**에 관심이 옮겨질 수 있어 투자 사이클 초기 단계가 아닌 **조절 단계**로 진입\n- **정책적 조율** 전까지 불확실성이 금융시장에 부담으로 작용\n\n#### ▶ 규제 강화는 사실상 불가능하다 (투자자 의견)\n- **데이터센터 건설 자체가 중단되기 어려워**\n- **지역경제 활성화**, **세수 증가**, **투자 및 고용창출 효과** 고려\n- **전력요금 상승·환경비용 분담 방안** 마련되면 불확실성 해소\n\n**투자자 행동 차이**:\n- AI 규제 우려 → 즉각적 매도 (5일(목) 코스피 -6%, 코스닥 -5%)\n- 구조적 성장 기대 → 시간적으로 편차 존재\n\n### [AI 규제 우려 → 연준의 입장 변화?]\n\n**미국 중간선거 결과**:\n- 민주당이 상하원 모두 장악\n→ AI 데이터센터 규제 강화 우려 확대\n→ AI 인프라 투자 지속성에 대한 의구심\n\n**연준의 역할**:\n- **CPI/PPI 발표** (10월) → 전월대비 상승률 둔화 예상\n- **기저효과** 고려 → 전년동월대비 상승률 확대 가능성\n→ **인플레이션 경계감 유지** 요인\n\n**연준의 잠재적 태도**:\n- **금융시장 불안 확대** → **유동성 긴축 우려** 완화 목적\n- **물가에 대한 경계감** 유지 → **추가 금리 인상 전망**은 변함없지만,\n- **긴축 우려 완화** 목적 → **완화적 발언** 가능성\n\n**맥락**: AI 규제 우려가 **물가·연준**에 주목하게 만든다 = **AI 투자 사이클 종료**보다는 **투자 확대 속도 조절**이라는 관점을 적용해야 한다\n\n---\n\n### AI 규제 우려 → 물가·연준에 주목: 시장을 다시 이끄는 열쇠\n\n### [AI 규제 우려 → 투자 지연 → 성장 기대 조정 (키움증권)]\n\n- **데이터센터 건설 지연**이 투자회수 부담으로 작용\n- **물가·연준**에 관심이 옮겨질 수 있어 투자 사이클 초기 단계가 아닌 **조절 단계**로 진입\n- **정책적 조율** 전까지 불확실성이 금융시장에 부담으로 작용\n\n### [AI 규제 우려 vs. 구조적 성장 기대: 시장의 양극화]\n\n**두 가지 시각**:\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 글로벌 시장 동향\n\n### 미국 시장 급등 → 국내 채권 강세 확대\n국내 채권시장은 미국 시장 급등과 국제유가 급락, 그리고 국내 증시 급락이라는 세 가지 요인이 동시에 작용하면서 채권 강세가 확대되었다. 특히 장 막판 숏커버가 가세하면서 국고 3년·10년 금리는 각각 3개월·6개월 만의 최저치를 기록하였다. 이러한 모습은 국내 증시가 AI 규제 불안 등을 중심으로 급락하고 있으며, 이를 반대로 보면 안전자산 선호가 채권시장으로 이어지고 있다고 판단할 수 있다.\n\n### 외환시장: 달러-원 환율 상승\n달러-원 환율은 0.60원 상승하여 1,342.10원을 기록하였다. 국내 증시 급락과 외국인 주식 매도에 따른 커스터디 달러 매수가 상승을 이끌었지만, 수출업체 네고와 사상 최대 경상흑자 소식이 상방 압력을 대부분 상쇄하였다. 여기에 국내 증시가 급락하면서 외국인의 달러 매수 압력이 있었음에도 불구하고, 경상흑자 소식이 달러 매수 압력을 일부 완화시키면서 환율 상승 폭이 제한되었음을 알 수 있다.\n\n### 미국 시장 동향\n미국 시장에서도 금리 인상에 대한 불확실성이 계속되고 있다. 미국 중간선거 결과가 예상보다 민주당의 우세가 강력하였기에 AI Capex 모멘텀 둔화와 지정학적 위험 완화 기대가 연말까지 완만한 금리 안정을 뒷받침할 것이란 의견이 있다. 그러나 내년 초 재정노이즈가 부각될 가능성은 경계해야 한다. 민주당의 양원 장막은 행정부와의 대립이 반복될 가능성을 암시한다.\n\n### 영국 시장 동향\n영국 중앙은행(BCE)은 11월 통화정책회의에서 기준금리를 25bp 인상하였다. 이는 2025년 12월 25bp 인하 후 오랜 동결을 깬 결정이며, 반대는 1명으로 캐서린만 위원은 50bp 인상을 주장하였다. BCE는 성명서에서 높아진 CPI 상승률과 아직 물가지표에 반영이 안 되는 가스, 전기요금 상승추세를 고려한 결정이라고 밝혔다.\n\n### 브라질 시장 동향\n브라질 중앙은행(BCB)은 11월 통화정책회의에서 기준금리를 13.75%로 동결하며 3월부터 이어진 5연속 인하를 중단하였다. BCB는 석유 및 석유 파생 제품 공급충격에 대한 우려를 강하게 언급하였다. 공급발 인플레이션이 기후변화에 따른 기대인플레이션 불안이 장기화될 수 있다는 점, 향후 재정정책이 통화정책과 금융시장에 미칠 영향력에 대한 경계가 동결 결정 배경이었다.\n\n### 국내 시장 동향\n\n### 국고채 금리 하락\n국고채 금리는 미국채 강세와 국제유가 급락에 이어 코스피 급락으로 위험회피가 심화되어 채권 강세가 확대되었다. 장 막판 숏커버도 가세해 국고 3년·10년 금리가 각각 3개월·6개월 만의 최저치를 기록하였다. 이러한 모습은 국내 증시가 AI 규제 불안 등을 중심으로 급락하고 있으며, 이를 반대로 보면 안전자산 선호가 채권시장으로 이어지고 있다고 판단할 수 있다.\n\n### 코스피 급락\n코스피는 -6.02%, 코스닥은 -5.03%로 급락하였다. 미국 AI·반도체 주 급락과 AI 규제 우려가 주요 원인이다. 미국 기술주의 급락이 반도체 의존도가 높은 한국 증시를 직격하였다. 장중 -8%대까지 빠져 서킷브레이커가 발동되었다. AI 데이터센터 규제 강화 가능성과 AI 투자 둔화 우려로 미국 기술주가 급락했으며, 이 여파가 반도체 의존도가 높은 한국 증시를 직격하였다.\n\n### 레버리지 ETF 투자자 손실\n코스피·코스닥 모두 11월 5일 기준 -5% 이상 하락하며 한 달째 하락세가 지속되고 있다. 상승 베팅 레버리지 ETF 일부는 누적 손실이 -40%에 육박한다는 보도가 나왔다. 이에 따라 해당 ETF들은 신규 순매수 금액이 줄고 있다.\n\n### 정부 긴급 대응\n기획재정부는 반도체 전문가들과 긴급 시장점검 회의를 개최하였다. 이재명 대통령 선거 공약이었던 \"코스피 5,000선\"이 붕괴되며 정치적 비판도 고조되고 있다. 기획재정부는 반도체 전문가들과 긴급 시장점검 회의를 개최하였다.\n\n### 외국인 매도\n외국인은 주식을 14거래일 연속 순매도하고 있다. 지난 11월 5일 1천1백억원 어치를 매도하였다. 11월 들어서는 11거래일 연속 순매도하고 있으며, 11월 5일까지 11거래일간 13천6백억원 어치를 순매도하였다. 11월 들어서는 11거래일 연속 순매도하고 있으며, 11월 5일까지 11거래일간 13천6백억원 어치를 순매도하였다.\n\n### 국내 증시 급락\n국내 증시는 11월 5일 14거래일 연속 하락장을 경험하였다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n---\n\n### 미국 ESS 수혜 논리 vs. AI 데이터센터 규제 우려: 두 파동이 동시에 일고 있다\n\n#### ① 미국 ESS 수혜 논리의 근거는 이미 현실화된 시장 구조에 기반한다\n\n데이터센터 규제 우려로 미국과 한국, 대만 반도체 주가가 동시 급락했음에도 불구하고, 한국 배터리 업체들이 주가 반등했다는 사실 자체가 미국 ESS 수혜 논리를 반박할 수 없다. 왜냐하면:\n\n- **현장 수주·실적이 먼저 만들어져 있기 때문이다**: 하나증권은 미국 민주당이 데이터센터 신규 건설을 중단한다고 해도 \"이미 형성되어 있는 기존 Grid향 ESS 시장(연 평균 70GWh)\" 내에서 중국 배터리 의존도가 높았던 미국 유틸리티 기업들이 한국 기업에게 발주를 집중하면서 수주·실적이 급증하고 있고, 이런 탈중국 논리는 \"정파를 막론하고 변하지 않는다\"고 주장한다([하나증권 · 2026-11-06](#ref-ha)).\n\n이는 미국 ESS 시장에서 한국 배터리의 수요가 이미 형성되어 있고, 그 규모가 충분히 큰 상태에서 \"민주당이 데이터센터 건설을 중단한다 → 따라서 ESS 수요도 줄어든다\"는 논리는 시장 구조를 잘못 이해한다는 것을 의미한다. 데이터센터 On-site 발전이 한국 ESS 수주 급증의 원인이 아니라, 기존 Grid향 ESS 수요의 탈중국이라는 실질적 선택이 한국 기업을 택한 것이다([하나증권 · 2026-11-06](#ref-ha)). \n\n또한 유진투자는 \"**민주당이 의회 장악→트럼프 행정부의 친환경차 지원 축소 견제 강화→전기차 세액공제 복원 가능성이 불확실하나, 추가 정책 후퇴 우려 완화→배터리 업종 투자심리 개선**\"이라고 분석하며, 태양광·ESS·송전망 인허가 개선 논의가 확대될 경우 미국 ESS 설치 수요와 국내 배터리 업체의 수주 증가로 이어질 수 있다고 전망한다([유진투자증권 · 2026-11-06](#ref-yj)).\n\n즉, 데이터센터 규제 우려는 미국 ESS 수요 자체를 위축시키지 못하고, 오히려 기존 Grid향 ESS 수요가 더욱 한국 기업으로 집중되는 형태로 이어질 가능성이 높다.\n\n---\n\n#### ② AI 데이터센터 규제 우려의 시장 반응은 두 가지 다른 맥락에서 동시에 이루어졌다\n\n##### (1) 데이터센터 건설 규제: 미국 내 인허가 문제로 신규 건립 지연 우려\n\n미국 중간선거에서 민주당이 상·하원을 모두 탈환하면서 AI 데이터센터 건설 규제가 강화될 수 있다는 우려가 확산됐다. 텍사스, 조지아, 오하이오 등 AI 인프라 투자가 집중된 지역에서 데이터센터 인허가 요건 강화, 전력망 확충 비용 기업 부담 전환, 환경 규제 등의 문제가 신규 데이터센터 건립을 지연시킬 수 있다는 시장 우려가 반영됐다([유진투자증권 · 2026-11-06](#ref-yj)).\n\n이런 우려가 주가에 반영된 것은 분명하다—미국 반도체·ESS·통신 주가가 같이 급락했고, 한국 ESS 업체들도 초기에는 동반 하락했다 ([하나증권 · 2026-11-06](#ref-ha)), 그러나 데이터센터 건설이 중단되면 ESS 수요도 감소한다는 논리는 미국 ESS 시장 구조를 오해하는 것이다.\n\n##### (2) 데이터센터 건설 중단 ≠ ESS 수요 감소\n\n왜냐하면 데이터센터 건설은 ESS 수요를 만들지 않고, 이미 미국 내에 형성된 기존 Grid향 ESS 수요가 존재하기 때문이다. 한국 배터리 업체들이 데이터센터 On-site 발전과는 무관하게 미국 내 유틸리티 등에서 Grid향 ESS 수주를 하고 있는 것도 이러한 논리의 근거다([하나증권 · 2026-11-06](#ref-ha)).\n\n따라서 데이터센터 건설 중단이 ESS 수요 자체를 줄이는 것은 아니다. 오히려 데이터센터 On-site 발전이 중단된다면 기존 Grid향 ESS 수요가 더욱 한국 기업으로 집중될 수 있는 구조다.\n\n---\n\n#### ③ 데이터센터 건설 중단 vs. 데이터센터 On-site 발전: 개념을 구분해야 함\n\n미국 내 데이터센터 건설 중단 논리와 데이터센터 On-site 발전 논리는 서로 다르다. 데이터센터 건설 중단은 ESS 수요 자체를 줄이고, On-site 발전은 ESS 수요를 새로 생성한다.\n\n- 데이터센터 건설 중단 → 데이터센터 On-site 발전 필요 없음 → ESS 수요 자체 감소\n- 데이터센터 On-site 발전 → ESS 수요 생성\n\n즉, 데이터센터 건설 중단과 On-site 발전은 서로 다른 ESS 수요 구조다. 그런데 미국 ESS 수혜 논리는 \"On-site 발전\"이 아닌 \"Grid향 ESS\"에 기반한다. 데이터센터 건설 중단은 On-site 발전을 필요 없애는 것이지, Grid향 ESS 수요를 줄이는 것이 아니다([하나증권 · 2026-11-06](#ref-ha)).\n\n---\n\n#### ④ 데이터센터 건설 중단 우려는 단기적, ESS 수혜 논리는 장기적\n\n데이터센터 건설 중단은 단기적으로 미국 내 신규 ESS 수요를 억제할 수 있다. 그러나 미국 내 Grid향 ESS 시장 자체는 이미 70GWh 규모로 활성화되어 있고, 이 수요가 중국 배터리 의존도가 높은 미국 유틸리티로부터 한국 기업으로 넘어가는 것이 현재의 실적 기반이다([하나증권 · 2026-11-06](#ref-ha)).\n\n따라서 데이터센터 건설 중단으로 인한 단기적인 ESS 수요 감소는 시장이 이미 경험했던 충격이기도 하다. 2026-10-19 하나증권 리포트 \"再次 찾는 기회\"(다시 찾아온 기회)와 2026-10-26 \"中間選挙에 대한 오해와 배터리 섹터의 기회\"(중간선거에 대한 오해와 배터리 섹터의 기회)에서 이미 미국 ESS 수혜 논리는 데이터센터 건설 중단 우려에도 불구하고 지속되는 구조로 설명됐다.\n\n---\n\n### 한국전력과 지역별 도매가격제(LMP) 시행: 전력시장 구조 변화의 핵심 변수\n\n#### ① LMP 시행이 2027년부터 시작될 경우, 비수도권 민간 발전사업자는 수익성이 무조건 악화된다\n\n언론에 따르면 2026년 11월 말 규칙개정위원회에 지역별 도매가격제(LMP)가 상정되고 통과되면 늦어도 2027년부터 시행이 가능하다. 기존 발전소들 모두 유예와 예외 없이 적용되고 민간 석탄발전소의 정산조정계수가 상향 등 보상 방안은 마련되지 않을 가능성이 높다([하나증권 · 2026-11-06](#ref-ha)).\n\n2025년 7월부터 2026년 6월까지 전력거래소의 모의분석에 따르면 10.6원/kWh 가격 격차를 보였기 때문에 2027년부터는 비수도권 민간 발전사업자의 수익성 악화가 불가피하다([하나증권 · 2026-11-06](#ref-ha)).\n\n---\n\n#### ② 한국전력이 유일한 전력구매자라면, 비수도권 민간 발전사업자의 수익성 악화는 한국전력의 매출 감소를 만회할 수밖에 없다\n\n한화투자증권은 다음과 같이 분석했다: \"한국전력이 사실상 유일한 전력구매자이기 때문에 국내 발전시장의 외형은 한국전력 전력판매수익을 상단으로 볼 수 있다. 한국전력 입장에서 지역별 전기요금 차등요금제 시행에 따른 매출 감소 예상분 2.8조원을 만회할 수 있는 방법은 민간 발전사의 수익을 낮추는 것 외에 없다.\"\n\n즉, 한국전력의 전력판매수익 = 민간 발전사 수익 + 발전자회사 수익 + 기타 수익. 따라서 민간 발전사 수익이 떨어지면 한국전력의 수익이 자연스럽게 증가하는 구조다. 비수도권 민간 발전사의 수익성이 악화되면 한국전력의 전력판매수익이 상대적으로 증가하는 방향으로 된다.\n\n---\n\n#### ③ 비수도권 민간 발전사업자를 수익성 악화에 노출시키는 구조는 발전자회사와 달리 이익 보전 장치가 없다\n\n한화투자증권은 다음과 같이 덧붙인다: \"발전자회사와 달리 민간 발전사의 이익 보전 장치가 없기 때문에 제도 시행시 실적 둔화로 이어진다. 바꿀 수 없는 발전소 위치에 따라 2027년 수익 방향이 결정된다.\"\n\n즉, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익성이 달라지는 구조인데, 발전자회사는 발전소 위치에 따라 수익 가 현실화되지 않음을 의미한다. 이러한 실적 부진과 자금 조달 활동은 AI 산업의 지속 가능한 성장 능력을 다시 한번 의심하도록 만들었다.\n\n한국 증시에서 이 상황이 더욱 극단적으로 드러났다. 삼성전자와 SK하이닉스를 비롯한 대형 반도체주들이 장중 20만 원 이탈하기도 했다. 외국인은 5일 연속 현물 순매도를 하고 있고, 이 중 80% 정도가 반도체에 집중되었다. 전일 국내 증시의 코스피는 전거래일 대비 5.3% 폭락했고, 이 중 반도체 업종이 약 4.6%p 기여하였다. 다른 업종들의 하락 기여도는 -0.7%p에 불과하다는 점도 중요하다. \n\n즉, 현재 AI 밸류체인의 급락은 AI 수요 축소 우려뿐만 아니라, 반도체 업종 자체의 이익 둔화 우려와 자금 조달 계획의 불확실성까지 복합적으로 작용하고 있다. 이는 단순한 \"수요 둔화\"를 넘어, AI 산업이 가지고 있던 재무 구조의 취약성이 현재로서는 해결되지 않은 상태라는 것을 의미한다.\n\n---\n\n#### 3. AI 수급 사이클: 패니덤과 헤지 펀드의 연쇄 반응\n\nAI 산업의 하락은 단순한 기술주의 하락이 아니라, 전반적인 시장 심리에 영향을 준 수급 사이클의 초기 단계였다. 미국 증시에서는 WTI와 브렌트유 선물이 각각 87달러, 94달러 수준으로 크게 하락하고, 미국채 10년물 금리도 4.85%로 하락하는 등, 일반적인 투자 심리 개선이 이루어졌다. 하지만 AI 밸류체인은 이러한 개선에 거의 반응하지 않고 계속 하락했다. \n\n한국 증시에서는 이러한 미국 시장의 개선에도 불구하고, AI 밸류체인 중심의 급락이 계속되었다. 반도체·전력기기·기판 등 AI 밸류체인 전반에 매도세가 집중되며 지수가 약세를 보였다. 반면, 제약·바이오, 화장품, 자동차 등 비-AI 업종으로 순환매가 유입되며 강세를 보였지만, 시가총액 비중이 높은 반도체 업종의 하락을 상쇄하기에는 역부족이었다. 이는 AI 밸류체인의 하락이 전반적인 시장 심리에 미치는 충격이 매우 큼을 보여준다.\n\n---\n\n#### 4. AI 수급 사이클의 다음 단계: 2027년 프로젝트 대비 2028년 프로젝트에 미칠 영향\n\n데이터센터 규제는 2028년 프로젝트에 상대적으로 크게 영향을 줄 것이라는 점이 중요한 판단 기준이다. 2027년 프로젝트는 대부분 이미 실행 중이거나 실행이 거의 완료되었기에, 2028년 프로젝트才是真正이 영향을 받을 수 있는 시점이다. 따라서 현재의 규제 우려가 단순한 \"2027년 프로젝트\"에 적용될 것으로 보이는 것은 과잉 우려일 수 있다. \n\n또한, 미국 하이퍼스케일러 업체들이 미국 및 미국 이외 지역에서의 CAPEX 투자 계획을 언제든지 변경할 수 있기 때문에, 이 계획들이 실제로 실행되는지를 확인하는 것이 필요하다. 2027년에 실행될 계획이 이미 있다고 해서 반드시 수행될 것이라고 단언할 수는 없다.\n\n---\n\n#### 5. AI 밸류체인 투매에 대한 전략적 대응\n\n현재 AI 밸류체인은 이미 수많은 우려를 반영한 상태이다. 2028년 이익 가시성을 둘러싼 논란은 10월부터 시작되었고, 그 과정에서 관련 우려를 주가 급락을 통해 상당 부분 반영했다. 현재의 AI 주가 하락은 단순한 투매 성격이 짙다는 점에서, 단기적으로 주가 하락을 추가적으로 부추길 수 있는 또 다른 요인들이 없다면, 오히려 AI 밸류체인에 대한 단기적인 매수 기회가 될 수도 있다. \n\n따라서, 미국 하이퍼스케일러 업체들의 미국 및 미국 이외 지역에서의 CAPEX 투자 계획 변경 여부, 국내외 반도체주들의 2028년 컨센서스 하향 조정 여부 등을 확인하면서 관망하는 전략이 적절하다. 반도체주에 대해서는 낙폭 과대 인식 매수세와 이익 둔화 우려를 반영한 손절 물량 출회가 동시에 존재하기 때문에 변동성이 클 것으로 예상된다. 반면, 미국 블루웨이브 발 불확실성에서 상대적으로 영향을 덜 받는 업종으로 대응 범위를 확대하는 것도 좋은 대안이다. 예를 들어, 주주환원 모멘텀이 유효한 은행, 지주, 외국인 순매수 기조가 유지되는 높은 건설 및 운송, 금리 부담 완화에 따른 바이오회사 등이 해당된다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nAI 규제 강화 우려가 국내외 증시에 큰 영향을 미쳤으며, 이는 데이터센터 신규 건설 지연과 투자회수 부담을 야기하고 있다. 이와 동시에 미국 ESS 시장에서 한국 배터리 업체들의 수주 증가가 지속되고 있어, 규제 우려와 ESS 수혜 논리가 서로 다른 맥락에서 동시에 작용하고 있다. 또한, 지역별 도매가격제(LMP) 시행으로 비수도권 민간 발전사업자의 수익성이 악화될 것으로 예상되며, 이는 한국전력의 전력판매수익 증가로 이어질 수 있는 구조이다."}]}</script>
