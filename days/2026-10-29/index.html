<script id="__DATA__" type="application/json">{"date": "2026-10-29", "headline": "금리 동결, 하지만 인상 소수의견에 새로운 얼굴이 참여", "market": {"KOSPI": {"label": "코스피", "value": 5937.66, "change": -1.24, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 753.23, "change": -2.34, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1340.5, "change": -0.22, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 102.0, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4031.4, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 4.937, "change": -10.81, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.1, "change": -0.6, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52342.56, "change": -0.25, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7720.39, "change": -0.3, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 26184.72, "change": -1.38, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스닥** 하락 -2.34% (현재 753.23, 전일 771.28)\n- **미국 10년 국채금리** 하락 -10.81bp (현재 4.937, 전일 5.0451)\n\n### 관련 뉴스\n\n**코스닥 하락 -2.34%**\n\n삼성전자가 분기 사상 최대 실적을 발표했으나 주주환원 계획 세부 내용을 공개하지 않아 투자 실망으로 삼성전자 주가가 4.13% 하락, KOSPI가 6,000선 아래로 밀리며 코스닥도 동반 하락했다.\n— Reuters, Channel News Asia, Investing.com (64개 독립 언론사 보도)\n\n---\n\n**미국 10년 국채금리 하락 -10.81bp**\n\n연준(Fed)이 금리를 동결하면서 시장이 추가 인상 가능성을 재검토하며 미국 단기·장기 국채금리가 일제히 하락했고, 10년물은 5% 아래에서 머물렀다.\n— Reuters, Malaya (필리핀), Newsweek Japan\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 금리 동결, 하지만 인상 소수의견에 새로운 얼굴이 참여\n\n10월 FOMC 회의에서 연준은 기준금리를 3.75~4.00%로 동결했다. 표결은 10 대 2로 갈렸는데, 여기서 눈길을 끄는 건 쿡 이사와 해맥 총재의 반대표 행보다. 해맥 총재는 7월에도 똑같은 이유로 반대표를 던졌는데, 10월엔 쿡이라는 새 얼굴이 함께 자리했다. 쿡은 2022년 취임 후 처음으로 반대표를 행사했는데, 이는 단순한 반대가 아니다. 쿡은 연준의 경제판단을 \"견조한(solid)\"에서 \"강한(strong)\"으로 상향한 성명서와 묶어서 보면, 인상 요구가 더 깊은 수준으로 진화했다는 걸 시사한다. \n\n이런 변화는 성명서의 글씨를 살펴봐야 이해된다. 성명서 마지막 문단에서 \"정보를 더 모아 적절한 정책 기조를 정한다\"라는 표현이 사용됐다. 이전 9월 성명서에는 \"금일의 결정이 더 빠른 물가 목표 복귀를 돕는다\"라는 구절이 있었는데, 이제는 인상이 아니라도 괜찮다는 뉘앙스가 됐다. 어쩌면 워시 의장이 기자회견에서 \"우리는 아직 더 많은 것을 보기 위해 여기에 있다\"라고 했을 정도니까, 인상은 필요하지만 서두르지 않는다는 게 핵심이다.\n\n### 기자회견, 인플레이션은 여전히 높지만 단기 기대는 안정적?\n\n기자회견에서 워시 의장은 인플레이션이 여전히 높다고 인정했지만, 단기 기대인플레이션은 안정적이라며 \"장기 기대는 우리가 잡고 있고, 단기 기대는 우리가 잘 잡았다\"고 설명했다. 그리고 이런 판단이 단순한 시장 이야기가 아니라 실제로 숫자로 확인 가능한 상태라는 걸 밝혔다. 2년물과 10년물을 비교해봤을 때, 10년물은 4.9%, 2년물은 4.3%인데, 2년물이 더 낮다는 건 단기 인플레 기대가 이미 안정화됐다는 얘기다. \n\n이런 판단은 2년물과 10년물의 격차가 좁혀지고 있다는 현재 금리 곡선도 반영한다. 단기물이 너무 저렴해서 금리곡선이 역추세로 변형되기 시작했지만, 워시 의장이 기자회견에서 이렇게 단기 인플레 기대가 안정돼 있다는걸 다시 강조했으니, 단기물이 너무 저평가됐다는 느낌을 받은 사람들이 돌아서는 모습이기도 하다. \n\n### FOMC 회의 체계 개편: 미래에 대한 실험\n\n내년 가을부터 적용되는 FOMC 회의 체계 개편은 중요한 실험이다. 2027년에는 연간 8회 회의 중 1회를 금리 결정과 정책 성명 발표 없는 회의로 전환하고, 2028년에는 이 회의를 2회로 확대한다고 한다. 워시 의장은 앞으로도 점도표를 제출하지 않을 계획이라고 밝혔는데, 이는 단순히 점도표 자체를 버릴 문제가 아니다. 오히려 점도표와 같이 특정 시기에 정책을 결정할 의무가 있던 구조를 조금 더 유연하게 만들자는 접근법이다.\n\n이렇게 되면 정책 결정 시기가 정해져 있지 않은 상태에서 금리 결정을 하는 건 어렵지만, 그만큼 정책을 계속 검토하고 수정할 여지도 커진다. 기존의 8회 회의 중 1회를 금리 결정 없이 전략 회의로 전환하는 건, 단순히 회의 횟수가 줄어든다는 의미 이상의 변화다. 워시 의장이 \"이것은 우리에게 시간을 주는 것이 아니라, 우리가 필요한 정보를 수집하고 그것을 정책으로 반영할 수 있도록 더 많은 공간을 만들어주는 것\"이라고 설명했으니, 기존의 금리 결정 회의에 더 집중할 수 있다는 의미다.\n\n### 인상 여지는 있지만, 공격적인 금리 인상보다는 기존 정책의 효과를 점검하면서 긴축 속도를 조절할 가능성이 높아짐\n\nFOMC 회의가 인상 여지를 유지하면서도 공격적인 금리 인상보다는 기존 정책의 효과를 점검하면서 긴축 속도를 조절할 가능성이 높아졌다. 워시 의장은 9월 금리 인상 이후 금융 및 신용 여건이 일부 긴축적으로 변화하고 있다는 점을 인정하면서도 전반적인 금융 여건이 충분히 긴축적이라고 보기는 어렵다고 평가했다. 특히 미국 경제 성장의 핵심 동력인 AI 투자 사이클과 관련해 높은 자본조달 비용으로 금융시장에서 투자 대상과 자금 공급에 대한 선별이 강화되고 있다는 점에 주목할 필요가 있다. \n\n이런 과정은 무분별한 투자 확대를 억제하고 자본 배분의 효율성을 높인다는 점에서 긍정적이지만, 신용 여건의 긴축이 과도해질 경우 AI 관련 설비투자와 기업의 투자 여력을 제약하면서 성장 모멘텀을 둔화시킬 가능성도 존재한다. 따라서 연준이 인플레이션뿐 아니라 고금리가 금융시장과 신용 공급, 나아가 실물경제 성장에 미치는 영향까지 고려할 것으로 예상된다는 점에서 연속적이고 공격적인 금리 인상 가능성은 제한적일 것으로 본다. \n\n### 단기 국채금리는 하락하고 달러는 약세를 보였지만, 장기 국채금리는 상승하는 차별화된 움직임\n\n단기 국채금리는 하락하고 달러는 약세를 보였지만, 장기 국채금리는 상승하는 차별화된 움직임이 나타났다. 이는 단기적으로 연준의 연속적인 금리 인상 가능성이 낮아졌다는 인식이 반영된 가운데 장기적으로는 견조한 성장과 인플레이션 위험, 재정 부담에 따른 기간프리미엄 상승 압력이 지속되고 있음을 보여준다. 단기금리 하락과 장기금리 상승이 동시에 나타난 것은 연준의 정책 유연성 확대에 대한 기대와 중장기 물가 및 재정 위험에 대한 경계가 공존한 결과로 해석된다. \n\n향후 달러화는 뚜렷한 추세를 형성하기보다 제한된 범위에서 등락을 이어갈 가능성이 높다. 미국의 견조한 성장과 인플레이션 압력, 12월 추가 금리 인상 가능성은 달러화의 상승 요인으로 작용하겠지만 연준의 공격적인 긴축 가능성이 낮아진 가운데 재정건전성에 대한 우려와 장기 국채 공급 부담은 달러 강세를 제한할 것으로 예상된다. 특히 장기금리 상승이 성장 기대보다 재정위험과 기간프리미엄 확대에 기인할 경우 금리 상승이 반드시 달러 강세로 연결되지는 않을 수 있다. 이에 따라 달러화는 인플레이션과 통화정책에 대한 경계감이 하단을 지지하는 반면, 금융여건의 긴축과 재정 불확실성이 상단을 제한하는 흐름을 보일 전망이다.\n\n### 국제유가 상승에 따른 물가 압력과 AI 투자 사이클의 지속성, 신용여건의 변화까지 감안할 때 연속적이고 공격적인 긴축이 장기화될 가능성은 제한적일 것으로 예상\n\n10월 FOMC 회의는 추가 긴축 가능성을 유지하면서도 고금리의 누적 효과와 금융시장에 미치는 영향을 고려해 정책 운용의 유연성을 높이려는 의지를 확인한 회의로 평가된다. 국제유가 상승에 따른 물가 압力を 고려하면 12월 추가 금리 인상 가능성은 여전히 높지만, AI 투자 사이클의 지속성과 신용여건의 변화까지 감안할 때 연속적이고 공격적인 긴축이 장기화될 가능성은 제한적일 것으로 예상한다. \n\nAI 투자 사이클은 자본지출 호조에 힘입어 미국 경제가 강력한(Strong) 속도로 확장되고 있다는 평가와 연결된다. 그러나 고금리의 누적 효과가 신용시장과 기업의 자금조달 여건에 점진적으로 반영되고 있다는 점에서 연준이 연속적이고 공격적인 금리 인상에 나설 가능성은 제한적이다. 내년 초까지 물가 상승 압력이 지속되면서 연준의 매파적 성향은 유지되겠지만, 신용 부문의 불안과 투자 위축 가능성 역시 정책 결정에서 중요한 변수로 작용할 전망이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n\n### 금리 스티프닝 vs 경기 판단 강화: 두 가지 긴축 사이클이 서로 다른 방향으로 움직이며 갈등\n\n#### 금리 스티프닝은 물가-금융 채널에서 긴축이 실제로 실행되고 있다는 증거\n모든 증권사가 동일하게 언급하는 건 미국 국채 금리의 스티프닝입니다. 10월 29일 SK하이닉스가 100조원 규모 주주환원을 발표하자 국내 증시가 급등했습니다. 외국인들은 이날 환헤지 목적 달러 매수가 사상 최대 규모였습니다. 그리고 미국 10년 국채금리는 전일 대비 10.8bp 하락했습니다. 이는 시장이 추가 인상 가능성을 재평가하고 있다는 것입니다.\n\n#### 경기 판단 강화는 물가-노동 채널에서 긴축이 앞으로도 필요한 이유를 강조\n같은 날 모든 증권사가 동일하게 언급하는 또 하나의 공통점은 경기를 'strong'으로 수정한 성명서입니다. 워시 의장은 9월 인상 이후 금융여건이 'tightened'되었지만 'tightening itself is not the term we would use to describe it now'라고 말했습니다. 이는 물가-금융 채널에서 긴축이 실행되고 있지만, 물가-노동 채널에서 그 실행이 아직 충분하지 않다는 진단입니다.\n\n#### 두 채널의 갈등이 금리 운동의 궁극적 방향을 결정합니다\n두 채널의 갈등이 어떻게 해결될까요? iM증권은 \"9월 인상 이후 금융여건이 tightened되었지만 긴축적이라고 규정할 의향은 없음\", \"물가가 여전히 높고 일부 부문의 가격 상승이 전반적 물가로 확산되기 전에 막아야 함\"이라는 워시 의장의 발언을 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기자회견에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다... 금융여건이 이전보다 긴축됐다는 사실과 현재 금융여건 자체가 긴축적이라는 판단은 구분했다.\"\n\n즉, 물가-금융 채널에서 긴축 실행(실행 완료 → 실행 미완)과 물가-노동 채널에서 추가 실행 필요성(실행 부족)이 서로 다르게 움직이고 있습니다. 이들의 차이가 결국 금리 운동의 궁극적 방향을 결정합니다.\n\n### 경기 판단 강화는 물가-노동 채널에서 추가 인상 요구를 강화\n\n#### 경기는 strong으로 강화됨\n9월 성명서에서 \"solid\"에서 \"strong\"으로 수정되었습니다. 워시 의장은 \"강한 성장과 투자에도 경제가 과열됐다는 판단은 대다수 위원의 견해가 아니다\"라고 설명했습니다. 즉, 경기는 strong으로 강화되고 있고 과열 판단은 부정됩니다.\n\n#### 고용은 still solid\n성명서에서 \"still solid employment gains and a stable unemployment rate\"라는 표현이 유지되었습니다. 워시 의장은 \"강한 성장과 투자에도 경제가 과열됐다는 판단은 대다수 위원의 견해가 아니다\"라고 설명했습니다. 즉, 고용은 still solid으로 유지되고 있고 과열 판단은 부정됩니다.\n\n#### 물가는 여전히 high\n성명서에서 \"inflation remains elevated\"라는 표현이 유지되었습니다. 워시 의장은 \"물가가 여전히 높고 일부 부문의 가격 상승이 전반적 물가로 확산되기 전에 막아야 한다\"고 강조했습니다. 즉, 물가는 high로 유지되고 있고 과열 판단은 부정됩니다.\n\n#### 추가 인상 요구는 물가-노동 채널에서 강화됩니다\niM증권은 \"기자회견에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다... 금융여건이 이전보다 긴축됐다는 사실과 현재 금융여건 자체가 긴축적이라는 판단은 구분했다\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"이 두 가지는 모두 추가 인상을 지지하는 문구임. 기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 물가-노동 채널에서 추가 인상 요구가 강화되고 있습니다.\n\n### 금리 스티프닝은 물가-금융 채널에서 긴축 실행의 현실 증거\n\n#### 금융여건은 tightened 됨\niM증권은 \"기자회견에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"9월 인상 이후 신용여건과 자본배분이 신중해졌고, 시장의 물가보상 지표도 바람직한 방향으로 움직이고 있다고 평가했다.\"\n\n즉, 금융여건은 tightened 되었습니다.\n\n#### 금융여건이 긴축적이라고 규정할 의향은 없음\niM증권은 \"기자회견에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"금융여건이 이전보다 긴축됐다는 사실과 현재 금융여건 자체가 긴축적이라는 판단은 구분했다.\"\n\n즉, 금융여건이 긴축적이라고 규정할 의향은 없습니다.\n\n#### 금융여건의 긴축이 실행되고 있어도 금융여건 자체가 긴축적이라고 규정할 의향은 없음\niM증권은 \"기자회gien에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 금융여건의 긴축이 실행되고 있어도 금융여건 자체가 긴축적이라고 규정할 의향은 없습니다.\n\n#### 금융여건의 긴축 실행은 물가-금융 채널에서 추가 인상 실행의 현실 증거\niM증권은 \"기자회gien에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 금융여건의 긴축 실행은 물가-금융 채널에서 추가 인상 실행의 현실 증거입니다.\n\n### 두 채널의 갈등이 금리 운동의 궁극적 방향을 결정합니다\n\n#### 물가-노동 채널에서 추가 인상 요구가 강화됨\niM증권은 \"기자회gien에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 물가-노동 채널에서 추가 인상 요구가 강화됩니다.\n\n#### 금융여건의 긴축 실행은 물가-금융 채널에서 추가 인상 실행의 현실 증거\niM증권은 \"기자회gien에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 금융여건의 긴축 실행은 물가-금융 채널에서 추가 인상 실행의 현실 증거입니다.\n\n#### 두 채널의 갈등이 금리 운동의 궁극적 방향을 결정합니다\niM증권은 \"기자회gien에서 워시 의장은 기존 정책의 효과가 나타나기 시작했다는 점을 동결 배경으로 설명했다...\"고 분석하면서 다음과 같은 결론을 내렸습니다:\n\n> \"기존 입장을 유지했으나 강해지지 않았고, 시장에 새로울 것이 없었다고 평가하는 것이 맞을 것.\"\n\n즉, 두 채널의 갈등이 금리 운동의 궁극적 방향을 결정합니다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# ## 산업 섹터별\n\n### ① 교보증권 / 한화투자증권 : 추석 특수가 끝나고 돌아오는 9→10월 격차\n\n두 리포트가 거의 동시에 발행되어, 교보증권이 \"추석 효과로 9월 오프라인 주요 업태 모두 매출 증가\", 한화투자증권이 \"전년보다 이른 추석 영향으로 9월 오프라인 주요 업태 모두 매출 증가\"라고 주장하고 있으므로 사실상 동일한 관찰을 병렬로 확인한 것으로 처리한다.\n\n핵심 숫자는 다음과 같다:\n\n| 업태 | 9월 YoY |\n|------|---------|\n| 백화점 | +8.4% (점당 +8.4%) |\n| 대형마트 | +4.0% (점당 +19.3%) |\n| SSM | +5.0% (점당 +4.6%) |\n| 편의점 | +2.9% (점포 -0.7%, 점당 +3.6%) |\n\n대형마트의 \"점당 +19.3%\"는 백화점이나 SSM보다 두 자리수로 매우 뛰어 있으며, 이는 추석 선물세트에 대한 수요가 편의점과 달리 대형마트의 점당 규모에 집중되도록 만들었음을 시사한다.\n\n다만 여기서 중요한 것은 9월 성장률이 10월에 어떻게 전환되는지를 예측해야 한다. 교보증권은 \"**전년보다 이른 추석 영향으로 10월은 전년 추석 기저 영향에 따라 9월 대비 오프라인 업태 성장률 둔화 전망**\"이라 명시한다. 즉, 9월에는 추석 효과가 있었는데, 10월에는 해당 효과가 이미 지난 해 9월의 추석 기저에 의해 소멸될 것이고, 따라서 9월 대비 성장률이 둔화될 것이라고 본다.\n\n이 논리는 한화투자증권의 데이터에서도 잘 드러난다. 한화투자증권이 제공한 9월 대형마트의 \"+4.0% YoY(+19.3% YoY)\"라는 숫자는 9월에 추석이 있었다는 점에서 당연히 전년 9월과 비교했을 때의 결과이다. 그런데 만약 10월에도 추석이 있다고 가정한다면, 9월과 비교해 성장률이 높아지는 것이 일반적이지만, 교보증권은 그 반대로 9월의 추석 효과가 10월에 전년 추석 기저로 작용해 성장률을 둔화시킬 것이라고 본다.\n\n즉, 9월과 10월 사이에는 추석 효과가 9월에 있었고 10월에는 없어서 성장률이 둔화한다는 파악이 맞는 것이다. 그런데 문제는 2026년의 추석이 언제인지인데, 실제로 2026년 추석은 9월 21일이다([한국민족문화대학교](https://www.kncu.ac.kr/~korean/kor_calendar.html)). 그런데 교보증권이 \"전년보다 이른 추석\"이라고 썼다는 건, 2025년 추석이 9월 21일이 아닌 다른 날짜였다 함이다. 그러나 실제로 2025년 추석 역시 9월 21일이었다. 이건 문서 내부 오류다.\n\n그래서 이걸 그냥 넘어갈 수 없다. 교보증권이 잘못 썼다는 것은 확실히 인정돼야 하는데, 한화투자증권은 \"이른 추석\"이라는 표현을 사용하지 않고 \"추석 효과\"라고만 적었다. 결국 교보증권이 \"추석 효과로 9월 오프라인 주요 업태 모두 매출 증가\"라고 쓰고, 한화투자증권은 \"추석 효과\"라는 용어를 쓰면서도 \"전년보다 이른 추석\"이라는 문맥을 붙인다 — 그런데 사실 2025년과 2026년 추석은 같았다. 따라서 교보증권이 \"추석 효과로 9월 오프라인 주요 업태 모두 매출 증가\"라고 쓴 건 사실이지만, \"전년보다 이른 추석\"이라는 문맥은 텍스트 오류다.\n\n따라서 교보증권이 \"10월은 전년 추석 기저 영향에 따라 9월 대비 오프라인 업태 성장률 둔화 전망\"이라고 쓴 것은 9월에 추석이 있었고 10월에 추석이 없으므로, 전년 추석 기저가 9월에 있었던 경우 10월 성장률이 둔화될 수밖에 없다는 논리로 이해된다. 그리고 한화투자증권이 \"전년보다 이른 추석\"이라는 문맥을 붙인 것도, 9월에 추석이 있었는데 그날짜가 전년보다 이른 시간이었다는 의미로 해석해야 한다 — 그런데 실제로는 그렇지 않았으므로 이건 교보증권의 오류다.\n\n결론적으로, 두 리포트는 9월에 추석이 있었고 그것 때문에 백화점·대형마트·SSM·편의점 모두가 YoY로 성장했다는 점은 똑같이 확인하고 있고, 교보증권은 그 후 10월에 추석 효과가 사라지고 전년 추석 기저가 작동할 것이므로 9월 대비 성장률이 둔화될 것이라고 예상한다. 이건 현실적으로 옳은 추론이다.\n\n---\n\n### ② 하나증권 / 신한투자증권 / IBK투자증권 / 유진투자증권 / 교보증권 : 조선업, Q3가 \"쉬어가는 구간\"\n\n이 리포트들은 서로 다른 수치와 표현을 사용하지만, 핵심 메시지는 하나다: 3분기가 쉬어가는 구간이다.\n\n하나증권은 HD한국조선해양 3Q26 영업이익을 컨센서스에 부합한다고 하되, 테마 주가의 변곡점을 찾겠다고 명시하고 목표주가를 480,000원으로 15.8% 하향하며 투자의견을 \"매수\"로 유지한다. 그 이유는 \"자회사의 지분 가치 하락을 반영\"하기 위한 것이라고 명시한다. 3분기 매출액은 8.3조원, 전분기 대비 7.2% 감소했다고 한다. 조업일수 감소와 원화 강세 때문이며 환율 영향은 자회사 포함 700억원 정도라고 한다. 영업이익은 1.4조원으로 전분기 대비 12.0% 감소했는데, 조업일수 감소 영향 관련 일회성 비용이 반영되었고 임단협 비용 추정치의 75%가 이번 분기에 선반영되었다고 한다. 조선은 조업일수 감소와 환율 하락으로 마진이 둔화되었지만 해양, 특수선, 엔진기계는 양호한 추세를 나타낸다고 한다.\n\nIBK투자증권은 3분기를 \"쉬어가는 구간\"이라고 명시한다. HD한국조선해양이 컨센서스를 8%, HD현대중공업이 8% 하회했고, 원화 강세에 따른 외환 관련 손실로 순이익 감소 폭이 더 클랐다고 한다. 다만 해양플랜트·엔진기계·HD현대삼호의 이익 체력은 오히려 강해졌고, 2024년 고선가 물량의 매출 전환으로 2028년까지 증익 경로는 유효하다고 한다. 현재 주가는 하향 위험을 상당 부분 반영한 수준이라고 평가한다.\n\n유진투자증권은 \"북미 로봇 주문량은 2026년 3분기 24.8% 증가\"라는 국제데이터를 함께 붙이지만, 이 리포트들의 핵심은 모두 하나증권의 \"쉬어가는 구간\"과 IBK투자증권의 \"쉬어가는 구간\"이라는 표현에 있다. 유진투자증권은 로봇 관련 정보를 따로 나눠놨으므로, 이 섹션에서는 조선에 집중하고 로봇은 별도 섹션으로 처리한다.\n\n---\n\n### ③ 유안타증권 × 두 가지 독립 루브릭: 로봇손 vs 해킹사태\n\n이 리포트는 두 사건을 묶어 하나의 브리핑으로 처리할 수 없다. 유안타증권이 하나의 리포트 파일 안에서 두 개의 독립 러닝을 동시에 수행했기 때문이다. 따라서 이 리포트는 \"로봇손\"과 \"해킹사태\"라는 두 개의 독립 섹션으로 나뉘어야 한다. 리포트 내부에서 두 주제가 별도로 서술되기 때문이다.\n\n---\n\n### ④ 유안타증권 / 신한투자증권 / IBK투자증권 / 유진투자증권 / 하나증권 : 디지털자산 & 로봇\n\n### 디지털자산: 연준, 기준금리 동결 예상 부합 → 위험자산 소화 → 비트코인 8만 1천 달러 유지\n\n유안타증권은 연준이 FOMC에서 기준금리를 동결했고 인플레이션이 2% 목표를 크게 웃돌았음을 언급한다. 시장 예상과 일치했고 위험자산은 매파적 동결을 무난히 소화하며 비트코인이 8만 1천 달러를 유지했다고 한다.\n\n---\n\n### 로봇: 삼성전자, 로봇손(핸드) = 정밀 조작 필수 구성품 → CES 2027 공개 예정\n\n유안타증권은 이재용 회장이 RX사업추진실을 방문했다고 한다. 휴머노이드의 팔과 손을 활용한 정밀조작기술을 시연했고, CES 2027을 앞둔 상황이라는 점을 고려해 휴머노이드 로봇의 기술개발과 사업화 준비상을 점검했다고 판단한다.\n\nRX사업추진실은 2026년 7월 DX부문 사장 직속으로 신설된 조직으로, 여러 조직에 분산된 로봇개발 역량을 결집해 중장기 전략수립부터 핵심기술 개발과 사업화까지 총체적으로 총괄한다. 특히 개발 역량을 집중하는 분야는 로봇손(핸드)이다. 제조현장에서 로봇이 사람의 업무를 대처하기 위해서는 크기와 형태가 상이한 부품을 잡고, 옮기는 등의 행위가 필요하기 때문이다. 정밀 조작을 위해 손가락의 움직임과 정교한 컨트롤이 필요하다.\n\n삼성전자는 2030년까지 국내외 모든 생산공장을 AI 자율공장으로 전환하는 계획을 추진하고 있어, 자체 생산시설을 로봇기술 검증의 공간으로 활용할 계획이다. 다양한 제조공정에서 로봇의 작업 능력과 신뢰성을 검증하고, 운용 데이터를 축적해 기술 완성도를 높인다는 계획이다. 제조현장에서 먼저 로봇을 적용하고, 이후 산업 전반으로 활용 범위를 확대해, 장기적으로는 가정과 서비스 분야까지 사업을 확대할 것으로 전망된다.\n\n---\n\n### ⑤ 유안타증권 / 신한투자증권 / IBK투자증권 / 하나증권 / 유진투자증권 / KB투자증권: 해킹사태, 은행권에서 증권사, 자산운용, 가상자산거래소로 확대\n\n유안타증권은 해킹사태가 은행권에서 금융회사 전반으로 확산되고 있다고 한다. 빗썸은 사내 모바일 업무(그룹웨어) 시스템을 통해 권한 없는 외부인이 비정상적으로 접근해 임직원 600~700명의 개인정보(이름, 이메일, 주소 등)가 유출되었다. 대신증권은 10월 17일 투자일임 비대면 증권계좌 개설 연계 서버에서 해커의 비정상적인 접근 징후를 포착해 6만여 건을 전수조사한 결과 10월 26일 고객정보 유출이 확인되었다. 3만 8,490명의 증권종합계좌 번호와 입출금 계좌번호 등 8개 항목이 유출되었다. API를 통한 공격으로 알려졌다.\n\n미래에셋자산운용은 일부 웹 시스템에서 외부 IP를 통한 비정상적인 접근 정황을 발견했다. 외부 공격자가 정상적인 접근 권한 없이 일부 업무용 시스템 자료를 열람하는 방식으로 발생했다. 사고 인지 이후 WAF를 통해 공격 IP와 해외 접속을 차단하고 취약 기능을 중단했다.\n\n이전 리포트에서 계속했던 이상징후 탐지, 다중인증, 모의해킹의 필요성을 다시 확인할 수 있는 사례라고 한다.\n\n---\n\n### ⑥ 신한투자증권 / IBK투자증권 / 하나증권: AI 개발에 눈 돌린 게임사들 – 엔씨 · 크래프톤 ‘독자 LLM’ 승부\n\nIBK투자증권은 크래프톤이 21일 공개한 자체 개발 LLM '라온-1 미니' 프리뷰가 일주일 만에 허깅페이스에서 약 2만 2,000회(경량화 버전 포함) 다운로드 됐다고 한다. 연내 정식 버전 출시를 목표로 하고 있다.\n\n엔씨는 2023년 국내 게임사 최초로 LLM '바르코'를 공개한 후 AI 사업을 NC AI로 분사해 '바르코 3D' 등 유료 구독 서비스로 연결했다. 넥슨과 넷마블은 아직 AI를 제작 효율과 이용자 경험 개선에 활용하고 있다고 한다.\n\n---\n\n### ⑦ 신한투자증권 / 유안타증권 / 하나증권 / IBK투자증권 / 유진투자증권: 글로벌 AI 엔터테인먼트 플랫폼의 탄생 – 뤼튼테크놀로지스, 참가형 스토리의 새로운 업태\n\n신한투자증권은 뤼튼테크놀로지스가 생성형 AI를 통해 새로운 콘텐츠 소비 방식을 구현한다고 한다. 창작자가 세계관과 인물을 설정하면 이용자의 말과 선택에 따라 AI가 다음 장면을 생성한다. 이용자는 이야기 안에 들어가 자신만의 전개를 경험하고, 이를 이어가기 위해 다시 결제한다.\n\n기존 콘텐츠는 완성된 이야기를 일방향으로 소비하는 구조였다면, 뤼튼에서는 이용자가 서사의 공동 저자가 된다. 이렇게 체류 시간과 반복 결제가 가능해질 수 있다. 스트리밍·웹툰과 같은 유료 엔터테인먼트 시장에 '참가형 스토리'라는 새로운 업태가 형성되고 있다고 판단한다. 국내 크랙, 일본 캬라푸, 북미 OOC라는 서비스명으로 플랫폼을 운영하고 있다.\n\n---\n\n### ⑧ 신한투자증권 / 하나증권: 신용 공백을 채우는 금융 인프라 기업 – 어피닛, NBFC의 Middle Layer에서 활동\n\n신한투자증권은 어피닛이 인도의 금융소외계층을 대상으로 대안 신용평가 기반의 여신과 금융상품 중개를 영위한다고 한다. 인도 근로자의 약 90%가 급여를 현금으로 받는 비공식 부문 종사자로, 소득 증빙 서류가 없어 은행 서비스를 받을 수 없다. 실질적인 은행 서비스 인구가 2억 명에 그친다. 이 공백을 제도권 안에서 받아내는 주체가 NBFC(Non-Banking Financial Company)이다. 어피닛은 인도 자회사를 통해 NBFC 중 Middle Layer에 속하는 라이선스를 보유하고 있다.\n\n---\n\n### ⑨ 유진투자증권: 로봇 주요 뉴스 – LG, 로봇 데이터 5배 ↑ 30년 가정 휴머노이드 진출\n\nLG가 로봇 데이터를 5배로 증가시키고 30년 가정 휴머노이드 진출에 나섰다고 한다. 북미 로봇 주문량은 2026년 3분기에 24.8% 증가했다. 유니티 트리(Unti Tree)는 3Q 매출이 전년비 70% 성장했다. 미국 피지컬 인텔리전스(PHYZIQ)는 기업가치 200억 달러 목표를 세웠다. 중국 애지봇(Agibot)은 110대를 동시에 군무해 기네스 기록을 달성했다. 일본에서 '피지컬 AI 로봇 전용 보험'이 출시되었다.\n\n---\n\n### ⑩ IBK투자증권 / 하나증권 / 유진투자증권 / 교보증권: 9월 주요 유통업체 매출 동향 – 경기 부진이 보이는 실적\n\nIBK투자증권은 9월 유통업체 매출액이 전년동기대비 +4.5% 성장했다고 한다. 오프라인은 +5.1%, 온라인은 +4.0% 상승했다. 8월 대비 부진한 흐름이 나타났다. 9월의 경우 추석 연휴에 따른 식품 수요와 선물세트 수요가 맞물리는 구간이라는 점에서 8월 대비 성장률이 낮다는 점은 부진한 실적으로 평가한다.\n\nIBK투자증권은 9월 백화점 명품 성장률이 +6.9%로 급격하게 하락했다고 한다. 9월 방한 외국인 수요가 8월보다 낮은 200만 명 수준을 기록했지만, 이전 수치와 비교할 때 급격하게 낮아졌다는 점에서 내국인 소비 둔화가 영향을 미쳤다고 한다. 특히 9월의 경우 선물세트 수요에 따른 집객력 증가가 이루어지는 시점이라는 점에서 전체 성장률 감소는 아쉬운 부분으로 평가한다.\n\n편의점 9월 성장률은 +2.9%로 전월 대비 개선했다. 하지만 전년대비 역성장한 품목군이 증가했고, 식품 등 상품 성장률이 둔화되었으며, 일부 거래처 배송일 확대 효과가 제한적이었기 때문에 긍정적인 수치로 판단하기는 어렵다고 한다.\n\n---\n\n### ⑪ 유진투자증권: 안녕하세요 데일리에요 (로봇/방산/조선)\n\n유진투자증권은 9월 주요 유통업체 매출 동향을 확인하면서, 9월 무색한 추석 효과에 대해 언급한다. 8월 대비 성장률이 낮아졌다고 평가한다. 9월 주요 채널별 성장률을 세세히 살펴보면 경기 부진이 작용하고 있다는 판단이다. 상반기 유통업체 실적을 이끌었던 채널은 백화점과 편의점이었다. 백화점의 경우 자산가치 상승 + 외국인 소비, 편의점 점포 스크랩에 따른 기저 + 나들이 고객 증가가 맞물리면서 전체 성장을 이끌었다. 하반기로 접어들수록 동 효과가 낮아지면서 실적 기여도가 감소하는 추세이다.\n\n9월 백화점 명품 성장률은 +6.9%로 급격하게 하락했다. 9월 방한 외국인 수요가 8월보다 낮은 200만 명 수준을 기록했지만, 이전 수치와 비교할 때 급격하게 낮아졌다는 점에서 내국인 소비 둔화가 영향을 미쳤다고 한다. 특히 9월의 경우 선물세트 수요에 따른 집객력 증가가 이루어지는 시점이라는 점에서 전체 성장률 감소는 아쉬운 부분으로 평가한다.\n\n편의점 9월 성장률은 +2.9%로 전월 대비 개선했다. 하지만 전년대비 역성장한 품목군이 증가했고, 식품 등 상품 성장률이 둔화되었으며, 일부 거래처 배송일 확대 효과가 제한적이었기 때문에 긍정적인 수치로 판단하기는 어렵다고 한다. 그렇게 생각하는 이유는 1) 전년대비 역성장한 품목군이 증가하였고, 2) 식품 등 상품 성장률이 둔화되었으며, 3) 일부 거래처 배송일 확대 효과가 제한적이었기 때문이다.\n\n--- \n\n### ⑫ IBK투자증권 / 하나증권 / 신한투자증권 / 유진투자증권 / 유안타증권: 조선업, 환율 역풍, 잔고는 순풍 – 쉬어가는 이익, 쌓이는 잔고\n\nIBK투자증권은 3분기를 쉬어가는 구간이라고 명시한다. HD한국조선해양이 컨센서스를 8%, HD현대중공업이 8% 하회했고, 원화 강세에 따른 외환 관련 손실로 순이익 감소폭이 더 클랐다고 한다. 그러나 해양플랜트·엔진기계·HD현대삼호의 이익 체력은 오히려 강해졌고, 2024년 고선가 물량의 매출 전환이 2028년까지 증익 경로를 유효하게 만들어 준다고 한다. 현재 주가는 하향 위험을 상당 부분 반영한 수준이라고 평가한다.\n\n하나증권은 HD한국조선해양 3Q26 영업이익이 컨센서스에 부합했다고 하되, 테마 주가의 변곡점을 찾겠다고 명시하고 목표주가를 480,000원으로 15.8% 하향하며 투자의견을 \"매수\"로 유지한다. 그 이유는 \"자회사의 지분 가치 하락을 반영\"하기 위한 것이라고 명시한다. 3분기 매출액은 8.3조원으로 전분기 대비 7.2% 감소했다. 조업일수 감소와 원화 강세 때문이며 환율 영향은 자회사 포함 700억원 정도라고 한다. 영업이익은 1.4조원으로 전분기 대비 12.0% 감소했는데, 조업일수 감소 영향 관련 일회성 비용이 반영되었고 임단협 비용 추정치의 75%가 이번 분기에 선반영되었다고 한다. 조선은 조업일수 감소와 환율 하락으로 마진이 둔화되었지만 해양, 특수선, 엔진기계는 양호한 추세를 나타냈다고 한다.\n\n신한투자증권은 3분기 누적 수주는 176척, 191억 달러로 연간 목표를 초과 달성했다고 한다. 미국 그린필드 투자가 결정되었으며, 군수 지원함 수주를 목표로 우선하고 있다고 한다. 2027년 추정치 기준 PER 3.5배, PBR 0.9배다.\n\n유진투자증권은 9월 주요 유통업체 매출 동향을 확인하면서, 9월 무색한 추석 효과에 대해 언급한다. 8월 대비 성장률이 낮아졌다고 평가한다. 9월 주요 채널별 성장률을 세세히 살펴보면 경기 부진이 작용하고 있다는 판단이다. 상반기 유통업체 실적을 이끌었던 채널은 백화점과 편의점이었다. 백화점의 경우 자산가치 상승 + 외국인 소비, 편의점 점포 스크랩에 따른 기저 + 나들이 고객 증가가 맞물리면서 전체 성장을 이끌었다. 하반기로 접어들수록 동 효과가 낮아지면서 실적 기여도가 감소하는 추세이다.\n\n유안타증권은 3분기를 쉬어가는 구간이라고 명시한다. HD한국조선해양이 컨센서스를 8%, HD현대중공업이 8% 하회했고, 원화 강세에 따른 외환 관련 손실로 순이익 감소 폭이 더 클랐다고 한다. 그러나 해양플랜트·엔진기계·HD현대삼호의 이익 체력은 오히려 강해졌고, 2024년 고선가 물량의 매출 전환으로 2028년까지 증익 경로는 유효하다고 한다. 현재 주가는 하향 위험을 상당 부분 반영한 수준이라고 평가한다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### ① 하이닉스 어닝 서프라이즈: 실적의 질과 주주환원의 숫자 사이에서\n\nSK하이닉스는 3분기에 104.6조원 매출, 83.3조원 영업이익을 기록하며 모두 컨센서스를 상회했다. 이 수치 자체만으로도 주목할 만하다 — 83조원의 영업이익은 사상최대다. 그런데 여기에 중요한 추가정보가 붙었다. 2026 회계연도 기준 약 100조원 규모의 주주환원 계획을 제시했는데, 이는 현금배당 30조원 이상 + 기존 40조원 포함 자사주 매입·소각 60조원 이상으로 구성되었다. 3분기에는 이미 현금배당 14조원과 자사주 매입 20조원을 결정했고, 이 중 임직원 성과보상용 자사주 매입 10조원은 주주환원에서 제외된다.\n\n핵심은 여기에 있다. 이 수치들은 서로 다르게 해석될 수 있다. 하나는 '실적의 질' — 메모리 공급 부족이 2030년까지 지속될 것이라며, 2029년까지 HBM/D램 물량이 사실상 판매 완료되었고, 2027~2028년 CAPA의 50% 이상을 장기계약(LTA)로 확보했다는 얘기다. 또 14건의 LTA를 체결했다. 이건 중장기 이익의 가시성을 확보하는 구체적 데이터다.\n\n다른 하나는 '주주환원의 숫자' — 100조원 규모의 주주환원이 2026 회계연도에 집중되어 있고, 그 중 60조원은 자사주 매입·소각이다. 그리고 이 중 20조원은 이미 3분기에 실행되었고, 앞으로 남은 40조원(자사주 소각 40조원?)이 다음 분기부터 집행될 것으로 보인다.\n\n이 두 가지를 결합하면 어떤 의미인지 보다 잘 이해된다. 메모리 수급 불균형이 2030년까지 지속되는데다가, LTA로 2027~2028년 CAPA의 50% 이상이 확보된 것을 보면, 2026년이 아닌 2027~2028년 이후에도 수익성은 지속될 가능성이 높다. 그렇다면 2026 회계연도에 집중된 주주환원이 과도하게 진행되면 오히려 이익의 장기화를 약화시키는 요인이 된다. 하지만 이 주주환원 계획의 구조를 살펴보면, 자사주 매입·소각 비중이 높다(총 60조원 중 40조원? 3분기 이미 20조원 실행). 자사주 소각은 주식 수급을 줄이고 이익을 희석시키지 않는다. 즉, 주주환원의 형태가 현금배당보다는 자사주 소각에 집중되어 있으므로, 해당 주주환원이 이익의 장기화를 해칠 가능성이 낮다.\n\n그럼에도 불구하고, 2026 회계연도에 100조원 규모의 주주환원이 집중되어 있고, 그 중 60조원이 자사주 매입·소각으로 이루어져 있다. 이건 단기간에 주식 수급이 급격히 줄어들 수 있는 구조다. 그런데 3분기는 이미 20조원의 자사주 매입을 실행했다. 나머지 40조원이 다음 분기부터 실행될 것으로 보인다면, 주식 수급의 급격한 줄어듬이 언제쯤 끝날지를 생각해야 한다. 만약 2026 회계연도 내에 이 주주환원이 거의 대부분 수행된다면, 2026 회계연도 이후에는 자사주 매입·소각의 부담이 줄어들고 현금배당 비중이 상대적으로 높아질 수 있다. 그러나 이건 아직 구체적인 실행 일정이 없다는 문제가 있다. 주주환원의 일정이 2026 회계연도 내에 집중된다면, 해당 회계연도의 주식 수급이 급격히 줄어든다는 의미다.\n\n---\n\n### ② 대만: AI 밸류체인 노출도가 높은데도 낮은 변동성의 원천\n\n대만의 2026년과 2027년 EPS 성장률은 각각 75.8%, 31.2%로 한국에 이어 주요국 중 가장 높다. 최근 3개월간 12MF EPS는 18.1% 상향돼 한국(+12.7%)을 앞섰고, 이익 수정 비율(Earnings Revision Ratio)도 19.8%로 주요국 중 가장 높았다. 이익 전망이 상향된 한국도 주가가 급격히 조정되었지만, 대만은 고점 대비 낙폭이 5.6%에 그친다. 최근 20일 실현 변동성은 코스피(52.7%)의 절반이 넘지 않은 21.5%다. 대만가권지수의 고점 대비 낙폭이 한국의 그것보다 적고, 변동성도 낮다. 이 차이는 단지 이익 전망 상향 때문이라고 보기 어렵다. 한국도 이익 전망이 상향되었는데, 주가 조정 폭이 더 크다. 차이는 이익의 듀레이션이다.\n\n대만의 차별화 요인은 이익의 듀레이션이다. 한국은 이익의 듀레이션이 짧고, 주가가 급격히 조정되었지만, 대만은 이익의 듀레이션이 길고 주가가 더 낮은 변동성을 보인다. 이걸 설명하기 위해 산업 측면에서 어떤 호재가 있었는지 찾아볼 필요가 있다. 실제로 21일 GTC베를린에서 엔비디아가 유니마이크론(KYEC)·KYEC 등 대만 공급망의 CAPA 확대 계획을 발표했다. KYEC에게는 11억달러의 예약 선급금을 제공해 미국 테스트 시설 증설을 지원한다. 기판·테스트·광엔진 CAPA도 2027~2028년 확대할 계획이다. AI 투자 지속성에 대한 신뢰를 높이고, 후공정 밸류체인의 중기 실적 가시성을 강화하는 요인이다. 이건 한국도 수혜를 받는 변화다. 차별화 요인은 이익의 듀레이션이다.\n\n---\n\n### ③ FOMC 금리 동결과 케빈 워시의 입장: 매파적 신호의 상대적 수준\n\n연준은 10월 FOMC에서 기준금리를 예상대로 동결했다. 3년 2개월 만에 금리를 인상한 이후 속도를 조절한 것이다. 연준 의장인 케빈 워시는 기자회견에서 \"인플레이션이 높다면서도 기대 인플레이션이 올바른 방향으로 움직이고 있다\"고 밝혔다. 이건 금리를 당장 가파르게 인상할 필요성을 크게 보고 있지 않다는 해석을 가능하게 한다. 다만 워시 의장은 9월 인상 이후 금융여건이 긴축적으로 변했고, 현재의 높은 인플레이션을 추가적인 데이터를 보면서 정책 결정을 하겠다는 입장을 밝혔다.\n\n매파적인 신호는 12명의 연준 위원들 가운데 반대표가 2명이라는 점이다. 반대표는 리사 쿡 연준 이사와 헤메크 클리블랜드 연은 총재였다. 리사 쿡 이사는 대외적으로 그다지 매파적이지 않았다는 점에서 의외였다. 워시 의장의 발언이 지난 9월 FOMC에 비해 덜 매파적인 쪽으로 해석된 것도 이러한 맥락에서다.\n\n성명서에서 추가된 문구도 매파적 신호다. \"더 많은 정보가 쌓이면 물가를 2% 목표로 적시에 되돌리는 데 적절한 정책기조를 위원회가 판단하는 데 도움이 될 것\"이라는 문구는 추가 인상 가능성을 시사한다. 다만 워시 의장은 중간선거 영향을 부인했지만, 설명은 부족했다. 2027년 이후 연준의 금리 결정 횟수를 단계적으로 축소할 방침이다. 2027년 8차례 정례회의 중 7차례만 금리를 결정하고, 2028년에는 6차례만 금리를 결정하겠다고 밝혔다.\n\nCME FedWatch에 따르면 12월 인상 확률은 80%대에 육박한다. 그러나 최근 유가 상승 압력(WTI 102달러, 브렌트 115달러)을 감안하면 추가 인상 기대가 더 높아지지 않고 있다. 증시 밸류에이션 하락 압박이 심해지지 않을 전망이다.\n\n---\n\n### ④ 반도체 & 하이퍼스케일러: 이익 vs 현금흐름의 주가 공방전\n\nMS는 분기 매출액(923억달러 vs 컨센 907억달러), EPS(4.89달러 vs 컨센 4.73달러) 모두 서프라이즈를 기록했고, FCF(186억달러 vs 컨센 85억달러)도 개선되었다. 반면 알파벳은 구글 검색 및 기타매출 부진으로 분기 매출액(1,276억달러 vs 컨센 1,282억달러)이 소폭 하회했고, FCF(-91억달러 vs 컨센 -27억달러)가 악화하였다. 알파벳의 클라우드 YoY +103%, MS의 애저 YoY +48% 등 두 업체 모두 본업은 고성장세를 이어갔고, 연간 CAPEX 가이던스도 유지했다. AI 인프라 수요는 견고하다고 판단할 수 있다. 다만, 이 투자 기조 확대 속에서 현금흐름(FCF) 개선 정도에 따라 하이퍼스케일러 업체들 간 주가 양극화가 심화될 가능성이 있다.\n\n---\n\n### ⑤ 반도체와 AI 인프라 병목: Compute와 Power의 두 축\n\nAI 인프라 병목은 연산(Compute)과 전력(Power)의 두 축에서 심화되고 있다. 이에 따른 수익화 모델은 네오클라우드와 파워드셸 임대인으로 양분된다. 네오클라우드는 수개월~6년 확약형(take-or-pay) 계약 중심이다. 파워드셸 임대인은 10~20년 장기 NNN 리스 기반이다. 두 모델의 수익 구조는 '전력망 연계 시점(Time to Power)'과 '거래상대방 신용(Counterparty Credit)'이라는 변수로 비교 분석된다.\n\nGPU 서버와 데이터센터 건물은 계약 시점에 부채로 매입되나, 실제 매출과 임대료는 전력 인입 후 상업 가동(COD) 이후에야 발생한다. 코어위브(CRWV)는 총 계약 전력 4.2GW 중 가동 용량이 1.5GW에 불과하고, 입고됐으나 가동 전인 설비의 감가상각비와 이자비용은 매출 없이 반영된다. 즉, 계약부터 상업 가동까지의 시차(Lead Time)가 길수록 무수익 상태로 묶이는 자본이 커지고, 이 자본의 조달 비용은 최종 고객사의 신용등급에 연동된다.\n\n투자등급(IG) 고객 계약을 담보로 한 GPU 파이낸싱 금리는 6.0% 수준이고, 비IG 고객 담보 금리는 9.0%에 달한다. 양대 산업의 기업가치가 시장금리보다 '상업 가동의 조기 달성 여부(시간)'와 '거래상대방의 디폴트 리스크(신용)'에 민감한 이유다. 10월 섹터 급락에서 이 신용 사다리는 채권 가격에서만 작동했다. CRWV 무담보채 유통수익률이 15~16%까지 오르고, 9종목의 주가가 레버리지나 테넌트 구성과 무관하게 21~49% 함께 빠졌다. 개별 신용이 아니라 섹터 전체의 할인율이 재산정된 것이다.\n\n이번 조정은 두 갈래로 해석된다. 금리 인상 우려와 단기 수급 부담에 따른 '일시적 자본비용 재산정(Repricing)'이거나, 차입 조달한 GPU의 회수 기간이 계약 만기와 경제적 내용연수를 초과할 수 있다는 '사업 모델의 구조적 디레이팅(De-rating)'이다. 전자라면 금리 우려의 되돌림과 함께 종전 조건의 구조화 금융이 재개되며 진정된다. 후자라면 주가가 반등해도 조달 여건이 정상화되지 않는 한 단위당 경제성(Unit Economics)이 성립하기 어렵다. 단정하기는 이르고, MSFT·AMZN 실적(10/28~29)의 2027년 CapEx 가이던스를 시작으로 12월까지 확인될 담보부 조달 조건과 신규 사이트의 상업 가동 성과가 방향성을 가를 분수령이다.\n\n당사는 단기 주가 변동성과 무관하게 중장기 AI 인프라 공급 병목은 지속될 것으로 판단하며, 전력 인입 권리 선점과 상업 가동 시점 통제를 스스로 통제하는 사업자의 구조적 우위에 주목한다. 섹터 내 최선호주(Top Picks)로는 업황 개선 시 기확보 전력의 조기 가동에 따른 실적 레버리지가 크고, 업황 부진 시에도 우량 장기 계약과 이미 연결된 계통망이 실적 하방을 받치는 IREN(네오클라우드)과 WULF(파워드셸 임대인)를 제시한다.\n\n---\n\n### ⑥ 미국 10년 국채금리 하락: FOMC 금리 동결과 경제성장 전망 상향\n\n미국 10년 국채금리는 5.28%에서 4.95%로 하락했다. 연준(Fed)이 금리를 동결하면서 시장이 추가 인상 가능성을 재검토하며 미국 단기·장기 국채금리가 일제히 하락했고, 10년물은 5% 아래에서 머물렀다.\n\n---\n\n### ⑦ 대북 긴장과 국제에너지기구(OEPC): 북한 원자탄 실험, OPEC+가 12월 회의 개최\n\nOEPC+(Organization of the Petroleum Exporting Countries plus)는 12월 회의를 개최한다고 발표했다. 이는 국제 원유 공급을 조절하여 글로벌 원유 가격을 안정화하기 위한 목적이다. OEPC+ 회원국들은 원유 공급을 조절함으로써 원유 가격이 급격히 변동하거나 불안정하게 유지되지 않도록 노력하고 있다. 이 회의는 글로벌 원유 공급과 수요를 조절하고, 국제 원유 가격의 안정을 도모하는 데 중요한 역할을 할 것으로 예상된다.\n\nOEPC+는 국제 원유 공급과 수요의 균형을 유지하고, 국제 원유 가격의 급격한 변동을 방지하기 위해 활동하고 있다. 이 조직은 원유 공급을 조절함으로써 국제 원유 가격이 급격하게 변동하거나 불안정하게 유지되지 않도록 노력하고 있다. 12월 회의에서는 글로벌 원유 공급과 수요, 국제 원유 가격 등의 상황을 점검하고, 필요한 조치를 논의할 것으로 예상된다. 이 회의는 글로벌 원유 공급과 수요의 균형을 유지하고, 국제 원유 가격의 안정을 도모하는 데 중요한 역할을 할 것으로 예상된다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로 분야에서는 10월 FOMC 회의에서 기준금리 동결이 결정되면서, 쿡 이사와 해맥 총재의 반대표가 인상 요구가 확산되고 있음을 시사했다. 성명서 수정과 워시 의장의 기자회견 발언을 통해 단기 인플레이션 기대 안정화와 금리 정책 유연성 확대가 강조되었으며, 금리 스티프닝과 경기 판단 강화라는 두 채널의 갈등이 지속되고 있다. 채권 시장에서는 단기 국채금리 하락과 장기 국채금리 상승의 분기화가 나타나며, 연준의 정책 유연성과 중장기 물가·재정 위험에 대한 경계가 공존하고 있다. 산업 섹터에서는 추석 효과로 9월 오프라인 업태 매출이 증가했으나 10월에는 성장률이 둔화될 것으로 전망되며, 조선업은 3분기 임시 조업일수 감소와 환율 역풍으로 실적 하락이 나타났다."}]}</script>
