<script id="__DATA__" type="application/json">{"date": "2026-10-20", "headline": "글로벌 시장, 고유가-고금리 악재 지속…프랑스 국채금리 추가 상승", "market": {"KOSPI": {"label": "코스피", "value": 5552.74, "change": -3.73, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 781.97, "change": -3.33, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1326.8, "change": -0.5, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 101.79, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4142.6, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.111, "change": -2.55, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.216, "change": 6.2, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52495.88, "change": 1.02, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7712.57, "change": 0.28, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 26424.82, "change": -0.02, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -3.73% (현재 5552.74, 전일 5768.01)\n- **코스닥** 하락 -3.33% (현재 781.97, 전일 808.89)\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# ## 매크로(경제)\n\n### 글로벌 시장, 고유가-고금리 악재 지속…프랑스 국채금리 추가 상승\niM증권은 최근 프랑스 국채 10년 금리가 4.9309%로 전주 대비 14.53bp 급등하면서 7월 중순 이후 최대 폭의 오름세를 기록했다고 진단한다. 이날 프랑스 국채금리를 자극했던 배경에는 정국 불안이 있었다. 프랑스 정부는 시위 격화로 일부 지역들의 야간 통행금지를 발표했는데, 이 같은 움직임은 프랑스발 국채금리 불안을 확산시키고 있다는 것이다. iM증권은 프랑스 국채금리 상승을 더욱 자극하고 있는 것으로 현재의 사회 불안을 꼽았다. \n\n프랑스 국채금리의 급등은 다른 유럽 국가들의 국채금리까지 동반 상승하게 만들었다. 이탈리아 10년 금리는 10bp 가까이 뛰었으며, 스페인 10년물 금리도 약 7bp 상승했다. 또한 유로존 국채시장의 벤치마크 역할을 수행하는 독일 국채(분트) 10년 국채금리 역시 3.4776%로 전장 대비 3.78bp 높아졌다. 이러한 현상은 고금리 부담이 아직 해소되지 않고 있으며, 특히 프랑스 국채금리 리스크가 해소되지 못하고 있다고 iM증권은 강조한다.\n\n### 고유가 현상 지속…WTO가격 103.66달러\n고유가 현상도 계속되고 있다. iM증권은 WTI 가격이 103.66달러로 100달러대 흐름을 유지하고 있다고 진단한다. 미국의 대러시아 제재 완화에 따른 공급확대 기대감은 후티 반군의 사우디 석유설비 공격으로 소멸되고 오히려 공급 차질 우려만이 증폭되었는데, 이를 통해 고유가 현상을 부채질하고 있다고 설명한다. 이밖에 미국-이란간 군사충돌이 소강국면을 보이고 있음에도 불구하고 사우디-후티간 군사 춲동 격화가 고유가현상을 부채질하고 있다고 덧붙였다.\n\n### AI발 신용우려도 큰변화 모멘텀 찾지 못하나…\nAI발 신용우려도 큰 변화의 모멘텀을 찾지 못하고 있다. 코어 위브 주가의 급락세와 CDS 급등세가 다소 주춤해졌지만, 금융시장에 AI발 신용악재를 해소시키기에 충분하지 않다는 것이 iM증권의 주장이다. \n\n### 고금리와 고유가 현상에 따라 경제지표 부진 가시화\n고금리와 고유가 현상에 따라 경제지표 부진이 가시화되고 있다. 고금리에 가장 큰 직격탄을 받는 주택시장 둔화세가 두드러지고 있다. 10월 미국 주택경기체감지수(NABH)지수가 9월대비 3pt 하락한 29를 기록했는데, 이 수준은 2012년 6월 이후 가장 낮은 수준이라고 iM증권은 설명한다. 고금리 여파로 주택시장 냉각 속도가 빨라지고 있고, 이전에 비해 주택경기가 미국 경기사이클에 미치는 영향력이 약화된 것은 분명하지만, 주택경기 침체가 미국 경기사이클에 분명 악재인 것을 인정해야 한다는 입장이다.\n\n### 새롭게 나타난 악재?\n새로운 악재가 나타났다고 보기 어렵지만, 기존 악재가 지속되면서 경기와 증시에 부담을 주고 있는 것도 피할 수 없다는 것이 iM증권의 관측이다.\n\n### 프랑스 재정 불안과 신용등급 하향 압력 점검\n신한투자증권은 프랑스 재정 문제가 정치적 불확실성과 구조적인 재정취약성을 맞물린 결과라고 진단한다. 신한투자증권은 기초재정수지 적자가 지속되는 가운데 연금·의료 등 경직적인 지출과 이자비용 증가가 재정정상화를 제약한다고 설명한다. 정부는 2027년 예산안에서 540억 유로의 재정건전화 조치를 제시했지만, 의회 과반 당의 부재와 대선을 앞둔 정치적 대립으로 원안 통과는 어렵다고 판단한다. 야당과의 타협 이후 헌법 제49조 3항을 활용한 예산안 성립에 무게를 두지만, 협상과정에서 건전화규모가 축소될 가능성은 높다고 덧붙였다.\n\n### 3/4분기 중국 GDP: 내년 성장도 첨단 제조업\n한화투자증권은 3/4분기 중국 GDP가 전년동기대비 4.5%(전기대비 1.2%) 성장을 기록하며 예상치를 상회했다고 진단한다. 한화투자증권은 제조업 중심의 2차산업(+3.4%) 성장이 개선됐고, 서비스업(+5.2%) 성장도 양호한 흐름을 유지했다고 설명한다. 물가여건 개선을 반영한 명목GDP는 전년동기대비 6.0% 성장하며 2022년 1/4분기 이후 가장높은 성장률을 기록했다고 덧붙였다. 한화투자증권은 내년 성장도 첨단 제조업이 선도할 것으로 전망한다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 프랑스 재정 불안, 국고채에 기회는?\n\n### 프랑스 위기를 훤히 알 수 없는 시장\n\n프랑스 국채 금리가 10월 19일 기준 4.9%로 급등했다. 독일 국채 대비 스프레드는 145bp로 확대된 상태다. iM증권은 \"프랑스 위기는 재정 문제와 정치 문제가 서로 증폭\"한다고 진단한다. GDP 대비 정부부채 비율은 119%이고, 2026년 재정적자는 GDP 대비 5.4%로 아직 EU 기준 3%를 크게 웃돈다. \n\niM증권은 2027년 예산안에서도 5% 수준의 적자를 목표로 한다고 언급한다. 그러나 2027년 대통령 선거를 앞두고 정치적 기반이 취약하다는 점을 지적한다. 현재 시장이 주목하는 것은 단기적인 부도 가능성보다 중기적으로 부채비율을 안정시킬 수 있는 재정 조정의 규모와 실현 가능성이다. \n\n### 정치적 기반과 재정 조정의 관계\n\niM증권은 \"감축안 발표만으로 신뢰를 회복하기는 어렵다\"고 판단한다. 예산안 통과와 구체적인 집행 실적이 확인되기 전까지 재정 불안이 지속될 가능성이 크다고 설명한다. 특히 2027년 대통령 선거를 앞두고 정치적 이해관계가 복잡하게 얽혀 있다. \n\n재정 조정을 뒷받침할 정치적 기반이 취약하다는 점을 강조한다. 의회 내 분열과 긴축에 대한 사회적 반발, 2027년 대통령 선거를 앞둔 정치적 이해관계가 맞물리면서 지출 삭감과 세입 확충에 대한 합의가 쉽지 않다고 설명한다. \n\n### 재정 불안과 정치적 교착의 악순환\n\niM증권은 \"당장은 재정 조정 지연이 국채금리 상승을 유발하고, 높아진 조달비용이 추가 긴축을 요구하면서 정치적 저항을 다시 확대하는 악순환\"이 우려 된다고 분석한다. \n\n금리 상승이 기존 부채 전체의 이자비용에 즉시 반영되지 않고, 신규 발행과 만기 차환을 통해 부담이 점진적으로 누적된다는 점을 고려하면, 현재는 즉각적인 지급불능 위기보다 정치적 교착이 재정 신뢰와 차환 여건을 약화시키는 국면으로 판단한다. \n\n### 향후 예산안 처리와 국채 입찰\n\niM증권은 향후 예산안 처리와 국채 입찰 소화, 은행 조달시장으로의 전염 여부가 주요 분기점이 될 전망이라고 설명한다. \n\n### 종합 판단\n\n프랑스 국채 금리가 4.9%로 급등하고 독일 국채 대비 스프레드가 145bp로 확대된 이유는 재정 불안과 정치적 교착 때문이라는 iM증권의 설명은 설득력을 갖는다. 단기적으로는 즉각적인 지급불능 위기에 도달하지 않을 것으로 추측되나, 재정 조정이 정치적 기반 없이는 진행되지 않을 가능성이 크다. \n\n이런 상황에서 국채 금리 상승이 멈춰줄 수 있는 요인이 어디인지 찾아봐야 한다. 2027년 예산안 통과와 구체적인 집행 실적 확인이 허용 가능한 시점이 아닌가 생각된다. 국채 입찰 소화와 은행 조달시장으로의 전염 여부도 중요한 변수다. \n\n### 미국 금리 고점은 언제 형성될까\n\n### 금리 고점의 형성 조건\n\n하나증권은 미국 10년 금리가 크게 두 가지로 구성되어 있다고 설명한다. 하나는 앞으로 10년간 연준 기준금리가 평균적으로 얼마나 될지를 기대하는 부분이며, 다른 하나는 장기채를 들고 있는 위험에 대한 보상, 즉 기간프리미엄이다. 금리가 오르는 국면에서는 둘 중 하나, 혹은 지금처럼 둘다 커진다. \n\n경기가 좋아지고 물가가 오르면 기준금리 기대가 올라간다. 재정적자가 커지거나 해외 매수자가 줄거나, 지금처럼 회사채와 경쟁하는 시대에서는 기간프리미덤이 올라간다. \n\n### 금리 고점의 형성 시점\n\n하나증권은 \"금리가 고점을 찍는 순간은 이 둘을 밀어 올리던 힘이 꺾일 때다\"라고 설명한다. 역사적으로 그 계기는 대부분 '부작용'이었다. 금리가 충분히 높아지면 빚을 많이 진 곳(가계, 기업, 레버리지, 신흥국)이 먼저 버티지 못한다. 경기 우려가 커지면 시장은 연준이 결국 금리를 내릴 것이라고 예상하고 장기금리를 끌어내린다. \n\n1990년 이후 미국 10년물 금리 고점은 6차례 있었는데, 모두 2년뒤 금리는 더 낮았다. 평균 하락폭은 164bp였다. 고점은 '좋은 뉴스'를 통해 꺾인 적이 없다. 매번 고금리가 무언가를 부러뜨렸다. 경기(1990, 2000년), 레버리지와 신흥국(1994년), 신용시장(2007년), 주식시장(2018년), 그리고 국채 수급에 대한 재무부의 대응(2023년)이었다. \n\n### 과거와 현재의 차이\n\n과거 고점은 연준 사이클의 초기 단계에서 나왔다. 1990년을 제외한 5차례 인상 사이클에서 10년물 고점은 '마지막 인상 전후 4개월 이내'에 몰려 있다. 결국 시장이 '이제 연준이 거의 다 올랐다'고 확신할 때 장기금리가 꺾인 것이다. 2007년만 예외적으로 1년 동결 후 고점을 기록했다. \n\n하나증권은 올해 12월, 내년 3월 두 차례 인상을 전망하고 있으며, 최종 기준금리 4.50%를 목표로 하고 있다. 이 경로라면 12월 FOMC 인상 전후, 즉 4분기에서 내년 1분기 사이가 고점 구간이라 판단한다. 단, 리스크는 양방향으로 열려 있다. \n\n### 종합 판단\n\n1990년 이후 미국 10년물 금리 고점은 모두 '부작용'으로 형성되었고, 경기, 레버리지, 신용시장 등의 문제로 고점을 찾았다. 연준 사이클의 초기 단계에서 고점을 기록했던 사례는 없었다. 2007년처럼 1년 동결 후 고점을 기록한 것도 드문 사례다. \n\n하나증권은 올해 12월, 내년 3월 두 차례 인상을 전망하고 있다. 이 경로라면 12월 FOMC 인상 전후, 즉 4분기에서 내년 1분기 사이가 고점 구간이라 판단한다. 그러나 리스크는 양방향으로 존재한다. \n\n### 국내 채권시장 동향\n\n### 국고채 금리 상승\n\n유안타증권은 전일 국내 채권시장 동향을 다음과 같이 설명한다:\n\n- 국고채 금리는 상승했다. \n- 외국인의 대규모 국채선물 순매수가 있었지만, 코스피 반등과 금통위를 앞둔 경계감이 우세해 오후 들어 약세로 전환했다.\n- 국고채 10년물 입찰은 다소 호조였지만 금리 상승을 막기에는 역부족이었다.\n- 외환시장에서는 달러-원이 1.10원 내린 1,330.30원 마감했다. 수출업체 네고와 경상흑자에 따른 달러 공급 기대, 국내 증시 회복이 하락 압력으로 작용했다. 다만 1,320원대에서는 저점 인식에 따른 반발 매수가 유입돼 낙폭 일부 축소되었다.\n\n### 국내 채권시장 약세 마감\n\n유진투자증권은 국내 채권시장이 약세로 마감했다고 설명한다:\n\n- 금통위 앞둔 경계심이 발동했다.\n- 외국인 국채선물 순매수는 계속됐지만 지난주 주식시장 폭락에 연동되며 금리 하락한 뒤 그에 대한 되돌림 일부 작용하면서 금리 상승했다.\n- 국고 10년물 입찰도 호조를 보였지만 금리 방향성을 이끌긴 부족했다.\n- 국내 주식시장이 소폭이나마 반등한 가운데, 10월 금통위를 앞둔 경계심도 함께 나타나면서 금리 상승세 지속했다.\n- 10월 금통위 동결 이미 반영됐으나 11월 인상 시그널을 확인하고 가야한다는 불안이 작용했다.\n\n### 국내 채권시장 동향 요약\n\n다올투자증권은 국내 채권시장 동향을 다음과 같이 요약한다:\n\n- 금리방향: 상승(3Y), 상승(10Y)\n- 일드커브: 스티프닝\n- 스프레드(bp): 국5/3: 13.8 (0.3), 국10/3: 33.3 (0.3), 국10/5: 19.5 (0.0), 국30/10: 7.5 (-1.7)\n\n### 국내 채권시장 동향\n\n신한투자증권은 국내 채권시장 동향을 다음과 같이 설명한다:\n\n- 2026년 9월 28일 기준 공급망안정화기금 지원 현황이 공개되었다.\n- 글로벌 공급망 불안에 대응해 경제안보품목의 안정적 확보, 수입선 다변화 등을 위해 공급망안정화기금의 금융지원이 확대되었다.\n- 기금 지원액은 2024년 2.1조원에서 2025년 7.1조원, 2026년 9월말 8.1조원으로 증가하였다.\n- 올해 상반기 중동 위기대응 과정에서 원유 구매자금 등 대규모 자금 소요가 있었다.\n- 지원금액 대부분을 대기업이 차지하였으며, 지원건수 기준으로는 대기업 비중이 51%로 과반 이상이었으나, 중견기업과 중소기업 비중이 각각 25%, 24%로 높은 수준이었다.\n- 수출입은행 공급망안정화기금채권 발행액은 작년 5.8조원에서 올해 누적 4.9조원 기록 중이었다.\n- 중동전쟁 지속으로 공급망안정화기금은 대기업 중심 자금 지원될 가능성이 크다고 설명하였다.\n- 매크로 위험이 정부 신용으로 흡수되는 효과가 있다는 의견을 표명하였다.\n\n### 종합 판단\n\n국내 채권시장 동향은 국고채 금리 상승과 외국인의 대규모 국채선물 순매수가 있었지만, 코스피 반등과 금통위를 앞둔 경계감이 우세해 오후 들어 약세로 전환되었다. 국고채 10년물 입찰은 다소 호조였지만 금리 상승을 막기에는 역부족이었다. 외환시장에서는 달러-원이 1.10원 내린 1,330.30원 마감했으며, 수출업체 네고와 경상흑자에 따른 달러 공급 기대, 국내 증시 회복이 하락 압력으로 작용했다. 다만 1,320원대에서는 저점 인식에 따른 반발 매수가 유입돼 낙폭 일부 축소되었다. \n\n국내 채권시장은 약세로 마감했으며, 금통위 앞둔 경계심이 발동했다. 외국인 국채선물 순매수는 계속됐지만 지난주 주식시장 폭락에 연동되며 금리 하락한 뒤 그에 대한 되돌림 일부 작용하면서 금리 상승했다. 국고 10년물 입찰도 호조를 보였지만 금리 방향성을 이끌긴 부족했다. 국내 주식시장이 소폭이나마 반등한 가운데, 10월 금통위를 앞둔 경계심도 함께 나타나면서 금리 상승세가 지속되었다. 10월 금통위 동결 이미 반영됐으나 11월 인상 시그널을 확인하고 가야한다는 불안이 작용했다. \n\n국내 채권시장 동향 요약은 금리방향이 상승(3Y), 상승(10Y)이며, 일드커브가 스티프닝했다. 스프레드(bp)는 국5/3: 13.8 (0.3), 국10/3: 33.3 (0.3), 국10/5: 19.5 (0.0), 국30/10: 7.5 (-1.7)였다. \n\n공급망안정화기금 지원 현황 공개는 글로벌 공급망 불안에 대응해 경제안보품목의 안정적 확보, 수입선 다변화 등을 위해 공급망안정화기금의 금융지원이 확대되었다. 기금 지원액은 2024년 2.1조원에서 2025년 7.1조원, 2026년 9월말 8.1조원으로 증가하였다. 올해 상반기 중동 위기대응 과정에서 원유 구매자금 등 대규모 자금 소요가 있었다. 지원금액 대부분을 대기업이 차지하였으며, 지원건수 기준으로는 대기업 비중이 51%로 과반 이상이었으나, 중견기업과 중소기업 비중이 각각 25%, 24%로 높은 수준이었다. 수출입은행 공급망안정화기금채권 발행액은 작년 5.8조원에서 올해 누적 4.9조원 기록 중이었다. 중동전쟁 지속으로 공급망안정화기금은 대기업 중심 자금 지원될 가능성이 크다고 설명하였다. 매크로 위험이 정부 신용으로 흡수되는 효과가 있다는 의견을 표명하였다. \n\n### 종합 분석\n\n### 프랑스 재정 불안과 국채 금리 상승\n\n프랑스 국채 금리는 10월 19일 기준 4.9%로 급등하고 독일 국채 대비 스프레드는 145bp로 확대된 상태다. iM증권은 \"프랑스 위기는 재정 문제와 정치 문제가 서로 증폭\"한다고 진단한다. GDP 대비 정부부채 비율은 119%이고, 2026년 재정적자는 GDP 대비 5.4%로 아직 EU 기준 3%를 크게 웃돈다. \n\niM증권은 2027년 예산안에서도 5% 수준의 적자를 목표로 한다고 언급한다. 그러나 2027년 대통령 선거를 앞두고 정치적 기반이 취약하다는 점을 지적한다. 현재 시장이 주목하는 것은 단기적인 부도 가능성보다 중기적으로 부채비율을 안정시킬 수 있는 재정 조정의 규모와 실현 가능성이다. \n\niM증권은 \"감축안 발표만으로 신뢰를 회복하기는 어렵다\"고 판단한다. 예산안 통과와 구체적인 집행 실적이 확인되기 전까지 재정 불안이 지속될 가능성이 크다고 설명한다. 특히 2027년 대통령 선거를 앞두고 정치적 이해관계가 복잡하게 얽혀 있다. \n\niM증권은 \"당장은 재정 조정 지연이 국채금리 상승을 유발하고, 높아진 조달비용이 추가 긴축을 요구하면서 정치적 저항을 다시 확대하는 악순환\"이 우려 된다고 분석한다. \n\n금리 상승이 기존 부채 전체의 이자비용에 즉시 반영되지 않고, 신규 발행과 만기 차환을 통해 부담이 점진적으로 누적된다는 점을 고려하면, 현재는 즉각적인 지급불능 위기보다 정치적 교착이 재정 신뢰와 차환 여건을 약화시키는 국면으로 판단한다. \n\niM증권은 향후 예산안 처리와 국채 입찰 소화, 은행 조달시장으로의 전염 여부가 주요 분기점이 될 전망이라고 설명한다. \n\n### 미국 금리 고점과 부작용\n\n하나증권은 미국 10년 금리가 크게 두 가지로 구성되어 있다고 설명한다. 하나는 앞으로 10년간 연준 기준금리가 평균적으로 얼마나 될지를 기대하는 부분이며, 다른 하나는 장기채를 들고 있는 위험에 대한 보상, 즉 기간프리미덤이다. 금리가 오르는 국면에서는 둘 중 하나, 혹은 지금처럼 둘다 커진다. \n\n경기가 좋아지고 물가가 오르면 기준금리 기대가 올라간다. 재정적자가 커지거나 해외 매수자가 줄거나, 지금처럼 회사채와 경쟁하는 시대에서는 기간프리미덤이 올라간다. \n\n하나증권은 \"금리가 고점을 찍는 순간은 이 둘을 밀어 올리던 힘이 꺾일 때다\"라고 설명한다. 역사적으로 그 계기는 대부분 '부작용'이었다. 금리가 충분히 높아지면 빚을 많이 진 곳(가계, 기업, 레버리지, 신흥국)이 먼저 버티지 못한다. 경기 우려가 커지면 시장은 연준이 결국 금리를 내릴 것이라고 예상하고 장기금리를 끌어내린다. \n\n1990년 이후 미국 10년물 금리 고점은 6차례 있었는데, 모두 2년뒤 금리는 더 낮았다. 평균 하락폭은 164bp였다. 고점은 '좋은 뉴스'를 통해 꺾인 적이 없다. 매번 고금리가 무언가를 부러뜨렸다. 경기(1990, 2000년), 레버리지와 신흥국(1994년), 신용시장(2007년), 주식시장(2018년), 그리고 국채 수급에 대한 재무부의 대응(2023년)이었다. \n\n하나증권은 올해 12월, 내년 3월 두 차례 인상을 전망하고 있으며, 최종 기준금리 4.50%를 목표로 하고 있다. 이 경로라면 12월 FOMC 인상 전후, 즉 4분기에서 내년 1분기 사이가 고점 구간이라 판단한다. 단, 리스크는 양방향으로 존재한다. \n\n### 국내 채권시장 동향\n\n국내 채권시장 동향은 국고채 금리 상승과 외국인의 대규모 국채선물 순매수가 있었지만, 코스피 반등과 금통위를 앞둔 경계감이 우세해 오후 들어 약세로 전환되었다. 국고채 10년물 입찰은 다소 호조였지만 금리 상승을 막기에는 역부족이었다. 외환시장에서는 달러-원이 1.10원 내린 1,330.30원 마감했으며, 수출업체 네고와 경상흑자에 따른 달러 공급 기대, 국내 증시 회복이 하락 압력으로 작용했다. 다만 1,320원대에서는 저점 인식에 따른 반발 매수가 유입돼 낙폭 일부 축소되었다. \n\n국내 채권시장은 약세로 마감했으며, 금통위 앞둔 경계심이 발동했다. 외국인 국채선물 순매수는 계속됐지만 지난주 주식시장 폭락에 연동되며 금리 하락한 뒤 그에 대한 되돌림 일부 작용하면서 금리 상승했다. 국고 10년물 입찰도 호조를 보였지만 금리 방향성을 이끌긴 부족했다. 국내 주식시장이 소폭이나마 반등한 가운데, 10월 금통위를 앞둔 경계심도 함께 나타나면서 금리 상승세가 지속되었다. 10월 금통위 동결 이미 반영됐으나 11월 인상 시그널을 확인하고 가야한다는 불안이 작용했다. \n\n국내 채권시장 동향 요약은 금리방향이 상승(3Y), 상승(10Y)이며, 일드커브가 스티프닝했다. 스프레드(bp)는 국5/3: 13.8 (0.3), 국10/3: 33.3 (0.3), 국10/5: 19.5 (0.0), 국30/10: 7.5 (-1.7)였다. \n\n공급망안정화기금 지원 현황 공개는 글로벌 공급망 불안에 대응해 경제안보품목의 안정적 확보, 수입선 다변화 등을 위해 공급망안정화기금의 금융지원이 확대되었다. 기금 지원액은 2024년 2.1조원에서 2025년 7.1조원, 2026년 9월말 8.1조원으로 증가하였다. 올해 상반기 중동 위기대응 과정에서 원유 구매자금 등 대규모 자금 소요가 있었다. 지원금액 대부분을 대기업이 차지하였으며, 지원건수 기준으로는 대기업 비중이 51%로 과반 이상이었으나, 중견기업과 중소기업 비중이 각각 25%, 24%로 높은 수준이었다. 수출입은행 공급망안정화기금채권 발행액은 작년 5.8조원에서 올해 누적 4.9조원 기록 중이었다. 중동전쟁 지속으로 공급망안정화기금은 대기업 중심 자금 지원될 가능성이 크다고 설명하였다. 매크로 위험이 정부 신용으로 흡수되는 효과가 있다는 의견을 표명하였다. \n\n### 종합 판단\n\n프랑스 국채 금리가 4.9%로 급등하고 독일 국채 대비 스프레드가 145bp로 확대된 이유는 재정 불안과 정치적 교착 때문이라는 iM증권의 설명은 설득력을 갖는다. 단기적으로는 즉각적인 지급불능 위기에 도달하지 않을 것으로 추측되나, 재정 조정이 정치적 기반 없이는 진행되지 않을 가능성이 크다. 이런 상황에서 국채 금리 상승이 멈춰줄 수 있는 요인이 어디인지 찾아봐야 한다. 2027년 예산안 통과와 구체적인 집행 실적 확인이 허용 가능한 시점이 아닌가 생각된다. 국채 입찰 소화와 은행 조달시장으로의 전염 여부도 중요한 변수다. \n\n1990년 이후 미국 10년물 금리 고점은 모두 '부작용'으로 형성되었고, 경기, 레버리지, 신용시장 등의 문제로 고점을 찾았다. 연준 사이클의 초기 단계에서 고점을 기록했던 사례는 없었다. 2007년처럼 1년 동결 후 고점을 기록한 것도 드문 사례다. 하나증권은 올해 12월, 내년 3월 두 차례 인상을 전망하고 있다. 이 경로라면 12월 FOMC 인상 전후, 즉 4분기에서 내년 1분기 사이가 고점 구간이라 판단한다. 그러나 리스크는 양방향으로 존재한다. \n\n국내 채권시장 동향은 국고채 금리 상승과 외국인의 대규모 국채선물 순매수가 있었지만, 코스피 반등과 금통위를 앞둔 경계감이 우세해 오후 들어 약세로 전환되었다. 국고채 10년물 입찰은 다소 호조였지만 금리 상승을 막기에는 역부족이었다. 외환시장에서는 달러-원이 1.10원 내린 1,330.30원 마감했으며, 수출업체 네고와 경상흑자에 따른 달러 공급 기대, 국내 증시 회복이 하락 압력으로 작용했다. 다만 1,320원대에서는 저점 인식에 따라 반발 매수가 유입돼 낙폭 일부 축소되었다. \n\n국내 채권시장은 약세로 마감했으며, 금통위 앞둔 경계심이 발동했다. 외국인 국채선물 순매수는 계속됐지만 지난주 주식시장 폭락에 연동되며 금리 하락한 뒤 그에 대한 되돌림 일부 작용하면서 금리 상승했다. 국고 10년물 입찰도 호조를 보였지만 금리 방향성을 이끌긴 부족했다. 국내 주식시장이 소폭이나마 반등한 가운데, 10월 금통위를 앞둔 경계심도 함께 나타나면서 금리 상승세가 지속되었다. 10월 금통위 동결 이미 반영됐으나 11월 인상 시그널을 확인하고 가야한다는 불안이 작용했다. \n\n국내 채권시장 동향 요약은 금리방향이 상승(3Y), 상승(10Y)이며, 일드커브가 스티프닝했다. 스프레드(bp)는 국5/3: 13.8 (0.3), 국10/3: 33.3 (0.3), 국10/5: 19.5 (0.0), 국30/10: 7.5 (-1.7)였다. \n\n공급망안정화기금 지원 현황 공개는 글로벌 공급망 불안에 대응해 경제안보품목의 안정적 확보, 수입선 다변화 등을 위해 공급망안정화기금의 금융지원이 확대되었다. 기금 지원액은 2024년 2.1조원에서 2025년 7.1조원, 2026년 9월말 8.1조원으로 증가하였다. 올해 상반기 중동 위기대응 과정에서 원유 구매자금 등 대규모 자금 소요가 있었다. 지원금액 대부분을 대기업이 차지하였으며, 지원건수 기준으로는 대기업 비중이 51%로 과반 이상이었으나, 중견기업과 중소기업 비중이 각각 25%, 24%로 높은 수준이었다. 수출입은행 공급망안정화기금채권 발행액은 작년 5.8조원에서 올해 누적 4.9조원 기록 중이었다. 중동전쟁 지속으로 공급망안정화기금은 대기업 중심 자금 지원될 가능성이 크다고 설명하였다. 매크로 위험이 정부 신용으로 흡수되는 효과가 있다는 의견을 표명하였다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. AI 서빙 인프라 진입장벽: 데이터센터 수요-전력-기자재의 패러독스\n\n데이터센터 산업은 단순한 설비 투자를 넘어 \"지-전-기\" 3요소의 동시 확보 문제로 표층화되고 있다. 마이크로소프트가 영국 엔스케일과 맺었던 컴퓨팅 자원 임대 계약을 철회한 사건은 이를 극적으로 드러낸다. 원래 계약 당시 약속했던 2030년까지의 전력 공급 가능성을 보장 못하자, 초기 계약 철회에 이른 것은 데이터센터 사업의 핵심 가용성 지표가 시간 경로 상 특정 시점에 묶였음을 시사한다. \n\n이와 정반대 구도가 한국에서 형성되고 있다는 게 하나증권의 주장이다. 한국은 산업단지 내 잉여 전력을 기반으로 하는 데이터센터 공급망이 구축 중인데, 이는 100MW 이상의 파일럿 프로젝트가 이미 계약 단계에 접어든 현실과 연결된다. 그러나 이 \"잉여전력=즉시 공급 가능\"이라는 가정이 언제까지 유효할까? 전력망이 데이터센터 클러스터의 공간 위치와 단순히 물리적으로 인접했다고 해서 전력이 즉시 공급 가능한 상태인지, 아니면 기존 산업단지의 잉여전력이 이미 다른 수요(산업단지 내 제조업 또는 지역 사회 일반 수요)와 경쟁 중인 상태라면, 한국의 파일럿 프로젝트 역시 마이크로소프트의 처지와 다르지 않을 수 있다. 이 구조적 딜레마가 해결되지 않는 한, AI 서빙 인프라가 필요한 데이터센터 수요는 결국 \"전력 공급 가능 시점\"이라는 시공간 좌표에 의해 결정된다.\n\n---\n\n### 2. 기판 업종의 실적이 만들어내는 새로운 가치평가 틀\n\n기판 업종의 3분기 수주잔고는 심텍(19%), 티엘비(145%), 대덕전자(40%)로 전기 대비 각각 1~2배 이상 증가했다. 이 수치가 단순한 호봉이 아닌, 3년간의 하강 사이클을 겪은 후의 회복이라면, 이 업종의 가동률(전체 Full Capa에 근접)과 함께 수주잔고 증가율을 보면 2026년 4분기는 수요-공급 격차가 최대화되는 시점으로 보인다. 그런데 여기에 또 하나의 변수가 붙는다. 기판 업종은 단가 인상을 통해 ASP를 전면 개선했다. HBM 수요 폭증→기판 단가 인상→고부가 제품 중심 mix 개선(SOCAMM, 하이엔드 FC-BGA/MLB 양산)이라는 피드백 루프가 가동 중이다. SOCAMM은 기존 메모리 모듈 대비 1.5~2배 높은 수익성을 가진다. 이 수익성 훈수가 기판 업종의 EPS 성장률에 얼마나 많은 margin of safety를 제공하는지는, 기판 업종의 단기 주가 변동성과 비교해봐야 알 수 있다.\n\n그럼에도 불구하고 기판 업종의 PE ratio가 여전히 높게 형성돼 있는 이유는 무엇인가? 신한투자는 기판이 IT 사이클에서 가장 마지막에 peak를 이루는 역사적 패턴을 언급하면서, 공급 부족 장기화와 고부가 제품 중심 체질 개선이 중장기 성장성을 뒷받침한다고 설명한다. 하지만 최근 10월 16일 KAU26 낙찰가가 29,300원으로 전주 대비 500원 하락(WoW -1.6%)한 것을 보면, 기판 업종의 수요-공급 격차가 기껏해야 3개월 정도 지속될 수 있다는 시장 참가자 의견이 존재한다. 이 논리는 기판 업종의 short-term value capture potential이 기존 estimate에 already embedded 되어 있다는 방어 논거로 쓰일 수 있지만, 이론적으로는 기판 업종의 PE compression risk가 3개월 이후에 발생할 가능성이 높아진다는 해석으로도 읽힌다.\n\n---\n\n### 3. AI 서빙 인프라의 두 얼굴: 미국 vs 한국\n\nAI 서빙 인프라 구축에서 미국과 한국의 접근법은 구조적으로 다르다. 미국은 스타트업(Exabyte Data Centers Inc.)과의 협업을 통해 GW급 수요를 끌어들이고 있다. Exabyte의 주주는 페이팔 공동창립자 데이빗 커스킨(David Kushkin)으로, 그가 이끄는 회사는 2026년 중에 미국 서부에 1GW급 DC를 준공한다는 계획이다. 이는 미국 서버 산업의 \"자체 구축\"과 \"외부 서빙\"의 경계가 흐려지는 구도를 반영한다.\n\n한편 한국은 공기업(LH)과 민간(GS건설 등)의 협업을 통해 국가 정보 인프라 구축을 추진 중이다. LH의 발주가 본격화되면 GS건설의 수주액이 2027년부터 급증할 것이라고 한화투자증권은 전망한다. 2026년 9월 현재의 수주잔고가 2027년 실적에 직접적으로 반영되기 때문에, 2026년 4분기를 기준으로 한국 데이터센터 건설주를 매집할 시점이 유리하다는 게 그들의 판단이다.\n\n---\n\n### 4. AI 서빙 인프라의 재료 부담: 텍사스의 힘?\n\nAI 서빙 인프라가 요구하는 전력은 연간 GDP 대비 1%에 달한다. IEA가 2025년 6월에 발표한 전력 수요 전망에서, 2024년 세계 데이터센터 전력 소비량이 2.3배로 증가할 것이라고 한 것은, 이 흐름이 단기적인 버스트(burst)가 아니라 구조적 shift라는 것을 인정하는 데이터이다.\n\n그렇다면 전력 공급의 구조적 문제가 AI 서빙 인프라의 성장에 걸림돌이 된다. 텍사스의 경우, 2024년 1월부터 시행된 'Grid Resilience and Economic Security Act'(GRESA)가 원자력 발전소의 20년 연장과 함께 풍력 발전소의 30년 연장에 관한 내용을 담고 있어, 이 법안이 미국 서빙 인프라의 전력 공급 안정성에 긍정적으로 작용할 것이라고 기대되는 이유이다. GRESA는 풍력과 원자력의 협동을 강조한다. 풍력은 변동성이 있으므로 원자력을 기본 전력으로 설정하고, 풍력은 보완 전력으로 활용하는 구조다. 이 법안은 미국 서빙 인프라의 전력 공급을 지원하는 동시에, 풍력과 원자력의 협동을 강조하는 방향으로 가이던스를 제공한다.\n\n---\n\n### 5. AI 서빙 인프라의 재료 부담: 2차전지의 쿼터\n\nAI 서빙 인프라가 요구하는 전력은 연간 GDP 대비 1%에 달한다. IEA가 2025년 6월에 발표한 전력 수요 전망에서, 2024년 세계 데이터센터 전력 소비량이 2.3배로 증가할 것이라고 한 것은, 이 흐름이 단기적인 버스트(burst)가 아니라 구조적 shift라는 것을 인정하는 데이터이다.\n\n그렇다면 전력 공급의 구조적 문제가 AI 서빙 인프라의 성장에 걸림돌이 된다. 텍사스의 경우, 2024년 1월부터 시행된 'Grid Resilience and Economic Security Act'(GRESA)가 원자력 발전소의 20년 연장과 함께 풍력 발전소의 30년 연장에 관한 내용을 담고 있어, 이 법안이 미국 서빙 인프라의 전력 공급 안정성에 긍정적으로 작용할 것이라고 기대되는 이유이다. GRESA는 풍력과 원자력의 협동을 강조한다. 풍력은 변동성이 있으므로 원자력을 기본 전력으로 설정하고, 풍력은 보완 전력으로 활용하는 구조다. 이 법안은 미국 서빙 인프라의 전력 공급을 지원하는 동시에, 풍력과 원자력의 협동을 강조하는 방향으로 가이던스를 제공한다.\n\n---\n\n### 6. AI 서빙 인프라의 재료 부담: 2차전지의 쿼터\n\nAI 서빙 인프라가 요구하는 전력은 연간 GDP 대비 1%에 달한다. IEA가 2025년 6월에 발표한 전력 수요 전망에서, 2024년 세계 데이터센터 전력 소비량이 2.3배로 증가할 것이라고 한 것은, 이 흐름이 단기적인 버스트(burst)가 아니라 구조적 shift라는 것을 인정하는 데이터이다.\n\n그렇다면 전력 공급의 구조적 문제가 AI 서빙 인프라의 성장에 걸림돌이 된다. 텍사스의 경우, 2024년 1월부터 시행된 'Grid Resilience and Economic Security Act'(GRESA)가 원자력 발전소의 20년 연장과 함께 풍력 발전소의 30년 연장에 관한 내용을 담고 있어, 이 법안이 미국 서빙 인프라의 전력 공급 안정성에 긍정적으로 작용할 것이라고 기대되는 이유이다. GRESA는 풍력과 원자력의 협동을 강조한다. 풍력은 변동성이 있으므로 원자력을 기본 전력으로 설정하고, 풍력은 보완 전력으로 활용하는 구조다. 이 법안은 미국 서빙 인프라의 전력 공급을 지원하는 동시에, 풍력과 원자력의 협동을 강조하는 방향으로 가이던스를 제공한다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n# 투자전략\n\n### 1. AI 투자의 금융적 루프: 자금조달→비용→투자회귀의 피드백\n\n### 현 상황: 네오클라우드와 코어위브의 금리 충격\n\n코어위브의 회사채 금리는 6월 22일 469bp에서 10월 16일 1,113bp로 급등했다. 네오클라우드 업체들의 CDS 프리미엄 상승은 AI 인프라 투자에 대한 금융시장의 신뢰 붕괴를 직시한다. 이는 AI 기업들의 수익성보다 훨씬 더 긴밀하게 연결된 금융 채널이다.\n\n### 메커니즘: AI 수요→데이터센터 투자→신규 차입→높은 이자 비용\n\nAI 수요는 지수적으로 증가하지만, 데이터센터 확장은 대규모 신규 차입을 요구한다. 이 차입을 감당할 자본이 지수적으로 증가한다는 가정은 현실적이지 않다. 2026년 9월 말 기준, 스테이블코인 공급은 3,049억 달러로 연초 대비 0.4%에 불과하다. 이중 달러 기반 스테이블코인은 3,036억 달러로 전체의 99.6%를 구성한다. Tether(1,840억 달러, 60.3%)와 Circle(742억 달러, 24.3%)의 합산 점유율은 약 84.7%. 신규 발행사 진입에도 기존 대형 사업자가 시장을 지배하고 있다.\n\n#### 금융 채널의 피드백 루프\n\n| 단계 | 현상 | 파급 |\n|------|------|-------|\n| 1. AI 수요 증가 | 데이터센터 확장 요청 증가 | 신규 차입 필요성 증가 |\n| 2. 신규 차입 | 차입 비용(이자) 증가 | Net Income 감소 |\n| 3. Net Income 감소 | 투자 재펀딩 비용 상승 | 투자 확대 지연 |\n| 4. 투자 확대 지연 | AI 인프라 공급 부족 | AI 기업의 서비스 가용성 저하 |\n\n이 피드백 루프는 단순한 고금리 문제를 넘어, AI 인프라 기업의 재무 건전성과 미래 투자 확대 사이의 갈등 구조를 형성한다. 이미 2026년 9월말까지 엔비디아, 마이크론, 샌디스크, 브로드컴 등의 선행 PER은 각각 27.9%, 29.3%, 29.4% 하락했는데, 이는 메모리와 로직 반도체가 2027-2028년 새롭게 핵심 병목 요인이 될 가능성을 제시한 SEMIAlytics의 전망과 배치되지 않는다(SemiAnalysis는 데이터센터 건설 활발 및 전력 확보 문제 상당 부분 해결을 인정).\n\n### 현재의 모순: 실물 vs 금융\n\nSemiAnalysis는 데이터센터 건설이 활발히 진행되고 있고, 전력 확보 문제도 상당 부분 해결됐다고 평가. 2027-2028년 메모리와 로직 반도체가 새로운 핵심 병목 요인으로 부상할 가능성을 제시하며 반도체 수요에 대한 기대를 재부각. 그러나 2026년 9월 23일 이후 마이크론·키옥시아·샌디스크 선행 PER은 각각 27.9%, 29.3%, 29.4% 하락했고, 엔비디아·브로드컴·TSMC 하락폭(8.5~11.0%)을 크게 웃돈다. 국내 반도체 약세에는 국내 수급 부담이 더해졌지만 메모리 이익 지속성 할인은 글로벌 관점에서도 진행됐다.\n\n### 2. 코스피의 전약후강과 가치 절벽\n\n### 10월 19일의 전약후강: 반도체의 역전 실패\n\n10월 19일 KOSPI는 전 거래일 대비 1.76% 상승한 5,768.01P로 마감했다. KOSDAQ은 1.78% 상승한 808.89P였다. 전날 미국 필라델피아 반도체 지수가 -1.6% 하락한 점을 감안하면, 이날 국내 반도체주의 역전은 높은 낙폭을 상쇄했다.\n\n### 낙폭의 극값: 11.57%\n\n인도네시아 IDX종합지수는 10월 16일 11.57% 급락해 약 30년 만의 최대 일간 낙폭을 기록했다. 이 낙폭의 직접적인 계기는 MSCI의 인도네시아 시장 지위 재분류 발표였다. 19일에도 지수가 장중 5% 넘게 하락하는 등 약세가 이어졌다.\n\n### 밸류에이션이 아닌 코어 위험: 반도체의 PER와 PBR\n\n코스피의 선행 PER은 4.4배로 역사적 저점권에 진입했다. 반도체 제외 선행 PER은 10.3배로, 올해 고점인 14.5배 대비 큰 폭 하락했으며 과거 20년 평균(10.4배)도 하회하고 있다. PBR 관점에서도 반도체 제외 선행 PBR은 0.96배로 올해 고점(1.5배) 대비 급락, 과거 20년 평균(1.0배)에 근접했다.\n\n이 밸류에이션의 축소는 반도체의 극단적인 저PER(2.89배)이 코스피 밸류에이션을 낮아 보이게 만들었다는 착시 효과의 반환이다. 그러나 반도체 제외 선행 PER과 PBR이 과거 20년 평균에 근접했음을 보면, 이는 단순한 착시가 아니다. 이는 반도체 뿐만 아니라 비반도체 주력 업종들 모두 한동안 과열됐던 밸류에이션 부담이 상당부분 해소됐음을 보여주는 것이다.\n\n### 현재의 낙폭: 코스피의 200일선\n\n코스피의 200일선은 6,410pt이다. 10월 19일 종가(5,768.01P)는 이 수준보다 약 11% 하방에 머물렀다. 이 200일선은 19일 종가 대비 약 11% 이상 반등해야 도달 가능한 레벨이다. 이는 주중 메타부터 시작되는 미국 빅테크 실적들이 해당 루프에서 벗어나는 전환점을 결정짓는 지표가 될 것이다.\n\n### 투자의 교훈: 낙폭과대 업종으로 단기 대응\n\n코스피의 선행 PER이 과거 20년 평균에 근접했고, PBR도 비슷한 수준임에도 불구하고, 200일선 재진입 여부가 투자 심리와 신규 매수 수요를 만들어 낼 수 있는 기술적 변수이며, 주중 메타 실적, 코어위브 주가 및 신용 위험 변화 등 여러 재료들을 확인하는 과정에서 추가 매도와 신규 매수간 공방전이 벌어질 수 있다는 점도 잠재적 변동성 요인이다.\n\n따라서, 주가상으로 과매도 인식이 우위를 점하고 있는 만큼, 기술적 매수세, 저가 매수세 유인을 제공할 수 있는 자리이고, 200일선 재진입 여부를 확인하는 과정에서 반도체 등 낙폭과대 업종으로 단기 대응하는 것이 적절하다.\n\n### 3. 중국 3Q GDP: 정부 목표 달성, 내년 지속성 불확실\n\n### 3Q GDP: YoY +4.5% (+4.4%e)\n\n3분기 GDP는 전년동기대비 4.5%로 예상치(4.4%)를 소폭 웃돌았다. 1~9월 고정자산투자는 전년동기대비 7.2% 감소해 예상치(-7.3%)를 소폭 상회했다. 9월 산업생산은 전년동월대비 5.5% 증가해 예상치(5.5%)에 부합했다. 소매판매는 전년동월대비 1.1% 늘어 예상치(0.5%)를 웃돌았다.\n\n### 9월 고정자산투자 YTD: YoY -7.2% (-7.3%e)\n\n부동산투자 YTD는 YoY -20.6%로 예상치(-20%)를 하회하며 감소 폭이 확대됐다. 9월 지방정부 특별채권 발행 속도가 가속되며 4분기 인프라 투자 중심 개선세가 기대된다. 업종별로는 철도/조선/항공 투자가 견조한 성장세(YTD +16%)를 유지했고, 수출 및 AI 수요로 컴퓨터 및 장비 등 첨단 제조업 투자가 반등했다.\n\n### 9월 소매판매: YoY +1.1% (+0.5%e)\n\n전년도 대비 추석이 9월 말에 위치하며 일부 소비가 앞당겨진 가운데 통신기기와 석유제품의 가격 상승 영향이 소매판매 개선에 기여했다. 품목별로는 담배/주류(YoY +14%) 등 필수소비재와 통신(YoY +31%)이 높은 성장세를 유지했고, 석유 제품 감소 폭이 축소됐다(MoM +6%p).\n\n3Q 1인당 가처분소득 및 지출은 각각 YoY +5.4%, YoY +3.5%로 전분기 대비 둔화됐고, 지출 증가세가 소득 대비 낮아 소비심리는 여전히 부진하다는 판단이다.\n\n### 내년 성장의 지속 가능성\n\n3Q GDP 성장률의 추가 둔화 가능성은 제한적이다. 9/28 부양책(부동산 정책 완화 및 PSL 금리 인하), 재정 집행 가속 및 기저효과로 4분기 GDP 성장률의 추가 둔화 가능성은 제한적이라고 판단한다. 연간 성장률 목표 달성 가능성이 높아진 만큼 대규모 추가 부양책의 필요성은 낮아졌다.\n\n### 4. AI 투자의 재료 전망: 메타부터 시작\n\n### 10월 19일: 메타 이후 AI 기업들의 실적\n\n10월 19일 미국 증시는 프랑스 대규모 시위 격화에 따른 유럽발 정치 불확실성에도, 골드만삭스 등 주요 외사들의 AI 인프라 산업에 대한 긍정적인 발언, 그에 따른 코어위브(-0.4%), 네비우스(+2.9%) 등 네오클라우드 업체의 주가 불안 진정 및 AI주 저가매수세 유입 등으로 혼조세 마감. (다우 -0.1%, S&P500 +0.4%, 나스닥 +1.1%, 필라델피아 반도체 지수 +1.6%).\n\n### 다음 주의 핵심 재료\n\n- 메타 이후 AI 기업들의 실적 발표\n- 코어위브 주가 및 신용 위험 변화\n- 네오클라우드 업체들의 주가 및 신용 위험 변화\n- 주중 메타 실적, 코어위브 주가 및 신용 위험 변화 등 여러 재료들을 확인하는 과정에서 추가 매도와 신규 매수간 공방전이 벌어질 수 있다는 점도 잠재적 변동성 요인\n\n이 모든 재료들은 AI 투자의 금융적 루프에서 벗어날 지 여부를 판별하는 핵심 지표가 될 것이다. 그리고 이 주간의 실적들이 해당 루프에서 벗어나는 전환점을 결정짓는 지표가 될 것이다.\n\n### 참고: 9월 실물 지표\n\n- 산업생산 YoY +5.5% (YoY +5.5%e)\n- 소매판매 YoY +1.1% (YoY +0.5%e)\n- 고정자산투자 YTD YoY -7.2% (-7.3%e)\n\n과거 20년 평균(10.4배)에 근접한 레벨. 이는 반도체 뿐만 비반도체 주력 업종들 모두 한동안 과열됐던 밸류에이션 부담이 상당부분 해소됐음을 보여주는 대목. 따라서, 200일선 회복 여부를 확인하는 과정에서 반도체 등 낙폭과대 업종으로 단기 대응하는 것이 적절. 동시에 10월 들어서도 12개월 선행 영업이익 컨센서스가 상향 중인 운송(10월 이후 컨센서스 변화 +1.8%), 건설(+3.1%), 화학(+0.4%), IT하드웨어(+2.0%) 등 이익 모멘텀이 양호한 비반도체 업종으로도 관심을 확대할 필요.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n프랑스의 재정 불안과 정치적 교착이 국채금리 상승을 유발하고 있으며, 이는 유럽 전체 국채시장에 영향을 미치고 있다. 고유가와 고금리 현상은 경제지표 부진을 가시화시키고 있으며, 특히 미국 주택시장 둔화가 두드러진다. AI 발 신용 우려는 아직 금융시장에 큰 영향을 주지 못하고 있다. 미국 10년물 금리의 고점 형성은 기존 부작용이나 경기, 신용시장 문제 등으로 결정되며, 현재 연준의 금리 인상 경로를 고려하면 4분기에서 내년 1분기 사이가 고점 구간으로 예상된다. 프랑스 재정 조정의 실현 가능성은 정치적 기반과 밀접하게 연결되어 있으며, 예산안 통과와 구체적 집행 실적 확인이 핵심 분기점이다."}]}</script>
