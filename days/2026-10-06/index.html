<script id="__DATA__" type="application/json">{"date": "2026-10-06", "headline": "① 미국 고용: 숫자는 둔화인데, 경기 둔화로 읽기에는 타이밍 문제", "market": {"KOSPI": {"label": "코스피", "value": 6941.39, "change": -0.89, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 919.92, "change": 2.98, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1340.0, "change": -0.19, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 89.86, "change": 0.47, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4194.4, "change": 0.17, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.286, "change": -2.53, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.373, "change": -1.3, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51521.28, "change": 0.49, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7818.93, "change": 0.58, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27599.79, "change": 0.45, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스닥** 상승 +2.98% (현재 919.92, 전일 893.29, 임계값 2.0% 초과)\n\n### 관련 뉴스\n", "tabs": [{"title": "코스닥 상승 +2.98%", "md": "## 코스닥 상승 +2.98%\n\n**AI·보안주 강세 + 나스닥 신고가 + 2차전지·반도체 수급**\n\n- 미국 나스닥이 신고가를 기록한 가운데, 코스닥 내 AI·보안 관련주와 2차전지·반도체 종목이 강세를 보이며 코스닥이 3개월 최고치(919.92)로 마감. 반면 외국인 대규모 순매도로 코스피는 7,000선 아래로 하락 — **조선일보·매일경제·아시아경제** 등 14개 언론사 보도\n- HLB 주가 21% 이상 급등, 주성엔지니어링도 17% 상승해 코스닥 시총 2위로 부상 — **서울신문·이투데이** 보도\n- 미국 국채금리 상승 부담으로 외국인이 코스피를 집중 매도한 반면, 기관·외국인이 코스닥은 순매수 — **세계일보·한국경제TV** 보도\n\n---\n"}, {"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### ① 미국 고용: 숫자는 둔화인데, 경기 둔화로 읽기에는 타이밍 문제\n\n9월 비농가 신규고용은 2.9만 명으로 시장 예상치(+8.4만 명)를 크게 하회했고, 7월과 8월 수치도 합산 6만 명씩 하향 조정됐다(7월은 1만 명 감소로 전환). 시간당 평균임금은 전월대비 0.1% 상승에 머물렀는데, 이는 금융(-0.1%), 유틸리티(-0.3%) 등의 일부 고임금 서비스업 임금 상승세가 약해진 것이다. 실업률은 4.2%로 0.1%p 올랐고, 경제활동참가율은 0.2%p 상승해 노동공급이 확대되었음을 시사한다. 경제활동인구는 48.5만 명 증가했지만, 비경제활동인구는 34.6만 명 감소했다.\n\n그럼에도 불구하고, 3개월 평균 고용 증가액은 월평균 약 5만 명 수준을 유지하고 있어 단기간의 부진으로 노동시장의 균형 범위를 벗어났다고 보기 어렵다. 게다가 세인트루이스 연은은 2026년 미국 노동시장의 손익분기 고용을 월 1만5천 명에서 8만 7천 명 수준으로 상향 조정했는데, 이는 현재의 고용 증가세가 여전히 균형 범위 내에 있다고 판단하는 근거다. 임금 상승률이 둔화되고 있다는 사실 역시, 과열됐던 노동시장이 점차 균형 상태로 이동하는 과정이라는 것을 의미한다.\n\n즉, 9월 고용 부진은 단순한 둔화보다는 과잉했던 노동시장이 균형으로 수렴하는 과정에서 발생한 일시적 조정에 해당한다. 고용은 여전히 플러스를 유지하고 있으므로, 노동시장이 이미 침체 국면에 진입했다고 단정하기에는 시기를 넘겼다(Kiwoom).\n\n---\n\n### ② 인플레이션: 노동시장 vs 기업 비용 – 두 가지 다른 방향\n\n9월 고용 부진으로 10월 FOMC에서의 추가 금리 인상 가능성이 낮아져야 한다는 주장은 타당하다. 하지만 인플레이션이 완전히 해결된 것은 아니다.\n\n먼저, 노동시장 측면에서 임금 압력이 완화되고 있다는 점은 분명하다. 팬데믹 초기 노동공급 부족과 높은 임금 상승률이 맞물렸던 서비스 물가 상승 압력을 완화시키는 방향으로 흐르고 있다. 이는 연준의 추가 긴축 필요성을 낮추는 직접적인 요인이다. 때문에 10월 추가 인상은 이전보다 가능성 자체가 줄었다.\n\n반면, 기업 비용 측면에서는 물가 상방 리스크가 완전히 해소되지 않았다. ISM 제조업·서비스업 지수 내 지불가격지수가 다시 오름세를 보이는 것은, 원자재·에너지·운송비 등 입력비용 상승이 지속되고 있음을 의미한다. 이 비용 상승이 기업들이 최종 판매가격에 전가되면, 물가 압력은 다시 살아날 수밖에 없다. 따라서 12월 추가 인상 가능성이 다시 부활할 수 있는 구멍이 열려 있다.\n\n결론적으로, 9월 고용 부진은 10월 금리 인상 전망을 낮췄지만, 기업 비용 압력이 지속되기 때문에 연준의 매파적 기조가 쉽게 약화되지 않는다. 10월은 일단 추가 인상이 없겠지만, 12월에는 9월과 10월의 물가·노동지표가 결합해 또다시 추가 인상 논란이 부활할 수도 있다(Kiwoom).\n\n---\n\n### ③ AI 투자의 총량 견인과 내부 양극화: K자형 경기가 본격화되는 배경\n\nKiwoom의 핵심 주장은 다음과 같다:\n\n> 미국 경제는 침체보다는 총량 성장 속에서 내부 양극화가 심화되는 K자형 경기에 가까워지고 있다.\n\n이 논리는 다음과 같이 구성된다.\n\n#### a) 고금리의 선택적 부담: 취약 → 안정의 이중 구조\n\n고금리가 모든 산업과 계층에게 동일한 부담으로 작용한다고 생각하면 큰 오류다. 대형 기술기업과 하이퍼스케일러는 높은 수익성과 현금 창출력 덕분에 데이터센터·반도체·전력 인프라 등에 대한 투자를 계속할 여력이 있다. 이런 투자는 관련 제조업→설비투자→건설·전력 인프라로 파급되어 고금리의 부정적 영향을 상쇄하는 방향으로 작용한다. 반면, 중소기업·저신용 차주는 금리 부담이 누적이 되는 구조다. 특히 차환 시점이 다가오거나 변동금리 비중이 높은 차주의 경우 부담이 보다 뚜렷하게 드러난다(iM).\n\n#### b) AI 투자의 명목 성장 모멘텀: 실질 성장보다 명목 GDP가 중요해지는 패러다임 변화\n\niM은 2027년 세계 경제가 “대(大) 차입 경제”와 “AI 경제”가 충돌하는 국면이라고 본다. 여기서 핵심은 **AI 투자가 기업 이익을 주도하면서, 명목 GDP 성장이 실질 성장보다 우선시되는 경제 패러다임 변화**다. AI 발 양극화의 단면이라 할 수는 있지만, 기업 이익이 가계 소득보다 빠르게 증가하는 상황이 전체 경제를 견인한다는 논리가 된다. 2027년 국내 성장률은 3.6%(2026년), 3.1%(2027년)로 iM이 예측했는데, 2026년 수출 호조가 2027년에도 반도체 수출로 이어지기 때문이다. 국내 경제도 매크로 지표보다 삼성전자·SK하이닉스 등 반도체 기업 실적 흐름이 경기 방향성을 더 잘 반영한다는 판단이다.\n\n#### c) 재정·통화 당국의 완충 가능성\n\n연준이 기준금리를 빠르게 낮춰줄 가능성은 낮다. 인플레이션에 대한 경계가 아직 남아 있기 때문이다. 다만, 금융불안이 확대될 경우 금리 인하와 별개로 유동성 수단을 통해 대응하겠다는 방향성은 명확하다. 재정 측면에서는 취약 계층·중소기업에 대한 선별적 지원 또는 신용보강 정책이 활용될 수 있다. 통화 측면에서는 유동성 공급·금융시장 안정 조치가 검토 항목이다(iM).\n\n---\n\n### ④ 달러: 제한적 약세의 조건 – AI 주도 성장이 금리 수준을 지탱하는 구조\n\n신한FXCheckup에 따르면, 9월 달러화지수는 101p 후반이었던 102p 선까지 상승했다. 달러 강세의 근거는 미국의 양호한 성장 기대였다. 반면, 8월 PCE 디플레이터는 통계 개편과 가계 측 수요 약화를 반영해 낮게 나왔고, 이것이 금리 인상 기대를 냉卻시켰다. 그런데도 장기 금리 상승이 있었는데, 이는 유가 반등이 장기물에 가중치를 준 결과다. 유가가 오르면 장기물에 편향된 지수(예컨대 TIPS)가 약세를 보이지 않는 이상, 장기 금리 상승은 달러 강세의 상당 부분을 상쇄하지 못하는 구조다.\n\n10월 이후 달러 약세 압력이 나타날 수 있는 조건은 다음 세 가지다:\n\n1. **미 연준과 주요국 중앙은행 간 기준금리 스프레드 축소**: 10월 FOMC에서 추가 인상 없이 금리 동결하거나 인하가 이루어진다면, 미국 기준금리가 다른 국가보다 높은 수준을 유지해야 한다는 조건이 깨진다. 이럴 경우 달러 강세 압력이 완화된다.\n2. **미국과 주요국 성장률 격차 축소**: 미국이 AI 투자 사이클을 독점해서 성장률이 다른 국가보다 높았다면, 달러 강세가 지속될 수 있다. 만약 미국의 성장 모멘텀이 다른 국가들과 비슷해지면 달러 약세 압력이 커진다.\n3. **미국의 원화 절상 요청**: 9월 한국 수출은 1,209억 달러로 사상 최대였고, 무역흑자는 498.5억 달러에 닿았다(GDP 대비 20% 내외). 미국의 원화 절상 요청이 강화되면 달러 약세 압력이 직간접적으로 커진다.\n\n이 세 가지 모두 달러 약세 조건이지만, 미국이 AI 투자와 기술 선행이라는 구조적 성장 모멘텀을 갖고 있다는 사실을 감안하면, 달러 약세는 \"제한적\"에 그칠 가능성이 높다. 즉, 달러가 102p에서 더 많이 오르지는 않겠지만, 급격한 하락도 쉽지 않은 구조다(SHINHANFX, Kiwoom).\n\n---\n\n### ⑤ 한국: 2027년 수출·공공투자·원화 절상 요청의 삼중 모멘텀\n\niM의 한국 2027년 경제 전망은 세 가지 축으로 요약된다.\n\n#### a) 반도체 수출의 지속: 2027년에도 국내 경기 사이클의 핵심 트랙터\n\n2026년 국내 경기는 3.6%로 양호했고, 2027년에도 3.1%로 성장이 유지된다. 이 기대는 2026년의 수출 호조가 2027년에도 반도체 수출로 이어진다는 전제에 기반한다. 한국 수출이 1,209억 달러라는 사상 최대를 기록하면서 무역흑자가 498.5억 달러에 닿았고, 이는 GDP 대비 20%에 육박한다. 반도체가 단일 품목 최초로 600억 달러를 넘어섰다는 사실은, 이 제품군이 한국 경제의 명목 GDP 성장에 가장 많은 비중을 차지하고 있음을 보여준다.\n\n#### b) 공공 건설 투자의 본격화: 2027년부터 성장 모멘텀으로 전환\n\n2027년 공공 건설 투자가 본격화되면, 2026년 수출 중심의 성장에서 공공 투자 중심의 성장으로 모멘텀이 전환될 수 있다. 이는 공급망·인프라·디지털 인프라 등에 걸쳐 지역 경제 활성화와 사회간접자본 확충으로 연결된다. 2026년 공공 투자 확대에 대한 논의가 시작되었다면, 2027년에 실제로 실행 가능한 예산이 편성될 가능성도 존재한다.\n\n#### c) 원화 강세 요인: 경상수지 흑자+미국의 원화 절상 요청\n\n원화는 두 가지 요인으로 강세 압력이 작용한다. 첫 번째는 경상수지 흑자가 GDP 대비 20% 수준을 유지하는 가운데, 미국의 원화 절상 요청이 강화된다는 점이다. 두 번째는 달러 약세가 국제 통화시장에서 형성되면서, 원화가 아시아 통화 전반의 방향성에 동조한다는 점이다. SHINHANFX에 따르면 9월 원/달러는 1,360원대로 상승했고, 이는 월말 네고 물량 소진에 따른 수급 공백과 달러 강세가 겹친 결과였다. 다만 1,360원대에서 수출 네고 물량 경계가 상단을 제한했다. 10월 달러 약세 조건이 일부 만들어질 경우 원화 상단을 좀 더 높게 만들 수 있는 환경이 마련된다(SHINHANFX, iM).\n\n---\n\n### ⑥ 한국 9월 소비자물가: 통신요금 할인 기저효과 소멸에도 핵심 물가 압력이 지속\n\nSHINHANEconCheckup에 따르면, 한국 9월 소비자물가는 전월대비 0.3%, 전년동월대비 2.9%로 8월(3.1%)보다 상승폭이 축소됐다. OECD 기준 핵심 소비자물가인 식료품·에너지 제외 지수는 전월대비 0.1% 하락했지만, 전년동월대비 2.8%로 8월(3.4%)보다는 낮아졌다. 2022년 8월에 시행된 통신요금 할인 효과가 소멸하면서 공공서비스 상승률이 6.5%에서 1.5%로 급락했다. 이는 지난 1년간 통신요금 인하가 물가 지표에 기여한 만큼, 기저효과가 제거된 것이지, 핵심 물가 압력 자체가 없는 것은 아니다.\n\n핵심 물가 압력이 여전히 지속되는 근거는 두 가지다. 먼저, 외식 제외 서비스가 상승폭이 확대되고 있다는 것이다. 이는 소비 형태가 서비스 중심으로 이동하면서 가격 상승이 지속되고 있음을 보여준다. 두 번째는 내구재 상승폭이 확대되고 있다는 것이다. 내구재는 일반적으로 물가 변동성이 큰 품목이어서, 그 상승폭이 확대된다면 핵심 물가 압력이 지속되고 있음을 의미한다. 따라서 이번 0.3%의 MoM 상승폭 축소를 기조적 물가 압력 완화로 해석하기는 어렵다(SHN ECON CHECKUP).\n\n---\n\n# ## 채권\n"}, {"title": "1. 한국 금리 하락의 수급·경제적 구조: 왜 10월 국채 발행 축소만으로 설명되지 않는다", "md": "## 1. 한국 금리 하락의 수급·경제적 구조: 왜 10월 국채 발행 축소만으로 설명되지 않는다\n\n10월 6일 국고채 금리는 3년 4.0%, 10년 4.4%를 하회하며 전 구간 하락했다(다올투자증권). 수급 측면에서 10월 국고채 경쟁입찰 발행 규모가 당초 계획 대비 5조원 축소돼 12조원으로 감소했다(하나증권). 하지만 하나증권은 이를 \"금리 추가 하락 여력은 제한적\"이라며 수급만으로 하락을 설명하기 어렵다고 명시했다.\n\n왜냐하면 한국 8월 경기선행지수가 10개월 만에 하락 전환(104.2)하면서 시장의 경기 정점 인식이 커지고 있고(도표 9), 이날 동행지수도 이미 103.8로 전년동월비 -0.8%를 기록했다(아마도 8월 데이터 포함). 선행지수 하락은 코스피(-2%), 심리지수, 건설수주 부진 때문이었는데, 반도체 제조용 기계 호조로 8월 설비투자는 전년동기비 +16.1% 증가했다(도표 10, 11).\n\n즉, 선행지수가 하락 전환했더라도 수출(+83.5% YoY)과 설비투자가 견조해서 한국 경기가 쉽게 꺾이지 않는 구조적 사실이 존재한다. 여기에 미국 금리가 떨어지지 않은 상황에서 한국만 금리를 하락시키는 것은 시장에서 파악 가능한 수익률 차별화 기회가 제한됨을 의미한다. 결국 하나증권은 한국 국채 투자의견을 '축소'로 유지하며, 금리 추가 하락 여력을 인정하지 않는 것이다.\n\n---\n"}, {"title": "2. 미국 국채: 9월 경기·물가 지표의 구조적 함의 — 10년 5.16%(+0.16p), 30년 5.46%(+0.30p)", "md": "## 2. 미국 국채: 9월 경기·물가 지표의 구조적 함의 — 10년 5.16%(+0.16p), 30년 5.46%(+0.30p)\n\n키움증권에 따르면, 9월 9일부터 9월 12일까지 미국 10년물은 5.11% → 5.16%, 30년물은 5.43% → 5.46%로 각각 5bp, 3bp 상승해 2007년 이후 최고치(5.16%)와 2004년 이후 최고치(5.46%)를 경신했다. 이 상승은 세 가지 메커니즘이 중첩된 결과다:\n\n**(A)** 9월 종합 PMI가 58.4로 62개월 최고치를 기록하면서 경기지표가 예상보다 강했다  \n→ 경기강화 = 인플레이션이 지속될 가능성이 높아져 기간 프리미엄이 올라갔다  \n\n**(B)** 9월 CPI가 예상치를 0.3p 상회했고, 8월 PCE가 0.2p 하회했음에도 9월 디젤·휘발유 가격이 급등하며 에너지원 가격 상승이 반영되지 않았다  \n→ 유가 하락(WTI 100$ 아래)은 에너지원을 제외한 다른 물가 항목을 눌렀지만, 에너지원은 독립적으로 상승 → 전체 물가의 하방압력은 있으나 에너지 프리미엄이 여전히 존재  \n\n**(C)** 5년물 입찰 부진과 바이백 실망  \n→ 5년물 입찰 경쟁률이 2.4배에 머물렀고, 연준의 장기물 바이백 규모가 예상보다 작았음 → 공급 부담으로 금리가 올라갔다  \n\n결론적으로 미국 국채 10년물은 9월 경기·물가·수급 부담이 동시에 작용함으로써 5.16%라는 높은 수준에 도달했다. 키움증권은 연준의 10월 추가 인상 기대가 약화되었지만, 5.16%라는 높은 수준에서의 장기금리 하락을 위해선 경기에 따른 수요 약화 또는 연준의 최종금리 경로 하향이 필수적이라고 강조한다.\n\n---\n"}, {"title": "3. 하이일드 크레딧 스프레드: 경기 정점 신호인가? — 300bp 상회", "md": "## 3. 하이일드 크레딧 스프레드: 경기 정점 신호인가? — 300bp 상회\n\n하나증권에 따르면, 지난주 하이일드 크레딧 스프레드는 1~2주 사이에 50bp 이상 확대되며 300bp를 상회했다. 9월 비농업고용도 2.9만명으로 예상치(9만명)를 크게 하회했다. 이러한 두 사건이 동시에 발생하자, 시장에서 경기 둔화 신호로 받아들이는 경향이 있었다.\n\n하지만 하나증권은 이 스프레드 확대가 \"경기 둔화 신호\"보다는 \"긴축 사이클 초기에 나타나는 변동성 확대\"의 성격이 더 강하다고 주장한다. 그 근거는 다음과 같다:\n\n**(i)** 고용 부진은 3개월 이동평균 기준 5만명이고, 균형 고용 수준이 5만명 이하였다면 이를 상회하는 고용 추세가 이어지고 있으며, 9월 ADP(9만명), Revelio(5.7만명) 신규 고용도 견조하다  \n→ 월간 등락 폭이 큰 비농업고용이 아닌 이동평균 기준 고용 추세가 더 중요한 척도  \n\n**(ii)** 고용 외 성장 지표도 견조하다: 2Q GDP 수정치 +2.2%로 0.7%p 상향, 9월 ISM 제조업 지수 신규 주문(55.3), 고용(52.7)도 양호  \n→ 경기 지표로서 고용은 중요한데, 그것이 이동평균 기준으로도 상방향이면서 다른 지표들도 양호하면 경기 둔화 신호는 약하다  \n\n따라서 하나증권은 하이일드 스프레드 확대를 단독으로 경기 둔화로 보기 어렵고, 금리 경로를 바꿀 만한 신호로 보기에는 이른 상황이라고 판단한다.\n\n---\n"}, {"title": "4. 9월 경기선행지수 하락 전환: 코스피(-2%)·건설수주·심리지수 약세와 반도체·설비투자 견조의 이중 구조", "md": "## 4. 9월 경기선행지수 하락 전환: 코스피(-2%)·건설수주·심리지수 약세와 반도체·설비투자 견조의 이중 구조\n\n9월 경기선행지수는 10개월 만에 하락 전환(104.2)했으며, 동행지수도 103.8로 전년동월비 -0.8%를 기록했다. 하락 전환의 직접 원인은 코스피(-2%), 심리지수, 건설수주의 부진이다.\n\n그런데 설비투자와 수출은 견조한 수준을 유지했다. 8월 설비투자는 반도체 제조용 기계 호조에 힘입어 전년동기비 +16.1%를 기록했다. 9월 수출은 전년동월비 +83.5%로 증가율이 한층 더 높아졌다.\n\n이 이중 구조는 경기 정점과 정점 이후의 수렴(flatting out) 사이에 위치해 있다는 것을 의미한다. 선행지수가 하락 전환했지만, 설비투자·수출은 오히려 강세를 보이므로 경기 둔화 속도는 느릴 가능성이 높다. 그리고 한국 국채 금리가 미국보다 더 많이 하락했음에도 하나증권은 한국 금리 추가 하락 여력을 제한적이라고 한다 — 즉, 수출·설비투자를 견조하게 유지하면서도 수급 호재와 경기 정점 인식을 동시에 갖춘 국면에서 한국 국채가 미국보다 더 많이 하락하는 것은 현실적으로 쉽지 않은 구조적 문제를 내포한다.\n\n---\n"}, {"title": "5. 브라질 대선 1차: 보우소나루 승리(47.04%)와 결선(10/25)의 시사점", "md": "## 5. 브라질 대선 1차: 보우소나루 승리(47.04%)와 결선(10/25)의 시사점\n\n10월 4일 브라질 대선 1차 투표에서 보우소나루 상원의원(보우소나루 전 대통령의 아들)이 47.04%, 룰라 대통령이 45.15%를 득표하며 결선에 진출했다(신한투자증권). 보우소나루는 1989년 민주화 이후 1차에서 패한 후보가 결선에서 승리한 적이 없어서, 탈락 후보의 표가 결선에서 거의 보우소나루로 돌아오는 구조가 된다. 상원과 주지사 선거에서도 우파가 압도적 약진했다.\n\n시장의 기본 시나리오는 \"룰라 우위, 격차 4%p 미만이면 보우소나루에 우호적\"이었다. 그러나 보우소나루가 2%p 차로 앞서면서 이 시나리오가 완전히 뒤바뀌었다. 만약 보우소나루가 결선에서 승리하면, 재정정책 조정 기대가 생겨 기대인플레이션과 기간 프리미엄이 하락해 장기물 금리 하락과 헤알화 강세가 기대된다. 다만 현재까지 보우소나루측의 구체적 재정안이 발표되지 않았고, 대법원과의 충돌 등의 불확실성이 남아 있다. 반면 룰라가 결선에서 역전하면 선거 막판 복지 확대·채무조정 지원 등의 확장 재정정책이 시행될 가능성이 높아지고, 이는 장기금리 상승과 헤알화 약세를 가져올 수 있다.\n\n현재 금리 커브는 보우소나루 승리 베팅이 몰려 있는데, 룰라가 결선에서 역전하면 금리에 큰 변동성이 생길 수 있다. 10월 25일 결선 전까지 다음 세 가지를 모니터링해야 한다:\n\n- 탈락 후보 지지층의 이동 방향  \n- 보우소나루 측 재정안의 구체 내용(공짜 복지 vs. 구조개혁)  \n- 방코 마스터 수사 진척 여부(모라스·보로카로의 연루가 현재까지 드러난 상태)  \n\n---\n"}, {"title": "6. 은행채 발행: 4분기 차환 발행은 이어지나 10월 공급 부담은 9월 대비 완화 전망(iM증권)", "md": "## 6. 은행채 발행: 4분기 차환 발행은 이어지나 10월 공급 부담은 9월 대비 완화 전망(iM증권)\n\niM증권에 따르면, 2026년 9월말 기준 은행채 만기도래액은 10월 약 19.2조원, 11월 약 26.5조원, 12월 약 23.0조원으로 11월에 가장 많다. 2027년 1월 약 14.2조원, 2월 약 18.0조원, 3월 약 27.1조원이 예정되어 있어서, 4분기에도 차환 발행이 이어질 가능성이 높다.\n\n그러나 9월에는 분기말 대응 물량이 집중되어 있었기 때문에, 10월 명목 발행량 기준 공급 부담은 9월 대비 다소 완화될 전망이다. iM증권은 이 기존 뷰를 유지한다고 명시했다.\n\n만기 구성 면에서, 2026년 1~9월 은행채 발행 중 1년 이하 비중은 54.5%로 2025년(46.6%)보다 높아졌고, 가중평균 발행만기는 1.51년으로 2024년(1.81년), 2025년(1.77년)보다 짧아졌다. 최근 12개월 기준으로는 6~9개월물과 3년물 비중이 함께 늘어나는 모습이다.\n\n9월만기 구성은 7~8월과 달라졌다. 7~8월에는 1.5년 이상 발행 비중이 54~60%, 가중평균 발행만기가 1.6년대였지만, 9월에는 1년 이하 발행이 17.7조원으로 늘면서 1.5년 이상 비중이 35%로 낮아지고 가중평균 발행만기도 1.41년으로 짧아졌다. 이는 분기말을 앞둔 단기 조달 수요가 늘었기 때문으로 해석된다.\n\n또한 정기예금 유동화증권(예담 ABCP) 만기도 함께 보면, 10월 약 12.5조원, 11월 약 10.7조원, 12월 약 22.6조원으로, 은행채와 합산하면 각각 약 31.7조원, 37.2조원, 45.6조원이다. 그러나 예담 ABCP는 정기예금을 기초로 발행되며, 유동화 구조상 기초자산인 정기예금의 만기와 ABCP 만기가 반드시 같지 않기 때문에, 합산 수치는 은행권 시장성 조달과 연계된 만기도래 규모와 잠재적 재조달 시점을 가늠하기 위한 참고치로만 사용하는 것이 적절하다.\n\n---\n"}, {"title": "7. 글로벌 금리: 연준 추가 인상 기대 후퇴, 장기금리 하락은 제한적(키움증권)", "md": "## 7. 글로벌 금리: 연준 추가 인상 기대 후퇴, 장기금리 하락은 제한적(키움증권)\n\n키움증권은 연준이 9월 인상 직후 10월에도 추가 인상에 나설 가능성은 크게 낮아졌다고 판단한다. 9월 고용 증가세 둔화와 실업률 상승은 추가 긴축의 필요성을 약화시키고, 연속 인상을 전제로 형성됐던 최종금리 상향 위험도 낮추는 요인이 됐다. 이는 단기물 금리 상단을 제약하고, 장기물의 추가 급등 가능성을 낮추는 방향으로 작용한다.\n\n그러나 10월 추가 인상 기대가 약화되었다고 해서 장기금리가 추세적으로 하락하는 것은 아직 부족하다. 연휴 기간 미국채 10년물은 고점에서 일부 반락했지만 여전히 높은 수준을 유지했고, 10년물 하락폭이 추가 인상 기대 하락만큼 크지 않았다. 미국의 재정적자·국채 공급 확대, 높은 기간 프리미엄, 일본·유럽 장기금리 상승 등이 동시에 작용해 장기채 투자자들이 요구하는 위험 보상이 높아져 있다. 따라서 정책금리 경로에 민감한 단기물이 상단을 제약하는 한편, 장기물은 재정·수급 부담으로 하락폭이 제한된다.\n\n결론적으로 미국채 시장은 \"통화정책이 금리 상단을 제약하는 반면 재정·수급이 하단을 지지하는 구간\"에 진입했다. 10월 인상 가능성이 낮아진 만큼 2년물 등 단기금리의 추가 상승 가능성은 낮아졌지만, 재정·국채 공급 부담이 유지되면 경기 지표가 다소 둔화되는 정도만으로 장기금리가 크게 하락하기도 어렵다. 향후 미국채 10년물이 방향성을 형성하기보다는 높은 수준에서 변동성을 이어갈 가능성이 높다. 장기금리의 의미 있는 하락을 위해서는 10월 동결을 넘어 연말 추가 인상 가능성 자체가 낮아지거나, 고금리가 경제 전반의 수요를 실제로 제약하고 있다는 신호가 확인돼야 한다. 고용 둔화가 지속되고 소비·주택·기업투자·신용시장에서 긴축의 누적 효과가 확인된다면 연준의 추가 인상 기대와 중장기 정책금리 경로 자체가 낮아질 수 있다. 동시에 경기 둔화가 민간 자금수요와 위험선호를 약화시키면 기간 프리미엄 상승 압력도 완화될 수 있다. 그러므로 향후 미국채 금리 고점 판단에서는 개별 물가·고용지표보다 고금리가 경제 전반의 수요를 실제로 얼마나 제약하는지가 더 중요해진다.\n\n이러한 구조 하에서 미국채 시장은 단기물 상방 위험이 상대적으로 빠르게 낮아지는 가운데, 장기물은 높은 기간 프리미엄으로 하락폭이 제한되어 완만한 커브 스티프닝 압력이 이어질 가능성이 높다. 10월 인상 기대 후퇴는 2년물 등 단기금리의 추가 상승을 제한하는 요인이다. 그러나 장기물은 재정·국채 공급·글로벌 장기채 수급 부담에서 자유롭지 않다. 다만 연준의 추가 긴축 가능성이 낮아진 만큼 장기금리가 이전처럼 상단을 계속 높이기보다는 현재의 높은 수준에서 고점 형성을 시도할 가능성이 커졌으며, 향후 경기와 금융시장에서 고금리 부담이 확인될 경우 장기금리의 하락 압력도 점차 강화될 것으로 예상한다.\n\n---\n"}, {"title": "8. 유럽: 프랑스 163.8bp 상승(1위), 영국 113.8bp 상승(4위)(한화투자증권)", "md": "## 8. 유럽: 프랑스 163.8bp 상승(1위), 영국 113.8bp 상승(4위)(한화투자증권)\n\n전쟁 발발 이후 주요 선진국 10년 금리는 모두 상승했다. 상승폭 기준으로 프랑스가 163.8bp로 1위, 영국이 113.8bp로 4위(2위 미국 +133.2bp, 3위 이탈리아 +132.6bp)를 기록했다.\n\n한화투자증권은 이 상승을 두 나라마다 다르게 해석한다. 영국은 발표될 예산안이나 통화정책 결정 등이 시장 환경을 크게 뒤흔들 우발적 위험 요인이 존재하는 구조적 문제가 아니며, 단기적 리스크로 볼 수 있다(Gilts 시장). 반면 프랑스는 재정·정치·수급 상황이 악화된 상태가 한동안 이어질 가능성이 높아, 구조적으로 시장이 꾸준하게 약세를 보일 것으로 예상(OATs 시장)한다.\n\n영국 총리 교체 직전(7/17)까지는 영국 10년이 74bp 상승하면서 주요국 중 가장 큰 약세를 보였고, 이후 10/2까지는 프랑스 10년이 93bp 급등하며 최대 상승폭을 기록했다. 역사·축구에 이어 시장도 경쟁적으로 약세폭을 키워가는 형태다. 이들은 서로 경쟁하는 라이벌 국가로, 전쟁 발발 이후 시장에서의 우려도 경쟁적으로 누적되고 있다.\n\n---\n"}, {"title": "9. 채권 변동성: MOVE 지수 상승, 하이일드 스프레드 300bp 상회", "md": "## 9. 채권 변동성: MOVE 지수 상승, 하이일드 스프레드 300bp 상회\n\nMOVE 지수(채권 변동성 지수)의 상승세가 이어졌고, 미국 하이일드 크레딧 스프레드도 1~2주 사이에 50bp 이상 확대돼 300bp를 상회했다. 두 현상은 동시에 나타났다. 하나증권은 이를 금융시장 전반의 변동성 확대의 일환으로 해석하며, 이 변동성 확대가 금리 경로를 바꾸기 어렵다고 판단한다. 반면, HY 스프레드 확대가 경기 정점 신호인지에 대해서는 이슈 1에서 이미 논의했다 — 즉, 고용 부진이 이동평균 기준으로도 상방향이면서 ADP·Revelio 신규 고용이 견조하고, ISM 제조업 지수가 양호하기 때문에 HY 스프레드 확대를 단독으로 경기 둔화로 보기 어렵다고 한다. 따라서 이 변동성 확대는 금융시장 전반이 겪는 스트레스의 성격이 강하다.\n\n---\n"}, {"title": "10. 달러-원: 1,344.00원(-6.60원), 국제유가의 원화·엔화 부담(유안타증권)", "md": "## 10. 달러-원: 1,344.00원(-6.60원), 국제유가의 원화·엔화 부담(유안타증권)\n\n달러-원 환율은 1,344.00원으로 6.60원 하락했다. 미국 고용 부진에 연준 추가 금리인상 기대가 후퇴했고, 달러-엔 움직임을 따라 원화가 하락했다. 그러나 높은 국제유가는 원화·엔화에 부담으로 작용해 추가 하락을 제한했다.\n\n유가 하락(WTI 100$ 아래)은 원화 가치를 지지하는 요인이었고, 달러-엔 약세가 원화 약세를 주도했다. 그러나 유가 하락이 에너지원 가격 상승을 완충해주지 못한 부분(디젤·휘발유 가격)은 기간 프리미엄으로 남아있어, 원화·엔화의 추가 하락을 제한하는 구조적 저항 요인이 되었다.\n\n--- \n"}, {"title": "11. 유안타증권·유진투자증권의 공통 판단: 10월 국채발행 축소·시장 안정 의지·외국인 국채선물 순매수", "md": "## 11. 유안타증권·유진투자증권의 공통 판단: 10월 국채발행 축소·시장 안정 의지·외국인 국채선물 순매수\n\n유안타증권과 유진투자증권은 모두 10월 국채발행 축소와 정부의 시장 안정 의지를 강조한다. 유안타증권은 \"10월 국고채 발행 축소와 정부의 시장안정 의지가 강세를 주도했고, 전일 미 국채 금리 급락과 외국인 국채선물 순매수도 금리 하락에 힘을 보탰다\"고 밝혔다. 유진투자증권은 \"간밤 미국장 강세와 더불어 전일 장 종료 후 공개된 국채발행계획에서 월간 발행량을 5조원 축소한다는 발표의 영향으로 금리 하락세 가팔랐음\"이라고 기술했으며, \"재경부의 금리 모니터링 및 시장 안정화 조치에 대한 의지를 확인한 것도 긍정적\"이라고 덧붙였다. 외국인 국채선물 순매수 규모 확대도 금리 하락의 추가 동인으로 공통적으로 언급된다.\n\n---\n\n# ## 산업 섹터별\n\n---\n"}, {"title": "**Meta Muse: 개인형 AI 에이전트의 대중화 시작점**", "md": "## **Meta Muse: 개인형 AI 에이전트의 대중화 시작점**\n\nMeta가 9월 8일 출시한 개인형 AI 에이전트 *Muse*는 출시 10일 만에 미국 App Store 무료 앱 1위에 오르며 즉각적인 대중적 수요를 인정받았다. 이는 Gemini Spark, Grok Bot, ChatGPT의 에이전트들과 형태상 차이가 거의 없었던 초기 시장에서의 돌풍이다.\n\n**핵심 차별 포인트**: \n1. **무료 전용 컴퓨터(Secure VM)** 제공 – AI 모델과 사용자 데이터를 분리한 보안 환경 구축\n2. **Fleet Learning** 기반의 학습 메커니즘 – 여러 사용자 경험을 공유해 질을 높임\n3. **AI글래스와의 시너지** – 현실 공간과 디지털 작업을 연결하는 새로운 UX 구현\n\nSecure VM은 보안 측면에서 가장 중요한 차별화 요소로, 다른 AI 에이전트들이 데이터 수집에 의존하는 구조와는 달리 Muse는 사용자의 개인정보를 저장하지 않는다. 이는 기존 AI 서비스의 데이터 활용 논란을 극복한 구조이며, 특히 GDPR 등 개인정보 보호 기준이 엄격한 시장에서의 입지도 강화된다.\n\n---\n"}, {"title": "**AI 경쟁의 새로운 축: 보안이 성능만큼 중요해진다**", "md": "## **AI 경쟁의 새로운 축: 보안이 성능만큼 중요해진다**\n\n앤트로픽(Antropic)의 무단 증류 적발 사건과 구글의 Argo 공개는 AI 경쟁이 기능성(Flexibility)에서 보안(Reliability)으로 이동하고 있음을 시사한다.\n\n- Antrorpic 사건은 Open Source 모델이 Enterprise 고객의 데이터를 학습할 때 발생하는 보안 리스크를 구체화했다. 이는 AI의 기능적 우위를 기반으로 한 경쟁이 아니라, **Enterprise가 AI를 쓸 수 있게 만들 수 있는 Trust Framework**가 경쟁력이라는 메시지를 전달한다.\n- 구글의 Argo는 기업용 AI가 성능 뿐 아니라 보안과 신뢰성으로 확장되고 있음을 보여준다. 구글은 AI 모델과 데이터를 분리한 보안 환경에서 실행하는 방식으로, **Safe Execution Environment(SEE)** 개념을 실질화했다.\n\n**투자적 함의**: 기업용 AI의 수요가 반도체 수요로 이어지는 구조는 유지되겠지만, 보안 인프라가 필수 구성 요소가 될 것이다. SeeCore, 인사이트칩 등 보안 전용 SoC/ASIC의 수요가 빠르게 확대될 전망이다.\n\n---\n"}, {"title": "**제주항공: 3년 만의 흑자전환과 환율하락 수혜의 동시착륙**", "md": "## **제주항공: 3년 만의 흑자전환과 환율하락 수혜의 동시착륙**\n\n제주항공은 3분기에 3년 만에 흑자전환에 성공했다. 이는 다음과 같은 조합이 만들어낸 결과다:\n\n1. **일본 여행 수요 선점**: 제주항공은 일본 여행 수요를 가장 많이 선점한 LCC 중 하나다. 9월 방한객 중 중국인 비중은 36.9%로 한한령 이전 최대치 근접 수준이다. 일본 여행객이 증가하면 제주항공의 좌석 가동률은 자연스럽게 개선된다.\n2. **중동 전쟁 피해 완화**: 3분기에는 중동 전쟁 피해에서 벗어났다.\n3. **환율하락**: 원/달러 환율 하락은 항공사의 연료비와 항공기 임대료(CapEx) 부담을 동시에 완화한다.\n\n제주항공은 유일하게 순수 LCC 모델을 유지하고 있어, 구조적 수익성 개선에 가장 유리한 포지션이다. 2027년까지 일본 여행 수요가 회복될 것으로 예상되는데, 이때까지는 제주항공이 수혜를 독점할 가능성이 높다.\n\n---\n"}, {"title": "**팬오션: 탱커 스팟→장기대선 전환과 수익성 구조 개선**", "md": "## **팬오션: 탱커 스팟→장기대선 전환과 수익성 구조 개선**\n\n9월 중순 이후 VLCC 스팟 운임은 일당 66만달러까지 치솟아 2025년 연평균의 10배를 넘겼다. 이는 공급 제약이 지속되는 구간에서의 수익성 향상이 가능한 구간이다.\n\n하지만 팬오션의 핵심 수혜는 스팟이 아닌 **장기대선**으로 전환이 이루어짐에 있다. \n\n- 9월 28일 Trafigura와 1,482억원 규모의 VLCC 1척 3년 장기대선계약이 공시되었다. 일당 10만달러 수준으로, 2025년 연평균의 2~3배 수준이다.\n- DHT도 9월 VLCC 3년 일당 10만달러 계약을 발표했고, Scorpio Tankers는 LR2 2척을 4만달러 이상에 장기대선했다. 이는 제품선에서도 높은 요율의 장기대선 사례로, 탱커 시황 강세가 장기계약 시장으로 확산되고 있음을 보여준다.\n\n**수익성 구조 개선**: 팬오션은 탱커 스팟 노출이 적어 스팟 강세의 수혜를 직접 느끼기 어려웠으나, 높은 요율의 장기대선 계약은 수익성 개선의 직접적 기반이 된다. 2027년에는 신조 인도 증가로 공급 증가율(9.7%)이 수요 증가율(4.5%)을 상회할 전망이므로, 현재의 장기대선 강세가 언제까지 지속될까에 대한 불확실성이 있다. 하지만 2026년 말까지는 공급 증가율(6.7%)이 수요 증가율(10.2%)을 하회하는 구간이므로, 팬오션의 장기대선 강세는 2026년 말까지는 지속될 가능성이 높다.\n\n---\n"}, {"title": "**한국콜마: 9월 10일까지 30% 하락 후 반등 가능**", "md": "## **한국콜마: 9월 10일까지 30% 하락 후 반등 가능**\n\n한국콜마는 9월 10일까지 30% 이상 하락했다. 하락 요인은 다음과 같았다:\n\n1. **ODM 업체들의 수요 부담**: 용기 수급 부담, 미국·유럽향 물류비 부담\n2. **환율 효과 감소**: 원화 강세가 수익성에 부정적인 영향\n3. **주요 고객사들의 수요 성숙기**: KOLLEGE, YSL 등 주요 브랜드들이 성숙기에 접어들면서 매출 성장률이 둔화되고 있음\n\n하지만 9월까지 수출 데이터를 보면, 수요 감소에 따른 구조적 실적 둔화보다는 **높은 성장세를 유지하는 과정에서 발생하는 비용 부담**(수익성 훼손)이 주가 조정의 주요 원인이라고 판단된다. 3분기 실적은 공급 차질 및 비용 부담으로 매출 성장과 영업이익 성장 간 괴리가 확대될 수 있지만, 주가는 이 괴리를 과도하게 반영한 감이 있다. 따라서 9월 하락 이후 반등 기회가 있다고 판단한다.\n\n---\n"}, {"title": "**한국콜마 & 코스메카코리아: ODM 업체들의 9월 조정과 반등 가능성**", "md": "## **한국콜마 & 코스메카코리아: ODM 업체들의 9월 조정과 반등 가능성**\n\n한국콜마는 9월 10일까지 6% 하락했고, 코스메카코리아는 13% 하락했다. 두 업체의 하락은 ODM 업체들이 수요 부담과 환율 효과 감소를 동시에 겪고 있기 때문이다. 9월까지 수출 데이터를 보면, 수요 감소에 따른 구조적 실적 둔화보다는 **높은 성장세를 유지하는 과정에서 발생하는 비용 부담**(수익성 훼손)이 주가 조정의 주요 원인이라고 판단된다.\n\n3분기 실적은 공급 차질 및 비용 부담으로 매출 성장과 영업이익 성장 간 괴리가 확대될 수 있지만, 주가는 이 괴리를 과도하게 반영한 감이 있다. 따라서 9월 하락 이후 반등 기회가 있다고 판단한다. 특히 코스메카코리아는 2027년에 45%의 수익성 개선을 기대할 수 있어서, 이벤트 리스크(ODM 업체들의 수요 부담, 환율 효과 감소)가 해소될 경우 주가가 더 빠르게 반등할 가능성이 높다.\n\n---\n"}, {"title": "**삼양식품: 9월 10일까지 30% 하락 후 반등 가능**", "md": "## **삼양식품: 9월 10일까지 30% 하락 후 반등 가능**\n\n삼양식품은 9월 10일까지 30% 이상 하락했다. 하락 요인은 다음과 같았다:\n\n1. **ODM 업체들의 수요 부담**: 용기 수급 부담, 미국·유럽향 물류비 부담\n2. **환율 효과 감소**: 원화 강세가 수익성에 부정적인 영향\n3. **주요 고객사들의 수요 성숙기**: KOLLEGE, YSL 등 주요 브랜드들이 성숙기에 접어들면서 매출 성장률이 둔화되고 있음\n\n하지만 9월까지 수출 데이터를 보면, 수요 감소에 따른 구조적 실적 둔화보다는 **높은 성장세를 유지하는 과정에서 발생하는 비용 부담**(수익성 훼손)이 주가 조정의 주요 원인이라고 판단된다. 3분기 실적은 공급 차질 및 비용 부담으로 매출 성장과 영업이익 성장 간 괴리가 확대될 수 있지만, 주가는 이 괴리를 과도하게 반영한 감이 있다. 따라서 9월 하락 이후 반등 기회가 있다고 판단한다.\n\n---\n"}, {"title": "**IBK투자증권: 3Q26 Preview - 합산 지배 순익 7.0조원(+1% YoY, -5% QoQ)**", "md": "## **IBK투자증권: 3Q26 Preview - 합산 지배 순익 7.0조원(+1% YoY, -5% QoQ)**\n\nKB, 하나, IBK, JB은행은 컨센서스에 부합하거나 그보다 조금 높은 실적을 기록할 전망이다. 그 외 은행들의 실적은 5% 이상 하회할 것으로 추정된다.\n\n**핵심 요인**:\n1. **NIM 하락**: 3분기 중 평균 약 3bp 하락\n2. **자본시장 관련 수수료 수익 감소**: KOSPI와 KOSDAQ의 조정 양상\n3. **채권평가손실 확대**: 시중금리 추가 상승\n4. **환율 하락에 따른 외화환산익**: 5,500억원(KB·하나·우리)\n5. **부동산매각익**: 2,500억원(신한)\n6. **판관비 감소**: 증권 성과급 축소\n7. **대손비용 증가 폭 제한**: 연체율 상승에도 불구하고 제한적\n\n한편, 신한은행의 계열사 부동산 매각익이 더해지면서 세전이익은 4% QoQ 감소할 전망이다. 전체 은행 지배 순익은 7.0조원으로 전년 동기 대비 +1%, 전분기 대비 -5% 감소할 것으로 추정된다.\n\n---\n"}, {"title": "**DS투자증권: 한진칼 지배구조 – 산업은행 보유 10.58%가 최대 변수**", "md": "## **DS투자증권: 한진칼 지배구조 – 산업은행 보유 10.58%가 최대 변수**\n\n2020년 대한항공의 아시아나 인수 과정에서 산업은행이 취득한 한진칼 지분은 10.58%다. 당시 취득 원가는 주당 70,800원, 약 700만주다. 추가로 투자한 교환사채 3,000억원은 2025년 12월 상환됐다. 투자 원금 5,000억원을 감안하면 현재 주가 기준 평가액은 9,343억원으로, 평가 이익이 4,343억원(+87%)에 달한다.\n\n**시장 관심의 핵심**: 산업은행은 “대한항공-아시아나 합병 이후 시장 상황 등을 고려해 회수 방안을 검토하겠다”고 정무위에 보고했다. 10월 8일 산업은행 국정감사가 진행될 예정이며, 여기서 관련 내용이 나올지 주목된다. 현재 한진칼 지분 구조는 조원태 회장 측 20.57%, 호반그룹 20.15%로 격차가 0.42%p에 불과하다. 연말로 갈수록 시장의 관심은 산업은행의 한진칼 지분 10.58%에 쏠릴 전망이다.\n\n---\n"}, {"title": "**하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**", "md": "## **하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**\n\n### **자동차**\n- 미국 자동차 소매판매: 9월 +4% YoY, 9월 누적 -2% YoY\n- 파워 트레인별: 내연기관차 +8%, 전기차 -40%, 하이브리드차 +32%\n- 전기차 판매: 전년 9월 전기차 세액공제 종료 후 11개월 평균 -29% YoY\n- 하이브리드차 침투율: 3.2%p YoY 상승한 15.5%\n- 현대차/기아: 9월 +10%/+18% YoY, 점유율 0.9%p YoY 상승한 12.3%\n- 현대차/기아의 합산 내연기관차/HEV/전기차: +16%/+47%/-44% YoY\n\n### **이차전지**\n- 국내 3분기 실적: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적 예상\n- 양극재 기업: ESS 수혜가 극히 미미한 상황에서 메탈 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재\n- 10월 중소형주 관심: 연말 차세대 소재 기업들이 다시 부각되는 시기. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n"}, {"title": "**유진투자증권: 건설/부동산 Weekly - SMR, 잠재가치가 보이는 시점**", "md": "## **유진투자증권: 건설/부동산 Weekly - SMR, 잠재가치가 보이는 시점**\n\n### **주간 아파트가격 동향**\n- 매매가격지수: 전국 +0.06%, 수도권 +0.12%, 지방권 +0.00%, 서울 +0.09%\n- 전세가격지수: 전국 +0.09%, 수도권 +0.14%, 지방권 +0.03%, 서울 +0.16%\n\n### **TOP3 지역**\n- 화성 동탄 +0.47%\n- 서울 서대문구 +0.41%\n- 성남 중원 +0.39%\n\n---\n"}, {"title": "**DS투자증권: 블록딜 매각이 업권의 투자심리를 위축시켰던 한 주**", "md": "## **DS투자증권: 블록딜 매각이 업권의 투자심리를 위축시켰던 한 주**\n\n- 포스코그룹이 우리금융지주 보유 지분 2,028만주(약 2.75%)를 블록딜로 매각해 약 6,700억원을 현금화. 10여년동안 지분 관계를 유지해왔지만 지주사 디스카운트를 해소하고 미래 성장 재원을 확보하는 차원에서 처분 결정을 내린 것으로 풀이\n- 9월에도 금융위의 최종 결론이 나지 않으면서 관련 환입은 4분기에 발생할 가능성이 높아졌음\n- 국고채 PD 답합 의혹 관련 공정위 과징금 부과 여부도 결정이 지연되면서 3분기에는 발생하지 않을 공산이 커졌다고 판단\n\n---\n"}, {"title": "**하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**", "md": "## **하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**\n\n### **자동차**\n- 미국 자동차 소매판매: 9월 +4% YoY, 9월 누적 -2% YoY\n- 파워 트레인별: 내연기관차 +8%, 전기차 -40%, 하이브리드차 +32%\n- 전기차 판매: 전년 9월 전기차 세액공제 종료 후 11개월 평균 -29% YoY\n- 하이브리드차 침투율: 3.2%p YoY 상승한 15.5%\n- 현대차/기아: 9월 +10%/+18% YoY, 점유율 0.9%p YoY 상승한 12.3%\n- 현대차/기아의 합산 내연기관차/HEV/전기차: +16%/+47%/-44% YoY\n\n### **이차전지**\n- 국내 3분기 실적: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적 예상\n- 양극재 기업: ESS 수혜가 극히 미미한 상황에서 메tal 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재\n- 10월 중소형주 관심: 연말 차세대 소재 기업들이 다시 부각되는 시기. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n"}, {"title": "**유진투자증권: 9월 잠정 수출: 3분기는 환율 및 계절성 영향**", "md": "## **유진투자증권: 9월 잠정 수출: 3분기는 환율 및 계절성 영향**\n\n- **미용의료 업종 9월 수출액**: 톡신 -$47.1M(-6.4% YoY, -11.3% Mom), 필러·기타 화장품 +$441.4M(+47.0% YoY, +7.8% Mom), 미용의료기기(EBD) -$47.1M(-8.6% YoY)\n\n- **톡신**: 미국향 선적 감소($6.9M, -6.6% YoY, -75.2% Mom)가 전월 대비 감소의 주요 원인. 캐나다·사우디·호주향 수출액은 전월 대비 합산 $7.1M 증가하며 미국향 감소를 일부 상쇄. 브라질($6.8M, +28.0% YoY, +4.7% Mom)은 성장세를 이어갔으며, 중국($5.3M, -0.3% YoY, +23.4% Mom)도 전월 대비 회복세를 보였다.\n\n- **필러·기타화장품**: 9월 $441.4M(+47.0% YoY, +7.8% Mom). 해당 통계는 필러·스킨부스터·기타화장품을 모두 포괄하고 있어 특정 국가 또는 개별 기업의 흐름을 분리해 파악하기는 어렵다. 다만 파마리서치의 서유럽 파트너사향 선적은 8월에 진행된 것으로 파악된다(프랑스 $3.3M, +33.9% YoY, +81.3% Mom)\n\n- **파마리서치(BUY, TP 54만원)**: 단기 수익성 부담에도 성장 여력 유효. 9월 중 발표된 8월 강릉 지역 수출액 감소(-38.1% Mom)로 실적에 대한 우려가 제기되면서 9월 주가는 24% 하락했다. 그러나 8월까지 파마리서치의 의료기기 수출은 양호한 흐름을 이어간 것으로 파악된다. 3분기 실적은 의료기기 내수의 계절적 비수기에 더해 화장품 매출 비중 상승과 원화 강세에 따른 수익성 훼손이 일부 발생할 것으로 예상된다. 그러나 4분기에는 아마존 프라임 빅딜데이 및 미국 코스트코 입점 등을 통한 화장품 판매 확대 기회, 스킨부스터 성수기 진입에 따른 내수 수요 회복, 유럽 내 리쥬란 마케팅 활동 이후 의료진들의 수요 증가 가능성을 고려해 긍정적 시각을 유지한다.\n\n- **휴젤(BUY, 37만원)**: 미국 판매 체제 전환에 따른 매출 인식 변화. 베네브와의 계약을 영업대행 체제로 전환하면서 3분기에는 기인식된 미국 매출액이 일부 취소될 예정이다. 향후 직판 재고 선적 시 수출 통계에 반영될 수 있으나, 실제 매출은 의료진들에게 판매 시 반영될 전망이다. 연말~2027년 초에는 직접판매 확대의 초기 성과가 점차 나타날 것으로 예상한다.\n\n---\n"}, {"title": "**하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**", "md": "## **하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**\n\n### **자동차**\n- 미국 자동차 소매판매: 9월 +4% YoY, 9월 누적 -2% YoY\n- 파워 트레인별: 내연기관차 +8%, 전기차 -40%, 하이브리드차 +32%\n- 전기차 판매: 전년 9월 전기차 세액공제 종료 후 11개월 평균 -29% YoY\n- 하이브리드차 침투율: 3.2%p YoY 상승한 15.5%\n- 현대차/기아: 9월 +10%/+18% YoY, 점유율 0.9%p YoY 상승한 12.3%\n- 현대차/기아의 합산 내연기관차/HEV/전기차: +16%/+47%/-44% YoY\n\n### **이차전지**\n- 국내 3분기 실적: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적 예상\n- 양극재 기업: ESS 수혜가 극히 미미한 상황에서 메tal 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재\n- 10월 중소형주 관심: 연말 차세대 소재 기업들이 다시 부각되는 시기. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n"}, {"title": "**하나증권: 3분기 실적 대형주와 중소형주 온도차**", "md": "## **하나증권: 3분기 실적 대형주와 중소형주 온도차**\n\n- **3분기 실적**: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적이 예상된다. 보상금과 보조금 효과가 예상보다 확대되며 환율 하락 영향 역시 상쇄할 것으로 예상된다. 영업이익 기준 전분기 대비 증익뿐만 아니라 3개월전 가이던스 대비해서도 이를 상회하는 실적이 예상된다.\n- **양극재 기업**: 여전히 ESS 수혜가 극히 미미한 상황에서 메탈 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재하다. 이에 따라 주요 기업들 대부분 컨센서스 하회가 예상된다.\n- **향후 한달 간**: 3분기 실적 및 4분기 가이던스 흐름을 감안했을 때, 북미 ESS 수혜 키워드에 부합하는 기업들에 대한 선별 접근이 필요하다고 판단한다. 셀 메이커를 중심으로 매수하되(LG에너지솔루션, 삼성SDI), 관련 중소형주(한중엔시에스, 더블유씨피)에 대한 관심이 필요하다.\n- **연말 이후**: 차세대 소재 기업들이 다시 부각되는 시기다. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단한다(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n"}, {"title": "**하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**", "md": "## **하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**\n\n### **자동차**\n- 미국 자동차 소매판매: 9월 +4% YoY, 9월 누적 -2% YoY\n- 파워 트레인별: 내연기관차 +8%, 전기차 -40%, 하이브리드차 +32%\n- 전기차 판매: 전년 9월 전기차 세액공제 종료 후 11개월 평균 -29% YoY\n- 하이브리드차 침투율: 3.2%p YoY 상승한 15.5%\n- 현대차/기아: 9월 +10%/+18% YoY, 점유율 0.9%p YoY 상승한 12.3%\n- 현대차/기아의 합산 내연기관차/HEV/전기차: +16%/+47%/-44% YoY\n\n### **이차전지**\n- 국내 3분기 실적: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적 예상\n- 양극재 기업: ESS 수혜가 극히 미미한 상황에서 메tal 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재\n- 10월 중소형주 관심: 연말 차세대 소재 기업들이 다시 부각되는 시기. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n"}, {"title": "**하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**", "md": "## **하나증권: 2026년 10월 첫째 주 자동차/이차전지 Weekly**\n\n### **자동차**\n- 미국 자동차 소매판매: 9월 +4% YoY, 9월 누적 -2% YoY\n- 파워 트레인별: 내연기관차 +8%, 전기차 -40%, 하이브리드차 +32%\n- 전기차 판매: 전년 9월 전기차 세액공제 종료 후 11개월 평균 -29% YoY\n- 하이브리드차 침투율: 3.2%p YoY 상승한 15.5%\n- 현대차/기아: 9월 +10%/+18% YoY, 점유율 0.9%p YoY 상승한 12.3%\n- 현대차/기아의 합산 내연기관차/HEV/전기차: +16%/+47%/-44% YoY\n\n### **이차전지**\n- 국내 3분기 실적: 셀 메이커들의 보상금 수취 및 북미 ESS 출하 증가로 AMPC 효과로 호실적 예상\n- 양극재 기업: ESS 수혜가 극히 미미한 상황에서 메tal 가격이 고점 대비 소폭 하락하며, 환율 하락에 따른 손익 타격을 상쇄해줄 요인이 부재\n- 10월 중소형주 관심: 연말 차세대 소재 기업들이 다시 부각되는 시기. 매년 연말부터 차년도 CES 및 인터배터리(3월)까지 전고체, 실리콘 음극재 등 차세대 배터리 기술 기업이 부각되는 패턴이 반복된다. 내년 해당 기업들의 실적이 극적으로 증가하는 것을 기대하기는 아직 이르나, 휴머노이드 로봇 및 로보택시 시장이 점진적으로 개화하는데 따른 기술 수혜 부각될 수 있다는 점에서 가격과 무관하게 해당 기업들에 대한 트레이딩 기회 있을 것으로 판단(관련 기업: 이수스페셜티케미칼, 대주전자재료 등)\n\n---\n\n# ## 투자전략\n\n---\n"}, {"title": "1. 주식형 펀드: 순유입 전환이나 액티브 이탈의 구조적 이유", "md": "## 1. 주식형 펀드: 순유입 전환이나 액티브 이탈의 구조적 이유\n\n지난주(9/24~9/30) 주식형 펀드는 -$101.8억에서 +$157.6억으로 순유입 전환했다. 같은 기간 채권형 펀드($+172.8억 → $+187.9억)도 장기채(+1.01%)가 52주 내 최대 순유입으로 급반전됐는데, 이는 금리 하락전환 가능성을 베팅한 자금의 움직임이다. 그런데 액티브 주식형 펀드는 -$97.4억의 대규모 순유출로 전환했는데, 이는 금리 급등과 미 국채 10년물 5.2% 돌파, 8월 PCE 3.4%(예상치 하회) 등의 악재가 반영된 결과로 해석된다([유안타증권](https://www.yuanta.co.kr))。\n\n같은 맥락에서 iM증권은 \"금리 상승은 성장의 증거\"라며, 기대인플레보다는 실질금리를 밀어올린 성장 자체가 금리를 끌어올렸다는 논리를 제시한다. 금리가 피크아웃할 때부터 매크로 장이 시작된다는 게 iM의 결론이다. 따라서 10월의 핵심 변수는 3Q 실적 발표(특히 8월 PCE 개편 반영된 수치)와 10월 FOMC 의사록이 될 전망이다 ([iM증권](https://m.ezsec.com))。\n\n양측의 논리가 서로 다르다. 유안타는 8월 PCE 하회와 제퍼슨 연준 부의장의 완화적 발언을 금리 하락전환 신호로 본다면, iM은 이미 금리 상승 국면이 성장을 반영한 상태라 금리 하락이 아닌 피크아웃 확인이 다음 단계로 머무른다는 입장이다。현 시점에서는 두 변수가 동시에 작동 중인데, 만약 3Q 실적에서 추가 인상을 요구하는 데이터가 나오지 않는다면 금리 하락 전환이 가능해지는 구조적 조건이 마련된다。\n\n---\n"}, {"title": "2. AI 밸류체인: 메모리→에이전트→플랫폼으로의 이동, 수혜의 위치 변화", "md": "## 2. AI 밸류체인: 메모리→에이전트→플랫폼으로의 이동, 수혜의 위치 변화\n\nOpenAI DevDay 2026에서 핵심 발표는 다음과 같다:\n\n- **Dots**: 기존 단순 개인 비서 개념을 벗어나 상시 작동하는 기업용 AI 에이전트로 전환。\n- **GPT-6.1 Sol**: Astra에 근접한 성능을 1/5 수준의 토큰 가격으로 제공 (\"비용 효율성 경쟁\").\n- **ChatGPT Space/Pages/Slides**: Microsoft 365와 Google Workspace가 담당하던 협업 공간으로 진입。\n- **Plugins + Marketplace**: ChatGPT 자체를 AI 앱 유통·실행 플랫폼으로 만드는 전략（하나증권）。\n\n즉, AI 경쟁이 모델 성능 경쟁에서 **에이전트→업무 플랫폼→앱 생태계**로 무게 중심이 이동하고 있다。Meta Muse 등 경쟁 서비스의 후발 대응이라는 평가가 우세하며，Live 시연에서 반복 오류가 발생해 실시간 안정성은 아직 추가 검증이 필요한 단계다。\n\n이 구조 변화의 함의는 다음과 같다：\n\n1. **Dots와 GPT-6.1 Sol**: 모델의 절대 성능보다 추론 비용과 가격 대비 성능이 중요해지고 있어，Astra의 절대 성능 경쟁에서 벗어났다。\n2. **ChatGPT Space**: Microsoft 365와 Google Workspace가 담당하던 협업 SaaS 영역과 중첩되기 시작해서，AI 인프라에서 업무 플랫폼으로의 수혜 범위가 확장。\n3. **Marketplace**: ChatGPT를 앱 배포 플랫폼으로 만든다면，애플 App Store처럼 캐시코드 수익 모델이 가능해지는 구조로，AI 밸류체인의 수익 창출 경로가 변화。\n\n따라서 AI 밸류체인의 수혜 구조는 \"GPU→데이터센터→네오클라우드→AI 모델\"에서 \"AI 모델→에이전트→업무 플랫폼→앱 생태계\"로 이동 중이며，하나증권이 제시한 **AI 밸류체인 ETF**(WTAI +3.2%，BAI +2.7%，AIFD +2.6%)는 이 변화의 초기 수혜 구간에 포지셔닝되어 있다（하나증권）。단, 실제 수익화는 아직 초기 단계로，Codex 주간 사용자는 6월 500만 명에서 3,500만 명으로 급증하고 있지만，Pro 500 요금제는 월 500달러로，Plus 대비 25배 사용량을 보장하는 구조다（하나증권）。\n\n---\n"}, {"title": "3. 반도체：수출 호조 vs. 수익성 애로", "md": "## 3. 반도체：수출 호조 vs. 수익성 애로\n\n한국투자증권은 4분기에도 반도체 수출 호조가 이어질 전망이라며，AI 데이터센터 수요가 지속되는 상황이라고 분석한다。실제로 한국 9월 수출은 1,209억달러로 사상최대를 기록했으며，중국 9월 제조업 PMI가 기준선(50)을 상회해 2개월 만에 확장 전환이 이루어졌다（신한투자증권）。\n\n그러나 한편으로는 수익성 애로가 지속되고 있다：\n\n- 마이크론의 호실적과 자본지불 확대 전망，삼성전자 3Q 잠정실적，SK하이닉스의 모멘텀이 반도체 수출 호조를 연장시킬 수 있다고 한국투자증권은 전망하지만，\n- 유진투자증권은 9월 주식형 펀드 유입 속도가 크게 떨어졌고，9월 이후 외국인의 매도 압력이 강해진 것도 금리 상승 속도 부담 때문이다。금리 상승세가 주춤해야 외국인의 매도가 진정될 수 있다는 게 유진의 판단이다（유진투자증권）。\n\n또한，유안타증권은 9월 25일 미국 상원 의원 4명이「중국산 광트랜시버의 국가안보 시스템 진입 방지법(S.5548)」을 발의하고，中지쉬창(300308.CH)，Eoptolink(300502.CH) 등을 국가안보 시스템 조달 제한 대상으로 명시했다。법안은 현재 국가안보 시스템에 한정되어 있어 상업용 데이터센터 및 AI 인프라는 직접 규제 대상이 아니지만，향후 민간 AI 인프라도 확대될 수 있다는 우려가 부각되었다（하나증권）。\n\n즉，AI 인프라 수요는 확대 국면이지만，광트랜시버 공급망 취약성과 수익성 애로가 동시에 지속 중이다。한국투자증권은 수출물량 증가가 확인된 반도체와，수출물량 증가세가 나타나는 2차전지를 같이 주목한다는 입장이다（한국투자증권）。\n\n---\n"}, {"title": "4. 금리·유가·환율：3개 변수가 동시에 작동하는 구조", "md": "## 4. 금리·유가·환율：3개 변수가 동시에 작동하는 구조\n\n### (1) 금리：5%를 넘겼으나 인플레는 안정적\n\n- 미국 10년물은 5.2%，30년물은 5.5%를 돌파하며 할인율 부담이 가중됐다（신한투자증권）。\n- 8월 PCE 3.4%는 예상치를 하회했고，PCE 통계 개편 반영에서도 하회했다（신한투자증권）。\n- iM증권은 \"실질금리가 금리 상승을 이끌고 있다\"고 진단하며，긴축 공포가 아니라 성장 자체가 금리를 밀어 올랐다고 주장한다。그렇다면 금리 하락은 성장 둔화의 영향이 클 것으로 예상된다（iM증권）。\n\n### (2) 유가：사우디 동서 횡단 송유관 재가동 → 낙폭 축소\n\n- 주초 사우디 동서 횡단 송유관 재가동 소식으로 중동 원유 수출 회복이 확인되면서 WTI 낙폭이 축소됐다（키움증권）。\n- 그러나 주후반 미국의 중동 추가 �병력 배치 소식이 보도되면서 중동 정세 불안이 재부각됐다（키움증권）。\n\n### (3) 환율：프랑스 재정 악화 + 스페인 조기 총선택찰 → 유로화 17개월 최저\n\n- 프랑스의 재정 악화 우려가 지속되면서，스페인의 조기 총선 발표로 유로존 정치적 불확실성이 확대되었다（키움증권）。\n- 미국 금리 급등과 유럽 재정·정치 불안이 동시에 작동하면서，유로화는 17개월 만에 최저 수준으로 하락했다（키움증권）。\n\n---\n"}, {"title": "5. 외국인·기관 수급：코스피 3거래일 연속 하락，코스닥 2차전지·AI·보안 주강세", "md": "## 5. 외국인·기관 수급：코스피 3거래일 연속 하락，코스닥 2차전지·AI·보안 주강세\n\n### (1) 코스피：마이크론 호실적·수출 사상최대에도 3거래일 연속 하락\n\n- 주초：미국 장기금리 5.2% 돌파，국제유가 부담，외국인 대규모 순매도(3조원 안팎) → 삼성전자·SK하이닉스 5%대 급락，코스피 2.7% 하락（7,000선 탈환 실패）\n- 주중：미 10년물 5.2%，국제유가 상승 → 외국인 2~3조원 순매도，개인 2.7조원 순매수 → 지수 계속 하락\n- 주말：마이크론 호실적，9월 수출 사상최대，반도체 수출 급증 확인 → 반도체 업황 개선 기대 재부각，코스피 7,000선 재탈환，코스닥 반도체 장비주 급등（+5.78%）\n\n### (2) 코스닥：AI·보안·2차전지 강세，외국인 대규모 순매도에도 기관·외국인 순매수\n\n- 코스닥은 3개월 최고치(919.92P)를 기록했다（HLB +21%，주성엔지니어링 +17%로 시총 2위 진입）\n- 외국인은 코스피에서 8조 3,150억원 순매도，코스닥에서는 기계/장비(-469억원)，금속(-420억원)，일반서비스(-418억원)，음식료/담배(-366억원) 순으로 순매도\n- 기관은 코스피에서 -9,718억원 순매도，IT서비스(-821억원)，유통(-303억원)，통신(-211억원)，일반서비스(-161억원) 순으로 순매도\n\n---\n"}, {"title": "6. 투자 전략：악재는 회피，숫자로 대응", "md": "## 6. 투자 전략：악재는 회피，숫자로 대응\n\n### (1) 코스피：6,400~7,600p 밴드 제시，매크로 불확실성과 유동성 약화가 상단 제약\n\n- 한국투자증권은 코스피 10월 밴드를 6,400~7,600p로 제시했다（12MF PER 5.0~5.9배）\n- 증시 유동성 환경이 상반기 대비 위축된 가운데 매크로 불확실성이 잔존한 점이 지수 상단을 제약\n- 그러나 주도 업종의 견고한 성장성과 시장금리 반락 기대가 하방 경직성을 지지한다고 판단（한국투자증권）\n\n### (2) 업종별 선택：AI 인프라·하드웨어·전력，에너지(정유)는 높아진 주가로 인해 조정 시 매수 관점\n\n- AI 인프라 투자와 관련된 반도체、하드웨어、전력 등은 투자비중을 유지해야 한다\n- 에너지(정유)는 높아진 주가로 인해 조정 시 매수 관점으로 접근（한국투자증권）\n\n### (3) KOSPI200/KOSDAC150 12월 정기변경：GICS에서 KRICS로의 큰 변화\n\n- KRX Industrial Classification System(KRICS) 도입：\n   - 9개 섹터：에너지화학，소재，산업재，모빌리티，정보기술(IT)，금융 및 부동산，소비재，헬스케어，미디어 및 콘텐츠\n- 가장 큰 변화：\n   1. GICS 자유소비재 섹터 내 \"자동차 및 부품\"(GICS 2단계)을 독립 섹터로 승격 → \"모빌리티리\"\n   2. GICS 에너지，유틸리티，소재 섹터의 \"기초화학\"을 통합 → \"에너지/화학\"\n   3. GICS 자유소비재(제외) + 필수소비재 = \"소비재\"\n   4. GICS 커뮤니케이션 서비스 → \"미디어·콘텐츠\"\n   5. GICS 금융 + 부동산 → \"금융/부동산\"\n\n---\n"}, {"title": "7. ETF 포지셔닝：DRAM 반도체 플러스，SMH/FTXL，POWR/GRID，PAVE 활용", "md": "## 7. ETF 포지셔닝：DRAM 반도체 플러스，SMH/FTXL，POWR/GRID，PAVE 활용\n\n### (1) SOL 글로벌 DRAM 반도체 플러스 ETF\n\n- 포트폴리오：삼성전자(25%)，SK하이닉스(25%)，Micron(25%)，SanDisk，Lam Research，Kioxia，Applied Materials，Seagate Technology，Western Digital，KLA Corp（총 10개 기업）\n- 리벨런싱：연 4회（3월/6월/9월/12월 마지막 영업일의 10영업일 전에 편입 종목 확정，마지막 영업일에 비중 확정，3영업일 후 변경 실행）\n- 보수：0.45%\n- AI 데이터센터의 핵심 병목 영역으로，하이퍼스케일러들의 투자 확대로 강한 수요 지속（하나증권）\n\n### (2) 글로벌 ETF 트렌드：북미 중심의 ETF 시장 확장\n\n- 주식형 ETF：북미 +130.5억달러，선진 글로벌 +115.9억달러 → 총 +289.2억달러 순유입\n- 채권형 ETF：북미 +246.8억달러，선진국 +273.4억달러，신흥국 +31.3억달러（아시아 중심）（하나증권）\n\n---\n"}, {"title": "8. Risk-On/Risk-Off：Market Breadth 축소 국면，Barbell 전략 고려", "md": "## 8. Risk-On/Risk-Off：Market Breadth 축소 국면，Barbell 전략 고려\n\n하나증권은 Market Breadth 축소 국면에서 \"VVO/QQQ，SMH/FTXL，POWR/GRID，PAVE 등 활용\"을 권고한다。즉，모멘텀이 집중된 국면에서 수익률이 높은 종목군과 함께，하락 국면에 강한 고배당주를 병행하는 Barbell 전략을 고려하자고 제안한다（하나증권）。신한투자증권도 미국 10년물이 5% 이상 고착될 경우 핵심 기술주와 은행 등 고배당주 병행을 선호한다고 밝힌바 있다（신한투자증권）。\n\n---\n"}, {"title": "Summary Table", "md": "## Summary Table\n\n| 항목 | Key Point |\n|------|-----------|\n| 주식형 펀드 | -$101.8억 → +$157.6억 순유입 전환 / 액티브 -$97.4억 순유출（유안타） |\n| 채권형 펀드 | 장기채 52주 내 최대 +1.01%（유안타） |\n| 금리 | 10년물 5.2%，30년물 5.5% → 할인율 부담（신한，키움） |\n| PCE | 3.4%（예상치 하회），PCE 통계 개편 반영 하회（신한，iM） |\n| 코스피 | 3거래일 연속 하락（-1.09%）→ 마이크론 호실적·수출 사상최대로 7,000선 재탈환（키움） |\n| 코스닥 | 2.98% 대폭 상승（+5.78%）→ AI·보안·2차전지·반도체 강세（키움） |\n| 외국인 수급 | 코스피 -8조 3,150억원 순매도（기관 -9,718억원）/ 코스닥 기관·외국인 순매수（키움） |\n| AI 밸류체인 | 메모리→에이전트→업무 플랫폼→앱 생태계로 무게중심 이동（하나） |\n| 반도체 | 수출 사상최대 1,209억달러（신한），광트랜시버 미국 법안 발의（하나） |\n| 12월 ETF 리벨런싱 | GICS → KRICS：모빌리티리，에너지/화학，소비재，미디어·콘텐츠，금융/부동산（유진） |\n\n--- \n"}, {"title": "Conclusion for Investors", "md": "## Conclusion for Investors\n\n10월의 핵심은 3Q 실적 발표와 10월 FOMC 의사록이다。금리 상승 국면이 성장을 반영한 상태라면，금리 피크아웃 확인이 다음 단계로 남아 있다(iM)。8월 PCE 3.4% 하회와 제퍼슨 연준 부의장의 완화적 발언은 금리 하락 전환 신호로 읽힐 수도 있다(yuantas)。둘의 논리가 동시에 작동 중인 구조다。3Q 실적에서 추가 인상을 요구하는 데이터가 나오지 않는다면，금리 하락 전환이 가능해지는 조건이 만들어진다。\n\nAI 밸류체인은 메모리에서 에이전트→업무 플랫폼→앱 생태계로 이동 중이다。하나증권이 제시한 AI 밸류체인 ETF(WTAI, BAI, AIFD)는 이 변화의 초기 수혜 구간에 포지셔닝되어 있다。반도체는 수출 호조가 이어질 전망이나，광트랜시버 공급망 취약성과 수익성 애로가 동시에 지속 중이다。코스피는 6,400~7,600p 밴드에서 거래될 전망이며，AI 인프라·하드웨어·전력이 우선 포지셔닝 대상이다。에너지(정유)는 높아진 주가로 조정 시 매수 관점，외국인·기관 수급이 약화된 국면에서 Barbell 전략(high-beta + high-dividend)을 병행하자。10월 중순 국내 반도체 기업의 자사주 매입 종료 이후 수급 공백 우려는 크지 않은 것으로 판단된다(yujin)。\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n시장은 미국 고용 부진과 인플레이션 지표의 이중성, AI 투자에 따른 K자형 경기 구조, 그리고 글로벌 금리와 환율의 복합적인 움직임 속에서 진입점을 찾고 있다. 고용 시장의 균형 회복과 기업 비용 압력의 지속은 연준의 금리 정책에 모호함을 남기며, 이는 장기금리의 하락을 제한하는 요인으로 작용한다. 한편, AI 투자와 반도체 수출, 공공 투자 확대 등은 한국 경제에 대한 긍정적 모멘텀을 제공하고 있다. 그러나 산업 섹터 내부에서는 ODM 업체들의 수요 부담, 환율 효과 감소, 경기 정점 인식 등으로 인한 변동성이 커지고 있다. 이러한 상황 속에서 시장은 단정적인 방향성을 보다는, 여러 요인의 상호작용을 고려한 유연한 접근이 필요해 보인다."}]}</script>
