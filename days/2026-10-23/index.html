<script id="__DATA__" type="application/json">{"date": "2026-10-23", "headline": "AI 투자 사이클의 현실화 과정과 시장 불안", "market": {"KOSPI": {"label": "코스피", "value": 5550.3, "change": 0.3, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 751.69, "change": -1.62, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1325.0, "change": -0.11, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 103.27, "change": 3.82, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4007.9, "change": -1.29, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 4.999, "change": 4.56, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.099, "change": -4.5, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52215.16, "change": -1.23, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7623.68, "change": -0.52, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 25955.34, "change": -0.21, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **WTI 유가** 상승 +3.82% (현재 103.27, 전일 99.47)\n\n### 관련 뉴스\n\n---\n\n**WTI 유가 상승 +3.82%**\n\n복합적인 중동 공급 위험이 동시에 부각된 것이 주요 원인이다.\n\n**1. 사우디 아람코 본사(다란) 직원 대피**\n후티 드론 공격 경보로 아람코가 본사 직원 전원을 원격근무 전환. 사우디 핵심 에너지 인프라 안전 우려가 즉각 유가 상승으로 이어졌다.\n*Reuters, Bloomberg, France24 (10월 22일, 163개 독립 언론)*\n\n**2. 미국·이스라엘의 이란 공격 → 호르무즈 해협 봉쇄 우려**\n브렌트유가 $114 돌파하며 \"중동 에너지 공급 우려 재부상\"으로 보도됨. WION은 호르무즈 해협과 리비아 리스크를 원인으로 명시했다.\n*TASS, EFE, WION (10월 23일, 121개 독립 언론)*\n\n**3. 트럼프, 국방생산법(Defense Production Act) 석유 부문 발동**\n이란 공격 이후 유가·경유 가격 급등에 대응해 석유 생산·정제·저장 지원 명령 서명. \"미국도 공급 충격을 현실로 인정\"이라는 시그널로 시장이 받아들였다.\n*Reuters, CNBC, TIME (10월 22일, 96개 독립 언론)*\n\n**4. 아람코 CEO: \"위기로 글로벌 원유 공급 30억 배럴 감소\"**\n아민 나세르 CEO가 인터뷰에서 현 위기의 에너지 시장 충격을 \"전례 없는 수준\"으로 표현, 동-서 파이프라인 용량을 700만 배럴/일로 확대 중이라고 밝혔다.\n*Al Arabiya English, Mathrubhumi (10월 22일, 40개 독립 언론)*\n\n**요약:** 미국·이스라엘의 이란 군사 행동 → 호르무즈 봉쇄 우려 → 후티의 사우디 시설 공격 → 공급 차질 현실화 우려가 연쇄적으로 유가를 밀어올린 구도다.\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### AI 투자 사이클의 현실화 과정과 시장 불안\n\nAI 투자 사이클의 지속 가능성에 대한 의구심이 확대되면서 주식시장이 급락하고 미국 시장금리도 하락하는 등 금융시장 불안이 높아지고 있다. AI 투자 수요는 여전히 양호하지만, 그동안 투자 확대와 성장에 대한 기대가 빠르게 높아진 가운데 고금리에 따른 자资本조달 비용 부담까지 커지면서 투자 수익성과 지속 가능성에 대한 의구심이 확대되고 있다. 특히 AI 관련 투자가 단기간에 큰 폭으로 증가하면서 향후 성장에 대한 시장의 눈높이도 높아졌지만, 실제 투자 성과와 수익화 속도가 이를 뒷받침할 수 있는지에 대한 검증은 아직 진행 중이다.\n\n이러한 상황에서는 AI 투자 사이클의 방향성이 꺾이기보다는 높아진 기대가 현실화되는 과정에서 성장 속도와 투자 대상에 대한 재평가가 나타나는 것으로 볼 수 있다. AI 인프라 구축과 활용 확대에 따른 중장기 수요의 확장성을 고려하면 투자 확대를 통한 성장 기대는 여전히 유효하다. 다만 과거처럼 투자 확대 자체가 긍정적으로 평가받기보다는 높은 자본비용을 감당하면서 실제 수익을 창출할 수 있는지가 더욱 중요해지는 국면에 진입하고 있다. 결국 AI 투자 사이클의 지속 여부뿐 아니라 성장 속도와 기업별 투자 여력 및 수익성에 따른 차별화가 나타날 가능성이 높다.\n\n이러한 상황에서 금융시장의 투자심리가 회복되기 위해서는 자본조달 여건의 안정과 기업들의 수익성에 대한 신뢰 회복이 필요하다. 단기적으로 경기 둔화 우려를 반영한 금리 하락은 위험자산 선호에 부담으로 작용할 수 있다. 그러나 최근 AI 투자 사이클에 대한 우려가 높은 자본비용에서도 비롯되고 있다는 점을 고려하면, 시장금리의 추가 상승이 제한되는 것은 투자 지속 가능성에 대한 불안을 완화하는 요인이 될 수 있다. 특히 AI 관련 투자는 대규모 선행투자가 필요한 만큼 자본조달 비용의 안정 여부가 향후 투자 계획과 수익성에 중요한 영향을 미칠 수 있다. 시장금리가 안정을 찾고 주요 기업들의 실적을 통해 견조한 AI 수요와 수익 창출 가능성이 확인된다면, 점차 경기 둔화 우려보다 투자 사이클의 지속 가능성에 시장의 관심이 옮겨갈 여지가 있다.\n\n이런 측면에서 다음 주 예정된 10 월 FOMC 에서 연준이 최근 AI 투자 사이클에 대한 우려와 주식시장 하락을 어떻게 평가하는지가 중요해졌다. 최근 미국 물가지표의 상승과 높은 국제유가를 고려하면 연준이 인플레이션에 대한 경계감을 쉽게 낮추기는 어려울 전망이다. 다만 물가 대응에 무게를 두했던 연준이 성장 둔화 가능성과 금융시장 불안에 대해서도 이전보다 신중한 시각을 드러낸다면 향후 통화긴축 강도에 대한 시장의 기대에도 변화가 나타날 수 있다. 이는 당장 통화정책의 방향 전환을 의미하지 않더라도 시장금리의 추가 상승 압力を 일부 완화하며 자본조달 여건 안정에 기여할 여지가 있다. 물론 금리 안정만으로 투자심리가 빠르게 회복되기는 어렵고, 주요 AI 기업들의 실적을 통해 투자 수익성에 대한 신뢰가 확인되는 과정도 필요하다. 결국 현재 금융시장의 불안은 AI 투자 사이클의 종료보다는 높아진 기대가 현실화되는 과정에서 나타나는 성장통의 성격이 강하다고 볼 수 있으며, 이러한 조정 과정에서 단기적인 변동성은 이어질 수 있지만, AI 투자에 기반한 중장기 성장 흐름은 여전히 유효하다.\n\n### 신용위험의 경로와 2023년의 교훈\n\nAI 기업이 직접적인 도화선이 되기보다는 소외된 부실기업이 금융시스템의 약한 고리를 타고 금융환경을 변화시키고 이 변화가 투자를 조정 시킴으로써 이번 확장 사이클이 마무리되는 경로이다. 신용위험에 대한 우려가 투자자들의 관심을 환기시키는 모습이다. 특히 최근 코어위브 사태를 계기로 투자자들의 관심도 높아지고 시장의 불안감도 증가했지만 이번 경기 국면에서 AI 기업이 직접적인 도화선이 되는 신용위험 가능성은 낮다는 판단이다. 무엇보다 관심과 지원이 집중되어 있다는 점 때문이다. 그리고 AI 투자의 중심이 되는 기업들은 여전히 막대한 현금흐름을 유지하고 있고 이 현금을 고리로 연관기업들과 엮여 있다는 점도 당장의 부도위험은 줄이는 요인이다.\n\n이번 경기 사이클은 AI를 중심으로 한 투자가 견인하고 있는 만큼 신용 상황의 변화는 투자 흐름에 변화를 주는 요인이고 결국은 신용위험의 증가가 투자를 위축시키거나 계획을 조정하게 함으로써 이번 경기사이클이 마무리되는 것이다. 출발은 양극화로 인한 신용위험의 증가다. AI 기업들에 투자와 수익이 몰리며 양극화가 심화되고 이 과정에서 수익에서 장기간 소외되고 자금 조달 경로마저 잠식당하는 기업들의 부도나 연체가 빠르게 증가하는 흐름으로 전개되는 것이다. 소외 기업들의 부실화는 금융시스템의 약한 고리를 타고 들어올 가능성이 높은데 그 약한 고리는 가장 신용도가 낮은 기업들이 자금을 조달하는 사모대출 시장일 것이고 사모신용 시장에 자금을 공급한 금융기관들의 피해가 현실화 되고 드러남으로써 전반적인 금융시장의 어려움이 심화될 수 있다는 판단이다.\n\n금융시장이 어려워지면서 높아진 비용과 좁아진 자금 조달 경로라는 환경이 결국 AI 관련 기업들의 투자를 조정시킴으로써 투자에 의해 견인되던 이번 경기사이클은 종료될 것이라는 전망으로 종결된다. 이 흐름은 이미 진행 중이며 최근 정크본드 수익률의 가파른 상승이나 자금 조달 스트레스 상승 그리고 소리 없는 파산의 증가 흐름 등은 이를 반증하는 지표들이라는 판단이다. 최근 뉴스에서 주목하는 것처럼 신용등급이 CCC 등급인 정크본드들의 가산금리가 가파르게 상승하고 있다. 미국 회사채 시장에서 정크본드 채권이 차지하는 비중이 10% 미만이고 BB 등급 이상의 상위 등급 채권 가산금리가 안정적이라는 점을 감안하면 아직 우려할 만한 신호는 아니라는 해석도 많지만 신용위험 국면이 항상 가장 취약한 부분에서 시작되고 정크본드 가산금리가 일종의 시그널 역할을 해왔다는 점을 감안하면 간과하기 어려운 부분이다.\n\n더 중요한 것은 자금조달의 스트레스도 뚜렷하게 상승하고 있다는 점이다. 기업의 자금 조달 비용과 전반적인 신용 시장의 건전성을 보여주는 미국 회사채 스트레스지수는 뚜렷하게 상승 중이다. 기업자금 조달 여건이 악화되고 있는 것으로 가산금리의 가파른 상승이 정크본드를 넘어 상위 등급으로도 확산될 수 있음을 의미한다. 조금 더 큰 흐름에서 보면, 2023년 이후 미국경제가 호황을 누리고 있음에도 불구하고 조용하게 파산 기업수가 계속 증가하고 있는 것도 주목해 보아야할 사안이다. 앞서 언급한 양극화라는 구조적인 요인이 실제 경제에 불안한 흔적을 남기는 것인데 이 증가 흐름은 올해도 진행 중이다. 점증하는 신용위험의 증가와 소리 없는 파산은 금융시스템과 연결되는 약한 고리인 사모신용의 부도율 상승으로 연결되고 있다. 사모신용 문제는 연초 사모신용 환매 사태때 관심이 높았지만 미국과 이란 간의 전쟁이 길어지고 여러가지 경제 뉴스들이 난립하며 투자자들의 관심에서 벗어나 있는 모습이지만 지난해 4% 대에서 움직이던 사모대출 부도율은 지속적으로 가파르게 상승해 6%를 넘어서고 있다.\n\n### AI발 안전자산 초강세, 주목해야 할 지표는\n\n미국 국채 및 엔 동반 초강세가 나타난 이유는 다음과 같다. 고물가, 재정리스크 및 자금수요 급증 등으로 5%초반대를 유지하던 미국 10년 국채금리가 4.959%까지 급락했다. 미국 10년 국채금리가 5.0%선을 하회한 것은 지난달 23일 이후 처음이다. 미국 국채와 더불어 안전자산으로 평가받고 있는 엔화 가치도 급등했다. 일본 정부의 외환시장 개입에도 별다른 반응을 보이지 않았던 달러-엔 환율은 22일 종가기준 전일대비 0.87% 급락한 156.76엔을 기록했다. \n\n동반 약세를 보이던 미국 국채와 엔화가 동반 강세로 전환된 것은 금융시장이 신용 혹은 경기 침체 리스크를 슬슬 염두에 두기 시작한 시그널로도 해석해 볼 수 있다. 중동발 리스크에 따른 고유가현상 장기화 및 시간이 갈수록 증폭되고 있는 프랑스 재정리스크에 이어 AI발 불안마저 가세한 것이 경기 불안 심리와 함께 안전자산 선호 심리를 자극한 것이다. 특히, 메타발 AI 투자 우려가 안전자산 선호 심리를 자극하는 기폭제 역할을 했다.\n\n### AI 투자 불확실성 속 연준의 경기 인식에 주목\n\n다음 주 금융시장은 한국과 미국의 3 분기 경제성장률과 10 월 FOMC 에 주목할 전망이다. 한국의 3 분기 경제성장률은 기저효과 등으로 전년동기 대비 증가율이 둔화되겠지만, 전기 대비로는 증가세를 이어가며 반도체 수출 호조에 기반한 양호한 성장 흐름을 확인할 수 있을 것으로 보인다. 미국 역시 3 분기 경제성장률이 전기 대비 연율 3%대로 예상되면서 지난 2 분기(2.2%)보다 개선될 것으로 전망된다. 다만 최근 AI 투자 사이클의 지속 가능성에 대한 의구심이 높아지고 있다는 점에서 양호한 성장률이 시장에 주는 안도감은 제한적일 수 있다. 오히려 미국 주요 AI 관련 기업들의 실적 발표에서 확인되는 설비투자 계획과 수익성이 향후 경기 방향에 대한 기대를 좌우할 가능성이 높아 당분간 이들 기업의 실적에 더욱 주목할 필요가 있다. \n\n최근 AI 투자 사이클을 둘러싼 우려가 확대되면서 주식시장이 급락하고 미국 시장금리도 하락한 만큼, 10 월 FOMC 에서 연준이 어떤 메시지를 내놓을지가 중요해졌다. 기준금리 동결이 시장의 컨센서스인 상황에서 관건은 연준 의장의 경기와 물가에 대한 평가일 것이다. 이미 발표된 물가지표들이 시장 예상을 상회했고 국제유가도 높은 수준을 유지하고 있어 인플레이션에 대한 경계감이 조기에 완화되기는 어려워 보인다. 다만 AI 투자 사이클의 지속 가능성에 대한 우려가 연준의 성장 전망에도 변화를 가져왔는지 살펴볼 필요가 있다. 연준이 이전보다 성장에 대한 우려를 드러낸다면 물가 대응에 무게를 두었던 통화정책 기조가 경기 여건도 함께 고려하는 방향으로 이동할 가능성이 있기 때문이다. 이는 12 월 추가 금리 인상이 단행되더라도 내년 긴축 강도는 제한적일 수 있다는 기대로 이어지며 시장금리의 추가 상승을 제약하는 요인으로 작용할 수 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 금통위 후 재료별 시장 반응이 또 다른 방향으로 돌아섰다\n\n### ① 기자회견 말미의 물가 목표 달성 시점 발언은 '강세 재료'였다가 결국 '하락 이유'가 됐다\n신현송 총재는 기자회견 말미에 \"물가 목표 달성을 내년에 해야하는 것은 아니다\", \"인flation target attainment is not necessarily in next year\"라는 발언을 했다. 이는 시장이 물가 목표 달성 시기를 2025년보다 늦춘다는 인상을 줄곧 기대했던 분위기에 큰 변수로 작용했다.\n\n유진투자증권은 \"총재가 금통위원들의 인상 소수의견을 '기존 관행과 달리 금통위원장(통방문) 소수의견 개진이 향후 통화정책 방향성을 암시하지 않는다'고 직접 설명하면서, 2026년 10월 금통위를 기점으로 소수의 의견이 기능하지 않는다는 입장을 정리했다\"고 설명했다. 이는 사실상 '인상 소수의견=추가 인상 가능성'이라는 시장 기존 해석을 스스로 반박하는 발언이었다.\n\nIBK투자증권은 \"이렇게 되면 인상 소수가 없었던 만장일치 동결과 아무런 차별성이 없어진다. 오히려 인상 소수의견이 있었더라도 동결로 끝났다면 그만큼 인상 가능성은 낮았다\"는 논리를 택했다. 유진투자는 \"인상 소수의견이 2026년 8월 통방문부터 다시 제기되었음을 감안하면, 신현송 총재가 2026년 8월 통방문과 10월 통방문 사이에 인상 소수의견이 존재한다는 걸 알고 있었어야 하는데, 이를 의도적으로 묵살했다\"고 추론했다.\n\n두 입장 모두 신현송 총재의 발언이 금통회의 의사결정에 직접적인 변화를 만들어냈다고 보기 어렵다는 점에서 같다. 하지만 IBK투자증권은 \"이 발언이 2026년 10월 통방문을 포함한 모든 통방문에서 소수의견이 기능하지 않는다는 새로운 규칙을 만들었다\"고 주장한다.\n\n### ② 물가 전망 상향과 긴축 유지 발언이 금리 방향을 두 번 바꿔놨다\n한은은 기자회견에서 \"물가 상승 압력은 여전히 높다\"고 밝혔다. 그러나 이는 신현송 총재가 기자회견 말미에 \"물가 목표 달성을 내년에 해야하는 것은 아니다\"라는 발언을 앞서고 있었다. 즉, 물가 상승 압력을 인정하면서도 그것을 기준금리 인상으로 연결시키지 않는 모습을 보였다.\n\n이 리아 디스카운트 해소 방침을 내걸었다\"\n\n- **ADR 괴리율 46.8%**: 한국 SK하이닉스 본주의 시가총액이 미국 ADR 시가총액의 **약 2배**(1/(1+0.468)=57%) 수준임을 의미.\n- **투자 심리의 이중 구조**:\n  - 한국: ADR 괴리가 존재 = **내부 시장의 저평가** 또는 **외부 투자자 참여의 제한**\n  - 국제: ADR의 높은 가격은 같은 기업이라도 **글로벌 시장에서의 신뢰도/투명도 높음**을 시사\n\n→ **투자 결정의 이중성**: ADR 괴리율은 한국 시장의 내부적 저평가 논란을 부추기는 동시에, 외국인이 한국 시장에 접근할 때 ADR이 선택되는 경로를 만들어내는 이중적인 역할 수행.\n\n---\n\n### 4. **화장품: 수출 실적은 양호하나 주가 흐름은 극단적 변동성**\n\n> 한국투자증권 | \"Bi-weekly: Charts of Week: 양호한 업황과 그렇지 못한 주가\"\n\n- **HS Code 3304 기준 2026년 10월 1~20일**:\n  - 전체 수출: 6억 6,073만 달러 (+80% YoY), 조업일수 고려:+45.4%\n  - 9월 1~20일 중국향 수출: **잘못 입력**으로 인한 전월대비 소폭 하락. 중국을 제외한 수출: -13.3% MoM (-3.4% 조업일수 고려)\n  - **10월 1~20일 수출**은 9월에 비해 **대규모 물량이 아니었던 것**으로 추정. 9월 1~20일에 이미 10월 쇼핑 행사를 대비해 수출을 집중했다.\n\n---\n\n### ✅ 10월 수출 실적의 핵심 요인\n\n| 항목 | 수치 | 의미 |\n|------|------|------|\n| 미국향 | +35.6% YoY, +7.4% MoM (조업일수 고려) | 가장 견고한 수요처 |\n| 중국향 | 9월 1~20일 실수로 인한 전월대비 소폭 하락 | 중국을 제외한 수출은 13.3% 하락 (-3.4% 조업일수 고려) |\n\n→ **10월 1~20일 전체 수출은 양호한 흐름**. 그러나 9월 초에 이미 10월 쇼핑 행사를 대비해 물량을 수출했다는 사실이 중요한 맥락.\n\n---\n\n### ❓ 주가 흐름의 극단적 변동성: 왜?\n\n> 한국투자증권 | \"다음 주 관심 종목: 한국콜마\"\n\n- **시장 전체 흐름**: 코스피 -0.4% WoW\n- **종목별 움직임**:\n  - 달바글로벌: +3.3% WoW (최근 주가 하락폭이 가장 컸기 때문)\n  - 코스맥스: -3.9% WoW (지난주까지 주가 흐름이 좋았음)\n\n→ **변동성의 극단성**: 코스피 지수와 함께 하는 것이 아니다. 이벤트 리셋이 발생하지 않았다면, 이 극단적 변동성은 **투자 심리의 극단적 회복/낙관/실패를 반영**하는 것으로 해석 가능.\n\n---\n\n### 🔄 한국콜마: 내년 7월 세종공장 준공, 수요 대응으로 주가 매력\n\n- **세종공장**: 내년 7월 준공 예정, 현 수준보다 크게 확대\n- **환경**: 9월 1~20일에 10월 쇼핑 행사를 대비해 물량을 수출한 것도, 한국콜마가 이러한 수요를 예측하고 대응하고 있었음을 시사\n- **유럽 시위**: 이탈리아·프랑스에서 발생했으나, 한국 화장품 기업들의 유럽 매출 감소 및 통관 이슈는 나타나지 않았음\n  - **단, 사태가 심각해질 경우**: 운임가격 상승과 유럽 시장 내 수요 위축이 발생할 수 있으므로, 주가에 직접적인 영향을 줄 수 있음\n\n→ **투자 판단 기준**: 3분기 실적에 대한 눈높이 조정이 끝났고, 해외 노출도가 높지 않은 기업이 유리. 한국콜마는 대표적.\n\n---\n\n### 5. **Optimus: 외부 판매 시작 목표, B2C는 B2B 상용화 이후 단계**\n\n> iM증권 | \"Optimus 양산 시작 확인: 관련 유니버스 점검\"\n\nTesla의 3Q26 컨퍼런스 콜에서 확인된 Optmus 관련 정보:\n\n- **프리몬트 대량생산 라인에서 Early Ramp 착수**: 표준 생산 품질 충족\n- **오스틴 라인 건설 중**: 프리몬트 라인을 위한 주요 설비는 이미 준비됨\n- **Year 100만대 목표 유지**: 1년 이상 소요될 것\n- **데이터 수집 목적**: 초기 생산 대수 1~2만대는 데이터 수집에 활용\n- **Cybercab 최종 원가 수렴**: 최종 2~3만불을 목표\n- **CPU**: 27년 4월 AI 5 Chip 탑재\n- **외부 판매 시작**: 27년말부터 시작, 우선 B2B(B2C 이후 단계)\n- **첫 B2B 산업군**: 위험하거나 반복적인 작업이 24시간 가동되어야 하는 분야\n\n→ **투자 포인트**: 외부 판매 시작 시점이 27년말로 설정됨. 외부 고객 인도 물량 중 우선 공급할 산업군이 특정됨. B2C는 B2B 상용화 이후 단계. 따라서 **B2B 수요의 성숙도가 외부 판매의 실현 가능성**을 좌우.\n\n---\n\n### 6. **강원랜드: 객실 리노베이션, 디레버리징, 영업이익 소폭 하회**\n\n> iM증권 | \"카지노 업황 점검: 정책 불확실성 해소가 관건\"\n\n- **3분기 영업이익**: 600억원 (-17%) → 컨센서스 소폭 하회\n- **주요 원인**: 객실 리노베이션에 따른 디레버리징\n- **주주환원 기대**: 주가 하방 지지, 연초 대비 하락률 25%에 그침\n\n→ **투자 판단 기준**: 리노베이션이 실적 공백을 가져왔으나, 주주환원 기대가 주가 하방을 지킴. 정책 불확실성 해소가 향후 투자 매력에 결정적 역할.\n\n---\n\n### 7. **파라다이스: 3분기 실적 상회, 4분기 실적 모멘텀 지속 가능성**\n\n> iM증권 | \"카지노 업황 점검: 정책 불확실성 해소가 관건\"\n\n- **3분기 실적**: 드롭액 2조원 (+8% YoY), 홀드율 12.9% (+1.6%p), 영업이익 544억원 (+38%) → 컨센서스 상회\n- **4분기 실적 모멘텀**: 드롭액 2조원 기대, 홀드율 14% 목표 → 영업이익 700억원 예상\n\n→ **투자 판단 기준**: 3분기 실적 상회와 4분기 드롭액 2조원, 홀드율 14% 목표는 모멘텀 지속을 시사. 정책 불확실성 해소가 관건.\n\n---\n\n### 8. **롯데관광개발: 3분기 실적 하회, 9월 테이블 홀드율 10.8%는 일시적**\n\n> iM증권 | \"카지노 업황 점검: 정책 불확실성 해소가 관건\"\n\n- **3분기 실적**: 드롭액 8,760억원 (+3%), 홀드율 15.9% (-1.8%p), 영업이익 391억원 (-26%) → 컨센서스 하회\n- **9월 테이블 홀드율**: 10.8% → 직전 12개월 평균(20.0%)의 절반\n- **해석**: 수요 둔화보다는 일시적 변동\n\n→ **투자 판단 기준**: 홀드율은 장기적으로 평균에 수렴할 것으로 판단. 투자 판단 기준은 방문객과 드롭액.\n\n---\n\n### 9. **GKL: 3분기 실적 하회, 기타 VIP 감소로 성장 폭 제한**\n\n> iM증권 | \"카지노 업황 점검: 정책 불확실성 해소가 관건\"\n\n- **3분기 실적**: 드롭액 9,903억원 (+2%), 홀드율 11.1% (-0.1%p), 영업이익 148억원 (-14%) → 컨센서스 하회\n- **원인**: 기타 VIP 감소 + 마케팅 비용 증가\n\n→ **투자 판단 기준**: 드롭액 증가를 이익과 현금흐름으로 연결할 수 있는 기업의 투자 매력이 부각될 것.\n\n---\n\n### 10. **STELLANTIS: 9월 YoY +4.7%, Fiat +24.3%, Citroen +10.0%**\n\n> IBK투자증권 | \"[Europe Tracker] 유럽 자동차 9월: BEV YoY +72.9%, YTD 점유율 22.7%로 가솔린 추월\"\n\n- **Stellantis 9월 YoY +4.7%**\n  - Fiat: +24.3%\n  - Citroen: +10.0%\n- **전체 YoY +9.3%**: EU 신차 등록 97.1만대\n\n→ **투자 판단 기준**: Stellantis는 9월 YoY +4.7%, Fiat은 +24.3%, Citroen은 +10.0%. 전반적인 YoY +9.3%.\n\n---  13.1% 감소했다. AI DRAM 수요 확대에도 불구하고 수익성 악화가 눈에 띄었다\n\n이런 디테일은 메타와 테슬라가 이미 'AI 투자 지속 가능성'이라는 게임의 기본룰을 깨뜨린 상태라는 것을 시장에게 알려줬다. 이전엔 스페이스X와 슈퍼마이크로가 AI 투자 지속성에 대한 신뢰를 일부 다잡긴 했는데, 이제는 하이퍼스케일러까지 신용 문제가 포착되면서 투자는 선택적 접근으로 전환되고 있다(Supermicro의 Q3 매출은 185~195억달러로 시장 기대치 152억달러를 28% 이상 상회했다).\n\n### 2. AI 신용 불안 & 유가 상승 = 반도체 Top2 주주환원이 수급 공백을 메울까?\n\n삼성전자와 SK하이닉스의 주주환원 여부가 시장의 숨통이 될 수도 있다. 현재 SK하이닉스의 자사주 매입은 21일 종료돼 외국인이 주도했던 수급 공백이 완전히 사라져 버렸다. 삼성전자도 Q3 잔여 주식 보유량이 3.5% 미만이라 자사주 매입 공간이 없다. 이전에는 자사주 매입이 외국인 매도 물량을 흡수하는 중요한 티저 역할을 했으므로, 반도체 Top2가 추가 주주환원 방안을 제시해야 한다는 요구가 자연스럽게 생긴다.\n\n### 3. 유가의 2중 압력: 중동 공급 차질 & 이란-미국-이스라엘 충돌\n\nWTI는 3거래일만에 $99.47 → $103.27로 +3.82% 급등했다. 중동 리스크가 두 축으로 동시에 확산되고 있다:\n\n- **사우디**: 아람코 본사(Dharan) 직원 전원이 직무 수행을 위해 원격 근무로 전환했다. 이곳은 아람코의 핵심 운영 센터다. 동시에 사우디 핵심 에너지 인프라에 대한 후티의 공격 가능성으로 인해 경찰력이 강화되었다.\n- **이란-미국-이스라엘 충돌**: 트럼프 행정부가 국방생산법(Defense Production Act)을 석유 부문에 발동했다. 이는 석유 정제·저장·수송에 대한 지원 명령을 의미하는데, 미국이 공급 충격을 현실로 인정한다는 시그널로 받아들여졌다. WION은 호르무즈 해협 봉쇄 우려와 리비아 리스크를 병렬적으로 원인으로 제시했다.\n- **아람코 CEO 발언**: \"현재 위기로 글로벌 원유 공급이 30억 배럴이나 감소했다\"고 주장했다. 이는 중동 공급 차질이 단기적 파괴가 아니라 장기간 공급 구조 변경을 암시하는 것이다.\n\n### 4. KOSPI의 4개 축인 이유\n\n코스피는 3.52% 급락했는데, 이 급락의 구조가 다음과 같았다:\n\n| 원인 | 수치/특징 |\n|------|-----------|\n| 1) 메타·테슬라·램리서치 실적 | 메타 FCF 적자, 테슬라 CapEx 감소, 램리서치 GPM↓ |\n| 2) AI 수익성 의구심 | 메타와 테슬라의 AI 인프라 투자 비용이 지속 가능한 수준인지에 대한 의심 확산 |\n| 3) AI 수익성 의구심 | 램리서치의 AI DRAM 수요 확대에도 불구하고 GPM이 전분기 대비 ↓ |\n| 4) 삼성전자·SK하이닉스 주주환원 공백 | SK하이닉스 자사주 매입 종료로 외국인 수급 공백이 사라짐 |\n\n즉, AI 신용 불안(메타·테슬라·램리서치)과 반도체 Top2의 주주환원 공백이 서로 복합적으로 작용했다. 이 두 요인이 동시에 작동했기에 3.5%라는 크랙이 발생한 것이다.\n\n### 5. KOSDAQ의 3.62% 급락: 외국인·기관 순매도의 구조\n\nKOSDAQ는 외국인과 기관의 순매도에 의해 -3.62%로 마감했다. 외국인의 순매도 규모는 1.1조원이 넘어서는데, 이는 KOSPI의 -3.52% (-6.4조원)보다 순매도 규모가 작은데도 불구하고 낙폭이 더 클 정도로 기관의 매도 강도가 높았다. 이는 KOSDAQ 내 특정 업종 또는 종목의 집중적 매도가 진행되었음을 시사한다. AI·반도체 중심의 KOSDAQ 구조상, 메타·테슬라·램리서치 실적 발표 후 AI 수익성 의구심이 기관 수탁자들에게 급속히 확산된 것으로 해석된다.\n\n### 6. 중국증시: 정책 불확실성과 글로벌 AI 조정의 복합\n\n중국증시는 정책 불확실성과 글로벌 AI 조정의 영향을 동시에 받았다. \n\n- 3분기 GDP가 예상을 상회했음에도 불구하고 정책 추가 지원 불확실성이 높아졌다. 이는 3분기 GDP가 양호했다는 사실이 정책 멈춤 신호로 해석될 가능성을 높인다는 데 있다.\n- 글로벌 AI 조정이 기술주 중심으로 전이되면서, 중국 내 AI 기술주들도 약세에 직면했다. 이는 중국 기술주들의 글로벌 AI 생태계 내 위치를 잘 이해할 때만 가능한 연결인데, 엔비디아의 CPO 공급망 확장 발표가 중국 광통신업체들의 차세대 공급망 참여에 대한 우려를 자극했고, 이노라이트 등의 대표주들이 급락했다. \n\n이 두 요인이 중첩되면서 상해종합지수는 -1.48%로 마감했다.\n\n### 7. 10월 FOMC: 금리 동결 확률 87.27% → 향후 경로가 핵심\n\nFOMC 의사록에서 기준금리를 동결하겠다는 내용이 나오면서 CME Fed Watch의 10월 금리 동결 확률은 87.27%로 급등했다. 이는 금리 결정 자체보다 향후 경로가 시장의 주목점이다. 미국 9월 CPI가 예상보다 강하게 발표되고 국제 유가 상승에 따른 인플레이션 부담이 아직 잔존하고 있으므로, 연준의 긴축 경로 강화 가능성은 증시 반등을 제약할 요인으로 작용할 수 있다. 그러나 현재 유가는 브렌트 $113.29(WTI $103.27)로, 3월 이란 사태 당시의 고점($113.17)을 거의 상향 돌파했다. 고유가 장기화 우려가 확대되면 내년 이후 경기 전망 불확실성이 더욱 커지게 된다. 이는 미국 기술주(AI)의 수익성 우려와 병행되며 증시의 추가 하방 압력으로 작용할 수 있다.\n\n### 8. 다음주 슈퍼 위크: M7 실적과 AI 투자 지속성, 주주환원 여부\n\n다음 주는 M7(Microsoft, Alphabet, Amazon, Apple, NVIDIA, Meta, Tesla)의 실적 발표가 집중될 예정이다. Microsoft, Alphabet, Amazon, Intel, SanDisk가 30일 발표를 예정하고 있고, Samsung Electronics와 SK Hynix는 28일과 29일에 확정실적을 발표한다. 이 실적 발표를 통해 확인할 수 있는 핵심 질문은:\n\n- Microsoft, Alphabet, Amazon의 AI 사업이 얼마나 많은 현금을 사용하고 있는가? \n    - 이들은 AI 인프라 구축(CapEx)을 위한 현금 흐름이 얼마나 좋은지를 보여줘야 한다. 만약 현금 흐름이 충분하다면 AI 투자 지속성을 확인할 수 있다.\n- Intel, SanDisk의 AI 수요가 지속적으로 확대되고 있는가?\n    - 이들은 AI 서버와 저장장치의 수요 증가를 직접적으로 반영하는 회사이므로, AI 서버 수요가 지속적으로 확대되고 있는지 확인할 수 있다.\n- Samsung Electronics, SK Hynix의 추가 주주환원 방안이 있을까?\n    - SK Hynix의 자사주 매입이 종료된 상황에서 외국인 수급 공백이 사라졌다. 이 두 회사가 추가 주주환원 방안을 제시한다면 증시의 하방 지지도를 강화할 수 있다.\n\n이번 주의 실적 발표가 AI 신용 불안과 유가 상승이라는 두 충격을 동시에 해결하거나, 그 중 하나라도 완화될 수 있다면 증시의 반등 동력이 붙을 수 있다. 그러나 두 충격 모두 동시에 완화되지 않다면 증시의 하방 압력은 계속될 전망이다.\n\n### 9. 비트코인: 다음 고점은 2029년, 2027년은 회복기\n\nBitcoinsupply.com에 따르면 2028년 4월 반감기 이후 2029년 하반기에 다음 고점이 형성될 것으로 예상된다. 2027년은 공급량 감소를 선반영하며 상승하는 회복기에 해당한다. 역사적 사이클을 보면 반감기 이후 17~18개월 만에 가격 고점을 형성했다. 기존 주기를 적용하면 2028년 4월 반감기 이후 2029년 하반기가 다음 고점 형성 시기다.\n\n### 10. FX: 달러 약세, 엔화 강세, 유로·파운드 약세\n\n달러화는 AI 투자 관련 신용 우려에 따른 미 국채금리 급락과 안전자산 선호에 따른 엔화 강세 등에 소폭 하락했다. 미국 기술주를 중심으로 AI 투자 수익성에 대한 우려가 재부각되면서 위험회피 심리가 확대되고, 미 국채금리는 장중 하락폭을 확대하며 10년물 기준 5%를 하회해 달러화에 하방 압력으로 작용했다. 주간 신규 실업수당 청구건수가 예상보다 양호하게 발표 됐음에도 불구하고, 안전자산 수요가 금리 하락을 주도했다.\n\n국제 유가는 사우디아라비아에 대한 후티 반군의 공격으로 중동 지역 원유 공급 차질 우려가 확대되면서 인승해 인플레이션 경계를 자극했다. 유로화는 프랑스의 재정 불안과 정치적 혼란으로 약세를 보인 반면, 파운드화는 영란은행의 추가 금리 인상 기대에 소폭 강세였다. 엔화는 위험회피 심리와 일본 외환당국의 개입 경계가 맞물리면서 달러 대비 0.75% 상승해 달러 약세를 주도했다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nAI 투자 사이클의 지속 가능성과 수익성에 대한 의구심이 확대되며 금융시장 불안이 높아지고 있으며, 이는 고금리로 인한 자본조달 비용 증가와 투자 수익성의 검증 부족에서 비롯된다. AI 관련 투자 수요는 여전히 양호하지만, 투자 확대에 따른 기대치 상승이 실제 성장과 수익화 속도를 따라가지 못하는 것으로 보인다. 이에 따라 투자 수익성과 기업별 차별화가 중요한 쟁점으로 부상하고 있다. 한편, 신용위험의 증가와 부실기업의 부도 가능성은 AI 투자에 대한 불확실성을 가중시키며, 이는 금융시장의 자금 조달 여건과 투자 심리에 영향을 미칠 수 있다. 특히, AI 투자에 필요한 대규모 선행 투자와 자본조달 비용의 안정성은 투자 지속 가능성에 중요한 영향을 미치고 있다."}]}</script>
