승하는 모습을 보이며 기술주의 활력을 되살렸지만, 동시에 시장 전반에 대한 자금 집중 효과를 부추겼다. 한편 연방준비제도(Fed)의 금리 결정 방향에 대한 예측 차이가 좁혀지고 있다. 12월 통화정책회의에서 기준금리를 동결하고 2024년 중반까지 인상을 유지한다는 최근 예측 확률이 50%를 넘어서면서, 금리는 저평가되었던 상태에서 다시 비합리적인 수준으로 돌아섰다. \n\n### 금리 변동의 구조적 배경\nFed의 입장 변화는 지난달 12월 회의 이후 처음으로 나타난 것이다. 당시 위원들은 물가 안정을 위해 금리를 2024년까지 동결해야 한다는 입장을 밝혔다. 그러나 현재 대부분의 믿음이 2024년 중반까지 인상을 진행한다는데 모여 있고, 이는 금리가 너무 낮다는 의견을 반영한다. 이러한 변화는 2023년 11월 회의에서 처음으로 나타났던 것으로, 당시에도 12월 회의 후 2024년 초까지 금리를 동결한다는 의견이 있었지만, 이번에는 더 많은 사람들이 2024년 중반이라는 시점을 선택했다. 따라서 2023년 11월 이후 12월 회의 직후의 금리 전망 변화는 매우 중요한 시그널로 작용한다.\n\n### 기술주 특별 관심 필요성\nAnthropic의 IPO는 기술주에 대한 일반적인 관심이 아닌 특정 종목에 대한 매집을 촉구하기 때문에, 기술주는 다른 종목들과 다르게 행동하게 될 수 있다. 하지만 현재로서는 다른 시장들의 추세와 같이 행동할 가능성도 여전히 존재한다. 특히 기술주가 최근 반등했던 이유는 인터넷 사용량 증가와 함께 소프트웨어와 클라우드 컴퓨팅 서비스 이용 증가 때문인데, 이런 트렌드는 앞으로도 계속될 것이므로 기술주에 대한 관심은 당분간 지속될 것으로 보인다.\n\n### 시장 전반 영향력 폭\nAnthropic의 IPO는 미국 증권시장 전체에 큰 영향을 미친다. 이벤트 자체로는 긍정적이기는 하지만, 시장 전반에 대한 자금 집중 효과를 가져오는 경우가 많다. 또한 기술주가 급등하면 다른 종목들도 따라올 수 있지만, 오히려 다른 종목들에게 자금이 몰릴 수도 있다는 점도 잊지 않도록 해야 한다. 즉, 기술주에 대한 관심이 커질수록 다른 종목들은 더욱 무시되기 쉬운데, 이는 특히 기술주가 다른 종목들보다 더 많이 상승하거나 하락할 때 발생하는 현상이다.\n\n### 전망\n미국 증권시장은 다양한 변수들에 의해 크게 변동되기도 하고, 또 다른 경우에는 거의 변동되지 않을 수도 있다. 하지만 최근의 상황을 보면, 기술주가 반등하고 있으며, 기술주가 반등할수록 다른 종목들도 함께 반등할 가능성이 크다는 것을 알 수 있다. 다만 기술주가 반등하는 것은 항상 좋은 결과를 가져오지는 않는다. 일부 종목들은 기술주가 반등함에 따라 오히려 더 많이 하락할 수도 있기 때문이다. 이러한 상황에서 가장 중요한 것은 기술주가 얼마나 많이 상승하고 있는지를 살펴보는 것이다. 만약 기술주가 20% 이상 상승한다면, 다른 종목들도 같은 정도만큼 상승할 가능성이 크다. 반대로 5% 이내로만 상승한다면, 다른 종목들도 그렇게 많이 상승하지 못할 가능성이 크다.\n\n### 참고사항\n- 미국 증권시장은 기술주뿐만 아니라 모든 종목들이 서로 연결되어 있어, 한 종목의 가격변동이 다른 종목에게도 영향을 미칠 수 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권\n\n### 금리의 숫자놀음: 3.5% vs 3.75%\n\n한국은행의 11월 금통위원들의 눈길은 모두 3.5%에 집중되어 있다. KDI와 IMF가 동시에 올해 성장률을 3.8%로 수정하자, 3.5%라는 기준금리는 이제 더 이상 '긴축의 마지노선'이 아니다. 하지만 여기서 중요한 것은 점도표다. 3.5%가 3.75%보다 얼마나 많은지를 파악해야 한다.\n\nKOSPI가 5,000p를 넘어서지 못한 현재, 하나증권은 DRAM 수출가격이 주가보다 우선시 된다고 강조한다. 지난 3개월간 DRAM 가격은 25% 상승세를 이어갔는데, 이는 반도체 수출가격이 반도체 기업 주가보다 먼저 반응한다는 것을 다시 한번 입증한다. 그런데 11월 25bp 인상과 함께 점도표에서 3.75%를 뛰어넘는 사례가 나오면 이야기는 달라진다. \n\n왜냐하면 3.75%는 다음 금통위원들에게 새로운 도덕적 의무를 준다. 한은의 역사상 가장 최근의 3.75% 기준금리는 2022년 12월이다. 그때부터 지금까지 2026년 11월까지 무려 4년 11개월이 지난 셈인데, 그사이 반도체가 3D NAND Flash 기술로 한층 깊어지고 AI가 세계경제를 뒤틀 정도로 발전했다. 이런 상황에서 3.75% 기준금리가 3.5%보다 많다는 사실 자체가, 반도체 기업의 미래 가치에 대한 금융시장의 신뢰도를 반영하는 계산식이라 볼 수 있기 때문이다.\n\n이런 금액의 변화는 채권 시장에서 즉각 반응한다. 하나증권은 통안채 3개월 금리가 기준금리를 25bp가량 웃돈다고 보고 있다. 이는 7월과 같은 수치다. 7월엔 11월 인상을 100% 가격에 반영했다는 게 하나증권의 판단이었다. 그렇다면 11월 금통위원장이 점도표에서 3.75%를 제시하면, 2027년 2월 추가 인상 기대가 현실화되기 위해 필요한 준비금이 지금부터 쌓여야 한다는 뜻이다.\n\n### 회사채 조달 구조의 패러다임 전환\n\n신한투자증권이 제시한 회사채 조달 구조의 변화는 매우 극적인데, 이유가 있다. 올해 금리 급등 속에서 회사채 시장 조달 불확실성이 커지면서 회사채 순상환이 이어졌다. 증권/금융지주채 발행이 증가한 점을 감안하면 일반기업 회사채 조달은 더욱 위축된 상황이다.\n\n이런 상황에서 은행 차입이 크게 증가했다는 건 금융기관들이 대기업 자금줄 기능을 강화시키겠다는 신호다. 하지만 문제가 있다. 은행 차입은 대부분 단기차입으로 이루어졌고, 만기도래차입금이 69조원 급증했다. 직접금융시장에서도 CP/전단채를 늘렸고, 회사채 중 2년 이하 만기 발행 비중이 높아졌다.\n\n이렇게 짧아진 차환 주기는 부채 만기 구조 및 유동성을 다소 저하시킨다. 그리고 큰 폭 증가한 만기도래차입금은 내년 곧바로 차환 부담으로 돌아올 전망이다. 만기도래차입금을 차환하기 위한 자금의 조달 배분이 중요해졌다. 단기 조달 매력이 유지될 경우 단기차입 돌려막기가 이어질 수 있지만, 유동성 위험이 높아져 지속성이 낮다.\n\n이제 상당 규모 자금은 금리 매력이 제고되고 있는 회사채 발행으로 치환될 것으로 본다. 전반적 직접 및 장기 조달 수요가 높아질 전망이다. 이렇게 회사채 조달 구조가 간접금융 중심에서 직접금융 중심으로, 단기 조달 중심에서 장기 조달 중심으로 전환되면 회사채 시장이 살아난다.\n\n### 회사채 발행시장의 회복 시나리오\n\n신한투자증권이 제시한 회사채 발행시장의 회복 시나리오는 다음과 같다. 금리 상방 위험이 누그러지면서 채권 금리는 하락 전환했다. 금리는 추세 하락보다는 하방경직적 흐름이 전개될 공산이 크나, 적어도 불확실성은 완화된 상태다. 회사채는 순발행 전환될 가능성이 높아졌다. 하위등급은 다소 시일이 소요될 수 있으나 올해 부진을 겪은 회사채 발행시장 전반의 회복세가 기대된다.\n\n이 시나리오의 핵심은 \"금리 상방 위험이 누그러지면서\"라는 부분이다. 지금 시점에서 회사채 발행시장이 살아나려면 무엇보다도 금리 상방 위험을 제거해야 한다. 하지만 신한투자증권은 금리 상방 위험이 누그러졌다고 판단했는데, 그 근거는 어디서 찾을 수 있는가?\n\n핵심은 11월 금통위원들이 제시할 점도표에 있다. 만약 11월 금통위원들이 3.75%를 제시하지 않고 3.5%를 유지하면, 신한투자증권의 시나리오가 실행 가능한 것이다. 그러나 만약 11월 금통위원들이 3.75%를 제시하면, 신한투자증권의 시나리오가 실행 불가능해진다.\n\n### 12월 FOMC: 긴축의 끝은 아니지만 인상 속도 조절\n\n10월 FOMC 의사록은 연준이 9월 인상 이후 한 차례 속도를 조절하면서도 추가 인상 기조를 유지했음을 보여주는 문서다. 연준은 10월 정책금리를 3.75~4.00%로 동결했으나, 거의 모든 참석자가 물가와 고용이 예상 경로를 따를 경우 향후 추가 인상이 적절하다고 판단했다. 표결에서는 쿡 이사와 해맥 클리블랜드 연은 총재 두 명이 25bp 인상을 주장했고, 동결을 지지한 참석자 중에서도 일부는 인상과 동결 사이에서 판단이 쉽지 않았다고 밝혔다. 인상 소수의견이 7월 세 명에서 10월 두 명으로 줄어든 데서 읽혔던 것보다 위원회 내부의 긴축 선호는 강했다.\n\n10월 동결에는 주가 하락과 크레딧 스프레드 확대 등 긴축의 영향들이 나타났던 점이 배경이 되었지만, 여전히 추가 인상을 뒷받침하는 근거는 최대고용에 가까운 노동시장과 물가의 상방 위험에 있다. 참석자들은 고용의 상하방 위험이 대체로 균형을 이룬 것으로 평가했고, 다수는 전체 임금상승률도 물가목표 2%와 대체로 부합한다고 봤다. 반면 물가에 대해서는 압도적 다수가 상방 위험을 지적했다. 대다수의 기본 전망은 관세 효과와 에너지 가격의 기여도, AI 인프라 투자에 따른 가격 압력이 시간이 지나며 약해진다는 것이었다. 그럼에도 연준이 경계한 지점은 이미 물가가 장기간 목표를 웃돈 상황에서 고유가와 정제유 공급 제약이 이어질 경우, 개별 품목의 가격 춲격이 가계와 기업의 기대인플레이션에 고착될 가능성이었다. 뿐만 아니라 AI와 관련한 변화와 지정학적 리스크 변동 요인이 계속해서 물가 압력을 높일 수 있다는 우려도 작용하는 것으로 본다.\n\n따라서 당사는 12월 25bp 인상이라는 기존 전망을 유지한다. 일부 참석자는 향후 물가지표가 부정적일 경우 12월에 25bp를 넘는 인상도 검토할 수 있다고 언급했다는 점에서 월러 연준 이사는 10월 회의 당시부터 50bp 인상 가능성을 염두에 뒀던 것으로 나타났다. 회의 이후 발표된 10월 CPI를 보면 에너지 가격 상승세가 꺾인 뒤에도 근원CPI는 3개월 연속 0.3% 상승했다. 에너지 가격 상승세가 꺾인 뒤에도 근원물가의 오름세가 이어졌다는 점은 12월 추가 인상을 뒷받침한다.\n\n한편 연준에서도 지적하듯 9월 인상 이후 모기지금리 상승과 크레딧 스프레드 확대 등으로 금융여건이 악화되었으며, 일부 긴축의 영향이 금융시장에서 먼저 나타나고 있음을 고려할 때, 미 연준이 12월 FOMC 이후에도 추가적인 인상이 확대되거나, 인상폭을 가파르게 두는 결정은 하지 않을 것으로 판단한다. 인플레 리스크가 상존하는 환경이나 1분기를 기점으로 점진적으로 둔화되는 흐름을 확인할 경우 연준은 12월 이후 인상 여력은 약화될 것으로 판단한다.\n\n미국채 금리는 12월 인상 자체보다 내년 추가 인상 여부를 확인하는 과정을 거치며 1분기까지 높은 수준을 유지할 전망이다. 미 연준이 금융시장 여건을 고려하나 여전히 물가에 방점을 두고 있다는 점을 확인했다. 따라서 12월 점도표에서 연준이 내년에도 추가 인상이 필요하다고 판단하는지가 미국채 2년물의 추가 상승폭을 좌우할 것이다. 10년물은 유가 상승세가 진정되더라도 주거비를 비롯한 서비스 물가의 둔화가 동반돼야 하락세가 지속될 수 있다. 내년 1분기까지 고금리가 이어진 뒤 근원물가 둔화를 확인하며 미국채 금리가 하락 전환할 것이라는 기존 전망을 유지한다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 글로벌 시장의 두 얼굴: Anthropic IPO와 금 가격崩塌\n\nAnthropic의 IPO가 도출한 숫자는 압도적이었다—$810억 규모의 자금 조달, 시총 $2조 돌파, IPO 가격 대비 17%의 급등. 하지만 이 사건은 시장 전반이 아닌 특정 세그먼트에만 집중된 급등이었다. 당일 나스닥 지수가 -2.25%, 다우존스 -2.19%, S&P 500 -2.02%로 폭락한 것은 아이러니컬한 동시에 필연적인 결과였다. \n\nThe Street가 “성공이자 함정”이라고 규정한 이유는 단순하다. Anthropic의 IPO는 AI 분야의 훌륭한 성과로 받아들여졌지만, 그만큼 다른 분야에 흐르던 자금이 이곳으로 집중돼 오히려 배제 효과를 낳았다. 특히 12월 연준 금리인상 프라이싱이 이미 선행된 상황에서, 이 거대한 IPO는 기존 투자자들에게 새로운 선택지를 제시함과 동시에 기존 포트폴리오를 재평가하도록 강박력을 행사했던 것이다.\n\n금 시장은 또 다른 방향으로 극단을 택했다. 국제 금 현물이 $3,627.9로 마감하면서 14개월래 최저점을 찍었다. 중국 상하이 금 거래소(Au99.99)도 800위안/g선을 넘어서지 못했다. 이 하락은 연준의 매파 신호와 달러 강세가 동시에 작용한 결과다. Deccan Herald와 Free Press Journal은 연준의 의사결정이 \"예상보다 강경했다\"고 진단했으며, Sina Finance는 인도 델리 귀금속 시장에서 금값이 8연속 하락했다고 보도했다. 인도 내 수요가 예상보다 빠르게 둔화된 것도 금의 하락을 가속화시키는 변수였다.\n\n둘은 다르게 보이는 운명이었지만, 공통된 구조적 현실을 반영했다. Anthropic의 IPO는 AI라는 미래 가치에 대한 강한 믿음을 시장이 표출한 반면, 금의 하락은 단기적인 안전자산 선호가 이미 소진된 가운데, 기존 안전자산이 아닌 미래 성장주에 대한 요구가 급증하자 그에 대한 대응이 늦었던 결과다. 두 현상은 서로의 존재를 더욱 극적으로 부각시킨다.\n\n---\n\n### 한중 FTA 서비스·투자 후속협상 타결: 경제적 메커니즘이 만들어낸 이벤트\n\n11월 18일 한·중 정상회담에서 한·중 FTA 서비스·투자 후속협상의 실질 타결이 선언됐다는 사실은 이미 알려져 있는 정보다. 여기서 중요한 것은 단순히 \"타결되었다\"는 사실 자체가 아니라, 그 뒤에 자리잡고 있는 경제적 구조 변화다. 신한투자증권은 이 일을 \"한한령 해제 물꼬\"로 묘사하는데, 그 이유는 단순한 관광객 수 증가를 넘어서는 구조적 개방 효과에 있다.\n\n서비스 교역 자유화와 투자 확대의 구체적 항목을 보면 그 이유가 명백하다. 중국이 영화·게임에 최혜국 대우를 약속하고, 온라인 게임·영화 사전심사를 비차별 원칙으로 처리하겠다고 한 부분은 단순한 접근 제한 완화가 아니다. 산업통상부가 이를 \"중국이 통상협정에 처음 포함한 내용\"이라고 명시한 것만으로도 그 중요성이 드러난다. 산업통상부가 그러한 표현을 사용한다는 것은, 이 조항이 단순한 양허 조항이 아니라, 앞으로 중국 내 한국 기업의 서비스 진출에 있어 법적·제도적 틀 자체를 새롭게 만들 것임을 의미한다.\n\n또한 공동제작 대상이 영화에서 드라마·애니메이션·예능·다큐멘터리 등으로 확대된 점은 한국 콘텐츠 산업의 구조적 문제 해결을 위한 중요한 이벤트다. 기존 한국 콘텐츠의 중국 시장 진출은 영화에만 국한됐다면, 지금부터는 방송 드라마와 예능 콘텐츠까지 중국 시장에 노출될 수 있다. 이는 단순한 수출 확대가 아니라, 콘텐츠 형태 자체가 중국 시장의 수요 구조에 맞도록 재배치 될 수 있는 기회다.\n\n중국 내 한국 여행사가 중국인 단체관광객을 직접 모집하고 개별여행 상품을 판매할 수 있도록 했던 조항은 한층 더 구체적이다. 중국인 단체관광객이 한국에 방문하는 행태는 단순한 수요 증가를 넘어, 한국 내 특정 플랫폼이나 유통업체의 참여를 통해 새로운 소비패턴을 창출할 수 있다. 즉, 중국인 관광객이 한국에 오는 방식이 단순한 개인 관광에서 단체관광으로 바뀐다는 것은, 그 관광객이 한국 내 특정 호텔·쇼핑몰·음식점·컨퍼런스 센터 등에 집중적으로 유입될 수밖에 없는 구조적 변화다.\n\n그것뿐만이 아니었다. 중국 내 30개 이상 매장을 중국 기업과의 합작 없이 독자 운영할 수 있도록 했다는 조항은 한국 유통업체 입장에서 거의 획기적인 변화다. 한중 FTA 발효 초기에는 중국 시장에 진출하려면 반드시 중국 기업과의 합작회사를 구성해야 했고, 이는 자칫 중국 기업의 지배력을 양보할 수밖에 없는 구조였다. 지금부터는 중국 시장에 독자적으로 30개 이상 매장을 열 수 있기 때문에, 한국 유통업체는 중국 시장에서의 자기 주도적 마켓링을 수행할 수 있다. 이는 한국 소비재 브랜드가 중국 내에서 독자적으로 라이선스를 받고 제품을 판매하는 것과 동일한 논리다.\n\n즉, 한중 FTA 서비스·투자 후속협상 타결은 단순한 양허 조항이 아니라, 한중 양국 간 서비스·투자 자유화의 제도적 틀을 새로 설정하는 작업이다. 그것이 단순한 \"한한령 해제\"로서 문제가 있다고 한다면, 그것은 단순한 수요 증가 이야기로 남아 있을 뿐이다. 실제로 신한투자증권이 이 조항을 \"한한령 해제 물꼬\"로 표현한 데서도 이 논리를 따르고 있다.\n\n---\n\n### 중국 한한령 해제가 한국 화장품 시장에 미치는 경로\n\n신한투자증권이 한중 FTA 서비스·투자 후속협상 타결을 화장품 업황에 우호적이라고 판단한 근거는 다음과 같다:\n\n1. 중국인 관광객이 한국에 오는 방식이 단순한 개인 관광에서 단체관광으로 바뀌는 것. 이는 단체 관광객이 한국 내 특정 호텔·쇼핑몰·음식점·컨퍼런스 센터 등에 집중적으로 유입될 수밖에 없는 구조적 변화다. 그리고 단체 관광객은 대부분 그룹 활동에 집중하는 경향이 있는데, 이는 그룹 행동이 이루어지는 장소에서의 소비가 집중적으로 발생하게 된다. 즉, 중국인 단체관광객이 한국에 오면 그들이 이용하는 호텔, 또는 그들이 방문하는 한국 쇼핑몰, 또는 그들이 참석하는 컨퍼런스 센터 등에서의 소비가 크게 증가할 수 있다. 이 소비의 목적지는 한국 내 특정 플랫폼이나 유통업체다.\n\n2. 중국인 단체관광객이 한국에 오면 그들은 한국 내 한국 쇼핑몰에서 한국 제품을 구매할 가능성이 크다. 중국인 단체관광객이 한국에 오면 그들이 이용하는 호텔, 또는 그들이 방문하는 한국 쇼핑몰, 또는 그들이 참석하는 컨퍼런스 센터 등에서의 소비가 크게 증가할 수 있다. 이 소비의 목적지는 한국 내 특정 플랫폼이나 유통업체다.\n\n3. 중국인 단체관광객이 한국에 오면 그들이 한국 내 한국 쇼핑몰에서 한국 제품을 구매할 가능성이 크다. 중국인 단체관광객이 한국에 오면 그들이 이용하는 호텔, 또는 그들이 방문하는 한국 쇼핑몰, 또는 그들이 참석하는 컨퍼런스 센터 등에서의 소비가 크게 증가할 수 있다. 이 소비의 목적지는 한국 내 특정 플랫폼이나 유통업체다.\n\n---\n\n### 데이터센터: 미국 전력망 운영기구의 규칙 제출과 그 의미\n\nFERC가 6월 18일 6개 관할 ISO/RTO에 내린 대형부하 접속 관련 Show Cause 명령(206조)에 대해 5개 권역이 모두 205조 요금규정 개정안을 제출했다(SPP 기한 11/20).\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n# 투자전략\n\n### 엔비디아 실적 발표와 경영 불확실성의 딜레마\n\n엔비디아의 Q3 매출액 1,158억달러(+103YoY)는 시장컨센서스 1,091억달러를 67억달러 상회했고, Data Center 매출 1,076억달러(+110YoY) 역시 컨센서스 1,018억달러를 58억달러 넘겼다. Q4 매출 가이던스는 1,300억달러로 컨센서스 1,273억달러를 27억달러 상회했고, FY2028 매출 성장률 목표를 70%→75%(+5%p)로 수정했다. B Vera Rubin 초기 출하 규모는 3분기 Data Center 매출의 19%에 해당하는 200억달러 수준으로, 컨퍼런스콜 당시 제시한 비중(~20%)에 근접했다. 하이퍼스케일러 제품 출하 후 실제 가동까지 1개월이라는 빠른 도입 속도도 확인됐다([대신증권](https://www.daishin.com)).\n\n하지만 이 모든 긍정 수치가 시장에 긍정 신호로 전달된 것은 아니다. 젠슨 황 전 CEO의 복귀를 포기한다고 공식적으로 선언했고, 향후 경영진 교체를 포함한 전략적 불확실성은 해소되지 않았다. 대신 \"기존 로드맵과 AI 생태계 금융 전략은 유지\"한다는 입장 표명이 있었지만, 이는 경쟁사들의 실적 호조가 AI 투자의 수익성 자체에 대한 걱정이 아닌 경영 불확실성에 대한 걱정임을 드러냈다. 실제로 이날 나스닥은 Anthropic IPO 당일 -$244억 규모의 자금이 텍스트 생성 모델로 이탈했고, 12월 FOMC 이사회에서 찿은 50bps 인상 요구와 함께 다우존스 -$1,101(+2.19%), 나스닥 -$550(+2.25%)를 기록했다([키움증권](https://kr.investing.com/news/stock-market-news)).\n\n### AI 밸류체인 내부 구조 재평가: 엔비디아 vs. 반도체 설비업체\n\n엔비디아의 호실적이 반도체 설비업체들의 실적 개선을 촉발했음을 알리는 근거는 다음과 같다:\n\n- 한국·대만·아시아 신흥국 반도체/장비 기업들의 EPS 상승률은 2026년 34.5%에 달했고, 유럽·중국은 각각 13.7%/6.8%에 머물렀다(iM증권).\n- 한국·대만·아시아 신흥국 반도체/장비 기업들의 EPS 상승은 AI 인프라 투자→반도체·서버·전력설비 기업 매출로의 직접적인 연결을 의미([iM증권](https://www.imsecurities.com)).\n\n이는 엔비디아의 GPU 판매 증가는 AI 인프라 투자를 이끌었고, 그 투자가 다시 반도체·서버·전력설비 기업들의 매출을 견인하는 구조를 의미한다. 즉, 엔비디아의 성장이 반도체 설비 업체들의 성장을 촉발했다는 것이다.\n\n하지만 이 구조는 이중적 취약점을 내포한다. 먼저, 엔비디아의 매출 상승이 반도체 설비업체들의 매출 상승을 이끄는 동시에, 엔비디아의 주가가 상승할수록 반도체 설비업체들의 매출 상승에 대한 수혜 기대가 축소되는 경로가 존재한다. 두 번째, 엔비디아의 호실적이 AI 수요 지속성에 대한 신뢰를 회복시키는 동시에, AI 투자의 수익성이 너무 높아졌다는 부담을 시장에 남기는 모순적 효과를 갖는다.\n\n이러한 딜레마는 10월 이후 글로벌 증시에서 AI 관련주의 조정을 이어왔고, 이번엔 엔비디아 호실적 발표 후에도 미국 증시가 -$244억 규모의 자금이 텍스트 생성 모델로 이탈했다는 사실에서 확인된다([키움증권](https://kr.investing.com/news/stock-market-news)). \n\n### AI 밸류체인의 수혜 국면 재분류: KOSPI200/KOSDAQ150 지수 내 재편과 의미\n\n한국거래소가 11월 18일 발표한 12월 선물/옵션 동시 만기일 다음 날인 12월 11일부터 적용될 KOSPI200·KOSDAQ150 정기변경은 KRICS 산업분류 도입의 첫 적용이다([신한투자증권](https://news.newsis.com/view)).\n\nKRICS 도입의 구체적 영향은 다음과 같이 확인된다:\n\n- KOSPI200: \n   - Information Technology 섹터 내 순위 상승으로 편입에 성공한 대덕전자(+) / 소재→Information Technology로 이동하며 편출된 영풍(-)\n   - Energy & Chemicals 섹터가 4개로 가장 많은 편출\n   - Industrial Materials와 Equipment는 각각 2개씩 편출/편입 → 배터리 장비(SK아이이테크놀로지), 방산(한화머시너리) 편출, AI 데이터센터 수요 확산의 수혜 전력기기 편입으로 구성 종목의 성격이 달라짐\n\n- KOSDAQ150:\n   - Helthcare, Semiconductor and Advanced Materials, Optical Communication, Data Center Cooling Solution(TL Biotech, Cemtix, Daehan Guang Tong, GST) 포함\n   - KOSDAQ Top10 종목 중 HealthCare 종목들이 빠지고 Speciality Engineering(주성엔지니어링), Material Processing System(심텍) 등 Small Cap 소부장 종목들이 그 자리를 채웠음\n   - 헬스케어 종목이 4개로 가장 많이 증가했음 / Information Technology 섹터는 2개 감소했고 AI 밸류체인 위주의 재편 진행됨\n\n패시브 자금 유입 효과:\n- KOSPI200 추종 ETF 자산규모: 43.5조원 (+1.5% 기록한 CSI배당지수 대비 -8.6% 하락한 CSI300 상황에서 특이)\n   - 새롭게 편입된 대덕전자 유동시가총액 비중 0.11% × 43.5조 = 약 500억원 유입 가능\n- KOSDAQ150 추종 ETF 자산규모: 5.4조원\n   - 편입 예상 기업들의 지수 내 비중이 커 오히려 더 많은 자금 유입 가능\n   - 20일 평균 거래대금을 이용한 패시브 효과도 확인됨\n\n이 정기변경은 산업 재분류와 기업의 시가총액 증감이 함께 반영된 결과로, KOSPI200과 KOSDAQ150뿐만 아니라 섹터지수 및 ETF 구성 종목 변화 등에 지속적인 점검이 필요한 이유를 제공한다.\n\n### 글로벌 AI 밸류체인의 국면별 수혜 분화: 인도와 유럽의 피난처 역할\n\nAI 밸류체인 내부 구조 재평가의 또 다른 시각에서, 지난 10월 이후 글로벌 증시에서 AI 관련주의 조정이 이어졌을 때, 권리역과 업종 간 로테이션이 뚜렷하게 나타났다. 이 조정의 근본 촉매는 ③ AI 투자의 수익성에 대한 의구심, 그리고 ④ 미국 중간선거 이후 데이터센터 관련 규제 강화 우려였다. 그런데 이 두 가지 악재가 동시에 작용했음에도, 자금이 주식시장을 이탈하기보다는 경기 방어 업종과 AI 노출도가 낮은 지역으로 이동하며, 지수 아래에서의 순환매가 활발해졌다([키움증권](https://news.newsis.com/view)).\n\n이 상황에서 필라델피아 반도체 지수(SOX)는 10월 이후 -23.6% 하락했는데, 같은 기간 반도체 지수의 선행 EPS가 오히려 +7.5% 상향된 점을 감안하면, 실적보다는 AI 투자에 대한 경계감이 주가 조정을 이끈 것으로 판단된다. AI 관련주의 높은 변동성이 이어지고 있는 상황에서, 전술적 대응을 위해 어떤 국가와 업종이 피난처 역할을 했는지 점검해볼 필요가 있다.\n\n국가별로는 그간 소외되었던 인도 증시의 아웃퍼폼이 단연 주목을 받았다. AI 밸류체인 비중이 높은 한국(-29.5%), 일본 증시(-7.9%)의 조정 폭이 컸던 것과 달리, 인도 증시는 10월 이후 +9.3% 상승하며 주요국 가운데 가장 양호한 성과를 기록했다. 최근 3개월 주간 수익률 기준으로 주요국 증시와 SOX의 상관계수를 살펴보면, 인도(-0.61)와 중국은 음(-)의 상관성을, 유럽은 상관성이 나타나지 않은 반면, 한국(0.90)을 비롯한 미국, 일본은 높은 상관성을 보였다. 인도 외에 플러스 수익률을 기록한 곳 역시 상관성이 낮은 유럽(+3.1%)뿐이었다. AI 민감도가 높은 곳에서 이탈한 자금이 인도와 유럽으로 이동한 것으로 판단된다.\n\n인도의 피난처 역할은 특정한 섹터 혹은 산업의 위치에서 이해해야 한다. KOSDAQ150 정기변경에서도 확인된 바와 같이, AI 밸류체인 내 소부장과 데이터센터 냉각 솔루션(GST)은 KOSDAQ150에 포함됐다. 하지만 인도 증시가 AI 밸류체인 비중이 높은 한국·일본·미국보다 AI 민감도가 낮다는 것을 시장이 판단한 것은, 한국·일본·미국 내 AI 밸류체인의 주도권이 특정 기업군에 집중돼 있어서다. 한국 증시의 AI 밸류체인은 SK하이닉스, 삼성전자, 대덕전자, SK아이이테크놀로지, 에이비엘바이오텍, 롯데정보시스템, 에이치씨알, 케이엠더블유, 세미시스메틱 등이 KOSPI200·KOSDAQ150에 포함된 반면, 인도 증시의 AI 밸류체인은 인도산 반도체 기업들과 글로벌 반도체 기업들의 인도법인을 포함한다. 인도 증시가 AI 밸류체인의 수혜 국면에서 피난처 역할을 할 수 있었던 것도 이 구조적 차이 때문이다.\n\n### 미국의 AI 밸류체인 내부 구조 재평가: 헬스케어·IT·필수소비재·에너지·유틸리티\n\n한화투자증권의 Global EPS Live #237(2026-11-19)은 글로벌 실적 상향의 업종별 국면을 이렇게 묘사한다: “Global EPS is all up. In advanced countries, Japan, Canada, US are strong; in emerging markets, Korea, Brazil, Taiwan, India are strong.” 미국은 IT, energy, healthcare가 상승 주도이고, 한국은 경기소비재가 부진했으나 IT가 8.3% 상향. Global sector-wise, IT, utilities, consumer staples show good performance.\n\n이 리포트에서 미국의 AI 밸류체인 내부 구조 재평가가 어떻게 이루어졌는지 확인하자.\n\n- Global EPS가 모두 상승했지만, 선진국 중 가장 강했던 일본·캐나다·미국의 업종별 차별화: 미국은 IT, 에너지, 헬스케어가 상승 주도. 이 세 업종은 AI 밸류체인 내에서 서로 다른 위치를 차지한다.\n   - IT: AI 하드웨어/소프트웨어 직접 수혜\n   - Energy: AI 데이터센터의 전력 수요로 간접 수혜\n   - Healthcare: AI 소프트웨어의 직접 수혜\n\n- 한국의 업종별 차별화: 경기소비재가 부진했으나 IT가 8.3% 상향. 한국은 경기소비재 부진에도 불구하고 IT가 양호한 상태.\n\n- Global Sector-wise: IT, Utilities, Consumer Staples 양호. 이 세 업종은 AI 밸류체인 내에서 서로 다른 위치를 차지한다.\n   - IT: AI 하드웨어/소프트웨어 직접 수혜\n   - Utilities: AI 데이터센터의 전력 수요로 간접 수혜\n   - Consumer Staples: AI 소프트웨어의 간접 수혜 또는 AI 하드웨어 사용비용 저렴화로 간접 수혜\n\n즉, 미국의 AI 밸류체인 내부 구조 재평가는 IT(핵심 수혜), Energy(간접 수혜), Healthcare(간접 수혜)로, 한국은 경기소비재(부정적), IT(양호)로, global sector-wise는 IT(핵심), Utilities(간접), Consumer Staples(간접)로 나뉜다. 이 구조적 차이는 글로벌 AI 밸류체인 내부에서의 다양한 수혜 경로를 의미한다.\n\n### 바벨 전략: 기술주와 배당주의 공존 기술\n\nAI 수요 둔화 우려와 위험선호 약화 속에서 배당주의 상대강세가 돋보였다. 10월 이후 CSI300은 8.6% 하락한 반면 CSI배당지수는 1.5% 상승했다. 같은 기간 TMT지수는 16.0% 급락했다. 성장성과 안정성을 동시에 확보하기 어려운 시장 환경이다. 기술주와 배당주를 결합한 바벨 전략이 시장을 아웃퍼폼할 수 있는 유력한 대안으로 부각된다. 관건은 시장 국면에 따른 비중 조절이다([신한투자증권](https://news.newsis.com/view)).\n\n성과도 이를 뒷받침한다. 2020년 이후 기술주와 배당주를 각각 50% 편입한 바벨 전략의 누적수익률은 79.3%. TMT지수(82.7%)와 유사하며 CSI300 TR(14.6%)을 크게 상회한다. 연평균 수익률은 8.9%, 연율화 변동성은 20.6%. 특히 최대 낙폭(MDD)은 -24.0%로 TMT(-38.3%)와 CSI300 TR(-41.6%) 대비 낮았다. 기술주의 상승 잠재력을 유지하면서 하방 위험을 효과적으로 통제한 조합이다.\n\n최근 상관관계 변화도 주목할 부분이다. CSI배당지수와 TMT지수 간 60일 이동 상관계수는 2020년 평균 +0.77에서 2025년 +0.28로 하락했다. 올해 상반기 +0.20에서 하반기 -0.13으로 전환됐으며, 11월 중순 -0.17을 기록 중이다. 과창판과의 상관계수는 -0.28까지 낮아졌다. AI 내러티브 약화가 기술주의 조정 압력을 높인 반면, 배당주는 안정적인 현금흐름을 바탕으로 방어적 수요를 흡수한 결과다. 두 스타일의 차별화가 뚜렷해지면서 바벨 전략의 분산효과도 확대됐다.\n\n### 글로벌 AI 밸류체인의 수혜 국면 재분류: 인도와 유럽의 피난처 역할\n\nAI 밸류체인 내부 구조 재평가의 또 다른 시각에서, 지난 10월 이후 글로벌 증시에서 AI 관련주의 조정이 이어졌을 때, 권리역과 업종 간 로테이션이 뚜렷하게 나타났다. 이 조정의 근본 촉매는 ③ AI 투자의 수익성에 대한 의구심, 그리고 ④ 미국 중간선거 이후 데이터센터 관련 규제 강화 우려였다. 그런데 이 두 가지 악재가 동시에 작용했음에도, 자금이 주식시장을 이탈하기보다는 경기 방어 업종과 AI 노출도가 낮은 지역으로 이동하며, 지수 아래에서의 순환매가 활발해졌다([키움증권](https://news.newsis.com/view)).\n\n이 상황에서 필라델피아 반도체 지수(SOX)는 10월 이후 -23.6% 하락했는데, 같은 기간 반도체 지수의 선행 EPS가 오히려 +7.5% 상향된 점을 감안하면, 실적보다는 AI 투자에 대한 경계감이 주가 조정을 이끈 것으로 판단된다. AI 관련주의 높은 변동성이
