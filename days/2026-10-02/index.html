<script id="__DATA__" type="application/json">{"date": "2026-10-02", "headline": "9월 한국 수출: AI 투자 사이클과 반도체 집중도가 만든 사상 최대 규모", "market": {"KOSPI": {"label": "코스피", "value": 7003.74, "change": 0.46, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 893.29, "change": -0.11, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1347.0, "change": -0.92, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 91.11, "change": -1.9, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4162.3, "change": -0.95, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.273, "change": 3.87, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.386, "change": -5.3, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51176.96, "change": 0.49, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7722.72, "change": 0.73, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27190.86, "change": 1.19, "unit": "%"}}, "shock_md": "", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### 1. 9월 한국 수출: AI 투자 사이클과 반도체 집중도가 만든 사상 최대 규모\n\n2026년 9월 한국 수출액은 **1,209.4억 달러**로 전년 동월 대비 **83.5% 급증**하며 월간 사상 최대를 기록했다. 추석 연휴로 조업일수가 2.5일 감소한 점을 고려하면, 일 평균 수출액이 **56.3억 달러(+104.9%)**로 사상 처음으로 50억 달러를 상회하는 것은 실질 강도가 이 수치를 훨씬 상회함을 의미한다. 1~9월 누적 수출액은 **8,145억 달러**로 2025년 연간 실적(7,093억 달러)을 이미 넘어섰고, 연간 1조 달러 돌파 가능성은 높아졌다. 수입도 **710.9억 달러(+26.0%)**로 증가했지만, 수출단가가 **44.1%** 급등한 가운데 수출물량도 **27.3%** 증가했기 때문에, 에너지 수입 증가를 상쇄해 무역수지 흑자가 **498.5억 달러**로 확대됐다. 월간 무역흑자는 **400억 달러를 처음으로 상회**하는 성과다.\n\n이 수치의 핵심 구동력은 반도체다. 9월 반도체 수출액은 **603.0억 달러(+262.8%)**로 단일 품목 첫 600억 달러를 돌파했다. 비중은 8월 47.5%에서 9월 49.9%로 높아졌고, 83.5%의 수출 증가율 중 반도체 기여도는 **66.3%p**에 달해 증가분의 79%를 설명한다. 메모리(+358.6%)와 시스템(+28.8%)의 격차는 가격 효과를 명확히 보여준다. 반도체 수출의 강도는 iM증권의 EBSI(4분기 수출산업경기전망지수) 111.3(+4.3pt YoY)와 반도체 출하-재고 사이클의 8월 이후 둔화 국면 탈출, 그리고 4분기 AI 투자 사이클 지속을 통해 4분기에도 강세가 이어질 전망이다. 반도체 제외 수출도 606.4억 달러(+23.0%)로 8월(+19.2%) 대비 개선됐고, 조업일수를 조정한 일 평균 기준으로는 8월 +22%에서 9월 +37%로 가속됐다. 2025년 9월 수출(659.1억 달러)이 하반기 중 최고치였고, 10월(595.2억), 11월(607.7억)로 낮아질 전망이었지만, 추석 역기저 효과와 조업일수 회복을 감안하면 4분기에도 양호한 흐름이 이어질 것이라는 기존 전망이 수정됐다.\n\n---\n\n### 2. 지역별 수출: 미국·중국·아세안의 200억 달러 클러스터\n\n지역별로는 9대 지역 중 6개가 증가했다. 미국은 **243.3억 달러(+137.0%)**로 반도체와 자동차 호조가 주도했다. 중국은 **260.1억 달러(+122.7%)**로 4개월 연속 200억 달러를 기록했고, 아세안은 **212.9억 달러(+92.5%)**로 첫 200억 달러를 돌파했다. EU는 10개월 연속 플러스(+20.8%)를 기록했지만, 중동은 **-14.1%**로 감소했다.\n\n---\n\n### 3. 품목별 수출: AI 인프라 수요가 컴퓨터를, LNG선·VLGC 인도가 선박을 부양\n\n품목별로는 20대 품목 중 가전을 제외한 19개가 일 평균 수출이 증가했다. 컴퓨터는 **70.0억 달러(+435.3%)**로 AI 인프라 수요로 급증했고, 무선통신기기는 **21.4억 달러(+23.4%)**로 11개월 연속 플러스를 기록했다. 선박은 **37.6억 달러(+29.9%)**로 LNG선과 VLGC 인도로 반등했다. 자동차는 **60.5억 달러(-5.5%)**로 추석 기저와 중고차 부진이 영향을 미쳤지만, 일 평균 기준으로는 **+5.5%** 증가했다.\n\n석유제품(+72.0%)과 석유화학(+5.1%)은 가격 효과로 증가했고, 물량은 각각 **-6.9%, -19.1%** 감소했다. 수입에서도 가격 효과가 동일하게 나타났다. 반도체장비는 **+50.8%**로 설비투자 사이클이 지속되는 신호로 해석된다.\n\n---\n\n### 4. 9월 미국 ISM 제조업 PMI: 재고 소진과 생산 둔화가 지수 상단을 제한\n\n9월 미국 ISM 제조업 PMI는 **54.5**로 전월대비 **0.1 하락**하며 예상치를 하회했다. 신규 주문(+1.6), 수주잔량(+4.6), 고용(+1.5) 등 수요 관련 지표는 대체로 개선됐지만, 재고(-2.0) 소진과 생산(-1.6) 둔화가 지수 상단을 제한했다. 생산원가(+6.8) 상승도 업황 부담으로 일부 작용했다.\n\n업종별로는 화학제품, 운송장비, 컴퓨터 담당자는 관세 마찰에 따른 비용 상승과 불확실성으로 고객사 설비투자가 연기되고 있으며, 최근 실적 개선도 선수요에 불과하다고 지적했다. 반면 기계와 금속가공 담당자는 철강 가격 급등과 인력 부족, 자재 제약이 겹치며 납기가 크게 지연되고 있다고 우려했다.\n\n---\n\n### 5. 원/달러 환율: 강세 요인과 약세 요인의 대치 국면, 대외 불안 요인이 무게추\n\n원/달러 환율은 6월 초 1,550원선을 넘어서며 급등했으나, 9월초 1,330원선까지 기록적인 단기 하락세를 보인 후 1,300원대 중반에서 숨을 고르고 있다. IBK투자증권은 환율 하락 쪽 의견이 최근 주요 언론사 적정환율 서베이에서 우세한 것으로 파악되지만, 향후 전망은 상승 쪽에 있다고 판단한다.\n\n강세 요인과 약세 요인이 서로 뚜렷한 설득력을 가지고 대치 중이지만, 점차 대외 불안 요인이 주를 이루는 약세 요인 쪽으로 무게추가 옮겨질 것으로 전망한다. 6월 초 이후 환율을 급락시킨 주요 요인인 **SK하이닉스 ADR 발행으로 시작된 달러 공급(기대)**이 수출 기업 전반으로 확산되며 외환시장 수급을 바꿨고, 원화 약세 요인이었던 **외국인 국내주식 대량 매도**가 일단락된 것도 원화 강세 요인으로 작용했다. 정책 요인으로는 **한·미·일의 정책 공조**가 여전히 진행 중이며, 매파적 통화정책을 강화하고 환율 추가 하락을 용인하는 한국은행의 스탠스도 원화 강세 요인으로 작용 중이다. 다만, 이 요인들이 급격한 환율 하락 과정에서 가격에 상당부분 흡수됐고, **원/달러 환율과 가장 밀접한 연동성을 보인 외국인 매매 흐름이 최근 순매도 기류가 강해지는 모습**도 주의할 필요가 있다. 올해 연말 1,400원 전후를 예상하며, 대외 요인 악화 정도에 따라 연말이나 내년 환율이 1,400원대 중후반으로 올라설 가능성도 열어둘 필요가 있다는 판단이다. 원/달러 환율은 불안정하고 변동성이 높은 국면이 지속될 가능성이 높다.\n\n---\n\n### 6. 미국 IPO 시장: 고금리와 AI 투자 불확실성으로 냉각\n\nIPO 시장은 불과 몇 개월 전까지만 해도 낙관적이었던 분위기에서 싸늘해졌다. 헬스케어 스타트업 오우라가 IPO를 통해 22억 달러를 조달할 계획이었으나, IPO 시장의 불확실성을 이유로 9월 29일 상장을 연기했고, 소프트뱅크가 투자한 데이터센터 업체 SB에너지도 높은 기업가치에 대한 투자자 우려로 IPO 일정을 미뤘다. 오픈AI 역시 내년에 예정되어 있던 IPO를 무기한 연기했다.\n\n고금리는 IPO 시장에도 부정적인 영향을 끼쳤다. 고유가와 추가 금리 인상 우려로 장기금리가 높은 수준을 유지하는 가운데, 위험자산 선호심리가 위축되며 기업의 상장에 대한 경계심이 지속되고 있다. 3분기 IPO 건수는 **31건**으로 전분기 대비 감소했고, 총 조달 금액은 **349억 달러**로, 이 중 **265억 달러**는 SK하이닉스 ADR 상장에 집중됐다. SK하이닉스를 제외하면 전체 조달 금액은 **84억 달러**에 불과했다. 신규 상장기업의 주가 성과도 크게 악화됐다. 올해 IPO를 실시한 미국 기업들의 공모가 대비 평균 수익률은 6월 말 **24%**에서 9월 29일 기준 **1% 미만**으로 낮아졌다.\n\n---\n\n### 7. 미 국채금리: 인플레이션 우려·경제지표 견조·재정건전성 우려의 복합 영향\n\n미국 국채금리는 인플레이션 우려, 경제지표 견조함, 재정건전성 우려가 복합적으로 작용하며 상승세를 보이고 있다. 다음 주에도 중동발 지정학적 리스크에 따른 국제유가 흐름과 연준위원들의 발언, 9월 FOMC 의사록에 주목할 필요가 있다. 이 세 요인이 단기간에 모두 해소되기는 어렵고, 따라서 금리가 추세적으로 크게 하락하기 위한 여건은 아직 충분하지 않다. 금리의 방향 전환보다는 상승 속도가 진정될 수 있는지를 확인하는 것이 중요하다.\n\n국제유가가 안정되거나 추가 하락할 경우, 인플레이션 우려와 함께 가파르게 상승했던 미 국채금리의 상승세가 다소 진정될 여지가 있다. 연준의 추가 금리 인상 필요성은 인정하면서도 시점이나 속도에 여유를 두는 모습을 보인다면, 시장의 긴축 경계가 낮아지고 금리 상승 압력이 완화될 수 있다. 9월 FOMC 의사록은 상대적으로 매파적으로 해석될 가능성이 높다. 당시 연준은 기준금리를 25bp 인상했고, 결정도 만장일치였다. 성명에서 여전히 높은 인플레이션에 대한 경계감을 강조했기 때문에, 회의 내부에서도 물가 안정 필요성에 상당한 무게가 실렸을 가능성이 높다. 따라서, 유가 안정과 연준의 덜 매파적인 커뮤니케이션이 동시에 나타날 경우, 최근 가팔랐던 미 국채금리 상승세가 일단 진정될 가능성이 높아 보인다.\n\n---\n\n### 8. 코스피: 반도체 수출 호조와 마이크론 호실적에 힘입어 상승 마감\n\n1일 코스피는 마이크론 호실적과 반도체 수출 호조에 힘입어 상승 마감했다. 장 초반 국채금리 부담에 하락 출발했으나 반등했고, 기관이 순매수하고 외국인과 개인은 순매도했다. 삼성전자(+2.79%) 등 대형 반도체주 강세가 의료·정밀(+5.65%) 등 업종 상승을 견인했다. 코스닥은 반도체 장비주 주도로 급등 마감하며 외국인과 기관이 동반 순매수하고 개인은 순매도했다. 반도체 수출 호조가 코스피 상승을 지지하는 구조는 유지되고 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. 국고채 수급: 세수 재추계와 발행 축소의 시장 영향\n\n9월 30일 세수 재추계 결과, 올해 총 국세수입은 478.6조원으로 추경 대비 63.2조원 증가할 전망이다. 이 중 내국세 초과분 56.2조원은 2027년 예산안에 신설될 미래대응기금으로의 전출, 국채 발행 축소 등에 활용될 수 있다. 재정경제부는 10월 국고채 경쟁입찰 발행 규모를 12조원으로 당초 계획 대비 5조원 줄였다. 시장 상황에 따라 4분기 총 발행을 33조원 내외로 기존 계획보다 13조원 축소할 수 있을 것으로 예상한다.\n\n올해 국고채는 9월까지 약 180조원, 월평균 20조원 발행됐다. 연간 발행 한도 225.7조원 기준으로 4분기에 남은 물량은 46조원이다. 초과세수 중 13조원을 발행 축소에 활용하면 약 33조원(10, 11월 각 14조원, 12월 5조원 발행)으로 줄어든다. 이 경우 연간 총 발행액은 212조원 수준에 그친다.\n\n하나채권은 현 금리 수준이 지속된다는 가정 하에 4분기 발행 축소 규모를 13조원 내외로 예상한다. 이는 채권시장에 분명한 수급 호재로 스왑 스프레드 확대 추세가 이어질 전망이다. 다만 대내외 통화정책 긴축 등을 고려할 때 금리 하락 추세보다 일시적 안정 재료로 판단한다. 9월 4일 [2027년 예산안] 재정수지 개선의 역설에서 강조한 바와 같이, 국고채 수급 이슈를 금리 방향성보다는 스왑 스프레드 관점에서 해석해야 한다.\n\n---\n\n### 2. 외국인 수요의 구조적 변화: WGBI 편입 이후의 월말 집중 패턴\n\nWGBI 편입 초기와 비교해 외국인의 국고채 순매수가 크게 둔화됐다. 5월과 6월 순매수는 각각 13.73조원, 12.58조원이었으나, 7월에는 1.56조원으로 축소됐고 8월과 9월에도 각각 0.74조원, 1.07조원에 그쳤다. 특히 9월에는 국고채 만기상환 5.05조원이 발생해 순매수에서 상환을 차감한 변화가 −3.99조원을 기록했다. 월간 순매수와 상환차감 수급만 보면 외국인의 국내 채권 투자 수요가 빠르게 약해진 것으로 해석할 수 있다.\n\n그러나 월간 매수 둔화에도 월말 최종일의 순매수는 일관적으로 유지됐다. 4~9월 외국인은 각 월의 마지막 거래일에 모두 국고채를 순매수했으며, 해당 금액은 평균 2.39조원이었다. 7월에도 최종일에 1.31조원이 유입됐고, 8월과 9월에는 각각 2.74조원, 2.11조원의 순매수가 발생했다. 특히 8월과 9월은 최종일 순매수가 월 전체 순매수를 웃돌았다.\n\n매수 시점도 월말 주간 전반보다 마지막 거래일에 집중됐다. 4~9월 월말 최종일 직전 4거래일의 국고채 순매수는 일평균 -0.07조원이었으나, 최종일에는 평균 2.39조원의 순매수가 발생했다. 잔존만기 1~30년 명목 국고채로 범위를 좁히면 최종일 순매수는 평균 2.79조원으로 확대된다. WGBI 편입 대상에 가까운 구간에서 매수가 더욱 뚜렷하게 반복됐다는 점은 지수 추종 성격의 수요가 남아 있음을 시사한다.\n\n다만 해당 거래에는 액티브 자금과 기타 외국인 투자자의 매매도 포함되어 있다는 점은 감안해야 한다. 월말 수요의 반복성과 유입 강도는 구분해야 한다. 잔존만기 1~30년 구간의 최종일 순매수는 4~6월 평균 3.17조원에서 7~9월 평균 2.41조원으로 약 24% 감소했다. 따라서 최근 수급은 ‘월말 매수가 사라졌다’기보다 ‘월중 수급이 약해지고 월말 매수 강도도 낮아졌지만, 최종일 집중 패턴은 유지되는 상황’으로 판단한다. 따라서 최근 외인 매수의 트랜드를 고려할 때 10월 말 마지막 단계적 편입에서도 기존 매수 패턴의 반복을 기본으로 보며, 마지막 편입이라는 이유만으로 유입 급증을 가정하기는 어려울 것으로 판단된다.\n\n---\n\n### 3. 금리 방향성: 중단기 하락·장기 상승, 금융당국의 안정화 의지\n\n전일 국내 채권 시장에서 중단기 금리는 하락하고 장기 금리는 상승했다. 미 국채 영향으로 약세 출발했으나 당국의 시장안정 메시지와 국채발행 축소 기대가 반영되며 중단기 강세로 전환했다. 단기물 수급 개선도 우호적 요인으로 작용했다. 금리스와프도 단기 중심 강세를 보였다.\n\n금융위원장은 금융시장 상황점검 회의에서 채권시장 수급 부담이 발생하지 않도록 4Q 은행채, 여전채의 발행규모 및 만기구조를 사전점검할 것임을 확인했다. 또한 금리 상승에 따라 시장안정 프로그램의 적극적 집행 기조와 확충을 언급했다. 금융당국의 시장 안정화 의지는 당일 중단기 금리 하락을 뒷받침하는 직접적 요인이다.\n\n유진투자증권은 국내 9월 수출이 전년대비 83.5% 증가하며 성장 호조를 지지했다고 분석했다. 아시아 장에서 미국 금리와 호주 금리 모두 상승세를 유지하며 글로벌 투심은 여전히 좋지 않아 장기 금리는 상승 마감했다. 국내 3년물 금리는 보합, 10년물은 상승 마감됐으며, 일드커브는 스티프닝했다. 국5/3 스프레드는 18.5bp(-1.5bp), 국10/3 스프레드는 42.7bp(+2.7bp), 국30/10 스프레드는 11.0bp(-0.5bp)로 마감됐다.\n\n---\n\n### 4. 물가 둔화와 금리 방향성의 관계\n\n9월 국내 소비자물가는 전년동월비 2.9%, 전월비 0.3% 상승했다. 8월보다 상승률이 0.2%p 낮아졌으며, 식료품·에너지 제외 근원물가도 3.4%에서 2.8%로 둔화됐다. 통신비 관련 기저효과 등 일시적 상승 요인이 약해지면서 물가 상승세가 완화된 모습이나 근원물가는 7월의 2.6%를 여전히 웃돌아 목표 수준으로의 안정 여부는 추가 확인이 필요해 보인다. 이는 높은 기조적 물가가 남아 있는 가운데, 수요 측 상승 압력의 추가 확산은 제한됐다는 점에 의미가 있다.\n\n공급 측면에서는 농축수산물과 전기·가스·수도가 당월 물가 상승을 주도했다. 두 부문은 전월비 각각 2.3%, 5.5% 상승하며 전체 물가에 0.18%p, 0.20%p 기여했다. 채소류와 전기료의 월간 상승에는 계절적 요인이 포함돼 있어 이를 지속적인 물가 가속으로 해석하기는 어렵다. 반면 전년동월비로는 석유류가 14.8% 상승하며 전체 물가에 0.56%p 기여해 에너지 비용 부담이 이어졌다. 따라서 향후 공급발 물가는 계절 요인의 정상화와 함께 국제유가·환율의 움직임, 누적된 비용 상승의 소비자가격 전이 정도에 영향을 받을 전망이다.\n\n수요 측면에서 외식·사교육·이미용·국내 여가 등 74개 품목을 고정 가중치로 재집계한 수요 민감 서비스 물가 상승률은 8월 2.47%에서 9월 2.33%로 낮아졌으며, 외식을 제외한 지표도 1.97%에서 1.95%로 둔화됐다. 공식 개인서비스 물가가 3.5%, 외식 제외 개인서비스가 4.3%를 기록한 것과 비교하면, 서비스 물가의 높은 상승률을 광범위한 수요 확대의 결과로 해석하는 데에는 신중할 필요가 있다. 비록 임금·임대료 등 비용 영향을 포함하지만, 적어도 국내 소비에 민감한 서비스 전반에서 가격 상승이 가속되고 있다는 증거는 강하지 않다.\n\n최근 3년의 월별 계절 패턴과 올해 가격 상승 속도를 반영한 기준 경로에서 수요 민감 서비스 물가는 10~12월 각각 2.43%, 2.45%, 2.37%, 외식 제외 지표는 1.97%, 1.93%, 1.92%로 추정된다. 이는 연말까지 수요발 물가 압력이 급격히 확대되기보다 현재 수준에서 유지될 가능성을 시사한다. 내년에도 이러한 흐름이 이어지고 에너지·환율 부담이 완화된다면 당사의 소비자물가 상승률 2.3% 전망에 부합하는 점진적 둔화가 가능할 것으로 판단한다. 내년 물가의 관건은 소득 개선이 소비·임금 상승으로 확산되는 정도이며, 수요 민감 서비스 가격이 다시 가속할 경우 물가 둔화 속도도 제약될 수 있다.\n\n---\n\n### 5. 대내외 여건의 엇갈림: 긴축 경계와 수급 호재의 공존\n\n신한투자증권은 미국 GDP 성장률 상향에 따른 강달러·엔 약세와 외국인 주식 순매도가 달러-원 환율 상승의 상방 요인으로 작용했다고 분석했다. 달러인덱스는 101.6선, 달러-엔 환율은 158엔대를 유지했다. 수출업체 네고는 상단 제한 요인으로 작용했다.\n\n유안타증권은 외화자금 여건에 따라 환율 변동성이 확대될 수 있다고 지적했다. 상반기 대외금융순자산은 크게 감소했으나, 외국인이 보유한 국내 주식의 평가액이 크게 증가했기 때문이다. 반면 경상계정에서 외국인의 증권투자는 유출이 확대됐다. 즉, stock 지표와는 달리 flow 지표에서는 외국인의 주식 매도에 의한 달러화 유출이 커졌다. 여기에 해외 IPO에 대한 투자를 위한 달러자금 수요가 급증하면서 상반기에 환율 상승폭이 확대됐다.\n\n하반기 환율 하락은 반도체 수출기업의 환전 수요 급증의 영향이 크게 작용했다. 특정 수출 품목에 의해 환율이 크게 변동할 때에는, 이와 연관되어 있는 외화자금 흐름도 같이 고려해야 한다. 과거 조선업 호황 시기에도 이들 기업과 연관된 외화자금 수급에 따라 환율 변동폭이 커졌기 때문이다. 반도체 호황은 역내에 달러자금 공급을 확대시켰다. 이에 상응해서 달러자금을 조달해야 하는 포지션도 늘어나게 되었다. 향후 외화자금의 공급 강도 변화에 따라 FX swap뿐 아니라 환율 변동 확대 요인으로도 작용하게 될 것이다.\n\n---\n\n### 6. 대내외 금리 전망: 구조적 하방경직성과 단기 급등의 구별\n\n신한투자증권은 미국 GDP 성장률 상향에 따른 강달러·엔 약세와 외국인 주식 순매도가 달러-원 환율 상승의 상방 요인으로 작용했다고 분석했다. 달러인덱스는 101.6선, 달러-엔 환율은 158엔대를 유지했다. 수출업체 네고는 상단 제한 요인으로 작용했다.\n\n미국 측에서는 재정건전성 우려와 경쟁적인 자본 조달 수요, 외국인 투자 수요 약화 등이 중장기 금리의 하방경직성을 높이는 구조적 요인으로 잔존한다. 다만 최근 금리 급등은 구조적 요인보다 금리 인상 사이클 진입을 단기간 내 가격에 반영한 영향이다. 에너지발 물가의 2차 파급이 제한된다면 연말로 긴축 경계 되돌림이 예상된다. 신한투자증권의 3개월 밴드 및 전략은 2년 4.5~5.1%, 10년 4.8~5.4%이며 듀레이션 중립이다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 통신 산업: 선순환 구조가 감지되는 배경과 파급\n\n**핵심 현상**: 미국 8월 근원 CPI에서 무선통신 요금이 전월 대비 6% 급등 → 2026년 하반기 미국 통신 3사가 신규 주파수 할당을 준비하며 기존 요금제 폐지 및 새로운 요금제 출시 → 특정 요금제 요금 할인 폭 축소로 사실상 가격 인상 조치 → 네트워크 투자 부담 일부 요금제 전가 → 전세계 다수 국가에서 통신 품질에 따른 요금 차등 필요성 강조 → LTE 도입 이후 데이터 사용량에 따른 요금 차등 보편화에서 품질 차등으로 이동\n\n**경제적 메커니즘**: \n- **요금 인상 → 재료비 상승 → 수익성 압박 → 추가 요금 인상**의 고리가 형성되는 구조. 미국의 경우 2027년 4월 어퍼 C밴드 경매 이후 700MHz 이상 5G 주파수 확장이 예정되어 있고, 국내는 2026년 12월 LTE 주파수 사용 기간 만료로 일부 주파수가 5G로 재사용될 예정. 그러나 LTE 가입자 1,800만명을 무시하고 2027년 대다수 주파수를 5G로 전환하기 어려운 현실. 결국 2027년 5G 추가 주파수 경매가 불가피 → 트래픽 증가 → 신규 주파수 할당 → CAPEX 증가 → 요금 인상의 선순환 구조.\n\n**의미/파급효과**:\n- **규제 리스크**: 망중립성 논쟁 발생 가능. AI 시대 네트워크 품질 향상 요구가 반영된 결과로 망 품질 별 요금 차등화 정책은 긍정적 평가 예상. 그러나 환경단체와 천문학계의 소송 가능성 배제 불가.\n- **국내 전략**: 2027년 5G 추가 주파수 경매를 감안한 2026년 연말 이후 5G 요금제 개편 작업 예정. 3.7GHz대역 300MHz 우선 할당 예상. RFHIC/KMW/HFR/LIG아큐버/쏠리드/오이솔루션이 대표 수혜주. 미국/국내 주파수 경매 관련주 집중 투자 권고.\n\n**종목 전략**: SKT(2027년 비과세 배당/엔트로픽 상장/AI 데이터센터 및 기지국 사업 확장 호재) > KT=LGU+ 순. 통신장비주 중 미국/국내 주파수 경매 관련주 집중.\n\n---\n\n### 2. 자동차: 3분기 실적 하회와 4분기 개선 기대의 조건\n\n**핵심 현상**: 3분기 국내증시 일평균 거래대금 52.4조원(QoQ -41.7%), 9월 일평균 거래대금 40.1조원(MoM -19.0%) → KOSDAQ 중심 거래 위축. 3분기 완성차 실적은 물량 부진과 환율 하락 등으로 기존 추정치 하회. 현대차/기아 3분기 판매 91.9만대/84.7만대(YoY -11% / +8%). 3분기 원/달러 평균환율 1,417원(전년 동기대비 +2%, 전분기 대비 -6%), 기말환율 1,358원(2026년 2분기말 1,548원 대비 -12%).\n\n**경제적 메커니즘**: \n- **판매 부진**: 3분기 판매대수는 하나증권 기존 추정치 대비 현대차 -12%, 기아 +2% → 3분기 실적추정 주요 변수 (물량, 가격, 평균환율, 기말환율, 원재료)를 감안한 3분기 실적은 기존 추정치 하회. 4분기 개선 기대 조건은 (1) 생산차질 해소 (노조 부분파업 영향), (2) 신차 출시, (3) 재료비 하락. 그러나 10월 급락한 환율로 수출 채산성에 부정적 영향.\n\n**의미/파급효과**:\n- **주가**: 자동차 주가가 6~7월 급격한 조정 후 8월 이후 박스권 내 등락. 현대차/기아 12MF P/E 각각 10배대/6배대 → 글로벌 동종업체 평균 8배 초반 대비 자동차 업체로서 소폭 저평가 수준.\n- **4분기 모멘텀**: 10월 이후 BD의 로봇 생산법인 RA 설립 및 지분구조 확정, 공급망 구축, 산업 내 주요 휴머노이드 로봇 출시. 2027년 SDV Pace Car 출시로 자율주행 모멘텀 가세 기대.\n\n---\n\n### 3. 통신 3사: 실적 하회 vs. 2027년 선순환 구조 기대\n\n**핵심 현상**: 3분기 통신 3사 실적은 하나증권 기존 추정치 하회. 현대차/기아 3분기 실적 하회의 핵심 변수인 원/달러 평균환율 1,417원(전년 동기대비 +2%, 전분기 대비 -6%), 기말환율 1,358원(2026년 2분기말 1,548원 대비 -12%)은 자동차 외에도 통신 3사의 해외 수익성에 영향. 그러나 2027년 신규 주파수 경매(3.7GHz대역 300MHz 우선 할당)로 CAPEX 증가 → 요금 인상의 선순환 구조 형성 기대.\n\n**종목 전략**: SKT > KT = LGU+ 순. SKT는 2027년 비과세 배당/엔트로픽 상장/AI 데이터센터 및 기지국 사업 확장 호재. KT, LGU+는 SKT 주가 상승과 연동.\n\n---\n\n### 4. 제약/바이오: 4분기 기대와 실적 하회의 희석 요인\n\n**핵심 현상**: 3분기 환율 1,423원/달러(2Q 평균 1,502원/달러로 5% 하락) → 수출 비중이 높은 기업의 3Q26 컨센서스 하향 가능성. 그러나 3Q 환율 변동은 모두가 우려하며 지켜봤기에 실적이 -5% 이내 수준이라면 악재로 작용하지 않을 전망. 환율을 희석할 이벤트로 3Q26에서 주목할 기업: 삼성바이오로직스(록빌 공장 첫 매출 vs. 노조 총파업 손실 추정치), 삼성에피스홀딩스(마일스톤 유입), 셀트리온(2Q→3Q QoQ% 감안), 한미약품(Genentech향 대규모 선급금 유입), 알테오젠(Qlex sales milestone, Novartis향 L/O 선급금 등 주요 기술료 추정 영역).\n\n**바이오텍**: ESMO 컨퍼런스 시즌 진입. Merck/Moderna가 INTerpath-001 암백신 3상 결과를 Presidential Symposium 세션에서 발표 예정. 항암백신 관련 종목 미리 점검 권고.\n\n**코스닥 세그먼트**: 거래소 4분기 공청회 개최 및 내년 시행 연기. 구체적 계획 미공개. 하위 세그먼트에만 투자하는 액티브 ETF 제안 및 소득 공제 혜택 부여 논의 중. 현재 국내 ETF 투자금은 소득공제 혜택 없음. 바이오텍 기관/개인 선호도 괴리로 종종 설명할 수 없는 시가총액 형성 및 변동성 심화. 시행 가능성과 영향력에 대해 고민 필요. 기업별 펀더멘털에 집중 권고.\n\n---\n\n### 5. 통신 서비스 업종: SKT 주가 상승과 연동 효과\n\n**종목 전략**: SKT > KT = LGU+ 순. SKT는 2027년 비과세 배당/엔트로픽 상장/AI 데이터센터 및 기지국 사업 확장 호재. KT, LGU+는 SKT 주가 상승과 연동. 통신장비주 중 미국/국내 주파수 경매 관련주 집중 투자 권고.\n\n---\n\n### 6. 통신장비: 미국/국내 주파수 경매 관련주 수혜\n\n**핵심 수혜주**: RFHIC/KMW/HFR/LIG아큐버/쏠리드/오이솔루션. 미국 2027년 4월 어퍼 C밴드 경매(700MHz 이상 5G 주파수 확장), 국내 2027년 5G 추가 주파수 경매(3.7GHz대역 300MHz 우선 할당)로 CAPEX 증가 기대. 국내 EPC 및 기자재 업체의 미국 에너지 인프라 시장 진출 확대 기대. 건설업 관점에서 Project Star는 구체적 사업 일정 및 한국 기업의 설계/시공 참여 기회 명시. Project Power는 APR1400 미국 진출 및 AP1000 공급망 참여 기회 열림.\n\n---\n\n### 7. 로봇/방산: 휴머노이드 출시와 주가 모멘텀\n\n**핵심 이벤트**: 보스턴 다이내믹스, 새로운 휴머노이드 손 공개. IDC \"2026년 상반기 세계 휴머노이드 출하량 2.5만대\". 10월 이후 BD의 로봇 생산법인 RA 설립 및 지분구조 확정, 공급망 구축, 산업 내 주요 휴머노이드 로봇 출시. 2027년 SDV Pace Car 출시로 자율주행 모멘텀 가세 기대.\n\n**국내 로봇 주요 뉴스**: 뉴로메카, 디아이씨에 자동차 부품 자동화 설비 공급. 에이딘로보틱스, 두산로보틱스와 국책과제 참여. 브릴스, 코스닥 상장 \"글로벌 로봇 플랫폼 기업 도약\". 코스모로보틱스, '허위 매출' 의혹 전면 부인.\n\n---\n\n### 8. Micron FY4Q26: 사상 최대 실적과 가격 상승 구조\n\n**핵심 수치**: Micron FY4Q26 (2026년 6월~8월) 전사 매출액 542억불(QoQ +31%, YoY +379%) → 시장 컨센서스 515억불 상회. EPS 33.42불(시장 컨센서스 31.83불 상회). 전사 매출총이익률 87.0%(QoQ +2.1%pt), 영업이익 446억불(OPM 82.3%) → 시장 컨센서스 0.8%pt, 4.4% 상회.\n\n**구조 분석**: \n- **DRAM**: 매출액 398억불(QoQ +27%, YoY +343%) → 출하량 전분기 대비 한자리중반% 증가, ASP 10%후반 상승.\n- **NAND**: 매출액 141억불(QoQ +42%, YoY +526%) → 출하량 전분기 대비 약 10% 증가, ASP 약 30% 상승.\n\n**의미**: 가격 상승(ASP)과 출하량 증가의 복합 효과로 실적 견인. OPM 82.3%는 수익성의 극단적 수준.\n\n---\n\n### 9. 미용의료: 2025년 조정 이후 2026년 회복 신호\n\n**ISAPS 2025 Review**: 비수술 시술 1,732만건(YoY -16%), 톡신 733만건(-7%yoy), HA 필러 474만건(-25%yoy), 비수술 피부 타이트닝(EBD 장비) 153만건(+23%). ISAPS 통계는 성형외과 전문의 대상으로 집계되어 메드스파 등을 포괄하지 않음 → 주사제 시장 전체 흐름 해석의 한계.\n\n**2026년 실적**: 애브비·갈더마·에볼루스 미용 톡신 매출액 모두 YoY +10% 이상 증가. 에볼루스는 GLP-1 투여 환자의 필러 수요 증가에 힘입어 HA 필러 시장 반등 조짐. 갈더마 스컬트라 상반기 매출액 YoY +18% 추정 → 바이오스티뮬레이터·스킨부스터 주사제 카테고리 내 가장 높은 성장세.\n\n**산업 시사점**: 경기 영향으로 소비자 지출 제한 → 카테고리 간 경쟁. 중장기적으로 피부 질 개선, 체중 감량 후 탄력 보완 등 새로운 수요로 시장 저변 확대 예상. 제품 경쟁력 확보 및 마케팅·교육을 통한 신규 제품 반복 구매 연결 필요.\n\n**국내 기업**: 파마리서치(2027년 유럽·아시아 스킨부스터 침투 예상), 휴젤(7월 직접판매 체제 가동, 2027년 상반기 실적 확인 예정). 파마리서치(BUY, TP 54만원, 2027E PER 12배), 휴젤(BUY, TP 37만원, 2027E PER 11배) → 밸류에이션 매력과 해외 사업 중장기 성장 여력 겸비.\n\n---\n\n### 10. 통신/에너지: SMP 약세와 정상화 시나리오\n\n**현재 상태**: SMP 약세가 10월에도 이어짐. LNG 연료비단가와 격차가 큰 상황 지속 → 단순 수요 감소로 설명 어려움. 실계통 기반 제약 이슈 추정. 실제 정산금 영향으로 한국전력 3분기 실적 긍정적, 발전사 부정적. 정상화 시 SMP는 LNG 연료비단가와 유사한 150~160원/kWh 수준 상승 예상.\n\n---\n\n### 11. 가스/에너지: 알래스카 LNG와 원자력 프레임워크\n\n**Project North**: 알래스카 LNG. 글렌파른은 1~2단계 사업비 445~545억달러 제시. 팩트시트와 차이로 540억달러 언급. 연간 200억달러 한도 초과 시 투자가 진행되지 않는 조건. 웨스팅하우스 소수지분 투자 및 원전 설계 2030년까지 완료 조건. 후속 프로젝트향 사업비 집행 시점 다소 늦어질 가능성.\n\n**Project Power**: 한미 원자력 프레임워크. 미국 상무부·에너지부·WEC·한국정부·한국전력·한수원 참여. 미국 원자력 에너지 행정명령 목표 달성에 기여하는 포괄적 협력 구조. 기자회견에서 오하이오, 테네시, 사우스캐롤라이나, 켄터키 언급 → 기존 DOE 프로젝트 보완 성격. 원전 협력 프로젝트와 알래스카 LNG는 별개 프로젝트.\n\n**Project Star**: 텍사스 엔시날 LNG 복합화력 발전. 1단계 상용화 2029년, 최대 용량 2032년. 엔시날, Lewis Energy Group, NextEra 등 파트너. 구체적 사업 일정 명시. 국내 EPC 및 기자재 업체의 미국 에너지 인프라 시장 진출 기대.\n\n---\n\n### 12. 통신/에너지: 재생에너지 확대와 NWAs\n\n**재생에너지 수용량**: 2030년 송전 기준 119GW → 171GW(+52GW), 배전단 84GW → 110GW(+26GW). 유연접속 도입(재생에너지 출력이 수용량을 초과할 때만 제어), 배전선로 최대 접속용량 14MW→16MW, 변압기 50MW→60MW 상향. ESS 등으로 증설 효과를 내는 '전력망 비증설 대안(NWAs)' 추진: 2030년까지 태양광 추가 설비를 배전망 ESS로 3GW, 변전소 ESS로 1.6GW 추가 접속 계획.\n\n---\n\n### 13. 통신/에너지: 석탄발전소 폐쇄 방안\n\n**안건 내용**: 현재 가동 중인 석탄발전소 60기 중 설계수명 30년 도래 39기를 2038년까지, 잔여 수명이 존재하는 21기를 2040년까지 조기 폐쇄하고 남은 10기는 비상시를 대비한 안보전원으로 남기기. 잔여 10기 대부분 설계수명이 많이 남아 있는 민간석탄설비로 구성될 가능성이 높음.\n\n---\n\n### 14. 통신/에너지: 국정감사와 투자 계획\n\n**국정감사 일정**: 6일 기후부·산업부, 12일 한국전력·한수원, 19일 한국가스공사. 12차 전기본 및 해외 투자, 공기업 통폐합 관련 질의로 보다 상세한 정보 공개 예상.\n\n**KAU26 가격**: 30일 종가 기준 30,550원(전주대비 -0.7%, YTD +188.5%).\n\n---\n\n### 15. 통신/에너지: WTI, LNG, 원/달러 환율\n\n**WTI**: 30일 종가 97.2달러/배럴(WoW +0.4%). 중동 리스크 완화 기조에 JKM 20달러 중반으로 하락했으나 여전히 높은 수준.\n\n**LNG**: 아시아 LNG 현물 25.7달러/mmbtu(+0.0%), 호주산 유연탄 146.5달러/톤(+1.2%).\n\n**원/달러**: 30일 종가 1,356.9원(-0.7%).\n\n---\n\n### 16. 통신/에너지: 미국 10년물 국채 금리와 제약/바이오 섹터\n\n**미국 10년물 국채 금리**: 5% 돌파 → 올해 내 섹터 YTD 회복을 바라는 수준의 상승률 기대 어려움. 그러나 기업 별 아직 실현되지 않은 이벤트와 글로벌 트렌드 상 4Q에 제약/바이오 기업에 기대 유지.\n\n---\n\n### 17. 통신/에너지: 고객예탁금과 신용공여잔고\n\n**고객예탁금**: 9/29 107.7조원(MoM +8.0%). 7월 중순 이후 100조원 초반 수준 유지.\n\n**신용공여잔고**: 59.0조원(MoM +0.4%). 최근 2개월간 큰 변동 없음.\n\n---\n\n### 18. 통신/에너지: 해외주식 거래규모와 순매수대금\n\n**3분기**: 1,249억달러(QoQ -30.7%), 순매수대금 74억달러.\n\n**9월**: 339억달러(MoM -16.0%), 순매수대금 10억달러. 거래규모는 분기·월간 기준 2024년 상반기 이후 가장 낮은 수준. SGOV ETF(2.9억달러), SCHD ETF(2.3억달러) 등 미국 채권 및 배당형 ETF 중심 매수세 유입.\n\n---\n\n### 19. 통신/에너지: 국고채 금리\n\n**국고채 3년물**: 4.01%(전분기대비 +31bp). **국고채 10년물**: 4.41%(전분기대비 +32bp). 1Q26 60bp, 50bp 대비 3분기 31bp, 32bp 상승.\n\n---\n\n### 20. 통신/에너지: 고객예탁금과 신용공여잔고\n\n**고객예탁금**: 9/29 107.7조원(MoM +8.0%). 7월 중순 이후 100조원 초반 수준 유지.\n\n**신용공여잔고**: 59.0조원(MoM +0.4%). 최근 2개월간 큰 변동 없음.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 10월 3분기 실적시즌: 환율 압박과 실적 모멘텀의 경쟁 구도\n\n3분기 실적시즌은 환율과 실적 모멘텀의 경쟁 구도에서 전개될 전망이다. 유안타증권은 7월 이후 개인 매수세가 둔화되고 외국인 수급 민감도가 높아진 가운데, 원달러 환율이 6개월 이동평균을 하회하면 외국인 매수우위로 전환이 가능하다고 분석한다. 신한투자증권은 9월 수출이 전년대비 +83.5%를 기록하며 1,200억 달러를 돌파하는 역대급 성과를 보였고, 반도체(+262.8%), 컴퓨터(+435.3%), 전력기기(+23.0%) 등 AI 밸류체인 업종이 선별적으로 강세를 보였다.\n\n그러나 이익 사이클의 핵심 변수는 환율이 아니라 업황이라는 점에서 유안타증권의 판단이 신한투자증권의 실적 호조와 상호 보완적이다. 환율이 6개월 이동평균을 하회할 경우 외국인 수급이 개선되고, 3분기 실적 시즌 특수를 활용한 전략이 유효하다는 유안타증권의 제안은 이 두 요인을 동시에 만족시키는 구조다. 다만, 9월 수출의 역대급 서프라이즈는 이미 프리뷰 시즌에 주가에 선반영됐다는 지적이 존재하기 때문에, 실적 발표 후의 서프라이즈 강도와 셀온에 따른 비중 조절 전략이 핵심이다.\n\n### 2. 금리-환율-외국인 수급의 연쇄: 연준 부의장 발언과 미국 10년물 금리\n\n키움증권은 미국 10년물 금리가 5.36%까지 상승하면서 시장의 고금리 상수 설정에 민감하게 반응하고 있음을 지적한다. 미국 9월 ISM 제조업 PMI 가격지수 급등과 프랑스 재정 우려로 유럽 금리가 급등하면서 10년물 금리 상승 압력이 강화됐다. 이후 제퍼슨 연준 부의장이 \"정책 조정에 시간이 필요할 것\"이라는 비둘기파적 발언과 마이크론(+3.0%), 엑센츄어(+15.8%)의 호실적 효과에 힘입어 미국 증시가 전약후강 장세로 마감했다(다우 +0.04%, S&P500 +0.19%, 나스닥 +0.04%, 필라델피아 반도체 지수 +1.59%).\n\nIBK투자증권은 전일 국내 증시가 미국 10년물 금리 5.3%대 돌파 부담으로 하락 출발했으나, 마이크론 호실적, 한국 9월 수출 호조 등으로 급등 마감(코스피 +2.0%, 코스닥 +4.5%)했다고 분석한다. 9월 ISM 제조업 PMI 공급 부족 품목에 DRAM이 올해 처음으로 포함됐다는 점은 반도체 등 국내 증시의 실적 가시성 둔화 우려를 완화해주는 요인이다. 미국 10년물 금리 상승 속도는 기간 프리미엄, 채권 시장의 기술적인 매도세 등 여타 요인들이 중첩되어 있었기 때문에, 9월 고용이 컨센 부합만 하더라도 10년물 금리의 빠른 레벨 다운은 일어나지 않을 가능성이 높다. 그러나 약 2주만에 5.0%에서 5.3%까지 빠르게 돌파했던 상승 속도 자체가 진정되는 것이 긍정적이다.\n\n### 3. 10월 중간선거와 에너지 가격: 미-이란 협상과 전략비축유 추가 공급\n\n키움증권은 미국 11월 중간선거를 앞두고 에너지 가격 안정이 정치적 부담으로 작용하고 있음을 분석한다. 9월 말 미국의 디젤 소매 가격은 갤런당 6달러를 넘었고, 가솔린 가격은 갤런당 4달러를 상회했다. 미국 에너지부는 최대 4,000만 배럴 규모의 전략비축유를 추가 공급하기 위한 절차에 착수했다. 또한 계절적인 수요가 종료되는 10월은 미국 정유시설의 정기 보수가 본격적으로 진행되는 시기이며, 미국 에너지정보청(EIA)도 미국 정유사의 원유 투입량이 9~10월 감소할 것으로 전망한다. 정유 가동률 하락은 단기적으로 정유사의 원유 구매 수요를 낮추는 만큼, 중동 불안 속에서도 유가의 상단을 제약하는 요인으로 작용할 전망이다.\n\n미-이란 간 협상은 교착 상태에 머물고 있기는 하나, 사우디와 후티 반군 간 군사적 충돌이 재개될 가능성은 낮아 보인다. 사우디 동서 파이프라인 운영 및 얀부항을 통한 원유 수출 재개 소식도 보도됐고, 미국과 이란이 카타르의 중재를 통해 단계적 합의 방안에 대한 협상 가능성을 여전히 열어두고 있다는 점도 주목할 필요가 있다. 미국의 중동 추가 파병 소식은 군사적 긴장을 높이는 부담으로 작용하지만, 11월 중간선거를 앞두고 이란과의 긴장을 추가로 자극하기는 어려워 보인다.\n\n### 4. AI 데이터센터: 성장 자산에서 규제 자산으로의 전환과 글로벌 라벨링 체계\n\nSK증권은 AI 데이터센터가 '성장 자산'이라는 인식에서 '규제 자산'이라는 인식으로 전환되고 있음을 분석한다. EU는 전력수요 500kW 이상의 모든 데이터센터에 전력 및 물 사용 효율에 따라 A~G 7등급으로 라벨링을 시작하고 2027년 8월부터 EU 공동 DB에 전자 라벨을 게시할 예정이다. 재생에너지 및 원자력에너지 등 에너지원 조달 관련 내용도 정보 패키지에 포함될 예정이다. 원자력에너지가 저탄소 에너지원으로 공식 지위를 부여받으면 프랑스·핀란드 등 원전 보유국과 SMR 기반 데이터센터 전략이 수혜를 받을 가능성이 크다.\n\n미국은 캘리포니아를 시작으로 전력·물·토지 부문 데이터센터 관련 법안을 신설하고 있다. 송전망 업그레이드 비용을 사업자에게 전가하고 물 공급 평가 및 물 부족 대책 제출을 의무화하는 것이 주요 골자다. 동부 버지니아 지역은 냉각수 부족 지정 지역으로 선정되면서 데이터센터 건설에 대한 모라토리엄(일시 중단) 건수가 급증하고 있다. 글로벌 하이퍼스케일러는 100% 재생에너지로 데이터센터를 운영한다는 것을 증명해야 하는 상황이 되고 있다. 글로벌 데이터센터 사업에 참여하는 한국 기업들도 라벨 등급, 인허가, 인프라 개발 비용 전가 등 문제를 직면할 가능성이 크다. 원자력에너지의 저탄소 지위 공식화는 SMR+데이터센터 조합에 대한 글로벌 관심을 높일 수 있는 요인이 될 전망이다.\n\n### 5. KQ 3개월 만 890p 안착과 소부장 강세: 반도체 CapEx 기대와 IT 하드웨어\n\n신한투자증권은 KQ가 3개월 만에 890p를 안착하며 11일 중 10일 상승했다고 분석한다. 반도체 CapEx 기대 속 소부장 강세가 KQ 상승을 견인한 것으로 판단한다. 반도체 CapEx 기대는 마이크론의 2027년 출하량 75% 이상 확보와 고객사와 공급 배분 논의가 2028년으로 이동하는 낙관적 전망에서 기인한다. 9월 ISM 제조업 PMI 공급 부족 품목에 DRAM이 올해 처음으로 포함됐다는 점은 반도체 수요 지표로도 실적 가시성을 높이는 요인이다.\n\n키움증권은 3분기 실적시즌을 앞두고 9월 한국 수출(YoY +83.5%)이 추석 연휴로 인한 조업일수 감소에도 역대급 서프라이즈를 시현했고, 반도체(+262.8%), 컴퓨터(+435.3%), 전력기기(+23.0%) 등 AI 밸류체인, 자동차(-29.8% → -5.5%), 선박(-45.9% → +29.9%) 등 여타 주력업종들도 수출 모멘텀이 개선됐다. 이익 개선 기대가 회복되고 있다는 점이 상방 모멘텀을 부여하고 있는 상황이다. 3분기 실적 발표 후의 서프라이즈 강도와 셀온에 따른 비중 조절 전략이 핵심이다.\n\n### 6. 9월 1주차 KOSPI200: 1,088.90pt → 1,107.75pt, 낙폭 과대 인식과 반도체-대형주 반등\n\n한화투자증권은 9월 28일~10월 1일 KOSPI200 최근월물이 대외 매크로 불확실성과 통화 긴축 우려, 미 국채 금리 부담으로 주 초반 1,088.90pt까지 큰 폭 하락 출발했다고 분석한다. 이후 낙폭 과대 인식이 확산되는 가운데 반도체 및 대형주 중심의 반등 기대에 힘입어 주 후반 1,107.75pt로 상승 마감했다. 주 초반 하락 압력 속에서도 저가 매수세가 지수 반등을 견인하며 주간 낙폭을 점진적으로 축소하는 흐름을 형성했다. 이는 9월 3주차에 비해 낙폭이 상대적으로 양호한 흐름으로, 10월 중간선거를 앞두고 미국 10년물 금리 5.36% 상승 압력이 있었음에도 국내 증시가 반도체 호재와 9월 수출 서프라이즈를 통해 상승 마감한 것과 맥락이 일치한다.\n\n### 7. 9월 1주차 KOSDAQ: +4.48% 급등, 894.29P 마감과 반도체 중심 강세\n\nIBK투자증권은 9월 1주차 KOSDAQ이 반도체 관련주가 큰 폭 상승하며 외국인과 기관 순매수에 전 거래일 대비 +4.48% 급등한 894.29P로 마감했다고 분석한다. 반도체 CapEx 기대와 9월 수출 호조, AI 밸류체인 업종의 수출 모멘텀 개선이 반도체 섹터 강세를 견인한 것으로 판단한다. KOSPI는 마이크론 호실적과 반도체 수출 호조에 상승하며 전 거래일 대비 +1.95% 상승한 6,971.35P로 마감했다. 미국 PCE 지표 둔화로 물가 부담이 완화되고, 마이크론 실적이 예상치 상회하면서 투자심리가 회복됐다. 9월 수출 영향 반등과 MU 실적 발표 이전의 숨고르기, GPM 가이던스(86.25%) 실망에도 호실적(매출 542.3억 달러)이 견인한 것이다. 반도체 CapEx 기대와 소부장 강세는 KQ 상승을 견인했고, 3개월 만에 890p를 안착한 것은 반도체 섹터의 모멘텀이 강한 신호이다.\n\n### 8. 9월 3주차 KOSPI: +2.0% 상승, 미국 10년물 금리 5.3% 돌파와 마이크론 호실적\n\nIBK투자증권은 9월 3주차 KOSPI가 미국 10년물 금리 5.3% 돌파 부담으로 하락 출발했으나, 이후 마이크론 호실적과 한국 9월 수출 호조 등으로 반등에 나서면서 급등 마감(코스피 +2.0%, 코스닥 +4.5%)했다고 분석한다. 마이크론의 2027년 출하량 75% 이상 확보와 고객사와 공급 배분 논의가 2028년으로 이동하는 낙관적 전망, 9월 ISM 제조업 PMI 공급 부족 품목에 DRAM이 올해 처음으로 포함됐다는 점이 반도체 등 국내 증시의 실적 가시성 둔화 우려를 완화해주는 요인이다. 9월 수출(YoY +83.5%)이 추석 연휴로 인한 조업일수 감소에도 역대급 서프라이즈를 시현했고, 반도체(+262.8%), 컴퓨터(+435.3%), 전력기기(+23.0%) 등 AI 밸류체인, 자동차(-29.8% → -5.5%), 선박(-45.9% → +29.9%) 등 여타 주력업종들도 수출 모멘텀이 개선됐다. 이익 개선 기대가 회복되고 있다는 점이 상방 모멘텀을 부여하고 있는 상황이다.\n\n### 9. 10월 3분기 실적시즌 전략: 서프라이즈 선별과 비중 조절\n\n유안타증권은 10월 3분기 실적시즌 전략으로 1) 실적발표 전 어닝 서프라이즈 확률이 높은 종목 선별과 2) 실적발표 후 서프라이즈 강도와 셀온에 따른 비중 조절 전략을 제시한다. 신한투자증권은 3분기 실적 발표가 이후의 실적 가시성 확보 기대감을 이전보다 높게 가져갈 수 있는 전제가 됐다고 분석한다. 3분기 실적 발표 후의 서프라이즈 강도와 셀온에 따른 비중 조절 전략이 핵심이다. 반도체 CapEx 기대, 9월 수출 서프라이즈, AI 밸류체인 업종의 수출 모멘텀 개선이 이익 사이클의 훼손 우려를 완화하고 있다. 3분기 실적 발표 후의 서프라이즈 강도와 셀온에 따른 비중 조절 전략이 핵심이다. 추후에도 미국 금리 상승 피로감을 수시로 겪는 과정에서 주식 비중 축소 욕구가 높아지는 것은 자연스러운 현상일 수 있으나, 3분기 실적 발표 후의 서프라이즈 강도와 셀온에 따른 비중 조절 전략을 우선순위로 설정하는 것이 적절하다. 반도체 및 코스닥 소부장, IT 하드웨어 등 AI 밸류체인 업종의 비중 확대 전략이 핵심이다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n한국 수출이 사상 최대를 기록하며 반도체와 AI 수요 확대에 힘입어 강세를 보이고 있으나, 미국 ISM 제조업 PMI 하락과 원/달러 환율의 불안정성은 경기 회복의 지속성을 의심하게 만든다. 채권 시장에서는 국고채 수급 개선과 외국인 매수 패턴의 변화가 주목되며, 금리 방향성은 중단기 하락과 장기 상승의 이중 구조를 보이고 있다. 산업 섹터별로는 통신, 자동차, 로봇 등이 향후 성장 모멘텀을 기대할 수 있으나, 환율, 원자재 가격, 수요 변동성 등 외부 요인의 영향을 고려해야 한다. 시장의 변동성과 불확실성은 여전히 높은 수준으로, 투자 시 이러한 요소들을 종합적으로 판단하는 시각도 가능하다."}]}</script>
