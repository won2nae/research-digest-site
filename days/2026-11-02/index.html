<script id="__DATA__" type="application/json">{"date": "2026-11-02", "headline": "한국 수출: 반도체 의존도 감소 vs AI 호조", "market": {"KOSPI": {"label": "코스피", "value": 5859.08, "change": 2.24, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 734.36, "change": 1.38, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1346.0, "change": 0.76, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 96.28, "change": -7.53, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 3956.4, "change": 1.47, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 4.915, "change": -1.45, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.042, "change": 3.4, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51983.98, "change": 0.41, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7541.4, "change": -0.51, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 25164.32, "change": -1.07, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 상승 +2.24% (현재 5859.08, 전일 5730.74)\n- **WTI 유가** 하락 -7.53% (현재 96.28, 전일 104.12)\n\n### 관련 뉴스\n\n**코스피 상승 +2.24%**\n\n기관투자자가 약 1조 2천억 원 순매수하며 지수를 견인했고, 오전 약세(Intel 주가 급락·미국 반도체주 부진 우려)를 오후 들어 완전히 되돌렸다. 삼성전자·SK하이닉스도 동반 상승.\n\n- **출처:** 조선일보(영문), 매일경제(영문), 아시아경제 등 17개 언론사\n\n---\n\n**WTI 유가 하락 -7.53%**\n\n미국·이란 간 외교적 해결 기대감이 부상하면서 WTI가 7% 이상 급락(약 $94 수준), 브렌트유도 약 $104로 7% 하락.\n\n- **출처:** Tanjug(세르비아 국영통신), Objektiv, Novosti 등 3개 언론사 (중국 매체 163.com·봉황망도 종가 기준 $96.46 보도)\n\n---\n", "news_md": "## 미국 뉴스\n\n- **미국 증시 반등** — 11월 2일 다우존스·S&P 500·나스닥이 일제히 상승 출발. AI 투자 우려로 부진했던 기술주가 반등하고, 유가 하락에 따른 위험선호 심리가 회복됐다. (Reuters, Investing.com)\n- **애플 실적 발표 대기** — 기술주 AI 지출 우려 속에서 투자자들이 애플 실적과 미국 중간선거를 앞두고 관망세를 유지했으며, 이번 주 고용지표 발표도 예정됐다. (Reuters, Nasdaq.com)\n- **미국 휘발유값 역대 최고 수준 접근** — 트럼프 2기 취임 이후 평균 휘발유 가격이 $3.46/갤런을 넘어 역대 미국 대통령 임기 중 최고 기록에 근접. 이란과의 갈등에 따른 원유 공급 우려가 배경으로 지목됐다. (BBC, Financial Times)\n- **금값 $3,900 선 회복** — 유가 하락이 인플레이션 우려를 완화시키면서 금값이 1년 최저치에서 반등. 연준 금리 경로에 대한 힌트를 찾는 투자자들의 저가 매수세가 유입됐다. (Reuters, Bloomberg, CNBC)\n- **미국, 남아공·르완다 AGOA 특혜 박탈 예고** — USTR 제이미슨 그리어, 두 국가가 AGOA 자격 기준을 충족하지 못한다며 무관세 혜택 정지 계획을 발표. 트럼프 대통령이 결정을 내린 것으로 전해졌다. (NYT, BBC, Reuters)\n\n---\n\n## 한국 뉴스\n\n- **10월 수출 93.7% 급증, 연간 1조 달러 목전** — 한국 10월 수출이 1,152억 달러로 전년 대비 93.7% 증가해 월간 기준 역대 2위를 기록. 반도체 수출이 259.4% 늘어난 564억 달러로 AI 인프라 수요가 견인했으며, 1~10월 누적 수출이 9,300억 달러에 달해 11월 중 연간 1조 달러 달성이 예상된다. (Reuters, 조선일보, Investing.com)\n- **에르도안 대통령 방한, 교역 확대 논의** — 튀르키예 에르도안 대통령이 한국을 방문해 이재명 대통령과 무역·투자·원전·방산 협력을 논의. 양국은 교역 규모를 150억 달러로 확대하는 것을 목표로 제시했다. (연합뉴스, 조선일보, 아나돌루통신)\n- **한·미·일 북극 협력 파트너십 출범** — G20 외교장관 회의 계기에 한·미·일이 '삼각 북극·태평양 파트너십' MOU를 체결. 해상 안전·공급망 복원력·신기술 분야 공조를 목적으로 한다. (연합뉴스, 아나돌루통신)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 한국 수출: 반도체 의존도 감소 vs AI 호조\n\n한화투자증권은 10월 한국 수출이 전년 동월 대비 93.7% 증가한 1,152.8억 달러를 기록하며 2개월 연속 1,100억 달러를 상회한다고 밝혔다. 하지만 이는 조업일수 효과를 반영한 수치로, 일평균 수출은 52.4억 달러(+76.1%)로 9월(104.9%)보다 낮다. 반도체 제외 수출도 588.4억 달러(+34.3%)로 9월(+37%)보다 둔화되었는데, 이는 반도체 수출 비중이 49.9%(9월) → 48.9%(10월)로 소폭 하락했기 때문이다. \n\n유진투자증권은 10월 수출액이 사상 처음으로 9,300억 달러를 돌파하며 11월 중 연간 1조 달러 달성이 가능한 상태라고 진단한다. 하지만 이는 10월의 특이한 조업일수(22일, 전년 대비 +2일) 때문인데, 1~10월 누적 수출은 9,300억 달러(+60.6%)로 이미 700억 달러가 남았지만 11월 중 연간 1조 달러 달성이 가능한 상태다. 반도체 수출은 564.4억 달러(+259.4%)로 역대 두 번째로 높은 실적을 기록했는데, 이는 글로벌 AI 인프라 투자의 확대와 메모리 가격 상승에 힘 입은 것이다. \n\niM증권은 10월 반도체 수출이 전년 동월 대비 259% 증가한 564.4억 달러를 기록하며 9월(603억 달러)에 이어 역대 2번째 높은 수출 규모를 달성했다고 강조한다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 채권 시장의 두 얼굴: 수급과 모멘텀 간의 괴리\n\n### ① 금리 하락은 계속 될까?\n한화투자증권은 10년 국채 금리가 4.5%를 반영해야 한다고 전망한다. 하지만 이 금리는 현실 세계의 물가·성장을 반영하는 것이 아니라, 금융시장이 만들어낸 기대치다. 3분기 GDP가 1.0% 성장했고, 10월 수출은 94% 증가한 상태에서, 왜 4.5%라는 기대치가 붙었을까?\n\n#### ▶ 금리=기대치 → 기대치=데이터?\n뉴욕증권거래소(NYSE)의 역사적 자료를 살펴보면, 금리가 실제 물가·성장 데이터보다 앞서는 건 매우 일반적인 현상이다. 1980년대 이후 10년물을 기준으로 계산하면, 실제 경제 지표가 기대치를 넘어서는 순간은 전체의 1/4도 안 된다. 대부분의 시간 동안, 금리는 '더 좋은 다음날'을 반영하는 존재다.\n\n이런 맥락에서 보면, 10년 금리가 4.5%를 기대하는 것은 전혀 새로운 이야기가 아니다. 그런데 왜 이런 기대가 지금 이렇게 강렬하게 표출되었을까?\n\n#### ▶ AI 주가가 금리를 움직였다\n하나증권이 제공한 데이터를 보면, 10월 마지막 주 미국 국채 10년 금리는 6bp 하락했다. 이 기간 나스닥은 5.3% 떨어졌는데, 10년 금리와 주가의 상관계수는 0.86이라는 역설적인 모습을 보였다. 동시에 유가는 7% 하락했는데, 10년 금리와 유가의 상관계수는 -0.15에 불과했다.\n\nAI 관련 기술주는 3분기를 맞이하면서 10년 금리와 거의 반대로 움직였다. 그리고 이 움직임이 금리의 방향성을 좌우했다. 금리가 움직이는 축이 에너지 가격에서 AI 주가로 옮겼다는 게 하나증권의 진단이다.\n\n#### ▶ 왜 AI 주가가 금리에 그렇게 많은 영향을 미칠까?\n삼성전자와 SK하이닉스는 3분기 사상 최대 실적을 기록했지만, 주가는 급락했다. 이 사실은 우리가 너무 쉽게 무시하는 '모멘텀'이라는 개념을 잘 보여 준다. 10월 20일 KOSPI 12개월 선행 PER은 4.27배로, 10년 금리와의 Yield Gap은 1,942bp로 확대되었다. 그런데 이 확대폭은 과거 주가 조정 국면 평균(+299bp)의 약 2.3배다.\n\n이런 상황에서 10년 금리가 38bp만 하락한 걸 보면, 금리가 주가 조정만큼 빠르게 반응하지 않았다는 얘기다. 10년 금리가 주가 조정을 과하게 반영했다는 게 하나증권의 진단이다.\n\n### ② 수급이 만든 파티: 외국인과 기관의 협상판\n\n#### ▶ 외국인은 언제쯤 멈추나?\n하나증권이 제공한 자료를 보면, 9월 15일까지 3년 국채선물 누적 순매도 물량은 11.1만계약이었다. 이후 132%를 되사는 숏커버링을 통해 3년선물은 12.9만계약의 누적 순매수를 기록했다. 9월 15일 이후 외국인은 3년선물을 12.9만계약 순매수했다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n---\n\n### 조선·방산·전력기기: 이익은 정해졌고, 주가는 멀티플 리셋이 필요하다  \n2026년 10월 말, 조선·방산·전력기기 섹터의 2027년 이익 전망치는 모두 상향되어 있다. 조선 3사(삼성重工·HD现代·대우造船)는 10.6조원(+12%), 방산 4사(한화시스템·LIG넥스원·한화에어로스페이스·현대로템)는 6.8조원(+33%), 전력기기 3사(한전기술·한전산업·LG CNS)는 3.9조원(+31%)이다. 신한투자증권은 이 수치 자체가 이미 \"병목\" 상태——즉, 잔고·공급·납기 등의 물리적 제약이 2028년까지 충분히 걸러진 상태——라는 점을 강조한다. 조선의 경우 2028년 인도 슬롯이 full capacity로 찼고, 미국 대용량 변압기 납기는 최장 4년, 유럽·한국 국방예산은 동시에 증가 중이다.\n\n그렇지만, 신한은 이 섹터의 21개 커버리지 종목 중 16개의 주가에 대해서는 \"**우리가 설정한 목표 멀티플을 적용해도 신한 추정 이익의 70% 이하만 반영**\"되고 있다고 진단했다. 즉, 이익이 이미 결정된 상태인데, 주가가 멀티플을 인정하지 않아 2026년 하반기의 조정은 이익 자체가 아닌 멀티플의 리셋이라고 판단한다.\n\n섹터 우선순위는 다음과 같다:\n\n| 순위 | 섹터     | 이유 |\n|------|----------|------|\n| 1    | 조선     | 이익 규모가 네 섹터 중 가장 크고, 2027년 영업이익 10.6조원(+12%)의 27F PER은 피어보다 낮다. |\n| 2    | 방산     | 27F 영업이익 +33%, 28F +24%로 이익 성장률이 가장 크고, 시나리오 하방도 가장 얕다. |\n| 3    | 전력기기 | 가격 지표가 다시 오르고 있어서 가장 먼저 움직일 것으로 판단 |\n\n신한은 이 섹터를 \"틀렸을 때 잃는 것보다 맞았을 때 버는 것이 큰 종목만 담는다\"는 원칙으로 15개 종목을 추선택했다. 이 15종목 포트폴리오의 확률 가중 기대수익은 +72%, Bear 시나리오는 -44%다(보상/위험 = 1.7배). 동일가중 포트폴리오(+63%, -47%)보다 9ppta의 보상 차이와 3ppta의 하방 차이가 나는 구조다.\n\n> 신한투자증권은 이 섹터에서 주가가 이미 결정된 이익을 반영하지 않은 채 2026년 하반기에 조정되는 현상이 멀티플 리셋이며, 이 리셋이 끝나면 주가가 이익을 반영한 멀티플로 회복될 것이라고 보고 있다. 그 시점의 주가 매수가 목표 멀티플로 설정되어 있고, 현재 16개 종목이 이 멀티플을 적용해도 70% 이하였다. \n\n---\n\n### 한화 필리조선소, 미 해군 중형상륙함(LSM) 수주: 한국계 야드의 첫 미 해군 함정 신조 계약  \n10월 30일, 한화디펜스USA는 미 해군의 VCM(선박건조 관리자) 역할을 하는 TOTE Services와 중형상륙함(LSM) 건조 계약을 체결했다. 선가는 2.69억 달러, 옵션 물량 3척을 포함한 총 4척. 이 LSM은 한화 필리조선소에서 2027년 4분기부터 건조되며 2030년에 인도될 예정이다.\n\n현재 한화 필리조선소의 수주잔고는 총 18척(상선 15척, MRIV·NSMV·LSM 각 1척(옵션 제외))이다. 2026년 3분기 영업손실 936억 원을 기록했으므로, 실질적인 한화오션의 실적 영향은 제한적이다. 미국 현행 법상 군함 선체 또는 블록의 해외 건조는 불가능하다. 그럼에도 불구하고, 한국계 야드가 미 해군 함정 첫 신조 계약을 체결했다는 점에서 MASGA(Military-Aerospace-Security-Ground Armament) 투자 기대가 약간 더 강화될 수 있다.\n\n2027년 11월까지 예정된 FY27 NDAA(National Defense Authorization Act)와 세출법에서 LSM 후속함의 경우 거제 블록 공급 가능성이 충분하다는 DS투자증권의 전망도 참고할 만하다.  \n\n---\n\n### 한화시스템, 군 초소형 SAR 군집위성 개발사업 수주: 위성 '부품 공급사'에서 '군집위성 체계사업자'로의 역할 전환  \n한화시스템은 10월 30일 국방과학연구소(ADD)가 발주한 '초소형위성체계 SAR 군집위성 개발' 사업에서 3,684.7억 원(투찰률 65.1%)을 써내어 1순위로 낙찰되었다. 경쟁사 KAI는 4,603억 원(81.3%)을 써냈습니다. 기초금액은 5,672억 원, 계약기간은 2031년 11월까지입니다.  \n\n이 사업은 100kg급 초소형 SAR 위성 약 40기를 저궤도에 군집으로 배치해 한반도와 주변 해역을 주야간·악천후와 관계없이 준실시간으로 감시하는 것이 목적입니다. 425사업(대형 정찰위성 5기)의 약점인 재방문 주기를 보완합니다. 한화시스템은 2018년부터 425사업의 SAR 센서와 데이터링크를 개발해 2~5호기 SAR 탑재체 4기를 공급했습니다. 2023년 12월에는 국내 민간기업 최초로 자체 개발한 소형 SAR 위성을 궤도에 안착시켰습니다. 이번 수주는 SAR 센서·탑재체 공급사에서 위성 체계 전체를 주관하는 사업자로 역할이 커졌습니다.  \n\n이번 사업은 한화시스템의 첫 군집위성 체계 수주로, ADD 기초금액은 5,672억 원, 투찰률은 65%로 수익성 측면에서 부담이 될 수 있습니다. 그러나 이 사업은 체계 레퍼런스와 양산 원가 학습을 확보하는 전략적 수주로 볼 필요가 있습니다. 군 사업으로 검증한 플랫폼을 자체 초저궤도 SAR 군집위성(2031년까지 고도 약 350km에 64기)과 데이터 서비스로 확장한다는 것이 본 게임입니다.  \n\n---\n\n### 재생에너지: 태양광 인허가·금융지원 확대, 해상풍력 입찰 확대 추진  \n교보증권은 11월 1주차 재생에너지 주간 리뷰에서 미국 육상풍력 국방부 심사 재개 이후 실제 통과 사례가 나타나기 시작했다고 보고했습니다. 10월 22일 메인과 사우스다코타의 2개 사업이 FAA 심사로 이관됐고, 10월 28일 백악관은 한 주간 5개 사업의 진전을 확인했습니다. 약 300개 사업이 대기 중인 만큼 심사 정상화의 지속성이 중요합니다. 11월 9일 예정된 BAAJA 상원 심의 개시 절차 표결과 중간선거 이후 의회의 견제 수준에 주목해야 합니다.\n\n미국 태양광은 셀 현지화 확대되는 반면 폴리실리콘(비중국산) 공급 확대는 제한적입니다. SEG Solar는 텍사스 4GW HJT 셀 공장 부지를 확보했습니다. 반면, Wacker의 태양광용 폴리 사업 철수가 확정되지 않았지만, 태양광용 폴리실리콘 수요 부진(LTA 고객 2곳 이탈)이 지속되고 있습니다. 반도체용 수요는 견조합니다. 상대적으로 미드/다운스트림의 경쟁은 심화되고, 업스트림 경쟁은 완화될 가능성이 높다고 판단됩니다.\n\n국내 재생에너지 측면에서는 지자체 규제 완화로 태양광 4.5GW 개발이 추진되고, 국민성장펀드는 해남 400MW 사업에 1,000억 원을 지원했습니다. 해상풍력은 하반기에 2.2GW 입찰을 공고했으나 상한가는 인하되었습니다. 태양광은 계통 접속과 수요처 확보, 해상풍력은 입찰가격과 사업비 부담이 착공을 좌우할 것입니다.\n\n---\n\n### 메모리: 실적 서프라이즈→레버리지 유입→주가 상승 → 수급 쏠림의 반작용 → 재차 하락, 중장기 위협으로 재평가  \n메모리 산업은 실적 개선이 부각되는 순간부터 레버리지 자금이 유입되기 쉬운 구조입니다. 연초 메모리 공급 부족, HBM4 출하 기대, 삼성전자 기술 추격, 실적 개선이 부각되자 삼성전자·SK하이닉스가 동반 상승했습니다. 상반기 실적 서프라이즈에 레버리지 자금이 추가 유입되며 상승 폭이 확대됐고, 이후 수급 쏠림의 반작용으로 주가 변동성이 심화했습니다. 대규모 주주환원과 신규 AI 모델의 수요 기대가 반등의 계기가 되었습니다.\n\n그러나 최근 중국의 기술 추격과 AI 투자 지속성 우려가 재차 부각되며 주가가 다시 하락했습니다. 메모리 산업은 이를 중장기 위협으로 간주하고 있기 때문입니다.\n\n---\n\n### SK하이닉스: 역대 최대 분기 실적과 대규모 주주환원 발표  \nSK하이닉스는 역대 최대 분기 실적을 기록하며 대규모 주주환원을 발표했습니다. 3분기 실적 발표 후 주가는 크게 급등했고, 이에 힘입어 코스피도 6,000pt를 회복하는 저력을 보였습니다. 그러나 뒤따랐던 다른 기업들의 실적 발표에서 주주환원이 기대만큼 이루어지지 않을 때, SK하이닉스의 주주환원을 넘어서지 못했고, 미국 IT 기업의 주가 조정까지 더해지면서 증시가 조정받았습니다. SK증권은 이 한 주가 주주환원에 대한 확정성과 집행 시점이 주가에 갖는 중요성을 잘 보여줬다고 평가했습니다.\n\n---\n\n### 미국 중간선거 불확실성: 현지 투자로 극복, 수주로 증명  \n한화필리조선소가 미 해군 중형상륙함(LSM)을 수주했습니다. 이는 VCM(선박건조 관리자) 역할을 하는 TOTE Services를 통해 미국 함정 조달 시장에 진입한 것입니다. LSM은 네덜란드 Damen 그룹의 LST-100 설계를 기반으로 채택되었으며, 국방수권법 상 예산 배정을 통해 장기적으로 총 18~35척을 건조할 대형 함정 사업입니다. 미 해군은 LSM을 초기에 8척 배정하는 과정에서 초도함(1척) 건조 조선소로 Bolinnger를, 선행 자재 조달 및 후속선(4척) 건조 조선소로 Fincantieri를 지定了. VCM인 TOTE는 남은 3척의 추가 경쟁 슬롯 중 2026년 10월 30일 한화디펜스 USA를 건조사로 지정하고 1척을 확정(2.69억 달러, 옵션 3척 별도) 계약했습니다.\n\n한화필리조선소는 2027년 4분기 착공해 2030년 인도를 목표로 합니다. 현재까지 NSMV 훈련함 인도 경험과 향후 예정된 컨테이너선 3척, MR탱커 10척, LNGC 2척, MRIV 2척, 신규 LSM 건조 일정을 차질 없이 수행하기 위한 생산 설비 고도화 계획을 수립했습니다. 1차 시설 투자는 4번 Dock 4 및 5번 Dock 5의 크레인 인양 역량 강화, Yard Block 조립 구역 확대, 자동화 용접 설비 도입 등에 집중됩니다. 이러한 인프라 투자는 대형 Drydock의 병행 건조 역량을 극대화하고 공기 단축 및 제조 원가 절감을 도모하며, LSM 추가 옵션 분을 소화하고 FCL 획득 이후 함정 수주를 위한 기반을 마련합니다.\n\n미 중간선거 결과, 민주당이 상·하원 양원을 모두 장악하는 구도가 형성될 경우, 한국 조선사들의 미국 현지 거점 확보 전략은 의회 권력 변동에 따른 방산 정책의 불확실성을 극복하게 됩니다. 중간선거 특성상 민주당이 행정부(대통령) 권력 자체를 바꾸지는 않지만, 입법 및 예산권을 쥔 상·하원 다수당을 차지할 경우 국방 예산 감축 압박이나 복잡한 환경·안전 규제 법안 발의 등 국방 수주 시장 내 규제 리스크가 커질 수 있다는 우려가 시장에 존재합니다.\n\n그러나 한국 조선사들은 미국 현지 공장 설립 및 인프라 매입이라는 직접 투자 방식을 통해 이러한 우려를 불식하고 있습니다. 한화오션이 필리조선소를 인수하며 미국 노동자 고용과 현지 공급망을 구축함으로써 민주당 의회가 강조하는 '자국 노동자 보호 정책' 기조에 부응하고 있습니다. HD현대중공업은 미국 화공 플랜트 전문 EPC사인 Kiewit과의 합작 파트너십을 통해 미국 현지 조선소를 새로 구축하는 방식으로 미국 시장에 대응하고 있습니다. 이러한 현지화 전략은 미국의 선거 결과나 의회 지형 변화와 무관하게 미국 군함 사업의 지속성과 안전성을 보장하는 방어막으로 작용할 것이며, M.A.S.G.A 투자 아래 미 정부의 함정 수주 물량을 확보할 수 있는 기반이 될 것입니다.\n\n---\n\n### 메모리 공급 업체의 주가 하락: OpenAI 매출 추정치 하회 + AI 인프라 자금 조달 우려 + 중국 CXMT의 차세대 DRAM 아키텍처 진전 + 빅테크 FCF 악화  \n2026년 10월, 글로벌 주요 Tech 기업들의 주가는 메모리 반도체 업체들의 사상 최대 실적이 재차 증명되었음에도 불구하고, AI 투자의 수익성과 지속성에 대한 의구심이 확산되며 전방위적인 조정 흐름을 보였습니다.\n\n주요 메모리 공급업체의 주가는 각각 SK하이닉스 -22.6%, Micron -19.4%, 삼성전자 -18.5% 하락했으며, 비메모리 진영 또한 Intel -45.2%, AMD -18.0%, Nvidia -11.4%, TSMC -5.6%를 기록했습니다. 이는 1) OpenAI 매출 추정치 하회 보도와 글로벌 금리 상승에 따른 AI 인프라 자금 조달 우려, 2) 중국 CXMT의 차세대 DRAM 아키텍처 진전 발표와 국내 메모리 업체 고유의 수급 공백, 그리고 3) 빅테크 실적 내 FCF 악화가 'AI 투자 회의론'을 재차 자극했기 때문입니다.\n\n그러나 SK하이닉스와 삼성전자의 3Q26 영업이익은 각각 83.3조 원, 107.4조 원으로 사상 최대 실적을 경신했고, 10월 반도체 수출 역시 564.4억 달러(YoY +259.4%)를 기록하며 실물 지표는 견조한 흐름을 이어갔습니다.\n\n---\n\n### 원자재 슈퍼 사이클을 향해: 에너지가 AI의 최대 변수, 공급이 수요를 따라가지 못하는 구조  \n에너지가 AI의 최대 변수라는 일론 머스크의 지적은 현실화되고 있습니다. 실제로 에너지 수요는 AI 산업화로 인해 팽창하기 시작했고, 공급은 준비가 미흡합니다. 지난 7년간 오일 메이저들은 탄소중립 규제 탓에 유전 개발을 지양했고, 이는 미래에 원유와 유정에서 부산물로 나오는 수반 가스 공급 제한으로 이어졌습니다. 중동 공급망 쇼크는 공급 부족을 가중시키는 구조입니다.\n\n---\n\n### 한화에어로스페이스: 방산 Top Pick  \n유진투자증권은 한화에어로스페이스를 방산 섹터의 Top Pick으로 들었습니다. 한화에어로스페이스는 방산 섹터 내에서 3분기 실적 하회를 기록했지만, 이는 일시적인 것으로 판단하였습니다. 10월 29일 주주환원을 제시하며 주가가 반등할 것이라고 기대했습니다.\n\n---\n\n### 한화필리조선소 1차 시설 투자: 4번과 5번 도크의 크레인 인양 역량 강화, 야드 블록 조립 구역 확대, 자동화 용접 설비 도입  \n한화필리조선소는 4번(Dock 4) 및 5번(Dock 5) 도크의 크레인 인양 역량 강화, 야드 블록 조립 구역 확대, 자동화 용접 설비 도입 등에 집중할 것입니다. 이러한 인프라 투자는 대형 드라이도크의 병행 건조 역량을 극대화하고 공기 단축 및 제조 원가 절감을 도모할 것이며, LSM 추가 옵션분을 소화하기 위한 기반과 FCL 획득 이후 함정 수주를 위한 기반을 다져갈 것입니다.\n\n---\n\n### 대규모 주주환원과 신규 AI 모델의 수요 기대: 반등의 계기  \n대규모 주주환원과 신규 AI 모델의 수요 기대가 반등의 계기가 되었습니다. 그러나 이후 수급 쏠림의 반작용으로 주가 변동성이 심화했습니다. 미국 IT 기업의 주가 조정까지 더해지며 증시가 조정받았습니다.\n\n---\n\n### 주주환원이 움직인 주가, 코스닥에 적용한다면  \n주주환원책에서 발생한 차이: 10월 마지막 주, 국내 증시를 움직인 것은 실적이나 매크로 이슈가 아닌 주주환원책이었다. SK하이닉스가 역대 최대 분기 실적과 함께 대규모 주주환원책을 발표하자 주가는 크게 급등했고, 이에 힘입어 코스피도 단숨에 6,000pt를 회복하는 저력을 보였다. 하지만 뒤이어 실적 발표를 한 기업들의 경우 높아진 시장의 눈높이를 충족시킬 수 있을 만큼의 주주환원책을 내놓지 못했고, 미국 IT 기업의 주가 조정까지 더해지며 증시는 조정 받는 모습을 보였다. 주주환원에 대한 확정성과 집행 시점이 주가에 매우 중요한 역할을 한다는 것을 일깨워 준 한 주였다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### 1. AI 인프라 투자 vs. 실질 수익성: 기술주 중심의 값싼 기술이냐? 혹은 과잉 투자?\n\n#### 현상: 빅테크 러시와 현금흐름 악화가 동시발생\n\n알파벳(AAPL)의 3분기 광고 수익성 둔화, 아마존(AMZN)의 4분기 대규모 AI 관련 Capex 예상과 동시에 2분기 연속 FCF 적자(3분기 -335억$, 4분기 -424억$), 인텔(INTC)의 4분기 매출 가이던스 하회와 이스라엘 공장 폭발로 인한 생산 차질, 마이크로소프트(MSFT)의 9년 만에 250억$ 규모의 회사채 발행이라는 4개 충격이 동시에 시장에 덮음을 뒤집는 순간이 됩니다.\n\n두 번째 충격은 이 충격이 미국 대형 정보기술(IT)회사들의 공통된 현상을 드러냅니다. 이들은 모두 2026년 Capex를 2,200억$로 책정했습니다. 그런데 이 수치는 이들의 연간 매출액에 비하면 매우 큰 수입니다:\n\n| 기업 | 2026년 예상 매출액($B) | 2026년 예상 Capex($B) | Capex/Mgmt Income 비율 |\n|------|---------------------|--------------------|-----------------------|\n| Alphabet | N/A* | 1,800–1,900 | N/A*(FCF -90.7B) |\n| Meta | 116.5 | 1,100–1,200 | 9.4x(FCF -21B) |\n| Microsoft | 177.7 | 1,750 | 9.8x(FCF +190B) |\n| Amazon | 535.1 | 2,200 | 4.1x(FCF -335B) |\n\n(*Alphabet과 Amazon의 2026년 예상 매출액은 각각 2025년 Q2, Q3 실적을 바탕으로 전년 대비 YoY 추정치)*\n\nMeta의 2026년 FCF는 -21억$이고, Capex는 1,100–1,200억$. Capex가 매출액의 9.4배입니다. Microsoft는 Capex가 1,750억$인데, FCF는 190억$로 Capex/Mgmt Income 비율이 9.8배에 달합니다. Alphabet은 Capex가 1,800–1,900억$에 달하는데 FCF는 -90.7억$입니다(Full Year). Amazon은 Capex 2,200억$에 대비 FCF -335억$로 Capex/Mgmt Income 비율이 4.1배입니다. \n\nCapex/Mgmt Income 비율이 4배를 넘어가는 기업은 3곳 중 2곳입니다. 이 비율이 4배 이상이면 일반적으로 기업의 운영 현금흐름은 Capex 조달에 전혀 남지 않고 오히려 Capex로 흡수됩니다. 이 정도 규모의 Capex가 기업의 매출 성장률과 연결되지 않는다면, 이러한 Capex는 결국 기업의 순자산 또는 주주 가치를 감소시키는 방향으로 흘러갑니다.\n\n#### 메커니즘이란 무엇인가?\nCapex의 목적은 기술 개발과 확장입니다. 하지만 Capex 자체가 수익으로 연결되지 않을 경우, Capex는 기업의 재무 구조를 악화시키는 방향으로 작동합니다. 이는 다음과 같은 메커니즘을 따릅니다:\n\n1. Capex의 재원은 대부분 신규 채권 발행, 현금 유입, 또는 재무적 수단을 포함합니다. \n   - Alphabet은 2026년 4분기까지 약 2,050억$의 Capex를 예상하며, 이 중 약 1,800–1,900억$는 새롭게 조달해야 합니다.\n   \n2. Capex 조달 시 재무 부담이 증가함에 따라 채권 발행 금리가 상승하거나 채권 시장의 신용 스프레드가 확대될 수 있습니다.\n   - MS의 250억$ 회사채 발행이 9년 만에 이루어진 것은, 2017년 이후 회사채 발행을 거의 하지 않았다는 것을 의미합니다. 이는 Capex 조달에 대한 자금 조달 경로의 변화와 재무적 유연성의 부족을 시사합니다.\n\n3. 기술개발이 효과적으로 이루어지고 있지 않다면, Capex는 단순히 기업의 재무적 부담으로 남습니다.\n   - MS의 Azure 매출이 39.3% 성장한 것은 좋은 신호이지만, Azure 매출이 2026년 Capex 조달에 기여하는 정도가 알려져 있지 않습니다. 따라서 Azure의 성장이 Capex 조달을 지원하는지 여부는 불명확합니다.\n\n4. 기술개발이 효과적으로 이루어지더라도 Capex 조달이 실패하면, 기술도 기업의 자산이 아닌 부채로 전환될 수 있습니다.\n   - 2025년 바이비트(Bitfinex) 해킹 사고 당시 약 15억$가 손실되었습니다. 바이비트는 손실을 스스로 감당하는 방식으로 처리하였습니다. 그러나 마운트곡스(Mount Gox) 사고 당시 약 7,200만$의 자산 유출이 있었고, 마운트곡스는 이후 파산하였습니다.\n\n따라서 Capex가 기술 개발과 연결되지 않으면, 기술 개발은 기업의 부채로 전환될 수 있고, 이는 기업의 자산 유동성과 신용도를 악화시킵니다.\n\n#### Implication: 투자자로서의 선택\n이 모든 요인이 종합되면, AI 인프라 투자와 관련된 기업들의 Capex와 수익성 사이에 격차가 너무 크므로, Capex는 단순히 기술 개발을 위해 필요한 비용이 아니라, 기업의 자산 유동성과 신용도를 감소시키는 요인으로 작동한다는 것입니다. 따라서 AI 인프라 투자에 대한 기대는 현재 시점에서 과도하다고 판단할 수 있습니다.\n\n---\n\n### 2. 반도체 대형주: 실적+주주환원 = 단기 강세의 근거\n\n#### 현상: SK하이닉스 역대 최고 실적 + 대규모 주주환원 발표\n\nSK하이닉스(SKHK.KO)는 3분기 매출 130.6 trillion won (+15.4% YoY, +16.3% MoM), 영업이익 15.3 trillion won (+137.1% YoY, +70.4% MoM)을 기록하며 역대 최고 실적을 기록했습니다. 주주환원 계획도 발표했는데, 올해 10월 24일부터 연간 30.6 thousand shares (about 1.7 billion won per share)를 주주에게 배당한다고 발표했습니다. 주주환원 규모는 2026년 예상 매출의 약 20%에 해당합니다. 이는 다른 반도체업체들의 주주환원 비율과 비교해볼 때 높은 수준입니다.\n\nSK하이닉스의 주주환원은 기업의 이익을 기반으로 이루어지고 있기 때문에, 기업의 이익이 주주환원의 주요 원천이 되는 것으로 보입니다.\n\n#### 메커니즘이란 무엇인가?\nSK하이닉스의 주주환원은 다음 메커니즘을 따릅니다:\n\n1. 2026년 3분기 실적에 기반하여 주주환원을 결정합니다.\n   - 2026년 3분기 SK하이닉스의 매출은 130.6 trillion won입니다. 이 매출의 20%인 약 26.1 trillion won은 주주환원으로 편입됩니다.\n\n2. 주주환원의 주요 방법은 현금 배당입니다.\n   - SK하이닉스는 주주환원으로 2026년 3분기 매출의 약 20%인 약 26.1 trillion won을 현금으로 배당할 계획입니다.\n\n3. 주주환원의 규모가 기업의 이익에 비례하기 때문에, 기업의 이익이 주주환원의 주요 원천입니다.\n   - 2026년 3분기 SK하이닉스의 영업이익은 15.3 trillion won입니다. 이 영업이익의 약 170%가 주주환원으로 편입됩니다. 이는 기업의 이익이 주주환원의 주요 원천이라고 볼 수 있습니다.\n\n4. 주주환원은 기업의 주가에 긍정적인 영향을 미칩니다.\n   - 주주환원은 주주들에게 기업의 이익을 돌려줘 주가를 상승시키는 방향으로 작동합니다.\n\n#### Implication: 주식 투자에 대한 시사점\nSK하이닉스의 주주환원이 기업의 이익에 비례하여 이루어지기 때문에, 주주환원은 기업의 주가에 긍정적인 영향을 미칠 것으로 예상됩니다. 이는 SK하이닉스가 2026년 3분기 실적을 바탕으로 주주환원을 결정했기 때문에, 기업의 이익이 주주환원의 주요 원천이 된 것으로 볼 수 있습니다.\n\n---\n\n### 3. 외국인 선물 20일 누적 순매수 마이너스 전환\n\n#### 현상: 외국인 선물 20일 누적 순매수 마이너스 (-596억 원)\n\n한화투자증권(Hanwha Investment & Securities Co., Ltd.)의 11월 2일 보고서에 따르면, 2026년 10월 26일부터 10월 29일까지 외국인 선물 20일 누적 순매수는 마이너스로 전환되었다. 이는 20일 동안 외국인 선물을 596억 원 순매도한 것으로 나타났다. 10월 마지막 주, 외국인 선물은 20일 누적 순매수 마이너스로 전환되었다.\n\n#### 메커니즘이란 무엇인가?\n외국인 선물 20일 누적 순매수 마이너스 전환이 발생하는 메커니즘은 다음과 같습니다:\n\n1.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로, 채권, 산업섹터 분야에서 반복적으로 등장하거나 서로 연결되는 핵심 쟁점은 다음과 같다.  \n한국 수출은 반도체 의존도가 줄어들고 있으나 AI 수요로 인한 반도체 수출 증가가 지속되고 있으며, 이는 10월 수출 성장률에 기여한 주요 요인이다. 채권 시장에서는 금리 하락 기대가 지속되나, AI 주가의 하락이 금리 움직임에 영향을 주고 있으며, 이는 주가 조정과 금리 간의 괴리가 커지고 있음을 보여준다. 산업 섹터에서는 조선·방산·전력기기 등 주요 섹터의 이익 전망이 상향되었으나 주가 멀티플이 이익 반영에 미치지 못하고 있는 것으로 나타나, 이익과 주가 간의 괴리가 존재한다."}]}</script>
