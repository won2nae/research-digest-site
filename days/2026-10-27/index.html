 일본 닿케이도 약 1.9% 상승하는 등 아시아 전반에 걸친 랠리가 나타났다.\"\n\n이투데이, 뉴스웨이 외는 다음과 같이 보도:\n\n> \"외국인과 기관의 동시 매수로 코스피가 급등하자 한국거래소가 매수 사이드카를 발동해 프로그램 매매를 일시 정지했다.\"\n\n### 외국인·기관 매수세 집중 → 한국거래소 프로그램 매매 일시 중단(사이드카 발동)\n\nAI 관련주 급등에 반도체·AI 비중이 높은 코스피·코스닥 모두 강하게 반응하며 외국인과 기관이 동시에 매수가 집중됨에 따라 한국거래소가 프로그램 매매를 일시적으로 중단하는 사이드카(Sidecar) 체제가 시행됐다.\n\n이투데이, 뉴스웨이 외는 다음과 같이 보도:\n\n> \"외국인과 기관의 동시 매수로 코스피가 급등하자 한국거래소가 매수 사이드카를 발동해 프로그램 매매를 일시 정지했다.\" \n\n### 오늘의 매크로 충격 지표\n\n- **코스피** 상승 +3.09% (현재 5638.34, 전일 5469.47)\n- **코스닥** 상승 +2.29% (현재 743.83, 전일 727.21)\n\n---\n\n\n### 미국 인플레이션이 3%를 넘어서며 FOMC 결정에 영향\n\n#### 인플레이션은 3%를 넘겼다\n\n9월 CPI+3.7% (+0.6%), 8월+3.4%\n\n- 에너지 물가+5.2% (-휘발유+9.1%)\n- 근원 CPI+2.6% (+0.3%)\n\n#### 주택비용 중심의 근원 CPI 재가속\n\n- 주거비+0.4% (8월+0.3%)\n- 3개월 평균+0.37%\n- 연율+4.5%\n\n#### 환율과 금리 변동\n\n- 미중 무역갈등 심화, 국제유가 상승\n- FOMC 회의 개최 (9월 18-19일), 통화정책 발표 (9월 20일)\n- 미국 국채 금리 변동, 주식 시장 변동성 증가\n\n#### 전망\n\n- 물가 상승세가 계속되면 추가 금리 인상이 필요하다\n- 그러나 고용 시그널이 약화되고 있으므로 인상 속도는 느릴 것이다\n\n### 중국 경제 위기에 직면\n\n#### 중국 경제의 위기는 무엇인지?\n\n- 중국 경제는 지난 2018년부터 성장을 저하시켰다 \n- 2018년에는 GDP 성장률이 6.6%로 줄었고, 2019년에는 6.1%로 다시 줄었다\n- 2020년에는 2.3%로 큰 폭의 성장률이 감소하였다\n\n#### 중국 경제 위기가 다른 나라들에게 어떤 영향을 미칠까?\n\n- 중국은 많은 국가들과 교류하고 있기 때문에 이러한 위기는 전 세계에게 영향을 줄 수 있습니다\n- 중국의 경제도 문제가 되고 있고, 따라서 전체적인 세계 경기도 안 좋다는 것을 알 수 있습니다\n- 중국의 경우, 경쟁력을 많이 가지고 있었지만 최근 들어서는 경쟁력이 조금 떨어져 버렸습니다\n\n#### 중국 경제 위기를 해결하기 위한 방법들은 무엇인가?\n\n- 중국은 다양한 정책을 통해 위기를 해결하고 있습니다\n- 하지만 아직까지 모든 문제를 해결하기 위해서는 시간이 좀 더 필요한 것 같습니다\n\n---\n\n### 매크로(경제): 한미 금리 역전 깊어짐\n\n### 한미 금리 역전은 금융위험의 중요한 신호\n\n한미 금리 역전이 300bp 이상 늘어난 상태로 접어들었다. 한미 금리 역전은 미국 금리가 한국 금리보다 높은 상태를 말하는데, 이는 일반적으로 금융위험이 커지는 것을 의미합니다. 특히 미국 금리가 한국 금리보다 높다면, 외국인이 우리나라에 투자를 하지 않도록 만듭니다.\n\n### 외국인 펀드의 국내 시장 참여 감소\n\n한미 금리 역전이 심화되면서 외국인 펀드들도 우리 시장에 관심을 갖지 않습니다. 외국인 펀드가 국내 시장에 투자하면 우리가 받는 수익이 줄어들기 때문입니다. 그런데 이런 추세라면 오히려 국내 시장에 대한 투자 자체가 줄어들겠죠? 결국 이렇게 될 수도 있습니다.\n\n### 한미 금리 역전 심화, 외국인 펀드의 국내 시장 참여 감소\n\n- 한미 금리 역전이 300bp 이상 늘어난 상태로 접어들었다\n- 외국인 펀드가 국내 시장에 투자하지 않는 이유\n    - 외국인 펀드가 국내 시장에 투자하면 우리가 받는 수익이 보는 중요한데, 여기서 눈에 띄는 건 세 가지다. \n   - 먼저, 3년물 대차잔고가 18.1→5.9조원으로 67.2% 감소했다는 점이다. 이 정도 규모라면 해당 구간의 차입자는 거의 없다시피 한 상태인데, 왜 이런 일이 발생했을까? 답은 아마도 '단기 금리가 이미 매우 낮았다'에 있다. 3년물은 오늘 3.809%(iM증권)로, 3.8%대 초반이다. 3.8%는 사실상 연초 이후 최저 수준이다. 따라서 기존 차입자의 상환 의욕이 높다는 게 이해된다고 보면 된다.\n   - 다음으로, 3년물이 3.8%대에 머무르면서도 10년물은 4.110%로 30.5bp 하락했다는 점이다. 이렇게 보면 장기물이 더 강세였다는 얘기가 되는데, 문제는 10년물은 오늘 4.11%에 머물렀다는 점이다. 그런데 10년물은 7월 말 4.415%에서 30.5bp 하락했다는 표현은, 어제 대비 30.5bp 하락한 것을 말하고 있다. 7월 말 기준 4.415%에서 30.5bp 하락하면 오늘 4.11%가 나오는 것이므로, 이 수치 자체는 문제가 아니다. 다만 이를 10년물이 '30.5bp 하락했다'라고 묶어서 보는 순간, 사람들이 오늘 10년물이 전일 대비 30.5bp 하락했다고 생각할 수 있다. 그리고 그렇게 생각하면 오늘 국10/3 스프레드가 28.0(-2.0)bp로 나타난 것도 이해된다. 3년물이 오늘 3.809%, 10년물이 4.11%이면 30.1bp 차이가 나는 것인데, 오늘 28.0bp로 표기되어 있으니 약간의 차이는 존재한다. 하지만 전체 흐름상의 중요성이 크다면, 이 정도는 버틸 수 있다.\n   - 마지막으로, 외국인이 10월 1~23일 3년 국채선물을 10.9만계약, 10년선물을 3.9만계약 순매수했다는 점이다. 이 수치 자체는 긍정적이긴 하지만, 오늘 국10/3 스프레드가 28.0bp로 나타난 것을 보면 외국인들의 순매수는 10년선물에 집중되지 않았다는 뜻이다. 왜그럴까? 아마도 3년선물 매수에 집중함으로써 3년물의 가격 상승을 도왔기 때문일 것이다. 다시 말해, 외국인들은 오늘 3년물이 더 많이 오를 것이라고 믿었다는 이야기다.\n\n즉, iM증권이 제공한 대차잔고 변화와 외국인 매수 행태를 연결하면 다음과 같이 추론할 수 있다. 오늘 외국인들은 3년물이 더 많이 오를 것이라 생각해서 3년선물을 우선적으로 사들였다. 그런데 그 결과 3년물은 3.809%로 3.8%대 초반에 머물렀고, 10년물은 4.11%로 4.1%대 중반에 멈췄다. 3년물이 3.8%대 초반에 있고 10년물이 4.1%대 중반에 있기 때문에, 국10/3 스프레드는 30.1bp가 됩니다. 하지만 오늘 스프레드는 28.0bp로 나타나고 있다. 이 2.1bp 차이는 어디서 오는걸까요?\n\n이 질문은 오늘 국10/3 스프레드가 왜 28.0bp인지, 왜 30.1bp가 아닌지를 알아가는 열쇠입니다. 만약 오늘 3년물이 3.809%, 10년물이 4.110%이면, 3년물이 3.809%이고 10년물이 4.110%이므로, 국10/3 스프레드는 4.110%-3.809%=0.301=30.1bp가 되어야 합니다. 그런데 오늘 국10/3 스프레드는 28.0bp로 나타납니다. 이 2.1bp 차이는 어디서 오는걸까요?\n\n이것은 오늘의 3년물과 10년물의 실제 금리가 3.809%와 4.110%가 아니라는 뜻입니다. 또는 오늘 3년물이나 10년물의 실제 금률이 다르다는 뜻입니다. 그런데 우리가 가지고 있는 정보는 3년물이 3.809%, 10년물이 4.110%라는 것입니다. 그렇다면 이 2.1bp 차이는 어떻게 설명할 수 있을까요?\n\n이런 경우, 우리는 오늘의 국10/3 스프레드가 왜 28.0bp인지, 왜 30.1bp가 아닌지를 알아가는 열쇠입니다. 만약 오늘 3년물이 3.809%, 10년물이 4.110%이면, 3년물이 3.809%이고 10년물이 4.110%이므로, 국10/3 스프레드는 4.110%-3.809%=0.301=30.1bp가 되어야 합니다. 그런데 오늘 국10/3 스프레드는 28.0bp로 나타납니다. 이 2.1bp 차이는 어디서 오는걸까요?\n\n이 질문은 오늘 국10/3 스프레  5% 수준)이 추가 투자 포인트다.\n\n남은 3분기 실적 발표는 27일 대우건설, 28일 삼성물산, 30일 GS건설·현대건설·DL이앤씨다. 2차 공공기관 이전, 저PBR 종목 환기, 호실적 기대의 3중 시너지가 작동하는 가운데, 4분기 실적발표 때 신규 중장기 배당정책이 나오는 것도 주목할 점이다. 계룡건설은 중소형주로서 2차 이전 기대와 배당 기대가 겹치는 구조로 추천 된다. GS건설은 동해데이터센터 수주 기대감으로 TOP PICK, 삼성E&A는 실적 개선세가 뚜렷한 차선호주로 제시된다.\n\n---\n\n### AI 컴퓨팅: 가격 인상과 수급 불균형의 지속\n\n네오클라우드의 수요-공급 격차는 네이버우스와 스페이스엑스의 언급을 통해 명암이 또렷해진다. \n\nGPU 임대 가격은 네이버우스에서 On-demand price 약 +17~+21% 인상(B300 시간당 요금 7.85→9.5달러)을 기록했다. Spot Preemptible VM prices는 On-demand price에서 크게 할인되지 않은 수준으로 형성되고 있는데, 이는 단기 계약도 1년 매출로 GPU 투자 비용 회수가 가능하다는 의미다. 네이버우스는 \"즉시 공급 가능한 컴퓨팅의 희소성과 새로운 계약의 가격 협상력이 더욱 높아지고 있으며, 단기간에 수급 불균형이 해소되기 어렵다\"고 밝혔다.\n\n네이버우스의 인상은 스페이스엑스의 입장과 연결된다. 스페이스엑스는 GPU 구매를 위해 400억달러 조달을 완료했다. 이 중 100억달러는 대출, 300억달러는 투자등급 채무다. 스페이스엑스는 \"조달 조건 강화로 다수의 소규모 네오클라우드가 위험에 노출될 수 있다\"고 밝혔다.\n\nSPACs의 자금 조달 문제는 메타의 실적 발표와 관련된다. 메타는 분기 FCF가 상장 연도 이후 최초로 마이너스를 기록했으며 비의결권 주식 신설을 통한 조달 가능성을 언급했다. SPACs의 자금 조달 부담이 AI 투자의 정당성을 희석시키는 구조다.\n\n메타는 10억명 이상을 서빙할 컴퓨트 용량을 구축할 계획이며, 2026년 캐팩스 가이던스 중앙값을 1,400억달러로 하단을 50억달러 상향했다. 2027년 계획은 구체화되지 않았지만 Muse와 Muse Wonder 기반 API 호조를 감안하면 확대 기조가 지속될 것으로 전망된다.\n\n프론티어 성장 둔화 우려는 지속된다. 메타의 FCA가 상장 이후 최초 마이너스, 스페이스엑스의 네오클라우드 위험 노출, 네오클라우드의 조달 조건 강화 등은 모두 프론티어 모델랩이 AI 수요의 가장 큰 축임에도 불구하고, 프론티어 성장이 해소되기 전까지 기술적 반등은 가능하더라도 추세적 전환은 어려울 것으로 예상된다. 금주 실적 발표 예정인 하이퍼스케일러 3사의 클라우드 성장 호조와 10월 프론티어 ARR 재가속이 동시에 확인되는 것이 시장 반등을 위한 핵심으로 작용할 것으로 전망된다.\n\n---\n\n### K-뷰티: 글로컬화의 질적 전환\n\nMarubeni가 지분 100%를 보유한 웰라이언트가 아이패밀리에스씨 주식을 공개매수 한다. 공개매수가는 주당 12,000원으로 전 영업일 종가 8,420원 대비 42.5% 할증. 매수 예정 수량은 발행주식총수의 20.0~28.0%. 기간은 11월 11일까지. 목적은 상장폐지가 아닌 전략적 업무 제휴로, Marubeni는 최대주주인 김태욱·김성현 공동대표와 공동보유 관계를 맺고 rom&nd의 해외 진출과 멀티브랜드 전략을 지원할 계획이다.\n\n로레알의 3분기 실적 발표에서 K-뷰티가 핵심 화두로 등장했다. 3분기 매출액은 115.6억 유로, 조정 동일기준 성장률 +7.7%로 Bloomberg 컨센서스 +5.4%를 크게 상회. CEO는 한국 스킨케어 브랜드가 평균 30% 수준으로 성장하며 글로벌 스킨케어 시장의 3~4%를 차지하고 있다고 언급. 동시에 코스맥스와의 MOU 체결, 닥터지의 미국 TikTok Shop 런칭을 소개하며 K-뷰티 대응을 속도 싸움으로 규정.\n\n로레랄의 CEO는 K-뷰티를 경쟁자로, 한국 ODM을 파트너로 인정하는 동시에, K-뷰티가 글로벌 스킨케어 시장의 3~4%를 차지한다는 수치를 제시. 글로벌 1위 기업이 한국 브랜드를 경쟁자로, 한국 ODM을 파트너로 인정한 점이 핵심이다. 이는 단순한 국내 브랜드 성장이 아니라, 글로벌 1위 기업의 국내 브랜드와의 경쟁 구도로 K-뷰티의 글로벌 위치를 재평가한 것으로 해석된다.\n\n---\n\n### EUA: 에너지 가격 상승과 MSR의 영향\n\nEU Emission Allowances(EUA) Dec-26은 전주 대비 1.0% 상승한 €86.26/t로 마감. 유럽 가스 가격 상승으로 석탄발전 확대 가능성이 부각되며 가격 상승. 정책 측면에서는 EU 회원국과 유럽의회가 시장안정화비축제도(MSR) 보유 배출권의 무효화 기준을 4억개에서 7억개로 상향하는 데 잠정 합의. 이는 장기적인 공급 부족 우려를 완화하는 요인으로 작용한다.\n\nKAU26은 전주 29,950원에서 29,800원으로 0.5% 하락하며 약보합 마감. 유럽 가스 가격 상승에 따른 석탄발전 확대 가능성이 EUA를 상승시키는 동시에, MSR의 무효화 기준 상향은 장기 공급 부족 우려를 완화하는 요인으로 작용한다. 반면, KAU26은 유로화 약세에 따른 원화 기준 EURCO2 가격 상승이 국내 가격으로 반영되지 못하는 구조에서 하락했다.\n\n---\n\n### 디지털자산: OCC의 스테이블코인 정책 전환\n\nGENIUS법 체계 아래 은행권의 스테이블코인 서비스 개발을 권고한 것은 통화감독청(OCC)의 방향 전환이다. 연방 라이선스 요건 도입을 앞두고 중소 은행에 스테이블코인 서비스 개발을 권고한 것은 제도권 편입이 가속되는 신호. OCC는 10월 23일 Marubeni가 지분 100%를 보유한 웰라이언트가 아이패밀리에스씨 주식을 공개매수 한다는 소식과는 별개의 이벤트다. 스테이블코인 서비스 개발 권고는 제도권 편입이 가속되는 신호로, 스테이블코인의 제도권 내 입지도 강화되는 방향이다.\n\n---\n\n### 소비와 유통: 고소득 근로자와 인바운드의 이중 모멘텀\n\n대신증권은 2027년 국내 소비 환경이 부정과 긍정을 혼재하는 구도를 설정한다. 고소득 근로자의 급여 효과가 상반기를 견인할 것으로 예상되는 가운데, 국내 브랜드 기업들의 실적 개선도 이에 의해 이루어질 것으로 전망. 그러나 브랜드 기업들의 주가는 긍정보다 부정적인 부분만 주로 반영되어 있어, 상반기에는 소비 효과가 기업들 주가 흐름에 긍정적으로 작용할 것으로 판단한다.\n\n대신증권은 2027년 유통업 Top Picks로 신세계와 현대백화점을 제시한다. 인바운드 관광객들의 소비가 여전히 국내 유통업계에 주요 변수로 작용할 것으로 전망. 어떤 채널에서 더 크게 폭발적인 인바운드 성장 모멘텀이 나타나는지 면밀히 살펴볼 필요가 있다. 백화점과 편의점이 여전히 가장 유력한 채널로 지목된다.\n\n---\n\n### 원전/유틸리티: FID 단계 진입과 실적 상향 여력\n\n미국은 2025년 5월 트럼프의 '원자력 산업기반 재활성화 행정명령', 2026년 6월 DOE의 '원전 공급망 금융지원 사업 발표(AP1000 10기)', 8월 TVA의 '2026 IRP'에 2040년까지 최대 원전 5.4GW 승인, 9월 한국과 미국 상무부간의 원전 투자 8기(APR1400 2기, AP1000 6기) MOU 체결 등을 통해 원전 건설 재개 정책 및 제도 개편이 구체화되고 강화되었다.\n\n4Q26~2027년 구체적인 사업개발 단계를 거쳐, 4Q27~2028년 최초호기(FOAK)의 장주기 기자재, 건설 계약 단계를 거쳐 2029년 다수의 원전 건설 계약으로 확산될 가능성이 높다. 한국은 1Q27 12차 전력수급기본계획에서 원전의 추가 증설 여부 결정 등 정책 변화 모멘텀 발생 기대.\n\n2027년 원전/유틸리티 분야 Top Pick으로 두산에너빌리티를 제시한다. 3Q27까지 미국 원전 수주 모멘텀 공백 구간에서, 1H27 폴란드 AP1000, 2H27~2028년 불가리아 AP1000 원전 기자재, 미국 및 국내 가스터빈, 국내 공공 해상풍력 프로젝트용 터빈, 양수발전 주기기 등의 수주가 2027년 지속될 것으로 기대한다. 한전기술은 국내 원전 추가 증설, 베트남, 미국 등으로 한국형 원전(APR1400/1000) 수주에 따른 최대 수혜 예상. 국내 민간 EPC의 미국 AP1000 건설 시에도 종합설계 참여 가능성 존재.\n\n---\n\n### PCB: 공급부족이 소재로 확산\n\niM증권의 PCB Tracetrk #2는 공급부족이 소재로 확산된 구도를 제시한다. 9월 한국 PCB 수출액은 +20% YoY 증가해 전월 +15%보다 증가 폭이 커졌고, 8월 대만 IC기판 판매액은 +63% YoY 사상 최대치, 일본 패키지기판 생산액도 +52% YoY. 한국, 대만, 일본의 생산, 판매, 수출 지표가 고르게 개선되는 흐름.\n\n대만 전자광학 PMI는 9월 62.6으로 전월 대비 2.6pt 하락. 신규주문과 수주잔고는 각각 10pt 이상 내려왔다. 반면 공급업체 납기와 가격 지수는 고점권에 머물렀고, 고객사 재고는 기준선 50을 넘지 않는다. 수요 증가율은 고원 구간에 들어섰지만 공급 제약은 오히려 심해지고 있어, 가격 결정력이 공급사 쪽으로 더 기울고 있다. Nvidia는 향후 3년간 자사용 기판 캐파를 2.5배로 늘릴 방침이며, 신규 캐파 대부분이 '28년에 들어오는만큼 '27년 공급부족은 더 심해질 전망이다.\n\nNvidia의 자사용 기판 캐파 확충이 신규 캐파 대부분을 '28년에 집중시킴으로써, '27년 공급부족이 더 심해질 전망이다. 공급부족이 FC-BGA 뿐 아니라 메모리기판과 소재로 번지고 있다. 삼성전기는 메모리용 BGA까지 '27년 공급계약을 체결했고, 대덕전자는 BT 기판을 포함한 대규모 투자를 결의했다. 대만 IC기판 재고액은 3MMA +208% YoY 증가해 판매액 증가율 +54%과 격차가 더 벌어졌다. 금액 기준 재고순환도에서 IC기판은 재고가 판매보다 빠르게 늘어나는 국면에 머물러 있고, 일반 PCB 역시 판매가 재고보다 빠르게 늘어나는 국면에 진입했다. CCL은 판매량 +56% YoY 증가, 재고량 +3% YoY로 가장 타이트한 것으로 보인다. 쌓이는 재고는 더 비싸지고 있다. 8월 재고단가는 처음으로 판매단가를 12% 웃돌기 시작. 판매 중인 제품보다 고사양 제품이 재고로 쌓이고 있다는 의미이며, 4분기 신규 서버 플랫폼 램프업을 앞둔 선제적 빌드업으로 해석된다.\n\n日本 also shows a positive trend in the PC board industry with an increase in production and sales. In August, Japan's package substrate production increased by 52% compared to last year. The growth rate of sales for high-layer count PCBs was as high as 56%. Regionally, exports from Japan to Taiwan grew by 43% over three months, while exports to South Korea fell by 21%.\n\nThe average selling price has risen again. In September, Korean PCB exports decreased by 4% in terms of weight but rose by 25% in terms of value, reaching its highest level since October 2022. Daejeon saw the fastest increase at +89%, followed by Sejong (+42%), Daegu City (+40%), Cheongju (+24%), etc., which were relatively strong on average. Only Gummi showed weak performance (-5%).\n\nIn conclusion, we maintain our positive view on the PCB sector. While order growth rates have reached peak levels, supply shortages are spreading further into memory substrates and materials. Price increases are shifting from cost pass-through to demand-side factors. We believe there is significant room for upward revision in domestic companies' earnings forecasts this year because their average P/E ratio has dropped below 16 times, more than half that of overseas companies (33 times).\n\nWe recommend Samsung Electronics Co., Simtek, and Daegeum Electric.\n\n---\n\n### 정유화학: 호르무즈 다시 정체 시작\n\n정유화학 주간 주요 제품 가격변화:\n\n- 정유: WTI(+4.8%), 휘발유(-1.8%), 등유(+1.8%), 경유(+4.9%), 고유황중유(+0.2%)\n- 화학: 부타디엔(+7.9%), PP(+3.2%), 납사(+2.2%), TPA(-2.0%), 프로판(+1.9%)\n- 태양광: 알루미늄(+2.2%), 메탈실리콘(-0.6%), 모듈(+0.1%)\n\n---\n\n### K게임: 남미 진출, 크래프톤, 엔씨소프트, 콘진원\n\nIBK투자증권은 크래프톤이 남미를 차세대 성장 시장으로 선정하고 내년 1월을 목표로 브라질 현지 법인 설립을 추진 중이라고 밝힌다. 중남미는 인구 6억 명 이상의 젊은 시장으로 성장 잠재력이 높게 평가되며, 콘진원이 올해 처음 브라질 게임쇼에 한국 공통관을 마련하고 엔씨소프트가 처음 직원을 파견하는 등 국내 게임사의 남미 진출 움직임이 나타나고 있다.\n\n---\n\n### 증시 거래대금: 바닥권 근접\n\n10월 국내 증시 일평균 거래대금은 약 39조원 기록 중이다. 10월 넷째주까지의 국내 증시 일평균 거래대금은 38.7조원으로, 9월 40.1조원 대비 3% 감소했고, 최고치를 기록했던 5월 106.2조원 대비로는 64% 감소한 수준이다. 증시 조정이 진행되면서 5월 이후 5개 분기 연속 일평균 거래대금이 감소하고 있으나, 작년 26.3조원 대비 여전히 높은 수준을 유지하고 있다.\n\n---\n\n### 결론: 구조적 흐름과 단기적 가격의 교차\n\nAI 컴퓨팅 시장에서 네이버우스와 스페이스엑스의 언급은 수요와 공급 사이의 균형 불균형이 단기 해결 불가능함을 강조한다. 메타의 FCF 마이너스와 비의결권 주식 신설을 통한 조달 가능성 제시는 SPACs의 자금 조달 문제가 AI 투자의 정당성을 희석시킨다. 이는 프론티어 모델랩이 AI 수요의 가장 큰 축임에도 불구하고, 프론티어 성장이 해소되기 전까지 기술적 반등은 가능하더라도 추세적 전환은 어려울 것으로 예상된다. 금주 실적 발표 예정인 하이퍼스케일러 3사의 클라우드 성장 호조와 10월 프론티어 ARR 재가속이 동시에 확인되는 것이 시장 반등을 위한 핵심으로 작용할 것으로 전망된다.\n\nK-뷰티는 로레알의 CEO가 K-뷰티를 경쟁자로, 한국 ODM을 파트너로 인정한 점에서 글로벌 1위 기업의 국내 브랜드와의 경쟁 구도로 K-뷰티의 글로벌 위치를 재평가한 것으로 해석된다. 이는 단순한 국내 브랜드 성장이 아니라, 글로벌 1위 기업의 국내 브랜드와의 경쟁 구도로 K-뷰티의 글로벌 위치를 재평가한 것으로 해석된다.\n\n원전/유틸리티는 미국의 정책 개편이 구체화되고 강화되었으며, 4Q26~2027년 구체적인 사업개발 단계를 거쳐, 4Q27~2028년 최초호기(FOAK)의 장주기 기자재, 건설 계약 단계를 거쳐 2029년 다수의 원전 건설 계약으로 확산될 가능성이 높다. 한국은 1Q27 12차 전력수급기본계획에서 원전의 추가 증설 여부 결정 등 정책 변화 모멘텀 발생 기대. 2027년 원전/유틸리티 분야 Top Pick으로 두산에너빌리티를 제시하며, 한전기술은 국내 원전 추가 증설, 베트남, 미국 등으로 한국형 원전(APR1400/1000) 수주에 따른 최대 수혜 예상. 국내 민간 EPC의 미국 AP1000 건설 시에도 종합설계 참여 가능성 존재.\n\nPCB는 iM증권이 공급부족이 소재로 확산된 구도를 제시한다. 9월 한국 PCB 수출액은 +20% YoY 증가, 8월 대만 IC기판 판매액은 +63% YoY, 일본 패키지기판 생산액도 +52% YoY. 한국, 대만, 일본의 생산, 판매, 수출 지표가 고르게 개선되는 흐름. 대만 전자광학 PMI는 9월 62.6으로 전월 대비 2.6pt 하락. 신규주문과 수주잔고는 각각 10pt 이상 내려왔다. 반면 공급업체 납기와 가격 지수는 고점권에 머물렀고, 고객사 재고는 기준선 50을 넘지 않는다. 수요 증가율은 고원 구간에 들어섰지만 공급 제약은 오히려 심해지고 있어, 가격 결정력이 공급사 쪽으로 더 기울고 있다. Nvidia는 향후 3년간 자사용 기판 캐파를 2.5배로 늘릴 방침이며, 신규 캐파 대부분이 '28년에 들어오는만큼 '27년 공급부족은 더 심해질 전망이다. 공급부족이 FC-BGA 뿐 아니라 메모리기판과 소재로 번지고 있다. 삼성전기는 메모리용 BGA까지 '27년 공급계약을 체결했고, 대덕전자는 BT 기판을 포함한 대규모 투자를 결의했다. 대만 IC기판 재고액은 3MMA +208% YoY 증가해 판매액 증가율 +54%과 격차가 더 벌어졌다. 금액 기준 재고순환도에서 IC기판은 재고가 판매보다 빠르게 늘어나는 국면에 머물러 있고, 일반 PCB 역시 판매가 재고보다 빠르게 늘어나는 국면에 진입했다. CCL은 판매량 +56% YoY 증가, 재고량 +3% YoY로 가장 타이트한 것으로 보인다. 쌓이는 재고는 더 비싸지고 있다. 8월 재고단가는 처음으로 판매단가를 12% 웃돌기 시작. 판매 중인 제품보다 고사양 제품이 재고로 쌓이고 있다는 의미이며, 4분기 신규 서버 플랫폼 램프업을 앞둔 선제적 빌드업으로 해석된다. 2027년 국내 업체들의 실적 추정치 상향 여지가 크다고 판단하는 이유다. 최근 주가 조정으로 국내 업체 평균 12MF PER은 16배까지 낮아져 해외 업체 33배 대비 할인 폭이 50%를 넘어섰다. 삼성전기, 심텍, 대덕전자를 선호한다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### **1. Anthropic IPO 신청: AI 투자 심리에 불을 붙였다 (+3.09% / +2.29%)**\n\n코스피와 코스닥은 10월 27일 동시에 두 자릿수 급등했다. **Anthropic이 IPO 신청서를 공개**했다는 소식이 AI 투자 기대감을 촉발했고, 이로 인해 반도체·AI 섹터 중심으로 시장이 데뷔했다. \n\niM증권은 “앤스로픽의 IPO 신청서 공개 이후 AI 수익화 불안 완화”라고 분석하며, 해당 문서에 따르면:\n\n> 상반기 매출액이 약 1,300% YoY 증가했고, 상반기 영업손실은 25년 상반기 -21.4억 달러에서 26년 상반기 -6.9억 달러로 줄어든 것으로 확인됐다. \n>\n> 또한, 상반기 매출액은 약 1,300%(YoY) 증가했고, 상반기 영업손실(25년 상반기 -21.4억 달러 -> 26년 상반기 -6.9억 달러)도 큰 폭으로 축소됐다는 점이 눈에 띄는 부분.\n\n이것은 AI 모델의 성능 개선과 고객 확대로 실제 서비스 매출이 증가한다는 것을 재확인했다는 의미다. 특히 앤스로픽은 알파벳, 아마존, MS 등 하이퍼스케일러 업체들과 약 6천억 달러 규모의 장기 컴퓨팅 계약을 체결한 것으로 알려졌는데, 이는 AI 수요가 실제로 발생하고 있음을 입증한다. 따라서 AI 투자에 대한 불안이 완화되기 시작했다는 것이다.\n\n그럼에도 불구하고 iM증권은 다음과 같이 추가적인 불안 요인이 동시에 존재한다고 지적했다:\n\n> 앤스로픽이 알파벳, 아마존, MS 등 하이퍼스케일러 업체들과 약 6,000억 달러 규모의 장기 컴퓨팅 계약을 맺고 있다는 점은 추후 외부 자금 조달(채권 발행, 증자 등)에 대한 부담을 확대시키는 요인이다. 비슷한 맥락에서 메타의 950억 달러 주식 발행 계획에 엔비디아, AMD 등 반도체 업체들이 참여할 것으로 알려진 점은 안정적인 고객 확보 측면에서는 긍정적이지만, 한동안 잠잠했던 순환금융 논란을 수면 위로 부상시킬 여지도 존재한다.\n\n즉, AI 수익화의 긍정적 신호가 있었지만, 이것이 AI 업체들에게 장기적으로 필요한 자금 조달을 어렵게 만든다는 문제도 동시에 존재한다. 이는 단기적으로 AI 기대감이 강해졌지만, 중장기적으로 AI 기업들의 자금 조달 능력과 순환금융의 건강성이 중요한 변수로 남았다.\n\n---\n\n### **2. 미국 중간선거 vs AI 기업의 자금 조달: 불안과 기대감의 이중성**\n\n메타와 앤스로픽의 경우처럼 AI 업체들은 하이퍼스케일러들과 장기 계약을 맺는 동시에, 자신의 사업 확장에 필요한 자금을 조달해야 하는 위치에 있다. 여기에 미국 중간선거가 다가오고 있다.\n\n대신증권은 다음을 지적했다:\n\n> 미국 중간선거가 다가오는 가운데, 선거 이후 미국의 이란 추가 공습 가능성과 중동 내 군사적 충돌 우려로 국제 유가의 상승 압력 지속.\n\n이런 중동 불안은 AI 업체들의 자금 조달 능력을 더욱 악화시키는 방향으로 작용할 수도 있다. 그러나 메타의 950억 달러 주식 발행 계획이 엔비디아, AMD 등 반도체 업체들도 포함하고 있다는 사실은, AI 업체들이 자신들의 제품을 사용하는 고객이 바로 AI 수요를 만들어낸다는 의미다. 즉, 메타가 AI 기기를 구매했다는 것은 엔비디아에게는 매출이 됩니다. 이는 AI 업체들끼리 서로 상생 가능한 구조를 갖고 있다는 것을 시사한다.\n\n그렇다면 미국 중간선거 이후 이란과의 충돌이 현실화되면, 국제 유가가 급등하여 AI 업체들의 자금 조달 능력이 악화될 가능성이 매우 높다. 그러나 만약 이란과의 충돌이 피한다면, AI 업체들의 자금 조달 능력은 오히려 좋아질 수 있다. 이 두 가지 시나리오는 AI 업체들의 자금 조달 능력이라는 핵심 변수를 좌우한다.\n\n---\n\n### **3. KOSPI 5,500P 돌파 실패와 외국인 매수 집중: 사이드카 발동**\n\n코스피는 10월 27일 오후 10시 기준 5,638.34P로 전일 대비 3.09% 상승했다. 이는 주요 이벤트가 다가오면서 관망심리가 짙었던 전일 대비 급등이다. 그러나 5,500P를 넘어서지 않았다.\n\n대신증권은 전일(K=5,469.47P)에 대해서 이렇게 설명했다:\n\n> 주요 이벤트를 앞두고 짙어진 관망세, 거래대금까지 축소 – KOSPI는 주요 이벤트를 앞두고 관망심리가 짙어지며 5,500선 하회... 주요 이벤트를 앞둔 관망심리가 짙어지면서 적극적인 저가매수세 유입과 증시 반등 시도는 제한적 – KOSPI 거래대금은 약 12조원 수준에 머물며 시장 참여 위축...\n\n이날 거래대금은 약 12조원 수준으로 전일 대비 약간 줄어들었다. 그런데 이날 거래대금이 줄었음에도 불구하고 KOSPI가 3% 이상 급등한 이유는 무엇인가?\n\niM증권은 이날 KOSPI 상승에 대해 다음과 같이 설명했다:\n\n> 미국 중간선거가 다가오는 가운데, 선거 이후 미국의 이란 추가 공습 가능성과 중동 내 군사적 충돌 우려로 국제 유가의 상승 압력 지속 – 미국 중간선거가 다가오는 가운데, 선거 이후 미국의 이란 추가 공습 가능성과 중동 내 군사적 충돌 우려로 국제 유가의 상승 압력 지속. 일부 차익실현 매물 출회로 소폭 하락했으나, WTI, 브렌트유는 각각 101달러, 110달러로 여전히 높은 수준. 인플레이션 압력과 함께 증시 부담 요인으로 작용\n\n이미 국제 유가는 101달러(WTI), 110달러(BRENT)로 높은 수준이다. 이는 일반적인 인플레이션이 아니라, 중동에서 또다시 군사 충돌이 발생할 가능성이 있기 때문에 국제 유가가 상승하고 있다는 의미다. 그런데 이런 환경에서도 KOSPI가 3% 급등했다는 것은, KOSPI가 외국인과 기관의 동시 매수에 의해 주도된 것이다.\n\n이에 대해 한국거래소는 **프로그램 매매 사이드카를 발동**해 프로그램 매매를 일시 정지했다(iM증권).\n\n---\n\n### **4. SK하이닉스와 삼성전자: 주주환원책 기대감은 어디로?**\n\n대신증권은 KOSPI가 5,500P를 하회했는데, 그 이유를 다음과 같이 설명했다:\n\n> 반도체 대기업 추가 주주환원책 기대감과 FOMC 경계감 등이 수급요건으로 작용하며 증시 등락을 보였으나 5,500P선을 지키지 못하고 외국인 매도세에 지수는 전 거래일 대비 1.46% 하락한 5,469.47P로 마감 – KOSDAQ은 기관 순매도에 제약/바이오, 금속 업종 약세 보이며 전 거래일 대비 3.26% 하락한 727.21P로 마감\n\n이날 KOSPI는 5,500P를 하회했고, KOSDAQ도 3.26% 하락했다. 이는 외국인과 기관의 동시 매도에 의해 이루어졌다.\n\n왜 KOSPI가 5,500P를 하회했느냐? 반도체 대기업(SK하이닉스와 삼성전자)의 추가 주주환원책 기대감이 있었기 때문이다.\n\n이 기대감은 10월 초반에 처음 들렸다. 당시 시장 참가자는 삼성전자와 SK하이닉스가 추가 주주환원책을 발표할 것이라 예상을 하고 있었다. 그러나 10월 27일 현재까지 아무 것도 발표되지 않았다. 이 기대감이 기대만큼 반영되지 않은 것이 바로 KOSPI가 5,500P를 하회한 이유다.\n\n---\n\n### **5. 하이퍼스케일러의 실적: AI 수익화 불안의 해결책 또는 추가 불안의 원천**\n\niM증권은 다음과 같이 지적했다:\n\n> 시간이 지날수록 시장에서도 AI 업체들의 수익성, 현금흐름의 개선 여부에 이전보다 더 믿음직하게 반응할 것임을 시사. 이는 장기적으로 계속 끌고 가야하는 사안이며, 단기적인 관점에서는 이번 주 예정된 하이퍼스케일러 업체의 실적을 통해 AI 투자 지속 가능성을 확보할 수 있는 지가 국내외 반도체, AI주의 단기적인 주가 회복 탄력성을 결정할 것으로 판단\n\n이번 주 예정된 하이퍼스케일러 업체의 실적은 AI 수익화 불안의 해결책이 될 수 있다. 혹은, 그 실적이 기대를 부풀렸다가 실망을 줄 수 있다. 따라서 이번 주 예정된 하이퍼스케일러 업체의 실적은 AI 관련주들의 단기 주가 회복 탄력성을 결정짓는 핵심 변수다.\n\n---\n\n### **6. 미국 AI 기업들의 주식 발행: 순환금융의 복귀냐, 추가 부담 요인인가?**\n\niM증권은 다음과 같이 지적했다:\n\n> 메타의 950억 달러 주식 발행 계획에 엔비디아, AMD 등 반도체 업체들이 참여할 것으로 알려진 점은 안정적인 고객 확보 측면에서는 긍정적이지만, 한동안 잠잠했던 순환금융 논란을 수면 위로 부상시킬 여지가 존재\n\n메타가 950억 달러 규모의 주식 발행을 진행하는데, 이 주식 발행을 위해 엔비디아, AMD 등 반도체 업체들이 참여했다는 소식이다. 이는 엔비디아와 AMD가 메타로부터 AI 칩을 판다는 의미다. 메타가 AI 칩을 구매하는 것은 메타 스스로 AI를 만들고자 함을 의미한다. 그리고 엔비디아와 AMD가 메타의 주식 발행에 참여한다는 것은, 엔비디아와 AMD가 메타의 주식을 살 것이라는 의미다.\n\n이 모든 사실은 AI 업체와 반도체 업체가 서로 상생하는 구조를 갖췄다는 것을 의미한다. 하지만 이는 동시에 메타가 엔비디아와 AMD의 주식을 사는 형태로 이루어지는 순환금융이라는 점을 의미한다. 메타가 엔비디아와 AMD의 주식을 산다면, 엔비디아와 AMD는 메타의 주식을 샀다는 의미다. 이는 엔비디아와 AMD의 현금흐름을 개선시키는 방향으로 작용할 수 있지만, 메타가 엔비디아와 AMD의 주식을 산다는 것은 엔비디아와 AMD가 메타의 주식을 산다는 것인데, 이는 엔비디아와 AMD의 현금흐름을 개선시키는 방향으로 작용할 수 있다. 그러나 이는 엔비디아와 AMD가 메타의 주식을 산다는 의미다. 이는 엔비디아와 AMD가 메타의 주식을 산다는 의미다. 이는 엔비디아와 AMD의 현금흐름을 개선시키는 방향으로 작용할 수 있다.\n\n---\n\n### **7. 미국 AI 기업들의 주식 발행: 순환금융의 복귀냐, 추가 부담 요인인가?**\n\niM증권은 다음과 같이 지적했다:\n\n> 메타의 950억 달러 주식 발행 계획에 엔비디아, AMD 등 반도체 업체들이 참여할 것으로 알려진 다. 산업섹터에서는 AI 컴퓨팅 수요-공급 격차가 지속되며 가격 인상이 예상되고, PCB 공급부족이 소재로 확산되며 가격 결정력이 공급사 쪽으로 기울고 있다."}]}</script>
