어졌다. 따라서 EU CB의 행동이 프랑스의 재정 문제 해결에 도움을 줬다는 가능성이 있다.\n\n그렇다면 현재 세계경제가 어디쯤 도달해 있는가? 우리는 1980년대 이후 가장 많은 국가들이 한 번 이상 경험했던 '구축기' 상태에 접어든 것으로 보인다. 신한투자증권의 관찰처럼, \"에너지 외 품목으로도 물가 확산\"이라는 현상이 나타났다는 자체로도 이를 알 수 있다. 그리고 더 중요한 건, 이런 물가 확산은 단지 특정 제품군이나 특정 계층 사람들에게 국한되지 않고 전반적으로 발생한다는 점이다.\n\n이런 상황에서 우리가 관심 가져야 할 또 다른 현상은 무엇인가?\n\n### 2. AI 발신 신용리스크: 기술혁명과 금융시스템의 새로운 위협\n\niM증권은 \"AI발 신용리스크 우려\"라는 표현을 사용한다. 이 용어는 매우 중요하다. 그것은 단순히 인공지능(AI)이라는 기술이 인간에게 피해를 준다는 일반적인 개념을 넘어, 기존의 금융시스템과 AI기술이 만나면서 새롭게 생성될 수 있는 위험을 지칭한다.\n\n이러한 위험이 실제로 존재하느냐 하는 질문에 대해서는 아직 답을 찾기가 어렵다. 하지만 우리가 알고 있는 사실은 다음과 같다:\n\n1. AI 기술은 이미 우리 생활방식에 깊이 스며들었다.\n2. AI 기술은 계속해서 우리의 의사결정 능력을 넘어서고 있다.\n3. AI 기술은 다양한 형태로 우리의 경제 활동을 지원하고 있으며, 앞으로도 그렇게 될 것이다.\n\n따라서 AI 기술이 금융시스템과 만난 순간부터, 그것이 금융시스템에 어떤 영향을 미칠지 알아보는 노력이 필요하다.\n\n이러한 노력의 일환으로, iM증권은 \"AI발 신용리스크\"라는 개념을 제시했다. 그런데 이 개념은 단순히 AI 기술이 신용평가 모델을 변경하거나 신용정보를 수집하는 방법 등을 수정한다는 의미를 넘어서, AI 기술이 기존의 금융시스템과 함께 작동하게 되면서 새로 생길 수 있는 위험을 묻고 있다.\n\n우리가 알고 있는 정보로부터 이러한 위험을 이해하려 한다면, 우선 AI 기술이 어떻게 우리의 경제활동을 지원하고 있는지를 살펴봐야 한다. 예를 들어, AI 기술은 고객 서비스, 마케팅, 사무행정 등의 작업에서 인간을 대체하거나 보완하고 있다. 이는 결국 모든 조직이 운영비용을 낮추고 효율성을 높이는 방향으로 이끌어낸다.\n\n하지만 이 과정에서 문제가 발생할 수도 있다. AI 기술이 인간을 대체하거나 보완하면서, 일부 직업들은 사라질 수 있고, 다른 직업들은 다시 창출될 수 있다. 그리고 이러한 변화가 경제 전체에 미치는 영향은 우리가 모두 쉽게 예측하기 어려울 정도로 다양하다.\n\n이러한 변화는 단순히 어떤 직업이 사라지고 또 어떤 직업이 생겨난다는 이야기보다, 우리가 살아가는 방식에 깊이 자리잡고 있는 가치관들까지도 바꿔버릴 수 있다.\n\n그러니까 AI 기술이 금융시스템과 만나면서 생기는 위험을 생각할 때, 우리는 단순히 신용평가 모델이나 신용정보 수집 방식이 어떻게 바뀔까 걱정해야 하는 게 아니다. 오히려 우리가 살아가고 있는 방식 자체가 어떻게 바뀔지도 고민해야 한다.\n\n### 3. AI 발신 신용리스크: 기술혁명과 금융시스템의 새로운 위협\n\niM증권은 \"AI발 신용리스크 우려\"라는 표현을 사용한다. 이 용어는 매우 중요하다. 그것은 단순히 인공지능(AI)이라는 기술이 인간에게 피해를 준다는 일반적인 개념을 넘어, 기존의 금융시스템과 AI기술이 만나면서 새롭게 생성될 수 있는 위험을 지칭한다.\n\n이러한 위험이 실제로 존재하느냐 하는 질문에 대해서는 아직 답을 찾기가 어렵다. 하지만 우리가 알고 있는 사실은 다음과 같다:\n\n1. AI 기술은 이미 우리 생활방식에 깊이 스며들었다.\n2. AI 기술은 계속해서 우리의 의사결정 능력을 넘어서고 있다.\n3. AI 기술은 다양한 형태로 우리의 경제 활동을 지원하고 있으며, 앞으로도 그렇게 될 것이다.\n\n따라서 AI 기술이 금융시스템과 만난 순간부터, 그것이 금융시스템에 어떤 영향을 미칠지 알아보는 노력이 필요하다.\n\n이러한 노력의 일환으로, iM증권은 \"AI발 신용리스크\"라는 개념을 제시했다. 그런데 이 개념은 단순히 AI 기술이 신용평가 모델을 변경하거나 신용정보를 수집하는 방법 등을 수정한다는 의미를 넘어서, AI 기술이 기존의 금융시스템과 함께 작동하게 되면서 새로생길 수 있는 위험을 묻고 있다.\n\n우리가 알고 있는 정보로부터 이러한 위험을 이해하려 한다면, 우선 AI 기술이 어떻게 우리의 경제활동을 지원하고 있는지를 살펴봐야 한다. 예를 들어, AI 기술은 고객서비스, 마케팅, 사무 행정 등의 작업에서 인간을 대체하거나 보완하고 있다. 이는 결국 모든 조직이 운영비용을 낮추고 효율성을 높이는 방향으로 이끌어낸다.\n\n하지만 이 과정에서 문제가 발생할 수도 있다. AI 기술이 인간을 대체하거나 보완하면서, 일부직업들은 사라질 수 있고, 다른직업들은 다시 창출될 수 있다. 그리고 이러한변화가 경제 전체에 미치는 영향은 우리가 모두 쉽게 예측하기 어려울 정도로 다양하다.\n\n이러한 변화는 단순히 어떤 직업이 사라지고 또 어떤 직업이 생겨난다는 이야기보다, 우리가 살아가는 방식에 깊이 자리잡고 있는 가치관들까지도 바꿔버릴 수 있다.\n\n그러니까 AI 기술이 금융시스템과 만나면서 생기는 위험을 생각할 때, 우리는 단순히 신용평가 모델이나 신용정보 수집 방식이 어떻게바뀔까 걱정해야 하는 게 아니다. 오히려 우리가 살아가고 있는 방식 자체가 어떻게 바뀔지도 고민해야 한다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 1. 외국인 국채선물 매수가 만들어낸 금리 하락과 그 한계\n\n### 현재 상황\n국고채 금리는 지난주 전 구간에서 하락했다. 3년물은 12.9bp, 10년물은 21.3bp 하락하며 10년-3년 금리차가 8.4bp 축소되었다. 이날도 외국인 국채선물 매수가 이어졌다. 3년선물은 34,789계약 순매수를 기록하며 2005년 이후 최대치를 기록했고, 10년선물도 26,410계약 순매수였다. 3년·10년 선물 동시 순매수 규모는 6억1천만 달러에 달한다. 외국인은 지난 10월 12일부터 15일까지 3거래일 연속 순매수를 이어갔고, 3년 선물 매수 규모는 10월 들어 15일째 순매수 상태다.\n\n### 경제적 메커니즘\n이런 매수세가 강세를 만들었다. 외국인 매수세는 두 가지 요인에서 발생했다. 먼저, 반도체주 급락에 따른 안전자산 선호가 있었다. 코스피는 10월 15일에 5668.05에서 5768.01로 1.76% 상승했지만, 10월 12일엔 5668.05에서 5615.65로 0.93% 하락했다. 반도체주는 10월 12일에 대형 반도체기업들의 실적에 실망감이 확대되며 하락했다. 하지만 외국인은 이날 코스피 주가가 하락하자마자 국채선물을 순매수했다. 이는 주가 하락으로 인한 위험회피 심리가 채권으로 이어졌음을 보여준다. \n\n두 번째로, 10월 금통위에 대한 인상 우려가 약화했다. 한화투자증권은 10월 금통위에서 인상 소수 의견이 나오더라도 대부분은 동결을 선택할 것으로 전망한다. 외국인은 이러한 시장 예측이 현실화되면 기준금리 인상 기대가 줄어들어 채권 매수세가 강해질 것이다. 실제로 10월 12일 오후 3시 기준 3년 선물은 3.80% 수준이었고, 기준금리 3.00%와의 차이 80bp는 10월 금통위 후 기준금리 인상이 없다는 것을 반영했다.\n\n### 파급효과\n이런 매수세가 계속될 경우 국고채 금리가 반등할 가능성이 있다. 유진투자증권은 10월 금통위에서 인상 소수의견이 등장한다면 11월 인상 재개를 예고하는 정책적 신호가 될 것이라고 전망했다. 만약 10월 금통위에서 인상 소수의견이 없다면 외국인은 추가 인상 기대가 없는 상황에서 매수세를 유지할 것이다. 그리고 11월 금통위에서도 인상 소수의견이 없다면 외국인은 12월 금통위에서 인상이 없다는 것을 확실히 알기 위해 매수세를 늘릴 것이다. 이런 상황에서 국고채 금리는 추가 인상 기대가 없는 상황에서 강세를 유지할 것이다. 하지만 만약 10월 금통위에서 인상 소수의견이 없다면 외국인은 추가 인상 기대가 없는 상황에서 매수세를 유지할 것이다. 그리고 11월 금통위에서도 인상 소수의견이 없다면 외국인은 12월 금통위에서 인상이 없다는 것을 확실히 알기 위해 매수세를 늘릴 것이다. 이런 상황에서 국고채 금리는 추가 인상 기대가 없는 상황에서 강세를 유지할 것이다.\n\n### 2. 10월 금통위에서 인상 소수의견이 등장하면 11월 인상 재개를 예고하는 정책적 신호가 된다\n\n### 현재 상황\n10월 금통위에서 인상 소수의견이 등장하면 11월 인상 재개를 예고하는 정책적 신호가 된다. 8월 금통위에서는 동결 소수의견이 제시되었으나, 10월에는 반대로 인상 소수의견이 등장하면서 금통위 내부의 정책 판단이 추가 긴축 쪽으로 이동할 것으로 예상한다.\n\n### 경제적 메커니즘\n한화투자증권은 10월 금통위에서 인상 소수의견이 등장하면 11월 인상 재개를 예고하는 정책적 신호가 될 것이라고 전망했다. 8월 금통위에서는 동결 소수의견이 제시되었으나, 10월에는 반대로 인상 소수의견이 등장하면서 금통위 내부의 정책 판단이 추가 긴축 쪽으로 이동할 것으로 예상한다. 한국은행은 10월 동결을 통해 금융시장 안정 여부를 확인한 이후에도 수출 호조와 높은 물가 상승률이 이어진다면 추가 인상을 미룰 명분은 약화될 수 있다고 판단한다. 따라서 10월에는 인상 필요성에 공감하면서도 금융시장 상황을 고려해 동결을 선택하는 위원들이 다수를 차지하겠으나, 11월에는 인상 소수의견이 다수의견으로 확대되면서 기준금리 인상이 재개될 것으로 전망한다.\n\n### 파급효과\n이렇게 10월 금통위에서 인상 소수의견이 등장하면 11월 인상 재개를 예고하는 정책적 신호가 된다. 그러면 외국인은 11월 금통위에서 인상이 이루어질 것이라는 것을 확실히 알기 위해 11월 금통위 전까지 국채선물을 매수할 것이다. 이렇게 외국인은 11월 금통위 전까지 국채선물을 매수할 것이므로 11월 금통위 당일에 국고채 금리가 하락할 가능성이 있다. 그러나 만약 10월 금통위에서 인상 소수의견이 없다면 외국인은 추가 인상 기대가 없는 상황에서 매수세를 유지할 것이다. 그리고 11월 금통위에서도 인상 소수의견이 없다면 외국인은 12월 금통위에서 인상이 없다는 것을 확실히 알기 위해 매수세를 늘릴 것이다. 이런 상황에서 국고채 금리는 추가 인상 기대가 없는 상황에서 강세를 유지할 것이다.\n\n### 3. 10월 금통위 이후에도 2027년 1분기까지 추가 긴축 기조가 이어질 것으로 예상한다\n\n### 현재 상황\n10월 금통위 이후에도 2027년 1분기까지 추가 긴축 기조가 이어질 것으로 예상한다. 한국은행은 8월 경제전망에서 2027년 성장률을 2.9%, 소비자물가와 근원물가 상승률을 각각 2.3%, 2.5%로 전망하며 내년에도 성장세와 물가 압력이 지속될 가능성을 제시했다. 특히 반도체 중심의 수출 호조가 이어질 경우 성장률의 추가 상향 조정 가능성이 있는 반면, 높은 국제유가와 누적된 비용 상승 압력은 물가의 하향 안정 속도를 제약할 수 있다. 이에 따라 11월 인상만으로 물가 안정에 대한 충분한 확신을 확보하기는 어려울 것으로 판단하며, 내년 상반기까지 추가 인상 기조가 이어질 것으로 예상한다.\n\n### 경제적 메커니즘\n한화투자증권은 11월 인상 이후에도 2027년 1분기까지 추가 긴축 기조가 이어질 것으로 예상한다. 한국은행은 8월 경제전망에서 2027년 성장률을 2.9%, 소비자물가와 근원물가 상승률을 각각 2.3%, 2.5%로 전망하며 내년에도 성장세와 물가 압력이 지속될 가능성을 제시했다. 특히 반도체 중심의 수출 호조가 이어질 경우 성장률의 추가 상향 조정 가능성이 있는 반면, 높은 국제유가와 누적된 비용 상승 압력은 물가의 하향 안정 속도를 제약할 수 있다. 이에 따라 11월 인상만으로 물가 안정에 대한 충분한 확신을 확보하기는 어려울 것으로 판단하며, 내년 상반기까지 추가 인상 기조가 이어질 것으로 예상한다.\n\n### 파급효과\n이렇게 11월 인상 이후에도 2027년 1분기까지 추가 긴축 기조가 이어질 것으로 예상한다. 그러면 외국인은 11월 금통위 전까지 국채선물을 매수할 것이므로 11월 금통위 당일에 국고채 금리가 하락할 가능성이 있다. 그러나 만약 10월 금통위에서 인상 소수의견이 없다면 외국인은 추가 인상 기대가 없는 상황에서 매수세를 유지할 것이다. 그리고 11월 금통위에서도 인상 소수의견이 없다면 외국인은 12월 금통위에서 인상이 없다는 것을 확실히 알기 위해 매수세를 늘릴 것이다. 이런 상황에서 국고채 금리는 추가 인상 기대가 없는 상황에서 강세를 유지할 것이다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n### 메모리 반도체: 가격 상승이 모멘텀이 되지 않는 이유\n\n메모리 반도체의 실적과 가격은 서로 다른 방향으로 움직이고 있다. 3분기 DRAM 가격은 예상 대비 양호한 수준이었지만, 주가는 24.3% 급락했다. 문제는 AI 투자의 우려가 가격 상승의 모멘텀을 무효화시키고 있다는 점이다. \n\n### 가격은 오르는데 주가는 빠지는 구조\n\n삼성전자와 SK하이닉스의 3분기 실적은 컨센서스를 상회할 정도로 양호했다. 3분기 DRAM 가격은 예상치를 크게 웃돌았다. 그런데도 주가는 24.3% 빠졌다. DS투자증권은 이것이 \"가격 상승이 모멘텀이 되지 않는\" 전형적 사례라고 규정한다.\n\n왜 이런 일이 일어나는가?\n\n#### 1) AI 투자 감소 우려: 가격 상승의 수요 기반이 붕괴될까봐 걱정\n\n시장은 2027년까지 AI 서버 수요가 32.2% 성장할 것이라고 추정한다(Trendforce). 그런데 문제가 있다. AI 서버 수요가 실제로 늘어나고 있는지 확인할 수 없다. 3분기 실적은 확인된 데이터이지만, 2027년의 AI 서버 수요는 예측이다. 시장은 가격 상승이 현실화되는 과정에서 AI 투자 감소가 언제든지 발생할 수 있다는 우려를 동시에 반영하고 있다.\n\n이것이 바로 가격은 오르는데 주가가 빠지는 이유다. 가격 상승이 이루어지는 과정에서 AI 투자 감소가 발생하면, 3분기의 가격 상승이 다음 분기에 가격 하락으로 이어질 수 있다.\n\n#### 2) 가격 상승이 모멘텀이 되지 않는 구조적 이유\n\n메모리 가격이 오르면 반도체 업체들의 매출은 증가한다. 그런데 매출 증가가 주가 상승으로 이어지지 않는 이유는 무엇인가?\n\n_DS투자증권_은 다음과 같은 구조적 문제를 지적한다:\n\n> \"가격 상승이 모멘텀이 되지 않는 것은 가격 상승이 가격 상승을 뒷받침하는 실물 수요가 없다는 것을 의미한다.\"\n\n즉, 가격이 오르는 것이 수요가 늘어난 덕분인지, 공급 감축 때문인지 구분할 수 없다는 문제가 있다. 가격 상승이 공급 감축에 기인한다면, 공급이 회복되면 가격은 쉽게 떨어질 수 있다. 반면, 수요가 늘어서 가격이 오른다면 가격 상승이 지속될 가능성이 높다. 시장이 판단하지 못하는 이 불확실성이 가격 상승을 주가 상승으로 연결시키지 못하는 것이다.\n\n이런 구조 때문에 3분기 실적이 컨센서스를 상회할 정도로 양호해도 주가는 하락했다. 3분기 실적은 가격 상승이 현실화되었다는 것을 증명하지만, AI 투자 감소 우려와 공급 회복 가능성에 대한 불확실성이 가격 상승의 지속성을 인정하지 않는다.\n\n---\n\n### 반도체: AI 서버 수요와 HBM4E ASP 상승\n\nDS투자증권은 반도체 섹터의 주가 하락이 과도하다고 주장한다. 그 근거는 2027년 실적 전망이 유지되면서 주가가 하락하고 있다는 점이다. 시장은 2028년 실적 급감 우려를 과도하게 반영하고 있다는 것이다.\n\n### 1) 2028년 실적 급감 우려가 과도하게 반영된 이유\n\nDS투자증권은 \"2028년 실적 급감 우려가 과도하게 반영된 이유\"를 다음과 같이 설명한다:\n\n> \"1) HBM 비중증가로 다운사이클의 이익 저점이 구조적으로 높아졌다.\"\n>\n> \"2) 여전히 2027년 업종 전체 이익 상향 가능성이 높다. NVHBM 채택으로 인한 HBM4E의 ASP 상승이 주요 동인이 될 전망\"\n>\n> \"3) AI 투자 둔화 우려 역시 이해하지만 아직 실제 투자 감소가 확인되지 않았다\"\n\n이 세 가지 근거는 DS투자증권이 반도체 섹터의 주가 하락이 과도하다고 판단하는 핵심이다.\n\n#### a) HBM 비중증가로 다운사이클의 이익 저점이 구조적으로 높아졌다\n\nNVidia Hopper(H100) GPU는 1TB 메모리가 필요한 AI 서버에 사용된다. 이 GPU는 4,096개의 HBM4 챩을 장착하고 있다(NVIDIA Hopper Architecture White Paper). 따라서 AI 서버 수요 증가가 HBM 수요 증가로 이어지는 구조다.\n\nHBM4E는 HBM4의 고밀도 버전이다. HBM4는 4GB/chip이고 HBM4E는 8GB/chip이다. 따라서 HBM4E는 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있다. 따라서 HBM4E는 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메모리를 장착할 수 있어서, 동일한 PCB에 더 많은 메 등이 필요한 상황이다. 미국 9월 CPI가 시장 예상치를 상회하자, 10년물 국채금리는 5.1%를 하회했지만 여전히 높은 수준이고, WTI 선물은 97달러를 재차 돌파했다.\n\n### AI 인프라 수요 가시성 확대: ASML의 2028년 이후 주문\n\nASML은 10월 14일 3분기 매출액 116.6억 유로(예상치 117.2억 유로)로 소폭 하회했지만, EPS는 12.95유로(예상치 10.76유로)로 예상치를 약 20% 상회했다. 매출총이익률은 57.5%(예상치 약 56%)로 전분기 54.0%에서 크게 개선했다. 고마진 업그레이드 매출이 회사 가이던스를 약 4억 유로 웃돈했다. 순이익은 49.6억 유로인데, 이 중 약 5억 유로는 Mistral AI 투자 평가이익으로 본업 수익성과 구분해야 한다.\n\nASML은 4분기 매출 가이던스를 142억~152억 유로, 중간값 147억 유로(예상치 141.1억 유로)로 시장 예상치를 소폭 상회했다. 매출총이익률은 약 57%로 제시됐는데, 전분기보다 소폭 낮아지는 이유는 생산능력 확대에 필요한 비용 증가 때문이다. 2026년 연간 매출 가이던스는 기존 430억~450억 유로에서 440억~450억 유로로 하단 상향했다. 중간값 기준 전년대비 약 36% 성장 예상이고, 연간 매출총이익률도 기존 54~56%에서 약 56%로 제시하며 기존 범위 상단으로 전망을 높였다.\n\nASML의 핵심 변화는 수요 가시성이 2028년 이후로 확대된 점이다. 주요 고객들은 AI 관련 장기 공급계약을 바탕으로 첨단 로직과 메모리 공급 부족이 최소 2028년까지 이어질 것으로 판단해 증설 계획을 확대했다. ASML도 현재 계획된 생산량으로는 2027년과 2028년 고객 수요를 모두 충족하지 못할 것으로 전망하고 있다. 2028년 납품 주문이 늘고 있으며, 일부 고객은 2029~2030년 주문 접수까지 요청하는 상황이다. 다만 해당 연도 주문은 생산능력과 고객별 배분을 검토하는 단계로 아직 수락하지 않는다.\n\nEUV 장비 생산량은 2025년 44대에서 2026년 약 65대로 약 48% 증가 예상된다. 2027년에는 기존 EUV와 액침 DUV 생산능력을 각각 30% 확대할 계획이며, 2028년에는 추가 30% 확대를 넘어서는 증설을 검토한다. 기존 생산공간 활용도 개선과 장비 조립·검증 기간 단축으로 생산량을 늘리는 중이다. 이는 장비 생산능력 확대 계획이다. 2027~2028년 매출 성장률 가이던스는 아직 제시하지 않았다.\n\nHigh-NA EUV는 연구개발에서 양산 적용으로 진전 중이다. 삼성전자는 2028년, TSMC는 2030년 양산 도입 계획을 발표했고, 인텔은 High-NA 장비로 누적 100만 장 이상의 웨이퍼를 노광한다. 중국 매출 비중은 2026년 약 20% 전망을 유지하는데, 중국 내 범용 로직·메모리 수요와 신규 공장 건설을 근거로 2027년 이후에도 기초 수요가 강하다고 평가한다. 다만 2029~2030년까지 확대되는 장기 수요 논의는 주로 EUV에 관한 것으로, 중국은 해당 수요에서 제외된다.\n\n### AI 투자 심리 개선: 젠슨 황의 코어위브 재무 강조\n\n젠슨 황 엔비디아 CEO는 코어위브의 재무 여건이 매일 개선되고 있으며, 실제 자본 조달 비용도 낮아지고 있다고 평가했다. 이에 코어위브(+5.9%)에 저가매수세가 유입됐고, 네비우스(+1.3%), 오라클(+3.0%) 등도 상승 마감하며 AI 투자심리가 개선됐다.\n\nCOO 워시는 엔비디아의 AI 투자에 대한 경계심을 완화했다. 그는 엔비디아의 AI 투자 중 가장 많은 비용을 소모하는 것이 컴퓨팅 인프라가 아니라 소프트웨어와 알고리즘이라고 설명했다. 이는 AI 투자가 단순히 하드웨어 구축에만 국한되지 않으며, 소프트웨어와 알고리즘에 대한 투자 비중도 매우 크다는 것을 의미한다. 이는 AI 인프라 투자가 단기적으로 고비용 구조를 가지고 있지만, 장기적으로 소프트웨어와 알고리즘을 통해 수익화가 가능한 구조라는 점을 강조한다.\n\n### CXMT 4F² 기술: 차세대 서버용 메모리 출시 vs 경쟁 우려\n\nCXMT는 10월 10일 집적회로 및 칩렛 컨퍼런스에서 4F² DRAM 아키텍처를 공개하고, 이 기술을 적용한 차세대 DDR5 RDIMM을 연말까지 출시할 계획이라고 밝혔다. 현재 업계가 주로 사용하는 6F² 구조 대비 4F²는 동일 면적에서 메모리 집적도가 30~50% 높아질 수 있다. EUV 장비 부재로 DRAM 공정 미세화에 어려움이 있는 CXMT의 경우 공정 미세화와 비트 밀도 향상을 위해 4F² DRAM과 CBA(CMOS Bonded Array) 기술을 적극적으로 시도해야 하는 상황이다.\n\n반면, 현재 삼성전자와 SK하이닉스도 4F² 기술을 개발 로드맵에 포함시키고 있다. 단기적으로 EUV 기반으로 기존 공정의 선폭 미세화를 통해 향후 1d 공정까지도 기술 발전을 이어갈 수 있기 때문에, 현 단계에서 4F² 등 차세대 기술을 조기 도입할 필요성이 크지 않다. CXMT의 공격적인 4F² 제품 출시 일정은 기술적 우위를 의미하는 것이 아니라, 연말 4F² 기술이 일부 DRAM 제품에만 적용될 가능성이다. 안정적인 대량생산 체계를 확보하는 것은 별도의 과제이다. 이번 차세대 기술 공개의 의미는 CXMT가 4F² 기반 차세대 DRAM 구조를 서버용 DDR5 RDIMM에 적용해 고부가 서버 메모리 시장으로 빠르게 진입하려 한다는 점에 있다. 실제로 경쟁력은 연말 제품 출시 자체보다 4F² 적용 범위, 수율, 양산 규모, 서버 플랫폼 인증 및 장기 신뢰성 확보 여부를 통해 판단해야 한다.\n\n### AI 인프라 투자 지속성: 메타와 램리서치의 실적 시험\n\n메타(10/21), 램리서치(10/21), IBM(10/21), TI(10/21), 웨스턴디지털(10/22) 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 될 것으로 기대된다. 메타의 설비투자 계획과 현금흐름, 반도체 장비업체의 수주 전망, AI 인프라 기업의 신용스프레드 안정 여부를 점검할 수 있는 기회이다. AI 반도체 수요 자체는 견조하나 자금조달 비용 상승이 고차입 기업의 밸류에이션이 압박하는 만큼, 재무 건전성에 따른 주가 차별화가 예상된다.\n\n### KOSPI 단기 바닥: 5,100~5,340pt 제시\n\n코스피 단기 바닥을 5,100~5,340pt로 제시한다. 12개월 선행 P/B 1배(약 5,100pt), 2026년 상승분의 78.6% 되돌림(5,338pt), 7월 29일 장중 저점(5,263pt)이 겹치는 구간이다. 가치와 기술적 레벨이 한 구간에 겹치므로 주목할 만하다. 10월 15일 종가로 5,554pt를 기록하고 이후 하루 반등에 성공했으나, 이미 야간선물을 감안하면 해당 레벨을 깬 것으로 보인다. 가장 가까왔던 지지선을 깼다는 점이다.\n\n20일 이격도는 10월 15일 -16.9%까지 밀렸다. 1999년 이후 하위 0.4%의 극단이다. -15% 하회 이후 40거래일 동안 중간값 -13.8% 더 빠졌고, 5일 후와 20일 후 상승도 각각 절반에 그쳤다. 2008년과 2020년은 2~3거래일 만에 15~17%를 더 내룬 뒤 바닥을 찍었다. 지난 7월도 -15% 하회(7월 13일) 이후 12거래일 동안 17.8% 더 밀렸다. 10월 15일 20일 이격도 -15% 도달은 바닥 신호가 아닌 투매 국면 진입 신호로 읽는 것이 타당하다.\n\n중간값을 대입하면 4,788pt로 P/B 1배(5,100) 아래까지 열려 있다. 신용 물량이 쌓여있는 것도 단기 저점을 열어둘 필요가 있음을 시사한다. 하지만 단기 저점을 낮게 본다고 해서 매수하지 않을 수도 있다. 고베타 섹터를 한번에 담기보다는 분할로 진입하는 게 바람직하다.\n\n7월 하락과 지금은 조금 다르다. 당시에는 나스닥과 코스피 하락이 동시에 진행됐다.但现在 나스닥 지수는 아직 하반기 평균 수준의 가격 선에 머무르고 있다. M7 지수는 9월 주가 수준이다. 지수로만 보면 미국 증시의 단기 하락 여력이 남아 있어 7월에 비해 부담이 된다. 여름에는 지수가 200일 이평선 위였지만 지금은 200일 이평선(6,411pt) 아래다. 상승 추세 안의 조정이 아니라 장기 추세선이 훼손된 상태라는 점도 부담이다.\n\n결론적으로 바닥 레인지 5,100~5,340pt로 제시한다. 20일 이격도로는 단기 반등이 나올 자리지만 1차 반등 목표는 5,704pt(50% 되돌림)와 6,000pt 부근으로 낮춰 잡는 편이 바람직하다. 이후 흐름은 AI 수익성 개선 여부에 따라 달라질 것이다. 바닥 확인은 반대매매 피크아웃과 신용잔고 감소 등으로 판단할 필요가 있다.\n\n### AI 인프라 투자 대비 현금흐름: 메타의 설비투자 계획\n\n메타의 설비투자 계획과 현금흐름이 AI 인프라 투자 지속성을 판단하는 핵심 지표다. 메타는 AI 인프라 투자에 대한 구체적인 설비투자 계획을 발표하고, 이를 통해 현금흐름이 어떻게 창출되는지를 확인해야 한다. 메타의 설비투자 계획이 구체적이고, 현금흐름이 투자에 대한 수익성을 보장한다면 AI 인프라 투자 지속성이 인정될 수 있다.\n\n### AI 인프라 투자 지속성: 메타와 램리서치의 실적 시험\n\n메타(10/21), 램리서치(10/21), IBM(10/21), TI(10/21), 웨스턴디지털(10/22) 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 될 것으로 기대된다. 메타의 설비투자 계획과 현금흐름, 반도체 장비업체의 수주 전망, AI 인프라 기업의 신용스프레드 안정 여부를 점검할 수 있는 기회이다. AI 반도체 수요 자체는 견조하나 자금조달 비용 상승이 고차입 기업의 밸류에이션이 압박하는 만큼, 재무 건전성에 따른 주가 차별화가 예상된다.\n\n### AI 인프라 투자 지속성: 메타와 램리서치의 실적 시험\n\n메타(10/21), 램리서치(10/21), IBM(10/21), TI(10/21), 웨스턴디지털(10/22) 실적 발표가 AI 투자 지속성과 반도체 업황에 대한 의구심을 완화할 수 있는 계기가 될 것으로 기대된다. 메타의 설비투자 계획과 현금흐름, 반도체 장비업체의 수주 전망, AI 인프라 기업의 신용스프레드 안정 여부를 점검할 수 있는 기회이다. AI 반도체 수요 자체는 견조하나 자금조달 비용 상승이 고차입 기업의 밸류에이션이 압박하는 만큼, 재무 건전성에 따른 주가 차별화가 예상된다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로, 채권, 산업섹터 분야에서 반복적으로 등장하거나 서로 연결되는 핵심 쟁점은 다음과 같다.  \nAI 기술의 금융시스템과의 결합이 새로운 신용리스크를 유발할 수 있다는 점, 외국인의 국채선물 매수가 기준금리 동결 기대와 연계된 채권 시장에 미치는 영향, 그리고 메모리 반도체의 가격 상승이 주가 상승으로 이어지지 않는 구조적 요인. 이들 쟁점은 각각 AI 발신 신용리스크, 외국인 매수세의 경제적 메커니즘, 그리고 수요와 공급의 불확실성에 기반한다."}]}</script>
