러 1,400원: 구조적 해외주식 투자 유출의 반영\n\n신한투자증권은 원/달러 균형환율을 세 가지 방식으로 추정했다. IMF 방식으로는 1,323원, 한국 자료로 직접 추정하면 1,330~1,360원, 국내 자금의 해외 유출을 구조 요인으로 인정하면 1,400원이다. 세 수치의 차이는 근거가 달라지는 데서 비롯된다. IMF 방식은 국제적 투자 환경을 기준으로 하고, 한국 자료 직접 추정은 국내 수출·수입·자본흐름을 기반으로 한다. 그런데 신한투자증권은 국내 자금의 해외 유출을 구조 요인으로 보는 방식을 선택했다. 구조 요인으로 보는 것은 해외주식 투자 확대가 단기적인 순환적 흐름이 아니라 국내 자금 흐름의 구조적 변화로 자리 잡았다는 판단이다.\n\n이해의 핵심은 2026년 8월 평균 원/달러 환율이 1,406원이었고, 신한투자증권이 이 수준을 균형 수준으로 보고 있다는 점이다. 신한투자증권은 6월부터 시작된 원/달러 환율 하락이 원화 강세의 시작이 아니라 \"순환적 오버슈팅 해소\"라고 명시했다. 즉, 6월 이후 환율 하락이 단기적으로 과도하게 강화된 원화 가치를 되돌리는 과정이었다는 것이다. 현재 1,406원은 구조적 해외주식 투자 유출을 반영한 균형 수준으로, 8월 평균 환율이 이 수준에 도달했다는 것은 원/달러 환율이 이미 균형에 가까워졌음을 의미한다. 다만, 구조적 요인을 반영한 균형 수준이라는 판단 자체가 해외주식 투자 유출이 지속될 가능성을 내포하고 있다는 점에서, 환율이 1,400원대에서 오래 머무를 가능성이 있다.\n\n---\n\n### 3. 코스피 급락: 연휴 중 국채금리 급등과 오라클 데이터센터 지연의 동시 작용\n\n28일(월) 코스피는 연휴 중 미국 국채금리 급등에 따른 위험자산 선호 심리 위축과 오라클 데이터센터 지연 악재로 6,889.74로 마감했다. 전일 대비 23.06p 하락하며 6,800선으로 후퇴한 수준이다. 외국인과 기관이 각각 3조 2,380억원, 1조 175억원을 순매도하며 지수를 끌어내렸고, 개인은 2조 6,000억원을 순매수했다. 삼성전자(-5.00%)와 SK하이닉스(-5.00%)가 급락하며 반도체 섹터가 하락의 중심이었다.\n\n이 하락은 미국 국채금리 급등과 오라클 데이터센터 지연이라는 두 가지 하방 압력이 동시에 작용한 결과다. 미국 국채금리 급등은 글로벌 자금이 안전자산으로 회귀하는 모습을 보였음을 나타내며, 이는 주식 시장에서의 자금 유출로 이어졌다. 오라클 데이터센터 지연은 반도체 수요에 대한 우려를 자극했고, 삼성전자와 SK하이닉스의 급락은 이 우려가 실물 수요에 직접 반영된 것이다. 두 요인이 중첩되면서 코스피는 하방 압력이 강한 날로 마감했다. 다만, 4분기 수출이 반도체 중심으로 양호할 전망이라는 iM증권의 전망과 함께, 이 하락이 단기적 조정인지 장기적 전환인지에 대한 판단이 필요하다.\n\n코스닥은 외국인(457억원)과 개인(214억원)의 매수세 속에 기관(745억원)이 순매도하며 846.58로 강보합 마감했다. 유가증권시장과 코스닥시장 거래대금은 각각 21조 8,070억원, 5조 9,300억원으로, 코스닥 거래대금이 상대적으로 높은 수준을 유지하고 있다. 이는 중소형주에 대한 투자 관심이 지수 하락에도 불구하고 꾸준히 유지되고 있음을 보여준다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. 5%는 단순한 수치가 아니라 구조적 전환의 신호\n\n미국 5년물 금리가 2007년 이후 처음으로 5%를 돌파했다는 사실은 단순한 숫자 초과를 넘어, 30여 년간 이어진 금리 하락장의 종말을 의미한다. 이 수치는 연준의 인식이 이미 바뀌었음을 보여준다—9월 FOMC 이후 발언한 연준 구성원 10명 모두 물가를 최우선 과제로 꼽았으며, 이들의 점수화 성향은 9월 1.58로 연중 가장 강경한 수준에 도달했다. 온건성향 인사는 사라졌고, 이는 인상 기조가 단순한 \"추가 인상\"이 아니라 장기적 고정으로 이행되고 있음을 시사한다.\n\n이 금리 전환의 동력은 공급과 수요 양면에서 동시에 작동한다. AI와 재정이 공급을 늘리고, 해외투자자들의 신뢰가 흔들리는 수요 감소가 겹치는 구조다. 2027년 추가 인상은 없을 것(Terminal Rate 4.25%)이라는 전망이 제시되지만, 리스크는 상방에 집중되어 있다. 10년물로 환산한 2026년 AI 기업 회사채 공급물량이 미국 10년 발행량의 52%에 달하는 점은, AI 수요 폭발이 단기적으로 재정 수급에 직접적인 압력을 가한다는 사실을 수치로 보여준다. 이 공급 압력은 재정적자 GDP 대비 6% 안팎 고착화와 더불어, 적자 규모의 87.3%가 이자비용이라는 점에서 금리 상승의 자가발생적 동인이 된다.\n\n---\n\n### 2. 연준의 강경성은 데이터로도 확인된다\n\n한화투자증권의 10월 금통위 동결 전망(3.00%)은 9월 국제유가 급등이라는 단기 변수를 고려한 것이다. 유가는 내년 초까지 영향이 이어질 전망이며, 한국은행은 이미 잠재성장률 상향을 시사했다. 그러나 이 전망의 핵심 가정은 11월과 2월의 두 차례 추가 인상이 실행될 것이라는 것이다. 이는 IBK투자증권이 제시하는 수익률곡선 모델과도 일치한다—근원물가 충격은 통화정책 대응을 유도하면서 수익률곡선 레벨을 약 33bp 높이고, 기울기 팩터는 시차를 두고 6개 분기 이후 +10bp까지 확대한다. 한국고10년-3년 스프레드의 장기평균 42bp를 감안하면, 이 모델은 2025년 6월 2.81%에서 2025년 말 3.39%까지 58bp 상승한 실제 국채10년물 금리가 추정치(34bp)를 24bp 상회했다는 점에서, 공급/수요 충격이 시장금리에 동일 방향으로 중첩되었음을 보여준다.\n\n---\n\n### 3. 충격 중첩: 공급·수요·지정학이 동시에 작동하는 구조\n\nIBK투자증권은 충격 중첩이 매크로 데이터에 상당기간 잔류한다는 점을 지적한다. 신호와 소음의 구분이 중요하다—신호는 중첩되어도 매크로 경로에 영향을 미치지만, 소음은 잔차로만 남는다. 그러나 현재 국면은 신호의 중첩이 우세하다. 관세충격이 사라지기 전에 이란전쟁이 터졌고, 이란전쟁이 끝나기 전에 성장/소득지표 서프라이즈가 발생했다. 이는 충격의 시차가 짧아지면서, 각 충격의 진폭과 지속기간을 식별하는 데 어려움을 가중시킨다.\n\n---\n\n### 4. 반도체 사이클: 물량과 가격의 분리\n\nAI로 인한 반도체 수요 폭발이 잠재성장률을 끌어올린다는 기대는 과도하다. 반도체 수출이 10% 증가할 때 KOSPI는 5.8%, 설비투자는 1.8% 오르지만 민간소비는 0.2%에 그친다. 이번 사이클은 물량(15%)보다 가격(139%)이 주도하고 있다. 가격 상승이 고용과 소비로 전이되는 경로는 제한적이며, 성과급의 GDP 제고 효과도 2027년 0.08~0.12%에 불과하다. 반도체 수출 증가가 설비투자와 소비를 동시에 끌어올리지 못하는 구조는, 이 사이클이 단기적인 수출 호조에 그치고 장기 성장으로 이어지지 않을 가능성을 열어둔다.\n\n---\n\n### 5. 외국인의 신뢰 붕괴와 환율-채권 연동\n\n국내 채권 시장에서 외국인 국채선물 매도가 이어지고 있다. 이는 달러-원 강세(1,365.10원)와 엔화 약세, 외국인 주식 대규모 매도가 동시에 작용하는 환경에서 발생한다. 달러인덱스가 101대에서 상승하고 달러-엔도 강세 중에도 월말·분기말 수출업체 네고물량 유입으로 오름폭이 제한된 것은, 달러 강세가 단기 수출업체의 환전 수요로만 일부 흡수되고, 장기적으로는 외국인의 국채 선물 매도가 채권 약세를 지지하고 있음을 보여준다.\n\n---\n\n### 6. 2027년 1분기: AI·재정·스테이블코인의 수급 충격이 겹치는 시점\n\n2026년 4분기 글로벌 채권시장에는 확장재정에 따른 재정발 수급충격이 작용할 전망이다. 이 충격은 AI 수요 폭발과 중동전쟁의 공급 충격이 이미 반영된 수준에서 추가로 작용해, 2027년 1분기까지 수급 압력을 지속할 가능성이 높다. IBK투자증권은 이 시점에서 개인투자자까지 외연을 넓힌 발행어음 수요와 스테이블코인 준비자산 수요가 서로 다른 만기 구조를 보완해 듀레이션 위험을 분산시킬 수 있다고 본다. 개인투자용 국채 발행은 2025년 1.2조원 규모로 초과공급 버퍼 역할은 제한적이다. 그러나 개인투자자 순매수 강도가 고금리 구간에서 강해지는 구조와, 스테이블코인 플랫폼 이용자 수요가 준비자산 채널을 통해 단기국채 수요로 이어질 가능성이 높다는 점은, 중장기 수급 압력이 단기로 일부 흡수될 수 있는 채널로 작동한다.\n\n---\n\n### 7. 발행어음 시장: 9개사 경쟁 체제의 수급 변화\n\n메리츠증권의 단기금융업 인가로 국내 발행어음 시장은 9개사 경쟁 체제로 돌입했다. 2026년 6월 말 메리츠증권 자기자본은 8.35조원으로 최대 16.7조원 자금 조달 여력이 발생했으며, 2026년 6월 말 기준 발행어음 잔액 55.9조원과 총 발행어음 한도(자기자본 200%) 155.1조원의 격차(약 100조원)는 조달 여력이 크다는 의미다. 메리츠증권은 2028년까지 조달액의 25%를 모험자본으로 공급할 의무가 있으며, 혁신기업과 성장기업에 대한 특판금리 출시 등 적극적 마켓팅을 예상한다. 이는 단기물 중심 크레딧 수급을 형성하는 데 기여할 것으로 전망된다.\n\n---\n\n### 8. 지방은행지수와 커브 플랫: 은행 수익성과 수급의 복합 영향\n\n지방은행지수는 2026년 9월 말 Z-score +2.009에서 +1.704로 하락했다. 이 지수 하락은 순이자마진(NIM) 개선 등 은행 수익성 개선에 일반적으로 영향을 미치지만, 장단기 커브가 플랫해지면 단기자금 조달 비용이 상대적으로 중기 만기 운용 은행에 비용 압박을 가하는 구조다. 최근 지방은행지수 하락이 이 플랫 커브와 일부 연관이 있을 가능성이 제시된다. BDC ETF 가격도 Z-Score -1.363에서 -1.680으로 하락했고, 시카고연은 금융환경지수(NFCI) Z-Score는 -0.673에서 -0.680으로 소폭 하락했다. 여전히 완화적인 금융환경이 지속되고 있음을 보여주는 반면, 지방은행지수와 BDC ETF의 하락은 금융환경 완화가 은행 수익성과 BDC 수익성에 동일하게 영향을 주는 구조를 보여준다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n---\n\n### 1. 메모리 반도체: 환율 하락이 실적 하회의 주범\n\n3Q26 삼성전자 OP 104조원(+16% QoQ, OPM 51%), SK하이닉스 70조원(+16% QoQ, OPM 78%)으로 전망되는데, 이는 현재 시장 컨센서스 111조원, 78조원을 하회하는 실적이다. DS투자증권에 따르면 가장 주요한 원인은 2분기 말 대비 약 11% 하락한 원/달러 환율이다. 환율이 떨어지면 원화로 환산한 메모리 반도체 매출이 줄어드는 구조적 메커니즘이다.\n\n이외 삼성전자는 MX 원가 증가와 VD/CE 일시적 비용, SK하이닉스는 차세대 HBM 제품 전환 과정에서의 출하 믹스·매출 인식 시점 변화가 추가 영향을 미쳤다. 다만 실적 하회가 \"기본적인 성장세가 끊겼다\"는 의미가 아니라, 환율·원가 요인으로 인한 일시적 조정이라는 점은 분석 시 염두에 두어야 한다.\n\n---\n\n### 2. AIDC 전력: 규제가 비용 구조를 바꾸는 시점\n\nDominion 에너지가 데이터센터 전력 수요 대응을 위해 투입한 송전망 투자비(15억 달러) 회수를 위해 규제 당국(SCC)에 전기요금 인상 신청한 것은 AIDC 전력 비용 구조가 전환되는 분기점이다. SCC는 7월말 대규모 전력 수요처에 별도 송전 인프라 건설비를 직접 부담하도록 규정 개정 명령을 내렸고, Dominion은 90일 이내에 관련 내용을 반영한 연결 비용 개정안을 제출해야 한다.\n\n이 결정은 데이터센터 사업자들이 전력망 비용을 직접 부담하는 체계로 전환하는 것을 의미한다. 마이크로소프트가 공유 송전망 비용 부담 방식에 반발해 항소장을 제출한 것은 수용 가능성 자체가 낮다는 신호다. 규제가 가격 상승을 강제하는 동시에, 데이터센터 사업자들의 전력 인프라 비용 리스크가 표면화된 구간이다.\n\n---\n\n### 3. 상선 엔진: Q와 P의 동시 상승 기대\n\nDS투자증권은 상선 엔진 공급 쇼티지가 점차 심화되며 Q와 P의 동시 상승 기대가 높아지고 있다고 본다. 국내 엔진 2사(한화엔진, HD현대마린엔진)와 O&M 사업을 영위하는 HD현대마린솔루션을 중장기 매수 추천한다.\n\n핵심 근거는 다음과 같다:\n\n- 중국향 엔진 물량 확대\n- 견조한 상선 수주잔고와 향후 수주 물량\n- 친환경 규제 확대\n- 데이터센터(DC)향 엔진 및 MASGA 관련 수요\n\n25년 국내 엔진 2사는 MASGA 기대감, 충분한 수주잔고, IMO 규제 기대감으로 PER 약 25배를 받았고, 현재 수주잔고는 25년보다 풍부하며 MASGA·친환경 규제의 실현 가능성도 과거 대비 높아졌다. 따라서 PER 25배 부여는 합당하다는 판단이다.\n\n한화엔진을 탑픽으로 제시한 이유는 1) AI DC향 4행정 엔진 납품 기대감, 2) 추가적인 LNG선향 DF 엔진 납품, 3) 상대적인 밸류에이션 매력(DF엔진 비중 확대·선가 상승분 전가로 판가 상승 기대)이다.\n\n---\n\n### 4. VLCC 운임: 초과열의 구조적 원인과 선주 투자 부담 완화\n\n9월 4주차 VLCC 평균운임은 604,924달러/일, 1년 용선료는 216,000달러/일로 사상 최고치를 경신했다. 이는 3월 첫째주보다 각각 56.4%, 61.8% 높은 수준이다. 한화투자증권은 현재의 운임·용선료 급등이 전쟁 발발 직후 수준을 이미 초과했음을 강조한다. 그러나 이 급등이 장기적인 수익성·투자 타당성을 측정하는 지표로 보기에는 무리가 있다.\n\nIBK투자증권은 현재 1년 용선료를 기준으로 추산한 VLCC 투자회수기간이 1.7년 수준으로 1990년 이후 최저치를 기록하고 있다고 밝혔다. 이는 보유하고 있는 VLCC를 1년 대선하는 것만으로도 신조 VLCC 투자비의 절반 이상을 확보할 수 있음을 의미한다. 선박의 스펙·계약 금액·개별 기업의 비용 구조·스팟 노출 비중에 따라 투자회수기간은 달라질 수 있지만, 선주들의 투자 부담이 크게 낮아졌다는 판단이다.\n\n---\n\n### 5. 유리기판: 패키지 대면적화와 고집적 배선의 구조적 한계\n\nAI/HPC 반도체 성능 향상과 HBM 탑재 확대로 패키지 대면적화와 고집적 배선 수요가 동시에 확대되고 있다. 패키지 대형화와 미세화가 동시에 진행되면서 기존 유기기판의 Warpage(翘曲), CTE(열팽창계수), 배선 밀도 한계가 부각된다.\n\n유리기판은 높은 평탄도와 낮은 열팽창 특성을 기반으로 대면적 패키징에서 유기기판의 구조적 한계를 보완한다. 동시에 미세 RDL(회로 패턴)과 고밀도 배선 구현으로 차세대 AI 패키지의 고속·고집적 인터커넥트 수요에 대응한다. 패키지 수요가 대면적화·고집적화로 이동하는 구조적 트렌드에서 유리기판은 필수적인 재료로 자리매김하고 있다.\n\n---\n\n### 6. ESS: LFP 비중 확대와 중앙계약시장 활성화\n\n7월 글로벌 ESS 케미스트리별 신규 설치 비중은 LFP 92.1%(MoM -3.2%p), NCM 3.7%(+1.5%p), Flow Battery 1.4%(+0.7%p), Sodium based 0.4%(+0.1%p), 기타 2.4%(+1.0%p)로 집계됐다. LFP 비중은 7월말까지도 90% 이상을 유지하는 가운데, NCM이 반등하고 Flow Battery·Sodium based가 소폭 증가하는 추세다.\n\nESS 중앙계약시장 1.2GW 신규 입찰이 발표되면서 대규모 ESS 발주가 지속되고 있다. 국내 배터리사의 유휴 CAPA 활용도가 상승하는 구간이다. SK온은 엘앤에프에 이어 포스코퓨처엠과 LFP 양극재를 계약해 합계 1.3조원 규모의 non-PFE LFP 공급망을 구축했다. 이는 LFP 수요 확대가 공급망의 다변화를 동반하고 있음을 보여주는 데이터다.\n\n---\n\n### 7. 데이터센터: GS건설의 수혜와 공공주택 수주잔고 확대\n\n현대엔지니어링은 SGC에너지의 군산 AIDC를 수주해 총 300MW 구축 사업 중 1단계 60MW를 담당하며, 향후 예정된 240MW 규모 후속사업에 대한 우선협상권도 확보했다. 10월 착공, 사업비 8,700억원으로 현대엔지니어링은 MEP 중 냉각과 전력 공급 설비를 담당하고 KT클라우드가 UPS·배터리·자동제어를 담당한다.\n\nGS동해AIDC는 30일 전기선로 지중화 주민 설명회를 열어 공사 수순에 들어갈 예정이다. 다음달 초순 중 건축허가 승인이 나올 전망이며, 11월 착공 계획이다. GS 관계자 100명 이상이 상주하며 준비 중이다.\n\n국토부의 주거안정플랜은 2030년까지 공적주택 119만호를 공급하는 골자로, 정부 주도 건설이 59.3만호(건설임대 35만호, 공공분양 24.3만호)를 차지한다. 26년 6.4만호, 27년 8.2만호, 28년 10.4만호, 29년 13.2만호, 30년 21.1만호 착공 계획으로 매년 25%씩 증가한다. 공공 수주 비중이 높은 중소형 건설사(계룡건설 등)의 수주잔고 증가와 실적 증가가 기대된다.\n\n---\n\n### 8. K-뷰티 플랫폼 기업 구다이글로벌: 글로벌 수출 권역 확대와 상장 기대\n\n구다이글로벌은 2016년 설립된 비상장 화장품 기업으로, 자체 브랜드보다는 시장에서 이미 성과를 입증한 K-뷰티 브랜드를 잇달아 인수해 하나의 플랫폼으로 통합·운영하는 '애그리게이터(Aggregator)' 전략으로 급성장했다. 조선미녀, 티르티르, 스킨1004(크레이버코퍼레이션), 라운드랩(서린컴퍼니), 스킨푸드 등 8개 이상의 브랜드를 보유하고 있다.\n\n국내보다 해외 매출 비중이 높은 브랜드 위주로 포트폴리오를 구성하고 있다는 것이 특징이다. 개별 브랜드의 인지도 상승이 그룹 전체의 매출 성장으로 이어지는 선순환이 나타나고 있는 유망 기업으로, 2027년 코스피 상장을 목표로 하고 있다. 상장 시 화장품 산업 내 피어그룹의 시가총액을 키우는 역할로서 대장주 역할도 충분히 가능하다는 판단이다.\n\n---\n\n### 9. K-라면: 글로벌 수출 확대와 Capa 증설\n\n삼양식품과 농심이 내년에 라면 Capa를 각각 +40%, +8% 늘릴 예정이다. 한국 라면은 불닭볶음면을 중심으로 글로벌 시장에서 높은 브랜드 인지도를 얻고 있고, 해외에서 한국 문화에 대한 관심도 꾸준히 증가하고 있다. 미국·중국 시장 내 프리미엄 라면 시장 비중 확대와 유럽 시장 침투율 상승이 중기판매량 고성장의 기반이다. Capa 증설은 공급 부족을 타개하기 위한 전략으로, 글로벌 수출 확대와 수요 증가에 대응하는 구조적 수요 대응이다.\n\n---\n\n### 10. 자동차: 유럽 EV 점유율 21.7% 달성, 현대차·기아의 브랜드 간 흐름 분기\n\n2026년 8월 EU 신차 등록은 YoY +4.5% 증가한 70.8만대, 1~8월 누적 기준 YoY +5.3% 증가한 754.6만대를 기록했다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. AI 속도조절 논의의 실질적 영향: 오픈AI 학습 중단은 일시적 노이즈일까?\n\n9월 28일 오픈AI가 최상위 모델의 안전성 문제를 이유로 학습을 일시 중단했다는 발표는 시장에 강한 충격을 주었다. 이 발표 직후 메타(-4.8%), 인텔(-5.6%), 마이크론(-2.6%) 등 AI주가 대폭 낙폭을 확대하며 미 증시를 -0.7%~1.6% 수준으로 하락시키는 직접적 충격을 입었다. 그러나 이 이슈가 AI 개발 속도조절의 본격적 국면으로의 전환을 의미하는지가 핵심이다.\n\n**첫 번째 분석 축**: 이 학습 중단의 성격은 \"일시적\"으로 규정된다. 메타와 앤스로픽 등 다른 주요 AI 업체들이 유사한 조치를 취하지 않고 있다는 점은, 이 문제가 업계 전체의 방향 전환보다는 개별 모델의 안전성 점검에 그친다는 것을 시사한다. 또한, 10월 중 예정된 빅테크·반도체 실적시즌에서 이 이슈가 실제 AI 투자 및 실적에 실질적 충격을 주는지가 확인되는 시점이다. 이 시기에 실적 데이터가 이슈의 성격을 명확히 해줄 것이다.\n\n**두 번째 분석 축**: 키움증권은 이 이슈를 \"선택적 반도체 비중 축소\"로 해석한다. 9월 29일 국내 증시에서 외국인 순매도 금액의 99%가 반도체(3.24조원)에 집중된 것은, 이 비중 축소가 전반적 시장 참여자들의 AI 신뢰 붕괴보다는 삼성전자 배당락(29일) 전날 선제적 차익실현과 미국 10년물 금리 5.2% 돌파 부담이 더 크게 작용했다는 것을 의미한다. 이 해석은 외국인의 비중 축소가 \"AI 기술 자체에 대한 불신\"보다 \"단기 이벤트의 피로도\"에 기인하는 선택적 행동이라는 것을 명시한다.\n\n**결론**: 현재 시장은 AI 속도조절 논의를 \"실질적 개발 속도의 감속\"으로 해석하기에는 시기상조이며, 이 이슈가 반도체·AI주에 미치는 영향은 10월 실적시즌에서 확인되는 데이터에 달려 있다. 단기 지수 낙폭은 이 이슈보다는 금리 상승과 중동 리스크의 누적, 배당락 시점 등이 더 큰 변수다.\n\n---\n\n### 2. 금리 상승의 구조: 인플레이션 vs 경기 확장의 경쟁\n\n9월 28~29일 미국 10년물 금리는 5.20%~5.24%로 2007년 이후 최고치를 경신하며 연준의 매파적 신호와 견조한 경제지표가 동반했다. 이 금리 급등의 구조는 **인플레이션 우려**와 **경기 확장 기대**가 경쟁하는 구도다.\n\n**인플레이션 측면**: 9월 S&P Global 종합 PMI는 58.4p로 2021년 7월 이후 최고치를 기록하며 경기 확장세를 확인했다. 그러나 연준의 매파적 발언(바 이사: \"물가가 목표를 향해 빠르게 둔화되지 않는다\")과 5년물 국채 입찰 부진은 인플레이션이 아직 연준의 목표 수준으로 빠르게 하락하지 않는다는 인식이 강화됐음을 시사한다. 이는 금리 상승의 지속성을 뒷받침한다.\n\n**경기 측면**: 경기 확장세는 금리 상승을 억제하는 방향으로 작용한다. 경기가 호조를 보일수록 기업의 자금 조달 비용 상승에 대한 시장의 감수성이 높아지며, 금리 상승에 대한 시장의 반응이 완화될 수 있다. 이는 9월 28일 미국 증시가 금리 상승에도 AI 대형주가 강세를 보이며 S&P500을 큰 폭으로 아웃퍼폼한 배경이다.\n\n**금리-환율-자본흐름**: 이 구도는 달러-원 환율에 직접적인 영향을 미친다. 대신증권은 달러-원이 \"미국 AI 투자 발 경기 호조로 최종금리 수준에 대한 시장의 우려\"로 연말까지 상방 압력을 받을 수 있지만, 중기적으로는 펀더멘탈 반영을 예상한다. 이는 금리 상승이 단기적으로는 경기 호조와 연동해 달러 강세를 지지하지만, 장기적으로는 경기 회복이 금리 상승의 정당성을 뒷받침하지 못할 경우 약세로 전환될 수 있음을 시사한다.\n\n---\n\n### 3. 메타 Muse와 AI 에이전트의 경제적 구조 전환\n\n메타의 개인형 AI에이전트 Muse는 AI가 정보를 제공하는 단계를 넘어 **실제 인간을 대신해 경제활동을 수행**하는 단계로의 전환을 의미한다. 이 구조 전환의 핵심은 세 가지다.\n\n**1) 데이터·API·컴퓨팅 자원의 직접 구매**: Muse는 사용자의 승인을 받아 구독 해지, 온라인 결제, 여행 예약 등을 수행한다. 이 과정에서 데이터와 API를 수시로 구매하는 구조가 형성된다. 예를 들어 여행 에이전트는 항공권 예약에 앞서 실시간 운임 데이터를 구매하거나 외부 검색 서비스를 이용한다. 이는 단일 상품 구매에서 벗어나 **다수의 서비스 간 반복·소액 결제**로의 전환이다.\n\n**2) 결제 수단의 구조적 변화**: 현재 Muse는 Stripe의 Link를 통해 결제를 수행한다. Stripe의 Link는 사용자가 등록한 결제수단을 이용하거나, 사업자에게는 승인된 구매에 한해 일회용 가상카드를 제공한다. 사용자는 구매할 때마다 거래 금액을 승인한다. 이는 현재의 결제 프로세스를 그대로 AI에이전트가 대행하는 구조다.\n\n**3) 스테이블코인과 MPP의 역할**: iM증권은 Muse가 스테이블코인 직접 결제나 온체인 정산을 도입할 가능성을 열어두고 있다. Stripe의 MPP(Machine Payments Protocol)는 서비스가 이용 요금을 제시하면 AI에이전트가 결제하고 필요한 자원을 제공받도록 하는 개방형 표준이다. MPP는 스테이블코인과 카드를 지원하며, API 호출이나 브라우저 이용량에 따른 결제 사례도 공개됐다. 이는 AI에이전트가 외부 서비스를 이용할 때 스테이블코인을 사용할 수 있는 기반을 마련하고 있다. 초소액·고빈도 거래 환경에서 수수료 비용을 낮추고, 스마트컨트랙트 기능을 통해 자동 지급·정산을 가능하게 하는 스테이블코인의 역할이 강화될 수 있다.\n\n**결론**: Muse는 AI 경제활동의 초기 상용화 사례다. 향후 AI에이전트의 경제 활동 범위가 넓어질수록 데이터·API·컴퓨팅 자원의 직접 구매가 확대되며, 이는 고빈도·초소액 결제 수요를 창출한다. 이 수요는 스테이블코인의 활용 가능성을 높이며, MPP를 통해 결제 인프라가 확장될 수 있는 구조다.\n\n---\n\n### 4. AI 인프라 투자의 집중도: 반도체의 독주와 경쟁 구도\n\n9월 28일 국내 증시에서 반도체가 외국인 순매도의 99%를 차지한 것은, AI 인프라 투자 집중도가 여전히 반도체에 집중되어 있음을 시사한다. 2026년 3분기 국내 코스피 내 컨센서스 기업 309개의 영업이익은 274조원으로 전년대비 318.7% 증가할 전망이다. 이 중 반도체는 202조원으로 1,200.8% 증가하는 반면, 비반도체는 72조원으로 44.4% 증가에 그친다. 전분기대비(QoQ) 관점에서도 전체와 반도체는 각각 9.8%, 19.1%로 증가 추세를 유지하며 비반도체보다 높다.\n\n**경쟁 구도**: AI 인프라 투자 집중도의 경쟁 구도는 두 축으로 나뉜다.\n\n**축 1: 반도체 대 CPU**  \n메타와 아카마이의 7년 116억달러(연평균 약 17억달러) 컴퓨팅 인프라 공급 계약은 주목할 점이 있다. 계약 대상 프로세서가 GPU가 아닌 CPU라는 점이다. AI 에이전트 워크로드는 다수의 외부 툴 호출이 반복되는 CPU 집약적 구조다. 또한, 에이전트 워크로드는 단발성 추론과 달리 멀티스텝으로 구성되어 지연시간이 각 스텝마다 누적되며, 사용자와 근접한 엣지 데이터센터가 중요하다. 아카마이의 엣지 데이터센터 강점은 이 구조에서 부각된다. 아카마이가 제시한 MW당 ACV(연간 계약 가치)는 약 2,200만달러로, GPU의 1,200만달러(5년 계약 기준) 대비 83% 높다. 그러나 누적 캐파는 55억달러로 동일 용량의 선단 GPU 클러스터 대비 약 2배가 소요되어, 계약 단가 증분이 감가상각으로 일부 상쇄될 것으로 추정된다. 7년 감가 상각 내용연수를 반영한 OPM은 25% 수준으로 추정되며, 실적 인식은 2027년 하반기부터 본격화될 전망이다.\n\n**축 2: GPU 공급 병목과 TSMC의 역할**  \nTSMC의 선단 캐파는 여전히 타이트한 상황이다. AI 에이전트 서비스 경쟁이 가속화될수록 CPU 공급 병목은 한층 심화될 가능성이 높다. 이는 GPU와 CPU가 AI 인프라 투자의 두 축으로서 경쟁을 벌이는 구도를 더욱 복잡하게 만든다.\n\n**결론**: 현재 AI 인프라 투자 집중도는 반도체에 집중되어 있으며, 메타 Muse와 아카마이 계약은 CPU 집약적 워크로드가 AI 인프라에서 차지하는 비중을 높이고 있다. TSMC의 GPU 공급 병목은 이 구도에서 CPU 공급의 중요성을 한층 부각시키며, GPU와 CPU의 경쟁 구도가 AI 하드웨어 투자 매력도를 결정하는 핵심 변수가 될 전망이다.\n\n---\n\n### 5. 미중 정상회담: 현상유지와 AI 대화 채널의 의미\n\n9월 23~25일 미중 정상회담은 5월 처음 언급된 \"전략적 안정 관계\" 프레임워크를 실제 정책으로 구체화하는 방향으로 진행됐다. 양국은 11월 10일 종료 예정이던 무역 휴전을 2027년 1월 10일까지 2개월 연장\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n한국 4분기 수출은 반도체 중심의 강세가 지속될 전망이다. 반도체 EBSI가 140.7로 전분기보다 소폭 하락했지만, 2분기(191.4) 대비 3분기 EBSI가 크게 둔화됐음에도 불구하고 3분기 반도체 수출증가율이 4분기보다 더 높다는 사실은 EBSI 지수가 반도체 중심의 강세를 반영하고 있음을 보여준다. 이는 EBSI 하락이 수출 모멘텀 약화를 의미하지 않음을 시사한다. 비반도체 업종에서 기계류(87.8→112.6), 선박(115.7→138), 석유화학·가전도 상승세를 보이고 있다. iM증권은 반도체 중심의 강한 수출 모멘텀과 일부 비반도체 업종의 수출 개선이 4분기 수출을 규모와 내용 모두 양호하게 만들 수 있다고 전망한다. 다만, 비반도체 업종의 EBSI 상승이 실질적인 수출 증가로 이어질지, 단기 수요 회복인지 여부는 아직 확인되지 않았다.\n\n원/달러 환율은 구조적 해외주식 투자 유출을 반영한 균형 수준으로, 2026년 8월 평균 원/달러 환율 1,406원이 균형 수준으로 추정된다. 신한투자증권은 6월 이후 원/달러 환율 하락이 \"순환적 오버슈팅 해소\"로 해석되며, 1,406원은 구조적 해외주식 투자 유출을 반영한 균형 수준으로 해석된다. 8월 평균 환율이 이미 이 수준에 도달했으므로, 원/달러 환율이 1,400원대에서 오래 머무를 가능성이 있다. 다만, 구조적 요인을 반영한 균형 수준이라는 판단 자체는 해외주식 투자 유출이 지속될 가능성을 내포하고 있다.\n\n코스피는 28일(월) 6,889.74로 마감하며 23.06p 하락했다. 외국인과 기관이 각각 3조 2,380억원, 1조 175억원을 순매도했고, 개인은 2조 6,000억원을 순매수했다. 삼성전자(-5.00%), SK하이닉스(-5.00%)가 급락하며 반도체 섹터가 하락의 중심이었다. 하락의 직접적 원인은 미국 국채금리 급등과 오라클 데이터센터 지연이다. 미국 국채금리 급등은 글로벌 자금이 안전자산으로 회귀하는 모습을 보였음을 나타내며, 오라클 데이터센터 지연은 반도체 수요에 대한 우려를 자극했다. 두 요인이 중첩되면서 코스피는 하방 압력이 강한 날로 마감했다. 다만, 4분기 수출이 반도체 중심으로 양호할 전망이라는 iM증권의 전망과 함께, 이 하락이 단기적 조정인지 장기적 전환인지에 대한 판단이 필요하다. 코스닥은 외국인(457억원), 개인(214억원)의 매수세 속에 기관(745억원)이 순매도하며 846.58로 강보합 마감했다. 유가증권시장과 코스닥시장 거래대금은 각각 21조 8,070억원, 5조 9,300억원으로, 코스닥 거래대금이 상대적으로 높은 수준을 유지하고 있다. 이는 중소형주에 대한 투자 관심이 지수 하락에도 불구하고 꾸준히 유지되고 있음을 보여준다.\n\n미국 5년물 금리가 2007년 이후 처음으로 5%를 돌파한 것은 단순한 숫자 초과를 넘어, 30여 년간 이어진 금리 하락장의 종말을 의미한다. 이 수치는 연준의 인식이 이미 바뀌었음을 보여준다—9월 FOMC 이후 발언한 연준 구성원 10명 모두 물가를 최우선 과제로 꼽았으며, 이들의 점수화 성향은 9월 1.58로 연중 가장 강경한 수준에 도달했다. 온건성향 인사는 사라졌고, 이는 인상 기조가 단순한 \"추가 인상\"이 아니라 장기적 고정으로 이행되고 있음을 시사한다. 이 금리 전환의 동력은 공급과 수요 양면에서 동시에 작동한다. AI와 재정이 공급을 늘리고, 해외투자자들의 신뢰가 흔들리는 수요 감소가 겹치는 구조다. 2027년 추가 인상은 없을 것(Terminal Rate 4.25%)이라는 전망이 제시되지만, 리스크는 상방에 집중되어 있다. 10년물로 환산한 2026년 AI 기업 회사채 공급물량이 미국 10년 발행량의 52%에 달하는 점은, AI 수요 폭발이 단기적으로 재정 수급에 직접적인 압력을 가한다는 사실을 수치로 보여준다. 이 공급 압력은 재정적자 GDP 대비 6% 안팎 고착화와 더불어, 적자 규모의 87.3%가 이자비용이라는 점에서 금리 상승의 자가발생적 동인이 된다.\n\n한화투자증권은 10월 금통위 동결 전망(3.00%)을 제시하며, 9월 국제유가 급등이라는 단기 변수를 고려했다. 유가는 내년 초까지 영향이 이어질 전망이며, 한국은행은 이미 잠재성장률 상향을 시사했다. 그러나 이 전망의 핵심 가정은 11월과 2월의 두 차례 추가 인상이 실행될 것이라는 것이다. 이는 IBK투자증권이 제시하는 수익률곡선 모델과도 일치한다—근원물가 충격은 통화정책 대응을 유도하면서 수익률곡선 레벨을 약 33bp 높이고, 기울기 팩터는 시차를 두고 6개 분기 이후 +10bp까지 확대한다. 한국고10년-3년 스프레드의 장기평균 42bp를 감안하면, 이 모델은 2025년 6월 2.81%에서 2025년 말 3.39%까지 58bp 상승한 실제 국채10년물 금리가 추정치(34bp)를 24bp 상회했다는 점에서, 공급/수요 충격이 시장금리에 동일 방향으로 중첩되었음을 보여준다.\n\n충격 중첩은 매크로 데이터에 상당기간 잔류한다. 신호와 소음의 구분이 중요하다—신호는 중첩되어도 매크로 경로에 영향을 미치지만, 소음은 잔차로만 남는다. 그러나 현재 국면은 신호의 중첩이 우세하다. 관세충격이 사라지기 전에 이란전쟁이 터졌고, 이란전쟁이 끝나기 전에 성장/소득지표 서프라이즈가 발생했다. 이는 충격의 시차가 짧아지면서, 각 충격의 진폭과 지속기간을 식별하는 데 어려움을 가중시킨다. 이란전쟁은 터진 직후부터 관세 충격의 영향이 사라지는 동시에, 성장/소득지표 서프라이즈가 발생하는 구조다. 관세 충격의 영향이 사라지는 동시에 성장/소득지표 서프라이즈가 발생하는 구조는, 충격의 진폭과 지속기간을 식별하는 데 어려움을 가중시킨다.\n\nAI로 인한 반도체 수요 폭발이 잠재성장률을 끌어올린다는 기대는 과도하다. 반도체 수출이 10% 증가할 때 KOSPI는 5.8%, 설비투자는 1.8% 오르지만 민간소비는 0.2%에 그친다. 이번 사이클은 물량(15%)보다 가격(139%)이 주도하고 있다. 가격 상승이 고용과 소비로 전이되는 경로는 제한적이며, 성과급의 GDP 제고 효과도 2027년 0.08~0.12%에 불과하다. 반도체 수출 증가가 설비투자와 소비를 동시에 끌어올리지 못하는 구조는, 이 사이클이 단기적인 수출 호조에 그치고 장기 성장으로 이어지지 않을 가능성을 열어둔다.\n\n국내 채권 시장에서 외국인 국채선물 매도가 이어지고 있다. 이는 달러-원 강세(1,365.10원), 엔화 약세, 외국인 주식 대규모 매도가 동시에 작용하는 환경에서 발생한다. 달러인덱스가 101대에서 상승하고 달러-엔도 강세 중에도 월말·분기말 수출업체 네고물량 유입으로 오름폭이 제한된 것은, 달러 강세가 단기 수출업체의 환전 수요로만 일부 흡수되고, 장기적으로는 외국인의 국채 선물 매도가 채권 약세를 지지하고 있음을 보여준다.\n\n2026년 4분기 글로벌 채권시장에는 확장재정에 따른 재정발 수급충격이 작용할 전망이다. 이 충격은 AI 수요 폭발과 중동전쟁의 공급 충격이 이미 반영된 수준에서 추가로 작용해, 2027년 1분기까지 수급 압력을 지속할 가능성이 높다. IBK투자증권은 이 시점에서 개인투자자까지 외연을 넓힌 발행어음 수요와 스테이블코인 준비자산 수요가 서로 다른 만기 구조를 보완해 듀레이션 위험을 분산시킬 수 있다고 본다. 개인투자용 국채 발행은 2025년 1.2조원 규모로 초과공급 버퍼 역할은 제한적이다. 그러나 개인투자자 순매수 강도가 고금리 구간에서 강해지는 구조와, 스테이블코인 플랫폼 이용자 수요가 준비자산 채널을 통해 단기국채 수요로 이어질 가능성이 높다는 점은, 중장기 수급 압력이 단기로 일부 흡수될 수 있는 채널로 작동한다.\n\n2027년 1분기에는 AI·재정·스테이블코인의 수급 충격이 겹치는 시점이다. AI 수요 폭발과 중동전쟁의 공급 충격이 이미 반영된 수준에서, 2026년 4분기 글로벌 채권시장에는 확장재정에 따른 재정발 수급충격이 추가로 작용할 전망이다. 이 충격은 2027년 1분기까지 수급 압력을 지속할 가능성이 높다. IBK투자증권은 이 시점에서 개인투자자까지 외연을 넓힌 발행어음 수요와 스테이블코인 준비자산 수요가 서로 다른 만기 구조를 보완해 듀레이션 위험을 분산시킬 수 있다고 본다.\n\n메리츠증권의 단기금융업 인가로 국내 발행어음 시장은 9개사 경쟁 체제로 돌입했다. 2026"}]}</script>
