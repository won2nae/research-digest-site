일본의 예상치 못한 분기 경제 역성장과 기술주 불안이 겹치며 닛케이225 -2.4%, 코스피 -3.6% 등 아시아 증시 동반 하락. *(SF Gate 등 미국 복수 매체)*", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### AI 의존도와 Non-AI\n\n### AI 수출 의존도 상승\n한국과 대만의 AI 관련 수출 비중이 각각 45%, 72%로 상승했다. 한국은 메모리반도체, 대만은 AI 인프라 관련 컴퓨팅 장비와 비메모리가 핵심이다. 한국이 상대적으로 단일품목 의존도가 높고, 대만은 컴퓨터 부품, 서버 등 고성능 반도체와 장비로 분산돼 있다. \n\n### 미국 의존도 비교\nAI 관련 수출의 미국 의존도는 대만이 한국보다 높다. 한국과 대만 모두 AI 인프라 관련 컴퓨팅 부품의 대미 수출 비중이 60% 정도지만, 이들이 전체 수출에서 차지하는 비중이 한국은 10% 내외, 대만은 35%이다. 한국은 DRAM 모듈을 포함한 컴퓨터 부품과 SSD, 대만은 서버를 비롯한 처리장치와 GPU를 포함한 기타 장치가 대미 수출의 중심이다.\n\n### IT의 성장 기여도\nIT가 올해 상반기 한국과 대만 성장의 절반 정도를 창출했다. AI 부문의 성장기 여율을 추정해보면, 대만 56%, 한국 46%, 미국 28% 정도다. 미국도 AI 투자가 성장에 미치는 영향이 커졌지만, 성장의 대부분이 AI에서 창출된다고 보기는 어렵다. AI 투자가 다소 더디게 진행돼도 미국 부담은 상대적으로 적을 것이다. AI 투자 불확실성이 커지는 국면에서는 AI와 연관이 적고 미국 의존도가 낮은 국가와 업종에 관심을 가져야 한다.\n\n### 미국 중간선거 이후 흐름\n미국 중간선거 이후 글로벌 증시 흐름을 토대로 보면, 인도, 중국, 홍콩, 베트남이 Non-AI 국가로 부각될 가능성이 있다. 반면, 한국과 대만은 AI 투자 우려가 부각되면, 경기와 자산시장 모두 영향을 받을 수밖에 없다.\n\n### 국내 Non-AI 포트폴리오\n국내에서는 소비재와 바이오가 Non-AI 및 비미국 포트폴리오로 적합하다. 주요 수출품목 중 화장품과 라면, 의약품은 비미국 수출이 양호하고, 수출 회복이 다수 국가에서 고르게 나타나고 있으며, 단가와 중량이 동시에 개선되고 있다. 따라서 AI와 미국 의존도가 낮으면서 수요가 양호해야 한다는 조건에 부합한다.\n\n---\n\n### 물가 압력의 확산과 연준의 선택\n\n### 근원 CPI 3개월 연속 0.3%\n10월 근원 CPI는 3개월 연속 전월비 0.3% 내외 상승. 헤드라인은 전월비 +0.4%로 컨센서스(+0.3%)를 상회했고, 근원은 +0.296%로 컨센서스(+0.2%)를 웃돌며 8월(+0.29%), 9월(+0.33%)에 이어 0.3% 내외를 유지. 근원 3개월 연율은 3.7%로 6개월 연율(2.7%)을 상회. 전년비 기준 당사 추산 2.8%('25년 10월 미발표).\n\n### 에너지 진정 vs 서비스 압력\n헤드라인 둔화는 에너지 진정의 결과로 기조 완화와는 구분. 에너지는 9월 전월비 +5.2%에서 10월 +0.7%로 상승 폭이 축소됐고 휘발유 소매가 하락으로 11월 헤드라인은 추가 둔화 예상. 반면 중고차 제외 근원 상품은 8월 +0.1%, 9월 +0.2%, 10월 +0.4%로 상승 폭이 확대. 서비스가 상방 압력의 중심, 연준이 보는 물가는 CPI보다 높은 수준. 주거 제외 근원 서비스는 3개월 연율 5.4%로 '24년 4월 이후 최고치인 상황. 한편 9월 근원 PCE(3.1%)는 근원 CPI(2.6%)를 0.5%p 웃돌아 ’10년 이후 최대 폭으로 역전됐는데, 이는 AI 관련 품목의 비중이 PCE에서 더 큰 점이 한 배경. 따라서 CPI의 2%대 안착을 안도 재료로 보기 어려운 이유.\n\n### PCE의 전망\n10월 근원 PCE는 3개월 연속 0.3% 추정, 4분기는 당사 전망(3.0%) 상회. 10월 PPI에서 항공료(-1.8%) 가력 하락에 따라 시장의 10월 근원 PCE 추정치는 CPI 직후의 0.35%에서 0.30%(전년비 3.2%)로 낮아졌으나 3개월 연속 0.3% 상승을 전망. 11~12월을 0.2%로 가정해도 ＇25년 4분기 기저(월 0.2% 내외)가 낮아 4분기 평균은 3.2~3.3% 수준. ’22년 이후 근원 CPI가 전월비 0.25%를 상회한 빈도는 11월 3회 모두, 1월 5회 모두, 2월 4회에 달하며 11월 전년비 상승률도 기저효과로 3.0% 내외에 머물 것으로 예상. 3월 FOMC 이전까지는 기조적 물가 둔화가 확인되기 어려운 구간인 만큼, 12월과 3월 추가 인상의 근거로 작용할 것으로 판단.\n\n---\n\n### 달러 강세와 금리 인상 기대\n\n### 달러-엔 환율 상승\n주간 동향: 미 연준 추가 긴축우려 강화로 달러 강세. 미국 10월 소비자물가와 생산자물가 발표이후 미 연준의 금리인상 우려가 강화되면서 달러화는 전주대비 1% 이상 상승함. 시장 예상치를 상회한 10월 소비자물가 상승률로 미 연준의 빅스텝(50bp 인상) 우려가 제기되면서 10년 국채 금리가 다시 5%대엔 재진입한 것이 달러 강세 압력을 높임.\n\n### 유로화 약세\n유로화는 양호한 3분기 성장률 발표에도 불구하고 미 연준의 금리인상 기조 강화 우려로 전주대비 1% 넘는 약세를 보임. 달러-엔 환율이 재차 160엔 수준에 육박한 가운데 일본 정부의 추가 시장 개입 우려 경계감으로 159엔대에서 눈치보기 장세를 보임.\n\n### 위안화와 호주 달러\n위안화도 약보합세를 보임. 젠슨황 CEO 스캔들에 따른 미중 갈등 확산 우려 등이 위안화 약세 압력으로 작용함. 호주 달러도 큰 폭의 약세를 기록함. 달러 강세, 원자재 가격 하락 등이 호주달러 약세 요인으로 작용함.\n\n### 원화 강세\n주요국 통화 중 원화 가치만 유독 강세를 보임. 블루웨이브 우려 등으로 큰 폭의 약세를 보였던 달러-원 환율은 네고 물량 확대 등의 영향과 11월 1~10일 수출 호조 등의 영향으로 강세를 보임.\n\n---\n\n### 엔비디아와 AI 투자의 리스크\n\n### 엔비디아 주가와 90년대 시스코시스템즈 주가 차트\n불편한 차트1: 엔비디아 주가와 90년대 시스코시스템즈 주가 차트. 젠슨 황 CEO 스캔들이 엔비디아 주가뿐만 아니라 미국 AI 생태계와 관련한 우려를 증폭시키면서 미국 금융시장에 예상치 못한 악재로 작용하고 있다. AI 투자 수익성 논란과 더불어 AI발 신용리스크 우려도 커지고 있는 상황에서 AI 중央은행 역할을 하던 엔비디아(=젠슨 황)가 흔들릴 수 있음이 주식시장은 물론 금융시장내에서 이번 사태에 대한 경계심을 높이는 요인이 되고 있다. 특히, 닷컴 버블 당시와 비교할 때 자주 거론되던 <그림1>의 90년대 시스코시스템즈와 2020년 이후 엔비디아 주가 차트가 이번 엔비디아 사태로 유사한 흐름을 보이기 시작한 것은 다소 불편한 현상이다.\n\n### 엔비디아 사태와 AI 투자 사이클\n물론 이번 젠슨황 CEO 스캔들 사태로 향후 엔비디아 주가가 90년대 시스코시스템즈 주가 흐름과 같이 추가 급락할 가능성은 낮다는 판단이다. 즉, 닷컴 버블 사태가 재연될 리스크는 현재로는 매우 낮다. 젠슨황 부재로 엔비디아 경영활동이 이전보다 다소 위축될 수 있지만 엔디비아 경영실적 등이 크게 흔들리지 않을 것으로 예상되기 때문이다. 다만, 젠슨황 CEO 부재로 인한 잠재적 리스크는 엔비디아 중심의 순환금융이 원활히 유지될지 여부이다. 특히 엔비디아 GPU를 담보로 한 네오 클라우드 업체에 대한 지급보증 등 자금조달 계획 등이 젠슨 황 CEO 부재에도 불구하고 큰 차질없이 진행될지가 미지수다. 만약 GPU를 담보로 한 순환금융이 차질을 빚는다면 아무래도 AI 투자 사이클 및 AI발 신용리스크에는 적지 않은 악영향을 줄 것이다.\n\n### 미 연준의 금리인상 기조\n또 하나 미 연준의 금리인상 기조도 주목할 대목이다. 90년대 시스코시스템즈 주가 급락 등 닷컴 버블 붕괴의 원인 중에 하는 미 연준의 금리인상 사이클이었다. <그림2>에서 볼 수 있듯이 시스코시스템즈 주가 급락은 미 연준 금리인상 사이클로 고금리 현상이 상당기간 지속되면서 발생했다. 우연의 일치일지 모르지만 최근 엔비디아 등 AI 기업 주가 조정의 원인 중에 하는 미 연준의 금리인상 기조도 한 몫을 하고 있다. 따라서 미 연준의 향후 추가 금리인상 폭 등 금리인상 사이클 지속 여부가 엔비디아를 포함한 AI 기업의 주가 추이 그리고 엔비디아 중심의 순환금융 리스크에도 큰 영향을 줄 것이다. 미 연준의 12월 추가 금리인상은 이미 기정사실화된 상황에서 27년 미 연준의 추가 금리인상 여부 혹은 금리인상 폭이 더욱 더 중요해졌다.\n\n### 하이퍼스케일러 CDS 추이\n그래도 위안을 삼을 수 있는 것은 <그림4>의 주요 하이퍼스케일러 CDS 추이로 엔비디아 사태에도 불구하고 그 변화를 보이지 않고 있다. 오히려 CDS 추이가 다소 안정을 보이고 있다. 또한 하이퍼스케일러 지수는 <그림5>에서 보듯 90년대 시스코시스템즈 주가와는 차별화되고 있다. 단기적으로 이번주 발표되는 엔비디아 실적 발표를 기점으로 엔비디아 주가가 반등할지는 주목할 필요가 있다.\n\n---\n\n### AI 불확실성과 국제 정치\n\n### 젠슨황 CEO 스캔들과 AI 생태계\n젠슨황 CEO 스캔들은 엔비디아 주가뿐만 아니라 미국 AI 생태계와 관련한 우려를 증폭시키면서 미국 금융시장에 예상치 못한 악재로 작용하고 있다. AI 투자 수익성 논란과 더불어 AI발 신용리스크 우려도 커지고 있는 상황에서 AI 중앙은행 역할을 하던 엔비디아(=젠슨 황)가 흔들릴 수 있음이 주식시장은 물론 금융시장내에서 이번 사태에 대한 경계심을 높이는 요인이 되고 있다.\n\n### 미국-이란 협상과 미-중 통상\n미국 10월 소비자물가와 생산자물가 발표이후 미 연준의 금리인상 우려가 강화되면서 달러화는 전주대비 1% 이상 상승함. 시장 예상치를 상회한 10월 소비자물가 상승률로 미 연준의 빅스텝(50bp 인상) 우려가 제기되면서 10년 국채 금리가 다시 5%대엔 재진입한 것이 달러 강세 압력을 높임. 미국-이란 협상 불확실성 지속된 가운데 미-중 통상 부담은 일부 완화. 주초 추가 공격 가능성 낮아지며 유가 하락했으나 핵 협상 이견과 트럼프 대통령의 합의 필요성 부인에 주 후반 반등. 한편 미국은 중국산 178개 품목 추가 관세 예외와 수출통제 대상 기업의 계열사 규제 유예 내년 1월 초까지 연장. 단기 수입비용 상승 위험 완화.\n\n### 중국의 수출 호조와 내수 부진\n중국은 수출 호조와 내수 부진의 차별화 지속. 10월 소비자물가와 핵심 소비자물가 전년대비 0.7%, 0.8% 올라 둔화된 반면 생산자물가 에너지 및 화학 중심 5.7% 상승. 수출은 반도체, 자동차 중심으로 전년대비 35.2% 증가. 수입 역시 41.6% 늘었으나 걸프산 원유 반입 회복이 일부 기여. 핵심물가 역시 둔화돼 수입 증가를 폭넓은 내수 회복으로 해석하기에는 제한.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 외국인 수요의 숫자놀이: 실제 헤징 수요 vs 일회성 지수 청산\n\n2026년 상반기에 외국인 국고채 순매수가 61.4조원으로 급증했다. 하지만 이 수치의 3/4는 WGBI 편입이라는 일회성 요인에 의해 발생한 것이었다. 외국인 보유 국채선도 잔액이 2025년 말 89.5조원에서 2026년 상반기 132.9조원으로 급증했던 것은 WGBI 편입을 위한 포트폴리오 재구성 때문이었다. \n\n한화투자증권이 계산한 바에 따르면, 2026년 상반기 외국인 10년 초과 국채 순매수 17.6조원 중 18.6조원은 헤징 목적의 선도 잔액 감소였다. 즉 17.6조원 중 94%는 선도잔액 감소로 인한 가상 수요였다. 실제로는 오히려 선도잔액이 1.0조원 감소한 상태에서 17.6조원을 순매수한 것이다. \n\n더욱 문제的是, 7월 이후 실제 수요는 13.5조원으로 줄었는데 그 중 8.6조원은 월말 지수추종자금 매수였다. 이 자금은 WGBI 편입이 끝나면서 다음 달부터 사라져버릴 수 있다. 결국 2026년 하반기 외국인 수요는 반기 평년치(10~30조원)로 돌아갈 것이며, 이마저도 지수 관련 수요가 아닌 경우다.\n\n### 10년물 금리 4% 돌파: 미국채 급등에 약세 출발→코스피 하락 전환→외국인 선물 매도\n\n11월 16일 국내 10년물 금리는 8거래일 만에 4%를 돌파했다. 전날 미국채 금리 급등에 약세로 출발한 뒤 코스피 하락 전환에 상승폭을 줄였으나, 장막판 외국인이 국채선물 매도를 늘리며 다시 확대했다. 유진투자증권이 \"외국인 국채선물 순매도는 지속\"이라고 전했는데, 이는 지난주 10년물 금리가 5.10%를 넘어서는 등 대외금리 상승세가 이어지면서 국내 금리도 다시 상승했다는 것을 시사한다. \n\n특히 11일에는 외국인의 선물 순매도와 국내 증시 반등, PD 담합 제재에 따른 투자심리 위축까지 겹쳐 국고채 3년물이 하루 만에 9.6bp, 10년물이 10.0bp 상승했다. 이후 전일 급락에 대한 되돌림으로 금리가 잠시 안정됐지만, 미국채 10년물이 5.1%를 넘어서는 등 대외금리 상승세가 이어지면서 국내 금리도 다시 상승했다. \n\n이 과정에서 두 가지 중요한 파급효과가 있었다. 하나는 미국 10월 CPI가 예상을 웃돌고 월러 이사가 50bp 인상 가능성까지 언급하자 미국채 금리가 급등한 것이었다. 다른 하나는 미국 30년물 입찰 결과가 부진해지면서 10년물이 5.10%를 넘어선 것이었다. \n\n### 외국인 선물 매도가 계속되면 10년물은 4.05%까지 상승\n\n11월 16일 외국인 국채선물 순매도가 지속된 이유는 미국 10년물 금리가 5.1%를 넘어서는 등 대외금리 상승세가 이어졌기 때문이다. 그러나 더욱 중요한 것은 외국인 국채선물 순매도가 11월 16일에도 계속되었단 자체다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# 산업 섹터별\n\n### 메모리 반도체: 가격 방어의 끝자리\n\n메모리 반도체의 3분기 실적과 주가는 두 가지 서로 다른 방향으로 움직였다. 하나증권에 따르면, 11월 10일까지 3분기 메모리 반도체 수출금액은 전년 동월 대비 215% 증가한 16억 달러를 기록했다. 이는 10월에 이어 11월에도 전월 대비 감소세가 이어지는 가운데, 전년 동월 대비 전품목의 높은 증가세가 지속된 것으로 나타났다. DRAM은 전년 동월 대비 428% 증가한 9.5억 달러, NAND는 134% 증가한 1.3억 달러를 기록했으며, MCP와 SSD는 각각 93%, 125% 증가한 4.5억 달러와 1.4억 달러를 달성했다. 전월 대비로는 DRAM이 6% 증가한 반면 NAND와 MCP, SSD는 각각 13%, 26%, 52% 감소했다.\n\n반면, 코스피 지수가 4.6% 상승하자 메모리 업체들도 주가 상승했다. 삼성전자는 9.2%, SK하이닉스는 7.4% 상승해 지수 반등폭을 상회했다. 미국 필라델피아 반도체 지수의 반등과 궤를 함께했다. 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화되는 점도 지정학적 위험 프리미엄 축소 요인이다.\n\n그러나 이날 시장에서의 반등은 가격 방어의 끝자리였다. 미국 중간선거와 동시에 중국·미국·러시아 3자 정상회의 개최 가능성에 대한 기대가 지정학적 리스크 프리미엄을 압축시키면서, WTI 유가가 3.21% 하락했고, 국제 은 또한 4.61% 하락하며 1년래 최저치를 기록했다. Fed의 추가 금리 인상 기대와 미국채 금리 상승이 무이자 귀금속 전반을 압박했고, 이는 은뿐만 아니라 전체 위험자산으로도 전이되었다. S&P 500과 나스닥도 각각 1.92%와 2.49% 하락하며 AI 반도체 수출 규제 확대와 Jensen Huang의 사임이 빅테크 전반의 불안감을 확산시켰다.\n\n메모리 업체들의 주가 반등은 단기적인 방어 기반이 아닌 실적 전망에 대한 신뢰를 기반으로 이루어졌다. 하나증권은 메모리 업체들의 실적 전망치가 상향 조정되는 국면이긴 하지만, NAND 관련 불확실성으로 인해 실적이 하향 조정될 수 있다는 우려가 주가를 누르는 요인으로 보았다. 특히, SK하이닉스는 3분기 실적 발표를 통해 글로벌 판가 인상 가능성을 열어놨고, 라면 업체들은 내년 Capa 증설을 통해 수출 병목을 해소하는 한편 글로벌 P 상승 가능성도 유효한 상황임을 밝혔다.\n\n### 코스닥: 기관 매수의 순간\n\n코스피 지수가 4.6% 상승한 것과 달리, 코스닥은 8.6% 상승하며 6주 만에 상승세로 전환했다. 이 주간 주가 변동에서 가장 중요한 시그널은 기관 매수였다. SK증권에 따르면, 코스닥의 주가 반등은 주초 약세 이후 JYP의 호실적과 와이지엔터의 실적 발표를 소화하며 주후반 강한 반등세를 기록한 것이 주요 원인이었다.\n\n주중 중반 삼양식품의 생산설비 증설 공시가 발표되기도 했지만, 주가 반등의 중심은 JYP 엔터테인먼트였다. JPY 3분기 영업이익 480억원으로 컨센서스를 약 14% 상회하며 실적 발표 다음 날 주가가 급등했고, 이는 스트레이 키즈의 서구권 음반 판매와 남미 페스티벌 출연료, MD 판매가 호실적을 뒷받침한 결과였다. MD 매출이 586억원으로 전년 대비 46.7% 증가하며 수익화 역량을 재확인했고, 내년 북미·유럽 스타디움 투어 확대와 1월 신인 보이그룹 데뷔 계획도 구체화되었다.\n\n같은 주에, 와이지엔터의 실적 발표는 3분기 영업이익 135억원으로 컨센서스를 하회했으나, MD 매출 406억원으로 전년 대비 44% 증가하며 견조한 수요를 확인했다. 이익 부진에는 빅뱅 MD 관련 대손상각과 투어 초기 운영비 부담 등이 반영됐고, 4분기에는 공연 지역 변화와 회차 확대에 따른 비용 효율 개선이 기대된다. 내년 상반기 신인 보이그룹 데뷔와 함께 검토 중인 걸그룹 공개가 IP 포트폴리오 확대 및 향후 이익 추정치 상향으로 이어질지가 관건으로 보였다.\n\nJYP와 와이지엔터의 실적 발표는 코스닥이 기관 매수를 받았음을 시사한다. SK증권에 따르면, 11월 둘째 주에 접어들며 코스닥은 한 주간 9.5% 상승하며 곧바로 반등하는 모습을 보였다. 같은 기간 코스피 상승률이 5.4%에 그친 것과 비교하면 두 배 가까운 수치였다. 이 반등을 주도한 주체는 기관이었다. 일주일 동안 기관은 8,100 억원을 순매수했고, 매수 사이드카가 이틀 연속 발동하기도 했다. 이미 외국인이 국내 증시에 대해 충분히 매도했고, 신용 청산도 이뤄진 상황에서 기관의 순매수는 증시를 끌어 올리기에 충분했다.\n\n그러나 코스닥에 대한 완전한 수요 회복이라고 판단하기는 이르다. 코스피가 NVIDIA 충격으로 주춤한 사이 코스닥은 단기간 리스크를 회피하는 분산처가 되었을 가능성이 크다. 지난 13일 자본시장 간담회에서 코스닥에 대한 언급이 있었던 것처럼 여전히 코스닥 시장에 대한 정책적 모멘텀이 남아 있다 해석할 수도 있다.\n\n### 원유: 공급과잉이 현실화되는 순간\n\n하나증권에 따르면, 11월 10일까지 10월 글로벌 석유 공급은 1.05억 barrel/day (MoM +230만 barrel/day)로 증가했다. 이로 인해 IEA는 4Q26 글로벌 석유 공급 전망을 MoM +330만 barrel/day 상향하며 글로벌 공급초과 규모를 +170만 barrel/day로 전망했다. IEA는 2027년 공급초과 규모가 더욱 커질 것으로 전망하고 있으며, 2026년 -70만 barrel/day에서 2027년 +380만 barrel/day로 급격한 수급 상황 변화를 추정하고 있다.\n\n이 공급 초과의 주요 원인은 중동 산유국의 원유 생산과 수출 회복 속도를 과소평가했기 때문이다. 10월 글로벌 석유 공급은 1.05억 barrel/day로 MoM +230만 barrel/day 증가했고, 이는 사우디/이라크/쿠웨이트로 10월 생산량 증분의 약 90% 차지했다. 9월에도 MoM +300만 barrel/day 증가하면서 불과 2개월 만에 +530만 barrel/day 확대했다. 이로 인해 IEA는 4Q26 글로벌 석유 공급 전망을 MoM +330만 barrel/day 상향하며 글로벌 공급초과 규모를 +170만 barrel/day로 전망했다. IEA는 2027년 공급초과 규모가 더욱 커질 것으로 전망하고 있으며, 2026년 -70만 barrel/day에서 2027년 +380만 barrel/day로 급격한 수급 상황 변화를 추정하고 있다.\n\n중동 산유국의 수출 정상화 중, 중동 산유국은 호르무즈 STS, 얀부-홍해 루트, 이라크의 튀르키예 제이한항 등 우회 루트를 지속적으로 확대했다. 이라크는 최근 시리아 바니야스항을 통한 트럭 운송도 12~15만 barrel/day로 확대했다. 9~10월 수출량 전쟁 이전 복귀하였다.\n\nNon-OPEC의 구조적인 생산량 확대도 동반된다. 중동 산유국뿐 아니라 Non-OPEC인 미국/캐나다/브라질/아르헨/가이아나 등 5개국의 구조적인 생산량 확대도 주목된다. 해당 국가의 생산량은 2026~27년 각각 +160만 barrel/day, +110만 barrel/day로 2년 간 +270만 barrel/day 증가할 전망이다.\n\n공급 회복으로 글로벌 석유 재고도 증가하였다. 글로벌 해상재고는 9월 +1.03억 barrel, 10월 +8,600만 barrel 증가하며 2개월 간 약 1.89억 barrel 증가했다. 이에 따라 9월까지 감소하던 글로벌 석유재고(해상+육상)는 10월 +5,200만 barrel (+170만 barrel/day)로 증가세로 전환했다.\n\n아시아 원유 도입가가 미국보다 싸다. 중동 원유 수출 본격화로 3월 40 dollar/barrel였던 Dubai-WTI의 갭이 빠르게 축소되어 11월 13일 현재 +3.5 dollar/barrel 도달했다. 11월 OSP -5 dollar/barrel 감안 시 오히려 아시아의 원유 도입 단가가 WTI보다 -1.5 dollar/barrel 저렴하다. 호르무즈의 개방 가능성, 캐나다/베네수엘라/브라질 등 아시아 공략 확대 감안 시 2027년 아시아의 원유 도입단가는 전 세계에서 가장 저렴할 것이라는 구조적 변곡점이 진입했다.\n\n### 반도체: 새로운 텍스트 생성 기술의 출현\n\nMeta는 MusE(26년 9월 출시)와 Instinct(26년 8월 베타 출시), Grok Bot을 통해 B2C 에이전트가 보편화 문턱을 처음으로 넘겼다. Meta에 따르면 MusE는 26년 9월 8일 미국과 캐나다 출시 후 40일간 다운로드 1,090만, 10월 중순 기준 DAU 250만 명을 기록했다. 행동하는 개인향 에이전트라는 OpenClaw의 아이디어를 그대로 가져왔지만, 설치 및 서버 운영 등 복잡했던 셋업 과정을 생략하고 익숙한 인터페이스(WhatsApp, MusE 앱, iMessage 등)와 보안 셋팅 제공을 통해 진입장벽을 제거한 것이 성공 요인이다.\n\n이를 통해 인터넷의 이용 방식은 Meta가 3Q26 실적발표에서 언급했듯 인간이 사이트를 돌아다니는 방식에서 인증된 에이전트, API 간 파트너십으로 진화할 것으로 예상된다. 고무적인 점은 쇼핑이라는 use case가 실질적으로 형성되어 B2C 서비스에서도 구독 및 광고 외 에이전트 커머스 기반의 수수료 모델의 가능성을 보여줬다는 것이다.\n\n### K-뷰티: 레거시의 정체와 인디브랜드의 질주\n\n교보증권은 2027년 화장품 연간전망에서 K-뷰티의 독주를 확인했다. 최근 몇 년간 국내외 레거시브랜드의 매출 성장률이 크게 둔화된 반면, 인디브랜드(에이피알, 달바글로벌) 성장세가 매우 고무적이다. 최근 2개년 CAGR은 에이피알 +71%, 달바글로벌 +61%를 기록했다. 비상장사 중에서는 구다이글로벌(별도) +81%, 크레이버 +166%, 티르티르 +33%를 기록했다.\n\n반면, 국내외 레거시 브랜드 평균 +0.5% 수준으로 부진했다. 에스티로더는 -5%, LG생활건강 -3%, 시세이도 0%, 로레알 +3%, 아모레 +8%를 기록했다. 글로벌 MNC인 로레알, 에스티로더, 시세이도 모두 K-뷰티의 급속한 성장에 주목하며, K-뷰티 콘셉트 제품을 출시하는 추세이다. 국내 레거시도 인디브랜드 컨셉 마케팅 강화 중이다.\n\n### K-뷰티의 글로벌 확장: 레거시의 방어와 인디브랜드의 진격\n\nLG생활건강은 -3%를 기록했다. 에스티로더는 -5%, 시세이도는 0%, 로레알은 +3%, 아모레는 +8%를 기록했다. 글로벌 MNC인 로레랄, 에스티로더, 시세이도는 모두 K-뷰티의 급속한 성장에 주목하며, K-뷰티 콘셉트 제품을 출시하는 추세이다. 국내 레거시도 인디브랜드 컨셉 마케팅 강화 중이다.\n\n### 데이터센터: 육상의 막힘이 해상으로 나가는 순간\n\n11월 13일, Drogue는 2천만 달러를 유치해 해양온도차발전(OTEC) 기반의 한 자릿수 MW급 규모의 프로토타입을 매입중인 원양선에 실어 '28년 초 띄울 계획이며, ABS AiP를 획득했다. 국내에서는 11월 5일, 한화오션이 ABB와 FDC 전력·제어시스템 MOU를, 11월 9일 삼성중공업이 일본 모리무라 SOFC테크놀로지와 선박·데이터센터용 대용량 고체산화물연료전지(SOFC) 공동개발 MOU('28년까지)를 체결했다. 삼성중공업이 엔지니어링·시스템 통합·상업화를, 모리무라가 셀·스택 공급을 맡으며, FDC에도 확대 적용할 수 있다고 밝혔다.\n\n11월 10일, 삼성중공업이 M3와 '프로젝트 제우스'(휴스턴, 50MW×2기) 설계계약으로 실제 프로젝트에 처음 이름을 올렸다. 이는 국내 조선사 중에서는 올해 7월부터 M3와 '프로젝트 제우스' 설계계약을 체결한 이후 올해 마지막 발표였다.\n\nFDC 관련 글로벌 사업·기술개발 발표는 현재까지 총 29건으로, 이 중 21건이 올해 발표됐다('25년 5건). 부지·설비가 특정된 실제 프로젝트 10건 중 절반(5건)도 올해 시작됐고, 나머지 19건은 선급 개념설계 인증(AiP)·MOU·컨셉·투자 단계이다. 현 시점 상업 가동 중인 곳은 Nautilus 스톡턴(약 7MW)·Denv-R 낭트(약 0.2MW) 2건, MW급 착공은 Keppel 로양('28년 완공 목표) 1건이며, 국내 조선사 중에서는 올해 7월 삼성중공업이 M3와 '프로젝트 제우스'(휴스턴, 50MW×2기) 설계계약으로 실제 프로젝트에 처음 이름을 올렸다.\n\n①[수요: 중간선거에서 육상 데이터센터가 표로 막히기 시작]: 11/3 중간선거와 함께 미국 10개 주의 시·군 단위에서 치러진 데이터센터 관련 주민투표 41건 중 40건에서 개발 제한 쪽이 승리(제한안 27건 가결, 개발 허용안 13건 부결). 뉴욕은 이미 50MW 초과 신규 하이퍼스케일 프로젝트에 최대 1년 모라토리엄('26.7.14~)을 시행 중이며, 선거 전에도 올해 1~7월 지방정부의 모라토리엄·금지 조치가 294건에 달했다. 반대 사유는 용수·전력·농지 등 자원 사용(반대층의 50% 이상), 부지 규모·재산가치 등 생활환경(22%), 전기요금(약 20%), 소음·오염(약 16%) 순으로, 대부분 '육상 부지'에서 비롯된 문제.\n\n### 데이터센터 규제: 미국 중간선거의 후폭풍\n\n11월 3일 중간선거와 함께 미국 10개 주의 시·군 단위에서 치러진 데이터센터 관련 주민투표 41건 중 40건에서 개발 제한 쪽이 승리(제한안 27건 가결, 개발 허용안 13건 부결)했다. 뉴욕은 이미 50MW 초과 신규 하이퍼스케일 프로젝트에 최대 1년 모라토리엄('26.7.14~)을 시행 중이며, 선거 전에도 올해 1~7월 지방정부의 모라토리엄·금지 조치가 294건에 달했다. 반대 사유는 용수·전력·농지 등 자원 사용(반대층의 50% 이상), 부지 규모·재산가치 등 생활환경(22%), 전기요금(약 20%), 소음·오염(약 16%) 순으로, 대부분 '육상 부지'에서 비롯된 문제였다.\n\n이 규제가 미국 내부에서 확산되면서 데이터센터 수요의 방향성이 바뀐다. 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화되며, 이는 지정학적 리스크가 정점을 지났다는 판단으로 해석된다. 이에 유가는 80~90달러 레벨에 안착 중이다.\n\n### 인공지능의 새 얼굴: 텍스트 생성 기술의 출현\n\nMeta는 MusE(26년 9월 출시)와 Instinct(26년 8월 베타 출시), Grok Bot을 통해 B2C 에이전트가 보편화 문턱을 처음으로 넘겼다. Meta에 따르면 MusE는 26년 9월 8일 미국과 캐나다 출시 후 40일간 다운로드 1,090만, 10월 중순 기준 DAU 250만 명을 기록했다. 행동하는 개인향 에이전트라는 OpenClaw의 아이디어를 그대로 가져왔지만, 설치 및 서버 운영 등 복잡했던 셋업 과정을 생략하고 익숙한 인터페이스(WhatsApp, MusE 앱, iMessage 등)와 보안 셋팅 제공을 통해 진입장벽을 제거한 것이 성공 요인이다.\n\n이를 통해 인터넷의 이용 방식은 Meta가 3Q26 실적발표에서 언급했듯 인간이 사이트를 돌아다니는 방식에서 인증된 에이전트, API 간 파트너십으로 진화할 것으로 예상된다. 고무적인 점은 쇼핑이라는 use case가 실질적으로 형성되어 B2C 서비스에서도 구독 및 광고 외 에이전트 커머스 기반의 수수료 모델의 가능성을 보여줬다는 것이다.\n\n### 키프트렌드: AI 인프라 투자 지연과 메모리 업황\n\nNVIDIA의 젠슨 황 CEO가 사임했고, 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화된다. 이는 지정학적 리스크가 정점을 지났다는 판단으로 해석된다. 이에 유가는 80~90달러 레벨에 안착 중이다.\n\nAI 인프라 투자 지연 우려와 데이터센터 투자 지연 우려가 부각된다. Rotate 기준 24년 1~7월 대비 26년 동기간 항공화물 증가분 중 클라우드·컴퓨터 및 부품·반도체의 비중이 33%를 차지했다. IT장비는 전자상거래와 함께 항공화물 성장을 견인했다. 현재까지 실제 물동량 추이는 견조하다. 일본통운의 1~9월 항공 포워딩 물량은 73.4만 ton(+8.3% YoY)을 기록했다. DHL의 3Q 항공 포워딩 물량 및 톤당 매출총이익은 각각 12%, 15% 증가했다. DHL은 항공화물 공급 제약과 높은 운임에 따른 Express 물량 유입의 3Q 추가 EBIT을 1억 euro(부문 내 10%)로 추산했다. 데이터센터 수요와 중동 차질이 함께 반영된 효과이다.\n\nNVIDIA의 젠슨 황 CEO가 사임했고, 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화된다. 이는 지정학적 리스크가 정점을 지났다는 판단으로 해석된다. 이에 유가는 80~90달러 레벨에 안착 중이다.\n\nAI 인프라 투자 지연 우려와 데이터센터 투자 지연 우려가 부각된다. Rotate 기준 24년 1~7월 대비 26년 동기간 항공화물 증가분 중 클라우드·컴퓨터 및 부품·반도체의 비중이 33%를 차지했다. IT장비는 전자상거래와 함께 항공화물 성장을 견인했다. 현재까지 실제 물동량 추이는 견조하다. 일본통운의 1~9월 항공 포워딩 물량은 73.4만 ton(+8.3% YoY)을 기록했다. DHL의 3Q 항공 포워딩 물량 및 톤당 매출총이익은 각각 12%, 15% 증가했다. DHL은 항공화물 공급 제약과 높은 운임에 따른 Express 물량 유입의 3Q 추가 EBIT을 1억 euro(부문 내 10%)로 추산했다. 데이터센터 수요와 중동 차질이 함께 반영된 효과이다.\n\nNVIDIA의 젠슨 황 CEO가 사임했고, 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화된다. 이는 지정학적 리스크가 정점을 지났다는 판단으로 해석된다. 이에 유가는 80~90달러 레벨에 안착 중이다.\n\nAI 인프라 투자 지연 우려와 데이터센터 투자 지연 우려가 부각된다. Rotate 기준 24년 1~7월 대비 26년 동기간 항공화물 증가분 중 클라우드·컴퓨터 및 부품·반도체의 비중이 33%를 차지했다. IT장비는 전자상거래와 함께 항공화물 성장을 견인했다. 현재까지 실제 물동량 추이는 견조하다. 일본통운의 1~9월 항공 포워딩 물량은 73.4만 ton(+8.3% YoY)을 기록했다. DHL의 3Q 항공 포워딩 물량 및 톤당 매출총이겟은 각각 12%, 15% 증가했다. DHL은 항공화물 공급 제약과 높은 운임에 따른 Express 물량 유입의 3Q 추가 EBIT을 1억 euro(부문 내 10%)로 추산했다. 데이터센터 수요와 중동 차질이 함께 반영된 효과이다.\n\nNVIDIA의 젠슨 황 CEO가 사임했고, 미국 중간선거에서 민주당이 상·하원을 동시에 장악하면서 중동 확전에 대한 정치적 견제가 강화된다. 이는 지정학적 리스크가 정점 )가 취약해질 수도 있다는 2차 우려\n\n11/16 코스피 5,290.53P, 코스닥 665.65P의 하락은 이 두 흐름의 동시 작용에 따른 것입니다. 특히, 11/16 코스닥은 전일 대비 4.86% 하락했는데, 이는 엔비디아뿐만 아니라 미국 AI 투자 내러티브 전체를 뒷받침했던 반도체 주가를 포함해 국내 증시의 AI 연관 종목에 걸친 네거티브가 확대된 것을 시사합니다.\n\n### 2. 미국 10월 CPI 상회: 긴축 경로 재확인 vs AI 내러티브의 상대적 하락\n\n11/16 미국 10월 CPI가 시장 예상치를 상회했습니다. 전년 대비 +0.4% (+0.3% 예상), 근원 +0.3% (+0.2% 예상)—헤드라인은 에너지 가격 둔화로 9월(0.6%) 대비 낮은데, 근원 CPI는 3개월 연속 0.3% 상승하며 인플레이션이 여러 품목에 걸쳐 지속되는 구조를 보여줍니다.\n\n이에 따라 Fed의 추가 긴축 기조가 재확인되고 있습니다. 12월 FOMC에서 50bp 인상이 가능한 시나리오가 부각되면서, 미국채 2년물은 9월말 고점을 근접했습니다. 미국채 10년물도 5%를 상회했습니다.\n\n이 국면에서 AI 내러티브가 얼마나 견고한지를 따져봐야 합니다. 11/16 S&P 500은 -1.92%를 기록했는데, 이는 엔비디아 사태에 더해 Fed의 매파적 시그널이 위험자산에 추가 부담으로 작용한 것입니다. AI 반도체 수요가 견조하다는 코어위브 실적과 국내 반도체 수출 호조가 11/16 코스피 5,290.53P가 전일 대비 0.98% 하락했음에도 5,300선 하회로 그친 이유입니다. 즉, AI 투자 내러티브가 하방을 막아줬습니다.\n\n그렇지만, 이 국면에서 AI 내러티브 자체가 상대적으로 낮아지고 있습니다. 11/16 코스닥은 전일 대비 4.86% 하락했는데, 이는 AI 산업의 투자 부담이 코스피 내에서 더 두드러졌다는 것을 의미합니다. 11/16 S&P 500은 -1.92%, 나스닥 -2.49%로 하락했는데, 이는 엔비디아 사태와 AI 수출 규제 확대가 미국 주식시장에서 AI 관련 종목을 더 빠르게 데셀링시키고 있다는 것을 보여줍니다.\n\n따라서, AI 내러티브와 긴축 경로가 동시에 존재하는 이 국면에서 투자 선택의 우선순위는 다음과 같습니다:\n\n| 우선순위 | 구체 내용 |\n|----------|-----------|\n| 1 | AI 내러티브가 하락해도 긴축 기조가 이미 기정사실판으로 받아들여진 경우, 긴축 기조 내에서 실적이 견조한 종목이 상대적 수혜 (ex. 국내 반도체 수출 호조, 코어위브 실적) |\n| 2 | AI 내러티브가 하락하면서 긴축 기조가 기정사실판이 아닌 경우, 긴축 기조에 대한 우려가 AI 내러티브 하락과 복합적으로 위험자산을 압박 |\n\n11/16 국면은 1번의 국면입니다. AI 내러티브는 하락 중이지만, 긴축 기조는 기정사실판으로 받아들여집니다. 코스피 5,290.53P는 5,300선 하회로 그쳤다는 것은 AI 내러티브가 하방을 막아줬다는 것입니다.\n\n### 3. 앤트로픽 상장: 단기 호재 vs 장기 악재의 이중성\n\n앤트로픽의 미국 상장(11/19 나스닥)은 단기적으로 AI 산업에 대한 불확실성을 완화할 수 있는 계기가 됩니다. 앤트로픽의 구매계약 규모는 2026년 8,954억 달러로, 2045년까지 유지되는 구조입니다. 그리고 동사는 AI 모델 개발과 광통신 관련 종목으로, 미국 상장의 상징성과 구매계약의 규모에서 AI 산업의 실질적 수요를 확인시킬 수 있습니다.\n\n그러나, 앤트로픽 상장은 단기적으로 주식 공급 물량을 증가시키는 동시에, 역사적으로 대규모 IPO 이후 미국 증시가 좋은 흐름을 보이지 않은 것도 중요합니다. 2000년(닷컴버블), 2004년(구글), 2014년(알리바바, JD.com), 2021년(SPAC) 이후 다음해와 그 다음해 S&P 500은 하락하거나, 한 자릿수 성장에 그쳤습니다. 이는 대규모 IPO가 싸이클 후반이나 과열기에 나타나는 현상이라는 역사적 패턴입니다.\n\n국내 증시와 비교하면, 2026년 7월 코스피 저점 당시와 현재를 비교할 때, 운송, 건설, IT가전(2차전지), 건강관리, 코스닥 업종 주가가 코스피 7월 저점 당시보다 높게 형성되었습니다. 반면 7월 코스피 저점 당시보다 업종 주가가 더 낮은 조선, 기계, 상사자본재, 자동차, 증권 등은 그만큼 약하다는 의미로 해석됩니다. 국내 증시에서 IPO와 증자 등 주식 공급 물량은 늘지 않고 있는데, 이는 AI 산업과 관련되지 않은 국내 업종에 대해서는 AI 산업의 과열 경쟁 부담이 덜하다는 점으로 해석됩니다.\n\n즉, 앤트로픽 상장은 단기적으로 AI 산업에 대한 불확실성을 완화시켜줄 수 있지만, 장기적으로 주식 공급물량 증가라는 부담이 동시에 존재합니다. AI 산업 자체는 과열 경쟁 중이긴 하지만, 국내 증시에서 IPO와 증자 등의 주식 공급물량이 늘지 않는다는 점에서 AI 산업과 관련 없는 국내 업종이 상대적으로 투자처로 부각될 수 있습니다.\n\n### 4. 미국 국채금리와 달러 강세: 국내 원화 가치의 선방과 수출 네고의 긍정적 영향\n\n11/16 미국 10년물 국채금리는 5%를 상회했습니다. 2026년 7월 코스피 저점 이후 10년물 국채금리가 4.2%에서 5.0%로 상승했습니다. 그런데 11/16 코스피는 5,290.53P로 전일 대비 0.98% 하락했음에도 5,300선 하회로 그쳤고, 코스닥은 4.86% 하락했습니다. 이는 원화 강세가 국내 증시 하락을 제한했다는 의미입니다.\n\n미국 국채금리가 5%를 상회하자, 미국의 12월 FOMC에서 추가 긴축이 기정사실판으로 받아들여졌고, 미국과 유로존 간 금리차 부담이 유로화 약세의 직접적 원인이었습니다. 엔화도 미국과 일본 간 금리차 확대 부담으로 달러당 160엔에 근접했고, 일본 외환당국의 개입 경계감에 추가 하락은 제한되었습니다.\n\n이 국면에서 원화 가치가 상대적으로 잘 보존된 이유는 무엇일까요?\n\n첫째, 국내 수출 네고의 강세입니다. 11/16 국내 반도체 수출은 166.3억 달러로 전년 동기 대비 331.2% 증가했습니다. 11/16 KOSPI는 0.98% 하락했음에도 5,300선 하회로 그친 것이, 국내 반도체 수출 호조가 원화 가치를 뒷받침했기 때문입니다. 국내 반도체 수출이 미국 10년물 국채금리 상승과 원화 강세 사이에 위치하는 구조를 만들고 있습니다.\n\n둘째, 외국인 투자자의 국내 주식 순매수입니다. 11/16 외국인은 금융(+3,390억원), 전기/전자(+2,657억원), 운송/창고(+1,487억원) 순으로 순매수했습니다. 외국인이 국내 주식을 계속 매수하고 있기 때문에, 원화 강세가 국내 증시 하락을 제한하는 데 기여했습니다.\n\n즉, 미국 국채금리 상승과 달러 강세가 국내 원화 가치를 압박하는 국면에서, 국내 수출 네고의 강세와 외국인 투자자의 국내 주식 순매수가 원화 강세를 지속시키고, 이 원화 강세가 국내 증시 하락을 제한하는 구조가 만들어졌습니다.\n\n### 5. 미국 10월 소매판매와 FOMC 의사록: 소비 여력과 장기 금리의 향방\n\n차주의 미국 10월 소매판매와 FOMC 의사록이 중요한 변수입니다. 미국 10월 소매판매가 전월 대비 0.4% 상승한다고 한다면, 이는 9월 0.6% 상승과 비교해 소폭 둔화입니다. 소매판매가 둔화되면 소비 여력의 둔화가 확인되며, 이는 긴축 기조의 지속성을 재확인하는 동시에, 미국 내 경기를 지탱하던 소비세력이 약화되는 구조를 만들 겁니다.\n\nFOMC 의사록은 12월 추가 긴축의 기조가 확고한지, 혹은 어느 정도의 유연성이 있는지를 확인하는 데 사용됩니다. 만약 의사록에서 Fed가 긴축의 속도와 폭에 대한 유연성을 인정한다면, 미국 주식시장은 이를 반영해 긴축 우려에 대한 일시적 안도를 보일 수 있습니다. 그러나 만약 의사록에서 추가 긴축의 기조가 확고하다고 판단된다면, 미국 주식시장은 이에 또 한번 낙폭을 입을 수 있습니다.\n\n미국 10월 소매판매와 FOMC 의사록은 AI 내러티브 하락 국면에서 긴축 기조와 소비 여력을 동시에 확인할 수 있는 지표입니다. 소비 여력이 둔화되고, 긴축 기조가 확고하다면 AI 내러티브 하락과 긴축 우려가 동시에 부담이 되는 구조를 만들 것입니다.\n\n### 6. 선전 APEC: 미-중 통상 후속 조치와 러-우 휴전 공조 여부\n\n선전 APEC에서 미-중 통상 후속 조치와 러-우 휴전 공조 여부가 주목됩니다. 미-중 통상 후속 조치는 중국 수입 물량 확대와 미국 수입 물량의 수출 확대를 주제로 할 가능성이 큽니다. 이는 중국 경제 성장에 대한 긍정적 영향을 미칩니다. 러-우 휴전 공조 여부는 지정학적 리스크의 지속 여부와 관련돼 있습니다. 러-우 휴전이 확정된다면, 미-이란 군사 공격 우려가 완화되는 동시에, 지정학적 리스크가 낮아져 유가와 금가격 등이 안정될 수 있습니다.\n\n미-중 통상 후속 조치와 러-우 휴전 공조 여부는 AI 내러티브 하락 국면에서 추가적인 불확실성을 제거하거나, 안정성을 제공할 수 있는 국면입니다. 따라서, 선전 APEC에서의 결과는 국내 증시와 글로벌 증시의 방향성을 좌우할 수 있는 변수입니다. \n\n### 7. AI 산업 투자와 사이버보안: 투자 기회의 분산\n\nAI 산업의 투자 내러티브가 하락 국면에서 사이버보안 산업에 대한 투자 기회가 분산될 수 있습니다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nAI 관련 산업과 수출 의존도가 높은 국가(한국, 대만)의 경제 성장에 대한 영향이 두드러지며, AI 투자에 대한 불확실성과 미국 의존도가 상승하는 가운데 Non-AI 산업 및 국가에 대한 관심이 커지고 있다. 미국 중간선거 이후 글로벌 시장에서 인도, 중국, 홍콩, 베트남 등 Non-AI 국가가 부각되는 한편, AI 투자 지연 우려와 데이터센터 투자 지연이 부각되고 있다. 엔비디아의 젠슨 황 CEO 스캔들과 AI 생태계에 대한 우려가 미국 금융시장에 악재로 작용하며, AI와 미국 의존도가 낮은 업종과 국가에 대한 수요가 증가하고 있다."}]}</script>
