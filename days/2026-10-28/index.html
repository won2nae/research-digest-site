<script id="__DATA__" type="application/json">{"date": "2026-10-28", "headline": "3분기 GDP 성장률: 반도체 호황이 기업투자에 번져", "market": {"KOSPI": {"label": "코스피", "value": 6012.44, "change": 6.63, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 771.28, "change": 3.69, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1343.5, "change": 1.17, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 102.78, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4051.6, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.003, "change": 1.0, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.106, "change": 6.4, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52475.1, "change": 0.19, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7743.98, "change": 0.28, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 26549.85, "change": 0.27, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 상승 +6.63% (현재 6012.44, 전일 5638.34)\n- **코스닥** 상승 +3.69% (현재 771.28, 전일 743.83)\n- **원/달러 환율** 상승 +1.17% (현재 1343.5, 전일 1328.0)\n\n### 관련 뉴스\n\n---\n\n**코스피 +6.63% / 코스닥 +3.69%**\n\n**SK하이닉스 3분기 실적 호조가 아시아 기술주 전반을 끌어올림.** SK하이닉스가 AI 고대역폭 메모리(HBM) 수요 급증으로 3분기 영업이익이 크게 늘었다고 발표하면서 삼성전자를 비롯한 한국 기술주 및 아시아 반도체주가 일제히 강세를 보였다.\n**(France24, LiveMint, Digital Journal — 40개 독립 언론사 보도)**\n\n연준(Fed)이 예상대로 기준금리를 동결(3.75~4.0%)하면서 뉴욕 증시도 완만한 상승 마감, 마이크로소프트·알파벳 실적 기대감이 기술주 심리를 추가 지지했다.\n**(Reuters, WSJ — 68개 독립 언론사 보도)**\n\n---\n\n**원/달러 환율 +1.17%**\n\n연준 금리 동결 이후 달러가 유로·엔화 대비 약세로 돌아섰고, SK하이닉스 실적 서프라이즈에 따른 외국인 자금 유입이 원화에 우호적 환경을 조성한 것으로 보인다. 단, 원/달러 환율 변동만을 직접 다룬 독립 보도는 검색 범위 내에서 찾지 못했으며, 위 요인들이 간접적 배경으로 작용했을 가능성이 높다.\n**(Reuters 달러 약세 보도 참고)**\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 3분기 GDP 성장률: 반도체 호황이 기업투자에 번져\n3분기 한국 GDP는 전기대비 1.0%, 전년동기 3.4% 성장했다. 이는 2분기 0.9% 대비 0.1%P 상방조정된 수치로, 한화투자증권이 예측했던 0.7%보다 0.3%P 뛰어난 값이다. 다만 3분기 성장률이 반도체 수출 호조에 의해 이끌렸다는 점은 공통적인 진단이다(iM증권, 대신증권).\n\n### 반도체→설비투자의 물줄기\n핵심 드라이브는 반도체 수출 호조다. iM증권은 \"반도체 가격을 중심으로 한 교역조건 개선\"이라는 표현을 사용했는데, 이는 미국 반도체 팹(fab) 공장들의 HBM(DRAM) 가격 인상을 통해 중국, 일본, 타이완 등의 고객들에게 헤드룸을 제공한 것이 반도체 수출 호조의 직접적인 원인이 됐다는 의미다. 그리고 이를 반도체 기업들은 설비투자로 다시 돌려놓았다. 3분기 설비투자는 4.1% 증가해 2분기의 -0.2%를 뛰어넘었고, 건설투자도 -0.1%에서 0.7%로 꺾였다(대신증권).\n\n### GDI가 말하는 반도체 열풍\niM증권은 실질GDP에 교역조건 변화를 반영한 실질GDI(실질 국내총소득)가 3.4% 증가했다고 집계했다. 이는 실질GDP 3.4% 대비 18.8%의 상당한 차이라는데, 여기서 숫자 자체보다 방향성을 더 중요하게 보면 된다. 실질GDI가 실질GDP보다 급격히 많이 올랐다는 것은 교역조건이 좋아졌다는 것을 의미하기 때문이고, 이는 반도체 가격 인상이 수출을 통해 국내 기업들의 구매력을 확대시켰다는 데 대한 또 다른 증언이다.\n\n### 투자와 수출이 함께 뛰는 경기\n두 가지 항목이 모두 성장 기여도를 줬다는 사실이 특별하다. 일반적으로 투자와 수출이 동시에 좋은 경우는 드물다. 키움증권은 \"강력한 기업 이익사이클이 지속되고 있음을 동시에 의미한다\"고 해석했는데, 이는 반도체 수출→기업이익→투자로 연결되는 사이클이 현재 시점에서 잘 작동한다는 것을 강조한다.\n\n### 그러나 소비는 여전히 약점\n민간소비는 전기대비 -0.2% 감소했다. 대신증권은 \"2023년 2분기 이후 처음으로 전기대비 감소\"라고 규정했고, iM증권은 \"고금리 부담과 주가 조정 등이 3분기 소비경기를 악영향\"이라고 진단했다. 문제는 소비가 어디까지 빠졌냐 하는 문제가 아니다. 지난 2분기는 소비가 전기대비 0.3% 증가했고, 3분기도 0.2% 감소했다는 것은 소비가 잇따르면서 오히려 저점을 찍었던 것이다. 즉, 3분기 소비가 감소한 이유는 2분기부터 이미 감소 트렌드가 형성되어 있었기 때문에 발생한 결과다.\n\n### 2023년 같은 시점과 비교하면?\n2023년 3분기 한국 GDP 성장률은 0.9%였고, 2024년 3분기에는 -0.4%로 전기 대비 감소했다. 그런데 2025년 3분기에는 1.0%로 전기 대비 성장했다. 2023년과 2024년 3분기의 성장률은 전년 동기 대비 3.4%로 똑같았지만, 2025년 3분기에는 3.4% 성장률을 유지하면서 전기 대비도 성장했다. 이는 성장 모멘텀이 지난해 후반과 다르다는 의미다. 2023년 3분기와 2024년 3분기는 반도체 호황이 아니었다는 점에서 구별된다. 2023년 3분기에는 반도체 수출이 2022년 1분기 수준이었고, 2024년 3분기에는 반도체 수출이 2023년 1분기 수준으로 떨어졌다.\n\n### 성장률 전망 조정\n현대차증권은 올해 전체 성장률을 3.6%에서 3.8%로 상향했다. 3분기 성장률이 기존 예상치를 0.3%P 상회했고, 4분기 성장률도 견조할 것이라는 전망을 반영한 것이다. 한편 한국은행 역시 3분기 성장률이 연간 성장률을 약 0.35%P 높인다고 평가했다. 한은이 다음달 11월 경제전망에서 기존 3.3%를 상당 폭 상향할 것이란 관측이다.\n\n### 내수와 수출의 성장기여도\n3분기 성장률은 내수(투자+소비)와 수출이 모두 기여했다. 반도체 수출 호조는 수출 증가로 이어졌고, 수출 증가는 기업이익으로, 기업이익은 설비투자로 전환돼 결국 내수를 끌어올리는 형태로 작동했다. 이른바 \"내수에서 수출을 통해 시작된 성장\"이므로, 이는 반도체 호황이 국내 경기를 끌어주는 사례다.\n\n### 소비가 성장률을 얼마나 억눌렀는가?\n2025년 3분기 한국 GDP 성장률은 1.0%인데, 3분기 민간소비가 전기 대비 -0.2% 감소했다는 점을 생각하면, 만약 민간소비가 전기 대비 0.2% 증가했다면 3분기 GDP 성장률은 1.2% 정도 될 것이다. 따라서 3분기 성장률이 1.0%라면 민간소비가 전기 대비 0.2% 증가했다면 성장률은 1.2%로 상승했을 것이고, 0.2% 감소했으니 실제로는 0.2%P 떨어진다. 즉, 3분기 성장률이 1.0%임에도 불구하고 민간소비가 전기 대비 0.2% 감소했다는 것은 성장률을 0.2%P 억누른다는 계산이 된다.\n\n### 2023년 3분기 vs 2025년 3분기\n2023년 3분기 한국 GDP 성장률은 0.9%였다. 당시 한국은행의 전망치는 0.9%였다. 2024년 3분기 한국 GDP 성장률은 -0.4%였고, 한은의 전망치는 -0.6%였다. 2025년 3분기 한국 GDP 성장률은 1.0%로 기존 예상치 0.7%를 넘겼다. 2023년 3분기에는 한은의 전망치와 실제 성장률이 같았고, 2024년 3분기에는 한은의 전망치가 실제 성장률보다 0.2%P 낮았다. 2025년 3분기에는 한은의 전망치가 실제 성장률보다 0.3%P 낮았다. 한은이 전망치를 항상 실제 성장률보다 낮게 설정한다는 점은 2023년과 2024년에 적용될 수 있지만, 2025년 3분기에는 전망치가 실제 성장률보다 0.3%P 낮았다. 이는 2025년 3분기 성장률이 한은의 전망치보다 0.3%P 높다는 것을 의미한다.\n\n### 내수 성장 기여도: 투자와 소비\n3분기 한국 GDP 성장률은 투자(설비+건설투자)와 소비(민간+정부)가 각각 0.4%p, 0.1%p 기여했다. 3분기 성장률이 1.0%라면 투자와 소비가 각각 0.4%p, 0.1%p 기여했다는 것은 0.5%p가 투자에 의한 성장률이었다는 의미다. 3분기 성장률이 1.0%이고, 투자가 0.4%p 기여했으니, 투자가 없는 상태에서는 3분기 성장률은 0.6%가 되어야 한다. 하지만 투자가 없다면 3분기 성장률은 0.6%로 하락해야 하고, 3분기 성장률이 1.0%로 상승했다는 것은 투자가 없으면 0.6%가 아닌 1.0%가 되었다는 것이다. 이는 투자가 없으면 성장률이 0.6%가 되었겠지만, 투자가 있었다면 1.0%가 된다는 이야기다.\n\n### 수출 기여도: 순수출\n3분기 한국 GDP 성장률은 수출이 2.3% 증가했고, 수입도 2.4% 증가했다. 수출이 2.3% 증가하고 수입이 2.4% 증가했으니, 순수출은 0.1%P로 증가했다. 3분기 성장률이 1.0%이고, 수출이 0.1%P 기여했다는 것은 1.0%-0.1%=0.9%가 투자와 소비의 성장률이다. 3분기 성장률이 1.0%이고, 수출이 0.1%P 기여했다면, 수출이 없으면 3분기 성장률은 0.9%가 되어야 한다. 그러나 수출이 없다면 3분기 성장률은 0.9%가 되었겠지만, 수출이 있어서 1.0%가 되었다는 것이다. 이는 수출이 없으면 3분기 성장률은 0.9%가 되었겠지만, 수출이 있어서 1.0%가 된다는 이야기다.\n\n### 투자와 수출이 함께 성장하는 경기\n3분기 한국 GDP 성장률은 투자와 수출이 모두 기여했다. 3분기 성장률이 1.0%이고, 투자가 0.4%p 기여했으며, 수출이 0.1%p 기여했다. 0.4+p + 0.1+p = 0.5+p가 투자와 수출의 성장률이다. 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했다면, 1.0%-0.5%=0.5%p가 소비의 성장률이다. 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했으니, 소비가 0.5%p 기여했다는 것은 3분기 성장률이 0.5%p 기여했다는 것이다. 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했다면, 소비가 0.5%p 기여했다는 것은 3분기 성장률이 0.5%p 기여했다는 것이다. 이는 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했으니, 소비가 0.5%p 기여했다는 것은 3분기 성장률이 0.5%p 기여했다는 것이다. 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했다면, 소비가 0.5%p 기여했다는 것은 3분기 성장률이 0.5%p 기여했다는 것이다.\n\n### 투자와 수출이 함께 성장하는 경기\n3분기 한국 GDP 성장률은 투자와 수출이 모두 기여했다. 3분기 성장률이 1.0%이고, 투자가 0.4%p 기여했으며, 수출이 0.1%p 기여했다. 0.4+p + 0.1+p = 0.5+p가 투자와 수출의 성장률이다. 3분기 성장률이 1.0%이고, 투자와 수출이 0.5%p 기여했다면, 1.0 이하 순매수는 0.52조원으로 9월 0.58조원 대비 10% 감소했다.\n\n즉, 외국인이 10월 5.3조원 매수했고, 은행은 1.85조원 매수했다. 5.3+(1.85×1)=7.15조원의 수요가 있었지만, 실제 국내 기관의 순매도는 2.73조원(잔존 3~10년 순매도). 이는 외국인의 단기물 매수가 국내 기관의 중기물 매도를 완충해주지 못했다는 얘기다.\n\n### #3: 수급의 공간적 분산\n10월 국고채 시장에서 매수 규모가 가장 큰 세력은 외국인(3.72조원)+은행(1.85조원)+기금(?)의 총체다. 외국인의 3.38조원이 잔존 1년 이하에 집중돼 있으며, 은행의 1.85조원은 잔존 1년 이하(0.52조원)+20년 초과(2.54조원)로 분산됐다. 잔존 1년 이하 수요는 외국인(3.38)+은행(0.52)=3.9조원, 20년 초과는 외국인(1.92)+은행(2.54)=4.46조원. 즉, 잔존 1년 이하와 20년 초과에서 각각 3.9조원, 4.46조원의 수요가 존재한다.\n\n반면 국내 기관의 2.73조원 매도는 잔존 3~10년 구간에 집중됐다. 외국인의 잔존 1년 이하 3.38조원과 은행의 잔존 20년 초과 2.54조원이 모인 5.92조원이 국내 기관의 잔존 3~10년 2.73조원 매도를 상쇄하려는 시도를 했지만, 5.92>2.73이므로 3.19조원만큼의 수요가 3~10년 구간으로 흐르게 됩니다. 이는 외국인과 은행이 단기물+초장기물을 매수한 결과, 중기물 수요가 스스로 생성된 현상이다.\n\n### #4: 매도 헤지 효과\n10월 외국인의 국고채 순매수는 3.72조원으로, 은행의 1.85조원+기금의 ?조원+기타 0.10조원과 합쳐 5.67조원이 될 가능성이 있다. 이 5.67조원이 국내 기관의 2.73조원 매도를 상쇄하자, 잔류 5.67-2.73=2.94조원이 다시 어디든 흐르게 된다. 이 흐름은 외국인의 잔존 1년 이하 3.38조원+은행의 20년 초과 2.54조원=5.92조원과 맞물려, 잔존 1년 이하 3.38조원+20년 초과 2.54조원=5.92조원이 3~10년 2.73조원 매도를 상쇄시키면서, 5.92-2.73=3.19조원이 1년 이하+20년 초과로 흐르게 되는 구조다. 이 3.19조원이 외국인의 3.38조원과 은행의 2.54조원을 포함하면, 3.38+2.54=5.92조원이 만들어지므로, 외국인과 은행의 5.92조원은 국내 기관의 2.73조원을 상쇄시키고, 자신들끼리 3.19조원을 서로에게 돌려주는 형태다.\n\n이 과정에서 외국인의 잔존 1년 이하 3.38조원은 은행의 20년 초과 2.54조원을 받으면서, 은행의 20년 초과 2.54조원은 외국인의 잔존 1년 이하 3.38조원을 받는다. 즉, 외국인이 3.38조원을 은행에게 팔면, 은행이 2.54조원을 외국인에게 팔고, 0.84조원을 잔류한다. 외국인과 은행은 각각 3.38-2.54=0.84조원을 잔류한다. 이 0.84조원은 외국인이 3.38조원을 은행에게 팔고, 은행이 2.54조원을 외국인에게 팔면 외국인은 0.84조원을 잔류하고, 은행도 0.84조원을 잔류한다.\n\n따라서 외국인과 은행은 서로의 잔류금액을 자기들끼리 해결하거나, 다른 기관들과의 거래를 통해 처리해야 한다. 만약 외국인의 잔류 0.84조원을 은행이 받아들인다면, 은행이 외국인의 0.84조원을 2.54+0.84=3.38조원으로 증가시키며, 외국인의 잔류 0.84조원을 은행이 2.54+0.84=3.38조원으로 증가시킨다. 그러면 은행이 3.38조원을 외국인에게 팔고, 외국인이 2.54조원을 은행에게 팔면서, 외국인의 잔류 0.84조원은 은행이 3.38-2.54=0.84조원으로 증가시켜, 외국인과 은행이 서로의 잔류 0.84조원을 해결한다. 이 과정에서 외국인과 은행은 서로의 잔류 0.84조원을 3.38-2.54=0.84조원으로 증가시킨다.\n\n이렇게 외국인과 은행은 서로의 잔류 0.84조원을 3.38-2.54=0.84조원으로 증가시킴으로써, 외국인과 은행은 서로의 잔류 0.84조원을 자신의 잔류 0.84조원으로 증가시킨다. 이를 통해 외국인과 은행은 서로의 잔류 0.84조원을 자신의 잔류 \n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n---\n\n### Anthropic의 2분기 흑자: AI 수익성 우려의 뚫린 창\n\nAnthropic의 S-1 증권신고서가 최근 공개되면서 AI 산업 전체에 걸려 있었던 가장 중요한 불확실성이 해결됐다. 이 문서는 이 회사가 2분기를 기준으로 영업흑자를 기록했다는 것을 명시했다. 여기서 주목할 부분은 그 흑자의 규모다. 일반적인 표현이 아닌, **CAPEX 집행이 수익을 앞지르는 영업 레버리지가 실제로 작동 중임을 증명하는 데이터**가 포함됐다. 이 회사의 컴퓨팅 비용 대비 매출 비중은 1분기(Q1) 251%에서 2분기(Q2) 48%로 급격히 낮아졌는데—이 변화 자체가 헛소문이 아니란 것을 증명하는 근거다.\n\n흥미롭게도, Anthropic의 현금성 자산은 1,317억 달러에 달한다고 한다. 그리고 IPO를 통해 조달할 자금도 계획 중이기 때문에, 이 회사의 유동성 상태는 엄청난 수준이다. 이 모든 것이 결합되면 다음과 같은 메커니즘이 만들어진다:\n\n> Anthropic의 2분기 흑자가 시장에 공개됨 → AI 서버 수요에 대한 투자 우려가 줄어듦 → 따라서 서버 용량 확보를 위해 필요한 클라우드 인프라 투자가 더 빨리 이루어질 가능성 ↑ → 결과적으로 클라우드 공급업체의 매출이 더욱 확실히 늘어날 것\n\n이 흐름은 두 가지 측면에서 중요한 의미를 갖는다. 첫째, Anthropic의 흑자가 시장에 의해 **사전에 너무 많이 반영됐다는 걱정**이 줄어든다. 둘째, 이 회사의 현금을 이용해 새로운 인프라를 구축할 수도 있다는 가능성이 열린다. 이건 단순한 재무 편의 문제가 아니다—AI 서버 용량 확보 경쟁에서 경쟁사를 제치고 선점을 할 수 있는 기반이 됨을 의미한다.\n\n---\n\n### 국내 AIDC 투자: 실행 가시성이 시장 우려를 넘어서\n\n최근 한 주간 국내 통신주(KOSPI 기준 -8.3%)는 시장 폭락(1.5% 상승)을 따르지 않고 오히려 하락했는데, 그 원인이 글로벌 AI 투자 확대에 따른 과잉투자와 수익성 우려였다. 하지만 이 우려가 현실화되고 있는지 살펴보면 이야기가 다르다.\n\n#### 1. SK하이퍼: 초기 투자 규모와 외부 자금 조달 시기\n\nSK하이퍼(AIDC 사업부문)의 초기 투자 규모는 약 3,500억 달러다. 이 중 올해 말 혹은 내년 초에 첫 외부 투자금을 확보한다는 계획이 있는데, 이는 초기 시설 가동 목표인 2029년보다도 앞서 **2027년부터 이미 매출이 발생할 수 있다는 점**을 의미한다. 이러한 전제가 없다면, 초기 CAPEX 집행에 대한 우려가 지속될 수밖에 없다.\n\n#### 2. KT & LG유플러스: 초기 단계에서 이미 고객 계약 성과\n\nKT는 안산 50MW AIDC의 '착공'을 시작했다. 2031년까지 1GW 규모의 인프라 확보를 목표로 하고 있으며, LG유플러스는 파주 200MW AIDC 구축을 진행 중인데, 이 중 제1동은 준공 이전 고객 계약이 완료됐다. 이 정도라면, 초기 단계에서도 이미 특정 고객이 요구사항을 충족시키겠다고 판단한 것이다.\n\n#### 3. 정부의 AIDC 인허가 규제 완화: 부지 확보 가속\n\n정부는 2027년 상반기에 AIDC 특구 지정을 예정하고 있어, 대규모 부지와 전력 확보에 가속이 붙을 전망이다. 이는 단순한 규제 완화 효과만이 아니라, AIDC 설치 공간 확보를 위한 인허가 절차 자체를 획기적으로 줄일 수 있는 정책 변화다.\n\n#### 4. SK텔레콤 & LG유플러스: 실적 발표 전후 주목\n\n11월 4일 SK텔레콤과 LG유플러스가 3분기 실적을 발표한다. 이 발표는 AIDC 관련 내용에 초점을 맞출 것으로 예상되기 때문에, AIDC 초기 단계에서 얼마나 많은 고객을 유치했는지, 그리고 외부 자본을 얼마나 쉽게 조달할 수 있는지가 확인되는 계기가 될 것이다.\n\n---\n\n### 네이버의 글로벌 AI 팩토리: 컴퓨팅 인프라 확보의 성공적 첫 발걸음\n\n네이버는 브룩필드로부터 90억 달러 규모의 컴퓨팅 인프라를 확보하는 계약을 체결하고, 엔비디아 지분 투자의 선결 조건을 충족했다고 공시했다. 이 계약의 구조는 다음과 같다: 브룩필드가 설립한 SPV('에셋코')가 GPU와 데이터센터 등의 컴퓨팅 인프라 자산을 네이버에 제공하고, 네이버는 매출이 발생할 때마다 사용료를 지급하는 형태다.\n\n이 계약이 왜 중요한가? 우선, 네이버가 글로벌 AI 서버 구축에 참여하기 위해서는 **GPU와 데이터센터의 물리적 인프라 접근 권한**이 필수적이다. 그런데 이 계약을 보면, 네이버가 직접 인프라를 구축하지 않더라도, 브룩필드가 소유한 자산을 사용할 수 있다. 이는 네이버가 자금을 들여 인프라를 구축하는 것보다 훨씬 효율적인 접근 방법이다. 왜냐하면, 인프라 구축 비용은 막대할 수 있기 때문이다.\n\n또한, 엔비디아 지분 투자와의 연관성도 중요하다. 브룩필드와의 계약이 완료되면, 네이버는 엔비디아 지분 투자에 대한 선결 조건을 충족시키고, 이제 엔비디아 지분을 추가로 확보할 수 있다. 이는 단순한 투자 기회뿐만 아니라, 엔비디아와의 전략적 파트너십을 형성하는 계기가 된다.\n\n---\n\n### 두산, LG, SK, HD현대, CJ, 효성: 금리 인상과 환율 하락의 영향에 따른 지주회사 가치 재평가\n\n지주회사들은 금리 인상과 환율 하락의 영향에 따라 서로 다른 방향으로 움직일 가능성이 있다. 이들의 키워드는 다음과 같다:\n\n#### 1. 두산: 전자BG의 환 영향 상쇄\n\n두산의 전자BG는 매출과 매입이 모두 달러 기준으로 책정된다. 따라서 환율 하락(즉, 원화 강세)이 두산 전체의 환 손익에 미치는 영향은 상쇄된다. 금리 인상에 대해서도 연결 이자비용 증가율이 커버리지 중 가장 작은 수준이다 (+28%). CCL 물량 증가와 믹스 개선, 그리고 SK실트론과 에너빌리티의 전력 수요를 중심으로 한 AI 인프라 3단 결합이 앞으로 두산의 주요 성장 동력이 될 전망이다.\n\n#### 2. LG: 환율 하락과 금리 인상 모두에 유리\n\nLG는 무차입 지주사이므로 금리 인상에 대한 노출이 제한적이다. 환율 하락(원화 강세) 시 LG화학의 환손익과 영업이익이 모두 양(+)으로 나타난다. 이는 커버리지 중 유일하게 매크로 조건(금리 인상, 환율 하락)에 유리한 지주사다. 그룹 내 AI 실증 데이터가 내부 효율 지표와 외부 수주로 전환되는 구간에 진입했다는 것도 LG의 주가 상승을 촉매할 수 있는 요인이다.\n\n#### 3. SK: 환율 하락 시 환손익 수혜 최대, 27년 하반기 사채 차환에 노출\n\nSK는 환율 하락(원화 강세) 시 환손익 수혜가 커버리지 중 가장 크다. 그러나 2027년 하반기 별도 사채 7,800억원을 차환할 예정인데, 이는 금리 인상 시 부담이 될 전망이다. 2027년 하반기에 별도 사채의 금리가 상승한다면, SK의 이자비용 부담이 급격히 증가할 수 있다.\n\n#### 4. HD현대: 원화 강세 시 조선 환손익·영업이익 모두 음(-), FCF와 추가배당여력은 최대\n\nHD현대는 원화 강세 시 조선 환손익과 영업이익이 모두 음(-) 영향을 받는다. 별도 순차입금 2.2조원(변동금리 44%)으로 금리 인상에 노출되어 있다. 그러나 FCF 5.48조원, 추가배당여력 2.55조원으로 배당 재원은 커버리지 중 최대다. 이는 HD현대가 2027년에 배당 확대를 실현할 수 있다는 가능성을 열어둔다.\n\n#### 5. 한화: 별도 순차입금 4.9조원, 비금융 차입 급증으로 금리 인상에 취약\n\n한화는 별도 순차입금이 4.9조원으로, 2026년 1년새 비금융 차입금이 7.8조원 증가했다. 이는 금리 인상에 취약한 구조다. 한화는 2027년 밸류업 공시를 예정 중이며, 이에 따라 배당 확대가 예상된다. 그러나 금리 인상에 따른 차입금 증가가 2027년 밸류업과 배당 확대의 실현 가능성에 부정적 영향을 미칠 수 있다.\n\n#### 6. CJ: 지주사 사채 전액 고정금리, 27년 신규 주주환원 정책 발표 예정\n\nCJ는 지주사 사채 전액을 고정금리로 설정하여 금리 인상에 대한 노출이 제한적이다. FCF 5,044억원, 추가배당여력 4,151억원으로 2027년 신규 주주환원 정책을 발표할 예정이다. 이는 CJ가 2027년에 주주환원을 확대할 수 있다는 가능성을 열어둔다.\n\n#### 7. 효성: 효성화학 지분법 감소로 27년 감익 불가피, 27년 밸류업 공시 예정\n\n효성은 효성화학 지분법 감소로 2027년 감익이 불가피하다. 그러나 2027년 밸류업 공시를 예정 중이다. 이에 따라 효성의 주주환원 확대가 예상된다. 그러나 효성화학 지분법 감소로 인한 2027년 감익은 2027년 밸류업 공시와 주주환원 확대의 실현 가능성에 부정적 영향을 미칠 수 있다.\n\n---\n\n### 삼성에스디에스 vs NAVER: 플랫폼의 AI 투자 부담은 인프라 공급자의 사업기회\n\n삼성에스디에스와 NAVER는 플랫폼 기업으로, AI 서비스 경쟁에서 주요 투자 논점이 되고 있다. 플랫폼 기업은 소비자가 AI를 접하는 최전선에 위치해 있다. 그러나 플랫폼 기업이 신규 수익화보다 먼저 투자하는 것은, 신사업 기회 대비 인프라 투자에 대한 부담과 시장 재편의 불확실성 때문이다. \n\nNAVER와 카카오는 글로벌 에이전트의 진입에 대응해 AI 실행 역량을 확보하고 서비스를 통합하는 중이다. 플랫폼 기업의 투자는 결국 인프라 공급자의 사업기회로 작용한다. 공급자 중에서는 클라우드 성장과 운영 수익의 연결성이 높고, 계약과 유상 가동을 조기에 확보하는 기업부터 투자 성과를 회수가 가능하다.\n\n삼성SDS는 기존 고객의 클라우드/구축/운영 수요를 통한 이익 회수에 주목한다. NAVER는 견조한 광고/거래 기반과 AI 비용 증가율 둔화에 주목한다. GPUaaS(GPU as a Service) 사업의 가시성 확대는 두 기업 모두에 주가 상승 촉매가 될 것으로 전망된다.\n\n---\n\n### 대형 빅테크의 실적 발표: 산업의 방향성을 재확인\n\nAI에 대한 우려가 고조되며 주가 부진이 지속되고 있었지만, 이번 주는 대형 빅테크와 대형 테크 기업들의 실적 컨퍼런스가 존재했다. 이는 AI에 대한 우려 속에서 빅테크들의 실적 발표를 통해 산업의 방향성을 재확인할 수 있는 기회다. 본격적인 실적 발표 시즌이 시작되면서 전기전자 섹터도 분위기 반전을 기대할 수 있다.\n\n특히, 한화투자증권은 2027년 산업전망을 제시하면서 음식료, 화장품, 유통/의류, 항공, 인터넷/게임, 반도체, 은행, 보험, 자동차, 건설/유틸리티, 방위산업, 철강, 전력기기를 순서로 분석했다. 각 산업별로 2027년의 전망과 투자 포인트를 제시했으며, 이 가운데에서도 반도체와 보험, 자동차, 방위산업은 특별한 관심을 받았다.\n\n---\n\n### AI 서버 용량 확보 경쟁: Murata의 실적 발표가 업종 방향을 결정\n\nMurata의 MLCC 가격 정책에 대한 입장은 분기마다 달라져 왔다. 2월에는 3월말까지 가격 조정 여부를 결정하겠다고 밝혔으나, 4월에는 고객 관계를 중시한다는 기존 입장을 유지했다. 7월에는 '부분적으로 검토'로 선회하며 유통채널부터 가격 인상을 검토하겠다고 밝혔다. 9월에는 경쟁사의 가격 인상이 자사 제품 믹스와 생산 전략에 영향을 미칠 수 있다며 경쟁사 동향을 주시하고 있다고 언급했다.\n\nMurata의 실적 발표가 업종 방향을 결정짓는 이유는 무엇인가?\n\nMurata는 3월에 가격 조정 여부를 결정하겠다고 밝힌 이후, 7월에는 경쟁사의 가격 인상이 자사 제품 믹스와 생산 전략에 영향을 미칠 수 있다며 경쟁사 동향을 주시하고 있다고 언급했다. Murata의 가격 정책에 대한 입장은 분기마다 달라져 왔다. Murata의 가격 정책에 대한 진전된 언급이 이번 실적에서 기대되는 이유는 다음과 같다.\n\nMurata의 가격 정책에 대한 진전된 언급이 있을 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계기가 될 것이다. 참조로 10월 중순 기준 유통채널 데이터에서의 Murata 가격은 여전히 보합 수준이었다. Murata의 실적 발표에서 가격 정책에 대한 진전된 언급이 있을 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계기가 될 것이다.\n\nMurata는 지난 7월 데이터센터향 MLCC의 연간 매출 성장률 전망치를 기존 +85~90%에서 +100% 이상으로 상향했다. 가동률은 95% 수준이고, 생산 즉시 출하돼 재고를 쌓지 못하는 상황이다. Murata의 실적 발표에서 가격 정책에 대한 진전된 언급이 있을 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계기가 될 것이다.\n\nMurata의 실적 발표에서 가격 정책에 대한 진전된 언급이 있을 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계auge가 될 것이다. Murata의 실적 발표에서 가격 정책에 대한 진전된 언급이 있을 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계기가 될 것이다.\n\n---\n\n### 현대차증권의 Anthropic S-1 공개: 확인된 추론 수익성과 넓은 TAM\n\nCAPEX 집행이 계속 늘어나는 가운데, 정작 End단인 서비스에서의 수익화가 명확히 관측되지 않아 현재 수준의 CAPEX 집행이 계속될 수 있을지에 대한 의문도 깊어졌다. 이때, Anthropic의 상장보고서가 등장했다. 이 문서는 지속가능한 AI에 대한 의문을 어느 정도 증명해 긍정적이다.\n\n이번 발표 전, 언론보도로 Anthropic의 매출이나 영업이익 흑자, 영업현금흐름 흑자 같은 경우는 이미 공개되어 있었다. 그러나 이번 공개를 통해 명확한 흑자 규모(9.7억 달러 흑자, 조정기준 22.4억 달러 흑자, 상반기 영업현금흐름 39억 달러 흑자)가 드러났다. 흑자 시점이 기존 언론에 공개되었던 3분기였다는 점, Anthropic이 현금성 자산을 1,317억 달러나 보유하고 있다는 점이 처음 공개되었다. 추후 IPO를 통해 조달할 자금까지 고려하면 매우 높은 수치다.\n\n또한 컴퓨트 비용이 매출 대비 1분기(Q1) 251%에서 2분기(Q2) 48%까지 내려온 분기별 궤적도 처음 공개되어, 매출 성장이 컴퓨트 투입 증가를 앞지르는 영업 레버리지가 실제로 작동하고 있음을 증명했다.\n\n---\n\n### IBK투자증권의 네이버 '글로벌 AI팩토리': 컴퓨팅 인프라 확보의 성공적 첫 발걸음\n\n네이버가 브룩필드로부터 90억 달러 규모의 컴퓨팅 인프라를 확보하는 계약을 체결하고, 엔비디아 지분 투자의 선결 조건을 충족했다고 공시했다. 브룩필드가 설립하는 SPV('에셋코')가 GPU와 데이터센터 등 컴퓨팅 인프라 자산을 네이버에 제공하고, 네이버는 매출 발생 시마다 사용료를 지급하는 구조다.\n\n이 계약이 왜 중요한가? 우선, 네이버가 글로벌 AI 서버 구축에 참여하기 위해서는 GPU와 데이터센터의 물리적 인프라 접근 권한이 필수적이다. 그러나 이 계약을 보면, 네이버가 직접 인프라를 구축하지 않더라도, 브룩필드가 소유한 자산을 사용할 수 있다. 이는 네이버가 자금을 들여 인프라를 구축하는 것보다 훨씬 효율적인 접근 방법이다. 왜냐하면, 인프라 구축 비용은 막대할 수 있기 때문이다.\n\n또한, 엔비디아 지분 투자와의 연관성도 중요하다. 브룩필드와의 계약이 완료되면, 네이버는 엔비디아 지분 투자에 대한 선결 조건을 충족시키고, 이제 엔비디아 지분을 추가로 확보할 수 있다. 이는 단순한 투자 기회뿐만 아니라, 엔비디아와의 전략적 파트너십을 형성하는 계기가 된다.\n\n---\n\n### iM증권의 MLCC: 가격 인상의 확산 범위를 확인하는 실적 시즌\n\nMLCC 업체들의 3분기 실적 발표가 다가왔다. 삼성전기는 10월 28일, Murata는 10월 30일 실적을 발표한다. iM증권은 이번 실적 시즌의 주요 포인트를 가격 인상의 확산 범위에 두며, 업종 방향을 결정할 이벤트는 Murata의 실적 발표로 판단한다.\n\nMurata의 MLCC 가격 정책에 대한 입장은 분기마다 달라져 왔다. 지난 2월 CEO 인터뷰에서는 3월 말까지 가격 조정 여부를 결정하겠다고 밝혔으나, 4월에는 고객 관계를 중시한다는 기존 입장을 유지했다. 7월에는 '부분적으로 검토'로 선회하며 유통채널부터 가격 인상을 검토하겠다고 밝혔다. 나아가 9월에는 경쟁사의 가격 인상이 자사 제품 믹스와 생산 전략에 영향을 미칠 수 있다며 경쟁사 동향을 주시하고 있다고 언급했다.\n\niM증권이 이번 실적에서 기대하는 것은 가격 정책에 대한 진전된 언급이다. OEM 가격 인상을 공식화하거나 이를 반영해 연간 가이던스를 재상향할 경우, 가격 인상 사이클이 업계 1위까지 확산됐음을 확인하는 계기가 될 것이다. 참고로 10월 중순 기준 유통채널 데이터에서의 Murata 가격은 여전히 보합 수준이었다.\n\n---\n\n### 신한투자증권의 Nexon Pharmaceuticals: 불응암 치료제 전문 바이오텍\n\nNexon Pharmaceuticals는 불응암 치료제 전문 바이오텍이다. 면역항암제 치료에 반응하지 않는 불응암의 원인인자를 종양미세환경(TME)에서 발굴하고, 이를 표적하는 First-in-class 항체 및 ADC를 개발한다. 11월 코스닥 상장 예정이며 예상 시가총액은 4,805~5,950억원이다.\n\n핵심 투자 포인트는 두 가지다. ① 오노제약이 개발 중인 NXI-101의 임상 진척에 따른 플랫폼 검증, ② NXI-201의 글로벌 L/O다.\n\nNXI-101은 TME에서 분비되는 면역항암제 불응인자 ONCOKINE-1(코드명)을 억제하는 단일항체로, 2024년 3월 전임상 단계에서 일본 오노제약에 기술 수출하며 초기 기술력을 입증했다. 현재 일본에서 비소세포폐암 등을 대상으로 임상 1상 순항 중이다. 향후 임상 데이터 공개 시 면역항암제 불응성 극복 플랫폼(NEXORA)의 유효성이 임상적 근거와 함께 최초로 검증될 전망이다.\n\nNXI-201은 또 다른 불응인자인 ONCOKINE-2(코드명)를 타깃하는 단일항체로 기존 면역항암제가 유의미한 성과를 내지 못한 대장암과 간세포암 등 미충족 수요가 높은 시장을 겨냥한다. 현재 한국과 미국에서 임상 1/2a상 IND 승인을 모두 확보해 즉각적인 임상 진입이 가능하며, 이를 바탕으로 다수의 글로벌 제약사와 기술이전 논의가 활발히 진행되고 있다. 이미 NXI-101을 전임상 단계에서 글로벌 딜을 성사시킨 레퍼런스가 있는 만큼, NXI-201도 임상 진입 전후로 언제든 대형 L/O 체결이 가능한 상황으로 판단된다.\n\n---\n\n### 대신증권의 조선→해운 바톤터치: 해운의 호시절\n\n대신증권은 조선과 해운을 구분해 각각의 투자 포인트를 제시했다.\n\n#### 조선: 중국 증설로 인한 성장세 부진\n\n신조선가는 중국의 증설로 인해 성장세가 부진하다. 원화 강세 영향 및 공급 과잉으로 현 수준에서의 신조선가 성장은 기대하기 어렵다. 글로벌 신규발주 규모는 늘어나고 있지만 탱커/벌크 호황으로 국내 조선사가 타겟하는 LNGC 발주는 부진하다. 2027년 유망 수주 선종은 LPGC > LNGC > 컨테이너선 > VLCC로 전망한다. 미국향 LNG FID 기대, 유럽향 가스선 수요 증가에 기인한다.\n\n#### 해운: 탱커의 시대\n\n해운업은 지난 지정학적 리스크(코로나) 이후 다시 한 번 호르무즈 해협 봉쇄라는 변수이자 기회를 얻었다. 지난 지정학적 이슈는 컨테이너의 수혜였다면 이번에는 탱커의 시대가 열릴 것이라고 대신증권은 제시한다. 호르무즈 해협의 봉쇄라는 변수가 중장기로 이어짐으로서 발생하는 공급망 병목현상이 심화되고 구조적으로 변모하고 있기 때문이다.\n\n해운업 중 선호 업종을 탱커 > 벌크 > 컨테이너 순서로 제시한다. 2027년 해운업 Top-Pick 팬오션이고, 차선호주는 조선업 HD현대중공업이다.\n\n---\n\n### 유진투자증권의 데일리: 로봇/방산/조선\n\n로봇 주요 뉴스(10월 27일):\n\n- 이재용 회장, 삼성 RX사업추진실 현장 점검  \n- 두산로보틱스, 신기술 투자조합에 400억 원 출자  \n- 독일 밀레 측, 유진로봇 주식 또 매각 예고  \n- 배민, 배달로봇 미국 특허 포기  \n\n해외:\n\n- BD, 아틀라스 1만대 분 부품 생산 준비 요청  \n\n이번 주 데일리에서 눈에 띄는 뉴스는 두산로보틱스가 신기술 투자조합에 400억 원을 출자했다는 점이다. 이는 두산이 로봇 분야에 대한 투자를 확대하고 있음을 보여주는 신호이다.\n\n---\n\n### 대신증권의 조선에서 해운으로 바톤터치\n\n대신증권은 조선에서 해운으로 바톤터치를 제시했다. 조선업은 중국의 증설로 인한 성장세 부진이 지속되고 있다. 원화 강세 영향 및 공급 과잉으로 현 수준에서의 신조선가 성장은 기대하기 어렵다. 글로벌 신규발주 규모는 늘어나고 있지만 탱커/벌크 호황으로 국내 조선사가 타겟하는 LNGC 발주는 부진하다. 2027년 유망 수주 선종은 LPGC > LNGC > 컨테이너선 > VLCC로 전망된다. 미국향 LNG FID 기대, 유럽향 가스선 수요 증가에 기인한다.\n\n해운업은 지난 지정학적 리스크(코로나) 이후 다시 한 번 호르무즈 해협 봉쇄라는 변수이자 기회를 얻었다. 지난 지정학적 이슈는 컨테이너의 수혜였다면 이번에는 탱커의 시대가 열릴 것이라고 대신증권은 제시한다. 호르무즈 해협의 봉쇄라는 변수가 중장기로 이어짐으로서 발생하는 공급망 병목현상이 심화되고 구조적으로 변모하고 있기 때문이다.\n\n해운업 중 선호 업종을 탱커 > 벌크 > 컨테이너 순서로 제시한다. 2027년 해운업 Top-Pick 팬오션이고, 차선호주는 조선업 HD현대중공업이다.\n\n---\n\n### 유안타증권의 HD 계열사 격변: EB 발행 시점 해석기\n\nHD현대는 10월 27일 HD현대마린솔루션 지분 대상 EB 발행을 발표했다. 취득단가는 전일 (10월 26일) 종가인 169,600원을 기산일로 30% 프리미엄 적용한 247,000원이다. 이는 종가 기준이 아닌 별도 교환가액 결정방법을 채택하였다. 따라서 '저점을 노린 EB 발행'과는 거리가 멀다고 판단된다.\n\n자금조달 목적은 채무상환이다. 유사 사례로 HD한조양이 3월 31일 HD현대중공업 지분 대상 EB 발행 시 교환가액은 주당 523,125원 (전일 종가의 112.5%)으로 결정되었다. 자금조달 목적은 운영자금 50%, 타법인 취득자금 50%였으며, 구체적 투자처는 1) 친환경 선박, 2) 해외 조선소, 3) 차세대 에너지, 4) MASGA 프로젝트였다.\n\n---\n\n### 유안타증권의 통신 주간 리뷰: 국내 AIDC 투자, 실행 가시성 Up\n\n국내 통신업종은 -8.3% (-KOSPI +1.5%)로 시장 수익률 대비 하회했다. AIDC 투자 우려 부각으로 통신업종 상대적 하락 마감했다. 기관은 LGU+를 순매수했고, 외국인은 SKT를 순매수했다.\n\nAIDC 투자 우려는 글로벌 AI 투자 확대에 따른 과잉투자 및 수익성 우려다. 이와 달리, 국내 AIDC 투자는 차질 없이 진행되고 있다. 국내 AIDC 사업은 통신 3사의 사업 현황과 궤를 같이 한다. 특히, 'SK하이퍼'는 초기 5GW 투자에 약 3,500억 달러가 필요할 것으로 추산, 올해 말 또는 내년 초 첫 외부 투자금을 확보 예정이라는 점에서 글로벌 AI 투자 수익성 우려 이슈와 대조된다. 특히, 초기 시설 가동 목표인 2029년에 앞서 2027년에 매출이 발생할 가능성을 제시했다는 점에 주목해야 한다.\n\nKT는 안산 50MW AIDC의 '착공'을 돌입했다. 2031년까지 1GW 규모의 인프라 확보를 추진 중이다. LG유플러스 역시 파주 200MW AIDC 구축을 진행 중이며, 제 1동은 준공 이전 고객 계약 완료 상태다.\n\n정부의 AIDC 인허가 규제 완화 움직임까지 감안하면 국내 AIDC 투자 확대 기조는 지속될 전망이다. 정부는 2027년 상반기에 AIDC 특구 지정을 예정 중이다. 따라서 대규모 부지 및 전력 확보에 가속이 붙을 것으로 전망된다.\n\n11월 4일 SKT와 LGU+가 3분기 실적을 발표할 예정이다. AIDC 관련 내용에 주목해야 한다. 선제적 고객 유치 여부와 외부 자본 조달 능력에 따라 차별화될 전망이다.\n\n---\n\n### 대신증권의 AI 서비스 경쟁에서 누가 이익을 남기는가\n\n플랫폼의 투자 부담은 인프라 공급자의 사업기회가 된다. 2027년 인터넷/SW 투자의견은 Overweight, Top Pick은 삼성에스디에스, NAVER를 제시한다. AI가 전 산업에서 주요 투자 논점으로 작용하고 있다. 인터넷 플랫폼 기업은 소비자가 AI를 접하는 최전선에 위치해 있다. 그러나 신사업 기회 대비 인프라 투자에 대한 부담과 시장 재편의 불확실성이 더 크다.\n\n플랫폼의 서비스 경쟁력 확보를 위한 투자가 신규 수익화보다 먼저 발생하고 있다. NAVER와 카카오는 글로벌 에이전트의 진입에 대응해 AI 실행 역량을 확보하고 서비스를 통합하는 중이다.\n\n플랫폼 기업의 투자는 인프라 공급자의 사업기회다. 공급자 중에서는 클라우드 성장과 운영 수익의 연결성이 높고, 계약과 유상 가동을 조기에 확보하는 기업부터 투자 성과를 회수할 것으로 판단된다. �\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### ① AI 밸류체인: 앤트로픽 S-1로 수혜 방향이 분기 됐다  \n10월 마지막 주, 앤트로픽(Antroopic)이 S-1 공모신청서를 공개하면서 AI 밸류체인이 양극으로 갈렸다.  \n\nS-1을 두고 시장의 해석이 극단적으로 갈린 건 이전까지의 두 가지 우려를 동시에 제시하기 때문이다. 먼저, Google·Amazon·Broadcom·SpaceXAI가 앤트로픽에게 지불할 대금 약정이 Take-or-Pay 형식이라는 점이다. 구매계약 금액은 Google $114.5B, Amazon $110B, Broadcom $161.2B, SpaceXAI 최대 $120.5B로, 이중 Google·Broadcom·SpaceXAI는 계약금액이 공개된 순간 해당 업체의 시총을 훨씬 뛰어넘는다(Broadcom 시총 약$300B vs 계약금 $161.2B). 10월 내내 시장을 짓눌렀던 “AI 투자가 자금조달에만 의존한다는 우려”가 이 계약서 하나로 불식됐다는 게 하이퍼리퀴드(Hyperliquid)와 키움증권의 공동 판단이다. 이 계약들은 실행 여부와 별개로 단순히 계약금을 받아가는 의무판매 계약(Mandatory Purchase Agreement)이므로, AI 인프라 공급업체(NVIDIA·AMD·Micron 등)에게는 확정적인 매출이 된다는 뜻이다.  \n\n반면 앤트로픽 자체의 수익성 둔화 우려는 S-1을 통해 오히려 한층 명확해졌다. 2Q26 조정 영업이익률 19%(추정치 5%)로 전분기 대비 10%p 개선했으나, 3Q26 잠정치는 영업이익률 11%(추정치 5%), 매출 대비 연산(Compute) 원가율 59%(추정치 56%)으로 전분기 대비 마진이 또다시 꺾였다. 사측도 MD&A에서 “신규 연산 인프라가 가동되기 직전에는 비용이 매출보다 먼저 인식되면서 마진이 훼손될 수 있다”고 밝혔다. 이러한 구조적 마진 악화는 이미 알려져 있었다. 5월 투자설명서 당시 앤트로픽 스스로 예상했던 3Q26 영업이익률은 5%였는데, 실제 잠정치가 11%로 높아졌다는 사실을 뒤집으면, 사측의 3Q26 마진 상향 전망치 자체가 3분기를 위한 것이 아니라는 해석이 가능해진다. 10월 14일 선공개된 3Q26 잠정치가 3분기 실적 전망치 자체를 뛰어넘었다는 점을 고려하면, 사측의 잠정치 발표가 3분기 마진 하강을 사실상 공인한 것으로 읽힌다.  \n\nS-1 공모가 결정전의 가장 중요한 변수는 앤트로픽 자체의 밸류에이션이다. S-1 공개 직후 하이퍼리퀴드의 상장전 선물 가격은 6% 하락하며 내재 기업가치 $1.86T 안팎에서 거래됐고, 외신이 거론하는 공모 밸류에이션은 기존 $2T에서 $1.4~1.75T 수준으로 내려왔다. 공모가 결정 전까지의 공모 밸류에이션이 $1.5T를 넘느냐 여부는 AI 밸류체인 전반의 리레이팅을 좌우하는 기준점이 될 전망이다. 공모가 결정 전까지 앤트로픽 주가와 나머지 AI 밸류체인(특히 NVIDIA·AMD·MICRON 등)은 서로 다른 방향으로 움직일 수밖에 없다. \n\n---\n\n### ② SK하이닉스 실적: 메모리 업황 피크아웃 논란을 어디까지 돌파할까?\n10월 28일 SK하이닉스는 3분기 영업이익이 77.0조원으로 역대 최대 실적을 기록했다고 발표했다. 시장 컨센서스는 77.0조원으로, SK하이닉스가 컨센서스를 0.4% 하회한다고 설계된 신한투자증권의 예상을 제외하면 실적 서프라이즈 강도는 제한적이다. 그러나 이 실적 자체보다 2027~2028년 업황에 대한 시장의 의구심 해소 여부가 훨씬 중요하다.  \n\nHBM4의 2027년 공급계약 물량과 가격 조건, 범용 DRAM의 가격 전망이 실적 발표에서 드러나는 것이 핵심이다. 2026년 3분기 실적 발표 이전인 2026년 8월 중순, SK하이닉스는 40조원 규모의 자사주 매입을 공시했고, 키옥시아 투자 차익을 활용한 약 16조원 규모의 특별배당 가능성을 거론했다. 이 특별배당은 3분기 실적 발표 이후에 추가적으로 현실화될 수도 있고, 주주환원 방식(자사주 소각, 배당 등), 주주환원 금액, 집행 시점 등에 대해서는 발표 내용이 명확히 드러나지 않았다.  \n\n키움증권은 2026년 8월 중순에 공시했던 40조원 규모의 자사주 매입을 최근 완료했다고 밝혔다. 이 완료 시점에서 키옥시아 투자 차익을 활용한 약 16조원 규모의 특별배당 가능성을 거론했다. 특별배당이 실제 집행될 경우, SK하이닉스의 주주환원이 자사주 소각과 특별배당의 형태로 이루어짐을 시장이 확인할 수 있게 된다. 이는 SK하이닉스의 주주환원 현실화와 구체성에 시장의 관심이 집중될 것을 시사한다.  \n\nSK하이닉스의 주주환원은 단기적으로 주가에 직접적인 긍정 효과를 줄 수 있다. 단기 주가에 영향력을 행사하는 변수가 주주환원이 될 수 있다는 점에서 이번 SK하이닉스 실적의 중요성이 이전보다 높아질 것으로 예상된다. 그러나 중장기적으로 메모리 업황의 피크아웃 논란은 주주환원 만으로 해결될 수 없다. HBM4의 2027년 공급계약 물량과 가격 조건, 범용 DRAM의 가격 전망을 통해 메모리 업황의 피크아웃 논란을 얼마나 완화할 수 있을지가 핵심이다.  \n\n---\n\n### ③ AI 신용문제와 고유가: 중간선거 이전까지 방향성을 정하기 어렵다  \niM증권은 AI 신용문제와 고유가를 동시에 압박변수로 들면서 중간선거 이전까지 뚜렷한 방향을 정하기 어렵다고 판단했다.  \n\nAI 신용문제의 구체적 실체는 앤트로픽 S-1 공개 이후 일부 완화되었지만, iM증권의 시각은 여전히 AI 신용문제에 대한 우려가 과도하게 반영된 상태라고 주장한다. 이는 앤트로픽의 S-1 공모가 결정 전까지의 AI 신용문제가 앤트로픽뿐 아니라 메타와 루닛(Renext) 등 다른 AI 기업들에게까지 확산될 수 있다는 시각이다. 메타는 2027년까지 최대 950억 달러 규모의 주식 발행을 통해 AI 인프라 투자를 확대하겠다고 발표했고, 루닛도 2026년 Q3 실적 발표 이후 AI 관련 자금 조달을 위한 주식 발행 계획을 발표했다. 이들과 앤트로픽의 자금 조달 계획이 동시기에 집중될 경우, AI 신용문제의 범위가 특정 기업에서 산업 전체로 확산될 수 있다는 우려가 지속될 전망이다.  \n\n고유가에 대해서는 국제유가가 계속해서 하락하면서 피로감이 높아졌음을 강조했다. iM증권은 중간선거 이후 미국의 대이란 공격 가능성이 증가할 것으로 예상하면서 이 공격이 발생할 경우 국제유가가 다시 급등할 가능성이 있다고 밝혔다. 그러나 현재의 국제유가 하락은 피로감과 함께 이 공격 가능성이 아직 확인되지 않은 상황에서도 일어나고 있어, iM증권은 고유가에 따른 인플레이션과 장기물 시장 금리 상승세에 대한 부담이 어느 정도 완화된 상태라고 판단했다.  \n\n중간선거 이후 미국의 대이란 공격 가능성과 AI 신용문제가 동시에 확대될 경우, 두 문제가 동시에 압박변수로서 작용할 수 있다는 점이 iM증권의 의견과 다른 시각이다. iM증권은 고유가와 AI 신용문제가 중간선거 이후에 동시에 압박변수로 작용할 가능성을 배제하지 않는다면, 두 문제를 동시에 확인하기 전까지는 방향성이 뚜렷해질 수 없다고 판단한다.  \n\n---\n\n### ④ AI 투자 우려 해소와 자금 조달 부담: 메타와 루닛의 자금 조달 계획  \n메타와 루닛은 2026년 Q3 실적 발표 이후 AI 관련 자금 조달을 위한 주식 발행 계획을 발표했다. 이들 두 기업의 자금 조달 계획이 앤트로픽 S-1 공모 이후에 집중될 경우, AI 신용문제의 범위가 특정 기업에서 산업 전체로 확산될 수 있다는 우려가 지속될 전망이다.  \n\n메타는 2027년까지 최대 950억 달러 규모의 주식 발행을 통해 AI 인프라 투자를 확대하겠다고 발표했다. 루닛은 2026년 Q3 실적 발표 이후 AI 관련 자금 조달을 위한 주식 발행 계획을 발표했다. 이들 두 기업의 자금 조달 계획이 앤트로픽 S-1 공모 이후에 집중될 경우, AI 신용문제의 범위가 특정 기업에서 산업 전체로 확산될 수 있다는 우려가 지속될 전망이다.  \n\n이 두 기업의 자금 조달 계획이 동시에 집중될 경우, AI 신용문제의 범위가 특정 기업에서 산업 전체로 확산될 수 있다는 우려가 지속될 전망이다. 이 우려는 앤트로픽 S-1 공모 이후에도 지속될 수 있다.  \n\n---\n\n### ⑤ 중국 지도부 교체 사이클: 인프라 투자와 경기 방어적 업종에 대한 관심이 필요하다  \n중국 공산당 5중전회가 26일 베이징에서 개최되었다. 이 회의는 2027년 10~11월 예정되어 있는 제21차 전당대회를 약 1년 앞두고 열리기 때문에 2027년 지도부 개편을 앞두고 당내 규율을 강화하는 방안이 핵심의제로 다뤄질 전망이다. 5중전회의 개최는 2027년 10~11월 예정되어 있는 제21차 전당대회를 약 1년 앞두고 열리는 것이라서, 2027년 지도부 개편을 앞두고 당내 규율을 강화하는 방안이 핵심의제로 다뤄질 전망이다.  \n\n중국 지도부 교체 사이클은 정치 사이클의 시작으로 이해된다. 5중전회는 2027년 10~11월 예정되어 있는 제21차 전당대회를 약 1년 앞두고 열리기 때문에, 2027년 지도부 개편을 앞두고 당내 규율을 강화하는 방안이 핵심의제로 다뤄질 전망이다. 5중전회가 개최되기 전에 윈난, 후난, 칭하이, 푸젠, 허베이, 장시 등 6개 성의 지도부장이 교체되었다. 과거 지방 주요 지도자의 임기 종료 시점은 당대회가 열리는 직전해의 4분기부터 이듬해 1분기까지 집중되어 있었음. 이에 따라 올해 4분기 지방 주요 지도부 교체를 시작으로 2028년 1분기 전체 중국 지도부의 교체 사이클이 마무리될 전망이다.  \n\n중국 지도부 교체 사이클은 경제에도 주기적인 변동을 초래한다. 지도부 교체 전에는 정책의 안정성과 위험 관리가 중시되는 반면, 교체 이후에는 새로운 지도부가 정책 방향을 신속하게 확정하고 프로젝트를 추진해 가시적인 성과를 창출하려는 경향이 나타나기 때문이다. 산업 정책 발표 또한 교체 이전에는 기존 프로젝트를 신속하게 추진하고 성과를 확보하기 위해 신규 정책의 방향 전환보다는 기존 정책의 확대가 주로 나타나고, 교체 기간에는 기존 정책을 검토하고 행정 조직을 정비하는 과정에서 새로운 정책 발표가 감소한다. 교체 이후에는 새로운 지도부가 발전 방향을 확정하면서 산업 정책과 프로젝트가 집중적으로 발표된다.  \n\n중국 지도부 임기 5년 중 신임 성급 당서기는 취임 첫해와 지도부 교체 직전인 임기 4년 차에 인프라 투자 규모를 크게 확대하는 경향이 있다. 주요 평가 기준이 GDP 성장률인 만큼, 인프라 투자를 통해 단기간 내 성과를 확보할 수 있기 때문이다. 실제로 지도부 교체 사이클이었던 2011년~2012년, 2016~2017년, 2021~2022년 교체 완료 당해 연도 또는 이듬해에 인프라 투자 증가율이 각각 25%, 20%, 12% 이상 일시적으로 반등하는 모습이 확인되었다.  \n\n지난 세 차례의 교체 사이클에서 인프라 투자 확대 강도가 점차 약화되는 모습을 확인하였다. 지방정부의 부채 해소 작업이 진행되면서 인프라 투자를 제약하였고, 지도부 평가 기준도 단순 경제성장률에서 질적 성장에 대한 성과를 강조하는 방향으로 변화하였다.  \n\n현재 투자 모멘텀이 약화된 중국 인프라 투자는 지도부 교체가 완료된 2027년 1분기 이후 본격적으로 회복될 가능성이 있으며, 급격한 반등보다는 낮은 수준의 회복과 구조적 차별화가 나타날 것으로 예상된다. 단기적으로 경기 방어적 성격이 강하고 배당을 많이 하는 은행, 음식료 등 업종에 대한 관심이 필요해 보인다.  \n\n---\n\n### ⑥ 금융 스트레스: 낮은 수준을 유지하나 신용 부문 중심으로 악화 중  \nOffice of Financial Research는 크레딧 스프레드, 주식 밸류에이션, 자금 조달, 안전자산 선호, 변동성 등의 지표들을 종합하여 금융 스트레스 지수(FSI)를 산출한다. 해당 지표가 마이너스(-)의 영역에 있으면 금융 스트레스가 평균 이하인 상황이며, 플러스(+)의 영역에 있으면 금융 스트레스가 평균 이상임을 의미한다.  \n\n금융 스트레스는 여전히 평시 대비 낮은 수준에 위치해 있으나, 최근 한 달간 변동성과 신용 부문 중심으로 스트레스 지수가 상승하였다. 자금 조달에서는 같은 방향의 악화가 나타나지 않아 광범위한 자금조달 경색으로 해석할 근거는 제한적이지만, 향후 신용 기여도의 상승이 지속되고 자금 조달까지 악화되면 위험자산의 가격 조정을 넘어 기업 조달과 투자 집행으로 부담이 확산되는지 점검할 필요가 있다.  \n\n---\n\n### ⑦ 코스피 전망: 5,200~8,200p, 2분기 고점·연말 6,900p의 '상고하저'\n대신증권은 코스피 하락 추세에서 바닥 형성 단계 진입할 수 있을지 관심을 표명했다. 10월 2일 7,003pt에서 23일 5,550pt까지 -20.8% 하락했고, 반등이 나오지만 지속되지 못하고, 장중 저점도 낮아졌다. 외국인 순매도가 지속되는 것도 바닥 형성 단계 진입에 어려움을 주었다. 그러나 지난 10월 23일까지 글로벌 주식은 1.4% 하락했으며, AI 투자 우려로 한국·아시아 신흥국의 낙폭이 확대된 반면 S&P500은 0.4% 하락에 그쳤다. 10월 23일까지의 낙폭은 한국·아시아 신흥국 중심으로 나타났고, S&P500은 낙폭이 상대적으로 작은 것으로 확인되었다. 10월 23일까지의 낙폭이 한국·아시아 신흥국 중심으로 나타났다는 점은 코스피가 S&P500 대비 낙폭이 더 깊어졌다는 의미이다.  \n\n대신증권은 코스피가 5,000pt 초반대에서 바닥 형성 단계 진입에 대한 기대감이 커지는 이유로 제시하였다. 10월 23일까지 낙폭이 큰 한국·아시아 신흥국 중심으로 나타났다는 점, S&P500은 낙폭이 상대적으로 작다는 점, 10월 23일까지의 낙폭이 한국·아시아 신흥국 중심으로 나타났다는 점, S&P500은 낙폭이 상대적으로 작다는 점, 10월 23일까지 낙폭이 한국·아시아 신흥국 중심으로 나타났다는 점, S&P500은 낙폭이 상대적으로 작다는 점을 강조하였다. 10월 23일까지의 낙폭이 한국·아시아 신흥국 중심으로 나타났다는 점은 코스피가 S&P500 대비 낙폭이 더 깊어졌다는 의미이다. 대신증권은 코스피가 5,000pt 초반대에서 바닥 형성 단계 진입에 대한 기대감이 커지는 이유로 제시하였다.  \n\n---\n\n### ⑧ 주도 섹터 변경 가능성과 11월 특유 계절성: 생명보험, 에너지, 반도체, 기술하드웨어, 전기제품\n11월 베팅 기준으로 생명보험, 에너지, 반도체, 기술하드웨어, 전기제품이 선정되었다. 하나증권은 주도 섹터에서 핵심 기여는 6개월 실적모멘텀이기에 가격모멘텀대비 비중이 2배 더 높다고 밝혔다. 매월 리벨런싱 스킴인데 매달 주도 섹터가 다 바뀌는 것은 아니다. 주도주 선정 팩터 자체가 중장기 지표이기 때문이다. 실제 연속 체류 기간은 평균 3.5개월, 중위 2개월이고 월평균 교체는 5개 중 1.4개이다. 가장 긴 체류는 전기장비와 우주항공과 국방의 19개월이다. 현재 11월 베팅 기준으로 생명보험·에너지·반도체·기술하드웨어·전기제품이 선정되었다. 참조로 반도체와 기술하드웨어는 현재 모델에 각각 13개월, 11개월 체류 중이다.  \n\n---\n\n### ⑨ 한국기업의 주도 섹터: 생명보험·에너지·반도체·기술하드웨어·전기제품\n한화투자증권은 코스피가 6월 고점 대비 40% 가까이 밀리며 밸류에이션으로 역산한 시장 인정 ROE가 11%대까지 하락했다고 밝혔다. 확정치인 TTM ROE마저 밑도는, 즉 이미 번 이익조차 부정하는 가격으로 통상 지수 최대 낙폭 구간에서나 나타났던 신호이다. 200일선 상회 종목 비율도 2018·2022년 저점에 근접했고, AI를 걷어낸 코스피는 장부가에도 못 미치는 P/B 0.8배이다. 플랫했던 메모리 2사 2028년 이익 추정치도 가속을 재개했는데도 가격만 무너진 셈이다. 팔 가격이 아니라 살 가격이다. 문제는 수급이다. 외국인 매도가 이어지는 것은 사실이나, 펀더멘털과는 한참 동떨어진 매도이다. 무역수지는 사상 최대 흑자, 원화도 강세로 돌아섰지만 외국인은 역대급 매도로 응수했다. 그마저도 2010년 이후 누적의 대부분이 메모리 2사에 쏠린 만큼, 한국을 떠난다기보다 메모리 이익의 지속성을 의심하는 매도이다. 다만, 강도는 이미 정점을 통과했다. 매도 강도는 상반기 2020년 코로나 쇼크에 준하는 수준까지 치솟았다가 크게 누그러졌고, 10월 중순 이후 순매도는 사실상 멈춘 상황이다. 펀더멘털과 멀어진 수급일수록 되돌림의 탄력은 강할 것으로 예상한다. 방아쇠는 메모리 2사의 주주환원이다. 마침 남은 매도가 몰린 SK하이닉스가 금일(10/28) 실적과 함께 추가 환원안을 공개할 예정이다. 40조원 자사주 매입을 마치고 환원 기준을 '누적 FCF의 50% 이상'으로 못 박은 만큼 방향성은 분명하다. 삼성전자도 이번 주 3분기 배당 확정을 앞뒀고, 서프라이즈가 없더라도 1월 잔여 환원과 차기 정책이 대기한다. 지난 26일(현지시간) 앤트로픽이 S-1을 공개하며 AI 생태계 자금조달 우려도 덜어냈다. 전일(10/27) 외국인의 순매수 전환도 같은 맥락이다. 결국, 펀더멘털 한참 벗어난 매도세가 정점은 지났으며, 대단한 기대감 없이도 메모리 2사의 주주환원 관련 발표가 수급 턴어라운드 트리거가 될 것으로 기대한다.  \n\n---\n\n### ⑩ 코스피, 결국 해낼 것이다 – 스탠 와인스타인의 주가 사이클 4단계 적용\n코스피 하락 추세에서 바닥 형성 단계 진입할 수 있을지 관심이 붙었다. 스탠 와인스타인의 주가 사이클 4단계를 현재 코스피에 대입하면 급락 이후 점차 바닥 형성 단계 진입을 시도하고 있다. 기존 지지선이었던 120일 이동평균선이 저항선으로 바뀌는 ‘하락 추세’ 단계를 지나 지수가 더 이상 밀리지 않고 일정 범위에서 움직이는 ‘바닥 형성’ 단계에 안착할 수 있을지 관심이다. 코스피는 지난 10월 2일 7,003pt에서 23일 5,550pt까지 -20.8% 하락했다. 반등이 나오지만 지속되지 못하고, 장중 저점도 낮아졌다. 특히 수급 공백이 이어지는 상황에서 외국인 순매도가 지속되고 있다는 점은 바닥 형성 단계 진입에 어려움을 겪는 이유이다. 다만 지난주 유가 상승과 프랑스 국채금리 상승, 미국 반도체주 약세 등 악재에도 지난 7월 29일 장중 저점인 5,262pt는 지켜냈고, 5,000pt 초반대에서 바닥 형성 단계 진입에 대한 기대감이 커지는 이유이다.  \n\n---\n\n### ⑪ 11월 자산배분 전략: 조정 이후, 이익과 가격에 주목\nExecutive Summary 1. 10월 금융시장: AI 우려와 자산별 차별화  \n10월 23일까지 글로벌 주식은 1.4% 하락했으며, AI 투자 우려로 한국·아시아 신흥국의 낙폭이 확대된 반면 S&P500은 0.4% 하락에 그치며 선방했다. 안전자산 선호와 금리 하락으로 글로벌·한국 채권은 각각 1.1%, 1.7% 상승했으며, 인프라·원자재 강세와 금 약세로 대체자산 내 성과 차별화가 나타났다.  \n\n2. 글로벌 주식전략: 한국의 저평가, 미국의 수익성에 주목  \n한국은 높은 ROE 대비 큰 폭의 PER 할인에 주목해 분할 비중확대하고, 미국은 글로벌 대비 수익성 우위와 PBR 부담 완화를 바탕으로 선호 유지한다. 일본·유럽은 수익성 대비 제한적인 가격 매력과 이익 모멘텀을 고려해 중립, 중국은 수익성 열위 확대와 성장세 둔화로 비중축소한다.  \n\n3. 미국 주식전략: 이익 모멘텀이 개선되는 나스닥에 집중  \n이익 모멘텀과 상대 가격 매력이 개선된 나스닥을 최선호하며 조정 시 분할 매수하고, 수익성 우위가 유지되는 S&P500은 핵심 투자 비중 유지한다. 성장주는 이익 모멘텀 둔화로 중립, 러셀2000은 실적·수익성 개선을 확인하며 선별 접근하고, 가치주는 수익성 열위와 가격 부담으로 비중축소한다.  \n\n4. 11월 자산배분 전략: 주식은 선별 대응, 채권은 중립으로  \n중간선거와 고유가·AI 투자 우려에 따른 변동성을 고려해 한국·미국 주식 중심으로 선별 대응하고, 미국 물가와 한국 금통위를 통해 긴축 경로 점검한다. 국내국채 선호도를 중립으로 상향하고 우량 채권의 이자수익을 확보하며, 대체자산은 중립을 유지하되 이자비용 증가로 배당 여력이 제약될 수 있는 리츠에는 보수적 접근한다.  \n\n---\n\n### ⑫ 전화위복(轉禍爲福): 비정상의 정상화, 그 이후의 시간표\n결론부터 내년 1년 지도와 주식 비중이 장에서 보실 것. 2027년 KOSPI 5,200~8,200p, 2분기 고점·연말 6,900p의 '상고하저'.  \n\n---\n\n### ⑬ 저평가 우량주: 밸류에이션(P/B, P/E)이 최근 5 년 내 하위 5% 수준에 있는 기업\n삼성전자, SK하이닉스, SK스퀘어 등 종목 코드 P/B(배).\n\n---\n\n### ⑭ 10월 FOMC: 금리 동결 기정사실, 12월 긴축 가능성과 속도가 관건\n10월 FOMC는 금리 동결이 기정사실회고, 케빈 워시의 기자회견에서 12월 긴축 가능성과 향후 예상되는 연준의 긴축 속도가 얼마나 변할 지가 관건이다.  \n\n---\n\n### ⑮ 주식: 반도체주 강세, AI 투자 우려 해소, 주주환원 기대감\n아시아 증시: 반도체주 강세에 상승. 美 앤트로픽 IPO 관련 소식 소화하며 대형 반도체주 강한 반등 속 오전 중 매수 사이드카 발동. 차익실현 매물 출회하기도 하였으나 그동안 AI 투자 우려가 일부 해소되었다는 센티멘트와 반도체 투톱 주주환원 기대감 확대 등으로 외국인과 기관 동반 순매수에 지수는 전 거래일 대비 3.09% 상승한 5,638.34P로 마감. KOSDAQ 역시 외국인과 기관 순매수에 전 거래일 대비 2.29% 상승한 743.83P로 마감.  \n\n---\n\n### ⑯ 미국 반도체주 강세, 중동 불안 진정으로 금리 및 유가 부담 완화\n국내 증시: 금일부터 본격적인 주력 업종들의 실적 시즌을 치를 예정. 이번 실적 이벤트를 통해 반등의 연속성, 외국인 수급 개선의 가시성을 확보할 수 있는 지가 중요해진 시점. 첫 메인 이벤트는 SK하이닉스 3분기 실적이다. 현재 3분기 영업이익 컨센서스는 77.0조원으로 역대 최대 실적을 달성할 것으로 기대되고 있는 모습. 그러나 지난 삼성전자의 3분기 잠정실적 이후 부정적인 주가 반응에서 확인할 수 있듯이, SK하이닉스 역시 3분기 실적 그 자체보다 2027~2028년 업황에 대한 시장의 의구심 해소 여부가 중요하다. HBM4의 2027년 공급계약 물량과 가격 조건, 범용 D램의 가격 전망 등을 통해 메모리 업황의 피크아웃 논란을 얼마나 완화할 수 있을지가 관건이다. 더 나아가, 실적 이외에도 단기 주가에 영향력을 행사하는 변수가 주주환원이 될 수 있다는 점도 염두에 둘 필요이다. 8월 중순에 공시했던 40조원 규모의 자사주 매입을 최근에 완료한 가운데, 키옥시아 투자 차익을 활용한 약 16조원 규모의 특별배당 가능성까지 거론되고 있기 때문. 따라서, 금일 실적 발표에서 추가적인 주주환원 현실화 및 구체성에 시장의 관심이 집중될 전망(자사주 소각, 배당 등 등 주주환원 형태, 주주환원 금액, 집행 시점 등). 물론 중장기적인 반도체의 주도력 회복은 메모리 업황과 직결되어 있지만, 주주환원 만으로도 반도체 업종을 넘어서 코스피 전반의 단기적인 투자심리와 수급 환경을 개선시킬 수 있다는 점에서 이번 SK하이닉스 실적의 중요성은 이전보다 높아질 것으로 예상.  \n\n---\n\n### ⑰ 중국증시: 미국의 추가적 대중국 제재 가능성에 하락\n중국증시: 미국의 추가적 대중국 제재 가능성에 하락. 중국 광통신 기업들의 미국 데이터 센터 공급이 제약될 수 있다는 우려가 투자심리 약화시키면서 AI 하드웨어와 반도체 업종 중심으로 자금이 이탈하며 기술주 조정 심화 속 상해종합지수는 전 거래일 대비 1.33% 하락한 3,648.30P로 마감.  \n\n---\n\n### ⑱ 금리·환율·자본흐름: AI 신용문제와 고유가가 중간선거 이전까지 방향성을 정하기 어렵다\n금리·환율·자본흐름: AI 신용문제와 고유가가 중간선거 이전까지 방향성을 정하기 어렵다. 중간선거 이후 미국의 대이란 공격 가능성과 AI 신용문제가 동시에\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로, 채권, 산업섹터 분야에서 반복적으로 등장하거나 서로 연결되는 핵심 쟁점은 다음과 같다.  \n- 반도체 수출 호조가 기업 투자와 국내 경기 성장에 긍정적 영향을 미치고 있으며, 이는 설비투자 증가와 수출 확대를 통해 GDP 성장률을 끌어올리고 있다.  \n- 그러나 민간소비는 2023년 2분기 이후 지속적인 감소세를 보이고 있으며, 이는 고금리와 주가 조정 등으로 인한 소비 약세를 반영한다.  \n- 채권 시장에서는 국채금리 하락과 함께 신용스프레드가 확대되고 있으며, 이는 구조적 균형점의 상승 가능성과 관련된 것으로, 향후 신용시장의 불확실성이 지속될 수 있다.  \n- 외국인과 은행의 국채 매수는 단기물에 집중되며, 이는 중기물 매도와의 불균형을 초래해 시장의 수급 구조에 영향을 주고 있다.  \n- AI 산업과 관련된 컴퓨팅 인프라 확보 경쟁이 가속화되고 있으며, 이는 클라우드 공급업체 및 반도체 기업에 대한 투자 수요를 증가시키는 동시에, 플랫폼 기업의 인프라 부담을 증가시키는 쌍방향 효과를 나타내고 있다."}]}</script>
