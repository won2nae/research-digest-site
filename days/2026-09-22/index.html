<script id="__DATA__" type="application/json">{"date": "2026-09-22", "headline": "유가 하락에 따른 금융시장 안정화, 그러나 지속성에 대한 의문", "market": {"KOSPI": {"label": "코스피", "value": 7017.91, "change": 0.15, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 834.38, "change": -0.23, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1355.0, "change": -1.45, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 94.59, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4376.4, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 4.955, "change": -0.78, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.464, "change": 1.8, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51863.69, "change": -0.36, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7764.64, "change": -0.0, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27244.28, "change": 0.45, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **원/달러 환율** 하락 -1.45% (현재 1355.0, 전일 1375.0, 임계값 1.0% 초과)\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### 1. 유가 하락에 따른 금융시장 안정화, 그러나 지속성에 대한 의문\n\n**무슨 일이 일어나고 있는가**  \n국제유가가 WTI 기준 95.78달러로 하락하며 100달러를 하회한 것이 9월 9일 이후 처음이다. 이에 따라 주식 및 채권시장에 긍정적 영향이 나타났으며, 코스피는 7,007.72로 마감하며 1.65% 상승했다. 유가 하락은 고물가 압력 완화와 금리 인상 가능성 낮아짐을 시사한다.\n\n**왜 그런가**  \n유가 하락의 주요 원인은 미국-이란 정상회담 기대감과 사우디의 원유 수출 확대 기대감이다. 이는 원유 공급 차질 우려를 완화시켰다. 그러나 이는 일시적인 하락일 가능성이 크며, 중동 정세 불안과 트럼프 대통령의 TACO 재연 가능성 등으로 유가가 다시 상승할 가능성도 있다.\n\n**어떤 의미/파급효과가 있는가**  \n유가 하락은 소비자물가 상승률 완화와 금리 인상 가능성 낮아짐을 의미한다. 그러나 유가의 추가 하락이 지속되지 않을 경우, 고유가와 고금리가 여전히 경기 회복을 저해할 수 있다. 특히, 트럼프 대통령의 중간선거 전략과 이란 문제의 진전 여부가 유가와 금리 경로에 큰 영향을 줄 수 있다. iM증권의 분석에 따르면, 유가가 100달러를 상회할 경우 미 연준의 추가 금리 인상 확률이 높아질 수 있다.\n\n### 2. 주요국 통화정책의 긴축 효과 점검, 경기 회복의 불균형\n\n**무슨 일이 일어나고 있는가**  \nECB, Fed, BOJ 등 주요국 중앙은행이 정책금리를 25bp 인상하며 긴축 정책을 강화하고 있다. 그러나 경기 회복은 투자 부문 중심으로 이뤄지고 있고, 소비 부문은 고물가와 고금리로 인해 약한 성장세를 보이고 있다.\n\n**왜 그런가**  \nAI CapEx가 데이터센터 건설로 확대되며 투자 부문에서 회복세가 나타나고 있지만, 소비는 고유가와 고금리에 따른 부담으로 회복이 지연되고 있다. 신한투자증권은 소비자물가 주도하는 수요 측 인플레이션 압력이 낮아 금리 인상 확률이 낮다고 분석했다.\n\n**어떤 의미/파급효과가 있는가**  \n투자 중심의 회복은 경기 회복을 견인할 수 있지만, 소비 부문의 약세는 소득 격차 확대와 내수 부진으로 이어질 수 있다. 또한, 금리 인상이 소비에 집중될 경우, 경기 충격이 가시화될 가능성이 있다. 이는 금융시장의 불확실성을 유지하거나 다시 높일 수 있다.\n\n### 3. 환율 하락, 외국인 자금 유입에 따른 국내 시장 안정\n\n**무슨 일이 일어나고 있는가**  \n원/달러 환율은 전일 대비 1.45% 하락한 1355.0으로 마감하며 임계값 1.0%를 초과했다. 이는 외국인 자금 유입과 국내 주식시장 상승에 따른 현상이다.\n\n**왜 그런가**  \n유가 하락과 미국-이란 정상회담 기대감, 사우디의 원유 수출 확대 기대감 등이 금융시장에 긍정적 영향을 미쳤다. 이는 외국인 투자자들이 국내 주식시장에 대한 기대감을 높였음을 시사한다.\n\n**어떤 의미/파급효과가 있는가**  \n환율 하락은 수출업체에 부담을 줄 수 있지만, 외국인 자금 유입은 국내 주식시장에 긍정적 영향을 줄 수 있다. 다만, 환율의 급격한 변동은 외환시장의 불확실성을 증가시킬 수 있으며, 이는 국내 금융시장의 변동성 확대로 이어질 수 있다. 이에 따라, 키움증권의 분석에 따르면, 외국인 투자자들의 순매도가 지속될 경우 시장 안정성에 영향을 줄 수 있다.\n\n### 4. 유가 하락에 따른 인플레이션 완화, 통화정책의 유연성 확대\n\n**무슨 일이 일어나고 있는가**  \n유가 하락은 고물가 압력 완화를 의미하며, 이는 통화정책의 유연성을 확대할 수 있다. 특히, 미국의 경우 고유가가 지속될 경우 추가 금리 인상 확률이 높지만, 유가가 하락하면 연준의 금리 동결 가능성도 커진다.\n\n**왜 그런가**  \n유가 하락은 소비자물가 상승률을 낮추고, 이는 인플레이션 압력 완화를 의미한다. 신한투자증권은 10월에 주요국 통화정책이 기존 긴축 효과를 점검할 것으로 전망하며, 추가 인상 확률은 낮을 것으로 보고 있다.\n\n**어떤 의미/파급효과가 있는가**  \n유가 하락은 경기 회복을 촉진할 수 있지만, 이는 단기적인 현상일 가능성이 크다. 중동 정세 불안과 트럼프 대통령의 이란 문제 대응 전략에 따라 유가가 다시 상승할 가능성이 있다. 이는 다시금 통화정책의 불확실성을 높일 수 있다. 유진투자증권의 과거 리포트를 보면, 유가와 통화정책의 관계는 항상 긴밀하게 연결되어 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. 미국 PCE 물가 산출방식 변경으로 인한 글로벌 금리 압력 재조정\n\n**무슨 일이 일어나고 있는가**  \n미국 BEA는 2026년 9월 30일부터 PCE 물가 산출방식을 변경하며, 포트폴리오 관리 및 투자자문 서비스, 법률 서비스, 컴퓨터 소프트웨어 및 액세서리 등 세 가지 항목을 근원 PCE에 포함시키기로 했다. 이는 미국 물가 지표의 구조적 변화로, 글로벌 금리 전망에 영향을 미칠 가능성이 있다.\n\n**왜 그런가**  \nPCE는 연준의 물가 목표 설정과 금리 결정에 핵심적인 지표로, 방식 변경은 기존의 물가 수준에 대한 재평가를 유발할 수 있다. 이로 인해 연준의 금리 정책 방향이 재조정될 가능성이 있으며, 이는 글로벌 금리 전반에 영향을 줄 수 있다. 유진투자증권은 미국 금리 상승 압력이 여전히 우세하다고 분석하며, 이는 PCE 변화에 대한 시장 반응과 연계된 것으로 보인다.\n\n**어떤 의미/파급효과가 있는가**  \n이번 PCE 방식 변경은 단기적으로는 물가 수준에 대한 재평가를 유도할 것이며, 장기적으로는 연준의 금리 경로에 영향을 줄 수 있다. 유안타증권과 유진투자증권은 국제유가 하락 및 외국인 국채선물 매수로 금리 상승폭이 제한됐다고 보고했으나, 이는 단기적인 요인일 뿐, PCE 변화에 따른 금리 전망의 재조정은 장기적인 채권 시장에 중요한 영향을 미칠 수 있다.\n\n---\n\n### 2. 국제유가 하락과 달러-원 안정으로 인한 국내 채권시장의 베어 플래트닝\n\n**무슨 일이 일어나고 있는가**  \n국내 채권시장은 미국과 유럽 금리 상승, 국고채 5년물 입찰 부담으로 중단기 금리가 상승했으나, 국제유가 하락과 달러-원 안정으로 장기물은 상대적으로 강세를 보이며 수익률곡선이 평탄화되고 있다.\n\n**왜 그런가**  \n유안타증권과 유진투자증권은 국제유가 하락이 국내 경기 부진 우려를 완화시키고, 달러-원 안정이 외국인 투자자들의 국내 채권 매수를 유도했다고 분석했다. 이는 글로벌 금리 상승 압력이 국내 채권시장에 미치는 영향을 완화시키는 요인이며, 특히 장기물에 대한 수요가 증가하고 있다.\n\n**어떤 의미/파급효과가 있는가**  \n이번 평탄화는 국내 채권시장의 수익률 곡선 구조를 재편하는 계기가 될 수 있다. 유진투자증권은 이전 리포트에서 미국 인상기의 시작을 언급했으나, 현재는 유가 하락과 달러-원 안정으로 인해 국내 채권 시장이 상대적으로 안정적인 흐름을 보이고 있다. 이는 장기 채권에 대한 투자 유치를 유도할 수 있으며, 채권 시장의 구조적 변화를 예고할 수 있다.\n\n---\n\n### 3. 보험사 K-ICS 비율 하락 및 가용자본 증가로 인한 신용등급 개선 기대\n\n**무슨 일이 일어나고 있는가**  \n신한투자증권에 따르면, 보험사의 K-ICS 비율은 215.2%로 전분기 대비 0.8%p 하락했으며, 가용자본은 380조원으로 전분기 대비 22.2% 증가했다. 이는 보험사의 재무 구조 개선을 시사한다.\n\n**왜 그런가**  \nK-ICS 비율은 보험사의 자본 충분성 지표로, 비율이 낮아질수록 신용등급 상승 가능성이 높아진다. 이는 주가 상승에 따른 기타포괄손익 누계액 증가와 당기순이익 증가가 주요 원인이다. 특히 하나생명은 K-ICS 비율이 150% 이하로, 재무 구조가 상대적으로 안정적인 것으로 평가된다.\n\n**어떤 의미/파급효과가 있는가**  \n이번 K-ICS 비율 하락은 보험사 신용등급 개선을 유도할 수 있으며, 이는 보험사 채권에 대한 투자 수요를 증가시킬 수 있다. 특히 하나생명의 경우, 재무 구조가 상대적으로 안정적이므로, 신용등급 상승 가능성이 높아져 채권 시장에 긍정적인 영향을 미칠 수 있다.\n\n---\n\n### 4. 연준의 정책 재설계로 인한 장기금리 상승 압력 지속\n\n**무슨 일이 일어나고 있는가**  \n키움증권은 연준의 정책 재설계가 장기금리 상승 압력을 지속적으로 유지할 수 있다고 분석했다. 연준의 5개 TF 정책 방향은 단기금리의 변동성을 높이고, 장기금리와 기간프리미엄을 상승시키는 방향으로 작용한다.\n\n**왜 그런가**  \n커뮤니케이션 TF와 데이터 TF는 단기금리의 경제지표 민감도를 높이며, 대차대조표 TF는 장기채 수요 축소를 통해 장기금리 상승을 유도한다. 이는 미국 금리 상승 압력이 지속되면서, 글로벌 금리 전반에 영향을 미칠 수 있다.\n\n**어떤 의미/파급효과가 있는가**  \n이번 연준의 정책 재설계는 장기금리 상승 압력을 지속적으로 유지할 수 있으며, 이는 국내 채권시장에 베어 스티프닝을 유도할 수 있다. 유진투자증권은 이전 리포트에서 미국 인상기의 시작을 언급했으나, 현재는 연준의 정책 재설계가 장기금리 상승 압력을 지속적으로 유지하고 있어, 채권 시장의 구조적 변화가 예상된다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. **기업 연체율 상승, 중소기업과 자영업자 중심으로**\n- **무슨 일이 일어나고 있는가**  \n  2026년 7월 말 기준, 국내은행의 원화대출 연체율은 0.63%로 전년 동기 대비 11bp 상승했으며, 법인 중소기업 연체율은 1.00%로 10bp 상승, 자영업자 연체율도 0.77%로 5bp 상승했다. 반면 가계 연체율은 0.42%로 5개월 연속 하락 중이다.\n- **왜 그런가**  \n  중소기업과 자영업자는 경기 변동에 민감한 부문으로, 금리 상승, 수출 감소, 원자재 가격 상승 등으로 인해 자금 유동성 압박이 커지고 있다. 특히 2026년 들어 원/달러 환율이 1.45% 하락한 것으로 보아, 수출 기업의 수익성 악화가 가속화되고 있는 것으로 추정된다.\n- **어떤 의미/파급효과가 있는가**  \n  이는 중소기업과 자영업자의 신용 위험 증가를 반영하며, 금융기관의 대출 리스크 관리 강화로 이어질 수 있다. 또한, 연체율 상승이 지속될 경우, 경기 침체 우려가 커져 투자심리에 부정적 영향을 줄 수 있다.\n\n---\n\n### 2. **에너지 가격 상승과 EUA 상승, 탄소배출권 시장의 변동성 확대**\n- **무슨 일이 일어나고 있는가**  \n  EUA(유럽 탄소배출권) 가격은 9월 14일 기준 €88.0까지 상승하며 약 9개월 만에 고점을 기록했다. 이후 약간 하락했으나, €85 수준에서 지지력을 확인하며 주간 기준 1.6% 상승했다.\n- **왜 그런가**  \n  에너지 가격 상승, 중동 송유관 폐쇄, 중부 유럽의 재생에너지 발전량 감소 등이 EUA 가격 상승을 유발했다. 또한, EU가 에너지집약 산업의 경쟁력 보호를 위해 무상할당 확대를 제안하며, EUA 공급 감소 우려가 가격 상승에 기여했다.\n- **어떤 의미/파급효과가 있는가**  \n  EUA 가격 상승은 탄소세 부과와 같은 정책 변화에 따른 기업의 원가 상승으로 이어질 수 있다. 특히, 제조업 중심의 국가나 기업은 탄소비용 부담을 더 크게 느끼게 되며, 이는 수출 경쟁력 약화로 이어질 수 있다. 한화투자증권의 리포트에서 이에 따른 ESG 전략의 중요성 강조가 이어지고 있다.\n\n---\n\n### 3. **중국산 특수강 반덤핑 예비판정, 2027년 ASP 상승 기대**\n- **무슨 일이 일어나고 있는가**  \n  무역위원회는 중국산 봉강에 대해 예비 긍정 판정을 내리고, 25~27%의 잠정 덤핑방지관세 부과를 제안했다. 이는 국내 특수강 산업에 긍정적 영향을 줄 것으로 기대된다.\n- **왜 그런가**  \n  중국산 특수강은 국내 수입의 90%를 차지하며, 가격 경쟁력이 높아 국내 산업에 부담을 주고 있다. 반덤핑 조치는 중국산 수입을 억제하고, 국내 기업의 시장 점유율 확대를 유도할 수 있다.\n- **어떤 의미/파급효과가 있는가**  \n  2027년 중반부터 잠정관세 효과가 본격적으로 나타날 것으로 예상되며, 특수강 ASP(평균 판가) 상승이 예상된다. 이는 자동차, 건설중장비, 베어링 등 산업에 긍정적 영향을 줄 수 있다. 교보증권의 자동차/이차전지 리포트에서도 수요 증가에 따른 가격 상승 가능성을 언급하고 있다.\n\n---\n\n### 4. **데이터센터 투자 확대, 건설업종의 실적 성장 기대**\n- **무슨 일이 일어나고 있는가**  \n  현대건설은 포항AI데이터센터를 4,266억원에 수주했으며, GS는 동해데이터센터 사업을 위해 2천억원을 출자 결정했다. 데이터센터 건설에 대한 수요가 확대되고 있다.\n- **왜 그런가**  \n  AI, 클라우드, 메타버스 등 디지털 전환에 따른 데이터센터 수요 증가가 주요 원인이다. 특히, 미국 대미투자 협의 지연 등으로 인해 국내 데이터센터 투자가 가속화되고 있다.\n- **어떤 의미/파급효과가 있는가**  \n  데이터센터 건설은 건설업종의 실적 성장에 기여할 수 있으며, GS건설과 DL이앤씨 등이 주요 수혜주로 꼽히고 있다. 신한투자증권 리포트에서도 데이터센터 수주 확대에 따른 건설업종의 투자 기회를 강조하고 있다.\n\n---\n\n### 5. **IP 인수 확대, 게임 산업의 글로벌화 가속화**\n- **무슨 일이 일어나고 있는가**  \n  위메이드의 '미르' IP가 중국 기업에 9200억원에 매각되며, 국내 게임 산업의 글로벌 인수·인수 확대가 이어지고 있다.\n- **왜 그런가**  \n  중국 게임사들이 해외 IP를 확보해 글로벌 시장 진출을 추진하고 있으며, 이는 글로벌 게임 시장의 경쟁 심화를 반영한다.\n- **어떤 의미/파급효과가 있는가**  \n  IP 인수 확대는 국내 게임사의 글로벌 시장 진출을 촉진할 수 있지만, 로열티 유출 및 고용 불확실성 등 부작용도 동반할 수 있다. 이에 따라, IP 보유 및 개발 역량 강화가 필수적이다.\n\n---\n\n### 6. **로봇 산업의 기술 혁신, AI와 결합한 신규 시장 창출**\n- **무슨 일이 일어나고 있는가**  \n  LG전자와 엔비디아가 로봇 공동개발 거점 설립을 발표했으며, 보스턴다이내믹스는 RMAC 개소를 발표했다. AI와 로봇 기술의 결합이 가속화되고 있다.\n- **왜 그런가**  \n  AI 기술 발전과 함께, 로봇의 자율성과 정밀도가 높아지며, 물류, 제조, 서비스 등 다양한 분야에서 활용 가능성이 확대되고 있다.\n- **어떤 의미/파급효과가 있는가**  \n  로봇 산업은 AI와의 융합을 통해 신규 시장 창출이 가능하며, 이는 관련 기업의 수익성 향상으로 이어질 수 있다. 유진투자증권 리포트에서도 휴머노이드 로봇의 2035년 대량 배치 가능성에 주목하고 있다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. **AI 에이전트 확산으로 CPU 수요 급증, 서버 인프라 수혜 기대**\n메타의 개인형 AI 에이전트 '뮤즈' 출시로 AI 에이전트 시장이 본격적인 성장 단계에 접어들고 있다. 뮤즈는 사용자별 전용 클라우드 VM을 할당하는 구조로, 사용자 수 증가에 따라 CPU 수요가 급격히 확대될 가능성이 높다. 유진투자증권은 이에 따라 인텔, AMD, ARM 등 CPU 업체들의 수요가 증가하고, 서버 CPU 시장 전망치가 상향 조정되고 있다고 분석했다. 이는 GPU 중심의 AI 연산에서 벗어나, CPU가 오케스트레이션과 외부 S/W 접근 등에 주요 역할을 수행하는 구조로 변화하고 있기 때문이다. 특히, 메타가 엔비디아, ARM, AMD 등 주요 CPU 업체와의 계약을 확대하고 있다는 점에서 AI 에이전트 시대에 CPU의 전략적 중요성이 재확인되고 있다. 이에 따라 CPU 밸류체인과 서버 인프라 관련 기업에 대한 투자 매력도가 상승하고 있다.\n\n### 2. **금리 인상 기대 지속, 금리 민감 섹터 약세, 기술주 강세**\n미국 연준의 9월 FOMC에서 기준금리가 25bp 인상되며, 연내 추가 인상 가능성도 확인되면서 금리 민감 섹터인 유틸리티, 부동산, 금융 등이 약세를 보였다. 하나증권은 금리 인상 기대가 지속되며, 단기물 중심의 금융 섹터도 수익률 하위권에 머물렀다고 분석했다. 그러나 AI 개발 속도 조절론에 따른 우려가 일부 해소되며, 대형 기술주에 저가 매수세가 유입되었다. 특히, AI, 반도체, 소프트웨어 등 기술주 관련 테마는 강세를 보였으며, 사이버보안, 빅테크 등은 상대적으로 더 강한 상승세를 기록했다. 이는 기술주들이 금리 인상 기대와 무관하게 성장 잠재력이 높다는 점에서 주식 시장에서 선호받고 있음을 시사한다.\n\n### 3. **반도체 수출 급증, 국내 증시 상방 압력 강화**\n대신증권은 한국의 9월 1~20일 반도체 수출이 전년 대비 259.4% 증가하며 역대 최대치를 기록했다고 분석했다. 이는 반도체 업황의 견조함을 재확인하는 동시에, 국내 증시에 상방 압력을 가하고 있다. 특히, 미국의 반도체 주가 강세가 국내 반도체주에 긍정적인 영향을 미쳤으며, 트럼프 정권의 AI 관련 정책 강화와 대규모 투자 발표가 AI 투자심리를 강화하는 요인으로 작용하고 있다. 이에 따라 반도체, AI 관련주에 대한 투자 관심이 집중되고 있으며, KOSPI 7,000선 탈환에 대한 기대감도 상승하고 있다.\n\n### 4. **미국 ETF 시장, 기술주 중심 유입 지속, 유가 하락에 금융 섹터 반등**\n미국 ETF 시장에서는 기술주 중심으로 자금 유입이 지속되고 있으며, 특히 반도체, 사이버보안, 소프트웨어 등에 대한 매수세가 강한 것으로 나타났다. 하나증권은 반도체 테마가 2주 연속 자금 유입을 기록했으며, 주간 유입 강도가 3.01%로 8월 이후 최고 수준을 기록했다고 분석했다. 반면, 유가 하락으로 인해 석유·가스 테마는 약세를 보였으나, 금융 섹터는 금리 상승 기대가 진정되며 반등했다. 이는 기술주에 대한 선호도가 지속되며, 유가 부담 완화로 금융 섹터도 반등할 수 있는 환경이 조성되고 있음을 의미한다.\n\n### 5. **달러-원 환율, 금리 인상 기대와 연동해 반등**\n대신증권은 달러-원 환율이 단기 급락 이후 반등 구간에 진입했으며, 미국 금리 인상이 시장에 반영된 2-3회 수준이라면 달러 강세 폭이 제한될 가능성이 높다고 분석했다. 실제로 오늘의 매크로 충격 지표에 따르면, 원/달러 환율이 -1.45% 하락하며 1355.0원으로 마감했다. 이는 미국 연준의 매파적 발언과 연내 추가 금리 인상 기대가 달러 강세를 지지하고 있음을 시사한다. 다만, 유가 하락과 중동 협상 재개 기대감이 달러 약세 요인으로 작용할 수 있으나, 금리 인상 기대가 지속되며 달러 강세가 유지될 것으로 보인다.\n\n### 6. **토큰화 주식 거래 허용, RWA 시장 성장 기대**\niM증권은 미국 SEC가 주식 토큰화 거래를 허용하는 조치를 발표하며, RWA(Related to Real World Assets) 시장 성장에 대한 기대감을 강화했다. 이는 토큰화 주식 거래 플랫폼과 관련 금융 인프라 기업에 긍정적인 영향을 미칠 것으로 전망된다. 특히, Securitize, Coinbase, Circle 등이 주요 수혜주로 꼽히며, 토큰화 시장의 제도적 기반 마련으로 RWA 시장이 확장될 가능성이 높다. 이는 디지털 자산 시장에 새로운 성장 동력을 제공하며, 토큰화 기반의 금융 인프라에 대한 투자 관심도가 높아질 것으로 기대된다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n유가 하락과 환율 안정 등으로 금융시장에 일시적인 긍정적 영향이 나타났으나, 지속성에 대한 의문이 여전히 남는다. 특히 중동 정세와 트럼프 정권의 정책 변화에 따라 유가와 금리 경로가 다시 변동할 가능성도 있다. 산업 섹터에서는 데이터센터 투자 확대와 로봇 기술 혁신 등으로 성장 기대가 있는 분야가 부각되나, 중소기업 연체율 상승과 EUA 가격 상승 등은 부정적 요인으로 작용할 수 있다. 이러한 요소들을 종합할 때, 단기적인 안정과 함께 장기적인 불확실성에 대한 관찰이 필요한 시장 상황으로 볼 수 있다."}]}</script>
