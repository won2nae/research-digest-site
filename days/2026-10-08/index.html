<script id="__DATA__" type="application/json">{"date": "2026-10-08", "headline": "I. 물가-금리-달러 동조화의 구조적 전환이 가시화 되었다 — 달러 강세의 두 가지 경로", "market": {"KOSPI": {"label": "코스피", "value": 6625.93, "change": -2.62, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 892.27, "change": -0.69, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1344.0, "change": 0.22, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 91.49, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4157.0, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.235, "change": -4.18, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.394, "change": 0.3, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51231.64, "change": 0.1, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7765.36, "change": -0.47, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27193.34, "change": -1.25, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -2.62% (현재 6625.93, 전일 6803.9, 임계값 1.5% 초과)\n\n### 관련 뉴스\n\n**코스피 하락 -2.62%**\n\n**인플레이션·금리 우려로 3연속 하락, 외국인·기관 동반 매도**\n코스피가 인플레이션과 고금리 지속 우려 속에 장중 2.6% 이상 급락, 6,600선까지 밀렸다. 외국인·기관이 순매도한 반면 개인은 순매수했다.\n— Yonhap (en.yna.co.kr), Korea Times, Korea Herald\n\n**삼성전자 사상 최대 영업이익에도 주가 하락**\n삼성전자가 역대 최고 분기 영업이익을 발표했음에도 외국인·기관 매도세에 코스피가 오히려 2% 이상 밀렸다.\n— 조선비즈, NoCut News, 전자신문\n\n**AI 투자 발 국채 시장 불안, 아시아 증시 전반 약세**\n빅테크의 AI 투자 재원 마련을 위한 채권 발행 급증이 국채시장 압박으로 이어지며 닛케이·코스피 등 아시아 증시가 동반 하락했다.\n— Reuters, US News & World Report\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### I. 물가-금리-달러 동조화의 구조적 전환이 가시화 되었다 — 달러 강세의 두 가지 경로\n\n2020년 이후 달러 인덱스(WDII)와 WTI의 상관관계는 역사적 패턴을 뒤바꿨다. 2000~2019년 음의 상관관계(-0.82)였다던 두 변수는 2020년 이후 (+0.43)으로 전환되었고, 미 국채 10년물과 WTI의 상관관계도 -0.39 → +0.52로 전환되었다(한화). 이 변화의 근본原因是 실질금리 상승이다.\n\n두 경로가 병렬로 작동한다:\n\n1) **우회 거래 경로**: 중동 지정학 리스크와 에너지원 관광에 따른 결제망 차단이 역내 에너지 거래 구조 재편을 요구한다(UAE가 8월 이란과의 금융거래를 전면 중단). 결제망 차단은 달러 확보 경쟁을 유발하고, 인도의 대이란 교역 증가는 66%로 급증했음에도 불구하고 UAE의 중단으로 에너지 거래 자체가 재편 중이다. 즉, 결제망 차단으로 발생하는 달러 유입 경로는 유가 상승이 아닌 '시스템적' 달러 수요 생성이다.\n\n2) **긴축 경로**: AI 인프라 투자의 대규모 민간채권 발행(AI 투자는 기업투자가 확대되고 소비가 견조한 흐름을 이어간다는 키움의 FOMC 의사록 언급)과 미국 재정적자 국채 공급이 연준의 긴축을 장기화시켜 실질금리를 상승시킨다(Kiwoom). 고금리 환경에서 빅테크 회사채 발행과 미국 국채 공급이 동시에 존재하는 것은 유동성 경쟁 구조이며, 이는 연준의 추가 긴축 필요성을 지지한다(키움).\n\n두 경로 모두 달러 수요를 창출하나, 첫 번째 경로는 외생적(지정학+에너지)이고 두 번째 경로는 내생적(금융시장 구조)이다. 두 경로가 동시 진행되면 달러 강세는 단일 사건의 파급이 아닌 구조적 지속 요인이 된다. 그러나 이 구조의 취약점은 AI 투자와 에너지가격이 물가에 미치는 영향의 방향성이다. 일부 위원들은 AI 관련 수요가 운송비 및 투입비용을 높여 비용 부담을 높인다고 명시했다(키움). 즉, AI 인프라 투자가 생산성과 잠재성장률을 높일 가능성은 인정되나 그 효과의 크기와 시점에 상당한 불확실성이 있고, 해당 효과가 발현되기 전까지는 비용 상승이 물가의 상방 압력으로 작용한다.\n\n---\n\n### II. 연준의 추가 인상 선택 구조: 시간 차와 비대칭성\n\nFOMC 의사록은 두 가지 사실을 동시에 드러낸다.\n\n첫째, 10월 연속 인상을 서두를 필요성이 이전보다 낮아졌다. 고용지표가 둔화되고 장기금리가 추가 상승했기 때문이다. 그러나 12월 인상 가능성을 열어둔 경로가 현실적이다. 연준 스스로도 “추가 금리 인상 필요성이 크게 낮아졌다고 보기 어렵다”고 표명했다(키움). 의사록 문맥을 보면 이 표현은 정책 전환을 배제하는 것이 아니라 추가 인상의 '즉시성'을 제거하는 것이다.\n\n둘째, 금리 상승에 따른 실물경제의 긴축 효과가 아직 뚜렷하지 않다. 주가와 신용시장이 견조하고 AI 투자와 소비가 성장을 지지하는 가운데, 고금리 부담이 신용시장과 실물경제로 확산되어야 추가 인상의 필요성이 낮아진다. 이 조건은 회사채 스프레드 확대 또는 은행 대출기준 강화 등의 구체적 신용시장 변화를 전제로 한다.\n\n---\n\n### III. 동아시아 통화 모멘텀 약화: 엔/원/위안의 비대칭 약세 구조\n\n강달러 흐름은 동아시아 주요 통화에서 상대적 약세로 직면한다.\n\n엔화는 기준금리 인상에도 미-일 금리 격차가 유지되고 있으며, 재정 우려까지 더해진다. 즉, 금리 인상 효과가 완충되지 않는다. 엔화 약세 압력은 이 세 요인의 합성이다.\n\n원화는 SK하이닉스 ADR 환전 효과 소멸과 국민연금의 9월 환 헤지 중단으로 달러 수급 지지력이 약해지면서 변동성이 확대되고 있다(SH). 이는 단기 달러 수급의 직접적인 약화이다.\n\n위안화는 무역흑자가 하방을 지지하나 인민은행이 미세조정을 통해 강세 압력을 의도적으로 완화시키고 있다. 따라서 위안화의 약세는 계획적 수완이다.\n\n결론적으로 동아시아 통화 약세는 엔→원→위안 순으로 강도가 다르다. 이 구조에서 달러 강세의 상대적 지속성은 엔화 약세가 더욱 깊어질 수 있으나, SH가 제시한 원/달러 1,320~1,400원 밴드 내 반등 가능성을 제시한 것은 엔화 약세가 위안화 강세와 맞물릴 경우 동아시아 통화 집단의 약세 모멘텀이 순간적으로 멈춰설 수 있다는 시그널이다. \n\n---\n\n### IV. AI 투자와 소비의 분리: 경기 확장의 후반부와 수익의 루프 밀폐 실패\n\n경기 확장 국면의 후반이라는 위치에서 두 가지 문제 구조가 동시에 작동한다.\n\n1) **경기 확산의 중단**: 생산확산지수 광공업이 최근 하락 반전했고 서비스업은 지속 하락 중이다(IBK). 경기 사이클의 후반부에 도착했음에도 경기 확산이 이루어지지 않았다는 것은 이 업종군의 수요가 다른 업종의 호황으로 이어지지 않는다는 것을 의미한다. AI 투자가 반도체 중심으로 집중되어 있고, 이 호황이 가계 소득과 기업 이익으로 연결되지 않는 구조다.\n\n2) **소득-이익 루프의 비밀접속**: 경제성장률이나 주가 상승에 힘입어 소비에 대한 기대지수는 높아졌으나 임금이나 고용 등 소비 여력이 개선되지 않고 있다. 임금이나 고용이 소비를 지지하지 않으므로 소비 기대는 실물로 연결되지 못한다. 기업 이익도 상장기업 영업이익 증가율은 가파르게 증가 중이지만 Top-down earning momentum(동행지수-후행지수)의 괴리가 매우 커졌다(IBK). 경제 전반의 기업 이익 환경이 지지부진한데 반도체 기업의 막대한 이익이 헤드라인을 높이는 구조다. 이는 기업 이익이 전체 경기에 비례하지 않는 것을 의미하며, 기업 부문에서 설비투자 수요는 가파르게 증가 중이지만 자금사정이나 채산성이 제자리걸음이라 부채 수요가 높아진다는 구조다.\n\n결론적으로 AI 투자는 경기를 뻗어가고 있겠지만, 이 호황이 소득-소비-이익의 루프를 밀폐하지 못하고 있다. 기대가 높아지는 데 이를 충족할 조건이 쉽게 만들어지지 않을 경우 기대 자체가 지속 가능한 수준이 아니라는 경고 신호다.\n\n---\n\n### V. 중국 소비의 구조적 제약: 부동산-저축-연관소비의 피드백 루프\n\n중국 소비의 부진은 단순한 정책 효과 누수에 그친 것이 아니다. 중국 가계자산에서 부동산이 차지하는 비중은 50% 이상으로 다른 주요국보다 높다. 주택가격 하락은 가계 순자산을 감소시키고 미래 자산가격 불확실성을 높여 소비심리를 위축시킨다. 부동산 가격 하락세가 장기화됨에 따라 가계는 지출보다 저축을 선호하고 있고, 주택 거래 감소는 가구·가전 등 연관 소비까지 위축시킨다.\n\n중국 정부의 이구환신 정책은 2025년 3,000억 위안에서 올해 2,500억 위안으로 규모가 축소됐다. 스마트폰과 태블릿 등 디지털·스마트 제품으로 지원 범위가 넓어졌으나 전체 재원이 감소했고, 지난해 정책이 자동차와 가전 내구재 소비를 상당 부분 앞당겼기 때문에 올해 동일한 방식의 정책이 동일한 효과를 가져올 가능성은 제한적이다. 이미 보조금을 활용해 제품을 교체한 가계의 재구매 수요가 크지 않다는 점이 추가 효과를 제약한다.\n\n---\n\n### VI. 시장 혼란 구조: AI 투자 채권 발행이 국가별 시장에 미치는 비대칭적 영향\n\nAI 투자의 민간채권 발행은 국가별 시장에 비대칭적으로 영향을 준다. 미국의 경우에는 키움이 언급했던 바와 같이 대규모 민간채권 발행이 연준의 긴축을 장기화시키는 구조가 이미 존재한다. 미국 국채 금리 상승은 경기 활성화를 지지한다고 연준 자체가 판단했다. 그러나 다른 국가에서는 상황이 다르다.\n\n아시아 증시 전반의 동반 약세 배경에는 AI 인프라 투자를 위한 대규모 민간채권 발행이 국채시장에 압박을 주어 닛케이·코스피를 동시에 하락시켰다는 Reuters·USN&W의 언급이 있다. 즉, 미국의 금리 상승은 자국 금융환경에 대한 자기 자신감을 제공하는 반면, 다른 국가에서는 동일한 발행 행위가 국채 시장 압박으로 이어진다. 이는 글로벌 자금흐름의 비대칭성이다. 미국의 금융 여건 우호성 판단은 기업채 스프레드 낮음, 은행 대출기준 완화, 회사채 발행 견조함을 근거로 하며(키움), 이러한 내부 구조가 외부 금리 상승에 대한 버팀목이 되는 반면, 다른 국가에서는 이러한 내부 구조가 없다. 미국의 경우 고금리가 실물경제에 미치는 긴축 효과가 아직 뚜렷하지 않다는 판단이 붙어 있다(키움)—즉, 고금리가 신용시장으로 확산되지 않았다면 금리 상승이 자국 경제에 미치는 부담이 덜하다는 것이다. 이는 미국 내부 구조의 특징이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### ① 프랑스 재정 위기: 구조적 디폴트 리스크의 재확인\n\n프랑스 10년물 국채금리는 10/7일 1.3%p 급등해 연초 대비 1.3%p 상승했으며, 미국(1.1%p)과 피츠버그(Portugal-Ireland-Greece-Italy-Spain; PIIGS, 평균 0.8%p) 모두를 상회하는 수준이다. 이는 단순한 정치 불확실성에 그친 것이 아닌 구조적 재정 건전성을 스스로 인정하는 수준이다. 프랑스 정부는 2026년 GDP 대비 5.4%의 재정적자를 2027년 5.0%로 줄이기 위해 총 540억유로 규모의 재정조정안을 제시했으나, 의회 분열로 원안 통과와 긴축 강도 유지에 대한 우려가 확산되고 있다. 동시에 차기 대선에서 국민연합(National Rally)의 르펜(Jean-Luc Mélenchon)과 멜랑숑(Yannick Jadot)의 대결 가능성이 부각되면서 재정 경로 불확실성이 추가로 가중되고 있다.\n\nOECD 기준 2025년 프랑스의 공공지출(GDP 대비 57.2%)은 유로존 평균보다 7.4%p 높고, 세수(GDP 대비 43.5%)는 이미 EU 평균보다 6.7%p 높아 증세 여력마저 제한적이며, 순이자비용은 재정수입 대비 4.1%에 달한다. 2026년 GDP 대비 재정수지 -5.4%는 경기적 요인(-0.3%p)을 제거한 구조적 재정수지도 잠재 GDP 대비 -5.1%로 여전히 5~6%대의 고농도이며, 경기 회복만으로는 재정적자의 개선에 한계가 명백하다(OECD).\n\n이런 구조적 취약성은 'PIIGS 경로'와 다르다. 2009년 GDP 대비 -15.4%에 달했던 그리스 재정수지는 2025년 1.7%로 전환했다. 반면 프랑스는 여전히 5~6%대의 고농도 재정적자로 경제적 자생력을 갖지 못해 재정 수급 압박이 지속될 가능성이 높다. 유로존 재정 위기 이후 프랑스-독일 10년물 스프레드는 140bp까지 확대되며, 이는 유로존 내 재정 리스크가 단순한 '한국어 발음 실패'(Korea's failure to pronounce the word)가 아니라 구조적 디폴트 파워를 가지고 있다고 판단하는 시장의 신호이다.\n\n---\n\n### ② 미국 하이일드 스프레드: BBB와 CCC 사이의 긴장\n\n미국 하이일드(HY) 스프레드는 8월 말 2.61%p에서 9월 들어 3%p를 돌파하며 약 한 달간 46bp 확대됐다. 2022년 2월 이란-미군 간 군사 행동 이후 가장 큰 하루 확대폭이며, CCC등급 내부에서 가장 극단적인 패턴이 나타났다. 4월 말 이후 BB+등급 스프레드가 +23bp, B등급이 +5bp 확대된 반면 CCC등급은 +324bp로 확대됐다(Figures 2-3 참조)[iM증권].\n\nCCC등급 스프레드는 2022년 2월-3월 단기 급락 직후 진정됐다가, 이번엔 단기 국채 금리와 동조화되며 하방 압력을 받아왔는데, 이는 유가 상승에 따른 Fed 긴축 우려와 원자재 비용 인상으로 인한 제조업 비용 부담이 하위 등급 채권 발행자들에게 전가된 것으로 해석된다[Fed의 긴축 신호, iM증권]. 발행 시 부여되는 가산 프리미엄이 하위 등급으로 갈수록 커져 리파이낸싱 부담이 사실상 무한대로 증가하고 있으며, 이는 'Surge in borrowing costs hits corporate America'[FT, 10/6]에서 지적한 바와 같다.\n\nBBB 등급 스프레드는 2022년 2월 이후 지속적으로 타이트한데, 이는 테슬라(Tesla)의 AAA 등급 승인이나 아마존(Amazon) 등의 BBB→AAA 등급 전환과 함께 미국 대형 IT 기업들이 구조적 BBB 수준으로 남아 있다는 것을 의미한다. 그러나 CCC등급의 스프레드는 이런 구조적 안정성과 아무 관련이 없는 것으로, 2023년 3월 이후의 하위 등급 중심의 금융 위험이 상대적으로 더 높은 것으로 평가된다. 이러한 등급 내 차별화는 단순한 시장 심리를 넘어서 구조적 채권 발행 비용 구조의 균열로 해석할 수 있다.\n\n---\n\n### ③ 프랑스와 유로존 금리: ECB의 선택\n\n프랑스의 재정 위기는 유로존 전체의 채권 시장을 헤지할 수 없는 구조적 요인이라는 점에서 ECB의 정책 결정에 중요한 변수가 된다. ECB는 2010년 그리스 위기 당시 OMT(Operation of Outright Monetary Transactions)를 통해 채권 구매 프로그램을 도입했으나, 이는 '선택적 지원'(conditional support)의 형태였다. 프랑스의 재정 경로가 구조적으로 개선되지 않는 한, ECB가 프랑스 국채를 추가로 매입한다는 것은 정책적 목적과도 모순된다.\n\n프랑스 국채금리가 PIIGS보다 높고, 재정적자와 순이자비용 비율이 PIIGS와 유사한 수준임에도 불구하고, 2025년 GDP 대비 재정수지가 여전히 -5.4%에 닿는다는 사실은, 프랑스가 단순한 'Political Risk'가 아니라 구조적 채권 수급 압박을 받고 있음을 의미한다. 유로존 내 다른 나라들과의 재정적자·부채 수준 차이는 이제 중요하지 않고, 프랑스가 '유로존 내 다음 번 재정 위기 트라이얼'(Next Trial for Eurozone Fiscal Crisis)을 준비하고 있다는 사실 자체가 시장 참여자에게 불확실성을 강화시키고 있다.\n\n---\n\n### ④ 국내 채권 시장: 국고 30년 입찰 효과와 구조적 약세\n\n국내 채권 시장은 10/7일 국고 30년물 입찰을 앞둔 가운데 약세 출발했다. 국고 30년물 입찰이 시장 예측을 크게 초과한 것은 금리 하방 압력이 있으나, 이와 동시에 국고 30년물 입찰을 계기로 중단기·장기물 매도가 확대됐다는 관측이 나오고 있다. 국고 30년물 입찰 이후 해당 만기만 금리가 하락하고 다른 만기 구간은 상승한 것은, 30년물 매도 포지션이 해소되며 다른 만기 구간의 매도 포지션도 정리된 것으로 해석된다[Eugenes FICC Update].\n\n같은날 달러-원 환율은 1,340.40원으로 3.20원 하락했다. 글로벌 달러 강세와 외국인 국내주식 대규모 순매도에도 불구하고, 꾸준한 달러 매도 물량이 하방 압력을 지탱했다. 외국인의 달러선물 순매도가 낙폭을 키웠지만, 주식 순매도가 하단 지지를 제공했다는 점에서 달러-원은 하락 충격을 상쇄하는 방향으로 움직였다. 다만, 이는 달러 강세의 글로벌 환경을 완전히 종결시킨 것이 아니라, 단기 매매 차익 매집과 국내 채권 수급 압력이 당분간 지배적이라는 의미이다.\n\n---\n\n### ⑤ 증권사 조달 구조 변화: 단기 의존 → 장기 전환\n\n증권사의 조달 구조는 주식 자금 쏠림 현상 이후 급변하고 있다. 증권사는 수신 기반이 제한되어 있기 때문에 RP매도·전단채·콜머니 등 단기성 조달에 의존해왔다. 그러나 2026년 7월 주식 시장의 조정으로 CP/전단채 발행이 대폭 축소된 반면, 증권채 발행은 계속 이어졌다. 2026년 증권채 발행액은 11.9조원으로 2025년 11.2조원을 넘어섰고, 9월에는 A급 이하 증권사도 발행에 나서는 모습이다[Saham Investment Securities].\n\n증권사 자산총액은 2026년 6월말 1,256.1조원으로 2025년 말(944.4조원) 대비 311.7조원 급증했다. 자산총액의 급증은 장기성 조달 기반 마련의 동인으로 작용하고 있으며, 내년 1월부터 시행되는 유동성비율(LCR) 규제 개정은 장기성 조달 수요를 더욱 강화할 것으로 예상된다. 증권사의 단기성 조달 의존도는 여전히 높지만, 장기성 조달 확대 움직임이 구조적 변화로 연결되고 있다. 이는 단순한 조달 수요의 변동이 아니라, 증권업의 성장 구조와 정책 변화가 결합된 결과이다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 철강: 연휴 감산 불구 재고 증가 → 10월 성수기 기대감 약화\n\n국경절 연휴 동안 철강 업체들은 대규모 감산을 실행했다. 그러나 용접강관 생산이 35.5% 감소한にも 불구하고 재고가 오히려 증가(+0.04% WoW, +3.49% YoY)했다는 사실은 중요한 신호다. 연휴 주간 감산이 재고 축소를 이루지 못했음을 보여주는 동시에, 10월 성수기 수요 회복에 대한 시장 기대가 이미 낮다는 것을 반증한다.\n\n중국 내수 부진이 글로벌 무역 갈등을 가속화하고 있다는 것도 주목해야 한다. EU는 4분기 쿼터가 열린 직후 5일만에 중국/인도 물량이 소진되며 50% 초과 관세 구간에 진입했다. 인도의 중국산 수입 비중은 31.8%까지 치솟고 있다 — 이는 중국이 EU로 수출 물량을 몰고 있다는 방증이다.\n\n한국 시장으로의 전환이 가장 우려스러운 부분이다. 9월 한국의 중국산 중후판 수입은 전월 대비 +49.0% 급증했으며, 수입 단가도 $647/t으로 전월 ($720/t) 대비 크게 낮아졌다. 반덤핑(AD) 조치가 있으나, 조선용 보세 물량과 우회 품목을 통한 수입 압력이 현실적으로 존재하고 있다. 결국 중국이 글로벌 시장에서 수출 물량을 재편하면서 한국은 수입 단가 하락과 수급 경쟁 강화라는 이중 압력을 동시에 받아야 하는 구도다.\n\n---\n\n### 2. 자동차: 현대차 vs 기아 — 판매 엇갈림, 이익 기대치 동시 하회\n\n현대차/기아 3Q26 합산 판매량은 180.4만대(-1.0%)로 예상된다. 여기서 두 기업의 방향성이 크게 갈린다:\n\n- **현대차**: 파업에 의한 생산 차질로 3Q 판매량이 91.9만대(-11.5%)로 크게 감소했다. 친환경차 판매가 HEV 성장 둔화(+3.4%)로 3Q 역성장(-3.2%)한 것이 수익성 악화의 직접 원인이다. 3Q26 매출액은 44.6조원(-4.5% YoY)으로 예상되며, 영업이익은 시장 기대치 3.0조원보다 낮은 2.4조원(-5.4%)으로 추정된다. 4월·5월에 급등했던 구리·알루미늄 등 원자재 가격이 3Q에 투입됨에 따라 마진 저하가 불가피하다.\n\n- **기아**: 84.4만대(+7.6%)로 판매가 확대됐다. 북미 HEV와 유럽 BEV 물량 확대(+45.9%)가 성장의 주춧돌이다. 3Q26 매출액은 33.6조원(+17.3%)으로 두 자리수 성장을 기록할 것으로 예상된다. 영업이익은 시장 기대치 2.55조원보다 낮은 2.39조원(+63.6%)이 될 전망이다. 물량 증가 효과가 있겠으나, EV 믹스 확대(14.5%)로 단기 수익성이 부정적으로 작용한다.\n\n두 기업 모두 원자재 상승 영향과 부정적 믹스로 이익 기대치를 하회할 전망이다. 현대차는 물량 감소와 HEV 둔화가 수익성에 부정적이라면, 기아는 물량 증가 효과가 EV 믹스 확대로 상쇄되기 쉽다 — 즉, 기아는 현대차보다 이익 하회 폭이 덜 클 수도 없다는 얘기다. 이는 현대차가 구조적으로 더 취약하다는 것을 시사한다.\n\n---\n\n### 3. AI 데이터센터: 메모리 패키지 기판 수요 가시성 급상승 → 추가 판가 인상 전망\n\nAI 데이터센터 내 일반 DRAM 및 NAND 채용량 증가, 그리고 주요 메모리 IDM의 신규 Fab 가동으로 메모리 패키지 기판 수요의 가시성이 빠르게 높아지고 있다. 특히 최근 주요 메모리 업체들의 기판 물량 선점 움직임이 포착되고 있어, 단순한 원가 전가를 넘어 공급자의 가격 결정력이 확대되는 구간에 진입했다는 판단이다.\n\n26년 4월 금·구리 등 주요 원재료 가격 상승을 반영한 일괄적인 판가 인상이 있었다. 당시의 목적은 원재료 상승에 따른 수익성 보전이었다면, 금번 추가 인상은 수요 증가와 기판 수급 우려에 기인한다. 26년말~27년초 LPDDR, GDDR 등 고부가 메모리 패키지 기판을 중심으로 추가적인 판가 인상이 예상된다. 공급자로서의 가격 결정력 확대는 이익 개선의 직접적인 촉매다.\n\n---\n\n### 4. 양자컴퓨팅: 아이온큐, 양산 체계 구축 완료 → 상용화 시점 앞당겨질 전망\n\n아이온큐는 양산 체계 구축을 완료하고 상용화 시점이 가시화되고 있다. 이온트랩 방식의 장점은 복잡한 대규모 알고리즘이나 속도·레이턴시 측면에서 초전도체 대비 우월하다는 점이다. 다만 이온을 레이저로 진동시켜 양자 게이트를 생성하는 난이도가 높아 확장성이 제한됐다. 이를 해결하기 위해 아이온큐는 작년 9월 옥스포드 아이오닉스를 인수해 레이저 대신 전류 기반 게이트 생성 기술을 확보했다. 이는 양자가 반도체화된 것으로, 게이트 생성과 제어 난이도가 낮아지고 양산이 가능해졌다.\n\n9월 21일 아이온큐는 국내 양자 스타트업 SDT와 파트너십을 체결해 구미에 아이온큐의 양자 메모리 패키징·제조·시스템 조립을 총괄하는 글로벌 허브를 구축할 예정이다. 아이온큐의 양산 체계 구현이 완료되면, 양자 해킹의 공격 표적이 될 수밖에 없는 인프라를 보호하기 위한 수요가 급증할 전망이다. 즉, 양자 해킹의 공격 범위 확대와 아이온큐의 상용화가 동시에 진입하는 구도다. 양자는 기술·보안·데이터 저장의 삼층적 가치를 갖춘 인프라다.\n\n---\n\n### 5. 현대차/기아 9월 글로벌 판매: 현대차 30.8만대(-16.0% y-o-y), 기아 28.0만대(+4.8%)\n\n현대차의 9월 글로벌 도매 판매는 30.8만대(-16.0% y-o-y)를 기록했다. 내수 4.9만대(-25.7% y-o-y), 해외 25.9만대(-14% y-o-y로 내수·해외 모두 동반 부진이다. 3Q26 도매 판매는 전년比 11% 감소하며 매우 부진한 실적이다.\n\n현대차의 9월 생산 대수는 34.1만대(-3.1% y-o-y)로 기록됐다. 국내 공장 생산 대수는 내수 부진으로 인해 전년比 7.1% 감소한 15.1만대에 그쳐, 해외 공장 생산은 전년比 0.4% 증가한 18.9만대를 기록했다. 저가 EV 모델 라인업의 부재가 내수 판매 부진의 주요 원인이다.\n\n현대차의 9월 친환경차 판매 대수는 8.2만대(-8.8% y-o-y)를 기록했다. EV 판매는 전년比 14.8% 감소한 2.6만대, HEV 판매는 전년比 3.3% 감소한 5.2만대를 기록했다. 국내 공장 파업과 주력 모델의 신차 출시 전 부진이 원인이다.\n\n기아의 9월 글로벌 도매 판매는 28.0만대(+4.8% y-o-y)를 기록했다. 내수 판매는 전년比 6.7% 감소한 4.6만대를 기록했다. 조업 일수 감소에도 불구하고 EV·HEV 판매 선방, 해외 시장에서는 인도·유럽·미국 시장 판매 증가세가 두드러졌다. 미국 HEV 증산, 유럽 EV 판매 증가, 인도 SUV 신차 효과가 판매 호조의 주요 원인이다.\n\n기아의 9월 생산 대수는 29.0만대(+2.2% y-o-y)를 기록했다. 조업일수 감소로 국내 공장 생산은 전년比 6.9% 감소했으며, 셀토스 신모델이 투입된 인도 공장과 텔루라이드·스포티지 HEV 모델 증산이 진행된 미국 공장의 생산량 증가가 기여했다.\n\n기아의 9월 친환경차 판매는 10.7만대(+50.5% y-o-y)를 기록했다. EV 판매는 전년比 59.3% 증가한 3.9만대, HEV 판매는 전년比 57.5% 증가한 6.6만대를 기록했다. 서유럽 EV 판매 호조가 지속 중이며, HEV 판매는 텔루라이드 HEV 증산과 스포티지 HEV 미국 현지 공장 생산 효과가 작용해 고성장세를 지속하고 있다.\n\n---\n\n### 6. 9월 미국 신차 판매: 현대/기아 역대 최대 기록, EV 판매 전방위 감소\n\n9월 미국 신차 판매는 전년比 5.5% 증가한 130만대로 예상됐다. 노동절 연휴와 영업일수 증가 영향이다. 계절조정 연환산 지수는 1,610만대로 전월 1,660만대를 소폭 하회했다. 3분기 합산 기준 판매는 전년比 0.4% 감소했다.\n\n9월 브랜드별 판매(전년比):\n\n- 현대(+9%), 기아(+18%), 제네시스(+19%), 도요타(+8%), 혼다(+16%), 마쯔다(+32%), 스바루(+13%).\n\n이란 사태로 고유가 지속되며 HEV 판매 호조세가 지속됐다. 도요타의 HEV 판매는 전년比 38% 증가하며 9월 기준 최다 판매를 기록했고, 현대차는 39% 증가하며 9월 기준 최다 판매를 기록했다. 기아 HEV 판매는 전년比 152% 증가했다. 디트로이트 3사(GM, Ford, Stellantis)는 EV 판매 감소로 부진했다.\n\n9월 인센티브는 전년比 7.3% 상승한 3,574달러를 기록했다. 9월 내 연기관차와 하이브리드 인센티브는 상승했으나, EV 인센티브는 22% 하락했다. 기아 쏘렌토는 48개월 제로 금리 프로모션이거나 3,000달러 캐쉬백 프로모션이 진행됐으며, 쉐보레 실버라도 1500은 5년간 제로 금리 프로모션이 진행됐다. 업체들의 금리 프로모션이 9월 신차 대출 금리를 4bp 하락시키기도 했다.\n\n역대 최대 9월 판매 기록을 수립한 현대차의 주요 차종은 투싼(+32%), 팰리세이드(+52%), 쏘나타(+39%), 싼타페(+32%) 등이었다. 반면, 아이오닉 5, 6, 9 등 EV 판매는 -65%~-100%의 판매량 감소를 기록했다.\n\n기아는 9월 판매가 전년比 18%나 증가하며 역대 최대 실적을 경신했다. 셀토스(+66%), 텔루라이드(+42%), 소렌토(+37%) 등 모델이 판매 증가를 견인했으며, HEV 판매는 152% 폭증했다. IRA 폐지 여파로 EV6(-61%), EV9(-37%) 판매는 부진했다.\n\n---\n\n### 7. 인터넷/게임: 스페이스X, 엔비디아 칩 구매 위해 400억 달러 자금 조달 추진\n\n스페이스X는 엔비디아 칩 구매를 위해 약 400억 달러(약 53.6조 원)의 자금 조달을 추진 중이다. 은행 대출 약 100억 달러와 투자등급 채권 발행 약 300억 달러로 구성되며, 사모펀드 아폴로가 거래를 주도할 예정이다.\n\n이번 거래로 스페이스X와 엔비디아의 협력 관계가 강화될 것으로 보이나, 부채 증가와 자본 지출 부담 등 스페이스X의 재무건전성 우려가 제기된다. AI 시대에 AI 칩의 공급자 위치를 확보하는 엔비디아에게는 긍정적이다. 다만 스페이스X의 재무 건전성이 악화될 경우, 투자자들이 엔비디아에 대한 수요를 조정할 수 있기 때문에 엔비디아 주가 변동성 확대 가능성도 배제할 수 없다.\n\n---\n\n### 8. 현대차/기아 9월 글로벌 판매: 현대차 30.8만대(-16.0% y-o-y), 기아 28.0만대(+4.8%)\n\n현대차의 9월 글로벌 도매 판매는 30.8만대(-16.0% y-o-y)를 기록했다. 내수 4.9만대(-25.7% y-o-y), 해외 25.9만대(-14% y-o-y로 내수·해외 모두 동반 부진이다. 3Q26 도매 판매는 전년比 11% 감소하며 매우 부진한 실적이다.\n\n현대차의 9월 생산 대수는 34.1만대(-3.1% y-o-y)로 기록됐다. 국내 공장 생산 대수는 내수 부진으로 인해 전년比 7.1% 감소한 15.1만대에 그쳐, 해외 공장 생산은 전년比 0.4% 증가한 18.9만대를 기록했다. 저가 EV 모델 라인업의 부재가 내수 판매 부진의 주요 원인이다.\n\n현대차의 9월 친환경차 판매 대수는 8.2만대(-8.8% y-o-y)를 기록했다. EV 판매는 전년比 14.8% 감소한 2.6만대, HEV 판매는 전년比 3.3% 감소한 5.2만대를 기록했다. 국내 공장 파업과 주력 모델의 신차 출시 전 부진이 원인이다.\n\n기아의 9월 글로벌 도매 판매는 28.0만대(+4.8% y-o-y)를 기록했다. 내수 판매는 전년比 6.7% 감소한 4.6만대를 기록했다. 조업 일수 감소에도 불구하고 EV·HEV 판매 선방, 해외 시장에서는 인도·유럽·미국 시장 판매 증가세가 두드러졌다. 미국 HEV 증산, 유럽 EV 판매 증가, 인도 SUV 신차 효과가 판매 호조의 주요 원인이다.\n\n기아의 9월 생산 대수는 29.0만대(+2.2% y-o-y)를 기록했다. 조업일수 감소로 국내 공장 생산은 전년比 6.9% 감소했으며, 셀토스 신모델이 투입된 인도 공장과 텔루라이드·스포티지 HEV 모델 증산이 진행된 미국 공장의 생산량 증가가 기여했다.\n\n기아의 9월 친환경차 판매는 10.7만대(+50.5% y-o-y)를 기록했다. EV 판매는 전년比 59.3% 증가한 3.9만대, HEV 판매는 전년比 57.5% 증가한 6.6만대를 기록했다. 서유럽 EV 판매 호조가 지속 중이며, HEV 판매는 텔루라이드 HEV 증산과 스포티지 HEV 미국 현지 공장 생산 효과가 작용해 고성장세를 지속하고 있다.\n\n---\n\n### 9. 현대차/기아 9월 글로벌 판매: 현대차 30.8만대(-16.0% y-o-y), 기아 28.0만대(+4.8%)\n\n현대차의 9월 글로벌 도매 판매는 30.8만대(-16.0% y-o-y)를 기록했다. 내수 4.9만대(-25.7% y-o-y), 해외 25.9만대(-14% y-o-y로 내수·해외 모두 동반 부진이다. 3Q26 도매 판매는 전년比 11% 감소하며 매우 부진한 실적이다.\n\n현대차의 9월 생산 대수는 34.1만대(-3.1% y-o-y)로 기록됐다. 국내 공장 생산 대수는 내수 부진으로 인해 전년比 7.1% 감소한 15.1만대에 그쳐, 해외 공장 생산은 전년比 0.4% 증가한 18.9만대를 기록했다. 저가 EV 모델 라인업의 부재가 내수 판매 부진의 주요 원인이다.\n\n현대차의 9월 친환경차 판매 대수는 8.2만대(-8.8% 체보다 시장의 눈높이 이동이 핵심 변수\n\n3분기 잠정실적 발표 전날인 10월 7일 코스피는 -2.0%, 코스닥은 -2.3%로 2%대 내외의 약세로 마감했다. 당시 삼성전자 3분기 잠정실적 컨센서스는 106조원이었던 것을 감안하면, 실적이 컨센서스를 상회하더라도 주가 반응이 제한적일 수 있는 구조다. \n\n왜냐하면 반도체 업황 악화 우려보다는 **메모리 3사(MCU)의 2027~2028년 증설 가동 이후에도 고 마진과 타이트한 수급이 유지될 수 있는지에 대한 시장의 고민이 이미 반도체주에 반영되었기 때문이다.** 실제로 외국인의 코스피 내 반도체 순매도는 9월 16.2조원에서 10월 4.1조원으로 감소했는데, 이는 AI 인프라 수요 확대로 인한 차익실현뿐 아니라 이러한 중기 이익 지속성에 대한 고민이 반영된 측면이기도 하다([KEY POINT](#key-point))。\n\n실제로 10월 7일 기준 2027년 코스피 연간 영업이익 컨센서스는 1,330조원이고, 삼성전자와 SK하이닉스는 각각 554조원, 401조원이다. 이 수치가 실적 발표 후 얼마나 변화하는지가 **첫 번째 관전 포인트**, 그리고 실적 발표 직후 주가 반응과 외국인 수급의 실질적 변화가 **둘째 관전 포인트**다。특히 잠정실적 특성상 수치만 공개하고 컨퍼런스콜이 없어 2028년까지의 중기 업황을 단기간에 판단하기 어렵다는 점, 그리고 10월 8일 옵션만기일과 12일 ETF 리밸런싱, 금요일 휴장이라는 단기 수급 요인들이 개입될 가능성이 있기 때문에, 실적 발표 후의 시장 반응을 단순히 실적 수치와 연결해서 읽는 것보다는 **수급 변화의 방향성과 영업이익 추정치 수정 여부**를 동시적으로 분석해야 한다。\n\n---\n\n### 2. AI 밸류체인의 구조적 분기점: 삼성전자-마이클론-메모리 가격의 상호 의존성\n\n삼성전자와 마이크론의 3분기 실적 모두 컨센서스 상회 가능성이 높다고 전제하면, 이를 기반으로 AI 밸류체인의 성장 모멘텀이 재확인된다. 하지만 이 로직이 실제로 반도체주의 주가를 끌어올릴 수 있는지의 문제는 **메모리 가격 상승과 HBM4 램프업의 현실적 확인**에 달려 있다([대신증권 Key Point](#key-point))。\n\n10월 7일 시장은 이미 마이크론의 3분기 실적 호조에도 불구하고 주가 반응이 제한되었다는 점을 보여준다. 이는 AI 인프라 수요 증가가 반도체업체의 이익을 높일 수 있으나, 그만큼의 주가 반응을 이끌어내기 위해서는 **메모리 가격의 지속적 상승** — 즉, AI 수요가 MCUs의 생산 증가 속도를 앞섰다는 명백한 수급 불균형 —가 반드시 동반되어야 한다는 신호다。현재로서는 9월 한국 반도체 수출 호조라는 선행 지표가 이를 부분적으로 뒷받침하지만, 삼성전자 잠정실적에서 드러나는 가격/판매량 데이터가 결국 이 논리를 결론짓는 변수다。\n\n---\n\n### 3. 코스피 밸류에이션이 제공하는 수렴 구간: 7,700선까지의 수리 공간\n\n12개월 선행 PER이 5.26배로 역사적 저점권에 접어든 상황에서, 코스피는 **선행 PER 6배**(현재 5.26배)만으로도 7,700선을 탈환할 수 있는 수리 공간을 가지고 있다([대신증권 Key Point](#key-point))。이 수치는 실적 불확실성 완화만으로도 달성 가능한 지수대다。\n\n이 밸류에이션 구조는 고금리 환경에서의 주가 저항력과 동일한 맥락을 갖는다. 미국 10년물 금리가 5.3%를 돌파했던 9월 말에도 코스피가 6,800선을 하회하는 수준에서 안정된 이유는, **시스템 수익률의 극저점에 도달한 테이블탑 구조**가 금리 상승 압력에 대해 일정 시간 동안 버틸 수 있는 힘을 제공했기 때문이다([메리츠증권](#meritz))。현재 6,800선은 이 구조의 하단 지지선으로, 만약 금리 안정과 유가 안정이 동시에 확인되면 7,700선까지의 추가 상승 여력이 충분하다는 결론으로 이어진다。\n\n---\n\n### 4. 금리-유가의 교차 압력: 프랑스 10년물 4.8%가 의미하는 것\n\n프랑스 10년물 국채금리가 5%에 육박했던 10월 6일, 마린 르펜 국민연합(RN) 의원이 GDP 대비 국가부채 비율을 60%로 제한하고 재정적자를 축소하겠다는 공약을 발표하자, 프랑스 10년물 금리는 4.8%로 하락했다([대신증권 Key Point](#key-point))。이 하락은 단순한 금리 레벨 조정이 아닌, **프랑스 대선을 둘러싼 정치 불확실성의 경계심이 시장에 반영된 후에 수급이 돌아오는 구조적 테스트**로 해석해야 한다。\n\n즉, 5%대 후반에서 4.8%로의 하락은 부채 비율 제한이라는 구체적 재정 축소 방안이 제시된 결과다. 그런데 이 방안 자체는 60%라는 수치가 현재 프랑스의 GDP 대비 국가부채 비율을 크게 하회한다는 사실을 전제로 하고 있다([대신증권](#dss-key-point)). 따라서 4.8%라는 수준이 지속되기 위해서는 **르펜이 제시한 재정 경색 방안이 실제로 실행 가능한 실천 계획**으로 구체화되어야 한다는 전제가 깔려 있다。이 전제가 흔들리면 프랑스 10년물은 5%대 후반으로 다시 반등할 수밖에 없다。이 상황이 전 세계 장기금리의 상방 압력을 높이는 변수로 작용하는 구조다。\n\n---\n\n### 5. 미국 9월 CPI: 시장의 냉정한 이해와 실제 둔화의 함의\n\n대신증권은 미국 8월 PCE 물가 둔화가 BEA의 산출방식 변경 영향이 반영된 만큼 시장 영향이 제한적이었음을 언급하며, 9월 CPI에서 둔화세가 재차 확인될 경우 인플레이션 경계 완화와 함께 채권금리 하향 안정에 기여할 것으로 전망한다([대신증권 Key Point](#dss-key-point))。\n\n이 논평은 중요한 함의를 내포한다. 8월 PCE가 0.2%p 하락한 것은 1) 7월의 0.3%p 하락으로 이어져 전월대비 0.5%p 누적 감소를 만들고, 2) 전년동기대비 2.39%로 8월의 2.40%를 하회해 2개월 연속 둔화라는 구조적 전환점을 만들어냈다는 점에서, 이는 단순한 산출방식 변경의 영향이 아니었다는 것을 시사한다（BEA의 방식 변경은 2026년 1월부터 시행된 것으로, 8월 PCE는 그 영향을 이미 받아들인 수치）。따라서 9월 CPI의 둔화가 재차 확인된다면, 그것은 **구조적 둔화의 지속**을 의미하고, 이는 채권금리의 하향 안정화를 위한 핵심 신뢰 지표가 된다。\n\n---\n\n### 6. IBKS Quant: 어닝서프라이즈의 구조적 조건 – 컨센서스 상향 → 애널리스트 상향 우위 → 애널리스트 컨센서스 상향의 3단계 확인\n\nIBK투자증권의 Quant 분석은 어닝서프라이즈의 발생 가능성을 구조적으로 판단하는 프레임워크를 제시한다:\n\n1. **헤드라인 컨센서스 상향**: 직전 한 달간 컨센서스가 상향된 종목\n2. **애널리스트 상향 우위**: 상향한 애널리스트 수 > 하향한 애널리스트 수\n3. **애널리스트 컨센서스 상향**: 상향 우위 환경에서도 컨센서스 자체가 상향되는 중\n\n이 조건이 3단계로 쌓일수록 어닝서프라이즈율과 Hit Ratio(조건 충족 종목 중 실제 서프라이즈를 기록한 비율)가 동시에 유의미하게 상승한다는 실험 결과는, 어닝 시즌 전략에서 단순한 컨센서스 추종이 아닌 **애널리스트 컨센서스 구조의 방향성**을 동시에 분석해야 한다는 것을 의미한다([IBK Quant Spot Brief](#ibk-quant-spot-brief))。\n\n---\n\n### 7. 인도 기준금리 인상: 4년 만의 긴축 전환의 실물 경로\n\n인도 중央银行(RBI)은 2026년 10월 5일 기준금리를 5.25%에서 5.50%로 25bp 인상하며 약 4년 만의 금리 인상을 발표했다([하나증권](#hwasoo-india))。RBI는 통화정책 기조를 기존 “중립”에서 “상황에 따라 긴축 강도를 조절하는 방향(calibrated tightening)”으로 전환했다. 이는 단순한 금리 인상이 아니라, **긴축의 정책적 목적을 명시적으로 인정한 전환**이다。\n\n핵심 원인은 다음과 같다:\n\n- **고유가**: 국제유가가 인도의 원유 수입 비용을 상승시키고,\n- **불충분한 몬순(우기)**: 농업 생산을 억제하여 식품 가격을 끌어올리며,\n- **전산업 물가 확산**: 식품·에너지 가격 상승이 서비스, 제조업 등 전반으로 확산되고 있다는 것이다。\n\n그러나 이 금리 인상의 전방향성은 명확하다. 인도의 금리 인상은 **고유가와 기후 피해로 인한 물가 상승 압력의 지속 여부에 의존**한다. 따라서 2026년 10월 이후 인도 경제의 실물 지표(특히 농업 생산, 수출, PMI 등)가 금리 인상의 정책적 효과를 제대로 전달하고 있는지에 관심이 필요한 시점이다.\n\n---\n\n### 8. 중국 929 정책 패키지: 구조적 통화 완화 vs 미중 금리차 역전 리스크\n\n9월 29일 중국은 통화정책 수단 조정과 부동산 이자 지원 정책을 발표했다([유진투자증권](#yugjin-china))：\n\n#### A. 구조적 통화 완화의 내용\n1. **담보보완대출(PSL)**\n   - 금리 1.5%로 25bp 인하\n   - 지원 범위 확대: 6개 네트워크 건설까지\n2. **과학기술 혁신 및 기술 개조 재대출**\n   - 한도 1.4조 위안으로 2,000억 위안 확대\n   - 지원 비율: 60% → 100%\n3. **농업 및 소상공인 지원 재대출**\n   - 한도 4.85조 위안으로 5,000억 위안 확대\n\n#### B. 부동산 이자 지원\n- 생애 첫 주택 구매자 (매매가 <150만 위안, 면적<120㎡): 이자 1%p 지원, 최대 기한 5년, 최대 100만 위안\n- 재원: 중앙정부 90%, 지방정부 10%\n\n#### C. 구조적 통화 완화의 의미\n이 패키지는 **전면적 지준율/정책금리 인하를 미뤘다는 신호**로 해석된다。중국은 은행의 순이자마진(NIM) 압박과 미중 금리차 역전 리스크 두 가지 이유로 기준금리를 내리는 대신 PSL을 사용했다：\n\n- **NIM 부담**: 2Q26 기준 은행 NIM은 1.41%로 전분기대비 0.1%p 개선\n- **미중 금리차 역전**: 9월 10년물 미국 국채금리가 5.3%를 돌파하면서 미중 금리차가 330bp 이상 역전. 미국, 일본, 유럽의 금리 인상이 계속되는 상황에서 중국이 기준금리를 내리면 역전이 더 확대되면서 자본유출과 환율 부담이 커질 수 있다([대신증권 Key Point](#dss-key-point))\n\n#### D. 핵심 가치: 신형 인프라 투자 확대\n패키지의 핵심은 부동산이 아닌 **신형 인프라 투자 확대**다。PSL은 중앙은행이 정책 은행에게 직접 장기자금을 공급하는 구조로, 일반 채권과 달리 시장 금리와 수급 상황에 자유롭게 움직이는 것이 아니라 상대적으로 안정적인 장기 자금 확보가 가능하다。PSL 금리 인하가 5년물 정책금융채 발행금리 수준으로 수렴하면, 수자원망, 신형 전력망 등 6대 네트워크 프로젝트에 대한 저비용 중장기 대출 공급이 가능해진다。\n\n15.5계획 기간 6대 네트워크 투자액은 14.5 계획 대비 21% 증가한 26.9조 위안으로, 그 중 컴퓨팅망(+64%), 물류망(+42%), 신형 전력망(+39%)의 투자 증가폭이 가장 크다([유진투자증권](#yugjin-china))。이 세 네트워크는 AI 인프라 밸류체인과 직접적으로 연결되는 분야다：컴퓨팅망은 AI 서버, 물류망은 AI 데이터센터 물류, 신형 전력망은 AI 데이터센터의 고전력 요구를 지원하는 인프라다。\n\n---\n\n### 9. 중국 고정자산투자 부진: 토지재정 약화 → 정부성기금예산 수입 19.0% 감소의 구조적 근원\n\n중국 1~8월 고정자산투자는 전년동기대비 7.2% 감소했다([신한투자증권 China Fix Investment](#shinhan-China-Fix-Investment))。최대 원인은 부동산개발투자 급감이지만, 인프라투자 부진도 영향을 미쳤다。그 배경에는 지방정부의 재정여력 약화가 자리한다。\n\n중국의 4대 재정계정 중 경기와 투자에 직접적인 영향을 미치는 것은 ① 일반공공예산과 ② 정부성기금예산이다。일반공공예산은 조세를 기반으로 정부 운영과 민생·공공서비스 지출을 담당하고，정부성기금예산은 토지사용권 매각수입을 핵심 재원으로 하며，지방특별채와 함께 인프라 투자와 도시개발에 활용된다。\n\n올해 두 계정의 흐름은 뚜렷하게 엇갈린다：\n\n| 항목 | 1~8월 수입 | 1~8월 지출 |\n|------|------------|-----------|\n| 일반공공예산 | +5.7% | +1.2% |\n| 정부성기금예산 | -19.0% | -17.0% |\n\n핵심은 토지재정 약화다。2025년 정부성기금예산 수입에서 토지사용권 매각수입이 차지하는 비중은 71.9%다。부동산 침체가 지속되면서 1~8월 토지사용권 매각수입은 전년동기대비 28.6% 감소했다。수입 기반 약화는 정부성기금의 지출 여력을 제약했다。8월 말 기준 지출 진도율은 43.8%로 전년동기 50.1%를 크게 하회한다。\n\n---\n\n### 10. ETF 리밸런싱 수급 영향: 리밸런싱 날짜 변화와 수급 집계 방식의 복잡성\n\n10월 옵션 만기일에 맞춰 AUM 22조원 가량의 ETF 리밸런싱이 예정됐다([신한투자증권 ETF Rebalancing Analysis](#shinhan-etf-rebalancing))。지수를 추종하는 패시브 자금의 규모가 클수록 시장을 흔들 수 있는 영향력이 높아지므로, 리밸런싱 날짜가 평소와 다르다면(이번엔 9일 휴무로 인해) 주가와 거래량이 크게 요동칠 가능성이 높다。\n\n주요 지수의 리뷰 주기와 반영 방식은 다음과 같다：\n\n| 지수 | 리뷰 주기 | 발표 시점 | 반영 시점 | 참고사항 |\n|-------|-------------|------------------|--------------------|----------|\n| MSCI | 2,5,8,11월 | 월 중순 발표 | 월 마지막 영업일 종가 | 중순 발표 → 중순 반영 |\n| S&P500 | 3,6,9,12월 | 반영 1~2주 전 발표 | 셋째 주 금요일 종가 | 반영 1~2주 전 발표 |\n| 나스닥100 | 정기 리뷰 외 | 사건 발생 시 조기 편입 | 즉시 | 조기 편입의 경우 내부자 락업 해제로 유동시총이 올라가면서 추가적인 편입비 조정도 발생할 수 있음 (Spacex 사례 참조) |\n\n국내 지수는 코스피200, 코스닥150이 6, 12월 반기 리뷰를 하며, KRX 지수운영위원회가 반영 2~3주 전 발표해 선물옵션 만기 다음 날 반영한다。지수 리밸런싱은 업종별 대표성, 시가총액, 거래대금 순위를 반영한다。\n\n---\n\n### 11. CFTC 연방 규제 착수: 토큰화 주식 인프라 확대의 첫 발걸음\n\nCFTC가 디지털자산 마진·레버리지 거래에 대한 연방 규제체계 도입 절차에 착수했다([신한투자증권 CFTC Update](#shinhan-cftc))。CLARITY Act 입법은 지연되고 있지만, SEC와 CFTC가 기존 권한을 활용해 시장 인프라를 먼저 제도화하고 있다。향후 거래소의 경쟁 기준도 거래량보다 **연방 규제체계 편입 여부와 중개·청산·수탁 인프라 확보 여부**로 이동할 가능성이 높다。\n\n이 규제 착수가 의미하는 것은, 디지털자산 마진·레버리지 거래가 기존 OTC 중심에서 거래소 거래로 이동할 수 있는 제도적 토대가 마련된다는 점이다。또한 토큰화 주식 인프라도 규제 체계 내에서 확대될 가능성이 열린다。현재 디지털자산 거래소의 경쟁력은 규제 편입 여부와 인프라 수준에 좌우될 가능성이 높아진다。\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n매크로, 채권, 산업섹터 전반을 종합하면, 달러 강세와 고금리 환경이 지속되며 글로벌 자금 흐름과 채권 시장에 영향을 미치고 있는 것으로 보인다. 특히 AI 투자와 관련된 민간채권 발행이 유동성 경쟁을 유발하며, 경기 확장 국면의 후반부에 있어 소비와 수익의 루프가 밀폐되지 못하는 구조적 한계도 나타나고 있다. 이에 따라 시장의 변동성과 불확실성이 높아지고 있으며, 동아시아 통화 약세와 중국 소비 부진 등이 추가적인 압력으로 작용할 수 있다. 이러한 상황 속에서 투자자들은 구조적 변화와 단기적 요인의 상호작용을 고려한 접근이 필요해 보인다."}]}</script>
