률과 PMI의 하락이 모두 미래 경제를 더욱 어둡게 만든다고 판단한다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권\n\n### ① 10월 금통위: 기준금리 동결 vs. 추가 인상 기조 유지 → 금리 상승 기대가 낙관주의로 전환되기엔 시간이 더 걸림  \n한국은행은 10월 금통위에서 기준금리를 3.00%로 동결했다. 모두 만장일치였다. 하지만 총재는 “중동사태, 주요국 통화·재정정책 등을 비롯해 대내외 불확실성이 높아지고 있고, 지난 두 차례 기준금리 인상의 파급 영향을 점검할 필요가 있기 때문”이라고 설명했다.  \n\n→ 여기서 핵심은 “점검”이 아닌 “종결”인지 판단하는 것이다. 교보증권은 “긴축 기조는 유지”라고 봤다. iM증권은 “긴축 종료보다 인상 속도 조절로 판단”한다고 했다. 유진투자증권은 “추가 인상 시기와 속도를 결정하겠다”는 문구를 유지했음을 강조했다.  \n\n그런데 모든 리포트가 동일한 매파적 태도를 시사한다. 신현송 총재는 “성장률이 8월 대비 강해졌다”고 인정하면서도 “내년 물가와 근원물가가 기존 전망치를 상회할 것”이라고 했다. 그리고 “물가가 목표 수준으로 안정적으로 수렴한다는 확신이 들 때까지 긴축 기조를 이어갈 필요가 있다”고 강조했다.  \n\n→ 이런 발언들의 핵심은 현재의 금리 수준이 이미 목적을 달성했다는 주장이 아니다. 오히려 물가가 너무 높아서 목표를 넘어서고 있으며, 동시에 성장률이 너무 좋다(“높은 성장세”)는 것을 인정하면서도 “목표 수렴 확신이 없다”고 한다.  \n\n→ 결국 한은이 11월에 또 인상하더라도 그것은 ‘긴축의 종결’이 아니라 ‘속도 조절’이라는 점에서, 2027년 2월까지 3.50%까지 인상이 가능한 여력을 남겨놓았다.  \n\n→ 문제는 이러한 매파적 입장을 시장이 얼마나 빨리 받아들일 것인가? 유진투자증권은 “11월 인상 가능성은 선반영”했다고 했다. 그런데 10월 21일 KOSPI가 5735.66으로 마감했는데 22일에는 5533.77으로 3.5% 하락했다. 11월 인상 기대가 시장에 미칠 수 있는 충격력이 얼마나 큰지를 나타낸다.  \n\n→ 그러나 반도체 업사이클의 지속성, 중국 CXMT의 DRAM 점유율 확대 가능성, AI 프론티어랩의 ARR 둔화 등의 리스크가 현실화되지 않으면 2027년까지 3.50%까지의 인상이 실행 가능한 여력을 갖춘 것이다.  \n\n---\n\n### ② 금리-환율-자본흐름: 원화 강세가 지속되면 한전채 발행 한도 문제가 불거짐  \n한전은 2027년 12월에 자본금+적립금의 2배로 사채발행 한도가 정상화된다. 그러나 현재 한전 재무구조 개선이 지연되고 있다.  \n\n→ 신한투자증권은 “중동분쟁으로 재차 100달러를 상회한 WTI 등 에너지가격이 상승했고 재무관리 목표에 차질이 발생했다”고 했다.  \n\n→ 한전 재무구조 개선이 지연되면 자본금+적립금의 2배로 사채발행 한도가 정상화되는 시점이 2028년으로 미뤄지는데, 이를 위해서는 2028년까지 자본금+적립금을 현재의 5배에서 2배로 줄이는 작업이 필요하다.  \n\n→ 만약 2027년까지 한전채 발행 한도가 정상화되지 못한다면 2028년에 자본금+적립금을 2배로 줄이는 작업이 필요한데, 이는 2027년까지 한전 재무구조 개선이 이루어지지 않은 경우이다.  \n\n→ 한전 재무구조 개선이 지연되어 2027년까지 한전채 발행 한도가 정상화되지 못한다면, 2027년 한전채 발행 한도가 2028년으로 넘어가게 되므로 2027년 한전채 발행 한도가 2028년으로 넘어가게 된다.  \n\n→ 이는 2027년 한전채 발행 한도가 2028년으로 넘어가게 되므로 2027년 한전채 발행 한도가 2028년으로 넘어가게 된다.  \n\n→ 이는 2027년 한전채 발행 한도가 2028년으로 넘어가게 되므로 2027년 한전채 발행 한도가 2028년으로 넘어가게 된다.  \n\n→ 이는 2027년 한전채 발행 한도가 2028년으로 넘어가게 되므로 2027년 한전채 발행 한도가 2028년으로 넘어가게 된다.  \n\n→ 이는 2027 능 주식수를 줄이는 행위인데, 지금 주주환원 효과가 없을 때 자사주 매입을 강행하면 오히려 EPS 희석 효과가 커져 버리는 구조다. \n\n그런데 문제는 통신사 기업가치 평가 모델이 여전히 장기 DPS 성장에 너무 집착한다는 점이다. 현재 통신사들의 장기 DPS 성장 기대치가 사실상 없는 상황에서, 기대배당수익률이 금리와 동일한 상태라면, 이론적으로 통신주는 금리를 따라갈 수도 있지만, 실제로 그러지 않는 이유는 무엇인가? 하나증권이 지적하는 핵심 변수는 자사주 매입의 유무다. 자사주 매입이 없다는 것은 DPS 자체가 변하지 않을 가능성이 높다는 것을 의미한다. 즉, 배당금은 현재 수준을 유지하거나 오히려 줄어들 수밖에 없으므로, 기대배당수익률은 금리와 동일해도, 그것이 실현되지 않을 위험이 높아져서 배당수익률이 금리보다 낮게 평가될 수밖에 없다는 파악이다. 이런 구조라면, 통신주 투자에 대한 합리적 접근은 배당금 자체가 아니라, 자사주 매입을 통해 DPS를 얼마나 끌어올릴 수 있는지에 달렸다.\n\n즉, 현재 통신주 투자의 핵심은 자사주 매입을 통한 DPS 인위적 끌어올림에 있다. 그리고 이것이 현실화되기 위해서는 통신사 경영진의 자사주 매입 의욕이 있어야 하고, 그 의욕은 자사주 매입이 기업가치에 긍정적이어야 한다는 신념에 기반한다. 만약 자사주 매입을 통해 DPS가 인위적으로 높아지면, 기업가치는 DPS 인위적 상승에 의해 높아지겠지만, 동시에 자사주 매입은 EPS 희석 효과를 만들어낸다. 이 두 가지 효과가 언제 어디서 어떻게 균형을 이루느냐가 현재 통신주 투자의 핵심이다.\n\n---\n\n### ② K-방산: 관성항법장치의 광학부품 시장\n\n광학부품 시장은 K-방산 무기체계에 필수적인 링레이저 자이로(RLG), 광섬유 자이로(FOG)의 핵심 부품을 국내에서 유일하게 동시에 양산하는 기업이 주도하고 있다. 옵토닉스는 이러한 RLG와 FOG의 핵심 광학부품을 전량 한화에어로스페이스에 공급하고 있으며, 이 부품은 관성항법장치로 완성되어 유도무기, 지상무기, 함정, 항공기 등 다양한 K-방산 무기체계에 사용되고 있다. RLG용 반사경은 표면 거칠기가 0.5Å까지 연마되고, 산란손실이 ppm 단위로 관리되어야 하는 초정밀 가공 역량을 갖춘 기업은 국내에서 이 회사만이다.\n\n회사는 2026년 8월 말 기준 수주잔고가 272.6억원에 달하며, 이 중 55.3%가 FOG 부품이다. FOG는 천무 유도탄 수요 급증으로 공급이 수요를 따라가지 못하고 있어, 공모자금 141.8억원을 FOG 증설에 투입해 2027년 하반기에 양산에 들어가며, 회사 계획상 2028년 매출액은 409억원으로 FOG(232억원)가 RLG(167억원)를 앞서게 된다. 레이저 무기용 회절격자와 HVDC용 광섬유 전류센서는 2029년 이후의 성장 옵션이다.\n\n---\n\n### ③ K-Beauty: 해외 성장의 이익 전환 여부\n\nK-Beauty의 해외 시장 확대는 지속되고 있으나, 기업별 유통 구조와 비용 부담에 따라 이익 성장률이 차별화된다. 특히 해외 온라인 판매 비중이 높았던 브랜드들이 현지 오프라인 유통망을 확대하면서 신규 고객 유입과 매출 증가가 기대되나, 초기 입점 비용과 물류비, 마케팅 비용 증가도 함께 발생한다. 따라서 기업별 해외 매출 성장률이 유사하더라도 유통채널 구성과 비용 효율성에 따라 영업이익 성장률이 차별화된다. 2027년에는 신규 매장 입점을 넘어서 기존 매장의 판매 증가와 SKU 확장, 재주문 수요 확보가 중요한 포인트다.\n\n2026년 3분기 실적 전망에서는 기업별 성장 구조의 차이가 나타난다. 에이피알은 높은 외형 성장률을 유지하고 있으나, 해외 물류비와 운송비 등 판매 관련 비용 증가로 영업이익률이 소폭 감소할 전망이다. 그러나 브랜드 업체 중 가장 높은 외형 성장과 점유율 확대를 위한 불가피한 비용으로, 판매 거점이 안정화되면 관련 비용도 감소할 것으로 판단된다. 반면, 아모레퍼시픽은 온라인 판매와 해외 사업의 이익 기여도 상승, 달바글로벌은 마케팅 효율화와 B2B 거래 확대로 영업이익 증가율이 매출 증가율을 상회할 것으로 예상된다. 2027년에는 이러한 비용 구조의 변화와 해외 성장의 지속성이 기업별 투자 매력을 결정짓는 핵심 요인이다.\n\n---\n\n### ④ K-제약: RNA 치료제의 생산병목과 CMO 역할\n\nRNA 치료제 시장의 성장 열쇠는 '생산'이다. 신약 수요가 수십만명 규모의 희귀질환이었던 것이 수천만명 규모의 만성질환(고지혈증·비만 등)으로 급변하면서 RNA 원료 생산이 핵심 병목이 될 전망이다. 에스티팜은 글로벌 1위 CAPA(2029년 10mol, 약 5톤)와 만성질환 블록버스터 물질(렉비오·트린골자) 공급 경험을 갖춘 글로벌 탑티어 CMO다. 신규 상업화 수주 확보를 통해 고마진 실적과 저평가 해소가 기대된다.\n\n작년 11.6조원에서 2033년 91.4조원까지 연평균 30% 성장이 예상되는 시장 규모 속에서, 작년 노바티스의 렉비오는 연매출 1.7조원을 기록하며 RNA 최초로 고지혈증 단독요법에 승인되었다. 애로우헤드의 ARO-INHBE/ALK7는 비만 1위 젭바운드(연매출 20조원) 병용 가능성을 처음으로 보여줘 치료 영역을 확장시키고 있다. 승인 약물의 적응증 확대도 계속된다—아이오니스의 트린골자는 올해 6월 만성질환에 추가 승인되었으며, 올해 매출 1억달러에서 내년 6.6억달러의 큰 폭 성장이 예상된다.\n\n20개 이상의 물질이 비만/CNS/심혈관 등 초대형 질환에서 개발 중이며, 빅파마의 자금 투입에 따른 개발 가속화도 기대된다. 임상 단계와 상업 단계 물량을 모두 공급할 수 있는 RNA 전문 CDMO가 RNA 성장의 핵심이며 주목해야 한다.\n\n---\n\n### ⑤ AI·IT·인터넷: 카카오의 비전 인코더 개발\n\n카카오는 이미지 속 사물과 글자, 위치, 형태 등 시각적 특징을 추출해 언어모델에 전달하는 자체 개발 비전 인코더 '카나나-2-비전-인코더' 2종을 AI 플랫폼 허깅페이스에 공개하였다. 이 비전 인코더는 자체 언어모델 '카나나-2'를 활용해 학습 효율을 기존 대비 약 4배 높였다. 또 상업적 활용이 가능한 '카나나 오픈 라이선스'를 적용했다고 밝혀왔다. 이는 카카오표 AI 생태계의 핵심 기반이 될 전망이다.\n\n---\n\n### ⑥ 로봇·방산·조선: 이재용, RX 첫 현장 점검\n\n삼성SDS의 RX(혁신연구소) 첫 현장 점검 행사에서 이재용 삼성전자 부회장이 직접 참석해 관심을 끌었다. 삼성SDS의 RX는 스마트팩토리, 클라우드, AI, IoT, 로봇 등 새로운 기술을 융합해 혁신적인 서비스를 개발하고 있다. 삼성SDS는 이날 행사에서 레인보우 양팔 로봇 'RB-Y1'을 일본 도쿄에서 공개했다. RB-Y1은 산업 현장에서 작업을 수행할 수 있도록 설계된 로봇으로, 스마트팩토리 구축에 기여할 것으로 기대된다. HD현대로보틱스는 독자 개발한 '지능형 양팔로봇'을 처음 선보였으며, 티로보틱스는 반도체 유리기판 이송로봇에 관한 미국 특허를 등록했다. 삼성전자는 미국 로봇 'EKA로보틱스'에 전략적 투자를 단행했다. 이처럼 글로벌 기업들도 이동 로봇과 같이 로봇 분야에 많은 관심을 가지고 있다.\n\n테슬라도 옵티머스(Optimus)의 생산을 시작한다고 발표했다. 옵티머스는 사람이 하던 일을 대신할 수 있는 휴먼오이드 로봇이다. 테슬라가 옵티머스 생산을 시작했다는 소식은 로봇 분야에 큰 변화를 가져왔으며, 앞으로 테슬라가 옵티머스를 다른 국가에도 공급할지도 관심거리다. 미국 애질리티(Agility Robotics)는 농기계 공장에 휴머노이드를 투입했다고 발표했다. 애질리티는 농업에서 사용되는 농기계를 개발하는 회사이며, 이번에 투입한 휴머노이드는 농업 활동을 더욱 효율적으로 이루어질 것으로 기대된다. 미국 에카 로보틱스(Eka Robotics)는 1.5억달러의 시리즈 A 투자를 유치했다. 에카 로보틱스는 로봇 분야에서 좋은 성장을 기대받고 있으며, 이번 투자 역시 그 성장에 대한 믿음이 반영된 결과라고 볼 수 있다.\n\n---\n\n### ⑦ 글로벌 의료기기: 지멘스와 Paradromics, BCI 임상 영상기술 협력\n\n10월 19일 독일 의료기기 기업 지멘스 헬시니어스(ETR: SHL)는 미국 BCI 개발사 Paradromics(비상장)와 이식형 BCI용 다중모달 영상 플랫폼 공동개발을 발표했다. BCI(뇌-컴퓨터 인터페이스)는 뇌신호를 해독해 외부 기기를 제어하는 기술로, 주로 마비 환자의 의사소통·기능 복원을 목표로 개발 중이다. 양사는 MRI·CT·혈관영상 등을 통합해 환자 적합성 평가, 전극 삽입 위치·경로 설정, 수술 중 내비게이션 및 이식 후 평가까지 지원할 계획이다. 과거 글로벌 기업의 BCI 협력 계약이 비침습 기기의 개념검증·제품화 중심이었던 것과 달리, 최근에는 이식형 BCI의 임상 적용을 뒷받침할 기존 의료 인프라와의 통합으로 협력 범위가 확대되고 있다는 점에서 주목된다.\n\n---\n\n### ⑧ K-주택: 공공주도의 빠른 공급 방식으로 3기 신도시 등에 대한 공급 확대 준비\n\n2022년 하반기부터 착공이 감소하고, 2023년부터 올해까지도 공급이 부족하다고 느낄 정도로 착공이 부진하다. 민간부문에서의 착공감소 영향이 크다. 원가(토지비, 건축비, 금융비) 상승으로, 부득이하게 판매가(분양가)를 올려야 하는 상황에서, 시장이 높아진 판매가를 받아들이지 못하고 있다(미분양 발생).\n\n민간이 개발하기 어려운 환경에서 공급을 빠르게 획기적으로 늘릴 수 있는 방법은 공공이다. 향후 조성될 택지를 민간에 매각하기보다, 공공이 직접 개발하는 방식이다. 곧 조성될 3기 신도시 등의 공공택지지구에서 민간에 토지를 매각하기보다, 직접시행으로 전환하여 보다 빠르게 공급할 계획이다. 이를 위해 시행령 개정, LH의 기업분할, 2027년 예산 편성 등이 진행 중이다.\n\n---\n\n### ⑨ 글로벌 의료기기: 지멘스와 Paradromics, BCI 임상 영상기술 협력\n\n10월 19일 독일 의료기기 기업 지멘스 헬시니어스(ETR: SHL)는 미국 BCI 개발사 Paradromics(비상장)와 이식형 BCI용 다중모달 영상 플랫폼 공동개발을 발표했다. BCI(뇌-컴퓨터 인터페이스)는 뇌신호를 해독해 외부 기기를 제어하는 기술로, 주로 마비 환자의 의사소통·기능 복원을 목표로 개발 중이다. 양사는 MRI·CT·혈관영상 등을 통합해 환자 적합성 평가, 전극 삽입 위치·경로 설정, 수술 중 내비게이션 및 이식 후 평가까지 지원할 계획이다. 과거 글로벌 기업의 BCI 협력 계약이 비침습 기기의 개념검증·제품화 중심이었던 것과 달리, 최근에는 이식형 BCI의 임상 적용을 뒷받침할 기존 의료 인프라와의 통합으로 협력 범위가 확대되고 있다는 점에서 주목된다.\n\n---\n\n### ⑩ 글로벌 의료기기: 지멘스와 Paradromics, BCI 임상 영상기술 협력\n\n10월 19일 독일 의료기기 기업 지멘스 헬시니어스(ETR: SHL)는 미국 BCI 개발사 Paradromics(비상장)와 이식형 BCI용 다중모odal 영상 플랫폼 공동개발을 발표했다. BCI(뇌-컴퓨터 인터페이스)는 뇌신호를 해독해 외부 기기를 제어하는 기술로, 주로 마비 환자의 의사소통·기능 복원을 목표로 개발 중이다. 양사는 MRI·CT·혈관영상 등을 통합해 환자 적합성 평가, 전극 삽입 위치·경로 설정, 수술 중 내비게이션 및 이식 후 평가까지 지원할 계획이다. 과거 글로벌 기업의 BCI 협력 계약이 비침습 기기의 개념검증·제품화 중심이었던 것과 달리, 최근에는 이식형 BCI의 임상 적용을 뒷받침할 기존 의료 인프라와의 통합으로 협력 범위가 확대되고 있다는 점에서 주목된다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n# 투자전략\n\n### 미국 발 AI 펀더멘털 호재, 코스피+코스닥 동시 급락\n\n미국 3대 AI 기업인 스페이스엑스(SpaceX)(+7.8%), 슈퍼마이크로컴퓨터(+9.6%), 메타(Meta)(시간외 +2%)의 실적이 순차적으로 발표됨에 따라 AI 인프라 투자의 실수요가 확정됐고, AI 인프라 투자 사이클 지속 가능성에 대한 불안이 해소되는 모습을 보였다. 특히 스페이스엑스는 Q3 매출액 145.8억달러, 영업이익 27.9억달러를 기록해 시장 예측치를 상회하며 흑자를 기록했고, AI 연산 능력을 2023년 말 1.7GW에서 2026년 말 2.5~3.0GW로 확대하겠다고 발표했다. 머스크 CEO는 하이퍼스케일러들의 AI 연산 능력 수요가 공급을 넘어섰고, 이러한 상태가 장기간 지속될 것으로 전망하며 AI 인프라 투자 확대를 기대한다고 밝혔다. \n\n슈퍼마이크로컴퓨터는 2027회계연도 1분기에 잠정 매출액 185~195억달러를 제시하며 시장 예상치인 152억달러를 대폭 상회했고, 매출총이익률도 12.0~12.5%로 시장 예상치인 10.15%를 상회하며 수익성 개선을 기대했다. 회사는 AI 플랫폼 수요 확대를 매출 상향의 주요 배경이라고 밝히며, 고객·제품 믹스 개선이 수익성 개선에 기여했다고 설명했다. 스페이스엑스의 AI 연산 능력 확대 계획에 이어 데이터센터 서버 수요까지 재확인되면서 AI 인프라 투자에 대한 기대감이 확대돼 반도체 투자심리도 개선되었다.\n\n메타는 3분기 매출액 646억달러(컨센서스 634억달러), EPS(소송비용 제외) 7.4달러(컨센서스 6.5달러)를 기록했으며, 4분기 매출액 가이던스는 중간값 750억달러(컨센서스 739억달러)를 기록하며 모든 항목이 예상을 상회했다. 연간 CAPEX 가이던스는 기존 1,350~1,450억달러에서 1,300~1,450억달러로 유지했는데, 이는 AI 투자 축소 우려를 덜어주는 요인이다. 그러나 대규모 CAPEX 투자 여파로 인해 3분기 잉여현금흐름(Free Cash Flow)이 -21.2억달러로 적자 전환함에 따라 시간외 주가는 2%대 강세에 그친다. 메타의 경우 9월 출시 이후 이용자 수가 증가하는 에이전트 AI ‘뮤즈’의 시장성을 확인했다는 점에 주목해야 한다. 메타는 본업 광고사업의 YoY +26% 고성장세를 유지하고 있어, 앞으로도 대규모 투자 부담이 늘어나는 상황 속에서 수익성을 증명해 나갈 수 있다는 점이 중요하다.\n\n반면 램리서치(Ramtron International Corporation)는 3분기 호실적에도 불구하고 4분기 가이던스가 소폭 상회하는 데 그쳐 시간외 6%대 약세를 기록했다. 테슬라도 FCF 흑자 전환과 에너지 저장(Energy Storage System; ESS) 사업 호조 등의 긍정적인 분기를 발표했음에도 시간외에서 2%대 약세를 보였다. 이러한 현상은 여전히 높은 AI주의 기대치에 따른 주가 민감도가 커져 있고, 차주까지 예정된 다른 빅테크 기업들의 실적이 발표되기 전까지는 주가의 변동성은 클 수밖에 없다는 것을 의미한다.\n\n### 한국증시: 코스피+코스닥 동시 급락, 미국발 호재에도 AI 불안 여仍有\n\n전일 국내 증시는 미국 장 마감 후 발표된 슈퍼마이크로컴퓨터의 호실적과 스페이스엑스의 AI 연산 능력 확대 계획이라는 호재에 힘입어 AI 인프라주를 중심으로 급등했다. 코스피는 전 거래일 대비 3.29% 상승한 5,735.66P로 마감했고, 코스닥은 바이오주가 강세를 보이며 기관과 개인 순매수가 이루어졌다. 그러나 전일 단기 급등에 따른 차익 실현 물량도 존재했으며, 코스피 200 동일가중(+0.04%)은 보합세에 그친 것이다. 코스피(+3.3%), 코스피 200(+3.8%)은 3%대 급등했음에도 불구하고 코스피 200 동일가중은 오히려 보합을 보였는데, 이는 증시 회복에 대한 의구심이 여전히 남아 있다는 것을 시사한다.\n\n이러한 상황에서 국내 증시는 전일 급등한 반도체와 IT 하드웨어 등 AI 인프라주를 중심으로 상승했음에도 불구하고, 코스피와 코스닥 모두 3%대 급락을 기록했다. 오늘 국내 증시는 미국발 호재에도 불구하고, 코스피(+3.52%)와 코스닥(+3.62%)가 동시에 3%대 급락을 기록하며, AI 불안의 여파가 여전히 지속되고 있는 것으로 보인다. 코스피는 5,533.77P로 마감했고, 코스닥은 764.1P로 마감하여, 미국발 호재에도 불구하고 AI 불안의 여파가 여전히 지속되고 있는 것으로 보인다.\n\n전일 국내 증시는 코스피가 직전일의 급락분을 대부분 만회하기는 했지만, 코스피(+3.3%), 코스피200(+3.8%)은 모두 3%대 급등한 반면 코스피 200 동일가중(+0.04%)은 보합세에 그쳤다. 증시 회복에 대한 의구심이 여전히 남아 있었고, 전일 단기 급등에 대한 일부 차익 실현 물량이 소화되어갔다는 점에서 오늘 국내 증시가 미국발 호재에도 불구하고 급락한 것은 이해할 수 있는 사항이다.\n\n### 미국 국채금리, 보합권 등락 – 미 국채금리 상승에도 연준 긴축에 따른 경계감 지속\n\n미 국채금리는 미 국채금리 하락에도 연준 통화 긴축에 따른 경계감이 지속되면서 상승했고, 이는 달러 강세 요인으로 작용하였다. 그러나 주요 통화의 강세가 달러 상승을 제한하였다. 파운드화는 영국 9월 소비자물가 상승률이 시장 예상을 웃돌면서 영란은행의 11월 추가 금리 인상 기대가 강화된 영향으로 상승하였다. 엔화도 일본은행 히미노 부총재가 기조적 물가 상승률이 목표치에 근접하고 있다고 언급하면서 추가 금리 인상 기대에 강세를 보였다. 반면 유로화는 프랑스의 반정부 시위와 재정 불확실성이 지속되면서 달러 대비 소폭 약세를 나타내었다. 즉, 영국과 일본은 추가 금리 인상 기대감이 강해지면서 파운드화와 엔화가 강세를 보였으나, 프랑스의 반정부 시위와 재정 불확실성으로 인해 유로화가 약세를 나타냈다.\n\n미국 국채금리는 10년물 금리가 4.961%로 하락하였고, 전일 대비 -18.48bp의 하락폭을 기록했다. 미국 국채금리의 하락은 일반적으로 달러 약세를 가져오는 요인이지만, 이날 달러는 보합권 등락을 기록하였다. 이는 미국 국채금리 하락에도 불구하고, 미국 국채금리 하락에도 불구하고, 연준 통화 긴축에 따른 경계감이 지속되었기 때문이다. 미국 국채금리 하락은 투자자들이 연준의 긴축 기조가 느슨해질 것이라 기대한다는 의미이지만, 연준의 긴축 기조가 언제까지 유지될지를 둘러싼 불확실성이 지속되면서 달러는 보합권 등락을 기록하였다.\n\n### 미국 주요 시장: AI 인프라 투자 사이클 지속 가능, 반도체 투자심리 개선\n\n미국 주요 시장에서는 AI 인프라 투자 사이클 지속 가능성을 재확인하는 호재들과 함께 AI 불안이 해소되는 모습을 보였다. 그러나, 반도체주들은 낙폭 과대 업종으로 분류되어 있으므로, 낙폭 과대 업종이 우선 반등 탄력이 높다는 관점에서 반도체주들도 포함된 훨씬 더 많은 업종이 반등에 참여할 가능성이 높았다. 전일에도 외국인이 삼성전자를 순매수하며 4거래일 연속 순매수를 기록했고, SK하이닉스도 19거래일만에 순매수로 전환했다는 점도 눈여겨볼 부분이다. 이는 반도체 중심의 외국인 코스피 매도 압력이 덜해지고 있다는 것을 시사한다.\n\nAI 인프라 투자 사이클 지속 가능성을 재확인하는 호재들과 함께 AI 불안이 해소되는 모습을 보였음에도 불구하고, 메타의 경우에도 대규모 CAPEX 투자 여파로 인해 3분기 잉여현금흐름(Free Cash Flow)이 -21.2억달러로 적자 전환했으며, 시간외 주가는 2%대 강세에 그친다. 이는 여전히 높은 AI주의 기대치에 따른 주가 민감도가 커져 있고, 차주까지 예정된 다른 빅테크 기업들의 실적이 발표되기 전까지는 주가의 변동성은 클 수밖에 없다는 것을 의미한다.\n\n### 오늘의 매크로 충격 지표\n\n| 지표 | 값 | 전일 대비 |\n|------|----|-----------|\n| 코스피 | 5,533.77 | -3.52% (전일 5,735.66) |\n| 코스닥 | 764.1 | -3.62% (전일 792.76) |\n| 미국 10년 국채금리 | 4.961 | -18.48bp (전일 5.1458) |\n| 나스닥 | 26,008.86 | -2.60% (전일 26,702.86) |\n\n### AI 인프라 투자 사이클 지속 가능성 재확인, 반도체 투자심리 개선\n\nAI 인프라 투자 사이클 지속 가능성을 재확인하는 호재들과 함께 AI 불안이 해소되는 모습을 보였다. 미국 3대 AI 기업인 스페이스엑스(SpaceX)(+7.8%), 슈퍼마이크로컴퓨터(+9.6%), 메타(Meta)(시간외 +2%)의 실적 발표가 순차적으로 진행됨에 따라, AI 인프라 투자에 대한 실수요 확대가 재확인되고, AI 인프라 투자 사이클 지속 가능성에 대한 불안이 해소되었다. 특히 스페이스엑스는 Q3 매출액 145.8억달러, 영업이익 27.9억달러를 기록해 시장 예측치를 상회하며 흑자를 기록했고, AI 연산 능력을 2023년 말 1.7GW에서 2026년 말 2.5~3.0GW로 확대하겠다고 발표했다. 머스크 CEO는 하이퍼스케일러들의 AI 연산 능력 수요가 공급을 넘어섰고, 이러한 상태가 장기간 지속될 것으로 전망하며 AI 인프라 투자 확대를 기대한다고 밝혔다. 스페이스엑스의 AI 연산 능력 확대 계획에 이어 데이터센터 서버 수요까지 재확인되면서 AI 인프라 투자에 대한 기대감이 확대돼 반도체 투자심리도 개선되었다. 슈퍼마이크로컴퓨터는 2027회계연도 1분기에 잠정 매출액 185~195억달러를 제시하며 시장 예상치인 152억달러를 대폭 상회했고, 매출총이익률도 12.0~12.5%로 시장 예상치인 10.15%를 상회하며 수익성 개선을 기대했다. 회사는 AI 플랫폼 수요 확대를 매출 상향의 주요 배경이라고 밝히며, 고객·제품 믹스 개선이 수익성 개선에 기여했다고 설명했다.\n\n메타는 3분기 매출액 646억달러(컨센서스 634억달러), EPS(소송비용 제외) 7.4달러(컨센서스 6.5달러)를 기록했으며, 4분기 매출액 가이던스는 중간값 750억달러(컨센서스 739억달러)를 기록하며 모든 항목이 예상을 상회했다. 연간 CAPEX 가이던스는 기존 1,350~1,450억달러에서 1,300~1,450억달러로 유지했는데, 이는 AI 투자 축소 우려를 덜어주는 요인이다. 그러나 대규모 CAPEX 투자 여파로 인해 3분기 잉여현금흐름(Free Cash Flow)이 -21.2억달러로 적자 전환함에 따라 시간외 주가는 2%대 강세에 그친다. 메타의 경우 9월 출시 이후 이용자 수가 증가하는 에이전트 AI ‘뮤즈’의 시장성을 확인했다는 점에 주목해야 한다. 메타는 본업 광고사업의 YoY +26% 고성장세를 유지하고 있어, 앞으로도 대규모 투자 부담이 늘어나는 상황 속에서 수익성을 증명해 나갈 수 있다는 점이 중요하다.\n\n반면 램리서치(Ramtron International Corporation)는 3분기 호실적에도 불구하고 4분기 가이던스가 소폭 상회하는 데 그쳐 시간외 6%대 약세를 기록했다. 테슬라도 FCF 흑자 전환과 에너지 저장(Energy Storage System; ESS) 사업 호조 등의 긍정적인 분기를 발표했음에도 시간외에서 2%대 약세를 보였다. 이러한 현상은 여전히 높은 AI주의 기대치에 따른 주가 민감도가 커져 있고, 차주까지 예정된 다른 빅테크 기업들의 실적이 발표되기 전까지는 주가의 변동성은 클 수밖에 없다는 것을 의미한다.\n\n### 한국증시: 코스피+코스닥 동시 급락, 미국발 호재에도 AI 불안 여仍有\n\n전일 국내 증시는 미국 장 마감 후 발표된 슈퍼마이크로컴퓨터의 호실적과 스페이스엑스의 AI 연산 능력 확대 계획이라는 호재에 힘입어 AI 인프라주를 중심으로 급등했다. 코스피는 전 거래일 대비 3.29% 상승한 5,735.66P로 마감했고, 코스닥은 바이오주가 강세를 보이며 기관과 개인 순매수가 이루어졌다. 그러나 전일 단기 급등에 따른 차익 실현 물량도 존재했으며, 코스피 200 동일가중(+0.04%)은 보합세에 그친 것이다. 코스피(+3.3%), 코스피 200(+3.8%)은 3%대 급등했음에도 불구하고 코스피 200 동일가중은 오히려 보합을 보였는데, 이는 증시 회복에 대한 의구심이 여전히 남아 있다는 것을 시사한다.\n\n이러한 상황에서 국내 증시는 전일 급등한 반도체와 IT 하드웨어 등 AI 인프라주를 중심으로 상승했음에도 불구하고, 코스피(+3.52%)와 코스닥(+3.62%)가 동시에 3%대 급락을 기록하며, AI 불안의 여파가 여전히 지속되고 있는 것으로 보인다. 코스피는 5,533.77P로 마감했고, 코스닥은 764.1P로 마감하여, 미국발 호재에도 불구하고 AI 불안의 여파가 여전히 지속되고 있는 것으로 보인다.\n\n전일 국내 증시는 코스피가 직전일의 급락분을 대부분 만회하기는 했지만, 코스피(+3.3%), 코스피200(+3.8%)은 모두 3%대 급등한 반면 코스피 200 동일가중(+0.04%)은 보합세에 그쳤다. 증시 회복에 대한 의구심이 여전히 남아 있었고, 전일 단기 급등에 대한 일부 차익 실현 물량이 소화되어갔다는 점에서 오늘 국내 증시가 미국발 호재에도 불구하고 급락한 것은 이해할 수 있는 사항이다.\n\n### 미국 국채금리, 보합권 등락 – 미 국채금리 상승에도 연준 긴축에 따른 경계감 지속\n\n미 국채금리는 미 국채금리 하락에도 연준 통화 긴축에 따른 경계감이 지속되면서 상승했고, 이는 달러 강세 요인으로 작용하였다. 그러나 주요 통화의 강세가 달러 상승을 제한하였다. 파운드화는 영국 9월 소비자물가 상승률이 시장 예상을 웃돌면서 영란은행의 11월 추가 금리 인상 기대가 강화된 영향으로 상승하였다. 엔화도 일본은행 히미노 부총재가 기조적 물가 상승률이 목표치에 근접하고 있다고 언급하면서 추가 금리 인상 기대에 강세를 보였다. 반면 유로화는 프랑스의 반정부 시위와 재정 불확실성이 지속되면서 달러 대비 소폭 약세를 나타내었다. 즉, 영국과 일본은 추가 금리 인상 기대감이 강해지면서 파운드화와 엔화가 강세를 보였으나, 프랑스의 반정부 시위와 재정 불확실성으로 인해 유로화가 약세를 나타냈다.\n\n미국 국채금리는 10년물 금리가 4.961%로 하락하였고, 전일 대비 -18.48bp의 하락폭을 기록했다. 미국 국채금리의 하락은 일반적으로 달러 약세를 가져오는 요인이지만, 이날 달러는 보합권 등락을 기록하였다. 이는 미국 국채금리 하락에도 불구하고, 연준 통화 긴축에 따른 경계감이 지속되었기 때문이다. 미국 국채금리 하락은 투자자들이 연준의 긴축 기조가 느슨해질 것이라 기대한다는 의미이지만, 연준의 긴축 기조가 언제까지 유지될지를 둘러싼 불확실성이 지속되면서 달러는 보합권 등락을 기록하였다.\n\n### 오늘의 매크رو 충격 지표\n\n| 지표 | 값 | 전일 대비 |\n|------|----|-----------|\n| 코스피 | 5,533.77 | -3.52% (전일 5,735.66) |\n| 코스닥 | 764.1 | -3.62% (전일 792.76) |\n| 미국 10년 국채금리 | 4.961 | -18.48bp (전일 5.1458) |\n| 나스닥 | 26,008.86 | -2.60% (전일 26,702.86) |\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n공급 충격이 물가 상승으로 이어지며 산업생태계 전반의 비용 구조에 영향을 미치고 있으며, AI 투자로 인한 성장 모멘텀은 특정 분야에 집중되어 전체 경기에 긍정적 피드백을 유도하지 못하고 있다. 프랑스 시위와 같은 사회적 불만은 물가 상승과 실질소득 감소에 따른 국민의 경제적 부담을 반영하며, 이는 에너지 자립을 위한 국가적 대응을 촉발하고 있다. 한편, AI 기술 발전과 관련된 산업군의 성장 가능성은 있으나, 이를 일반 소비와 서비스업으로 확산시키는 데 한계가 있으며, 이는 경제 전반의 균형 성장에 걸림돌이 되고 있다."}]}</script>
