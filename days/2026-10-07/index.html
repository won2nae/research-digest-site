<script id="__DATA__" type="application/json">{"date": "2026-10-07", "headline": "① 미 고용: 표면적인 실패 vs 실질적인 회복 신호", "market": {"KOSPI": {"label": "코스피", "value": 6803.9, "change": -1.98, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 898.43, "change": -2.34, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1341.0, "change": 0.07, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 88.28, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4140.7, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.286, "change": 1.48, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.391, "change": 1.8, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51179.87, "change": -0.66, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7801.77, "change": -0.22, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27538.69, "change": -0.22, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -1.98% (현재 6803.9, 전일 6941.39, 임계값 1.5% 초과)\n- **코스닥** 하락 -2.34% (현재 898.43, 전일 919.92, 임계값 2.0% 초과)\n\n### 관련 뉴스\n", "tabs": [{"title": "코스피 -1.98%", "md": "## 코스피 -1.98%\n\n**외국인·기관 매도 + 유가·금리 상승 압박** (조선일보비즈, 매일경제, 뉴시스)\n외국인·기관의 동반 순매도 속에 국제유가 상승과 미국 장기국채 금리 급등이 투자 심리를 짓눌렀고, 미 증시 최고치 경신에도 코스피는 6,800선으로 후퇴.\n\n**삼성전자 실적 발표 앞둔 차익실현** (Korea Times, Brecorder)\n삼성전자의 3분기 AI 반도체 호실적 기대가 높았으나, 불확실성에 따른 외국인 차익실현 물량이 상승 모멘텀을 상쇄.\n\n**아시아 전반 하락: 브렌트유 $100 돌파·미 국채 30년물 5.70%** (Bloomberg, investing.com, The Star)\n호르무즈 해협 유조선 공격으로 공급 불안이 커지며 브렌트유가 배럴당 $100을 넘겼고, 미 30년물 국채금리가 2002년 이후 최고치(5.70%)로 치솟으면서 아시아 전 증시에 하방 압력.\n\n---\n\n> **코스닥 -2.34%:** 직접 언급한 독립 뉴스는 검색되지 않아 생략. 위 코스피 요인들(외국인 매도·금리·유가)이 동일하게 작용한 것으로 추정.\n\n---\n"}, {"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### ① 미 고용: 표면적인 실패 vs 실질적인 회복 신호\n\n9월 비농업취업자 +2.9만명(+8.9만명 예상), 직전 2개월도 모두 -6만명으로 하향 조정됐다. 동시에 실업률 4.2%(+0.1%p), 시간당 임금 YoY +3.0%, MoM +0.1%로 임금 성장은 오히려 둔화됐다. 이를 두고 '완충 효과'와 '구조적 약화'의 해석이 갈린다—단순히 3개월 평균이 +5.1만명이라는 사실 자체가 이미 8월과 같은 수준임을 감안하면, 이번 결과는 장기간의 임금강성과 노동시장 탄력을 나타낸다고 볼 수 없다. 그러나 여기서 중요한 변수는 9월 29일 FOMC 의사록이다. 당시 위원들은 \"노동시장이 견조하지만 인플레이션이 아직 목표에 매우 멀리 떨어져 있고 추가 금리인상을 요구한다\"고 결론냈는데, 실제로 10월 6일 미 국채금리가 다시 5%선을 넘어선 것이 그 방향성을 입증한다. 즉 이번 고용 지표는 금융시장의 인플레이션 관여론을 되돌리는 것이 아닌, 그 논리의 훈장을 위한 첫 번째 선행 지표였음을 알 수 있다. 다만 임금 성장 둔화는 장기적 인플레이션 기저 압력을 줄이는 요인이므로, 다음 10월 CPI와 PPI가 2%로 돌아오는 순간부터 시장 관심은 다시 임금 변곡점을 중심으로 이동해야 한다.\n\n---\n\n### ② 프랑스 국채금리: 르펜의 재정혁신언설이 열었던 창구\n\n10월 1일 4.919%로 5%선에 접한 프랑스 10년 국채금리가 6일 11.23bp 급락하며 일시적으로 안정되기는 했지만, 이틀 전 이탈리아와의 10년 국채금리 스프레드는 -0.68%p로 역전됐고, 역사상 1990년대 이후 가장 크다. iM증권은 이 수치 자체를 \"PIGs(포루투갈-이태리-벨기에-希腊)의 재앙을 재현하는 초기 단계\"로 규정했는데, 그 이유는 이탈리아의 26Q1 국가부채비율이 139%이며 25Q1 154%보다 대폭 낮아졌음에도 불구하고 프랑스가 그보다 부채비율이 낮은 상태에서도 스프레드 역전이 발생한다는 것이다. 이 수렴 현상의 핵심은 정치적 불안이다. 27년 예산안이 현재대로 진행되면 재정적자가 GDP 대비 -5.5%~6.5%로 확대될 것이며, 프랑스 총리는 재정삭감 없는 상태에서는 27년 재정적자가 -6.5%까지 될 수 있다고 경고했다. 반면 대선 주자인 마린 르펜 국민연합(RN)은 2030년까지 재정적자 3.0% 이하로 낮춘다는 것을 이미 선언했다. 이 대응 차이 자체가 프랑스 내부의 재정 혁신 여부를 결정하는 핵심 변수인데, 만약 르펜이 대선후보로서 권력을 장악한다면 프랑스는 27년부터 3년마다 3.0%씩 점진적으로 재정적자를 축소하는 방식으로 접근할 가능성이 높다. 따라서 이달 6일 급락은 단기적 정치적 활력을 반영하는 것이지, 장기적 재정 건전화를 위한 구조적 해결책이 마련됐다는 의미는 아니어서, 금리 스프레드 역전은 해당 지역화폐의 가치 상실 가능성과 직접 연결된다.\n\n---\n\n### ③ 한국 증시: 외국인·기관의 동시 매도와 글로벌 금리·에너지 캐리의 융합 압력\n\n10월 6일 코스피는 -1.98%로 6,800선으로 하락했다. 이 하락은 세 가지 파워팩터가 동시에 작동했기 때문에 그 크기가 클 수밖에 없었다. 첫째, 외국인과 기관의 동반 순매도였다(Kiwoom). 이는 미국 증시가 S&P 500 최고치를 경신했음에도 불구하고, 한국 증시 참여자들의 편류 현상이었다. 둘째, 브랜트유가 $100을 돌파했고, 미 30년물 국채금리가 5.70%를 기록하며 글로벌 금리·에너지 캐리가 동시에 상승했다(Bloomberg). 셋째, 삼성전자(-1.45%), SK하이닉스(-3.69%) 등의 반도체 대형주가 실적 발표를 앞두러 차익거래를 실행하면서 추가로 약세를 키웠다(KT). 이 세 가지 채널은 서로 다른 시장(글로벌 금리, 글로벌 유가, 한국 IT)에서 동시에 작동했으므로, 이 하락은 단순한 시장 선택적이 아닌 글로벌 파급 효율이 높은 구조적 충격이었다.\n\n---\n\n### ④ 코스닥: IT 약세와 소부장·이차전지의 디커플링\n\n같은 날 코스닥은 -2.34%로 더 큰 폭으로 하락했다. Kiwoom에 따르면 외국인과 기관이 동반 매수했음에도 불구하고 지수가 떨어진 이유는 반도체 소부장과 이차전지주의 강세가 전체 시장을 지지하지 못했기 때문이었다. 이는 코스닥 내부의 세그먼트별 디커플링을 보여주는 현상이다. 즉 반도체 소부장과 이차전지 일부 종목은 외국인의 강한 수혜 구매로 상승했음에도 불구하고, 그것이 전체 코스닥 지수를 끌어올리지 못했다는 것은, 코스닥 내에 존재하는 다른 업종이나 종목군(특히 IT)의 약세가 그만큼 강해서 결국 전체 지수를 끌어내렸다는 이야기다. 특히 코스피 대비 코스닥의 상대적 약세는 IT 섹터의 냉각이 코스닥 지수 구성에 깊숙이 자리 잡고 있다는 의미로 해석할 수 있으며, 이는 미국 증시에서 반도체 대형주가 약세를 보였던 것과 맞닿는다.\n\n---\n\n### ⑤ 한국 증시 전망: 금리 상승과 고용 불확실성의 복합적 스윙\n\n앞으로 한국 증시의 운명은 크게 두 가지 변수에 좌우된다. 첫째는 10월 6일 이후 계속 상승하고 있는 미 국채 금리다. 이 금리가 언제 5%선을 돌파하고, 그 이상으로 올라가는지가 한국 증시의 외국인 자금 유입/유출 패턴을 결정짓는 핵심이다. 둘째는 미국 10월 고용 지표다. 9월 고용이 하향 조정됐고, 임금 성장이 둔화됐다면, 10월 고용이 예상치를 살짝 하회하더라도 그 함의가 덜할 수 있다. 그러나 10월 고용이 예상치를 상회하거나 임금 성장이 재 가속화되면, FED의 금리 인상 속도를 가늠하는 시장의 핵심 가정이 무너지는 동시에, 글로벌 금리가 추가로 상승할 가능성이 높아진다. 두 사건이 동시에 발생하면 한국 증시는 외국인 매도와 글로벌 금리·에너지 캐리의 이중 압력에 직면할 수밖에 없어, 하반기 후반의 전반적 투자 기조는 위험 선호 쏠림에서 안전자산으로의 회귀로 전환이 어렵지 않을 것이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### I. 당일 방향성: 보합권 진입과 국3-5Y 스프레드 좁혀가는 이유\n\n국내 채권시장은 전일 종가 기준 보합권(-0.3bp)을 형성했다. 유안타와 다올 모두 가벼운 상승을 기록한 것은 아닌데, 유진은 초우량물 10Y 금리가 장 중 상승 출발하고 이를 고려하면서도 결국 보합으로 마감했다고 명시했다. 세 버전을 통틀어 국3Y 금리는 1.9%, 국10Y는 3.3% 수준이었다(다올).\n\n핵심 변곡점을 찾기 위해 국3-5Y 스프레드를 들춰보자. 이 스프레드는 전일 18.2bp(-0.6bp)로 축소됐는데, 이는 최근 한달 내 국3Y 금리 상승폭이 국5Y보다 큰 결과다. 10-5Y 스프레드도 25.5bp(+1.3bp)로 확대됐으며 10-3Y 스프레드는 43.7bp(+0.7bp)로 넓어져 전체 커브가 스티프닝 됐다(다올).\n\n왜 이런 패턴이 동시에 발생하느냐? 국3-5Y 스프레드 축소는 중기 국채 비중을 선호하는 수급이 강해서이며, 10-5Y 스프레드 확대는 장기 국채 수요 감소가 중기보다 먼저 나타났다는 것이다. 즉, 3~5Y에서 상대적으로 좋은 피킹 효과가 있었고, 5~10Y에서는 장기금리 상승 압력이 더 견조하게 머물렀다. 이는 미국 국채 시장에서도 확인되는 양극화 구도다 — 미국 금융업계는 지난주 베어 스팁(Bear Steepener)을 경험했고, 이는 3~5Y보다 5~10Y 금리 상승률이 더 클 때 나타나는 현상이다(yEugene).\n\n두 가지 파워가 동시에 작동했다. 하나는 대외변수: 국제유가 상승과 미국 장기금리 급등(특히 30년물 5.70%/2002년 이후 최고치)이 유연한 금리 방향성을 압박했음에도 불구하고, 국내 시장은 그 압력을 정부의 국감 발언과 외국인 국채선물 순매수로 일부 헤징했다. 다른 하나는 국내 수급: 국3-5Y 스프레드 축소 자체가 이미 중기 국채 수요가 존재한다는 것을 보여줘, 이는 미국의 베어 스팁과는 방향이 다르면서도 동시 발생한 것이어서 캐리 포지션이 무너지는 게 아니라는 점을 시사한다(iM, yEugene).\n\n---\n\n### II. iM의 초우량물 공급-수급 분석: 3분기 최대 공급의 흡수 여력은?\n\niM은 2015년 이후 월별 초우량물(공사채+은행채) 데이터를 가지고 실탕인터벌 분석을 수행했다. 핵심 사실:\n\n- 2026년 1~9월 초우량물 순발행액은 59.8조원(공사채 19.9T, 은행채 39.9T)—이는 2024년 동기(18.6T)를 크게 상회했고, 2025년 동기(1.1T)보다도 54배 이상 많았다.\n- 1~9월 누적만으로도 2024년 연간 순발행액(33.4T)을 넘어섰다.\n- 2026년 1~9월 순매수 ÷ 순발행 = 3.3배—이는 2024년 동기(7.9배)보다 매우 낮아졌다. 2025년 동기에는 순발행이 1.1T로 거의 없다시피 해 배율 비교 자체가 성립하지 않는다.\n  \n공급 패턴을 월별로 살펴보면, 6~9월 순발행이 15.2→15.5→9.2→8.2T로 꾸준히 이어졌다. 같은 기간 흡수 여력(투자자 순매수 - 순발행)은 10.9→5.1→14.2→14.2T로 7월에 한 번이라도 깊게 떨어진 다음부터 회복되기 시작했다.\n\n이 편차는 중요한 함의를 제공한다. 2015년 이후 모든 월을 공급 규모에 따라 두 그룹(A: 공급 많음, B: 공급 적음)으로 나눈 후 비교했더니, A 그룹의 월평균 순발행이 B 그룹보다 9.6T 많았지만, 순매수는 5.1T 많을 뿐이고 흡수 여력은 14.5T에서 10.0T로 4.5T 축소됐다. 즉, 공급 증가폭의 약 절반이 순매수 증가로 이어졌고, 나머지는 스프레드 조정을 통한 추가 수요 유입으로 해결됐음을 알 수 있다(iM).\n\n이제 2026년 3분기를 따로 볼 가치가 있다. 3분기 초우량물 순발행 32.9T는 2015년 이후 동기간 중 최대 규모로, 종전 최대였던 2022년 3분기 24.6T를 8.3T나 상회했다. 3분기 순매수는 66.4T로 역시 2015년 이후 최대였고, 흡수 여력은 33.5T로 12개년 중 5위에 해당하며 1년 평균(35.0T) 수준을 유지했다. 이는 3분기 초우량물 32.9T라는 역사상 가장 많은 순공급이 평균 수준의 흡수 여력 속에서 소화된 사례다. 여기에 현재 초우량물 스프레드가 확대돼 있고(iM 표 참조), 10-3Y 스프레드도 43.7bp(+0.7bp)로 넓어졌다고 한다면(iM, 다올), 스프레드 기반 캐리 수요가 3분기 공급을 부분적으로 뒷받침했던 것으로 추정된다.\n\n그럼에도 불구하고 iM은 “변수”로서 다음과 같이 열어뒀다: 3분기 흡수 여력이 12개년 평균(35.0T)과 같거나 조금 높은 수준임에도 불구하고, 3분기 초우량물 순발행이 32.9T로 평균(35.0T)을 오히려 하회하기 때문에 흡수 여력이 그만큼 탄탄한 것이다. 그러나 만약 금리 변동성 확대 등으로 10-3Y 스프레드가 다시 좁혀지면서 순매수 강도가 약해지면 스프레드 조정 폭이 커질 수 있다고 보고 있다. 즉, 스프레드가 이미 확대된 상태에서 추가 조정 가능성은 여전히 남아 있어, 이번 10월 초우량물 수급 트랙은 이 변수를 감안해야 한다.\n\n---\n\n### III. 국감 발언과 10월 이후 국채 발행: 시장은 언제까지 안도할까?\n\n유진은 국회 재정경제기획위원회 국감에서 “10월 국채 발행량을 축소하고, 11~12월 추가 축소를 검토하겠다”는 답변이 있었다고 전했다. 이 발언의 중요성은 발언 내용 자체보다, **“시장 상황에 보고 필요한 경우”라는 조건부 표현**에 있다. 10월 발행량이 실제로 축소될지 아직 결정된 것이 아니다.\n\n이 발언이 시장을 안정시키는 역설이기도 하지만, 왜 그런가? 10월 발행량이 예상보다 크다면 그만큼 공급이 늘어나고, 그러면 초우량물 스프레드가 또다시 압박 받을 수 있기 때문이다. 반대로 축소되면 공급 부담 완화로 초우량물 스프레드 상승 압력이 줄어든다. 문제는 11~12월 추가 축소가 “보고 가능한지”에 관한 것도 포함되어 있어서, 이 발언은 10월 발행량에 대해서는 일단 안도하면서도 11~12월 발행량에 대해서는 여전히 불확실성을 남긴 셈이다. 특히 2026년 3분기가 이미 초우량물 32.9T라는 역대 최대 공급을 소화한 상황에서, 11~12월 추가 축소가 없는 경우 4분기까지 초우량물 공급이 계속되고, 이 시기에 흡수 여력이 어디쯤 위치하는지가 스프레드 운명의 결정 요인이다.\n\n---\n\n### IV. 유가·금리·달러-원: 세 힘이 어루러진 자리\n\n전일 달러-원 환율은 1,343.60원으로 0.40원 하락했다. 하락의 듯이 보이나, 하단을 지키는 요인들은 뻔하다. 유안타에 따르면 수출업체 네고가 상단을 넘어서면서 하단을 지탱하는 요인은 외국인 주식 순매도에 따른 커스터디 달러 매수와 결제 수요다. 달러 매수와 결제 수요는 동시에 존재하기 때문에, 달러-원이 1,340원대 초중반을 지속했다는 건 달러 공급이 달러 수요를 상쇄하는 수준까지 도달했다는 얘기다. \n\n같은 시간대 미국 장기국채 금리가 급등했고, 브랜트유가 $100을 돌파했다(bloomberg). 유가 상승은 달러 강세 압력인데, 달러-원 하락과 함께 진행된 것은 이벤트 특성상 공급 충격이 금융시장을 덥썩 쳤다가 빠르게 흡수된 모습이다. 미국 30년물 5.70%(2002년 이후 최고치) 급등은 글로벌 유동성 조정 압력과 선행 지표로서 의미를 갖겠지만, 달러-원이 그와 동시에 하락한 것은 미국 금리 급등이 달러 수요를 만들어낸다는 일반적인 로직이 적용되지 않은 것으로 보여진다. 이는 달러-원 하락이 외국인 주식 순매도에 의한 커스터디 달러 매수와 결제 수요가 더 강하게 작동했기 때문일 수도 있으며, 또는 유가 급등이 달러-원 하락을 반전시키지 못했기 때문에 달러-원은 1,340원대 초반에 멈춘 것일 수도 있다.\n\n즉, 유가·미국 금리·달러-원 세 변수가 동시에 변화함에도 불구하고 달러-원이 하락한 것은 특정한 수급 요인이 달러 공급을 지지했기 때문이다. 이 수급 요인의 지속 여부가 달러-원 훅의 방향성을 결정짓는다. 그런데 달러-원 하락은 수출업체의 네고 상단을 넘어서면서도, 하단을 지지하는 요인은 여전히 유효한 상태다. 그러므로 달러-원은 1,340원대 초반을 기저로 앞으로도 일시적이거나 단기적인 플랫한 움직임을 이어갈 가능성이 높다. 달러-원의 방향성은 이제 외국인 주식 순매도의 지속 여부와 결제 수요의 크기에 더 의존할 것으로 보인다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. AI 인프라 수요 vs. 대규모 펀딩 압력: 현실과 광고 사이의 괴리\n\n교보증권은 AI 인프라 수요 강화에 따른 전기전자 섹터 전반의 상승 추세를 인정하지만, IBK투자증권은 이 섹터 내에서 LG CNS가 출시한 STO 인프라 플랫폼 'KITL'(기틀)을 소개하며, AI 수요와 병목논리가 지속되는 한 섹터 내 기회는 존재한다는 입장을 같이한다. 그러나 하나증권은 이 광범위한 기대감의 역설을 명시적으로 지적한다 — AI 속도조절론이 사실상 고도의 마케팅이라는 주장이다.\n\n핵심 논리가 여기에 있다: AI 개발은 현재 토큰과금을 제외하고 명확한 사업모델이 정립되지 않은 단계다. 이런 환경에서 대규모 자금 유입은 지속적이어야 하므로, 투자자들이 예상하는 기대수익과 회수기한이 실제 개발 속도를 하회하면 자금 유입 자체가 취약해진다. 역사적으로 이 문제가 두 번 반복되었음을 기억하자. 1970년대 초기 신경망(PERCEPTRON)의 구조적 한계로 자금지원이 대폭 감소했고, 1980년대 전문가시스템의 규칙입력 비용 문제로 지원금이 급감하며 초기 AI컴퓨터(LISP업체)가 도산했다. AI GPU가 등장한 2010년대에야 대규모 펀딩이 재개됐다.\n\n따라서 현 시점에서 AI 속도조절론을 반대하는 업체가 메타·엔비디아였다는 사실은 의미 있게 읽혀진다. 메타와 엔비디아는 이미 대규모 펀딩을 받아온 기업들로, 향후 자금 유입이 줄어들지 않을 위치에 있기 때문이다. 반면 엔트로픽과 오프런AI는 IPO를 앞뒀거나 수입이 비용을 초과하는 구조에 처해 있으므로, 사업 모델이 투자자들에게 매력적으로 보이도록 AI 발전 속도를 부풀릴 유인이 클 수밖에 없는 구조다. 이것이 하나증권이 AI 속도조절론을 “고도의 마케팅”이라 규정한 근거다.\n\n마크업과 현실 사이의 괴리는 교보증권이 강조하는 병목 논리와 맞닿는다. 고성능 중심의 AI 수요가 지속되는 한 수급 불균형이 계속해서 가격 상승 압력을 만들어낸다는 그 논리는, 실제로 AI 개발이 느리거나 예상보다 빠르게 진행될 때 언제든지 무너질 수 있는 불안정한 근거다. 이를 해결하려면 하나증권이 제시한 방향 — 즉, 대규모 AI 펀딩이 재개되기 위해 반드시 필요한 GPU 산업의 역할이 강화되는 순간 — 이 현실화되어야 한다. 2027년에 이 구조가 정착되면, 현재의 마케팅 논리와 실질 수요 사이의 괴리가 좁힐 가능성이 있다.\n\n---\n\n### 2. 통신: MVNO 순감, MNO의 선택적 수혜와 수익성 방어\n\n유안타증권은 9월 번호이동 시장이 59.7만명(-7.3% MoM, -12.3% YoY)으로 감소했음을 확인한다. 이 감소는 아이폰18 프로 출시 직전이어서 일시적일 가능성이 있다고 봤는데, 동시에 MVNO(알뜰폰) 순감 추세가 이통3사의 중저가·통합요금제 확대와 마케팅 강화로 인해 지속되고 있음을 분석했다. 구조적 성장성 약화라는 표현이 핵심이다.\n\n이 논리는 유안타증권과 하나증권의 주파수 경매 논의를 연결할 수 있다. 하나증권은 국내 5G 주파수 할당 폭이 미국 OBBBA(크고 아름다운 하나의 법안) 기준의 2030년까지 800MHz 경매 규모의 절반 수준임을 지적하며, 만약 국내에서 추가 할당이 없으면 격차가 오히려 시간이 지날수록 확대될 수 있다고 보았다. 여기서 주파수 경매가 단순한 자원 할당이 아닌, 미래 수익성과 경쟁력의 구조적 재편이라는 관점이 자리잡고 있다.\n\nMVNO의 순감과 이통3사의 마케팅 경쟁 강화는 이 구조적 경쟁의 일면이다. SKT가 9월 2,566명의 순증을 기록해 MVNO 이탈 수요의 상당 부분을 먹어 들였다. 이는 하나증권의 주파수 경매 논리가 현실화될 때, 주파수 추가 할당 없이도 이통사가 자체 마케팅과 요금제 경쟁으로 MVNO 시장을 훼손할 수 있음을 보여주는 사례다. 10월 아이폰18 시리즈 마케팅 강화가 이 흐름을 더욱 가속화시킬 것이기 때문에, 유안타증권이 10월에도 MVNO 대비 MNO 순증이 이어질 것이라고 전망한 것도 이 논리에서 비롯된다.\n\n---\n\n### 3. AI 데이터센터: 미국 생산 확대와 국내 3社의 수직적 공급망 경쟁\n\n유안타증권은 AI 데이터센터 수요가 이미 알려진 성장 논리(미국 송전망 투자, 변압기 공급 부족)를 넘어, 고객 변화와 새로운 공급 기회로 이어지고 있음을 분석한다. 국내 3社(HD현대일렉트릭, 효성중공업, 산일전기)의 최근 수주가 이 논리를 실증한다:\n\n- **HD현대일렉트릭**: 미국 텍사스에 1조1,212억원 장기 기본계약\n- **효성중공업**: 빅테크향 초고압 변압기 3,865억원 수주\n- **산일전기**: Bloom 등 데이터센터향 반복 수주를 통한 BTM(Behind the Meter) 시장 확대\n\n이 세 가지 사례는 서로 다른 접근 방법을 보여준다. HD현대일렉트릭은 미국 텍사스의 장기 기본계약으로 수주 규모를 확보한 반면, 효성중공업은 미국 생산 확대(공급망 안보·미국산 조달 강화)와 고수익 물량 출하에 빅테크 직접 발주가 더해지는 구조다. 산일전기는 반복 수주를 통해 BTM 시장으로 수익원을 다변화하는 방식이다.\n\nLS ELECTRIC은 데이터센터 배전 수주의 빠른 실적 전환과 DC 시스템 공급 범위 확대에 주목된다. 일진전기는 전력망 수요와 증설에 기반한 출하·수익성 개선을 기대한다. 이 5社의 합산 영업이익은 2026년 43.8% 증가한 5.46조원으로 전망되며, 상반기 신규수주 또한 64.7% 증가해 생산능력을 뒷받침하고 있다.\n\n유안타증권이 Top Pick으로 제시한 효성중공업과 LS ELECTRIC은 각각 수직적 공급망(미국 생산·고수익 물량)과 수평적 공급 범위 확대(DC 시스템)에서의 성장 논리를 갖춘 기업이다. 이 두 기업의 공통점은 국내 HVDC와 데이터센터 투자 증가가 추가 성장 기회를 제공한다는 점이다.\n\n---\n\n### 4. 자동차: 완성차 하회 vs. 부품사 상대적 우위, 수익성 방어의 두 축\n\n대신증권은 완성차와 부품사의 상대적 우위를 다음과 같이 정리한다: 완성차는 1) 현대차 물량 감소, 2) 환율 하락으로 실적 모멘텀이 제한되며, 부품사는 1) 현지 생산-납품 구조로 환율 노출도가 낮고, 2) 고객사·차종에 따른 현대 판매 부진을 상쇄할 가능성이 있기 때문이다.\n\nSNT모티브는 한국GM 생산 증가로 현대 물량 부진 영향을 일부 상쇄하며 안정적인 이익체력을 보여줄 것으로 전망된다. 현대모비스는 램프사업 분할매각에 따른 사업효율화와 주식매수 청구권(행사가 408,394원)이 주가 하방을 지지할 것으로 본다. 4Q26 고객 정산에 따른 비용 보전과 휴머노이드 액츄에이터 개발 성과 가시화도 긍정적 요인으로 작용한다.\n\n하나증권은 현대차/기아 3분기 영업이익을 각각 2.23조원/2.29조원으로 기존 추정치를 하회할 것으로 예상한다. 현대차는 국내 생산차질, 모델 노후화, 해외 경쟁 심화로 도매판매가 11% 감소한 반면, 기아는 EV 신차 효과와 인도 회복으로 도매판매가 8% 증가할 것으로 보았다. 가격 효과는 인센티브 증가와 지역 믹스 하락에도 불구하고 HEV/EV 비중 상승이 기여할 것으로 전망된다.\n\n수익성 하회의 주요 원인은 세 가지다: 1) 3분기 기말환율 급락(-190원/-12% QoQ)에 따른 판매보증비용 환입, 2) 재료비 추가 상승, 3) 평균환율 전 분기 대비 하락(-5% QoQ)과 현대차 가동률 하락. 이 세 가지는 모두 외생적 또는 운영적 요인으로, 산업적 요인(수요 둔화, 경쟁 심화)이 개선되지 않은 상황에서 복합적으로 작용하고 있다.\n\n하나증권은 자동차 주가가 6월 이후 판매대수 둔화와 환율 급락에 따른 3분기/4분기 실적 우려와 로봇 모멘텀 약화를 지속적으로 선반영해왔다고 판단한다. 현대차/기아의 12MF P/E는 각각 10배/6배 전후로 글로벌 동종기업 평균 8배 초반 대비 소폭 저평가된 수준이다. 10월 이후 BD의 로봇 생산법인 RA 설립과 지분구조 확정, 공급망 구축, 산업 내 주요 휴머노이드 로봇 출시가 주가 모멘텀이 될 것이라고 전망하며, 2027년 SDV Pace Car 출시로 자율주행 모멘텀도 가세할 것을 기대한다.\n\n---\n\n### 5. 통신: 주파수 경매, 경쟁국 격차 확대 우려와 2027년 방향성\n\n하나증권은 미국 OBBBA 법안에 따른 2030년까지 800MHz의 5G/6G 용도 경매가 진행될 예정임을 지적하며, 국내에서 추가 주파수 할당이 없으면 시간이 지날수록 주파수 경쟁력 격차가 확대될 수 있다고 보았다. 미국은 이미 OBBBA를 제정했고, 국내는 아직 주파수 경매를 개최하지 않고 있는 상황이다.\n\n통신 Weekly 리포트에서 유안타증권은 9월 번호이동 시장이 MVNO 순감으로 이통3사의 중저가·통합요금제 확대와 마케팅 강화가 알뜰폰 시장의 구조적 성장성을 약화시킨다고 분석했다. 9월 SKT 순증 규모가 +2,566명으로 MVNO 이탈 수요의 상당 부분이 SKT로 이동한 점도 지적했다. 이는 하나증권의 주파수 경매 논리와 다르지 않다 — 주파수 경쟁력 격차 확대는 주파수 할당이 없으면 시간이 지날수록 심화될 것이고, 이 과정에서 주파수를 많이 할당받은 국가의 이통사가 마케팅·요금제 경쟁에서 우위를 점할 수 있는 구조다.\n\n2027년은 하나증권과 유안타증권이 모두 지목하는 키포인트다. 하나증권은 JTBC 이슈로 TVN/SBS의 반사 수혜 가능성을 확인하고, 2027년 예상 평균 P/E 9배로 부진한 업황이 충분히 반영돼 있다고 판단한다. 유안타증권은 2027년을 \"기대 이상\"으로 설정하며, 3분기 실적 하회가 이미 예정된 수순이고 주가는 월 판매대수와 환율에 따라 선반영돼 있다고 보았다.\n\n두 리포트가 다른 점은 TV광고와 자동차의 실적 논리가 다르다는 점이다. TV광고는 2027년에 스튜디오드래곤의 미국향 시리즈 오더 확보 여부가 핵심인데, 자동차는 2027년에 SDV Pace Car 출시로 자율주행 모멘텀이 가세할 것으로 기대한다. 하지만 둘 다 2027년이 현재 실적 하회와 주가 선반영의 구조적 한계를 넘어설 수 있는 전환점으로 보고 있고, 이는 하나증권의 주파수 경매 논리와도 궤를 같이 한다 — 주파수 경쟁력 격차가 확대될수록 주파수를 더 잘 할당받는 나라의 통신사가 수익성 방어와 주가 모멘텀에서 유리해질 수 있기 때문이다.\n\n---\n\n### 6. ESG: 의무공개매수와 공개매수법안, 수혜 주가의 시점과 설계\n\n한화투자증권은 10월 1일로 예정됐던 의무공개매수 법안(자본시장법 개정안 대안, 의안 2221615)의 본회의 상정이 9월 30일 보류됐다고 보고한다. 이 법안은 10월 1일로 예정됐던 본회의 상정을 9월 30일 보류했으며, 정무위원회와 법제사법위원회를 통과한 상태이다. 법안이 본회의를 통과해 공포되더라도 1년이 지나야 시행되고, 시행 이후 주식을 사는 거래부터 적용된다(부칙 제1조·제2조).\n\n이 법안의 핵심 조항은 다음과 같다:\n\n- **감사위원 선임 시 합산 3%룰 적용**: 감사위원을 선임하거나 해임할 때 최대주주의 지분을 합산해 3%까지만 의결권을 행사할 수 있다(상법 제542조의12 제4항).\n- **감사위원 분리 선임 의무**: 9월 10일부터 감사위원 중 최소 2명을 다른 이사와 분리해 선임해야 한다(상법 제542조의12 제2항).\n- **집중투표 배제 가능**: 자산총액 2조원 이상 상장사는 정관으로 집중투표를 배제할 수 있다(제542조의7 제3항).\n\n한화투자증권은 이 세 조항이 함께 적용되는 정기주총은 12월 결산법인 기준으로 2027년 3월에 열릴 것이라고 보고 있다. 이 법안은 최대주주의 지분이 줄어드는 것이 아니라, 감사위원 선임 시 행사할 수 있는 의결권이 제한된다는 점에서 주가에 미치는 영향을 재조정해야 한다.\n\n상장사 2,505곳의 최대주주 측 지분율 중앙값은 2026년 반기보고서 기준 40.2%다. 이 지분율을 가진 회사에서 일반주주(최대주주 측을 뺀 주주)의 절반이 출석한다고 가정하면, 최대주주 측의 표 비중은 일반 이사 선임 시 57%지만 감사위원 선임 시 9%로 낮아진다. 같은 가정에서 최대주주 측이 단독으로 과반의 표를 확보하는 회사는 일반 이사 선임 시 1,628곳(65%)인 반면, 감사위원 선임 시에는 5곳이다. 출석률을 20%로 낮춰도 감사위원 단독과반은 12곳에 그친다. 개인 주주가 많은 소형주에서만 이 수가 133곳으로 늘어난다.\n\n한화투자증권은 이 계산이 실제 표결 결과가 아니라, 동일한 지분과 출석률을 전제로 두 선임 방식의 의결권 구조를 비교한 것이라고 명시한다. 따라서 지분율만으로 수혜주를 고르기 어렵고, 최종 제도와 거래 조건을 확인해 공개매수로 팔 수 있는 물량과 남는 주식의 가치를 함께 따져야 한다.\n\n---\n\n### 7. 디지털자산: ETP, RWA, DeFi, Stablecoin\n\n#### ETP: Bitcoin 중심 유입 재개, Alttcoins의 종목별 차별화\n\n9월 디지털자산 ETP는 월초 유입 확대 이후 일시적인 자금 이탈을 거쳤다가, 월말 Bitcoin을 중심으로 유입이 크게 재확대됐다. 9월 3일 미국 현물 Bitcoin ETF에 약 7.3억 달러가 유입되며 2026년 1월 이후 최대 일간 순유입을 기록했고, 해당 주 Bitcoin ETP에는 약 9.8억 달러가 순유입됐다. 9월 둘째주부터는 Bitcoin을 중심으로 자금 흐름이 일시적으로 약화 — 디지털자산 ETP가 약 1.7억 달러 순유출, Bitcoin ETP에서 약 4.4억 달러 유출, Ethereum ETP에서는 약 1.6억 달러 유입으로 자산별 흐름이 차별화됐다. 이후 Bitcoin 가격 반등과 함께 자금 유입이 재확대됐다. 9월 21일 미국 Bitcoin 현물 ETF에 약 10억 달러가 순유입되며 해당 주 디지털자산 ETP 전체 순유입은 약 32.5억 달러로 연중 최대 수준을 기록했다.\n\nAlttcoins로도 자금 유입이 확산됐으나 종목별 차별화는 지속됐다. 9월 Zcash 약 2.2억 달러, XRP 약 1.7억 달러, Solana 약 2.3억 달러가 순유입된 반면, Hyperliquid에서는 약 450만 달러가 순유출됐다.\n\n#### RWA: 윙클보스 지원 지캐시 ETF, 나스닥 상장 SEC 신청\n\n윙클보스의 자산운용사가 제미나이 수탁으로 지캐시 현물 ETF를 SEC에 신청해 그레이스케일 상품과 경쟁한다. 프라이버시 코인까지 ETF 제도권에 편입되며 일반 투자자의 간접 노출 경로가 넓어진다.\n\n---\n\n### 8. 건설: 동해데이터센터 건축 허가 완료, 공공주택 착공 증가\n\nGS동해데이터센터 사업은 계획대로 진행 중이다. 동해시는 동해AI제3캠퍼스가 신청한 AI데이터센터에 대해 건축, 환경, 도시계획 등 관련 부서 및 관계기관 협의를 거쳐 10월 1일 최종 건축허가를 처리했다. 허가 대상은 100MW급으로 알려졌으며, 사업주는 올해 착공하여 2028년 하반기 준공을 목표로 사업을 추진할 계획이다. 이에 따라 10~11월에 관련 PF조달과 시공사 선정이 이어질 것으로 보인다.\n\n정부는 공공에서의 주택 공급 확대를 꾸준히 강조하고 있다. 대통령은 초과세수를 활용해 청년과 중산층용 공공장기임대 주택을 조기에 대량 공급할 것이라고 밝혔으며, 인허가 및 착공 증가, 신규택지 개발, 주거용으로 용도 변경 등을 예고했다. 국토부는 올해 수도권 내 공공주택 착공이 3분기 누적으로 1.7만호, 연말까지 6.2만호를 달성할 전망이라고 발표했다. 4분기에 공공주택 4.5만호 정도가 집중 착공될 것으로 전망한다. 내년에는 공공부문에서 8.4만호 착공을 목표로 하고 있다. LH를 중심으로 한 공공주택 발주가 확대될 것으로 전망되며, 이에 따라 LH향 수주 비중이 높은 건설사가 향후 실적 개선세가 뚜렷할 것으로 보인다.\n\n---\n\n### 9. 금융: 2027년 기준금리 상승 시나리오는 경기 방어주 역할\n\n유안타증권은 10월과 11월 금통위에서 기준금리를 기존 3.00%에서 3.25%로 추가 인상이 예상된다고 보고 있다. 이는 은행업종 지수 상승에 기대를 높이는 요인이다. 2027년 기준금리 상승에 대해서는 아직 단언할 수 없지만, 기준금리가 4분기 3.25%에서 3.50%로 25bp 상승한다면 은행업종 수익성 개선에 긍정적으로 작용할 것으로 전망한다. 반면, 경기 악화로 기준금리 상승이 어렵다고 한다면 주주환원율 상승 구간에서 경기 방어주 역할을 수행하며 상대적 양호한 주가가 이어질 것으로 판단한다.\n\n---\n\n### 10. 배당투자: 제도·공시·세제가 함께 요구하는 구조\n\n대신증권은 한국 주식시장 배당투자의 25년사를 돌아보며, 한국 기업의 배당은 누군가 요구할 때만 늘었고 요구가 사라지면 멈췄다고 진단한다. 그러나 현재는 공시, 세제, 법이 함께 요구하는 구조로 바뀐다. 코스피 결산 배당이 3년 연속 늘며 역대 최대(35.1조원)를 기록했고, 배당 지급 기업의 저변, 배당 규모, 제도가 같은 방향을 가리키는 지금을 배당 투자의 적기로 판단한다.\n\n---\n\n### 11. ESG & Transition: EUA 하락, EUA-TTF 상관관계 낮아짐\n\nEUA(European Union Allowance)는 9월 30일 이행 마감으로 의무 매수가 끝났고, 주간 1,187만톤의 경매가 이어지며 하락했다. 중동 긴장으로 TTF(Temperatures and Fuels for Trading)가 3.7% 오르고 브렌트유도 $102선에서 마감했으나, EUA는 9월 25일 €86.78/t → 10월 2일 €84.42/t로 €2.36 하락(WoW -2.7%)했다. EUA-TTF 20일 상관계수도 0.56에서 0.39로 낮아졌다.\n\nKAU26(한국거래소 CO₂ 배출권)은 9월 28일 29,900원으로 3만원을 내긴 했으나 이틀간 3만원선을 지켰다. 그러나 10월 1일 29,600원으로 다시 밀렸고, 9월 23일 대비 10월 2일 550원 하락(WoW -1.8%)했다.\n\n---\n\n### 12. 통신 주파수 경매: 미국 OBBBA 법안과 국내 5G 주파수 할당 폭\n\n하나증권은 미국 OBBBA 법안에 따른 2030년까지 800MHz의 5G/6G 용도 경매가 진행될 예정임을 지적하며, 국내 5G 주파수 할당 폭이 미국 대비 절반 수준에 불과하다고 지적했다. 주파수 할당 폭이 네트워크 품질로 귀결될 수 있다는 측면에서 우려가 적절하다. 문제는 앞으로 격차가 확대될 수 있다는 점이다. 미국은 이미 OBBBA를 제정했고, 국내는 아직 주파수 경매를 개최하지 않고 있는 상황이다. 주파수 경매가 없으면 시간이 지날수록 주파수 경쟁력 격차가 확대될 수 있다는 논리는, 하나증권의 주파수 경매 논리와 통신 Weekly 리포트에서의 MVNO 순감 논리가 만나는 지점이다. 주파수 경쟁력 격차가 확대될수록 주파수를 더 잘 할당받는 나라의 이통사가 마케팅·요금제 경쟁에서 우위를 점할 수 있는 구조다.\n\n---\n\n### 13. 통신 주파수 경매: 국내 주파수 할당 폭, 경쟁력 격차 확대 우려\n\n하나증권은 국내 5G 주파수 할당 폭이 미국 OBBBA 법안에 따른 2030년까지 800MHz의 5G/6G 용도 경매 규모의 절반 수준에 불과하다고 지적한다. 주파수 할당 폭이 네트워크 품질로 귀결될 수 있다는 측면에서 우려가 적절하다. 문제는 앞으로 격차가 확대될 수 있다는 점이다. 미국은 이미 OBBBA를 제정했고, 국내는 아직 주파수 경매를 개최하지 않고 있는 상황이다. 주파수 경매가 없으면 시간이 지날수록 주파수 경쟁력 격차가 확대될 수 있다는 논리는, 하나증권의 주파수 경매 논리와 통신 Weekly 리포트에서의 MVNO 순감 논리가 만나는 지점이다. 주파수 경쟁력 격차가 확대될수록 주파수를 더 잘 할당받는 나라의 이통사가 마케팅·요금제 경쟁에서 우위를 점할 수 있는 구조다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### ① 중국 위안화—글로벌 반도체 주가 동조화: 위안화 강세 기조의 세 가지 근거와 파생 효과\n\n하나증권은 SOX(반도체) 지수와 가장 높은 상관성을 갖추고 있는 것은 중국 위안화/달러 환율이라고 명시한다. 이는 중국이 로직칩(GPU 등)과 메모리(DRAM/HBM)의 최대 수입국(2026년 기준 1,100억 달러 순수입)—즉 \"최종 소비자\"—로서 해당 분야의 글로벌 수요를 좌우한다는 현실적 구조를 반영한다. \n\n그러나 위안화 강세가 지속 가능한 이유는 단순한 반도체 수요 때문이 아니다:\n\n첫째, 중국은 원유 역시 최대 수입국이며 고유가 시기를 맞아 수입 물가 방어를 위해 위안화 절상 기조를 유지해야 한다. 둘째, 중국의 무역수지가 3월(-500억 달러)부터 8월(+1,200억 달러)까지 급반등하며 위안화 강세 압력이 고착화되고 있고, 쇼핑백(Shopping Back)으로 돌아오는 외화 유입도 환율 상승을 지지한다. 셋째, 중국의 미 국채 보유액이 2008년 이후 최저치인 6,900억 달러 미만으로 감소하고 있어 미 국채 시장에서의 위안화 역내외 스프레드(-50핍)가 시장 주도형 강세를 만들어낸다. 마지막으로, 미국과의 관세 협상 리스크로 인한 위안화 약세 전환이 부담되므로 당국 입장에서도 강세를 용인할 가능성이 크다.\n\n결론적으로, 중국의 HBM·DRAM·GPU 등 AI 하드웨어 자급률이 아직 21%(메모리)/13%(로직)에 불과하다는 점을 감안할 때, 위안화 강세는 자급률 달성까지는 지속될 수 있는 구조적 요인이다. 따라서 글로벌 반도체 주가—특히 SOX—는 위안화 강세와 동조화된 흐름이 당분간 견고할 것으로 예측된다.\n\n---\n\n### ② Agentic AI: CPU의 역할 전환과 서버 CPU 시장의 2025→2030년 8.7배 성장 전망\n\nAMD에 따르면, Agentic AI(자체 계획 수립 · 외부 도구 호출 · 코드 실행 등의 Multi-Agent 처리) 환경에서 CPU는 GPU 대신 Orchestration(Controller) 역할을 수행한다. 기존 LLM(Large Language Model)이 단일 연산 구조였다면, Agentic AI는 \"작업 분석 → 계획 수립 → 데이터 검색 → 도구 호출 → 코드 실행\"이라는 복잡한 흐름을 요구하여 CPU 구성비를 늘린다.\n\n이는 이미 주가에 반영되기 시작했다. 2026년 4월 Intel 실적이 발표된 것을 계기로 AI 추론 workload 증가에 따른 CPU 수요 확대 기대가 부각되면서 Intel뿐만 아니라 AMD, Arm Holdings까지 동반 상승했다. 이후 CPU 관련주는 NVIDIA(NVIDIA) 대비 상대적으로 아웃페어먼스를 보였다. 즉, AI 수혜는 GPU 중심에서 CPU로 확산되는 초기 단계에 들어섰다는 결론이다.\n\nAMD는 서버 CPU 시장을 Agentic AI 기반으로 2025년 $250억 → 2030년 $2,200억으로 예상했는데, 이는 기존 서버 CPU 수요에 새로운 성장 동력을 덧붙이는 구조다. 따라서 CPU 수요는 단순한 GPU 수요 대체가 아니라, AI가 제공하는 새로운 컴퓨팅 패러다임 변화에 따른 수요 창출이다.\n\n---\n\n### ③ KOSPI 7,000P 하락과 외국인·기관 순매도: 실적 불확실성 vs. Earnings Surprises\n\nIBK투자증권에 따르면 2026년 10월 6일 코스피는 7,000P를 하회하며 전 거래일 대비 0.89%p(6941.39P)로 마감했다. 동시에 코스닥은 반도체 수급이 2차전지/바이오헬스/소부장으로 이동하면서 외국인과 기관 순매수에 급등해 전 거래일 대비 2.98%p(919.92P)를 기록했다. 이는 대형주 약세와 중소형주 강세가 동시 발생한 혼조세다.\n\n이를 이해하기 위해서는 두 가지 측면을 병렬적으로 들여볼 필요가 있다.\n\n#### —— 외국인·기관 순매도의 구조적 배경\n\nKEY POINT: 2026년 8월 19일 SK하이닉스는 40조원(소각 목적), 21일 삼성전자는 15조원(임직원 보상 목적)의 자사주 매입을 발표했으며, 10월 6일 기준 진행률은 각각 83%, 97%에 달했다. 두 기업의 합산 55조원 규모의 자사주 매입 계획이 거의 마무리되는 시점에서, 이를 지원해왔던 기타법인의 매수 여력이 줄어든 것이 코스피 하단을 지지하지 못하도록 만들었다는 게 IBK의 근거다. 이는 단기적인 수급 압력이 아니고, 자사주 매입 체계가 변경되면서 수급 구조 자체가 바뀐다는 중요한 변화다.\n\n#### —— 실적 불확실성과 Earnings Surprises\n\n대신증권은 이번 주 포커스로 \"저평가 우량주\"를 제시하면서 삼성전자, SK하이닉스, 삼성바이오로직스를 예시로 꺼냈다. 이는 실적 발표 이후 컨센서스 하향 조정이 이루어졌더라도 낮아진 눈높이를 충족하거나 상회할 가능성이 있다고 판단해서다. 그리고 대신증권은 \"Macro(유가, 금리, 통화정책)와 Micro(AI, 반도체 업황, 실적)\" 간 힘겨루기가 지속되고 있으며, 유가가 90달러 상회하고 미국채 10년물이 5.2% 상회하는 환경에서 Micro의 힘이 점차 강해져 KOSPI 상승 탄력이 강화될 것이라고 전망한다.\n\n이 두 주장은 서로 다르면서도 일맥상통한다. 자사주 매입 체계가 바뀜으로써 외국인·기관의 매수 여력이 줄어든 구조적 압력이 존재하지만, 그 압력이 오히려 실적 발표 이후 낮아진 눈높이를 충족할 가능성이 높은 상황에서 주가 하락을 제한하는 방향으로 작용할 수도 있기 때문이다. 즉, 자사주 매입 체계가 바뀌는 것이 반드시 하락의 원인은 아니고, 실적 불확실성과 Earnings Surprises가 다음 주 결정변수로 등장할 때 주가 방향이 정해질 수 있다.\n\n---\n\n### ④ 금리·유가·AI 주가의 삼중 압력과 키움증권의 전략적 읽기\n\n키움증권은 2026년 10월 6일(화) 미 증시가 9월 중동 원유 수출 회복, 프랑스의 재정 건전성 정책 제시에 따른 유럽발 국채 불안 완화로 인해 미 10년물 금리 급등세가 진정되면서 강세를 보였다고 분석했다. 당시 다우+0.5%, S&P500+0.6%, NASDAQ+0.5%, 필라델피아 반도체 지수+0.3%였다.\n\n그런데 한국증시는 이날 전 거래일 대비 0.89%p 하락한 6,941.39P로 마감했다. 이는 단순히 미국 금리가 하락했다고 하여 한국증시가 반사적으로 올랐다는 것이 아니라, 한편으로는 미국 금리가 하락했고 한편으로는 삼성전자 잠정실적 발표를 앞두고 있었던 상황에서 외국인이 차익실현 매물을 탁탁 냈기 때문이다.\n\n또한 키움증권은 2026년 10월 7일(수) 국내 증시가 미국 10년물 금리 5.3% 대 하회, 유럽발 국채 불안 진정에 따른 AI 인프라주 강세에 힘입어 상승 출발할 것이라고 예상했다. 그러나 장중에는 삼성전자 잠정실적 대기심리와 주 후반 휴장 경계심리가 중첩돼 상단이 제한되고 업종 순환매 장세로 전환할 것이라고 전망했다.\n\n이해를 깊이 하기 위해 키움증권이 제시한 추가 정보를 참고하자:\n\n- 미국 30년물 국채금리가 2002년 이후 최고치인 5.70%로 치솟았고, 브렌트유는 $100을 돌파했다(Bloomberg, investing.com).\n- 호르무즈 해협에서의 유조선 공격이 공급 불안을 악화시켰(The Star).\n\n즉, 미국 금리가 5.3%를 하회한다고 하더라도, 유가가 $100을 돌파하고 미국 30년물이 5.70%에 육박한 상황에서 미국 금리만 보면 낮은 수준이라 해도 국내 증시에 대한 대외 환경은 악화된 상태였다. 여기에 삼성전자 잠정실적이 발표될 시점이기도 했다.\n\n그래서 키움증권은 \"코스피가 재차 7,000P를 내주기는 했지만, 지난 1~2개월간 흐름상 저점을 높여가는 하방 경직성을 유지하고 있다는 점은 안도 요인\"이라면서도, 미국 나스닥, 일본 닛케이, 독일 DAX 등 여타 증시는 고점 대비 5% 미만의 낙폭을 축소한 반면, 코스피는 고점 대비 24% 급락한 수준에 머물러 있는 점을 문제로 지적했다(Korea Times, Brecorder). \n\n대만 가권은 신고가 영역에 있고, 미국 필라델피아 반도체 지수는 고점 대비 10% 미만의 낙폭을 축소하고 있다. 키움증권은 \"같은 글로벌 변수에 노출된 상태에서 코스피만 주가 회복력이 상대적으로 더딘 상황\"인데, 이는 단일종목 레버리지발 수급 왜곡 여진과 연초 이후 외국인의 누적 순매도 금액(180조원)이 개입됐음을 시사한다고 보았다. \n\n단일종목 레버리지발 변동성 증폭 사태는 진정됐고, 외국인 차익실현 압력이 확산될 여지도 낮아졌다. 이런 맥락에서 전일 코스닥 내 반도체 소부장, 이차전지, 바이오 업종이 동반 강세를 연출했다는 점은 코스피 전반의 위험선호 약화로 보기 어렵다는 것이다.\n\n따라서 키움증권의 결론은 다음과 같다:  \n—— 코스피의 하방 경직성이 유지되고 있고, 외국인 차익실현 압력이 완화되고 있음  \n—— 삼성전자 잠정실적이 3분기 실적 시즌의 시작점이 될 것임  \n—— 3분기 실적 시즌에서 \"3분기 이익 훼손 제한 + 2027년 이익 전망 개선\"이 확인되면 외국인 수급이 개선되고, 국내 증시와 여타 증시 간 수익률 격차가 축소될 가능성이 열릴 것  \n\n---\n\n### ⑤ PER 디레이팅의 두 얼굴: 금리와 순이익률의 경쟁적 해석\n\n신한투자증권은 PER 디레이팅을 두 가지로 해석한다.\n\n**장기적 관점**: PER은 금리와 순이익률이 함께 동행한다. 장기간 순이익률이 상승하면 PER 리레이팅이 발생하며, 이는 높아지는 경제적 해자와 낮아지는 펀더멘탈 불확실성을 의미한다. 즉, PER이 높아지는 것은 장기적인 펀더멘탈 개선의 신호로 볼 수 있다.\n\n**단기적 관점**: 순이익률이 단기 급등하면 PER은 하락하고, 단기 급락하면 PER은 상승한다. 단기적인 순이익률 상승이 장기 평균으로 수렴할 것이라는 시장의 믿음 때문이다. 이는 PER 디레이팅이 단기적인 순이익률 상승을 반영하는 방식으로 작동한다는 것을 의미한다.\n\n이 두 해석은 시간의 개념에서 차이를 보인다. 만약 2026년 Q3/Q4 실적 발표가 2026년 Q4 중후반에 집중한다면, PER 디레이팅이 단기적 순이익률 상승에 대한 시장의 조정 반응인지, 혹은 장기적인 해자가 향후 몇 분기 동안 지속될지를 결정하는 지표인지에 따라 이 해석의 방향이 달라진다. 2026년 10월 7일 현재는 단기적 관점이 우선 적용되는 시점이겠지만, 키움증권이 제시한 3분기 실적 시즌의 흐름이 확인되면 장기적 관점으로 해석의 중심이 이동할 수 있다.\n\n---\n\n### ⑥ Earnings Surprise와 스마트 컨센서스: KOSPI에서 KOSDAQ으로의 모멘텀 이동\n\n신한투자증권은 스마트 컨센서스(smart consensus)를 일반 컨센서스(general consensus)와 구분지어 설명한다. 일반 컨센서스는 1개월(Monthly)과 3개월(Quarterly) 내 추정치를 동일 가중 평균하여 오래된 전망과 최신 전망이 같거나 비슷한 비중으로 반영하는 반면, 스마트 컨센서스는 최근 발간된 추정치에 높은 가중치를 부여해 적시성을, 적중률이 높은 애널리스트를 우대해 정확성을 동시에 보완한다. 실제로 실적에 대한 적중률이 높아, 기존 컨센서스와의 괴리를 통해 실적 서프라이즈 가능성을 사전에 선별하는 지표로 활용된다.\n\n대신증권은 KOSPI의 12개월 선행 순이익은 상승 흐름을 이어가고 있지만, 최근 대형주를 중심으로 EPS 상향 속도가 둔화되었다고 밝힌다. 반면 KOSDAQ은 IT 부품과 소부장을 중심으로 이익 추정치 개선이 빨라지고 있으며, 스마트 컨센서스 기준 순이익 반등이 기존 컨센서스를 선행하고 있다. 즉, KOSDAQ은 이익 모멘텀이 KOSPI보다 먼저 활성화되고 있는 국면이다.\n\n신한투자증권은 이를 이렇게 정리했다: \"대형 반도체 중심으로 전개됐던 이익 장세가 KOSDAQ과 중소형주로 확산되는 과정에서 지수 전체보다 실제 이익 상향이 지속되는 업종과 종목을 선별하는 전략이 중요할 전망이다.\"\n\n이 두 리포트는 같은 현상—\"KOSPI 대형주 EPS 상향 둔화 / KOSDAQ 소부장·IT 소부장 EPS 개선 가속\"—을 각각 다른 접근법으로 설명하고 있다. 신한투자증권은 이 현상을 스마트 컨센서스 기준으로 분석하고, 대신증권은 KOSPI 대형주와 KOSDAQ 중소형주 간 이익 모멘텀의 이동으로 해석하고 있다. 두 해석은 궁극적으로 동일한 방향을 가리킨다: KOSDAQ이 KOSPI보다 더 많은 실적 서프라이즈 가능성이 존재하고 있으며, 이익 모멘텀은 대형주에서 중소형주로 이동하고 있는 국면이다.\n\n---\n\n### ⑦ 마이크론·삼성전자 잠정실적: 기대치 하향 조정 vs. 낮아진 눈높이 충족 가능성\n\n대신증권은 마이크론에 이어 이번 주 삼성전자 잠정실적 발표가 중요하다고 명시한다. 컨센서스 하향 조정이 이루어지면 실적 눈높이가 하향 조정되고, 실적 불확실성이나 불안심리가 선반영 된다고 설명한다. 그러나 낮아진 눈높이를 충족하거나 상회할 가능성이 높다고 판단한다. 여전히 저평가 국면에 위치하고 있으며, Micro 모멘텀이 강화되고_MACRO 압박이 완화될 경우 KOSPI 상승 탄력이 강화될 것이라고 전망한다.\n\n이 판단은 앞서 키움증권이 제시한 3분기 실적 시즌의 흐름(\"3분기 이익 훼손 제한 + 2027년 이익 전망 개선\")과 연결된다. 만약 삼성전자 잠정실적이 컨센서스를 하향 조정하더라도 낮아진 눈높이를 충족하거나 상회한다면, 그것은 단순한 하향 조정이 아니라 2027년 이익 전망 개선의 신호로 읽힐 수 있다. 따라서 삼성전자 잠정실적 발표는 KOSPI 전반의 방향성을 결정짓는 분기점이 될 수 있다.\n\n---\n\n### ⑧ FX: 유로화 반등과 달러화 약세, 일본 엔화 약세의 구조적 근거\n\n키움증권은 2026년 10월 7일 달러화가 프랑스발 재정 불안이 다소 진정되며 유로화가 반등한 영향으로 하락했다고 분석했다. 프랑스 대선 후보 마린 르펜(National Rally) 의원이 2032년까지 1,400억 유로 규모의 순지출 절감 계획을 제시하면서 프랑스 국채금리가 하락했다. 이로 인해 최근 확대됐던 프랑스 재정 불안이 다소 진정됐고, 유로화가 달러 대비 강세를 보였다. 반면 엔화는 일본 외환당국의 개입 경계에도 불구하고 정부의 확장적 재정정책과 국채 발행 확대 가능성에 대한 우려가 이어지며 달러 대비 약세를 보였다.\n\n이 사건은 달러화 약세의 두 가지 근거를 동시에 보여준다. 하나는 프랑스 재정 불안이 진정되면서 유로화가 강세를 보였고, 하나는 엔화 약세가 일본의 재정 확장 우려를 반영했다. 두 나라의 재정 정책 방향이 달라졌음에도 달러화는 약세를 보인다는 것은, 달러화 약세가 단순히 미국의 재정 또는 통화 정책에만 의존하는 것이 아니라, 세계 경제에서의 미국 대비 상대적 위험 선호 정도를 반영하는 구조적 요인이라는 점을 함축적으로 알려 준다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n오늘의 시장 상황은 미국 고용 지표의 부진과 임금 성장 둔화, 프랑스 국채금리의 정치적 불안 요인, 한국 증시의 외국인·기관 동시 매도, 글로벌 금리와 유가 상승 등 다양한 요인이 복합적으로 작용한 것으로 보인다. 이는 단순한 시장 선택적이 아닌 글로벌 파급 효과가 강한 구조적 충격으로 해석할 수 있다. 특히, 한국 증시는 미 국채 금리 상승과 고용 불확실성의 복합적 영향을 받으며, 외국인 자금 유출과 글로벌 캐리 압력에 직면할 가능성이 크다. 다만, 이러한 상황 속에서도 일부 섹터나 기업은 수요 증가, 수직적 공급망 강화, 재정적자 축소 등 구조적 요인에 의해 상대적 우위를 점할 수 있다는 시각도 가능하다."}]}</script>
