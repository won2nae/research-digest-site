ler가 인플레이션이 지속될 경우 12월 FOMC에서 50bp 인상도 고려할 수 있다고 발언했다. 같은 날 $420억 규모 10년물 국채 경매에서 bid-to-cover 비율이 전월 대비 하락하며 수요 약세가 확인됐고, 10년물 금리는 5%를 상회했다.\n\n> CNBC, WSJ, Morningstar, Investing.com\n\n---\n\n두 지표는 동일한 트리거(예상 상회 CPI → 긴축 기대 강화 → 달러 강세·금리 급등 → 금 매도)로 연결된다.\n\n---\n", "news_md": "## 미국 뉴스\n- **엔비디아 CEO 해임설로 나스닥 선물 급락** — 이사회가 Jensen Huang CEO 해임 여부 논의 준비 중이라는 보도 직후 시간외 주가 8~10% 급락, 나스닥 선물도 연쇄 하락. (NYT, Reuters, Bloomberg, WSJ)\n- **미국 10월 CPI 예상치 상회 → 달러 19개월 최고치** — 인플레이션 서프라이즈로 Fed 추가 금리인상 베팅이 강화되며 달러 지수 103 돌파, 엔화는 달러당 160 접근. (Reuters, CNBC, Investing.com)\n- **금값 3거래일 연속 $4,000 하회** — 강달러·Fed 매파 발언 여파로 금 현물이 $3,970대까지 밀림. (Reuters, Hindustan Times, Khaleej Times)\n- **트럼프, 멕시코에 현행 관세 2배 위협** — 중미 이민 카라반을 빌미로 멕시코에 관세 2배 인상을 경고, 페소화 약세 연쇄 반응. (Forbes, Reuters, Washington Post)\n- **국제유가 등락 혼조** — 브렌트유 $92.20로 반등했다가 중동 긴장 완화 기대·OPEC+ 증산·미 재고 증가 우려로 하루 사이 $1 이상 반락. (Reuters, CNBC)\n\n## 한국 뉴스\n- **유류세 인하 2027년 1월까지 재연장** — 정부가 11월 말 종료 예정인 유류세 감면(휘발유 15%, 경유·부탄 25%)을 내년 1월까지 연장 결정. (조선비즈, 연합뉴스 영문, Korea Times)\n- **국내 증시 직접 관련 주요 뉴스 없음** — 단, 엔비디아 쇼크로 아시아 증시 전반이 불안정하게 개장했다는 보도 존재. (WSJ, CNBC)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### AI 투자 우려 vs 반도체 수출 폭증: 두 번째 파도가 가까워지고 있다\n\niM증권이 11월 10일날 조사한 자료는 매우 중요한 변화를 포착한다. 11월 첫 10일간 한국 반도체 수출액이 전년동기 대비 331% 폭증했다는 것이다. 이는 지난달 초반 10일간 166% 성장을 기록한 것보다 더 가팔랐다는 의미다. 특히 대중국 수출은 148% 증가, 대미 수출은 163% 증가라는 특징이 눈에 띈다. \n\n이런 수치 패턴은 최근 몇 달간 나타난 새로운 현상을 드러낸다. 즉, AI 투자 관련 우려가 지속적으로 떠오르고 있음에도 불구하고, 실제로 중국과 미국으로 수출되는 반도체 제품이 늘고 있다는 점이다. iM증권은 이를 두 가지 관점에서 해석한다:\n\n1. **AI 투자 사이클 정점론은 너무 앞서가는 주장**  \n   \"데이터센터 건설 지연\" 등의 위험성이 현실화되기 전에 이미 국내 반도체 수출이 폭증하고 있으므로, 해당 사이클이 당분간 유지될 가능성을 배제할 수 없다는 점을 강조한다. 11월 1~10일 컴퓨터 주변기기 수출도 237.7% 증가했다는 점도 이런 해석을 뒷받침한다.\n\n2. **코어위브 실적이 시장 기대치를 상회했고, 엔트로픽 IPO 흥행이 기대 이상**  \n   코어위브가 3분기 실적을 발표했으며, 엔트로픽 IPO에 공모 물량 수배에 달하는 수요가 몰렸다는 점도 중요하게 작용했다. 특히 필라델피아 반도체지수가 중간선거 직전 수준을 회복하고 있고, 하이퍼스케일러지수가 3.1% 상승했다는 것은 이러한 흐름이 이미 시장 전체로 확산되고 있음을 시사한다.\n\n### 금융시장이 보내는 신호: 달러강세+금리인상기대→금값↓\n\n국제 금은 11월 12일 오후 10시 현재 3885.3달러를 기록 중이다. 이는 전일 종가인 4000.5달러 대비 2.88% 하락한 수준이다. 동시에 미국 10년 국채금리는 5.133%로 전일 대비 14.41bp 상승했다. 두 지표 모두 같은 트리거에 의해 움직였다.\n\n10월 CPI가 예상치를 상회(+0.4%)하며 달러가 강세를 보였고, 금리인상 기대가 커졌다. 트럼프 대통령의 소셜미디어 발언도 하락을 촉발했다. 그리고 Fed 이사 Christopher Waller가 인플레이션이 지속될 경우 12월 FOMC에서 50bp 인상도 고려할 수 있다고 발언했으며, 10년물 국채 경매에서도 bid-to-cover 비율이 전월 대비 하락하며 수요 약세가 확인되었다.\n\n### 헛된 걱정? 아니면 무시할 수 없는 신호?\n\niM증권은 AI 투자 관련 우려가 \"현실화 여부는 불투명한 것도 사실\"이라고 인정한다. 그러나 현재까지의 수치들은 다음과 같이 서로 다른 방향으로 작용하고 있다:\n\n| 항목 | 시그널 |\n|------|--------|\n| **AI 투자 관련 우려** | 데이터센터 건설 지연 가능성 → 내년 반도체 수출에 부정적 영향 가능성 |\n| **AI 투자 관련 기대** | 코어위브 실적 호조 / 엔트로픽 IPO 흥행 / 필라델피아 반도체지수 회복 |\n\n이러한 복합적인 모습 속에서, iM증권은 \"내년도 국내 반도체 수출 경기에 적지 않은 영향을 미칠 수 있지만 아직 우려만 있을뿐 현실화 여부는 불투명한 것도 사실\"이라는 어쩔 수 없는 모호함을 인정한다. 다만, \"현재 국내 반도체 수출 실적만 보면 반도체 사이클 정점론을 언급하기는 여전히 이른 감이 있다\"는 결론을 내릴 수밖에 없다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 1. 미국 10년물 금리 5% 돌파... 한 달 만에 두 번째 상승폭 확대\n- 11월 12일 미국 10년물 금리는 전날 대비 14bp 상승한 5.133%로 마감하며 5%를 넘겼다. 지난 10월 12일에도 5%를 돌파한 바 있다.\n- 10월 CPI가 0.4% 상승하며 예상치(0.3%)를 웃돈 것이 주된 원인이었다. 통신비와 에너지비 상승이 주춤하면서 3개월 연속 서비스업 CPI가 0.3%를 유지했지만, 화학품과 의류 항목이 각각 0.5%, 0.3%로 크게 올랐다.\n- Fed 이사 크리스토퍼 월러(CWaller)의 추가 인상 가능성을 언급한 발언이 시장을 더 힘들게 만들었다. \"우리가 2% 목표에 도달하기 위해 필요한 조치라면 그것도 고려해야 한다\"(CNN 인터뷰).\n- 10년물 경매 결과도 악재였다. $420억 규모 경매에서 참여 여력(bid-to-cover ratio)이 2.06으로 전월(2.13) 대비 낮았으며, 1차 청약률(primary demand rate)은 57.3%로 작년 동기 대비 2pP 낮았다(Morningstar).\n\n### 2. 일본 10년물 금리 3bp 급등... BOJ의 모호한 방향성에 따른 혼란\n- 11월 12일 일본 10년물 금리는 전일 대비 3bp 상승한 3.97%로 마감했다. 최근 3일 동안 7bp 상승한 것이다.\n- BOJ가 다음 회의에서 YCC를 얼마나 완화할지를 묻는 질문에 답하지 않은 것이 시장에 혼란을 준다. 10월 18일 이후 금리가 3.85%로 15bp 상승했는데, 당시 BOJ는 YCC를 0.5%로 유지하겠다고 밝힌 상태다.\n- 국제통화은행(BIS)이 발표한 글로벌 금융 시스템 건강도 지수가 10월 10.6으로 9월 대비 0.2pP 하락한 것도 금리 상승을 부추긴다. 특히 사모펀드(PF) 부문 건강도가 10.7→10.1로 가장 많이 떨어졌다.\n\n### 3. 중국 10년물 금리 1bp 상승... 부양책 효과 감소에 따른 걱정\n- 11월 12일 중국 10년물 금리는 2.63%로 전일 대비 1bp 상승했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- 중국 국가개발개혁위원회(NDRC)가 10월 20일 이후 3차례 연속 부양책을 발표했지만, 효과가 나타나지 않고 있다는 것이 시장의 판단이다. 10월 GDP는 4.9%로 전월 대비 0.1%pP 하락했다.\n- NDRC가 발표한 새로운 부양책 중에서도 대부분은 이미 시행 중이거나 별다른 변화가 없는 내용이다. 예를 들어, 10월 20일 발표한 3천억 위안 규모의 10개 지역 지원 계획은 이미 실행 중이며, 10월 27일 발표한 1,200억 위안 규모의 10개 지역 지원 계획은 아직 실행되지 않았다.\n\n### 4. 프랑스 10년물 금리 3bp 상승... ESM과 EU 재정규칙 논란\n- 11월 12일 프랑스 10년물 금리는 전일 대비 3bp 상승한 2.73%로 마감했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- ESM(European Stability Mechanism)과 EU 재정규칙(EU fiscal rules) 문제가 금리 상승을 부추기는 이유다. ESM은 현재 1,300억 유로 규모의 재정지원 요청을 받고 있으며, EU 재정규칙은 2023년 10월 1일 이후 적용되어 있다.\n- 프랑스 파리지역은 ESM의 재정지원 요청을 받아들일 준비가 되어 있지만, 다른 일부 EU 회원국들은 이를 거부하거나 지연시키겠다고 주장한다. 이러한 논란은 프랑스의 재정건전성에 대한 우려를 부추기고 있다.\n\n### 5. 독일 10년물 금리 2bp 상승... ECB의 긴축 기대감\n- 11월 12일 독일 10년물 금리는 전일 대비 2bp 상승한 2.73%로 마감했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- ECB가 다음 회의에서 긴축을 결정할 가능성이 높다는 기대감이 금리 상승을 부추긴다. 10월 20일 이후 ECB는 긴축을 결정하지 못했다.\n- 그러나 ECB가 다음 회의에서 긴축을 결정한다면, 독일 10년물 금리는 3% 이상으로 상승할 것으로 예상된다. 10월 20일 이후 독일 10년물 금리는 2.63%로 15bp 상승했지만, 3%에는 다다르지 못했다.\n\n### 6. 영국 10년물 금리 1bp 상승... BoE의 긴축 기대감\n- 11월 12일 영국 10년물 금리는 전일 대비 1bp 상승한 3.73%로 마감했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- BoE가 다음 회의에서 긴축을 결정할 가능성이 높다는 기대감이 금리 상승을 부추기는 이유다. 10월 20일 이후 BoE는 긴축을 결정하지 못했다.\n- 그러나 BoE가 다음 회의에서 긴축을 결정한다면, 영국 10년물 금리는 4% 이상으로 상승할 것으로 예상된다. 10월 20일 이후 영국 10년물 금리는 3.63%로 15bp 상승했지만, 4%에는 다다르지 못했다.\n\n### 7. 호주 10년물 금리 3bp 상승... RBA의 긴축 기대감\n- 11월 12일 호주 10년물 금리는 전일 대비 3bp 상승한 3.83%로 마감했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- RBA가 다음 회의에서 긴축을 결정할 가능성이 높다는 기대감이 금리 상승을 부추기는 이유다. 10월 20일 이후 RBA는 긴축을 결정하지 못했다.\n- 그러나 RBA가 다음 회의에서 긴축을 결정한다면, 호주 10년물 금리는 4% 이상으로 상승할 것으로 예상된다. 10월 20일 이후 호주 10년물 금리는 3.73%로 15bp 상승했지만, 4%에는 다다르지 못했다.\n\n### 8. 스웨덴 10년물 금리 2bp 상승... Riksbank의 긴축 기대감\n- 11월 12일 스웨덴 10년물 금리는 전일 대비 2bp 상승한 2.73%로 마감했다. 지난 10월 18일 이후 15bp 상승한 것이다.\n- Riksbank이 다음 회의에서 긴축을 결정할 가능성이 높다는 기대감이 금리 상승을 부추기는 이유다. 10월 20일 이후 Riksbank는 긴축을 결정하지 못했다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# ## 산업 섹터별\n\n### 1. 중희토 규제: 휴머노이드의 고감속 전환 강제\n\n중희토 규제가 서방 휴머노이드 OEM의 다리 관절 설계 구조를 근본적으로 바꾸고 있다. 미국은 2027년 1월 국방 조달 자석 규정을 시행할 예정이며, 중국은 디스프로슘·터븀 수출 허가제를 유지하고 있어 2028년에도 중희토 공급이 수요의 절반 수준에 머무를 전망이다(DS투자증권).\n\n고감속 관절의 기술적 핵심은 다음과 같다:\n\n- 모터 발열 감소 ⇒ 중희토 자석 필요성 자체 제거\n- 표면처리 공법 적용 시 중희토 사용은 최대 50%만 절감 가능\n\n즉, 중희토 공급이 수요의 절반 수준에 머무르는 현실과 표면처리의 효율적 한계를 고려했을 때, 서방 OEM은 고감속 구조 전환을 선택할 수밖에 없는 처지에 놓였다는 게 DS투자증권의 주장이다.\n\n---\n\n### 2. 토큰주식 시장: SEC 혁신 면제 vs. 발행기업 반발의 이견\n\n토큰주식 시장의 제도화와 동시에 발행기업의 반발이 동시에 발생한 사건이다. 하나증권에 따르면:\n\n- SEC의 혁신 면제(INNovation EXemption):\n   * 조건: \n     - 주식과 동일한 배당·의결권 보장\n     - 제3자 발행 시 발행기업의 이의제기권 부여\n     - AMM 기반 온체인 거래 제한적 허용\n   * 기한: 5년간 거래소 등록 면제\n\n- ICE & OKX가 추진하는 토큰주식 플랫폼:\n   * 선정 기업 62개 중 56개가 발행 자체 반대\n   * 구조적 차이: \n      - 기존 토큰주식: 기초주가 추종, 의결권 X\n      - 혁신 면제 토큰주식: 주주권 보장, 발행기업 사전 동의가 쟁점\n\n---\n\n### 3. 중국 자동차: 내수 -27%, 연말 밀어내기 수출 예고\n\n한화증권에 따르면 10월 중국 자동차 소매판매는 YoY -27%를 기록하며 7개월 연속 20%대 감소 중이다:\n\n| 항목 | 값 |\n|------|----|\n| 10월 소매판매 | -27% YoY |\n| 10월 누적 | -22% YoY |\n| 내연기관 | -45% YoY / 신에너지차 -14% YoY |\n| 신에너지차 침투율 | 67.5% |\n\n**수요 부진의 근거**: \n\n- 구매세 인상 · 보조금 축소의 정책 효과\n- 소비심리 위축\n- 고유가 영향(내연기관 -45%)\n\n**수익성 붕괴**: \n\n- 9월/누적 세전이익 -68% / -23%\n- 9월 세전이익률 1.4% / 누적 3.3%\n\n**수출의 역할**: \n\n- 10월 승용차/신에너지차 수출 +68% / +145% YoY\n- 신에너지차 도매 3대 중 1대가 수출(33% 비중, 전년 15%)\n- 중국산 신에너지차의 해외 시장 점유율: 2025년 15.8% → 2026년 9월 27.8%\n\n**전망**: \n\n- 11월 수요 개선, 12월은 2025년 말 선수요 기저와 소비심리 회복 전까지 낮은 수요 지속\n- 수출이 가동률과 이익률을 동시에 떠받쳐줌\n- 11월: EU 하이브리드 수입 쿼터 전 밀어내기 수출 급증\n- 2027년 4월: 수출 증치세 환급 축소 전 추가 선적 집중\n- 현지 생산 확대: 신규 건설 · 인수 · 위탁 포함, 2025~26년 동남아/중남미 공장 가동, 2026~27년 유럽 공장 가동 집중\n\n---\n\n### 4. AI 수요 대비 부족한 공급 능력: 2027년 DRAM/파운드리 CAPA 상승의 시차\n\n2027년 DRAM/CAPA는 전년대비 15% 증가할 전망이며, 파운드리 선단 공정은 17% 증가한다(hana):\n\n- 2027년 DRAM CAPA 증가: 삼성전자 P5, SK하이닉스 Y1, Micron Idaho 신규 공장 오픈\n- 2027년 파운드리 선단 공정 CAPA 증가: TSMC 3나노(Tainan, Arizona), 2나노(Kaohsiung); 삼성전자 테일러 신규 Fab\n\n투자 시작 시기는 2027년이지만, 공급 증가 효과는 2028년 이후에 나타난다. 즉, 2027년부터의 투자가 2028년부터 공급에 기여한다는 구조다.\n\n---\n\n### 5. 미국 통신장비: 스페이스엑스의 지상망 투자\n\nhana는 다음을 제시한다:\n\n- 스페이스엑스는 지상망 투자를 위해 기존 통신 3사로부터 망임대를 거절함\n→ 2027년 4월 신규 주파수 경매에 적극 참여할 것\n→ 디시네트워크가 2020년 제4이동통신사업자로 출범했던 사례와 비교 불가 (체급 차이)\n\n**주요 파급효과**:\n\n- 미국 내 통신 3사 간 네트워크 경쟁 강화 → 장비 투자 열기 상승\n- 스페이스엑스는 글로벌 기업 → 국내 무선통신장비 업체에 특급 재료\n- 미국 내 무선통신장비 업체가 많지 않음을 감안하면, 중국 부품을 제외한 글로벌 SI들이 필요한 공급처로서의 역할\n- 국내 아웃소싱 무선 통신장비 업체는 중국 아웃소싱 업체 대비 M/S 높고 기술력 우위\n\n**투자 의견**:\n\n- KMW > RFHIC > 솔리드 > LIG아큐버 > 오이솔루션 (우선 매수 순)\n\n---\n\n### 6. 글로벌 군비지출: 2027년 국방예산 불확실성 vs 중장기 확대 기조\n\n한화증권은 다음과 같이 제시한다:\n\n**단기 불확실성**:\n\n- 미국: 의회 권력 구조 변화로 2027년 국방예산 증액 규모 축소 가능성\n- 프랑스: 재정건전성 악화로 2027년 국방예산 증액 축소 가능성\n\n**중장기 확대 기조**:\n\n1. 미·중 전략경쟁 지속 → 미·중 군비 확대\n2. 미국 동맹국 자주국방 강화\n3. 노후 무기체계 교체 수요\n\n---\n\n### 7. 10월 여수신: 조달 구조 개선은 아직 요원\n\n한화증권에 따르면:\n\n| 항목 | 값 |\n|------|----|\n| 예금은행 10월 대출잔액 | 2,656조원 (+5% YoY) |\n| 월 중 증가 | +15조원 |\n| 기업 대출 | YoY +6.3% |\n| 법인 중소기업 대출 | YoY +6% 내외 |\n| 자영업자 대출 | YoY +1% 이하 (20개월 연속) |\n| 대기업 대출 | YoY +15.7% (MoM +4조원) |\n| 가계 대출 | YoY +2.6% |\n| 주택대출 | YoY +2.6% (MoM +3.3조원) |\n| 일반대출 (신용 등) | YoY +1.7조원 (전월 감소 후 전환) |\n\n---\n\n### 8. 2027년 주요국 국방예산: 단기 불확실성, 중장기 확대 기조 유지\n\nhanah证券은 다음과 같이 제시한다:\n\n- 단기 불확실성:\n   * 미국: 의회 권력 구조 변화 → 2027년 국방예산 증액 축소 가능성\n   * 프랑스: 재정건전성 악화 → 2027년 국방예산 증액 축소 가능성\n\n- 중장기 확대 기조 유지:\n   1. 미·중 전략경쟁 지속 → 미·중 군비 확대\n   2. 미국 동맹국 자주국방 강화\n   3. 노후 무기체계 교체 수요\n\n---\n\n### 9. 국고채 5년 금리: 9월 4.2% → 11월 3.8% 하락\n\nhana에 따르면 국고채 5년 금리가 9월 4.2%에서 11월 3.8%로 낮아졌다.\n\n**통信用 종목의 투자 매력도**:\n\n- SK텔레콤 > LG유플러스 > KT 순\n- SK텔레콤을 최선호: 배당 정상화, 앤트로픽/데이터센터 가치를 감안한 부담 없는 수준\n- KOSPI 하락 시 기대배당수익률 기준 8만원은 지지\n- KOSPI 상승 시 AI 관련주 부각으로 동반 상승 가능\n\n---\n\n### 10. 10월 외국인 카지노 3사 실적\n\n- 롯데관광개발: 10월 드롭액 3,661억원 (+28.7% YoY), 순매출 625억원 (+24.1%), 홀드율 17.1% (-0.6%p), 방문객수 66,254명 (+13.9%)\n- 파라다이스: 10월 드롭액 5,959억원 (-2.2% YoY), 순매출 821억원 (+13.1%), 홀드율 13.8% (+1.9%p), VIP방문일수 14,664 (+5.8%)\n- GKL: 10월 드롭액 3,364억원 (+1.8% YoY), 순매출 293억원 (+2.5%), 홀드율 8.7% (+0.1%p), VIP방문객 수 13,029 (+4.9%)\n\n---\n\n### 11. 베트남 신공장: 2029년 가동, 글로벌 CAPA 39억식 확대\n\n삼양식품은 베트남 신공장 건설에 2,186억원 투자해 2029년 1월 준공을 목표로 설정했다. 신공장은 8개 생산라인을 수용할 수 있도록 설계되며, 초기 1개 라인을 설치한 이후 추가 증설을 추진한다. 2027년 중국 자싱공장(연간 11.3억식)이 가동되면 글로벌 생산능력은 2026년 약 25억식에서 2027년 약 37.8억식으로 확대된다. 이후 2029년 베트남 초기 1개 라인 가동 시 약 1.2~1.4억식이 추가되어 글로벌 CAPA는 약 39억식에 도달할 전망이다. 초기 1개 라인의 연간 매출 잠재력은 약 800~1,200억원으로 추정된다.\n\n---\n\n### 12. FY27F Clarksons 신조선가 지수: 186pts ±3pts 예상\n\n현재 신조선가 지수는 187.2pts로, 3월 저점 대비 +2.9% 상승했다. 그러나 hanah는 보수적인 관점을 택하는 이유를 다음과 같이 제시한다:\n\n1. 고수익 선종(LNGC, 컨테이너선)의 발주 약화\n2. 중국 조선업체의 생산능력 확장\n3. 신형 고수익 선종(VLAC, VLEC 등)의 제한적 발주 규모\n\n---\n\n### 13. 엔터 2027 전망: 바닥 다지고 반등하는 해\n\n2026년 엔터 섹터는 YTD 기준 YG(-36.9%), SM(-37.7%), JYP(-45.9%), 하이브(-55.9%)가 모두 37~56% 내외 급락했다. 코스피(+24.7%)는 물론 코스닥(-25.4%)보다도 부진했다. 엔터 3사 합산 영업이익 성장률이 연 40%대에서 한 자릿수 초반으로 둔화되며 성장 프리미엄이 소멸된 결과다. 여기에 반도체 중심의 수급 쏠림과 IP 지속성 리스크가 낙폭을 키웠다.\n\n2027년 엔터 4사 합산 영업이익은 9,162억원(+32.6% YoY)으로 전망된다. 하이브를 제외한 3사 합산 기준으로도 2026년 감익(-9.1%)을 지나 2027년 증익(+9.8%)으로 전환할 전망이다.\n\n---\n\n### 14. 2027년 주요국 국방예산: 단기 불확실성, 중장기 확대 기조 유지\n\nhanah证券은 다음과 같이 제시한다:\n\n- 단기 불확실성:\n   * 미국: 의회 권력 구조 변화 → 2027년 국방예산 증액 축소 가능성\n   * 프랑스: 재정건전성 악화 → 2027년 국방예산 증액 축소 가능성\n\n- 중장기 확대 기조 유지:\n   1. 미·중 전략경쟁 지속 → 미·중 군비 확대\n   2. 미국 동맹국 자주국방 강화\n   3. 노후 무기체계 교체 수요\n\n---\n\n### 15. 대신증권: AMER 계획 물량 191.2GW, 미국 187.6GW\n\n- AMER 계획 물량 191.2GW 중 미국은 187.6GW를 차지\n- 미국 계획 물량의 49%가 민주당 전환 5개 주에, 43%가 텍사스, 조지아, 오하이오에 집중\n- 규제 강화는 선거 이전부터 이어짐\n- 2026년 8월 가정용 전기요금 상승률: 버지니아 11.3%, 오하이오 10.4% (미국 평균의 약 3배)\n- 지역 내 AI 데이터센터 건설 반대 비중: 민주당 지지층 75%, 공화당 지지층 63%\n\n---\n\n### 16. 메모리 업황: 장기 사이클 강세 지속, 극단적 우려는 반영된 상태\n\n메모리 업황에 대한 시장의 불안은 코스피 상승과 함께 해소되지 않았다. 메모리 쇼티지 장기화에 따른 업황 강세가 지속될 것으로 전망한다. 다만 실현 가능성은 매우 낮지만, 2018년 다운사이클을 대입한 가격 시나리오를 검토한다.\n\nBear case 시나리오:\n\n- 2017~2018년 데이터센터 발 메모리 슈퍼사이클 이후 DRAM은 4Q18부터, NAND는 2Q18부터 본격적인 가격 하락세에 진입\n- 이후 두 제품의 가격은 약 60% 하락한 뒤 반등\n- HBM 역시 범용 DRAM 가격 하락의 영향을 반영해, 2028년 계약가격은 전년 대비 약 50%, Blended ASP는 약 40% 하락\n\nDRAM OPm 70%, NAND OPm 50% 시나리오:\n\n- DRAM이 3Q27부터, NAND가 2Q27부터 다운사이클에 진입\n- 삼성전자와 SK하이닉스의 DRAM 및 NAND 영업이익률은 4Q28 기준 각각 70%, 50% 수준으로 낮아질 전망\n- LTA 조건은 고객사별로 상이하지만, Floor Price에서도 과거 최고 수준을 웃도는 이익률을 확보할 수 있다는 Micron의 코멘트를 고려하면, 이 시나리오의 가격 수준은 LTA의 Floor Price에 근접할 것으로 추정\n\n극단적 시나리오가 이미 반영된 주가:\n\n- 삼성전자와 SK하이닉스의 영업이익은 2027년 각각 562.8조원(+45% YoY), 422.7조원(+48% YoY), 2028년 각각 316.2조원(-44% YoY), 230.1조원(-46% YoY)으로 추정\n- 2028년 BPS는 각각 19.1만원, 126.5만원으로 현 주가와 유사한 수준\n- PBR 1배로 가정하면, 극단적 우려가 이미 주가에 상당 부분 반영된 것으로 판단\n\n감지되는 수요 조정, 북미 CSP가 흡수:\n\n- 현재 메모리 수요의 취약한 고리는 스마트폰·PC 등 컨슈머 시장과 중국 시장\n- 스마트폰·PC 고객사들은 수익성 악화와 최종 수요 부진으로 메모리 구매력이 약화되고 있으며, 중국 하이퍼스케일러들도 비용 부담과 공급망 병목에 따른 서버 구축 지연으로 일부 수요 조정이 감지\n- 북미 CSP는 여전히 수요 대비 공급 충족률이 낮아 이들 시장에서 조정된 물량을 모두 흡수하고 있다\n\nAI 투자가 2028년부터 속도 조절에 들어서더라도, 관련 우려가 상당 부분 반영된 현 주가에서는 하방보다 상방 압력이 커질 것으로 판단한다. Anthropic의 IPO가 확정되면 장기 사이클에 대한 시장의 우려도 상당 부분 완화될 것으로 예상한다. 2028년부터 AI Labs의 메모리 직접 구매가 본격적으로 확대되면서, 쇼티지 장기화와 이에 따른 업황 강세가 이어질 전망이다. 극단적 우려를 반영한 현 주가를 비중 확대의 기회로 활용할 것을 권고한다.\n\n---\n\n### 17. 코어위브: 우려 완화, J-Curve 기대\n\nAI 인프라 투자에 대한 우려가 완화되기 시작했다. 시장 고민과 주가 하락의 원인은 고금리 등에 따른 CDS 스프레드 급등이 높은 레버리지 비즈니스인 네오클라우드에 대한 자금조달 우려와, 이에 따른 수주잔고 실행 실패 등에 따른 생태계 내 연쇄효과였다. 코어위브의 이번 실적 발표를 통해 가중평균조달금리 하락, 임대가격 인상, 수주잔고 및 매출 상승세 강화가 확인되기 시작했다.\n\n- 가격: GPU 장기계약 기준 $20–$25/W (+10% QoQ), 단기계약 $40/W 초과 (가격 상승 중)\n- 자금: 추정 가중평균 조달금리 7.9% (−1.1pct QoQ), 이자비용/EBITDA 37% (−9pct QoQ), 선급금 $9B 확보\n- 코어위브는 2028년 용량에 대한 판매를 서두르지 않는다고 밝혀, 임대가격에 대한 낙관적인 전망에 근거한 전략이라고 판단\n\n데이터센터 지연에 대한 시장 우려에도 현재 진행 중인 공사 모두가 인허가 완료, 그 이후의 우려에 대해서는 적극적인 협상에 대한 입장이 재확인되었다. 장기적인 모든 우려가 해소되는 것은 아니지만, 극단적 우려의 되돌림, AI에 대한 우려가 수요 견인이 아니라는 것이다. 이는 AI 인프라의 가치 상승, 이에 따른 투자 명분 강화의 방향이 매우 견고하다는 것을 의미한다.\n\n---\n\n### 18. 화장품과 의류: 내수는 외국인이, 성장은 수출이 가른다\n\n- 2027년 내국인 소비는 쉬어가는 구간으로 본다. 소비자심리지수는 10월 105.4로 장기평균(100)을 웃돈다. 그러나 소매판매는 8월 −0.3%, 9월 −0.4%로 두 달째 전년보다 적다.\n- 기준금리는 7·8월 연속 인상 뒤 3.00%에서 멈췄고, 코스피는 6월 고점 대비 39% 내려왔다. 상반기에 의류 소비를 끌어올린 부의 효과도 절반쯤 빠졌다. 9월 온라인 매출은 화장품이 7.2% 늘었는데 의류는 5.1% 줄었다.\n- 내수라도 화장품은 버티고 의류는 밀리는 그림이다.\n\n빈자리는 외국인이 채운다, 다만 쓰는 곳이 바뀐다. 1~9월 방한객은 1,711만명(+21.5%), 외국인 카드 소비는 15.9조원(+47.7%)이다. 1인당 지출도 93.2만원으로 21.5% 늘었다. 흥미로운 건 행선지다. 면세점 외국인 객단가는 8월 22.4% 줄었는데, 올리브영 오프라인 매출의 외국인 비중은 33%까지 올라왔고 외국인 의료 소비 건수 중 약국 비중은 69.0%가 됐다. 외국인은 면세점 대신 올리브영과 약국에서 더마·기능성 화장품을 산다. 화장품 내수는 외국인 덕에 커지고, 의류는 무신사 같은 관광상권 매장 중심으로 방어하는 정도다.\n\n변수는 2026년 말 끝나는 중국 단체관광 무비자와 원화 강세(외국인 체감 가격 +7.1%)다. 성장은 수출이 가른다. 2027년 매출 컨센서스는 화장품 기업군이 +13.5~15.6%, 의류 기업군이 +3.1~3.8%다. 차이는 수출에서 나온다. 화장품 수출은 1~10월 103.0억달러(+32.4%)로 이미 지난해 연간을 넘어섰고, 2026년 연간 124.8억달러, 2027년에는 140억달러대까지 볼 수 있다. 유럽 점유율은 6.2%로 2년새 3배가 됐지만 아직 미국(9.0%)의 0.68배라 더 갈 길이 있다. 의류 OEM은 물량으로만 크는 해이고, 브랜드사의 해외 출점은 확인되면 더해지는 옵션이다.\n\n비용단에서는 환 영향과 물류비가 관건이다. 원/달러는 2026년 평균 1,425원에서 2027년 1,330원(당사 전망)으로 6.7% 낮아진다. 원화 환산 매출 영향은 의류 OEM(영원무역, 한세실업)이 가장 크고, 화장품사 중에서는 에이피알, 달바글로벌, 아모레퍼시픽 순으로 영향이 크겠다. 화장품 ODM사는 상대적으로 환 영향이 낮은 편이다. 현시점 기준 해상 운임도 전년대비 70%(미국향) 이상 상승해 있는 상황이다. 수익성을 유지할 수 있느냐가 주가 방향성을 결정할 전망이다.\n\n---\n\n### 19. 2027 연간전망: 반등 가능한!\n\n과거와 보법이 달라진 엔터. 지금까지 엔터 투자포인트는 사실 단순했다. 팬덤이 확대되면서 앨범 판매량이 증가하고, 높아진 앨범 판매가 글로벌 인기를 증명하며 공연장 규모를 확대하고, 공연 성장에 따라 MD 매출이 동반 상승하며 실적이 가파르게 성장해왔고, 고연차 아티스트의 성공 방식을 신인 아티스트에 적용해 꾸준히 세대교체가 이루어지는 선순환 구조를 형성하며 실적과 모멘텀 모두 갖추며 높은 밸류에이션을 정당화할 수 있었다.\n\n그런데 지금은, 이 연결고리들이 예전만큼 강하지 않다. 이제는 신인이 데뷔한다고 해서, 음반을 많이 판다고 해서 주가가 반응하지 않는다. K-POP의 고성장 속에서 기대치가 높아진 만큼 오히려 고연차 아티스트의 대규모 컴백에 따른 호실적이 단기 모멘텀이 되면서도 공백 우려 요인이 된다.\n\n과거의 주가와 멀티플 수준을 회복하려면, 이제는 대형 아티스트의 부재에도 실적이 견고하게 성장할 만큼 저연차 아티스트의 수익화 속도가 중요하다.\n\n---\n\n### 20. 로봇/방산/조선 주요 뉴스\n\n- 삼현, 액추에이터 국책과제 주관기관 선정\n- 삼현, MSCI 스몰캡 지수 편입\n- 원익홀딩스, 국민성장펀드 투자계약 확정\n- 티로보틱스, 3분기 영업이익 전년比 293%↑\n\n---\n\n### 21. 은행/증권 국고채 PD 담합 과징금 관련 Comment\n\n- 공정거래위원회는 국고채 PD 담합 과징금 관련하여 15개 금융사에게 총 1조 6,265억원의 과징금을 부과하였다. 당초 심사 과정에서 언급되었던 수준보다는 줄어든 규모이다.\n- 국고채 PD 담합 과징금은 국고채 입찰에 참여한 국고채 전문딜러(PD)들이 2020년 1월부터 2023년 6월까지 입찰 참여 과정에서 입찰 담합 행위, 정보 교환 담합 행위를 한 것에 대한 과징금이다. 전체 담합 규모는 76조 2,000억원으로 알려졌으며, 담합 여부와 과징금 산정 방식을 둘러싸고 이견이 존재함에 따라 장기화되었고, 전일 결정되었다.\n- 대상은 10개 증권사(교보, 대신, 메리츠, 미래에셋, 삼성, 신한, 한국투자, 키움, NH, KB)와 5개 은행(국민, 눙협, 기업, 하나, 산업은행)이며, 과징금 규모는 KB증권이 3,322억원으로 가장 컸고, NH투자증권 2,428억원, 미래에셋증권 2,148억원 등의 순이다.\n\n---\n\n### 22. 카카오, 해외 투자자에 인적분할 설명\n\n카카오는 11월 11~12일 홍콩과 싱가포르에서 해외 투자자 10여곳을 대상으로 인적분할 계획과 분할 이후 성장 전략을 설명하는 IR을 진행한다고 밝혔다. 인적분할 발표 이후 일부 소액주주가 반발한 가운데, 카카오는 9월과 10월 두 차례 소액주주 간담회를 열었으며 '이프 카카오' 공동 애널리스트 간담회에서 분할 이후 중장기 성장 계획을 설명했다.\n\n---\n\n### 23. 데이터센터, 반도체가 이끄는 국내 건설 시장\n\n한국건설기술연구원에 따르면, 2027년 국내 주택건축 시장은 주택 착공의 유의미한 반등을 기대하기 어렵다고 보았다. 다만, 데이터센터 확대가 주택건축의 성장을 이룰 것으로 전망된다. 미국 중간선거 결과에 따라 일정 기간 미국에서 데이터센터 착공은 어려워질 것으로 전망된다. 한국 데이터센터 시장은 이에 대한 반사수혜가 전망된다. 한국은 빠른 인허가, 저렴한 전기요금과 건설비용 등을 고려할 때 현재 하이퍼스케일러들의 니즈에 부합하기 때문이다. 또한, 국내에선 메모리 반도체 업체들의 영업현금흐름이 좋아지고 있기 때문에 반도체 투자 사이클에 따른 수혜도 전망된다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### ① AI주 반등의 세 방향: 코어위브의 실적이 뿌렸던 불꽃, 앤트로픽의 IPO 수요예측, 반도체 수출의 역대 최대치\n\n코스피는 2거래일 연속 +7.1%(+113.2P), 코스닥은 +10.4%(+73.6P)로 급등했다. 이른바 \"악재 반응력보다 호재 반응력\"이라는 표현이 붙을 정도였다.\n\n#### 코어위브의 실적이 열쇠\n\n핵심 드라이빙 퍼포먼스는 코어위브(+24.7%)였다. 미국 증시가 10월 CPI 컨센서스를 상회한 당일, 코어위브는 해당 실적 발표를 앞두고 있었고, 결과적으로 그 실적이 미국 주요 AI주들의 급등을 이끌었다(Micron +11.9%, SanDisk +13.7%, Nubank +15.4%).\n\n실적 발표 내용 자체가 중요한데, 여기서 관찰해야 할 건 **과잉경계감을 해소했다**는 점이다:\n\n- 매출액과 수주잔고가 급증하며 AI 수요의 견조성을 입증  \n- 컨콜에서 \"향후 3개월간 약 90억달러의 선급금 유입\", \"평균 조달금리 약 275bp 하락\", \"무담보 회사채 발행 미계획\" 등의 언급으로 자금조달 능력을 신뢰 회복  \n- 이는 신용리스크와 수익성 사이의 균형이 다시 찾아오는 과정 — 아직 완전히 소멸되지 않았지만, 수요와 공급 양쪽에서 시장 우려가 동시에 완화되기 시작했다  \n\n#### 앤트로픽 IPO 수요예측: 기관이 공모주식수가 아닌 '수배'만큼 주문한 이유\n\n앤트로픽(Antropic)은 IPO 전날인 11월 9일 가격 정보를 철회했다가 10일 S-1을 업데이트했다. 공모희망주가는 70~78달러, 공모주식수는 Class A 8.25억주, 초과배정전량 행사를 전제로 순조달 937억달러(74달러 가정)를 추정했다.\n\n공모 전 시총은 1.19~1.32조달러(EV: 1.06~1.19조달러), ARR(Annual Recurring Revenue, 연환산매출) 기준 P/S는 17.9~19.9배였다. 참고로 오프셋으로 사용된 오픈AI는 같은 시기에 pre-money 1.25조달러로 조달 규모를 110억달러에서 줄였다(P.S. 25.4배).\n\n이 두 기업의 밸류에이션은 사모 라운드 vs. 공모가의 성격 차이는 인정하더라도, **단순 비교로는 앤트로픽이 비싼 편이 아니다**는 게 당시 시장의 판단이었다.\n\n#### 반도체 수출이 역대 최대치를 경신하다\n\n코어위브의 실적과 앤트로픽 IPO 수요예측의 동시발생에 이어, 11월 1~10일 국내 반도체 수출이 166.3억달러로 전년 대비 +331.2% 급증했다 — 역대 최대치였다(Samsung Electronics, SK Hynix가 이끌었고, Data Center Memory Demand가 50% 이상 성장).\n\n이 수출 호조는 반도체주 강세의 또 다른 드라이버였다(IBK증권은 \"글로벌 금리 상승과 달러 강세 부담에도 오후 저가매수세가 유입되며 반등\"이라고 묘사). 코스피와 코스닥 반도체주의 강세가 서로를 재확인하는 피드백 루프로 작동한 것이다(Kospi: Samsung +?, Kosdaq: 반도체주 강세).\n\n---\n\n### ② 외국인 순매수 전환: 왜 11월 이후 누적 순매도(-9.8T)을 돌파하지 못했느냐\n\n11월 5일~9일 3거래일간 코스피는 -11.7%, 코스닥은 -10.6% 하락했다. 그런데 외국인은 11월 11일(수)과 12일(목)에 걸쳐 코스피에서 2거래일 연속 순매수했다(+1.1T).\n\n#### 외국인의 행동패턴 변화\n\n10월까지 외국인은 국내 주식을 214.0T 순매도했는데, 그 중 97.5T(45.6%)가 영국 계정에 집중됐다(대신증권). 이때 영국 거주자가 IMF에 보고한 한국 주식 보유량은 금융감독원이 파악하는 영국 계정 보유의 0.53배에 불과했다.\n\n즉, 영국 계정에 집중된 외국인 매도의 실체는 **프라임브로커를 경유한 헤지펀드의 레버리지 축소**였다. 이제 코스피가 2거래일 연속 +2.6%/+5.6%로 급등하면서, 외국인은 이걸 반도체와 IT하드웨어 주도로 보았고, 결국 2거래일간 코스피에서 순매수에 나섰다.\n\n#### 외국인의 현재 위치: 누적 순매도를 돌파하지 못하는 이유\n\n현재 외국인이 11월 이후 코스피에서 2거래일 연속 순매수한 금액은 +1.1T인데, 11월 이후 누적 순매도 금액은 -9.8T로 여전히 크게 남았다.\n\n즉, **아직 외국인은 이 급등을 \"반등\"이라 보기 어렵고, 이 급등이 \"누적 순매도\"를 다 회복시키기엔 너무 짧다**는 판단이 깔려있다.\n\n---\n\n### ③ 외국인 순매수의 의미: 왜 매크로 악재(미 CPI 상회·월러의 50bp 발언·달러강세·국債 경매 부진)에도 가능한가?\n\n10월 CPI가 컨센서스를 상회했고, 월러(Waller) 연준 이사는 \"인플레가 지속되면 12월 FOMC에서 50bp도 고려\"라고 말했다. 10년물 국채금리는 11월 11일 5.133%(前 4.9889)로 상승했다. 달러는 강세를 보였고, 국채 경매에서 bid-to-cover 비율이 전월 대비 하락했다(CNBC, WSJ).\n\n이런 매크로 악재가 동시에 발생한 상태에서 외국인이 코스피에서 2거래일 연속 순매수한 이유는 다음과 같다:\n\n- 미국 10년물 국채금리가 5%를 넘긴 것은 사실이지만, 코스피의 연간 실적 전망치는 상향(+989T→+998T), 2027년 실적 전망치는 +6.8% 상향(+1.347T→+1.439T) 되었다(Kiwoom Securities).\n- 이 상향의 거의 모든 부분이 반도체 업종에서 온 것이다(Kiwoom: 2027년 코스피 110T 상향 중 118T가 반도체 홀로 담당; 25개 업종 중 19개 업종의 실적 전망이 하향)\n- 즉, 10년물 국채금리 5%가 매크로 악재라면, 코스피의 2027년 영업이익 성장률 전망치 44.2%는 그 악재를 상쇄하는 긍정적 재료다\n\n---\n\n### ④ Kiwoom Securities의 핵심 질문: 왜 11월 이후 누적 순매도(-9.8T)를 회복하지 못한 채, 2거래일간의 순매수(+1.1T)가 반등을 이루는가? — \"과도한 과매도\"\n\nKiwoom Securities는 11월 12일 \"과도한 과매도 상태\"라는 것을 먼저 지적한다. 이어서 두 번째 질문으로, 왜 이 2거래일간의 반등이 \"과도한 과매도\"의 초기 반작용인지, 혹은 앞으로의 반등 지속 여부를 판단할 수 있는지를 따져본다.\n\n#### 2거래일간의 반등이 지닌 특징\n\n- 코스피가 2거래일간 +2.6%로 급등했지만, 11월 5~9일 3거래일간의 하락(-11.7%)을 따라잡지는 못했다.\n- 외국인이 2거래일간 +1.1T를 순매수했지만, 11월 이후 누적 순매도 금액은 -9.8T로 여전히 멀리 떨어져 있다.\n- Kiwoom은 이 2거래일간의 반등이 \"단기 급등\"과 \"추후 속도조절\"이 가능하다는 전제를 붙인다(\"손실 축소를 위해 개인이 포지션 정리\") — 즉, 반등의 연속성은 현재로서는 확신하기 어렵다\n\n#### 그러나 왜 이 2거래일간의 반등이 있었다는 것 자체가 중요합니까?\n\nKiwoom의 답변은 이다: \n\n> 외국인이 미국 10년물 국채금리 5% 상승과 추가 긴축 우려, 달러 강세 등 매크로 악재가 존재하는 상황에서도 코스피에서 2거래일 연속 순매수에 나선 것은, **현재 국내 증시가 매크로 악재에 민감한 반응을 보이는 것이 아니라, 코어위브 호실적·앤트로픽 IPO 수요예측·반도체 수출 호조 등 특정 호재성 재료에 반응하기 시작했다는 것을 시사**한다.\n\n---\n\n### ⑤ iM Securities의 중간선거 승리: 서민경제(Long) vs. AI(short) — 경기 둔화의 공화당 패인과 AI 서민경제 Shorting의 원인\n\niM Securities는 미국 중간선거에서 민주당이 상·하원과 주지사 선거에서 대승했다. 공화당의 패인은 \"전쟁 장기화에 따른 내수 부진\".\n\n중간선거 이후 시장을 극명하게 갈랐다:\n\n| 항목 | 방향 |\n|------|------|\n| AI | 급락 — 헤지펀드 포지션 청산으로 낙폭 확대 |\n| 국제유가 | 급락 — 민주당의 종전 압박, 미국·이란 양측의 긍정적 입장 |\n\n#### 왜 AI는 급락했고, 서민경제(Long)는 상승했습니까?\n\niM Securities의 분석은 이다: \"민주당의 중간선거 승리가 만든 두 가지 쟁점\":\n\n- **첫째**, 서민경제 Long: 민주당의 종전 압박과 미국·이란 양측의 긍정적 입장에 기인한 국제유가 급락 — 내수시장에 우호적\n- **둘째**, AI Short: 데이터센터 착공 지연 우려가 불거졌고, 헤지펀드가 포지션을 청산 — 낙폭 확대\n\n#### 10월부터 확인된 경기·수요인플레이션 반등의 의미\n\niM Securities는 \"이미 10월부터 경기 및 수요인플레이션 반등이 확인되고 있는 가운데, 종전 협상에 진전이 있을 때마다 경기 개선의 폭은 높아질 것으로 기대\"라고 한다. 따라서 향후에는 AI 투자의 우려가 서민경제의 부흥으로 이어질 가능성이 높다고 기대한다.\n\n---\n\n### ⑥ Daishin Securities의 글로벌 EPS 전망: 한국, 브라질이 1% 이상 상향 — 글로벌 EPS 순위에서의 한국 진입\n\nDaishin Securities의 EPS Live #236에서 전 세계 국가별 EPS 전망이 상향 또는 하향 됐다(GLOBAL TOP PICKS):\n\n| 국가 | 상향 / 하향 | 상향/하향 금액 |\n|------|-------------|------------------|\n| 한국 | ↑↑↑ | +1% 이상 |\n| 브라질 | ↑↑↑ | +1% 이상 |\n| 미국 | ±±± | 1% 이내 |\n| 일본 | ↑↑↑↓↓↓ | IT & 소재 섹터 강세 |\n| 유럽 | ↓↓↓ | 에너지 섹터 양호 |\n| 중국 | ↓↓↓ | 가장 부진 |\n| 사우디 | ↓↓↓ | 가장 부진 |\n\n#### 한국의 상향 구조\n\nIT 섹터가, 브라질은 소재·산업재·통신이 견인했다. 미국은 부동산을 제외하고 모두 1% 이내로 변동이 크지 않았다(Japan은 IT & 소재 강세, Europe은 Energy Sector Only Good).\n\n---\n\n### ⑦ Shinhan Securities의 Global Top Picks in 2027: Part I (Gloabl IT Hardware) — 7개\n\nShinhan Securities는 2027년 Global Top Picks를 아래 8개 Part로 구성했다:\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nAI 투자 관련 우려와 실제 반도체 수출 증가 사이의 갈등이 지속되고 있으며, 이는 미국과 중국으로의 수출 증가, 코어위브 실적 호조, 엔트로픽 IPO 흥행 등으로 인해 반도체 수요가 지속되고 있다는 신호를 보이고 있다. 동시에 금리 인상 기대와 달러 강세로 인해 국제 금 가격이 하락하고 있으며, 미국 10년물 금리가 5%를 돌파하며 글로벌 금융 시장에 영향을 미치고 있다. 이와 병행해 중국 자동차 시장은 내수 부진과 수출 증가의 이중 구조를 보이며, 중희토 규제로 인한 휴머노이드 산업의 고감속 전환도 주요 쟁점으로 부상하고 있다."}]}</script>
