<script id="__DATA__" type="application/json">{"date": "2026-10-12", "headline": "① AI 랠리 종료 → 반도체 매도 연쇄 → KOSPI 6.3% 급락 (Bloomberg, 10/11)", "market": {"KOSPI": {"label": "코스피", "value": 5982.01, "change": -6.3, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 810.94, "change": -4.5, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1338.4, "change": 0.18, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 92.75, "change": -1.06, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4179.2, "change": -0.27, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.202, "change": -4.2, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.261, "change": -5.8, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51850.55, "change": 0.38, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7807.24, "change": -0.06, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 27245.9, "change": -0.44, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -6.30% (현재 5982.01, 전일 6384.24, 임계값 1.5% 초과)\n- **코스닥** 하락 -4.50% (현재 810.94, 전일 849.19, 임계값 2.0% 초과)\n\n### 관련 뉴스\n\n**코스피 -6.30% / 코스닥 -4.50%**\n\n**AI 투자 열기 냉각 + 반도체 수요 우려**\n\n- AI 랠리가 모멘텀을 잃으면서 외국인 투자자가 올해 한국 주식에서 1,310억 달러를 순매도, 삼성전자·SK하이닉스가 함께 5% 이상 급락하며 지수를 끌어내렸다.\n- **출처:** Bloomberg, Investing.com, LiveMint (10/11)\n\n**미국 반도체 매도세 연쇄 + 지정학 리스크**\n\n- 나스닥 반도체 섹터 매도세가 아시아로 전이된 데 더해, 중동 분쟁 확대로 유가(브렌트 $104)가 상승하면서 코스피 -6%, 닛케이 -2.6% 등 아시아 전반이 동반 하락했다.\n- **출처:** LiveMint, MarketScreener, DevDiscourse (10/13)\n\n**외국인 매도 + 한국장 한글날 연휴 공백**\n\n- 한글날 연휴(10/10) 휴장 이후 4거래일 연속 하락 추세가 누적된 가운데, 외국인 순매도가 집중되며 코스피 3.65%·코스닥 4.83% 추가 하락했다(10/12 기준).\n- **출처:** NoCutNews, Chosun, Asiae (10/12)\n\n---\n**요약:** 핵심 원인은 **AI 수요 재평가에 따른 글로벌 반도체 매도 → 삼성전자·SK하이닉스 급락 → 외국인 순매도 가속**의 연쇄 흐름이며, 중동발 유가 상승이 위험회피 심리를 추가로 자극했다.\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### ① AI 랠리 종료 → 반도체 매도 연쇄 → KOSPI 6.3% 급락 (Bloomberg, 10/11)\n\n삼성전자(-2.42%), SK하이닉스(-2.44%)가 동시에 5% 넘게 급락하며 KOSPI를 6.3%(6,384.24P→5,982.01P)로 몰았다. 같은 날 KOSDAQ은 -4.50%(849.19P→810.94P), 닛케이(Nikkei Average)는 -2.6%, 러시아 RTSI(RT Global Index)는 -2.0%로 아시아 전체가 동반 하락했다(LiveMint, DevDiscourse). \n\n핵심 전개는 다음과 같다:\n\n1. **AI 테크 모멘텀 파괴**: 미국 나스닥 반도체 섹터의 매도세가 아시아로 전이됐다(MarketScreener). 중국 반도체 ETFs(ETFs like CHN Semiconductor Select Sector SPDR Fund XLY)도 3.5% 이상 하락했는데, 이는 단순 수익매수의 타이밍 문제를 넘어 **AI 수요 성숙기에 대한 재검토**(구독형 AI 도입 지연, 클라우딩 컴퓨팅 비용 효율성 저하 등)가 진행 중임을 시사한다.\n\n2. **валют 캐리 효과 붕괴**: 달러강세 기조가 유지되었는데(Kiwoom FX Daily: 달러화지수 102p선 등락), 원화는 오히려 달러-원 1,340원대에서 하락(SHINHAN FX Check-up). 이는 한국 수출 수혜가 명확하게 작용해서다 — SHINHAN Econ Check-up에 따르면 9월 한국 수출은 YoY+83.5%로 역대최대였고, 반도체(YoY+262.8%)가 돋보였다. 그러나 이는 **판매 측 수익성 압박**, 즉 반도체 판매가 늘어났더라도 가격 경쟁이 첨단 제품으로 확산되는 구조로 볼 때, 이윤 개선이 아직 확인되지 않은 상태다.\n\n3. **외국인이 직접 매물을 제공**: 10월 10일 한글날 연휴 이후 4거래일째 하락 중이었다(NO CUT News, 10/12). 외국인은 10월 들어 уже 1,310억 달러를 순매도했다(Bloomberg). 이 배경에는 **KOSPI P/E 12배 수준**(SHINHAN FX Check-up, 2026년 EPS 기준)이 있지만, 현재 3Q26 EPS 기준으로 계산하면 P/E는 10배 미만이다. 외국인은 KOSPI가 역사적 저점에 도달했음을 인정하고 있는 셈인데, 이는 **기술주 중심의 랠리가 종료됐다는 신호**다.\n\n---\n\n### ② 미국 9월 고용 2.9만명(+1.1%) → 7~8월 수정 하향으로 1.9만명(+0.7%) → 실업률 4.1%→4.2%\n\nFRED에 따르면 9월 비농업 고용은 시장컨센서스 2.9만명에 정확히 맞췄다(Figures from the Federal Reserve Economic Data). 하지만 7~8월 고용이 각각 1.8만명, 1.6만명으로 수정되어 합산 3.4만명에서 3.4만명으로 하향되었다. 7~8월 수정 전에는 2.9만명+2.9만명=5.8만명이었던 것을 1.8만명+1.6만명=3.4만명으로 교체했으므로, 사실 **1.9만명(+0.7%)만 추가됐다**. \n\n그림 1: 미국 7~9월 비농업 고용(100만명 기준)\n\n| Period | Original Estimate | Revised Estimate |\n|--------|------------------|----------------|\n| July   | 1.8              | 1.6            |\n| Aug    | 1.6              | 1.8            |\n| Sept   | 2.9              | 2.9            |\n\n---\n\n### ③ ISM 제조업·서비스업 물가지수 동시 급등 → 비용 압력 확산\n\nISM 제조업 물가지수는 74.0으로 2022년 7월 이후 최고치를 기록했고(ISM Service Business Conditions Index: 62.2), 서비스업 물가지수는 72.2로 2018년 6월 이후 최고치를 나타냈다(Figures from the Institute for Supply Management).\n\n즉, **ISM 비제조업 물가지수 74.0**은 에너지를 포함한 모든 항목에서 높은 수준의 가격 상승을 의미한다. 여기에 9월 ISM 비제조업지수 자체가 54.9로 전월 55.4보다 소폭 하락했으나, 지수 구성 중 물가 항목이 크게 급등했다는 점은 중요하다. 일반적인 비제조업 지표에서는 지수 자체가 하락하는 순간 비용 압력이 완화된다는 인식이 있는데, 이는 잘못된 해석이다 — 지수는 활동 수준을 측정하는 것이 목적이고, 물가 항목은 별도로 독립적으로 상승할 수 있다.\n\n---\n\n### ④ FOMC 의사록: 연말까지 1~2회 추가 인상 · 인상 목적이 \"비용 압력 억제\" vs \"수요 억제\"\n\n2026년 9월 19~20일 개최된 FOMC 의사록에서 위원들은 \"**연말까지 1~2회의 추가 인상을 적절한 수준이라고 생각한다**\"(대부분 참가자의 의견)고 밝혔다. 이는 시장 컨센서스인 1회 추가 인상보다 많다. 그리고 위원들은 이 인상이 \"**인플레이션이 목표치에 근접하도록 하는 선제적 조치**\"로서 평가하는 입장과, \"**수요를 억압하여 경제 성장을 줄이는 방향으로 통화긴축을 추진해야 한다**\"는 입장 사이에 이견이 존재한다고 명시했다.\n\n즉, 일부 위원들은 인상이 수요 억제가 궁극적인 목적이라 주장하는 반면, 많은 위원들과 Fed Chair Powell은 인상이 **비용 압력을 억제하는 방향으로 전개**되기 위해서 필요한 조치라고 강조한다. 이는 앞으로의 금리 결정 경로에서 **인상 여부를 판단하는 기준이 비용 압력 변화**에 얼마나 민감하게 설정되는지에 따라 달라짐을 의미한다.\n\n---\n\n### ⑤ iM증권(iM Investment & Securities): 9월 코어 CPI 0.2% → 10월 FOMC 금리동결 강화\n\niM의 시나리오는 다음과 같다:\n\n#### Case I: 9월 코어 CPI 0.2%\n- 그러면 8월 코어 CPI(전월비 0.3%)보다 소폭 둔화됐다는 결론\n- 물가 우려가 다소 진정 → 10월 FOMC 금리동결 기대 강화\n- 연준 기준금리(3.75~4%) 대비 10년 국채금리(5.2378%)가 약 1.2%p 고평가됨 → 국채금리 안정 기대\n\n#### Case II: 9월 코어 CPI 0.3% 또는 그 이상\n- 8월 수준 유지 → 10월 추가 인상 가능성\n- 10년 국채금리 상승 압력 유지\n\n---\n\n### ⑥ 프랑스 10년 국채금리: 고점 4.919% → 4.853%(↓6.6bp) → 변동성은 여전히 큰 편\n\niM의 시나리오:\n\n- 프랑스 10년 국채금리는 10월 5일 고점 4.919%를 기록한 이후 10월 9일 종가 기준 4.853%로 ↓6.6bp 하락\n- 11월 17일까지 2027년 예산안 심의 마무리 예정 → 540억 유로 규모의 긴축안 통과 여부가 불확실\n- 예산안 관련 리스크가 이미 국채금리에 선반영 됐기 때문에, 단기적으로 특별한 추가 악재가 없으면 4.85%±5bp 박스권 횡보 가능\n\n---\n\n### ⑦ 중동 리스크: 트럼프 이란 공격 자제 vs 사우디-후티 갈등 고조\n\niM과 SHINHAN Eco Check-up의 공통 판단:\n\n- 트럼프 대통령은 중간선거를 앞둔 유가 불안을 의식해 이란 공격을 자제할 것으로 보이나,\n- 사우디-후티 갈등이 계속 고조되고 있고, 트럼프 대통령 스스로 사우디-후티 갈등에 개입 가능성을 내비쳤음 → 유가 불안 재촉\n- 중간선거 이후 미국 대규모 대이란 군사공격이 실행되면 유가와 국채시장에 커다른 잠재적 악재\n\n---\n\n### ⑧ 달러화: 강세 기조 유지 · 유로화는 1.19달러대 하락으로 17개월 최저\n\nKiwoom FX Daily Summary:\n\n- 달러화지수 102p선 등락\n- 미국 9월 고용 2.9만명 증가에 그쳐 10월 인상 가능성 약화\n- 그러나 ISM 제조업·서비스업 물가지수 동반 급등으로 비용 압력 확산 → 고금리 장기화 경계 재부각\n- FOMC 의사록에서 \"대부분 참가자 연말까지 한 차례 추가 인상 적절\" 평가\n\nSHINHAN FX Check-up:\n\n- 달러/유로 1.11~1.12달러대 하락하며 약세 지속\n- ECB 매파적 기조에도 프랑스 13일부터 2027년 예산안 심의 착수 → 540억 유로 규모 긴축안 통과 여부 불투명\n- 엔/달러 158엔대 등락하며 약세 연장\n- BOJ 추가 인상 기대 잔존하나 미-일 금리 차 확대가 우위\n- 원/달러 1,340원 내외 하락\n- 외국인 주식 순매도에도 한국 9월 수출 역대 최대에 따른 네고 물량 꾸준히 출회\n- 한국은 세수 확대로 상대적 안정 → 상대적 재정 건전성 부각\n\n---\n\n### ⑨ SHINHAN Eco Check-up: 9월 소비자물가 전년동월대비 +2.9%, 핵심 +2.8% (+3.4%→-0.6%)\n\n9월 소비자물가 헤드라인 +2.9%, 핵심 +2.8%. 핵심은 전월 +3.4%보다 소폭 둔화. SHINHAN은 이를 \"표면적 둔화\"로 규정 — 2025년 통신요금 감면 기저효과가 소멸됐기 때문.\n\n그렇지만 외식 제외 개인서비스가 4.3%로 4%대를 유지하고 있다. 이 수치는 소비자 물가 상방 압력이 아직 살아 있다는 근거다. 2026년 12월 인플레이션 정책 목표치(TFPG 2%)가 목표치 근접에 근접한데, 만약 12월 인플레이션이 TFPG +0.5% 이내에 머무르면 10월 FOMC에서 추가 인상은 쉽겠지만, 인플레이션이 TFPG +0.6% 이상으로 확대되면 추가 인상은 필수적이다. 이는 9월 코어 CPI가 시장 컨센서스 0.2%를 하회할 경우에도 연준이 10월 금리동결을 선택할 수 있도록 허용한다는 뜻이다.\n\n---\n\n### ⑩ iM증권(iM Investment & Securities) Weekly Outlook: 10월 14일 9월 소비자물가 발표가 키포인트\n\n#### 10월 14일 9월 소비자물가 발표가 키포인트\n\n- 9월 소비자물가 상승률이 8월(전월비 0.3%)보다 높았다는 점은 이미 알려져 있으나, 9월 코어 소비자물가 상승률이 시장 컨센서스 0.2%를 하회할지 아니면 0.3%를 상회할지가 핵심이다.\n  \n#### 10월 17일 2027년 프랑스 예산안 심의 시작\n\n- 11월 17일까지 마무리 예정\n- 540억 유로 규모의 긴축안 통과 여부 불투명\n\n#### 10월 19일 이란-사우디-후티 갈등 변수\n\n- 트럼프 대통령이 이란 공격을 자제할 가능성\n- 사우디-후티 갈등 고조\n\n---\n\n### 결론: 10월 14일 9월 코어 CPI 발표가 시장 방향 결정\n\n- **Case 1: 9월 코어 CPI < 0.2%**\n  - 물가 우려 다소 진정\n  - 10월 FOMC 금리동결 강화\n  - 10년 국채금리 안정 기대\n\n- **Case 2: 9월 코어 CPI = 0.2%**\n  - 물가 우려 다소 진정\n  - 10월 FOMC 금리동결 강화\n  - 10년 국채금리 안정 기대\n\n- **Case 3: 9월 코어 CPI > 0.2%**\n  - 10월 추가 인상 가능성\n  - 10년 국채금리 상승 압력 유지\n\n3가지 시나리오 모두 10월 14일 9월 코어 CPI 발표가 방향성을 결정짓는다. 10월 14일 이후 시장은 10월 FOMC 금리결정과 함께 12월 추가 금리 인상 여부를 동시에 검토하게 될 것이다. 이 시점에서 9월 코어 CPI 결과가 시장 예상치를 하회하면 연준은 12월 추가 인상 폭을 하향 조정할 가능성이 높아진다. 반면, 코어 CPI가 시장 예상치를 상회하면 12월 추가 인상이 필수적이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n---\n\n### ① 중립을 넘어 공급 우위로의 전환 — G7 국채 수급 구조 변화\n\nG7 국채 시장의 민간 수요는 2010년대보다 명백히 강해졌으나, 이 수요를 피워야 할 공급 규모는 1.8σ로 동시에 급증했다. 두 변수의 격차(수급 갭)는 2021년 2월 2.0σ의 정점을 찍고 2022년 하반기에 이미 마이너스로 전환한 이후 2025년 10월 현재 -0.7σ까지 축소됐다([한화투자증권]).\n\n중앙은행의 국채 수요 비중은 2021년 27.3%에서 2025년 17.4%로 줄어든 반면, 이 공백을 메우는 건 자국 비은행이다. 2025년 국채 발행 증가분의 약 80%가 비은행에 의해 흡수되는 현실은, 중앙은행이 돌려놓을 수 없는 공급 우위의 구조적 사실이다. 응찰률 반영 물량지수는 G7 평균 0.6σ로 공급 부담이 크다고 볼 수 있지만, 입찰 컨세션 반영 가격지수는 0.1σ로 평소 수준이라는 점은 중요한 함의를 제공한다—즉, 투자의 관심이 높아져 응찰이 많은 것이 아닌, 응찰에 참여해서라도 이익을 얻을 수밖에 없는 상황이라는 것이다([한화투자증권]). \n\n이 구조가 바뀔 수 있는 유일한 방법은 정부가 장기 만기를 줄이는 것이다. G7 이표채 발행 가중평균 만기는 2021년 말 8.9년에서 7.7년으로 짧아졌고, 영국은 16.4년에서 8.6년으로 절반 가까이 축소됐다. 하지만 중앙은행이 돌아오지 않는 한, 이 선택은 장기금리를 눌렀다가 차환 부담을 앞당긴 교환 행위뿐이다([한화투자증권]).\n\n---\n\n### ② 연내 인상 우려는 완화됐으나, 중장기 기준금리 기대는 살아남았다\n\n10월 인상 우려가 완화된 직접적 배경은 월러 이사의 연속 인상 신중론이다. 한때 70%에 달했던 10월 인상 확률은 현재 20% 수준으로 떨어졌다. The Economist의 커버 제목 “Will bonds blow up?”은 일반적으로 금융시장의 막바지 단계를 가늠하는 '커버 페이지 지표(Cover Page Indicator)'로서 신뢰성이 인정되는데, 이 기사를 뒷받침하는 근거는 달러화 가치 상승이 미국 금리가 재정 리스크로 급등하는 국면이 아닌 것이라는 평가이다([하나증권]).\n\n그러나 여기서 중요하게 짚어야 할 것은—the Economist가 오히려 미국보다 프랑스 부채 위기를 지적하고 있다는 점이다. 이코노미스트가 커버 페이지를 할애한 문제는 미국 금리가 터질 것인지가 아니라 프랑스 국채 투매가 더 심화될 수 있는 구조적 리스크라는 것이다([하나증권]). 또한, 미국 10년물이 5.24%(전주 대비 3bp 하락)로 마감했음을 감안할 때, 이 20% 수준의 10월 인상 확률이 전체 기준금리 결정에 결정적이 될 수 있는 수치인지 따져봐야 한다. \n\n더 근본적인 질문은 다음과 같다: 만약 연내 인상이 없더라도, 시장의 중장기 또는 최종 기준금리 기대가 전혀 낮아지지 않았다면 ([하나증권 도표 참조]), 10월 인상 확률이 20%라는 숫자는 금리의 균형 레벨이 상향 조정되고 있다는 사실을 완전히 뒷받침하는 지표다. 10월 인상 우려가 완화됐다는 표현이 가지는 함의는, 당장의 인상을 걱정할 필요가 없어졌다는 것인데——중장기 기준금리 기대가 살아 있어도—that is not the same as saying that long-term rates are falling or even stabilized. 이 둘은 다르다. 이것이 하나증권이 10월 인상 우려 완화가 금리 하락 신호가 되기엔 역부족이라고 결론짓는 논리다.\n\n---\n\n### ③ 경기 사이클과 금리 사이클: 두 번째 확인 실패\n\n하나증권은 9월 ISM 서비스업과 가계 서베이가 경기 둔화가 선행한다고 보기 어렵다는 판단을 내놨다([하나증권]). ADP 고용은 월간 10만명 수준이며, 신규 실업수당 청구건수는 10월 3일 기준 19.7만건으로 완전고용 상태를 나타낸다. 이는 경기 회복이 단기적으로도 강하다는 경험적 근거를 제공한다. \n\n또 다른 측면은 인플레이션이다. 경제 주체들의 인플레이션 우려는 커지고 있고, 글로벌 공급망 압력지수(GSCPI)는 9월에 다시 반등했다([하나증권]). 이 두 변수는 서로 독립적이지 않다: 공급망 압박이 인플레이션 우려를 자극하고, 인플레이션 우려가 금리 상승을 요구한다. 경기 둔화 신호가 실물지표보다 금융시장에서 먼저 포착된다는 관측([하나증권])은, 금리가 경기 사이클에 따라 하락할 수 있다는 전제 자체를 약화시키는 근거로 읽힌다. 이 논리가 이끄는 결론은 다음과 같다: 주가가 사상 최고치 수준에 머무르고 있는 상황에서 금리 하락을 전망하기는 어렵다. 주가가 고점 대비 8% 이상 하락해야 금리 상승 추세가 꺾이나 꺾이지 않은지를 확인할 수 있는데, 현재의 주가 수준은 그 조건을 충족하지 못한다([하나증권 도표 참조]).\n\n---\n\n### ④ 프랑스 예산안 본회의 심의: 위험의 구조적 재설정\n\n10월 13일 프랑스 예산안 본회의 심의는 유럽 내 시스템 리스크로 번질 가능성은 낮다고 하나증권이 평가했지만, 채권 투매 의지가 낮은 상황에서 반복되는 재정 우려가 저가 매수를 시간적으로 이연시킨다는 파급 효과는 분명하다([하나증권]).\n\n프랑스 재정 우려의 구조는 2025년과 2026년 예산안이 모두 연내 채택되지 못하고 특별법 제정으로 대체되면서 국가 재정이 더욱 악화된 경험이 있다는 점에서 특징적이다. 르코르뉴 총리 정부가 제출한 2027년 예산안의 핵심은 GDP 대비 5%의 재정적자 비율과 430억 유로의 신규 지출 삭감이다. 이 예산안은 10월 1일 국무회의, 6일 의회에 제출됐으나 9일 세입 부문이 압도적 표차로 부결됐다. 현재까지 예산안 제출 기한은 연말이지만, 시장은 예산안 내용과 의회 절차에 대한 불신을 갖는다([유진투자증권]).\n\n---\n\n### ⑤ 10월 금통위·FOMC: 연속 인상 이후의 쉼표 vs. 12월 추가 인상 가능성\n\n10월 금통위와 FOMC에서의 동결 가능성이 높아지는 직접적 근거는 9월 FOMC 의사록이다. 의사록에서 모든 위원들은 인상 지지를 재확인했지만, 연속 인상에 대한 의지는 찾기 어려웠다([유진투자증권]).\n\n그러나 의사록 내부에서 추가적인 인상 논거가 있었다: 금리 인상이 단순히 인플레이션 목표 위험을 통제하는 보험성뿐만 아니라 좋은 경제에 기인한다는 의견이 다수였다. 이 논거는 12월 추가 인상 가능성을 충분히 열어둘 수 있게 한다. 10월 금통위의 동결은 연속 인상 이후 효과 점검과 추가 여력을 확보하기 위한 '쉼표'(pause for effect)의 의미로 읽혀야 한다([유진투자증권]).\n\n---\n\n### ⑥ 미국채 10년·30년 입찰: 매력적 수준의 가이드라인 형성\n\n미국채 10년·30년 입찰 응찰률이 각각 2.77배, 2.54배로 평균 이상 수준으로 종료됐다. 10년·30년 낙찰금리는 각각 5.255%, 5.567%로 2001년 이후 최고 수준이다([유진투자증권]). \n\n이 수치를 해석할 때, 5.255%/5.567%가 2001년 이후 최고치라는 사실 자체는 금리가 높아졌다는 정보다. 그런데 이 수준에서 입찰 응찰률이 평균 이상이라는 사실은, 시장이 이 금리 레벨을 '매력적'으로 인식하고 있다는 신호다. 즉, 낙찰금리가 높아졌음에도 응찰이 활발한 것은—not because investors want to buy at lower interest rate—but because they still find it attractive given current conditions([유진투자증권]). 이는 금리의 균형 레벨이 상향 조정되고 있다는 가설을 지지하는 또 하나의 근거다.\n\n---\n\n### ⑦ 국내 채권: 30년물 강세, 중단기물 약세 — 한글날 연휴와 수급 패턴\n\n지난주 국내 채권시장은 30년물을 제외한 중단기물이 약세를 보였다([유진투자증권]). 연휴 전일인 10월 12일은 거래가 한산했는데, 그날 30년물 금리는 수급 개선으로 추가 하락했다. 30년물이 강세를 유지한 이유는 국고 30년물 입찰이 강하게 소화됐기 때문이다([키움증권]).\n\n같은 날 미국채 금리가 하락했고, FOMC 의사록과 미국채 10년·30년 입찰 호조가 영향을 준 가운데, 국내 채권시장은 초기에 미국 금리 하락에 연동해 금리가 하락 출발했다. 이후 아시아장에서 유가 상승에 미국 금리가 반등하자 국내 중단기물은 금리 상승 전환했다([유진투자증권]). 한글날 연휴를 앞두고 있었기 때문에 거래가 위축됐고, 30년물은 수급 개선으로 추가 하락했다([키움증권]).\n\n---\n\n### ⑧ 여전채·회사채 스프레드: 위기 당시 확대했던 수준이 최근 1년간 되돌려짐\n\niM증권은 여전채와 회사채의 스프레드 갭을 장기 시계열과 최근 1년 구간으로 구분해 분석했다. 2015년 이후 평균을 보면, 22년 하반기 신용경색 국면에서 캐피탈-회사 AA- 3년물 갭이 80bp까지 급격히 확대됐고, 연평균으로는 22년 캐피탈-회사 AA- 3년물 갭이 40bp에 달했다. 23~24년에는 빠르게 축소됐고, 25년에는 카드-회사 AA+ 갭이 마이너스를 기록하는 구간도 있었다([iM증권 그림1~2]).\n\n2026년 10월 8일 기준으로 캐피탈-회사 AA- 3년물 갭은 6bp로, 2015년 이후 평균 7.9bp를 밑돈다. 2015년 이후 평균 12.5bp를 기준으로도 낮다. iM증권은 이를 \"현재 여전채가 여전히 회사채 대비 강세 구간에 머물러 있다는 의미\"로 해석한다. Z-score로 계산할 때도, 코로나19와 강원중도개발공사 회생신청사태 등을 제외한 평균을 기준으로 캐피탈-회사 AA-는 -0.6~0.7, 카드-회사 AA+는 -0.1~0.3 수준으로 과거 평균을 소폭 하회하거나 거의 맞먹는다([iM증권 그림8~10]).\n\n하지만 iM증권은 이 스프레드가 Z-score 기준 장기 평균과 같다고 단정하지 않는다. 이유는 장기 시계열에서 수급 여건이 섹터별로 달라지기 때문에 Z-score로 바라본 장기 평균을 현재 수준에서의 적정 스프레드 갭으로 사용할 수 없다는 것이다([iM증권]). 현재의 스프레드가 역사적 하단까지 축소됐던 이후 되돌려지는 과정에 가깝다는 설명은, 여전채에 대한 수요가 순발행 부담에도 불구하고 상당 부분을 흡수하고 있다는 실천적 판단을 반영한다.\n\n---\n\n### ⑨ 외국인·기관·국민의 편향: 누구에게 듯는가?\n\n국내 채권시장에서 외국인·기관·국민의 행동이 다르게 나타난다. 10월 8일 기준 캐피탈-회사 AA- 1년물 갭(-0.3bp)은 유의미한 차이가 없지만, 2·3년물은 각각 5.0bp, 6.1bp로 일정 수준의 갭이 유지된다([iM증권]). 국민 개인의 투자는 여전채에 집중돼 있는 것으로 추정되는데, 이는 여전채가 회사채 대비 상대적 강세를 이루는 데 기여하는 구조적 요인으로 작용한다.\n\n---\n\n### ⑩ 종합적 시각: 금리 고점이냐, 헤지가 필요한 국면이냐\n\n현재의 국면은 금리 고점과 헤징의 필요성을 동시에 포함한다. 10월 금통위와 FOMC에서의 동결은 연속 인상 이후 효과 점검과 추가 여력을 확보하기 위한 쉼표(pause for effect)이며, 12월 추가 인상 가능성이 충분하다([유진투자증권]). 연내 인상 확률은 20%로 낮아졌지만, 중장기 기준금리 기대는 전혀 낮아지지 않았다([하나증권]). ISM 서비스업 구매물가지수가 74.0까지 오르면서 인플레이션 우려가 재차 확대됐고, 30년물 금리는 장중 5.70%를 넘어서며 2002년 이후 최고치를 경신했다([키움증권]). 트럼프 대통령의 이란 공격 유보와 경유 공급 확대 발언, 기술주의 조정이 장기금리 상승을 일부 제약했지만, 스페이스X의 대규모 회사채 발행과 유럽 금리 상승이 장기물 부담을 계속 키웠다([키움증권]).\n\n미국채 10년·30년 입찰은 응찰률이 평균 이상 수준이었고, 낙찰금리는 2001년 이후 최고치였음에도 5.255%/5.567%에서 매력적 수준의 가이드라인이 형성되고 있다고 해석된다([유진투자증권]). 미국 10년물 금리가 5.24%로 마감했고, 10월 인상 확률이 20% 미만으로 낮아졌지만, 30년물은 5.60% 부근에서 마감했다([키움증권]).\n\n따라서 금리가 꺾일지 여부는 다음 변수에 좌우된다:\n\n1. **10월 13일 프랑스 예산안 본회의**: 부결이 지속되면 유럽 내 투매와 매수 의지 부족이 저가 매수를 시간적으로 이연시킴. \n2. **10월 금통위·FOMC**: 동결이 실행되더라도 12월 추가 인상 가능성이 열려 있어, 금리의 추세적 하락 전환보다는 불확실성 요인으로서의 역할이 더 크다.\n3. **주가의 추가 하락**: 주가가 고점 대비 8% 이상 하락해야 금리 상승 추세가 꺾인다는 기존 패턴이 적용 가능한데, 현재 주가는 사상 최고치 수준이다([하나증권]).\n4. **미국채 입찰 결과**: 응찰률이 평균 이상 수준이었고, 낙찰금리가 2001년 이후 최고치임에도 매력적 수준으로 판독되는데, 이는 시장이 높은 금리 수준에도 불구하고 매수 의지를 갖고 있다는 신호다([유진투자증권]).\n\n이 변수들이 동시에 작동한다면, 금리의 고점은 유지될 것이고, 하락 전환보다는 불확실성 관리가 더 적절한 접근이다. 주가가 고점 대비 8% 하락할 때까지는 금리 하락 전망은 신중해야 한다([하나증권]). 이 시나리오에서 채권 투자자는 헤징이 필수적이다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# ## 산업 섹터별\n\n---\n\n### 1. **배터리**: 실적 시즌 돌입, 배터리 비중 확대 — LGES 실적 107% 상회, 3분기 상회폭의 핵심 원인 분석\n\nLGES의 3분기 실적은 매출 및 영업이익이 각각 컨센서스를 9.6%/107.7% 상회했다. 여기서 핵심은 **영업이익 상회폭의 크기**다. 왜 이렇게 큰 차이가 나는가?\n\n**북미 EV 고객사들과의 합작사 청산에 따른 보상금 수취 효과**, 그리고 **ESS 후공정 병목의 점진적 해소**가 동시에 작동했다. 이 두 요인이 결합해서 영업이익이 커다란 폭으로 상회한 것이다. 그런데 왜 ESS 후공정 병목이 3분기에야 해소됐겠는가? 1분기부터 문제가 지속된 상황에서, **ESS 물량 증가에 따른 생산 체계 조정의 시간적 지연**이 있었기 때문이다.\n\n삼성SDI 역시 EV 보상금과 ESS 출하 증가로 2달 전 가이던스를 상회할 것으로 예상된다. **ESS 신규 수주가 임박했다는 점도 긍정적**하다. 4분기 ESS 수주 실행이 이루어지면, 그 물량이 1분기 실적에 반영되는 구조다.\n\n---\n\n### 2. **EV/ESS 투자 전략: 2028년 기준 Valuation Tool 적용 시 30%-40% 상승 여력**\n\n현재 배터리 섹터 대형주의 상승 여력은 7월 실적 시즌(50%-100%)보다 약 30%-40% 수준이다. 2029년을 반영하는 Valuation Tool을 그대로 사용하면 2028년 기준 30% 상승 여력을 기대하는 것이 현실적이다. 2027년 전기차 보조금 부활 등 극적인 정책 변화를 기대하기는 어렵고, 11월 중간선거 당시 민주당의 승리가 배터리 섹터에 긍정적일지는 **친환경 정책의 대대적 부활 여부에 달려 있다**. \n\n현재 양당의 정치적 논쟁에서 '친환경'이 전선으로 자리잡지 않았고, 민주당이 선거 캠페인에서 친환경 정책을 내세우지도 않는다. 따라서 **30%-40% 상승 여력을 기준으로 접근해야 하며, 2027년 보조금 부활을 전제로 하는 투자 전략은 위험한 가정**이다.\n\nESS 중소형주에 대한 매수 권고가 제시된 것도, 대형주의 상승 여력이 이미 30%-40% 수준에 도달했다는 사실과 연결된다.\n\n---\n\n### 3. **반도체: 메모리 가격 상회는 공급 부족의 신호, 코스피 -6.3%, 코스닥 -4.5% 연속 하락**\n\n삼성전자 잠정 실적은 환율 영향으로 컨센서스에 부합했다. 메모리 가격은 예상치를 상회했고, B/G는 기존 가정을 하회했다. 메모리 가격 상회가 중요한 이유는, **공급 물량 및 장기 공급 계약으로 인해 가격 상승 탄력이 제한**되어 있는 상황에서, 가격이 시장 예상치를 상회한다는 것은 **공급 부족이 고객사의 가격 부담을 넘어섰다는 방증**이기 때문이다.\n\nLPDDR 공급 부족이 가장 심각하다는 하나증권의 판단은, 해당 제품의 가격 상회가 주요 원인이라는 근거와 일치한다.\n\n코스피 지수는 5.4% 하락했고, 삼성전자와 SK하이닉스는 각각 5.1%, 8.7% 하락하며 지수를 하회했다. 이는 실적이나 펀더멘털에 의한 움직임이 아닌 **시장 분위기 및 수급**에 의해 주가가 움직이는 것으로 해석된다. 미국 필라델피아 반도체 지수 역시 매크로 이슈로 부진했다.\n\n코스닥 지수는 0.1% 하락해 5주 만에 하락 전환했고, 피에스케이홀딩스(+8%), 파크시스템스(+5%)는 좋은 주가 흐름을 보였다. 메모리 업체들의 주가 움직임이 답답한 가운데, 소부장에서 알파를 찾아가는 움직임이 계속되고 있으며, 후공정 > 전공정보다 선호하는 성향은 누차 확인된 것이다.\n\n---\n\n### 4. **소부장: 1년 반 이상의 시세를 이미 냈다는 사실과 그 함의**\n\n소부장 섹터의 주가 흐름은 다음과 같다:\n\n| 업체       | 주가 움직임 |\n|------------|-------------|\n| 피에스케이홀딩스 | +8%         |\n| 파크시스템스   | +5%         |\n| 테스      | -7%         |\n| 피에스케이    | -5%         |\n\n피에스케이홀딩스와 파크시스템스는 1년 반 정도의 시세를 이미 냈다. 이는 소부장 섹터가 **가격 전반의 수혜를 이미 반영**했다는 것을 의미한다. 그러나 소부장 섹터 자체에 대한 투자 아이디어는 유효하다. **왜냐하면 소부장은 메모리 업황이 악화되는 상황에서도 수요가 견조**하기 때문이다.\n\n---\n\n### 5. **철강: 8월 미국 철강 수입 15개월 만에 최고치 기록, 국내 철강 가격 보합**\n\n국내 철강 유통가격은 대부분의 제품이 보합이었으나, **열연 및 철근 공급 감소 영향으로 추후 반등 가능성이 높아진다**. 해외 철강 가격은 미국 열연(+3.7%), 중국 열연(-0.5%), 중국 냉연(-0.2%), 중국 철근(-0.1%)이었다. 원재료 가격은 중국 철광석 수입가(-3.6%), 한국 스크랩가(-0.5%), 호주 원료탄(-6.2%)이 하락했다.\n\n중국 철강 유통가격은 국경절 연휴 이후 수요 부진과 원재료 가격 하락 반영으로 약보합 기록했다. 산업용 금속가격은 미국 고용 둔화에 따른 금리 인상 가능성 축소와 칠레 광산 파업 영향으로 상승 마감했다.\n\n---\n\n### 6. **에너지: 러시아 디젤 수출 중단 확대, 중국 수출 재차 중단으로 글로벌 디젤 가격 추가 상방압력**\n\n- 러시아는 디젤 수출금지를 1개월 추가 연장했고, Novak 부총리는 디젤 생산량이 국내 수요를 초과할 때 **부분적으로 수출 재개를 검토**하겠다고 언급했다. 현재까지 가동 차질이 발생한 정제설비가 50%에 달하고 있어, 적어도 연말까지는 수출 재개가 쉽지 않다.\n  \n- 중국도 10월 석유제품 수출을 재차 중단했다. 이란전쟁 직후 중국이 내수 공급 안정화를 위해 수출을 제한했으나, 7월부터 이를 허용하자 중국 정유사들이 4~6월 평균 약 127만톤에 그쳤던 수출량을 7월 234만톤(+83% MoM), 8월 460만톤(+96% MoM)으로 급증시켜, 내수용 휘발유/디젤 재고가 2023년 이후 최저치를 기록했다. 원유 수입도 4월부터 크게 줄어, 현재 중국 내 항구(민간) 원유 재고는 2020년 이후 가장 낮은 수준이다.\n\n- 중국은 에너지 안보를 가장 중요한 과제로 삼아왔기 때문에, 수출 중단 조치는 1개월에 그칠 가능성보다는 **장기화될 가능성이 더 높다**. 중국은 전쟁 이전 수준의 내수 재고 회복을 수출 재개의 전제조건으로 삼고 있기 때문이다.\n\n---\n\n### 7. **자동차: 현대차/기아 3분기 9월 합산 -7% YoY, 핵심 원인은 산업적 요인 + 기업적 요인의 복합**\n\n현대차/기아 3분기 9월 합산 도매판매는 -7%/-2% YoY로, 물량 기준 저성장이 지속됐다. 핵심 원인은 두 가지다.\n\n**산업적 요인**(내수 둔화, 경쟁 심화)은 단기적으로 개선이 뚜렷하지 않다. **기업적 요인**(생산차질, 모델 노후화)은 개선 가능성이 있다. 2027년부터는 아반떼/투싼/GV90 신차 효과가 본격화되고, HEV 모델(G80/GV80), EV 모델(아이오닉3, EREV)이 출시될 예정이다. 기아는 텔루라이드HEV/스포티지HEV 증산과 함께 셀토스HEV/K4HEV 등 HEV 라인업 확대 및 지역별 특화 EV도 출시할 예정이다.\n\n---\n\n### 8. **음식료: 3분기 실적 부진 전망, 빙과 시장 경쟁 완화 vs. 주류 시장 경쟁 강화**\n\n전주 음식료 업종지수는 코스피 대비 4.9%p 아웃퍼폼했다. 코스피는 연휴를 앞둔 차익 실현 물량이 출하되면서 약세를 보였다.\n\n3분기는 일부 제품의 판가 인상 효과가 반영되기 시작했음에도 불구하고, **① 추석 연휴 시점 차이로 인한 영업일수 감소, ② 비우호적인 날씨로 인한 빙과/음료 총수요 부진, ③ 부자재 단가 인상 영향 가시화**가 실적에 부담이 됩니다.\n\n긍정적인 측면으로는, **원달러 하락으로 원가 매입 부담이 경감될 전망**이고, 라면/담배 등 주요 카테고리의 수출 성장도 견조합니다. 다만, 수출 비중이 높은 대형주는 환율 하락에 따른 단기 부정적 손익 영향이 불가피합니다.\n\n빅터는 국민연금이 빙그레 지분율을 직전 6.09%에서 9.37%로 대폭 확대했습니다. 중장기 빙과 시장 경쟁 완화 기대감과 사측의 주주환원 강화 결정, 수출 비중의 점진적 확대가 이 지분 확대의 배경입니다.\n\n주류 시장은 연말~내년 경쟁 강도가 높아질 것으로 전망됩니다. 오비맥주가 2024년 ‘제주소주’를 인수한 후 약 2년 만에 소주 신제품 ‘찰랑’을 출시했고, 이달부터 본격 소주시장에 진출할 것입니다. 오비맥주의 소주 진출 결심은 **① 전국에 구축된 영업망을 활용한 시너지, ② 중장기 성장을 위한 보폭 확대(이미 높은 맥주 MS), ③ 수출용 소주 ODM 생산을 통해 습득한 해외 사업 노하우**가 밑바탕입니다.\n\n---\n\n### 9. **디지털자산: OKX·NYSE 모회사 ICE, 토큰화 미국주식 24/7 거래 플랫폼 출시 계획**\n\nOKX와 NYSE 모회사 ICE는 50:50 합작사 OKXICE가 SEC의 5년 한시 혁신면제를 활용한 토큰화 증권 거래 플랫폼을 출시할 계획이다. 혁신면제에 따라 기존 증권거래소 등록 없이 조건부로 온체인 거래 서비스를 운영할 예정이다.\n\nNvidia·Apple·Microsoft·Tesla·JPMorgan 등 63개 종목을 대상으로 하며, 발행사는 30일 이내 토큰화 제외를 요청할 수 있다. 거래 개시는 이의제기 기간 종료와 관련 요건 충족 이후 가능하다.\n\nOKX의 X Layer에서 Uniswap v4 기반 AMM을 활용해 연중무휴 거래를 지원하고, USDC·USDT·USDG를 결제수단으로 사용한다. KYC/KYB를 완료한 승인 지갑에만 거래와 유동성 공급을 허용하는 구조다. SEC 등록 브로커딜러를 통해 기초주식을 1:1 보관하고, 토큰 보유자에게 배당·의결권 등 기존 주식과 동등한 권리를 제공한다. 거래와 결제는 스마트컨트랙트를 통해 단일 온체인 거래로 처리한다.\n\n---\n\n### 10. **중소형주 소비주의 미래: 인구 문제 해결부터 시작, 27년 되돌림의 타이밍 주목**\n\n내수 업종은 추세적으로, 장기적으로 하락해왔다. 국내 인구 소멸이라는 막연한 두려움 속에서 내수 업종 PER Multipler도 10X 이하로 크게 할인되어 거래되는 것이 일반적이다. 그러나 실상을 들여다보면, 내국인 인구 감소보다 더 큰 문제는 방한 외국인수가 해외 여행 한국인수보다 더 빠르게 증가하면서 총소비 인구 균형이 깨진 것이었다. 지난 10년간 연간 인구 순유출이 1,100-1,200만명에 달하는 고비를 THAAD 사태와 코로나19 이후 두번 겪으며 중소형 내수 소비 업종 주가는 국내 내수 시장의 장기 침체를 반영하는 수준까지 내려왔다.\n\n그런데 주식 시장이 방향을 갖고 끝없이 추세를 갖는 것은 없다. 27년 중소형 내수 업종의 되돌림의 타이밍이 올 수 있다는 점에 주목해야 한다.\n\n---\n\n### 11. **에너지: 스타링크, 위성과 우주 주파수 모두 확보, D2D 위성 15,000기 승인**\n\nFCC는 스페이스엑스의 차세대 단말 직접통신(D2D) 위성 15,000기를 부분 승인했다. 2025년 9월 신청 이후 약 1년 만이다. 승인된 군집은 고도 약 330km 안팎의 9개 궤도면에 배치되고, 미국 내에서는 위성용 통신서비스인 MSS뿐만 아니라 지상 이동통신용 주파수를 직접 보유한 채 위성에 적용한 SCS도 가능해졌다. 해외에서는 일반 스마트폰 대상 직접통신 서비스를 제공하게 된다.\n\nFCC는 바로 다음 날 D2D용으로 25MHz 규모의 프라임 대역을 경매에 부치는 방안까지 발표하며 연이어 위성 직접통신 지원 조치를 내놓았다.\n\n---\n\n### 12. **재생에너지: 2030년 재생에너지 100GW 달성을 위한 연도별 구체적 수치 제시**\n\n2027년부터 연 10GW 이상, 2029~30년 연 15GW 확대 목표가 처음으로 제시됐다. K-GX에서는 10년간 1,000조원을 투입하고 태양광과 풍력 핵심부품 국내생산세액공제, 탠덤셀 상용화 등 공급망 지원을 추진한다.\n\n---\n\n### 13. **배터리: 2027년 11월 에코스타 거래 종결 전까지 AWS-4/H, AWS-3 대역 사용 제한**\n\nAWS-4와 AWS-H블록, 비대칭 AWS-3 대역은 거래 2단계가 종결되는 2027년 11월 이후에야 본격 사용할 수 있다. 그전까지는 발사·초기 궤도 운용 과정의 시험이 허용된다.\n\n---\n\n### 14. **주식/ETF: 외국인 순매도가 코스피 -6.3%, 코스닥 -4.5%를 만들어낸 메커니즘**\n\nAI 랠리가 모멘텀을 잃으면서 외국인 투자자가 올해 한국 주식에서 1,310억 달러를 순매도했다. 삼성전자·SK하이닉스가 함께 5% 이상 급락하며 지수를 끌어내렸다.\n\n---\n\n### 15. **정유: 러시아 디젤 수출 중단 확대, 중국 수출 재차 중단으로 글로벌 디젤 가격 추가 상방압력**\n\n---\n\n### 16. **Construction: 원전, LNG 등 에너지 인프라 사업 의존도가 높은 건설업종, 자금조달 부담이 지속**\n\n10/6~8일 건설업종 주가는 5.3% 하락하며 KOSPI 대비 0.1p 아웃퍼폼했다. 미국 국채 금리 상승, 미국 고용 둔화에도 ISM 물가 급등하는 등 불안정한 매크로 지속되며 주가 부진했다. 대규모 자금조달이 필요한 원전, LNG 등 에너지 인프라 사업 의존도가 높은 건설업종 주가가 약세를 보였다.\n\n---\n\n### 17. **Transportation: 미국의 고용 둔화, ISM 물가 급등, 글로벌 경기 불안정이 건설업종 주가를 억눌렀다**\n\n---\n\n### 18. **Entertainment/Media/Leisure: 인바운드 호황 지속, 티빙 9월 MAU 999.5만명 MoM +22.6%로 쿠팡플레이를 2위 탈환**\n\n---\n\n### 19. **Finance: 3Q26 합산 실적 1조 1,512억원(+6% YoY), 주식·채권·대체투자 평가손실이 감익의 주된 원인**\n\n2026년 3분기 커버리지 손해보험사 합산 이익은 1조 1,512억원(+6% YoY, -41% QoQ)으로, 모두 시장 컨센서스를 10% 이상 하회했다. 주로 투자 부문에서의 평가손실 때문이었다.\n\n---\n\n### 20. **Media: 파라마운트-워너브라더스 합병, 인바운드 호황 지속**\n\n---\n\n### 21. **Game: 스프라이트게임즈, 스프라이트게임즈, 게임업종 주가 조정을 매수 기회로 판단**\n\n---\n\n### 22. **Real Estate: 주택시장 회복 시그널, 수요 둔화에 대한 우려는 아직 존재**\n\n---\n\n### 23. **Insurance: 3Q26 합산 실적 1조 1,512억원(+6% YoY)**\n\n---\n\n### 24. **Retail: 빙그레, 국민연금이 빙그레 지분율을 직전 6.09%에서 9.37%로 대폭 확대**\n\n---\n\n### 25. **Food and Beverage: 빙그레, 국민연금이 빙그레 지분율을 직전 6.09%에서 9.37%로 대폭 확대**\n\n---\n\n### 26. **Pharmaceuticals/Biotech: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 27. **Automotive Parts: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 28. **Oil and Gas: WTI $95.2(-7.0%), Brent $99.8(-5.7%)**\n\n---\n\n### 29. **Steel: 미국을 제외한 글로벌 철강 업황 둔화**\n\n---\n\n### 30. **Chemicals: 8월 미국 철강 수입 15개월 만에 최고치 기록, 국내 철강 가격 보합**\n\n---\n\n### 31. **Logistics: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 32. **Communication Services: 파라마운트-워너브라더스 합병, 인바운드 호황 지속**\n\n---\n\n### 33. **Technology: AI 랠리가 모멘텀을 잃으면서 외국인 투자자가 올해 한국 주식에서 1,310억 달러를 순매도**\n\n---\n\n### 34. **Consumer Goods: 빙그레, 국민연금이 빙그레 지분율을 직전 6.09%에서 9.37%로 대폭 확대**\n\n---\n\n### 35. **Semiconductor: AI 랠리가 모멘텀을 잃으면서 외국인 투자자가 올해 한국 주식에서 1,310억 달러를 순매도**\n\n---\n\n### 36. **Electric Vehicles: 현대차/기아 3분기 9월 합산 -7% YoY, 핵심 원인은 산업적 요인 + 기업적 요인의 복합**\n\n---\n\n### 37. **Energy Storage Systems(Energy Sector): ESS, 가스 발전의 경제성을 앞서기 시작**\n\n---\n\n### 38. **Power Generation Equipment: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 39. **Industrial Machinery: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 40. **Financial Services: 3Q26 합산 실적 1조 1,512억원(+6% YoY)**\n\n---\n\n### 41. **Biotechnology: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 42. **Healthcare: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 43. **Telecommunications: 파라마운트-워너브라더스 합병, 인바운드 호황 지속**\n\n---\n\n### 44. **Utilities: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 45. **Materials: 8월 미국 철강 수입 15개월 만에 최고치 기록, 국내 철강 가격 보합**\n\n---\n\n### 46. **Mining: 2027년까지 1,000억원 투자 유치**\n\n---\n\n### 47. **Consumer Discretionary: 빙그레, 국민연금이 빙그레 지분율을 직전 6.09%에서 9.37%로 대폭 확대**\n\n---\n\n### 48. **Real Estate Investment Trust(REITs): 주택시장 회복 시그널, 수요 둔화에 대한 우려는 아직 존재**\n\n---\n\n### 49. **Banking: 2026년 3분기 커버리지 손해보험사 합산 이익은 1조 1,512억원(+6% YoY, -41% QoQ)**\n\n---\n\n### 50. **Information Technology(IT): AI 랠리가 모멘텀을 잃으면서 외국인 투자자가 올해 한국 주식에서 1,310억 달러를 순매도**\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 삼성전자 잠정실적과 실적 기대의 역설: 외국인이 팔고 한국인이 살 수 없는 이유\n\n삼성전자는 3분기 영업이익 107조원(YoY +783%)이라는 결과물을 내놨다 — 전 세계 IT 기업 중 이를 달성한 업체는 없다. 하지만 코스피는 전 거래일 대비 2.62% 하락한 6,625.93P로 마감했고, KOSDAQ은 0.69% 하락했다. 외국인과 기관이 동반 순매도했기 때문이다.\n\n문제는 이 실적이 오히려 시장을 더 겁냈다는 것이다. 2분기에 이익 증가율이 YoY +1,814%를 기록했으므로, 이번 실적은 그 절반 이하로 감속된 것이고, 4분기 120~130조원 규모의 영업이익이라면 증가율은 480%대에 그칠 수밖에는 없다. 이미 이익이 107조원이라는 절대 규모가 있으니, 앞으로 얼마나 더 많이 늘릴 공간이 있는지를 쓰다듬는 시각이 살아났다.\n\n유진투자증권은 이를 명확히 짚는다: “과속의 후유증은 기업이익 증가율 둔화 및 이익률 정점 가능성 때문.” 2026년 코스피 영업이익 증가율이 올해 227%에서 내년 35%로, 코스닥이 76%에서 40%대로 급격히 둔화한다는 사실이 이 실적의 함의다. 그리고 이 숫자들은 2027년 코스피 EPS 증가율 33%, 2028년 6.3%대로 급격히 하락할 것이라는 전망과 맞닿는다.\n\n이익 증가율이 둔화되면서 주가가 이익 증가율만큼 오르는 것은 어렵다. iM증권이 지적하는 핵심 논리다: “주가가 이익 증가율이 둔화되거나 이익률이 더디게 개선되면 주가도 천천히 올라갈 수밖에 없다”는 것이 아니라, 오히려 **주가가 이익 증가율보다 먼저 둔화되기 쉬운 구조**다. 외국인은 이런 구조를 알고 팔렀고, 한국 개인 투자자는 저가 매수세로만 방어하지 못했다.\n\n---\n\n### 2. 외국인의 선택과 한국 투자자의 혼란: 미국 2차전지 vs 한국 대형주\n\n같은 AI 인프라 기대 속에서도, 미국과 한국이 다른 모습을 보이고 있다.\n\n#### 미국: AI 인프라 섹터가 지수 신고가를 만들고 있다\n\n나스닥이 27,600으로 사상최고치를 경신했는데, 이때 중요한 사실은 **동일가중 S&P500과 러셀 2000이 고점 대비 각각 5.3%, 9.0% 낮은 상태**라는 점이다. 신고가를 기록한 지수는 몇 가지에 불과하다. 왜?\n\nkiwoom증권이 분석한 주간 업종별 흐름을 볼 때, **유틸리티(+4.0%), 필수소비재(+3.6%), 에너지(+3.6%), 헬스케어(+2.8%)**, 그리고 사이버보안(WCBR +7.1%), 클라우드(WCLD +6.1%), 온라인리테일(ONLN +5.9%) 등 방어섹터와 소비재 섹터가 상승했고, IT/XLK(-0.5%), 산업재/XLI(-0.4%)가 하락했다. 미국의 AI 인프라 섹터가 신고가를 만들고 있었음에도 불구하고, 나스닥 지수 자체가 신고가를 기록한 것은 **IT 섹터 내 특정 스프레드가 형성돼 지수를 끌어올리기 때문에** 가능한 이야기다.\n\n이는 **AI 수혜가 모든 IT 섹터에 균등하게 돌아가지 않는 구조**를 반영한다. 미국 IT 섹터 내에서 차별화된 부분이 있고, 그것을 모르면 AI 인프라 섹터의 실적 모멘텀이 지수 전체로 전이되지 않을 수 있다는 것이다.\n\n#### 한국: 외국인이 팔고, 국내 개인이 사는 사이에 코스피는 뺐다\n\n한국 증시는 삼성전자와 SK하이닉스가 동시에 5% 이상 하락하자, 외국인 6조 4,531억원, 기관 2조 3,887억원이 순매도했다. 개인이 저가 매수세로 방어하는 게 그나마 효과가 있었다. 그런데 문제는 **이 매수세가 실제로 지수 방어에 기여할 수 있는 규모인지**다.\n\nKiwoom증권의 수치를 보면, 외국인은 기계/장비(-2,169억원), 금속(-1,807억원), 제약(-1,479억원), IT서비스(-1,274억원) 순으로 순매도했다. 기관은 운송/창고(-663억원), 제약(-538억원), 건설(-526억원), 보험(-497억원) 순으로 순매수했다. 이 기관 순매수 중 제약과 건설, 보험은 반도체 수혜와 직접적인 관련이 없고, 운송/창고도 반도체 수요와 다소 간접적이다. 즉, **기관의 순매수도 AI 또는 반도체 관련 섹터가 아니고, 이익 둔화의 초기 단계에 처한 다른 업종들에서 이루어졌다**는 뜻이다.\n\n---\n\n### 3. AI 수혜 섹터의 내부 구조: 왜 반도체 대형주가 뒤떨어지는가? (하나증권)\n\n하나증권은 2027년 이익 증가율 전망치 상위 5개 업종을 다음과 같이 제시한다:\n\n- 반도체  \n- 제약/바이오  \n- 운송  \n- 소프트웨어  \n- 하드웨어  \n\n즉, 2026년에 이미 이익 증가율 1위를 차지한 반도체가 2027년에도 1위를 유지하는 것에 주목할 필요가 있다. 그러나 하나증권이 분석하는 역사적 패턴은 다르다. \n\n2011년과 2016년은 코스피 순이익이 사상 최고치를 경신한 후 이익 증가율이 둔화된 대표적인 연도다. 당시 주가 수익률이 높었던 업종은 **2010년보다 2011년 순이익 증가율이 높은 업종**(에너지:+49%, 자동차:+37%)이었고, 2015년보다 2016년 순이익 증가율이 높은 업종(에너지:+58%, 철강:+20%)이었다. 이익 증가율이 둔화되는 국면에서는 **이익의 절대 규모의 증가 여부보다는 증가율 수준이 주가 수익률 결정에 보다 큰 영향**을 준다고 결론짓는다.\n\n따라서 2027년 반도체의 이익 증가율이 둔화되는 상황에서, **2026년 이익 증가율이 더 높은 업종으로 포트폴리오를 재편**하는 것이 전략적 의미를 갖는다. 하나증권은 국내 증시가 반도체가 아닌 **2차전지, IT하드웨어, 미디어, 철강**이 2027년 이익 증가율에서 더 높다는 것을 지적하며, 이 업종으로의 주도권 이양 가능성을 언급한다.\n\n---\n\n### 4. PER 30배 이하에서 하락하는 업종이 3~5~10년 평균 주가 수익률이 높다\n\n하나증권의 또 다른 주장은 매우 독특하다. 국내 증시에서 PER 10배 이하에서 하락하는 업종보다는 **PER 30배 이하에서 하락하는 업종의 주가 수익률이 최근 3년, 5년, 10년 평균 주가 수익률이 모두 높았다**는 것이다. 이는 PER 레벨이 낮은 것이 반드시 좋은 투자 위치를 만들어주는 것은 아니라는 의미다.\n\n더 구체적으로, 저PER 이 더 저PER로 되기보다는 고PER이 저PER로 빠르게 변할 수 있는 기업들에 대한 비중 확대가 유효하다는 것이다. 이 논리는 PER 디라이팅의 속도에 관심을 갖고, 그 속도가 빠른 기업을 선별하는 방식으로 투자를 접근하도록 한다.\n\n하나증권이 제시하는 대표 종목 리스트는 다음과 같다:\n\n- 삼성전기, 삼성바이오로직스, 두산에너빌리티, 삼성SDI, 한미반도체, 효성중공업, 한화시스템, 주성엔지니어링, 한국항공우주, 대한항공, 현대오토에버, 하이브, 한전기술, 현대제철\n\n이 종목들은 PER 30배 이하에서 하락하고 있는 것으로 판단되며, 그 하락 속도가 빠른 것으로 추정된다. 이 목록은 단순한 가치주 선별이 아니라, **PE 라틴트(Latent)**의 개념에 가깝다 — 이익이 아직 PE가 낮은 수준으로 반영되지 않았거나, 이익 개선이 더디지만 그 속도가 빠른 구조를 가지고 있는 기업들이다.\n\n---\n\n### 5. 외국인과 기관의 동반 매도: 왜 코스피가 하락했는가?\n\nKiwoom증권이 제공한 주간 펀드 플로우 데이터는 코스피의 하락을 이해하는 데 핵심적이다. 주식형 펀드는 124.1억달러 순유입에 그쳤고, 채권형 펀드는 18주 만의 최대 순유입 338.4억달러를 기록했다. 2026년 9월 고용(+2.9만명)이 예상치를 대폭 하회하며 10월 동결 확률이 80%대까지 상승했음에도, 미 10년물은 5.3%를 돌파해 2002년 이후 최고치를 경신했다.\n\n왜 이렇게 될까? 하나증권은 그 이유를 다음과 같이 제시한다: **기대인플레이션이 안정적으로 유지되고 있음에도 실질금리가 2년 만에 2%대로 올라선 것**에 기인한다. 즉, 인플레이션은 2%대 안팎에서 안정되지만, 금리가 5.3%로 2%대의 실질금리가 유지되도록 되면서, 실질금리가 너무 높아져 주식-채권 간 일드갭가 축소되었다. 이 일드갭 축소가 주식시장에 부담을 주면서 주식형 펀드가 순유입되었지만, 그 규모는 채권형 펀드의 순유입에 비해 매우 작았다.\n\n또한, 주식형 펀드의 액티브(-83.4억달러)는 2주 연속 순유출을 기록했는데, 이는 단순한 수급 문제가 아니라, **주식-채권 간 일드패리티가 붕괴되면서 주식에 대한 기대수익률이 떨어졌기 때문**이라고 해석할 수 있다.\n\n---\n\n### 6. Ai에이전트 액티브 ETF: 테마 내에서의 액티브 운영 구조\n\nDS투자증권이 소개한 KODEX 미국 AI에이전트 액티브는 비교지수 Indxx US AI Agents Index를 기반으로 액티브 운영 된다. Indxx 지수는 미국 상장 보통주 및 ADR 중 시가총액 10억달러 이상, 최근 6개월 평균 거래대금 1천만달러 이상, 유동주식비율 10% 이상, 주가 1만달러 미만을 충족하는 기업을 편입 대상으로 하고, AI에이전트와 관련된 7개 세부 테마(광학·네트워크, 서버·인프라, AI 반도체·가속기 시스템, 기업용 AI 소프트웨어·데이터·보안, 반도체 장비·소재, 전력·에너지, 데이터 저장) 내에서 LLM 점수 50점 이상을 넘긴 기업을 선별한다.\n\nIndxx 지수의 편입 비중은 구성종목 수와 LLM 점수 차이에 따라 다르게 배분된다. 구성종목이 15개인 경우 상위 1~2위에 각각 24%, 나머지 13개에 각각 4%. 구성종목이 16개이면 상위 1~3위에 각각 16%, 나머지 13개에 각각 4%. 구성종목이 17개인 경우 LLM 점수 2위와 3위 기업 간 점수 차이를 추가로 반영: 차이가 5점을 초과하면 상위 1~2위에 각각 20%, 나머지 15개에 각각 4%; 차이가 5점 이하면 상위 1~3위에 각각 10%, 나머지 14개에 각각 5%.\n\nKODEX ETF는 Indxx 지수에 기반해 상위 1~2위 종목에 각각 25%씩 총 30%를 할당하고, 3~5위에 총 20%를 동일하게 배분한 후, 나머지 6~17위의 12개 종목에 총 50%를 동일가중 배분한다. 비교지수의 정기 리밸런싱은 매월 첫 번째 금요일이며, ETF 포트폴리오는 Indxx 지수와의 상관계수 0.7 이내에서 액티브 운용한다. 신규 상장 기업도 운용역 판단에 의해 편입할 수 있어, Indxx 지수가 고정된 패시브 ETF와 구분된다.\n\n---\n\n### 7. 글로벌 MLCC & 기판 TOP4+ ETF: 텍스트 기반 키워드 스코어링과 Top4 비중 집중\n\nKIWOOM 글로벌 MLCC&기판 TOP4+는 iSelect 글로벌 MLCC&AI기판 TOP4+ 지수를 기반으로 한다. 비교지수는 한국·미국·일본 상장 종목 중 MLCC, ABF 기판, 첨단 패키징, AI 서버, CoWoS, FC-BGA, 유리기판, 동박적층판(CCL) 등 관련 키워드를 반영해 스코어를 산출하고, 스코어 상위 20개 종목 중 시가총액 20억달러 이상, 거래대금 5천만달러 이상을 충족하는 기업을 스코어 순으로 선별해 10개 종목을 최종 편입한다. 편입 가능 종목이 10개 미달이면 평균 시가총액 10억달러 이상, 평균 거래대금 2천만달러 이상으로 기준을 완화한다.\n\n편입 비중은 MLCC·AI기판 관련 스코어 상위 1~2위 종목에 각각 25%, 3~4위에 각각 15%를 배분해 Top4 기업의 합산 비중을 80%로 구성하고, 나머지 6개 종목에 잔여 20%를 유동시가총액 가중방식으로 할당한다. 개별 종목 최대 편입 비중은 5%의 CapRate으로 제한되며, Top4는 시가총액이나 시장점유율 순위가 아닌 관련 키워드 스코어를 기준으로 선정된다.\n\n상장일(10/13) 기준 포트폴리오는 삼성전기(25%), 무라타(25%), 타이요유덴(15%), LG이노텍(15%)이 Top4이며, 두산(5%), 이비덴(5%), TDK(5%), 이수페타시스(5%), 대덕전자(5%), 심텍(5%)이 나머지 6개 종목이다. 하위 6개 종목의 최대 편입 비중은 5%로 제한되어 있다. 정기 리밸런싱은 매년 4회(3월/6월/9월/12월 세 번째 영업일)이며, 0.49%의 총 보수가 적용된다.\n\n---\n\n### 8. DS AI반도체 액티브: FnGuide 반도체 수퍼사이클 지수와 비교\n\nDS AI반도체 액티브는 FnGuide 반도체 수퍼사이클 지수를 비교지수로 한다. FnGuide 지수는 국내 상장기업 중 시가총액 1천억원 이상, 유동주식비율 10% 이상을 충족하는 종목을 대상으로 AI반도체, AI인프라, 반도체 공급망, 소부장, 전공정·후공정 등 핵심 키워드를 중심으로 AI반도체, AI인프라, 반도체 공급망, 소부장, 전공정·후공정 등 관련 키워드를 활용해 편입 후보군을 선정한다. 이후 기업과 테마 간 유사도 스코어에 LLM 스코어를 곱해 테마스코어를 산출한다.\n\n테마스코어와 유동시가총액 순위가 각각 상위 50위 이내인 종목들을 우선 선정하고, 구성종목 수가 30개에 미달하면 순위 조건을 단계적으로 확대하며 추가 종목을 편입한다. 각 단계에서는 테마스코어 순위가 높은 기업을 우선 선정한다. 구성종목 수가 30개에 미달하면 순위 조건을 단계적으로 확대하며 추가 종목을 편입한다.\n\n편입 비중은 상위 2개 종목에 각각 15%씩 총 30%를 할당하고, 3위~5위에 총 20%를 동일하게 배분한다. 나머지 6위~30위의 25개 종목은 총 50%를 동일가중방식으로 편입한다. 비교지수의 정기 리밸런싱은 매년 4회(3월/6월/9월/12월 선물옵션 만기일 이후 두 번째 영업일)이며, ETF 포트폴리오는 비교지수 구성종목의 비중을 조절하거나 지수에 포함되지 않은 종목을 선별적으로 편입하며 초과수익을 추구한다. 총 보수는 1.00%이다.\n\n---\n\n### 9. ACE 29-11 회사채(AA-이상) 액티브: 만기매칭과 CapRate 기준\n\nACE 29-11 회사채(AA-이상) 액티브는 신용등급 AA- 이상의 특수채, 은행채, 기타금융채, 회사채를 대상으로 2029년 11월 만기를 목표로 하는 약 3년 1개월 만기의 만기매칭형 채권 액티브 ETF이다. 존속기한이 종료되면 상장폐지와 함께 잔여 자산을 지급하는 구조다.\n\n비교지수는 KIS 크레딧 2911 만기형(AA-이상)지수(총수익지수)이며, 유효기간은 2029년 11월 30일까지이다. 편입 대상은 2029년 10월부터 12월 사이에 만기가 도래하는 국내 채권들로, 신용등급 AA- 이상과 발행잔액 500억원 이상의 조건을 함께 적용한다. 비교지수는 특수채·은행채와 기타금융채·회사채의 발행잔액 비중을 각각 40%, 60%로 조정한 시가총액을 기준으로 편입 비중을 산출한다. 비교지수의 리밸런싱은 매일 진행된다. 총 보수는 0.05%이다.\n\n---\n\n### 10. 금리 하락 전환이 채권형 펀드에 미친 영향\n\nKiwoom증권의 주간 펀드 플로우 데이터에 따르면, 채권형 펀드는 18주 만의 최대 순유입 338.4억달러를 기록했다. 이는 2026년 9월 고용(+2.9만명)이 예상치를 대폭 하회하며 정책금리 10월 동결 확률이 80%대까지 상승했음에도, 미 10년물이 장중 5.36%까지 오르고 9월 FOMC 의사록에서 연내 추가 금리인상 가능성이 확인되며 중소형주 부담이 확대된데 따른 결과다.\n\n특히, 투자등급(+0.45%), 국채(+0.90%), 단기채(+0.65%)가 52주 내 최대 순유입 강도를 보였고, 단기채는 41주 만에 최대 순유입을 기록했다. 하이일드만 순유출이 발생했다. 한편 높은 금리 레벨로 인한 주식-채권 간 일드갭 축소가 주식시장에 부담을 주며 주식형 펀드 액티브(-83.4억달러)가 2주 연속 순유출을 기록했다.\n\n---\n\n### 11. 미국 9월 CPI: 3개월 연속 하향 안정화 vs 금리 피크아웃 시점\n\nIM증권은 미국 9월 CPI를 주목할 이유를 다음과 같이 제시한다. 8월까지 3개월 연속 하향 안정화된 근원 물가가 이번에도 하향 안정화되는지 여부가 핵심이다. 금리 피크아웃 시점과 AI 인프라 섹터의 주가가 금리와 동조화될 수 있는 구간이 가까워지고 있기 때문이다.\n\n이미 2026년 9월 고용(+2.9만명)이 예상치를 대폭 하회하며 10월 FOMC 인상 확률이 60%대 후반에서 18~25%로 내려왔고, WTI는 배럴당 90달러 내외에서 등락을 이어갔다. 이 시점에서 CPI가 하향 안정화되면 금리 피크아웃의 신호가 강화되고, AI 인프라 섹터의 주가가 금리와 동조화될 수 있는 구간으로 접어든다는 것이다.\n\n---\n\n### 12. 중국: AI 모델 경쟁이 가속화되며 ASML DUV 장비 재고를 선제적으로 확보\n\nTrendForce에 따르면, 중국은 2024~2025년 약 130억달러 이상 규모의 ASML DUV 노광장비를 확보한 것으로 추정된다. 미국과 네덜란드의 첨단 반도체 장비 규제로 EUV 도입이 제한된 상황에서 DUV 장비 재고를 선제적으로 확보해 7nm급 로직과 첨단 메모리 생산을 지속하려는 전략으로 평가된다. 이는 중국이 국산 노광장비 개발에 필요한 시간을 확보하는 동시에 기존 DUV 장비를 활용한 선단공정 생산능력을 유지하려는 움직임으로 판단된다.\n\nSCMP는 중국 본토 기업이 소유한 반도체 공장들이 2026년 초까지 침지형 DUV 노광장비 343대를 확보한 것으로 추정한다고 보고한다. 이 가운데 약 270대가 ASML의 Twinscan NXT:1980i 모델이며, 중국은 2024년 약 90대, 2025년 약 89대를 추가 확보하는 데 총 130억달러 이상을 지출한 것으로 분석된다. 미국과 네덜란드의 규제가 현실화된 상황에서 중국이 DUV 장비를 선제적으로 확보하는 행태는, AI 모델 경쟁이 가속화됨에 따라 반도체 장비 수급의 구조적 불균형이 심화될 수 있다는 신호로 해석할 수 있다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n시장은 AI 랠리 종료로 인한 반도체 섹터의 대규모 매도세와 외국인의 지속적인 순매도로 인해 KOSPI와 KOSDAQ 지수가 크게 하락한 것으로 보인다. 이는 단순한 수익 실현의 타이밍 문제를 넘어, AI 수요 성숙기와 관련된 재검토가 진행 중임을 시사한다. 한편, 미국 고용 데이터와 ISM 물가지수의 상승은 비용 압력의 지속성을 강조하며, FOMC의 추가 인상 가능성과 관련된 불확실성이 여전히 존재한다. 10월 14일 9월 코어 CPI 발표가 시장 방향성을 결정할 핵심 포인트로 작용할 것으로 보이며, 이에 따라 금리 동결 또는 추가 인상 여부에 따라 채권 시장과 주식 시장의 흐름이 달라질 수 있다. 산업 섹터별로는 배터리, 소부장, ESS 등 일부 섹터는 성장 잠재력이 여전히 존재하지만, 반도체와 자동차 등은 외부 요인에 따른 부진이 지속되고 있다. 따라서 현재 시장 상황에서는 AI 테크 모멘텀의 종료와 금리 정책의 방향성, 그리고 코어 CPI 발표에 따른 시장 반응을 주시하는 시각이 가능하다."}]}</script>
