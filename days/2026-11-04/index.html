 ↓ 로 연결되는 전형적인 \"지정학 불확실성 해소 + 이란 협상 기대\" 패턴.\n\n---\n", "news_md": "## 미국 뉴스\n\n- **민주당, 미국 중간선거에서 상·하원 모두 장악** — 트럼프 행정부에 대한 심판 성격으로 평가되며, 무역·외교 정책 불확실성 확대가 거론됨. (NYT·Forbes·The Guardian)\n- **유가 급락 — Brent 약 9%↓ $94, WTI 약 8%↓ $88** — 중간선거 패배 후 뱅스 부통령이 이란전쟁을 패인으로 지목하면서 지정학적 전쟁 프리미엄이 급격히 소화됨. (BBC·AP통신·WSJ)\n- **금 현물가격 온스당 $4,000 돌파** — 민주당 중간선거 선전으로 달러 약세·미 국채 금리 하락이 맞물리며 상승. 연준 금리 경로에 대한 관심도 재부각. (Reuters·Bloomberg·WSJ)\n- **애플 주가 하락, 미 증시 혼조** — 애플이 이익률 감소 전망을 제시하며 약세; 반면 엔비디아 등 AI 대형주 강세로 나스닥·S&P 500은 혼조 마감. (Reuters·Chicago Tribune)\n- **골드만삭스, 2026년 12월 Brent 목표가 $105로 상향** — 중동·우크라이나 분쟁 관련 공급 차질 리스크를 근거로 2027년 평균 전망도 $80→$88로 상향 조정. (Bloomberg·CNBC)\n\n## 한국 뉴스\n\n- **10월 수출 역대 최고 $1,152.8억 — 반도체 수출 259.4% 급증** — 산업부 발표 기준 1~10월 누적 수출 약 $9,300억으로 11월 중 연간 $1조 돌파가 유력. (산업통상자원부·Reuters·신화통신)\n- **북한, 한반도 동쪽 해상으로 미상 비행체 발사** — 한국 합동참모본부가 발사 사실을 확인하고 비행체 제원 분석 중이라고 밝힘. (연합뉴스)\n- **에르도안 터키 대통령 방한, 이재명 대통령과 정상회담** — 양국 교역 목표 $150억 설정, 원전·방산 협력 등 논의. (코리아헤럴드·Washington Times)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### [핵심 현상 #1] 서비스물가 중심의 근원 압력 지속 → 2% 목표선 타겟팅 강화\n\n### 무슨 일이 일어나고 있나?\n10월 한국 소비자물가는 전년동월비 2.8%로 전월(2.9%)보다 0.1%p 둔화했다. 하지만 농산물(-0.32%p), 석유류(에너지) 등의 하방 효과를 감안하면, 실제로 근원(농산+석유 제외)은 2.8%로 오히려 0.1%p 상승했다. 서비스물가(2.7%), 개인서비스(3.3%)가 전체 물가 구조의 50% 이상을 차지하는 만큼, 이런 구성은 특별한 의미를 갖는다.\n\n### 왜 그런가? \nOECD 기준 근원(식료품+에너지 제외)은 2.8%로 전월(2.8%)과 같았다. 다만 전월비로 보면 0.2%에서 0.4%로 올랐는데, 이는 9월보다 0.2%p 상승했다. 서비스·개인서비스 전월비가 각각 0.2%에서 0.4%로 올랐다는 점이 중요하다. \n\n### 그래서 어떤 의미인가?\n근원 물가가 2% 목표선을 이미 넘어섰다는 점에서, 한국은행의 기조는 사실상 별도의 추가 인상 논리를 요구하고 있다. 9월부터 서비스물가가 0.2%에서 0.4%로 올랐다면, 서비스 전월비가 0.4%를 유지한다면 다음 달에도 0.4%를 기록할 가능성이 높다. 서비스 전월비가 0.4%를 유지하면 12월에는 0.8% 누적 상승이 발생한다. 서비스물가가 0.4%를 유지하면 12월까지 0.8% 누적 상승이 발생한다. 이는 2026년 연간 물가 경로가 2025년(2.1%)보다 높은 궤적을 그리는 것을 의미한다.\n\n### 참고\n- 서비스물가 전년비 기여: 1.47%\n- 개인서비스 전년비 기여: 2.1%\n\n### [핵심현상 #2] 농산물·석유류 하방 효과 vs 서비스·개인서비스 상방 압력 → 근원물가 수렴\n\n### 무슨 일이 일어나고 있나?\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권\n\n### **국내 채권시장: 장기물 중심 강세 마감**\n전일 국내 채권시장은 장기물 중심 강세 마감됐습니다. 증시 하락에 따른 안전자산 선호 및 외국인 국채선물 순매수가 강세를 뒷받침했습니다. 간밤 국제유가 급락과 미국 장기금리 하락에 연동해 강세 출발하며, 미국 기술주 약세가 국내로 확산되며 코스피·코스닥이 동반 급락하자 위험회피 심리 강화되며 금리 하락했습니다. 한편 2조원 규모 국고채 30년물 입찰이 무난하게 소화된 가운데 외국인의 10년 국채선물 대규모 순매수가 장기물 강세를 뒷받침했습니다.\n\n### **국내 채권시장 동향**\n전일 국내 채권시장에서는 금리는 하락하고, 수익률 곡선은 평탄화되었습니다. 국5/3 스프레드는 13.0bp(-2.7bp)로, 국10/3 스프레드는 26.3bp(-3.7bp)로 나타났습니다. 국10/5 스프레드는 13.3bp(-1.0bp), 국30/10 스프레드는 9.0bp(-1.0bp)였습니다.\n\n### **국내 채권시장 방향성**\n국내 채권시장은 지난 날 종합적으로 하락세를 보였습니다. 증시 부진과 국제유가 급락이 채권 강세를 이끌었습니다. 그러나 물가 부담에 중단기물 강세는 비교적 제한되어 장기금리를 더 크게 내렸고, 수익률 곡선이 평탄화되었습니다. 특히 장기물을 중심으로 강세가 두드러졌는데, 이는 미국 중간선거 불확실성을 감안하면 이해됩니다.\n\n### **국내 외환시장 동향**\n달러-원 환율은 1,341.00원으로 2.80원 하락했습니다. 네이버가 유치한 엔비디아 투자금의 환전 물량이 유입되며 하락 전환했고, 코스피 급락과 외국인의 달러선물 순매도 전환이 환율 하방 압력을 가했습니다. 이러한 움직임은 미국 중간선거 이후 글로벌 시장을 관통하는 변화를 반영합니다.\n\n### **국내 채권시장 전망**\n미국 중간선거 불확실성 속 국내 증시 부진과 국제유가 급락이 채권 강세를 이끌었던 전일입니다. 물가 부담에 중단기물 강세는 비교적 제한돼 장기금리가 더 크게 내리며 수익률 곡선 평탄화를 만들었습니다. 다만 현재 시점에서 중요한 것은 장기물 중심 강세가 얼마나 지속될지를 고려해야 합니다. 외국인이 10년 국채선물 대규모 순매수를 하는 등 장기물 강세를 뒷받침하는 요인이 있습니다. 하지만 앞으로 미국 중간선거 결과와 함께 세계 경제 상황에도 많은 변수들이 존재하기 때문에 다음 세션이 중요하다고 볼 수 있습니다.\n\n### **국내 채권시장 동향 정리**\n- **금리 방향:** 하락(3Y), 하락(10Y)\n- **수익률 곡선:** 플래트닝\n- **스프레드(bp):** \n  - 국5/3: 13.0 (-2.7)\n  - 국10/3: 26.3 (-3.7)\n  - 국10/5: 13.3 (-1.0)\n  - 국30/10: 9.0 (-1.0)\n\n### **국내 외환시장 동향 정리**\n- **달러-원:** 1,341.00원 (2.80원 하락)\n- **네이버 엔비디아 투자금:** 환전 물량 유입\n- **코스피:** 급락\n- **외국인 달러선물:** 순매도 전환\n\n### **국내 채권시장 전망 요약**\n국내 채권시장은 미국 중간선거 불확실성 속 국내 증시 부진과 국제유가 급락이 채권 강세를 이끈 것으로 보입니다. 물가 부담에 중단기물 강세는 비교적 제한되고 장기금리가 더 많이 내려 수익률 곡선이 평탄화되었지만, 외국인의 10년 국채선물 대규모 순매수가 장기물 강세를 뒷받침한다는 것이 이번 전일의 특징이라고 볼 수 있습니다. 다만 미래에는 미국 중간선거 결과와 함께 세계 경제 상황에도 많은 변수들이 있기 때문에 다음 세션이 매우 중요하다고 볼 수 있습니다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n---\n\n### [핵심 메카니즘 #1] 현대차/기아: 미국 내 점유율 12.0% 달성 → 12월 주주총회 지배구조 재편의 핵심 챙김\n\n**데이터**\n- 호반그룹: 10월 장내거래 통해 한진칼 지분 추가 매입 → 최다 출자자 변경 기업결합 신고\n- 조원태 회장: 12월 3일까지 한진칼 보통주 32만 5,000주 (370억원 규모) 추가 매입 예정\n\n→ 호반이 조 회장측 지분(20.57%)을 넘어섰다는 언론 보도로, 공정위에 기업결합 신고를 하였다. 동시에 조 회장 스스로도 12월 3일까지 32만 5,000주의 추가 매입 계획을 공시하였다. 이로써 한진칼 주주는 단일 최대주주 지위를 둘러싸고 12월 3일까지 호반과 조 회장 사이의 경쟁이 접점을 이루게 된다. \n\n이 시기에 대한항공 주주총회의 의결권 행사 권한이 집중되는 것을 고려할 때, 한진칼 지분 경쟁의 당사자는 대한항공의 지배구조 재편에도 직접적으로 관여할 수 있는 위치에 놓인다. 따라서 이 경쟁이 단순한 한진칼 내부 지배권 문제를 넘어, 대한항공 지배구조 재편과 깊숙하게 묶여 있어 향후 경로 선택에 많은 의미를 갖는다.\n\n---\n\n### [핵심 메카니즘 #2] 미국 자동차 판매 (-1% YoY): ICE→EV 이전 속도가 느려졌음에도 불구하고 현대차/기아의 미국 내 점유율은 +0.6p YoY 상승\n\n**데이터**\n- 미국 내 10월 자동차 판매: +3%\n- 누적 10개월 기준: -1%\n- ICE: -1%, EV: +9%, HEV: +20%\n\n→ 내연기관차는 -1%로 부진, EV는 +9%로 증가세 전환. HEV는 +20%로 ICE 대비 상회한 성장을 기록. ICE→HEV/EV로의 이전 속도는 느려졌음에도 불구하고 현대차/기아의 미국 내 점유율은 +0.6p YoY 상승하며 12.0% 기록. 10월 누적 기준으로 현대차/기아는 12.0%로 상승한 것은 10월 누적 기준으로 10월 한 달만으로 +0.6p의 상승을 기록한 것이다.\n\n현대차/기아는 10월에만도 4% (+4% YoY), 기아는 16% (+16% YoY)의 성장을 기록. 내연기관차/HEV/PHEV/BEV/FCEV 모두 상승, 그 중 기아 스포티지 PHEV가 주도적인 성장 요인으로 작용하였다. 현대차/기아의 합산 HEV 및 BEV 판매는 10월에 각각 +17%, +92%의 뛰어난 성장을 기록하며 시장 전체의 ICE→HEV/EV 이전 속도가 느려졌음에도 불구하고, 오히려 현대차/기아의 내연기관차·HEV·PHEV·FCEV·BEV의 판매 비중이 높아지면서 점유율 상승이 발생한 것이다.\n\n10월 누적 기준으로는 10월 한 달만으로도 미국 내 한·일·미 세 나라의 판매 비중이 각각 12.0%, 12.2%, 41.3%로 나타났는데, 이는 현대차/기아가 0.6p YoY의 상승을 기록했던 것과 별개로 10월 한 달에 한·일·미 세 국가의 판매 비중이 10월 누적 기준으로 12.0%, 12.2%, 41.3%로 나타났음을 보여 준다.\n\n이는 미국 내 수요 구조가 ICE→HEV/EV 이전이 지속되고 있고, 이전 속도가 느려진 상태에서도 현대차/기아의 점유율은 상승한 것을 의미한다. 한편, 미국 내 한·일·미 세 국가의 판매 비중은 10월 누적 기준으로 12.0%, 12.2%, 41.3%로 나타났는데, 이는 현대차/기아가 미국 내에서의 점유율이 한·일·미 세 국가의 판매 비중을 상회하고 있음을 나타낸다.\n\n---\n\n### [핵심 메카니즘 #3] ESS 수요와 공급: 내년 수요는 선결된 형태로 확정, 2026년 10월 기준 수요는 2026년 상반기 수요가 2026년 하반기보다 더 많이 확정됨\n\n**데이터**\n- 2026년 상반기 글로벌 ESS 셀 출하량: 461GWh (+71%, YoY)\n- 북미: 76GWh (+83%, YoY); 2026년 상반기 글로벌 ESS 셀 출하량은 461Gwh (+71%, YoY)로 증가, 북미는 76GWh (+83%, YoY)로 증가\n- 2027년 북미 ESS 생산능력: LG에너지솔루션 70GWh 이상, 삼성SDI 32GWh, SK온 10GWh; 3사 합산 110GWh 이상\n- 2027년 말 북미 ESS 생산능력 110GWh 기준 연평균 생산능력 91GWh, 가동률 90% → 연간 생산량 82GWh\n- LFP (GWh당 2,500ton) 필요량 20만 ton: 엘앤에프 6만 ton, 포스코퓨처엠 10.5만 ton → 2027년 말 16.5만 ton, 2027년 필요량 20만 ton\n\n→ 2026년 10월 기준, 2026년 상반기 글로벌 ESS 셀 출하량은 461GWh (+71%, YoY)로 증가, 북미는 76GWh (+83%, YoY)로 증가. 2027년 말 북미 ESS 생산능력은 LG에너지솔루션 70GWh 이상, 삼성SDI 32GWh, SK온 10GWh로 3사 합산 110GWh 이상이다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### AI 자금조달 우려, 하이퍼스케일러의 재무 부담: 동시에 불꽃 붙는 두 가지 문제\n\n앤트로픽(S-1 수정판)의 연간 매출 1700억 달러(전년 대비 12배), AI 인프라 지출약정 8950억 달러라는 두 수치가 동시에 나왔다. 동시에 메타는 200억 달러 규모의 회사채 발행을 검토하고 있으며, 알파벳은 유럽 채권시장에서 60억 유로 회사채를 추진 중이다. 오라클은 100억 달러짜리 보통주+회사채 발행 계획을 공표했다. DS투자증권이 따집니다:\n\n> \"**Anthropic Direct는 이러한 변화가 한 단계 더 나아가 AI 모델사가 직접 AI가속기를 조달하며 인프라 투자 주체로 등장한 사례다.\"**\n\n즉, 메타-알파벳-오라클이 일반적인 AI 모델사들보다 앞서 있다. 이미 200억 달러 규모의 회사채를 발행한다는 것은, 단순한 \"추가 자금 확보\" 개념을 넘어 \"투자 주체로서의 자산 운용\"이라는 행태로 진화했다는 것이다.\n\n메타의 경우 200억 달러는 구독제로 화폐화된 디지털 광고 플랫폼의 운영자금이기도 하지만, 아마존-글루온-엔비디아와 공동으로 찍을 파워칩 생산에 필요한 예산일 수도 있다(Gluon은 메타의 AI칩 설계업체).\n\n한편, 알파벳이 유럽 채권시장에서 60억 유로 규모를 준비 중인데, 유럽은 글로벌 AI 투자의 가장 큰 실험 공간 중 하나다(EU AI Act 초안 당시 EU 국가들은 AI 투자에 대해 매우 적극적). 유럽 내 채권발행이라는 선택지는, 미국내 채권시장보다 글로벌 시장 접근성이 좋은 것을 반영한다고 보면 된다.\n\n_DS투자증권_은 특히 중요한 점을 덧붙였다: \"**향후 Anthropic, OpenAI는 상장을 계기로 컴퓨팅 인프라를 직접 조달을 확대하는 한편, 하이퍼스케일러는 ASIC 판매와 자금 지원을 통해 직접적인 CapEx 부담을 줄이면서도 AI 인프라 확장에 참여하는 구조로 변화할 전망이다.\"_\n\n즉, AI 모델사들이 인프라 투자 주체로 부상함으로써, 하이퍼스케일러们的 AI 인프라 투자 책임에서 해방될 전망이다. 이는 단기적으로 메타-알파벳-오라클의 AI 관련 캐쉬플로우 부담이 줄어든다는 의미다.\n\n---\n\n### 메타데이터: 하이퍼스케일러의 AI 수익화 경로 확대\n\nGoogle Cloud 매출은 3Q26에 103% YoY 성장했다. 이는 AI 서비스의 뛰어난 고객 유치 능력을 보여주는 동시에, Google이 2010년대초에 만들어놓았던 대규모 인프라가 AI 서비스로 전환됨으로써, 수익화 가능한 용량이 존재한다는 사실을 증명한다. \n\nAmazon과 Alphabet은 FCF 적자를 기록했다. Alphabet의 FCF는 500억 달러 정도이며, Amazon은 100억 달러 규모다(FCA 적자). 이는 FCF가 AI 관련 인프라 투자에 사용되었음을 시사한다.\n\n_DS투자증권_은 \"**ASIC을 통해 동일한 CapEx와 전력으로 더 많은 컴퓨팅 수요에 대응하며 효율을 높이고 있다.**\"고 분석했다. 그리고 \"**Google TPU에 이어 Amazon도 Trainium 외부 판매를 추진하면서, 기존 DC 구축 및 컴퓨팅 임대 방식에 더해 CapEx 부담을 완화하면서 매출 확대할 수 있는 새로운 수익화 경로를 추가했다.\"**라고 설명했다.\n\n즉, Google은 TPU, Amazon은 Trainium을 기존 Data Center의 제품으로 만들었던 것을 이제 외부에 판매할 예정이다. 이는 AWS 또는 Compute Engine의 고객들에게도 제공하는 방식이다. 따라서 두 회사의 CapEx 부담은 외부로 이전되었다.\n\n이제 AI 모델사 입장에서 문제가 되는 것은, 이들의 CapEx를 어디서 조달할 것인지다. _DS투자증권_은 다음과 같이 정리합니다:\n\n> \"**향후 Anthropic, OpenAI는 상장을 계기로 컴퓨팅 인프라를 직접 조달을 확대하는 한편, 하이퍼스케일러는 ASIC 판매와 자금 지원을 통해 직접적인 CapEx 부담을 줄이면서도 AI 인프라 확장에 참여하는 구조로 변화할 전망이다.\"**\n\n---\n\n### Anthropic의 CapEx, IPO, 그리고 투자등급 확보\n\n_DS투자증권_은 Anthropic의 1H26 OCF 39억 달러를 크게 웃도는 1,108억 달러의 외부 자금 조달을 들고, \"미개시 리스 약정이 3,214억 달러로 급증\"했다고 한다. 즉, Anthropic은 자사가 아직 실행하지 않았는데도, 앞으로 지급해야 하는 리스비용이 3,214억 달러에 달한다.\n\n이는 두 가지 의미를 갖는다:\n\n1. Anthropic이 현재의 자금조달 기반이 취약함을 시사한다(OFC 39억 달러에 비해 외부 자금 1,108억 달러).\n2. 이 미개시 리스 약정 3,214억 달러는 Anthropic이 앞으로 얼마나 많은 인프라를 구축할지를 알려주는 지표다. 즉, Anthropic의 인프라 투자 부담이 얼마나 큼지를 보여주는 지표다.\n\n_DS투자증권_은 \"**Antrhopic은 IPO와 투자등급 확보를 추진하며 주식, 신용시장으로 자금조달 기반을 확대하고 있다.\"**고 설명했다. 따라서 Anthropic이 주식시장을 통해 자금을 조달한다는 것은, 단순히 자금을 모으는 행위를 넘어서, **자사의 CapEx를 지속적으로 수행할 수 있는 자금 기반을 마련**하는 목적이 포함돼 있다고 볼 수 있다.\n\n---\n\n### 오라클, 메타, 알파벳의 회사채 발행: 금융시장의 위치\n\n#### 오라클\n오라클의 보통주와 회사채 발행 계획: 각각 100억 달러 규모다. 즉, 총 200억 달러를 자금조달하겠다는 것이다. 회사채는 기존 주주의 권리를 희생시키지 않고 자금을 조달할 수 있는 방법이다. 오라클은 AI 인프라 투자를 위해 이 자금을 사용한다. 오라클은 Oracle Cloud Infrastructure (OCI)를 운영하는데, OCI는 Azure와 AWS를 뛰어넘겠다고 주장하는 클라우드 인프라다. 따라서 오라클의 회사채 발행은 OCI 확장에 관한 것이다.\n\n#### 메타\n메타는 달러 및 유로화 표시 회사채 200억 달러 발행을 검토 중이라 한다. 회사채 발행을 검토 중인 상태다. 메타는 Facebook, Instagram, WhatsApp 등을 운영하는 글로벌 소셜 미디어 기업이다. 메타의 회사채 발행 목적은, 아마도 Metaverse(메타버스) 관련 인프라 투자에 관한 것이다(Meta Reality Labs 등).\n\n#### 알파벳\n알파벳은 유럽 채권시장에서 60억 유로 회사채를 추진 중이다. 알파벳은 Google을 운영하는 글로벌 IT 기업이다. 알파벳은 YouTube, Android, Chrome OS, Gmail 등을 운영한다. 알파벳이 유럽 채권시장에서 유로화를 사용하여 회사채를 발행하는 것은, 유럽 내 AI 투자에 대한 자신감을 표현하는 것이며, 유럽 내 자금 조달을 더욱 쉽게 할 수 있도록 함을 목적으로 하고 있다.\n\n---\n\n### 메타데이터: 미국 주요 AI 관련기업들의 2026년 Q3 실적\n\n#### 마이크론 & 샌디스크\n미국 증시에서 마이크론(-5.8%), 샌디스크(-7.9%) 등의 주가가 급락했다. 이는 AI 관련 기업들의 부품 공급자들의 어려움을 보여주는 현상이다.\n\n#### 인텔\n인텔의 주가가 -7.5% 급락했다. 인텔은 CPU와 GPU를 생산하는 반도체 기업이다. AI 서빙에 필요한 인프라로 인해, 인텔은 CPU와 GPU의 수요가 높아졌다. 그러나 인텔의 주가가 급락했다는 것은, 인텔의 제품이 AI 서빙에 요구되는 인프라에 부적합하거나, 인텔의 제품이 다른 회사들보다 AI 서빙에 적합하지 않다는 것을 시장이 인식했다는 의미이다.\n\n#### 오라클\n오라클의 주가가 -8.8% 급락했다. 오라클은 Database Software를 운영하는 기업이다. 오라클이 AI 인프라 투자에 200억 달러를 투자할 것이라고 발표했음에도 불구하고, 주가가 급락했다. 이는 오라클의 AI 인프라 투자가, 투자 효과가 없는 것으로 시장이 받아들였다는 의미이다.\n\n---\n\n### 오라클, 메타, 알파벳의 회사채 발행: AI 인프라 확장의 자금 조달 경로\n\n오라클, 메타, 알파벳이 회사채 발행을 준비하고 있고, Anthropic은 IPO를 준비하고 있다. 이는 AI 인프라 확장에 있어 자금 조달 경로가 점점 더 많아지고 있다는 것을 의미한다.\n"}, {"title": "기업 공시 검증 (DART)", "md": "## 기업 공시 검증 (DART)\n\n> **아래는 위 투자전략·섹터 리포트에서 비중 있게 다뤄진 기업을 DART 전자공시로 대조한 것입니다. 증권사 주장과 실제 공시·재무제표가 일치하는지만 확인하며, 투자 판단을 제시하지 않습니다.**\n\n---\n\n### SK하이닉스 (000660)\n\n**공시:** 10/28 잠정실적(연결)·자기주식취득결정·배당결정 공시 확인. 주주환원 집행을 뒷받침하는 공시 흐름.\n\n**재무(2026 반기 누적):** 매출 79.3조원, 영업이익 60.5조원(영업이익률 76.3%) — 리포트가 주장한 고수익 구조는 반기 수치로 확인.\n\n**추세:** 쌓인 기간 1건, 비교 불가.\n\n**공시 대조:** 주주환원(자사주 취득·배당) 실행 공시 확인. 리포트가 주장한 \"27년 주주환원수익률 14%\"는 미래 추정치로 공시로 검증 불가. 주가 57% 하락 수치는 공시 범위 밖.\n\n---\n\n### 삼성전자 (005930)\n\n**공시:** 10/29 잠정실적·기재정정·배당결정·자기주식처분결정, 11/4 자기주식처분결과 확인.\n\n**재무(2026 반기 누적):** 매출 171.5조원, 영업이익 89.5조원. 2025 연간 영업이익(43.6조원) 대비 반기만에 2배 이상 초과 — 급격한 실적 개선 추세 확인.\n\n**추세(2025→2026):** 연간 43.6조 → 반기 89.5조. 리포트가 전제한 메모리 초호황 구조와 부합.\n\n**공시 대조:** 자기주식처분 공시가 11/4에도 나와 주주환원이 진행 중임을 확인. 리포트 주장(\"15% 주주환원수익률\")은 미래 추정, 공시로 검증 불가.\n\n---\n\n### SK텔레콤 (017670)\n\n**공시:** **11/4(기준일 당일) 연결 잠정실적 공시 발표** — 리포트가 \"오늘 발표 예정\"이라고 한 실적이 실제로 공시됨.\n\n**재무(2026 반기 누적):** 매출 4.36조원, 영업이익 5,660억원(영업이익률 13.0%).\n\n**추세:** 쌓인 기간 1건, 비교 불가.\n\n**공시 대조:** 리포트 예상(3Q26 단독 영업이익 5,340억원, +1,002.1% YoY)은 당일 공시된 잠정실적이 DB에 아직 미반영돼 직접 수치 대조 불가. +1,002.1% YoY는 전년 3Q에 일회성 대규모 손실이 있었음을 시사하며, 반기 데이터만으로는 YoY 검증 불가.\n\n---\n\n### 대한항공 (003490)\n\n**공시:** 10/15 영업잠정실적 공시 확인. 11/4 특수관계인으로부터 자산양수 공시 — 한진칼 지분 관련 거래일 가능성 있으나 세부 내용은 공시 원문 확인 필요. 10/30 타법인주식취득 기재정정 공시.\n\n**재무(2026 반기):** 대차대조표(자산 52.8조, 자본 10.8조)만 조회됨, 영업이익·매출 데이터 미집계 — 직접 수치 대조 불가.\n\n**공시 대조:** 리포트가 근거로 든 \"견조한 여객 수요·화물 강세·환율 하락\"은 공시 수치로 현 시점에 검증 불가. BUY 35,000원 목표가는 애널리스트 추정으로 공시 범위 밖.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n매크로 분야에서는 서비스물가와 개인서비스물가가 근원 물가 상승을 주도하며 2% 목표선을 초과한 것으로 나타나, 한국은행의 추가 금리 인상 논리가 강화되고 있다. 서비스물가 전월비가 0.4% 상승한 점이 중요하며, 이 수준이 지속되면 12월까지 0.8% 누적 상승이 가능하다. 채권시장에서는 증시 하락과 국제유가 급락에 따른 안전자산 선호로 장기물 강세가 나타났으며, 외국인의 10년 국채선물 대규모 순매수가 강세를 뒷받침했다. 산업섹터에서는 현대차/기아의 미국 내 점유율이 12.0%로 상승하며, HEV 및 BEV 판매 증가가 주도적이었고, ESS 수요는 2026년 상반기부터 확정된 수준이며, 2027년 북미 ESS 생산능력은 110GWh 이상으로 확대되고 있다."}]}</script>
