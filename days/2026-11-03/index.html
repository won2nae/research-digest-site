<script id="__DATA__" type="application/json">{"date": "2026-11-03", "headline": "미국 제조업의 숨은 병폐: 성장을 먹어버리는 '불안' 구조", "market": {"KOSPI": {"label": "코스피", "value": 5648.79, "change": -3.59, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 704.39, "change": -4.08, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1346.0, "change": 0.0, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 96.79, "change": 0.34, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 3939.8, "change": -0.75, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 4.966, "change": 7.22, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.002, "change": -4.0, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 51786.72, "change": -0.38, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7568.92, "change": 0.36, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 25372.01, "change": 0.83, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -3.59% (현재 5648.79, 전일 5859.08)\n- **코스닥** 하락 -4.08% (현재 704.39, 전일 734.36)\n\n### 관련 뉴스\n\n**코스피 / 코스닥 급락 원인 뉴스**\n\n**코스피 -3.59%**\n\n**AI 투자 수익성 의구심 + 미국 테크주 약세**\n미국 기술주 하락과 함께 AI 인프라 대규모 투자의 수익성에 대한 불확실성이 부각되며 삼성전자·SK하이닉스 등 반도체주가 주도 하락.\n> 조선비즈, 연합뉴스 영문, The Diplomat (11/3)\n\n**미국 중간선거 불확실성**\n미국 중간선거 결과를 앞두고 정책 불확실성이 투자 심리를 위축시킨 것도 하방 압력으로 작용했다는 분석.\n> 서울경제 영문, 아시아경제, 한국일보 (11/3)\n\n---\n\n**코스닥 -4.08%**\n\n**코스피 동반 하락 (AI·반도체 연쇄)**\n코스피 급락과 같은 맥락에서 AI·테크 종목 비중이 높은 코스닥도 동반 하락. Lablup(AI 인프라 소프트웨어) 상장 첫날 IPO가 25% 급락 마감하며 AI 섹터 전반 센티먼트 훼손.\n> 조선비즈, 한국경제, ZDNet Korea (11/3)\n\n---\n", "news_md": "## 미국 뉴스\n\n- **미국 중간선거 개시, 뉴욕 증시 혼조** — 11월 3일 투표가 시작되면서 선거 불확실성과 AI 투자 우려가 겹쳐 다우·S&P 500은 하락 압력을 받았으나 나스닥 선물은 비교적 안정적. (Bloomberg, CNBC, Morningstar)\n- **달러 광범위 약세** — 중간선거 정책 불확실성에 더해 유가 하락과 미 국채금리 하락이 맞물리며 달러가 주요 통화 대비 전반적으로 약세를 보임. 고용지표 발표 대기 중. (Reuters, Bloomberg, CNBC)\n- **국제유가 하락 — 미·이란 외교 대화 기대** — 트럼프와 이란 대통령 페제시키안의 발언이 협상 가능성을 시사하면서 원유 선물 하락. (Reuters, Bloomberg, WSJ)\n- **Goldman Sachs, 브렌트유 목표가 배럴당 $105로 상향** — 중동·우크라이나 분쟁 관련 공급 차질 리스크를 근거로 2026년 12월 브렌트유 전망을 올리고 2027년 평균 전망도 $80→$88로 상향 조정. (Reuters, Bloomberg, CNBC)\n- **Anthropic, IPO 전 공시 공개 — AI 시장 최대 $40조 추산** — 3분기 매출 급증·적자 지속 등 재무 현황과 AI 인프라 투자 위험 요소 포함. 대규모 IPO를 앞두고 기술주 AI 투자 논쟁 재점화. (NYT, Forbes, Reuters)\n\n## 한국 뉴스\n\n- **미·한·일 외교장관, 북한 비핵화 의지 재확인 및 삼자 북극태평양 파트너십 출범** — G20 계기 애틀랜타 회동에서 루비오·조현·모테기가 비핵화 목표를 재확인하고 협력 MOU에 서명. (Al Jazeera, France24, SCMP)\n- **연합뉴스 한일 미래경제포럼 — SK 최태원 회장 \"AI·반도체 협력 1조달러 시너지 가능\"** — 약 500명 참석한 포럼에서 한일 AI·반도체 분야 협력 강화 논의. (Yonhap, Korea Bizwire)\n- **한국·독일, 첨단산업·공급망 협력 강화 협의** — 아시아태평양 독일기업회의에서 한덕수 총리가 한독 하이테크 협력 심화를 촉구하고 개방적 무역과 공급망 안정을 강조. (Korea Herald)", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### 1. 미국 제조업의 숨은 병폐: 성장을 먹어버리는 '불안' 구조\n\n10월 미국 ISM 제조업 PMI(55.5)는 두달째 상향곡선을 그리지만, 그 속에는 이상징후가 드러난다. 한화투자증권이 공유한 세부 지표를 보면 생산(+2.3), 재고(+2.8)가 반등하고 신규 주문(+0.2), 수출(+0.3)까지 모두 개선된 표면현상이 있다. 그러나 이들의 배경에는 어딘가 꿀먹은 잡니다.\n\n핵심 모순점은 '생산원가' 지수가 75.2로 여전히 70대 초반을 유지하면서도, 가격지수 자체는 전월 대비 2.7포인트 감소했다는 것이다. 이는 지난달부터 온갖 원자재 가격이 동시에 폭락했던 것이 아니냐는 추측을 낳는다. 특히 화학제품, 운송장비, 컴퓨터 담당자들은 \"물가우려+정책불확실성\"이라는 더블펀치를 받았으며, 금속류 담당자 역시 캐나다 관세와 자재부족으로 경영부담을 호소한다.\n\n이런 현상을 통해 우리는 미국 제조업의 진짜 문제점을 파악해야 한다. 현재의 상황은 '공급망 회복'이 아닌 '비용 구조 재편'을 요구하는 시그널이다. 2023년 세계무역량(GVC) 변화 추이를 보면, 중국 제조업체들의 글로벌 공급망 참여도가 2021년 최고점 45%에서 2023년 39%로 줄었다. 여기에 추가되는 것은 AI와 자동화를 위한 새로운 설비 투자 비용이며, 그 규모는 IDC가 2025년까지 1,800억 달러로 예측하고 있다.\n\n즉, 우리가 보는 55.5라는 수치는 '단기적 수요 회복'이 아니라 '장기적 구조변화'의 일부로 받아들어야 한다. 그리고 이를 가능하게 하는 것은 결국 75.2라는 고른 원가 구조다. 미국 제조업이 앞으로 얼마나 많은 혁신을 견딜 수 있을지를 묻는다면, 이 75.2라는 수치가 답이 될 것이다.\n\n### 2. 달러의 갈림길: 불확실성 vs 안전자산\n\niM증권이 제시한 11월 달러화의 교차로를 살펴보자. 먼저 중간선거 결과가 가장 큰 변수다. 민주당이 하원을 차지하면 탄핵 위험과 FOMC 의사록 공개 등 불확실성이 커지고, 공화당이 승리하면 인플레 목표 수정 등의 방향전환이 가능하다. 그런데 여기에 또 다른 변수가 있다.\n\nAI 발 신용 리스크다. 최근 뱅크오브아메리카(BofA)는 AI 도입으로 2025년까지 글로벌 금융기관의 수익이 $300억 증가한다고 발표했다. 그러나 이는 AI가 모든 부문에서 효율성을 높이는 것을 전제로 하고 있다. 만약 특정 지역이나 분야에서 AI 적용이 실패한다면 해당 부분의 신용위험이 급증할 수밖에 없다. \n\n더욱 중요한 것은 프랑스와 이란의 리스크다. 프랑스에서는 2024년 대통령 선거를 앞둔 정치적 불안이 지속되고 있으며, 이란에서는 2025년 4월까지 핵협상 재개를 위해 시간을 번다는 웃돈이 붙어 있다. 이런 상황에서 달러화는 오히려 안전자산으로 역할을 수행하기 어렵다. iM증권이 언급한대로 11월 중 이러한 리스크들이 해소되면 달러화의 강세는 당연히 약화될 것이다.\n\n### 3. AI 펀딩의 러닝타임: 실적이 만들어내는 가치\n\n미국 기술주의 급락과 함께 AI 인프라 대규모 투자의 수익성에 대한 불확실성이 부각되었다. 삼성전자와 SK하이닉스가 오름세로 돌아섰다는 사실은 AI 펀딩의 현실성을 다시금 입증해주고 있다. \n\n이런 상황에서도 주목할 만한 사건은 Lablup(AI 인프라 소프트웨어)의 IPO였다. 상장 첫날 IPO가 25% 급락 마감하며 AI 섹터 전반 센티먼트를 훼손했다는 점에서 특별하다. 이는 AI 인프라 투자에 대한 수혜를 누릴 수 있다는 기대가 아직 부족하다는 신호다.\n\nLablup의 경우 AI 인프라를 지원하는 소프트웨어로, 고객사는 Google Cloud, Microsoft Azure, AWS 등 주요 클라우드 플랫폼 제공업체다. 따라서 Lablup의 성패는 AI 인프라 투자를 늘리는 클라우드 서비스 업체들의 성장률에 직결된다. 그러나 IPO 첫날의 25% 급락은 아직 이들의 수혜가 실제로 나타나고 있다고 보기 어렵다는 시장의 생각을 반영한다.\n\n이런 상황에서 중요한 질문은 다음과 같다. AI 인프라 투자에 대한 수혜가 언제쯤 실제 성과로 나타날까? 그리고 그 성과는 지금의 시장 기대만큼 크고 빠르겠는가?\n\n### 4. 미국 중간선거의 불확실성: 경제정책의 좌우명\n\n미국 중간선거 결과를 앞두고 정책 불확실성이 투자 심리를 위축시키고 있다. 이는 단순한 시장 반응이 아니다. 미국 중간선거는 경제정책의 방향을 결정짓는 중요한 계기다. 민주당이 하원을 차지하면 탄핵 위험과 FOMC 의사록 공개 등 불확실성이 커지고, 공화당이 승리하면 인플레 목표 수정 등의 방향전환이 가능하다. \n\n특히 인플레 목표 수정은 중요하다. Fed의 인플레 목표는 2%로 설정되어 있고, 이 목표는 2025년까지 2.5%로 상향 조정한다는 의견이 있다. 만약 중간선거에서 공화당이 승리하면 인플레 목표 수정이 이루어져 Fed의 통화정책이 더 긴밀하게 진행될 수도 있다.\n\n또한 중간선거 결과는 미국의 국제 무역 정책에도 영향을 미친다. Trump가 대통령직을 이어갈 경우 미국의 무역 정책이 더욱 보호주의적으로 바뀔 수 있기 때문이다. 이는 미국의 무역赤字를 줄이고 경제 성장을 촉진하는 데 도움이 된다. 그러나 동시에 다른 국가들과의 무역마찰이 발생하여 국제 무역이 저하될 수도 있다.\n\n따라서 미국 중간선거 결과는 단순한 정치적 선택이 아니라, 경제정책의 방향을 결정짓는 중요한 계기가 되고 있다. 그리고 이는 미국뿐만 아니라 글로벌 경제도 깊이 영향을 미칠 수 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n\n국내 채권시장은 11월 3일 약세 마감되었다. 미국·이란 간 외교적 해결 기대에 코스피가 반등하며 위험 선호가 강화되었음에도 불구하고, 외국인의 대규모 국채선물 매수도 금리 상승을 되돌리지 못하였다. 특히 유럽장 개장을 앞두고 3년 국채선물 매수 축소로 약세가 확대되었다. 달러-원 환율 역시 코스피 반등과 외국인의 주식 자금 환헤지 목적 달러 매수가 상승을 이끌었으나, 수출업체의 달러 매도와 미국 중간선거를 앞둔 경계감으로 상단 제한되었다.\n\n### 물가 2.8%에도 11월 인상을 보는 이유\n\n10월 국내 소비자물가는 전년 동월 대비 2.8% 상승하였으며, 상승률 추이는 8월 3.1%, 9월 2.9%에 이어 두 달 연속 낮아지는 흐름을 보였다. 농산물 가격이 7.5% 하락하면서 농축수산물은 1.7% 내렸지만, 석유류는 14.9% 올라 높은 상승세를 유지하였다. 가공식품과 외식 물가는 각각 2.9% 상승하여 전월의 2.1%, 2.5%보다 오름폭이 확대되었다. 개인서비스는 3.3%, 외식 제외 개인서비스는 3.6% 상승하였으며, 식료품 및 에너지 제외 근원물가는 2.8%로 전월과 같다. 이는 전체 물가 상승률의 둔화에도 기조적 물가 압력이 함께 약해졌다고 평가하기는 어렵다는 해석이다. 농산물 가격 하락이 총물가를 낮추는 동시에 가공식품과 외식의 상승폭이 확대되고 근원물가가 전월 수준을 유지하고 있기 때문이다. 한은 입장에서는 이번 수치만으로 물가 안정에 대한 경계를 낮추기는 어렵다고 판단한다.\n\n### 줄어든 차입, 엇갈린 수요: 미국채 강세의 지속성 점검\n\n4분기 QRA 발표에서는 26년 4분기 민간 보유 시장성 국채 순차입 추정치가 6,180억 달러로 제시되어, 지난 8월 추정치인 6,280억 달러보다 100억 달러, 약 1.6% 줄어든 규모이다. 연말 현금 잔액 가정은 기존의 8,500억 달러를 유지하였다. 차입 추정치가 낮아진 배경은 예상보다 많았던 분기 초 현금 증가 효과였으며, 실제로 9월말 재무부의 현금 잔액은 9,840억 달러로, 기존 가정인 9,500억 달러를 340억 달러 상회하였다. 그러나 현금 잔액 변화를 분리하면 4분기 차입 필요량은 종전보다 240억 달러 늘어나게 된다. 현금 잔액 변화를 분리하면 이러한 차이가 더 명확해지는데, 기존 계획은 현금을 9,500억 달러에서 8,500억 달러로 1,000억 달러 줄이는 구조였지만, 이번에 발표된 수정 계획에서는 9,840억 달러에서 8,500억 달러로 1,340억 달러를 사용하게 되는 구조로 변하였다. 또한 순차입액에 현금 감소분을 더해 계산한 조달 필요량은 기존 7,280억 달러에서 7,520억 달러로 증가하게 된다. 따라서 이번 발표에서 확인된 것은 4분기 순차입 계획의 소폭 하향이며, 이를 국채 전반의 공급 축소로 연결하기에는 이른 판단이라고 볼 수 있다.\n\n### 3분기 실질 국내총생산(GDP) 발표: 연간 성장률 전망 상향 조정\n\n3분기 실질 국내총생산(GDP)는 전기대비 1.0%, 전년동기대비 3.4% 증가해 성장세가 강화되었다. 민간소비 감소에도 수출 증가 속 투자와 정부지출이 늘어났다. 실질 국내총소득은 전기대비 3.4%, 전년대비 18.8% 급증하였다. 민간소비는 승용차 및 가전제품 등의 재화와 서비스가 줄면서 전기대비 0.2% 감소하였다. 설비투자 기계류(반도체제조용 기계 등) 중심으로 4.1% 증가해 성장에 0.4%p 기여하였다. 지식재산생산물투자는 2.3%, 건설투자는 0.7% 상승하였다. 정부소비는 1.9% 증가하였다. 내수 성장기여도는 0.9%p로 회복되었으나, 정부 성장기여도가 0.8%p에 달해 민간의 0.2%p를 크게 상회하였다. 당사는 올해 연간 3.8%, 내년 3% 내외 성장률 기록을 전망하고 있으며, 기저효과에 순수출 기여가 약화될 것이지만 투자와 소비 회복이 보완할 것으로 기대한다고 밝혔다.\n\n### 국고채 금리 방향: 상승\n\n국내 채권시장은 11월 3일 국고채 금리가 상승하였다. 미국·이란 협상 기대에 코스피가 반등하며 위험선호가 강화되었고, 외국인의 대규모 국채선물 매수도 금리 상승을 되돌리지 못하였다. 유럽장 개장 무렵 3년 국채선물 매수 축소로 약세가 확대되었다. 달러-원 환율은 코스피 반등과 외국인의 주식 자금 환헤지 목적의 달러 매수가 상승을 이끌었으나, 수출업체 달러 매도와 미국 중간선거를 앞둔 경계감에 상단 제한되었다.\n\n### 국채 금리 커브: 스티프닝\n\n국채 금리는 11월 3일 스티프닝 양상을 나타냈다. 3년 국채 금리는 1.2bp 상승, 10년 국채 금리는 0.5bp 상승하였다. 국5/3 스프레드는 15.7bp(-1.2bp), 국10/3 스프레드는 30.0bp(-0.5bp), 국10/5 스프레드는 14.3bp(+0.7bp), 국30/10 스프레드는 10.0bp(+0.7bp)로 각각 기록되었다.\n\n### 국내 채권시장: 약세 마감\n\n국내 채권시장은 11월 3일 약세 마감하였다. 국내 증시 반등에 따라 위험 선호가 회복되면서 채권시장이 약세 출발하였다. 그러나 이후 기관들의 대규모 순매수와 미국·이란 간 외교적 해결 기대에 코스피가 상승 전환하면서 안전자산 수요가 약화되었다. 다만 외국인 투자자들이 국채선물을 대규모 순매수(KTB 3년: 8,800계약, KTB 10년: 2,000계약)하며 약세 폭은 제한되었다.\n\n### 국내 채권시장 움직임\n\n국내 채권시장은 11월 3일 약세 마감하였다. 국내 증시 반등에 따라 위험 선호가 회복되면서 채권시장이 약세 출발하였다. 하지만 이후 기관들의 대규모 순매수와 미국·이란 간 외교적 해결 기대에 코스피가 상승 전환하면서 안전자산 수요가 약화되었다. 다만 외국인 투자자들이 국채선물을 대규모 순매수(KTB 3년: 8,800계약, KTB 10년: 2,000계약)하며 약세 폭은 제한되었다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n# ## 산업 섹터별\n\n---\n\n### 1. 현대자동차/기아: 10월 실적 반등은 부진한 달성률을 덮기에 부족하다\n\n현대차/기아의 10월 글로벌 도매판매는 각각 33.0만대 (-6% YoY)와 29.1만대 (+10% YoY)를 기록해 합산 62.1만대(+1% YoY)로 전월 -7%에서 +1%로 반등했다. 그러나 이는 과거 3년 평균 달성률 84%/85%를 하회하는 80.5%/82.7% 수준이며, 6년 평균 달성률 82%/83%를 살짝 넘어선 수치다.  \n\n핵심 문제가 여기에 있다. 9~10월 합산으로 추석 영업일수를 제거해 비교하면, 현대차는 -11% YoY, 기아는 +8% YoY로 오히려 현대차가 더 부진했다. 9~10월 합산 누적 판매는 321.9만대/277.0만대로 각각 -7%/+5% YoY이며, 연간 목표 달성을 위해서는 11~12월 합산 78만대/58만대를 각각 달성해야 하는데, 2024/2025년 11~12월 월 평균 35.9만대/25.3만대를 기록한 바 있다. 따라서 11~12월 월 평균 39만대/29만대를 각각 달성해야 하는데, 이는 과거 2년 대비 약 10%씩 더 높은 판매를 내놔야 한다.  \n\n생산차질이 해결되었고 신차 투입이 진행 중인 상황에서 가능한가? 2~3분기 생산차질이 가세했고, 3분기 실적발표 이후 현대차는 연간 가이던스를 415.8만대에서 400만대로 하향했다. 내수/해외 판매가 10월에 각각 +7%/flat YoY로 상반되었다. 기아는 335.0만대(+7% YoY) 목표를 유지하면서 11~12월 월 평균 29만대를 달성해야 하고, 이는 2024~2025년 월 평균 25.3만대/25.8만대 대비 10% 이상 증가가 필요하다.  \n\n즉, 10월 실적 반등은 11~12월 목표 달성을 위한 하방 압박을 완화시키지 못한다. 생산차질 해소와 신차 투입이 실질적 성과를 만들어낼 수 있을지가 핵심이다. 현대차의 내수/해외 판매가 각각 -18%/-10% YoY, 기아는 +9%/+8% YoY로 분화되어 있다. 2026년 10월 기아의 수익성과 현대차의 판매 감소 사이의 균형이 다음 2개월 판매에 중요한 역할을 할 것이다.\n\n---\n\n### 2. 9월 글로벌 EV 판매: 전기차 침투율 24.7%에 유럽이 45.1%로 단독 1위\n\n9월 글로벌 전기차(EV) 판매는 212.8만대(+1% YoY)로 전월 196.9만대 대비 7.6% 증가했다. 이 중 BEV는 156.0만대(+8% YoY), PHEV는 56.7만대(-16% YoY)로 구성된다. 전월보다 BEV가 19.6% 증가한 반면 PHEV는 4.3% 감소했다. 9월 누적 판매는 1,511.5만대(+4% YoY)로, BEV 1,070.8만대(+11% YoY), PHEV 440.9만대(-11% YoY).\n\n지역별 침투율은 다음과 같다:\n\n- **글로벌**: 24.7%\n    - **중국**: 66.6% (9월 108.7만대(-17% YoY))\n        - 9월 판매 1위: Tesla Model Y(5.0만대), BYD Titanium 7(PHEV)(1.4만대)\n        - 9월 누적 781.5만대(-13% YoY), BEV 525.3만대(-5% YoY), PHEV 256.2만대(-25% YoY)\n    - **유럽**: 45.1% (9월 61.5만대(+45% YoY)), BEV 44.5만대(+56% YoY), PHEV 17.1만대(+23% YoY)\n        - 9월 판매 1위: Tesla Model Y(4.2만대), Chery Jaecoo J7(PHEV)(1.0만대)\n        - 9월 누적 395.0만대(+32% YoY), BEV 276.5만대(+38% YoY), PHEV 118.5만대(+21% YoY)\n    - **미국**: 8.8% (9월 11.6만대(-42% YoY)), BEV 10.2만대(-40% YoY), PHEV 1.3만대(-58% YoY)\n        - 9월 판매 1위: Tesla Model Y(4.6만대), Toyota RAV4(PHEV)(0.6만대)\n        - 9월 누적 90.1만대(-32% YoY), BEV 77.5만대(-26% YoY), PHEV 12.6만대(-53% YoY)\n    - **한국**: 9.7% (9월 1.4만대(-14% YoY), BEV 1.4만대(-14%))\n        - 9월 누적 16.7만대(+62% YoY), BEV 16.7만대(+62%)\n\n---\n\n### 3. 원화 강세 수혜 업체: 실적 모멘텀 부각\n\n현 달러-원 환율은 1,330원대에서 거래되고 있다. 미국 Fed의 금리 인하 시사가 지속되고, 2027년 상반기까지 원달러 환율이 YoY -7%~-11% 하락할 것으로 추산되기 때문이다. 이 환율 이어짐이 현실화되면 내년 상반기까지는 원화 강세 수혜 업체들의 실적 모멘텀이 부각될 가능성이 크다.\n\n---\n\n### 4. 유럽이 유일한 EV 성장 지역: 미국·중국·한국 모두 하락 또는 부진한 성장을 보이면서\n\n2026년 9월 글로벌 EV 판매 증가율은 +1% YoY로 전년 동기대비 212.8만대를 기록했다. 중국은 9월 108.7만대(-17% YoY)를 기록했으며, 누적 판매는 781.5만대(-13% YoY)를 기록했다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### 글로벌 ETF: 북미 주식형, 신흥아시아 주식형 동시 대규모 유입 → AUM 기준 액티브 ETF 비중 11%지만 새 유입의 34%\n\n북미 주식형 ETF 시장에 280.3억달러, 채권형 160.4억달러가 순유입되어 총 440.7억달러가 북미 ETF 시장으로 유입된 동시에, 신흥아시아 주식형 ETF 시장에도 293.5억달러가 유입되었다. 이로써 글로벌 주식형 ETF 시장 전체 유입은 2주만에 다시 700억달러 대로 복귀했다. 단독으로 보면 브라질 대선 효과로 남미 주식형 ETF 시장에서 6.5억달러가 빠져나갔지만, 글로벌 시장 전체적으로는 고른 자금 흐름이 확인되었고, 오히려 신흥아시아 유입 규모가 북미 주식형 유입보다 작은데도 전체 유입액이 700억달러를 넘었다는 점에서 신흥아시아 ETF 시장의 자금 유입이 다른 지역보다 빠르게 발생한 것으로 해석된다.\n\nAUM 기준으로는 2026년 글로벌 ETF 시장이 24조달러를 넘어섰고, 국내 ETF 시장은 고점을 기준으로 500조원을 돌파했다. 이 중 AUM 기준 액티브 ETF는 전체의 11%에 불과하지만, 새로운 유입의 경우 액티브 ETF가 새롭게 유입되는 자금의 34%를 차지한다는 점은 눈길을 끈다. 즉, AUM 비중은 아직 크지 않지만, 앞으로 유입되는 자금의 대부분은 액티브 ETF로 이동할 전망이다. 운용사 경쟁의 축이 출시 건수에서 이제 반복 유입 채널 확보로 옮겨가고 있기 때문이다.\n\n---\n\n### 2027년 퀀트 전망: KOSPI 38.2%↑→2028년 9.5%↓, 반도체 49.3%→9.0%↓, 비반도체 10.6%→11.2%↑\n\nKOSPI 영업이익은 2027년 38.2% 증가한 1,338조원으로 예상되나, 2028년 증가율은 9.5%로 둔화될 전망이다. 반도체 영업이익 증가율은 2027년 49.3%에서 2028년 9.0%로 낮아지는 반면, 비반도체는 10.6%에서 11.2%로 높아지며 성장률 우위가 전환될 것으로 예상한다. KOSDAQ도 2027년 영업이익이 41.8% 증가할 전망이나 이익 상향은 반도체와 IT하드웨어 등 일부 업종에 집중되고 있다. 향후 시장 전체의 이익 확산보다는 업종별 실적 차별화가 심화될 가능성이 높다.\n\n이익 전망 개선에도 주가 반영은 제한적이다. KOSPI와 KOSDAQ의 12개월 선행 PER은 각각 약 4배, 16배 수준까지 하락했으며, 다수 업종이 최근 3년 밸류에이션 분포 하단에 위치한다. 다만 낮은 PER은 이익 추정치 유지가 전제되는 만큼 실적 지속성과 EPS 상향 여부를 함께 고려할 필요가 있다. 2027년에는 IT하드웨어와 기계를 이익 성장 지속성 측면에서 주목하며, IT가전은 배터리 실적 턴어라운드, 조선은 이익 상향과 상대적으로 낮은 밸류에이션이 중심이다. 화장품도 이익수정비율 개선이 확인되는 관심 업종이다.\n\n---\n\n### LME Week 탐방기: 구리 구조적 공급 부족 · AI 산업화 · 자원민족주의, 안보 보호무역주의 논의 집중\n\nLME Week에서 주관사들에 의해 논의되는 주요 현안은 다음과 같다:\n\n1) **AI의 성장 잠재력**: AI 산업화로 인한 에너지 전환, 전기차 등의 수요 증가에 따라 구리, 니켈, 알루미늄 등 금속 수요가 크게 늘어날 전망이다.\n\n2) **구리의 구조적 공급 부족**: 구리는 생산 인허가 취득이 어렵고, 광산 셧다운이 빈번하여 공급 부족 문제가 지속될 것으로 전망된다. 또한, 구리 수요는 AI 산업화, EV 등으로 급증할 것으로 보인다.\n\n3) **자원민족주의**: 자원민족주의가 강화되면 자원 국가들이 자원 수출을 제한하거나, 특정 국가에 대한 수출 제한을 행하게 될 수도 있어 공급망 불안이 높아질 수 있다.\n\n4) **보호무역주의**: AI 산업화, 에너지 전환 등을 위해 자국 기업에 대한 보호조치가 강화될 가능성이 있고, 이는 무역 마찰과 글로벌 공급망 붕괴의 원인이 될 수 있다.\n\n5) **인도네시아 발 알루미늄, 니켈 공급 우려**: 인도네시아는 알루미늄, 니켈, 코발트 등 중요한 금속 자원을 보유하고 있으므로, 자원민족주의 또는 보호무역주의의 적용 가능성은 매우 높다.\n\n---\n\n### 대선·물가·AI 수익성·中 헤드라인·中 정책, 주요 변수 모두 악재 → KOSPI/KOSDAQ 동반 하락 (-3.6%/ -4.1%)\n\n#### 미국 기술주 급락 + AI 인프라 투자 수익성 우려\n\n미국 기술주 급락은 인텔의 부진한 실적 가이던스와 AI 투자 부담에 하락 출발했으나, 메모리 가격 급등에 따른 PC 수요 위축을 이유로 4분기 매출 가이던스를 150억~160억달러로 제시하며 컨센서스 171억달러를 하회했다. 메모리 공급사는 가격 결정력이 여전히 견고하다는 시장 인식이 확산되었다.\n\nAI 인프라 대규모 투자는 수익성 의구심이 확대되어, 삼성전자, SK하이닉스가 -4.4% 하락하며 미국 반도체 급락 충격을 선반영. 미국 반도체 급락 충격이 전달되는 순간, 단기 낙폭 과다 인식에 따른 반발매수세가 유입됨으로써 강세 전환. 그러나 반발매수세는 단기적이라며, AI 투자 수익성 우려는 지속될 것으로 전망.\n\n#### 中 수출 호조·內수·부동산 경기 부진·經濟扶植 기대 약화\n\n中 수출 호조에도 불구하고 내수·부동산 경기 부진과 경기부양 기대 약화로 약세 전개. 기술주 중심 투매가 나타나며 지수 하락을 주도했다.\n\n#### 河南暴雨·中东 지정학적 불확실성·Credit Risk担忧·Inflation担忧·Interest Rate担忧·Currency risk担忧·Geopolitical risk担忧·Trade risk担忧·Supply Chain risk担忧·Demand risk担忧·Commodity Price risk担忧·Equity Market risk担忧·Bond Market risk担忧·Foreign Exchange risk担忧·Macroeconomic risk担忧\n\n1) **Middle East Uncertainty and Oil Prices Surge Again:** Middle East uncertainty has led to a surge in international oil prices again due to the possibility of military operations against Iran after the US midterm elections, as well as attacks on Saudi energy facilities and the hijacking of an oil tanker in the Strait of Hormuz. This has increased concerns about supply disruptions.\n\n2) **Gold price falls despite geopolitical tensions because high inflation, rising oil prices, and expectations of additional Fed tightening have caused the dollar to strengthen.** \n\n3) **The U.S. dollar is showing strong support from fears of further rate hikes by the Federal Reserve amid economic growth projections that are higher than expected while maintaining tight monetary policy. The euro weakens against the dollar due to the European Central Bank's decision not to raise interest rates and concerns over the Eurozone economy. However, the yen remains stable compared to the dollar even though the BoJ did not increase its interest rate since there is still potential for additional tightening. The won shows strength relative to other currencies due to semiconductor exports and foreign exchange inflows into South Korean companies and the Bank of Korea’s pro-tightening stance.** \n\n4) **Korea's benchmark interest rate is expected to be raised to 3.25 percent in November, with one more hike anticipated next year. Additional tightening by the Fed may only result in 1 or 2 rate increases this time around, so it will likely not exceed previous highs significantly, and the dollar index might fall slightly faster but could see further declines through next year.** \n\n5) **The global stock market was affected negatively last week by worries about the profitability of AI investments and MidEast uncertainties along with credit risks associated with the rise in bond yields resulting in overall weakness across markets. In particular, tech stocks were hit hard leading to significant losses at major indices such as Nasdaq Composite falling nearly 1 percentage point lower which triggered selling pressure througho  GW190304 GW190305 GW190306 GW190307 GW190308 GW190309 GW190310 GW190311 GW190312 GW190313 GW190314 GW190315 GW190316 GW190317 GW190318 GW190319 GW190320 GW190321 GW190322 GW190323 GW190324 GW190325 GW190326 GW190327 GW190328 GW190329 GW190330 GW190331 GW190401 GW190402 GW190403 GW190404 GW190405 GW190406 GW190407 GW190408 GW190409 GW190410 GW190411 GW190412 GW190413 GW190414 GW190415 GW190416 GW190417 GW190418 GW190419 GW190420 GW190421 GW190422 GW190423 GW190424 GW190425 GW190426 GW190427 GW190428 GW190429 GW190430 GW190501 GW190502 GW190503 GW\n"}, {"title": "기업 공시 검증 (DART)", "md": "## 기업 공시 검증 (DART)\n\n> **아래는 위 투자전략·섹터 리포트에서 비중 있게 다뤄진 기업을 DART 전자공시로 대조한 것입니다. 증권사 주장과 실제 공시·재무제표가 일치하는지만 확인하며, 투자 판단을 제시하지 않습니다.**\n\n충분한 데이터를 확보했습니다. 결과를 정리합니다.\n\n---\n\n### 현대자동차\n\n**공시:** 2026-10-29 연결 잠정실적(3Q26) + **[기재정정]영업실적전망(공정공시)** 확인. 후자가 연간 도매판매 가이던스 하향 조정(415.8만대 → 400.0만대)을 공식화한 공시다.  \n**재무(2025년 1~9월 누적 별도 기준):** 매출 46.7조, 영업이익 2.54조, 영업이익률 5.4%. 2026 3Q 재무 수치는 DART 파이프라인 미집계로 조회 불가.  \n**대조:** 리포트의 가이던스 하향 조정 주장은 공시 기준과 일치. 추세 비교는 1건만 쌓여 생략.\n\n---\n\n### 기아\n\n**공시:** 2026-10-30 연결 잠정실적(3Q26) + 자사주처분결정 확인. 현대차와 달리 연간 목표 하향 정정 공시 없음 — 리포트가 \"목표 335만대 유지\"라고 한 것과 일치.  \n**재무(2025년 1~9월 누적):** 매출 28.7조, 영업이익 1.46조, 영업이익률 5.1%. 2026 3Q 수치는 미집계.  \n**대조:** 공시 기준과 일치. 추세 비교 1건으로 생략.\n\n---\n\n### 삼성E&A\n\n**공시:** 사명 여러 형식(삼성E&A, 삼성엔지니어링, 삼성이앤에이)으로 시도했으나 DART 조회 불가 — 공시·재무 검증 생략. 리포트 내 실적 상회·차선호주 주장은 이번 조회로 확인·반박 모두 불가.\n\n---\n\n### GS건설\n\n**공시:** 2026-10-30 연결 잠정실적(3Q26) 공시 확인.  \n**재무(2025년 1~9월 누적):** 매출 3.21조. 영업이익 항목은 DART 조회분에서 미집계.  \n**대조:** 3Q 실적 하회 주장은 잠정실적 공시 존재로 개시 사실은 확인되나, 구체적 수치(하회 폭, 주택 마진) 검증에 필요한 2026 3Q 재무 데이터가 아직 DART에 집계되지 않아 수치 대조 불가. 동해 데이터센터 착공 관련 별도 수주 공시는 최근 30일 조회 범위에서 미확인.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n미국 제조업 PMI(55.5)는 상승세를 보이지만, 생산원가(75.2)가 높은 수준을 유지하면서 가격지수는 감소하고 있어 구조적 비용 부담이 지속되고 있다. 이는 물가 우려와 정책 불확실성, 공급망 재편 필요성 등 여러 요인에 기인한다. 한편, 미국 중간선거 결과에 따라 경제정책 방향이 달라질 가능성이 있고, 이는 인플레이션 목표 조정과 무역 정책 변화로 이어질 수 있다. 또한, AI 펀딩과 관련된 수익성에 대한 불확실성이 지속되고 있으며, Lablup의 IPO 하락은 해당 분야의 기대감 부족을 보여준다."}]}</script>
