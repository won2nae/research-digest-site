두코바니 프로젝트 협상 실패—한수원과 대우건설의 경쟁력 격차가 드러난 순간\n\n체코 두코바니 원전 프로젝트에서 한수원과 대우건설·두산에너지 컨소시엄의 시공계약 협상이 결렬됐다. 한수원은 10월 29일 시공계약 협상 종료를 공식 발표하면서 \"비용 증가 리스크의 책임 범위에 관한 의견 차이\"를 원인으로 명시했다. 이 사건은 단순한 협상 실패를 넘어서 한국 원전 산업의 구조적 문제가 드러냈다.\n\n첫째, 한수원이 시공사 변경을 결행하면서 기존 계약자인 대우건설의 주가가 -18.6%(10/29 종가 기준)로 급락한 것은 시장이 이 결정을 예상보다 더 부정적으로 받아들였다는 뜻이다. 대우건설은 한수원과의 협상 과정에서 \"한수원의 일방적인 공사비 감액 요구\"와 \"무리한 협상 기한 압박\" 등을 이유로 재협상 요청을 했는데, 이런 주장이 시장에서 공감을 받았다. 한수원이 기존 컨소시엄과의 협력협약을 종료하는 동시에 2027년 7월까지 신규 시공사 입찰을 진행한다는 방침은 대우건설이 시공사 재경쟁에서 완전히 제외되는 것을 의미한다.\n\n둘째, 이 결정은 원전 프로젝트 자체의 구조적 위험성을 다시 부각시킨다. 한수원은 이 프로젝트가 기존 계약자들에게도 \"기자재 제작 역무\"까지 포함된 만큼 \"프로젝트가 살아있는 한 문제가 아니다\"라고 반박했지만, 시공계약 협상 결렬 직후 한국전력이 발표한 2026년 하반기 영업이익 5.6t원(전년동기 대비 34.1%↓)은 이미 이 프로젝트가 한수원의 실적에 미칠 부담을 시장이 인정하고 있다는 증거다. 특히 한수원의 시공사 변경 계획은 기존 계약자의 역무 범위를 유지하는 것과 별개로, 한수원 스스로가 신규 시공사 선정에 따른 리스크를 새로운 계약으로 이양했다는 점에서 이 프로젝트가 한수원의 자산 포트폴리오에 얼마나 깊이 자리잡고 있는지 보여준다.\n\n셋째, 이 사건은 원전 프로젝트의 성패가 단순히 공사비 협상에만 있지 않는다는 걸 확인했다. 한수원은 기존 계약자들이 시행 중인 \"설계\", \"기자재 제작 역무\"는 계속 유지되면서도, 시공계약 협상 자체를 종료했다. 즉, 프로젝트 실행에 필요한 핵심 작업(설계·기자재 생산)은 기존 계약자들이 하고 있지만, 그들은 시공을 맡지 못 한다는 의미다. 이는 원전 프로젝트에서 설계·기자재 생산과 시공의 역할 분리를 법적으로라도 명문화해야 한다는 시사점을 준다.\n\n넷째, 한수원이 내세웠던 \"비용 증가 리스크의 책임 범위\"라는 근거는 매우 모호하다. 원전 프로젝트에서 비용 증가의 근본 원인은 공사비를 포함한 전체 예산 설정부터였다. 한수원이 2020년 6월 체결한 이 프로젝트는 원자로 2기를 APR1000 기준으로 공급하는 것으로, 총 사업비는 약 26조 원이었다. 당시 이 계약이 체결된 맥락에서 \"비용 증가 리스크\"를 누가 누구에게 전가할지에 대한 규정이 있었는지, 있었더라도 어떤 구조인지, 이 협상 결렬에서 그것이 어디에 적용됐는지는 아직 알려지지 않았다. 한수원이 이 문제를 신규 시공사 선정으로 해결하려는 접근법은 비용 증가 리스크를 한수원이 아닌 시공사에게 전가하려는 시도로 읽힌다.\n\n다섯째, 이 사건은 한수원의 원전 사업에서 \"정산조정계수\" 문제와의 연관성을 다시 묻게 한다. 한수원이 2022년 적자를 기록한 원인 중 하나는 원전 정산조정계수의 영향이었다. 한수원은 정산조정계수의 존재가 원전 정산단가와 한국전력 별도의 구입전력비를 분리하는 메커니즘이기 때문에, 한국전력 별도와 발전자회사 간의 수익이 조절되는 구조다. 한수원이 2022년 적자에 대해 \"일회성 비용\"을 이유로 내세웠지만, 당시 적자는 원전 정책 변경으로 인한 다수의 일회성 비용이 반영된 것이었다. 이 사건에서 한수원이 시공계약을 수정하거나 새로 체결할 때, 이전 계약에서 사용된 \"정산조정계수\" 메커니즘이 어떻게 반영될지도 한수원의 의사결정 변수로 작용할 것이다.\n\n여섯째, 이 사건은 한국 원전 산업에서 \"팀코리아\" 개념의 경쟁력과 한계를 다시 질문하도록 한다. 원전 프로젝트에서 한수원과 현지 기업이 협업하는 형태—\"팀코리아\"—는 이 프로젝트에서 대우건설·두산에너지 컨소시엄이 체코 현지 기업과의 협업을 기반으로 한 모습을 보여줬다. 그러나 한수원이 이 컨소시엄과의 협력협약을 종료하고, 2027년 7월까지 신규 시공사 선정을 진행한다고 발표한 것은 이 협력 체계 자체에 대한 불신을 보여준다. 한수원이 기존 계약자와의 협력 관계를 유지하면서도, 시공계약 협상은 완전히 별개의 프로세스로 처리했다는 점에서, \"팀코리아\"의 의미가 프로젝트 전체의 성패에 얼마나 깊이 들어갔는지가 이 사건에서 재확인된다.\n\n이 사건은 단순한 원전 프로젝트 협상 결렬을 넘어서, 원전 프로젝트에서 기술·관리 역량을 기반으로 한 경쟁 구도와, 그 경쟁 구도가 한수원의 의사결정에 어떤 방식으로 반영되는지를 보여준다. 한수원이 기존 컨소시엄과의 협력협약을 종료하고, 신규 시공사 선정을 준비하는 과정에서 어떤 요인이 우선시되는지, 그리고 이 결정이 한수원의 원전 포트폴리오 전반에 어떤 파급 효과를 줄지, 앞으로 발표되는 신규 시공사 선정 기준에서 이 사건이 어떻게 반영되는지가 관건이다.\n\n---\n\n### AI 인프라: 스페이스X, 사상최대 400억 달러 GPU 금융조달로 지상→궤도 AI 인프라 전환 가속\n\n스페이스X는 2026년 10월 27일, 사상 최대 규모인 약 400억 달러 규모의 GPU 금융조달을 발표했다. 이는 아폴로 글로벌 매니지먼트(Apollo Global Management)가 이끄는 투자단과 마스터 금융리스(master lease agreement)를 맺는 구조다. 거래는 연내 종결될 예정이며, 2027년 상반기 GPU 인도와 함께 트랜치(tranche)별로 약 5년의 리스가 개시된다.\n\n### ① 리스 구조: 스페이스X의 자금원 다변화\n\n구조적으로는 먼저 아폴로가 운용하는 리스 법인이 엔비디아의 차세대 베라 루빈(Hopper) 칩과 관련 서버 장비를 직접 구매한 뒤 스페이스X에 임대하는 방식이다. 스페이스X는 주식 희석이나 일반 회사채 발행 없이 GPU 자산 자체를 기반으로 대규모 설비를 확보하게 된다. 이 구조는 스페이스X가 기존에 있었던 자본 구조의 한계를 피하면서도, GPU 확보 여력을 높이는 데 기여한다. 일론 머스크는 이 금융조달을 완료했다고 표현했지만, 공시상으로는 연내 종결을 조건으로 한 확약 단계다.\n\n### ② AI 인프라 확장: Grok·클라우드·Starlink의 동시 확장\n\n이번에 조달된 GPU는 Grok의 기업·소비자 서비스와 클라우드 고객을 위한 지상 컴퓨팅 인프라 구축에 투입된다. 지난 2월 xAI 인수로 콜로서스(Colossus) 데이터센터를 확보한 스페이스X는 2분기에 처음으로 클라우드 매출을 일으켰고, 3분기에 기존 Starlink(스타링크)를 제치고 SI(Software Infrastructure) 부문의 매출 비중이 52%를 차지하게 됐다. 상장 당시 약 1GW였던 콜로서스 용량은 3분기 말 약 1.7GW에 달했고, 올해 말 약 2.5GW, 2027년 말 13GW가 목표다. ARR(Annual Recurring Revenue)은 5,000억~1조 달러를 목표로 하고 있다. 이 확장은 궤도 AI 데이터센터(starmind) 전개와도 맞물린다.\n\n### ③ 리스크 요인: GPU 교체 주기가 리스 기간과 어긋나는 구조\n\n리스크도 분명하다. 칩 세대 교체가 빠른 상황에서 5년 리스 기간의 장비 가치 하락 부담을 안게 되고, 회수 기간 1년 미만이라는 설명도 수요가 꺾이면 흔들릴 수 있다. 그럼에도 스페이스X는 매출 절반 이상을 AI 부문이 책임지는 구조에 GPU 확보 여력까지 더해지며 우주·AI 인프라 플랫폼으로 진화하게 됐다.\n\n---\n\n### 로봇: 삼성SDI, 로봇용 전고체 배터리 내년 하반기 양산\n\n삼성SDI는 2026년 10월 29일, 로봇용 전고체 배터리의 내년 하반기 양산을 발표했다. 이 배터리는 삼성SDI가 자체 개발한 제품으로, 로봇의 고밀도 에너지원으로서의 전고체 배터리 기술을 실용화하는 첫 번째 단계다.\n\n### ▶ 삼성SDI의 전고체 배터리 기술: 전고체 배터리가 로봇에 왜 필요한가?\n\n로봇의 에너지 효율과 무게, 사이클 수명은 전고체 배터리 기술이 기존 Li-ion 배터리에 비해 가지는 장점을 잘 반영한다. 전고체 배터리는 리튬이온(Li⁺) 이동 경로를 고체 전해질로 전환함으로써 전도성과 안정성을 동시에 높일 수 있다. 이는 로봇이 장시간 동작하거나 고강도 작업을 수행할 때 배터리의 효율과 수명을 동시에 개선하는 데 기여한다. 삼성SDI가 내년 하반기에 양산을 시작한다는 것은 이 기술이 삼성SDI의 전고체 배터리 연구 개발에서 상용화 단계로 이행됐다는 의미다.\n\n### ▶ 삼성SDI의 전고체 배터리 로드맵: 로봇용 전고체 배터리로 시작\n\n삼성SDI의 전고체 배터리 로드맵은 2025년에 시작된 것으로, 이듬해인 2026년에는 전고체 배터리의 양산이 시작된다고 발표했다. 이 로드맵은 전고체 배터리의 상용화가 삼성SDI의 핵심 기술 중 하나임을 보여준다. 삼성SDI는 이 배터리를 자동차, IT, 로봇 등 다양한 분야에 적용할 수 있다고 밝혔다.\n\n### ▶ 삼성SDI의 전고체 배터리 시장 전략\n\n삼성SDI는 전고체 배터리를 다양한 분야에 적용할 수 있다고 밝혔다. 이는 삼성SDI가 전고체 배터리 기술을 단순히 특정 산업에 국한시키지 않고, 다양한 산업군에서의 상용화를 목표로 하고 있음을 보여준다. 특히 삼성SDI가 내년 하반기에 로봇용 전고체 배터리를 양산한다는 발표는 전고체 배터리가 삼성SDI의 기술 전략에서 어떻게 활용될지에 대한 방향을 제시한다.\n\n---\n\n### 인터넷/게임: 카카오게임즈·크래프톤, 남궁훈의 'AI 메신저'에 200억 쐈다\n\n카카오게임즈와 크래프톤은 남궁훈 대표가 이끄는 아이즈엔터테인먼트(IzEntertainment)에 각각 100억 원씩 총 200억 원을 투자했다. 이 투자로 아이즈엔터테인먼트는 AI 챗봇과 게임, 메신저를 결합한 신규 플랫폼 개발에 속도를 붙일 예정이다.\n\n### ▶ 남궁훈의 'AI 메신저': 아이즈엔터테인먼트의 핵심 전략\n\n아이즈엔터테인먼트는 AI 챗봇과 게임, 메신저를 결합한 신규 플랫폼 개발에 집중하고 있다. 남궁훈 대표는 이 회사를 이끌고 있다. 그는 AI 기술과 게임, 메신저의 융합에 대한 비전을 제시해왔다. 이 회사는 이러한 비전을 바탕으로 신규 플랫폼 개발에 집중하고 있다.\n\n### ▶ 카카오게임즈·크래프톤의 투자 배경\n\n카카오게임즈와 크래프톤이 아이즈엔터테인먼트에 각각 100억 원을 투자했다. 이 투자는 아이즈엔터테인먼트가 AI 챗봇과 게임, 메신저를 결합한 신규 플랫폼 개발에 속도를 붙일 수 있도록 지원하기 위한 목적이다. 두 회사는 이 회사의 전략과 비전에 공감하고, 투자를 통해 이를 지원하고 있다.\n\n### ▶ 아이즈엔터테인먼트의 향후 전략\n\n아이즈엔터테인먼트는 확보한 자금으로 AI 챗봇과 게임, 메신저를 결합한 신규 플랫폼 개발에 속도를 낼 예정이다. 이 회사는 AI 기술과 게임, 메신저의 융합에 대한 비전을 제시해왔다. 이 투자는 아이즈엔터테인먼트가 이러한 비전을 실현할 수 있도록 지원하는 데 기여할 것이다.\n\n---\n\n### 통신: SKT, 2027년 요금제 개편 시 전 고점 14만원 돌파·시가총액 30조원 목표\n\nSKT는 10월 29일, 2027년 요금제 개편이 이루어진다면 전 고점인 14만 원 이상, 시가총액 30조 원을 넘어설 것으로 판단했다.\n\n### ▶ 2026년 SKT 총 배당금 전망치: 약 7,500억 원\n\n2026년 SKT 총 배당금 전망치는 약 7,500억 원이다. 이 배당금은 시가총액 15조 원으로 감소한 현재 주가에 있어, 앤트로픽 보유 지분 가치 및 SK하이퍼 가치를 전혀 반영하지 않은 상태다. 현재 주가에선 매수를 망설일 이유가 없다고 판단한다.\n\n### ▶ 2027년 요금제 개편 시 전 고점 14만 원 돌파·시가총액 30조 원 목표\n\n2027년 요금제 개편이 이루어진다면, SKT는 전 고점인 14만 원 이상, 시가총액 30조 원을 넘어설 것으로 판단한다. 현재 SKT 시가총액은 16조 원 수준으로 감소했지만, 2027년 요금제 개편 시 전 고점인 14만 원 이상, 시가총액 30조 원을 넘어설 것으로 판단한다.\n\n---\n\n### 방산: KMW, 에릭슨의 미국 시장 진입 기회로 주목\n\n에릭슨 주가가 비수기임에도 불구하고 상대적인 강세 추세를 보였다. 표면적인 이유는 3분기 실적 호전 때문이지만, 근원적인 이유는 2027년 미국 시장의 5G 투자 급증 가능성에 기인한다.\n\n### ▶ 2027년 미국 시장의 5G 투자 급증 가능성\n\n에릭슨의 M/S가 크게 상승한 탓이다. 그런데 2027년에는 상황이 더욱 호전될 가능성이 엿보인다. 전 세계 1/3를 차지하는 미국 시장이 본격 성장할 것이고, 에릭슨이 미국 시장에서 30% 이상의 M/S를 차지할 확률이 높기 때문이다.\n\n### ▶ KMW, 미국 통신장비 시장 진입 기회로 주목\n\n대중국 장비 제재 상황을 감안하면 KMW의 미국 장비 공급이 사실상 확정적이다. 2027년 미국 통신장비 시장이 본격 개화된다고 보면, 삼성전자를 중심으로 필터, 안테나, 시스템 장비 공급이 예상된다. 테스트용 장비 공급이 꾸준히 이루어지고 있어, 2027년 에릭슨으로의 신규 통신장비 공급 가능성이 높아지는 상황이다.\n\n---\n\n### ETF: KODEX KRX 300 인버스\n\nKODEX KRX 300 인버스는 2026년 10월 29일, 주가가 -3.48% 하락했다. 이 낙폭은 코스피 전체 낙폭(-3.48%)과 같다. 이 낙폭은 KODEX KRX 300 인버스의 역할이 코스피 시장의 하락을 반영한 것임을 의미한다.\n\n---\n\n### 콘텐츠 캘린더\n\n- [음악] 세븐틴 아시아 투어 매출 1,300억원으로 1위 기록 (25.08~26.07 집계) (HYBE)\n- [음악] 아일릿 10/26 발매한 미니 5집 4일차 판매량 약 40만장으로, 전작(34만장) 대비 약 18% 증가 (HYBE)\n- [음악] 엔믹스 10/19 발매한 미니 6집 초동 약 35만장으로, 전작(35만장) 대비 약 1% 증가 (JYP)\n- [드라마] <닥터X: 하얀 마피아의 시대> 6회 만에 시청률 19.5% 기록, SBS 금토 드라마 역대 시청률 5위 (SBS)\n\n---\n\n### 알트코인: 바이낸스 57억 달러 해킹, 테더 15.6억 USDT 서클 8.2억 USDC 동결\n\n바이낸스는 2026년 10월 29일, 이더리움(Ethereum) EIP-7702 취약점으로 인해 핫월렛이 탈취돼 약 20만 4천 ETH 등 57억 달러가 유출됐다고 발표했다. 이로 인해 바이낸스의 ETH 준비금은 100%에서 94% 수준으로 하락했다. 테더(Tether)는 15.6억 USDT, 서클(Circle)은 8.2억 USDC를 동결했으며, SAFU(Secure Asset Fund for Users) 기금 10억 달러를 통해 상쇄 여지가 있어 바이낸스는 고객 자산은 안전하다고 밝혔다.\n\n---\n\n### 에너지: 원자력 발전의 정산단가 2020년 59.63원/kWh에서 2022년 52.58원/kWh로 하락\n\n원자력 발전의 정산단가는 2020년 59.63원/kWh에서 2022년 52.58원/kWh로 하락했다. 연간 평균 SMP는 2020년 68.87원/kWh에서 2022년 196.65원/kWh로 급등했다. 2020년은 극도로 낮아진 SMP로 대부분의 발전사업자 수익성이 낮아졌고, 2022년은 반대로 실적이 개선되었다. 원자력 발전의 정산단가는 2020년 59.63원/kWh에서 2022년 52.58원/kWh로 하락했다. SMP 하락으로 한국전력 별도 실적이 개선되었던 2020년은 정산조정계수가 높은 수준으로 형성되었지만, SMP가 급등한 2022년은 정산조정계수가 거의 0에 수렴했고, 2022년 한국수력원자력은 적자를 기록했다. 2018년의 적자는 원전 정책 변경으로 다수 일회성 비용이 반영되었기 때문이며, 2022년은 정산조정계수 영향이다.\n\n---\n\n### 통신장비: 에릭슨의 미국 시장 진입 기회로 KMW 주목\n\n에릭슨 주가가 비수기임에도 불구하고 상대적인 강세 추세를 보였다. 표면적인  하회\n    - **심층 불확실성**: 잉여현금흐름(FCF)이 -424억 달러로 직전 분기(-76억 달러)보다 악화됨에 따라, 투자 수익성과 자본 조달 부담 우려가 부각\n\n- **알파벳**: \n    - 3분기 매출액 1,275.8억 달러로 컨센서스 하회\n    - 2분기 연속 FCF 적자\n    - **즉각 효과**: 10월 29일(목) 장 마감 후 실적 발표 직후 주가 12.6% 급락 (시간외 5%대 약세)\n  \n- **샌디스크**: \n    - 매출액, EPS, GPM 모두 컨센서스 상회\n    - 4분기 가이던스 상향으로 메모리 업황 개선 신뢰도 강화\n    - **불확실성 제한**: 아마존과 인텔의 시간외 급락 여파로 시간외 3%대 약세 (상대적 부양 요인)\n\n- **MSFT**: \n    - 호실적 발표\n    - CapEx 가이던스가 기대치 하회\n    - **잠재적 불확실성**: CapEx 부담과 투자 수익성 간 균형 파악 필요\n\n**시장의 이중 해석 구도**:\n- **긍정적 시그널**: 인텔·샌디스크 실적은 AI 서버 수요의 견조함을 확인\n- **부정적 시그널**: 아마존·알파벳·인텔의 FCF 악화, CapEx 부담은 투자 수익성과 자본 조달 부담 우려\n\n**결과**: AI 서버 수요는 아직 셧다운 상태가 아닌데도, 투자 수익성과 B2C 둔화 우려가 기술주 전반의 매도 압박으로 작용\n\n---\n\n### II. 국내 반도체 대형주: 삼성전자 vs. SK하이닉스 – 주주환원 구조 차별화에 따른 시가총액 경쟁\n\n#### 2. 삼성전자: 주주환원 구체성 부재로 단기 변동성 확대\n\n- **주주환원 구조**:\n    - 2026년 총 주주환원 규모: 90~110조 원\n        - 이미 계획 또는 집행 완료: 35조 원\n        - 남은 55~75조 원: 자사주 매입·소각 + 현금배당 (구체적 비중은 내년 1월 이사회에서 결정)\n    \n- **시장 반응**:\n    - 2026년 10월 28일 실적 발표 후 주가 6%대 급락\n    - 주주환원 구체성 부재에 따른 실망 매물 출회\n    - 2026년 10월 29일(목) 9%대 급등 후 차익실현 압력에 재차 하락\n    - 2026년 10월 30일(금): 주가 전 거래일 대비 -1.24% (-10월 29일 기준 5,937.66P, 전일 5,937.66P로 마감; 주간 -13.2%)\n\n- **강점을 재확인한 항목**:\n    - 2028년까지 메모리 공급 부족 지속\n    - 장기공급계약(LTA) 확대 (14개 기업과 LTA 체결, 2027~2028년 생산능력의 50% 이상 확보)\n    - HBM4 비중 60% 달성\n\n- **취약성**:\n    - 주주환원 구체성 부재\n    - 2026년 10월 29일 9%대 급등에 따른 차익실현 압력\n\n---\n\n#### 3. SK하이닉스: 주주환원 구체화 + LTA 확대 = 주주환원 정책의 즉각적 현실화\n\n- **주주환원 구조**:\n    - 2026년 총 주주환원 규모: 약 100조 원\n        - 현금배당: 30조 원 이상\n        - 자사주 매입·소각: 60조 원 이상 (~1/28 20조 원 취득)\n        \n- **시장 반응**:\n    - 주주환원 정책 재개로 외국인과 기타법인 순매수 (특히 기타법인: 3,400억 원 순매수)\n    - 주주환원 정책에 따른 주가 안정성 강화\n\n- **메모리 업황 재확인**:\n    - 2027~2028년 생산능력의 50% 이상 확보\n    - 2029년까지 D램/HBM 생산 물량 사실상 완판\n    - 메모리 공급 부족 2030년까지 지속 예상\n\n- **주주환원 정책의 즉각적 현실화**:\n    - 자사주 매입 재개 (~1/28 20조 원 취득)\n    - 외국인과 기관 순매수에 의해 주주환원 정책이 이미 시장에 반영된 구조\n\n---\n\n### III. AI 서버 수요의 실적 확인 vs. 투자 수익성과 B2C 둔화 우려: AI 주식의 구조적 편차\n\n#### 4. 삼성전자 vs. SK하이닉스: 주주환원 정책의 구조적 차별화\n\n| 항목 | 삼성전자 | SK하이닉스 |\n|------|----------|-----------|\n| 주주환원 구체성 | 부재 | 구체화 |\n| 자사주 매입 · 소각 | 내년 1월 이사회에서 결정 | ~1/28 20조 원 취득 (즉각적 현실화) |\n| 현금배당 | 미분기 | 30조 원 이상 (구체적 계획) |\n| LTA 확대 | 미분기 | 14개 기업과 LTA 체결, 2027~2028년 생산능력의 50% 이상 확보 |\n| HBM4 비중 | 미분기 | 60% 달성 |\n\n---\n\n#### 5. AI 서버 수요의 실적 확인 vs. 투자 수익성과 B2C 둔화 우려\n\n- **인텔·샌디스크**: AI 서버 수요의 견조함 확인 (데이터센터 호조, 가이던스 상향), 그러나 PC 부진, 메모리 가격 급등, 공장 사고로 인한 생산 차질이라는 B2C 수요 약화 요인이 동반\n\n- **알파벳·아마존**: AI 서버 수요의 견조함은 확인되었지만, FCF 악화로 인한 투자 수익성과 자본 조달 부담 우려가 기술주 전반에 대한 매도 압박으로 전이\n\n- **시장의 이중적 해석**:\n    - AI 서버 수요는 아직 셧다운 상태가 아니다\n    - 그러나 B2C 수요 약화와 투자 수익성 부담이 기술주 전반의 매도 압박으로 작용\n\n---\n\n### IV. 미국 10년물 국채금리 하락: AI 투자 수익성 우려에 따른 안전자산 선호\n\n#### 6. 미국 10년물 국채금리 하락 (-9.20bp)의 구조적 맥락\n\n- **금리 동결 시장 예상에 부합**\n- **FedWatch 기준 12월 금리 인상 확률 81%**, 전일(78%) 대비 소폭 상승\n    - 10월 FOMC는 시장 예상에 부합하는 중립적인 결과\n    - 12월 금리 인상 확률은 여전히 높은 수준\n\n- **금리 하락의 구조적 이유**:\n    - 알파벳의 FCF 악화, 아마존의 잉여현금흐름 부진, 인텔의 가이던스 하회 등으로 인한 AI 투자 수익성 우려\n    - 안전자산 선호에 따른 미 국채 수요 확대\n    - AI 투자 지출의 수익화 가능성과 자본 조달 부담에 대한 경계감\n\n---\n\n### V. 미국 중간선거: 민주당이 하원을 탈환할 경우, 2027년 S&P500의 주도업종 전환 가능성\n\n#### 7. 미국 중간선거: 민주당 하원 탈환 시 2027년 S&P500의 주도업종 전환 가능성\n\n- **민주당 하원 탈환 시나리오**:\n    - 2027년 2분기부터 2028년 1분기까지 미국 기업의 분기별 EPS 증가율이 가장 높고, 매 분기 순이익이 증가하는 업종: 반도체\n    - 2027년 EPS 증가율이 매 분기 지속적으로 상승하고, 이익 증가율 대비 주가 수익률 비율 높고, 이익 증가 시 PER이 상승하는 업종: 소프트웨어\n    - 이익 증가율 대비 주가 수익률 비율이 1배 이상, 이익 증가 시 PER이 상승하는 업종 중 분기별 이익 증가율 높은 업종: 1분기 자동차→2분기 자본재→3분기 제약/바이오→4분기 하드웨어\n\n- **민주당 하원 탈환 시 2027년 S&P500의 주도업종 전환 가능성**:\n    - 2026년 10월 28일 10년물 국채금리 하락, 2027년 10년물 국채금리 하락 기대\n    - 2027년 S&P500 지수의 연간 EPS 증가율 전망치 16%\n    - 이익 증가 년도의 S&P500 지수의 고점 대비 평균 조정 폭 -9%\n\n- **1990년 이후 10년물 국채금리 하락과 S&P500 EPS 5% 이상 증가 년도의 이익 증가율 대비 주가 수익률 평균 비율 1.05배**\n- 2027년 미국 10년물 국채금리 하락과 S&P500 지수 EPS 증가율 전망치 16% 적용 시 S&P500 지수 기대수익률 17%\n\n---\n\n### VI. 2027년 국내 증시: 주도업종 전환, 주도주 경쟁, 시총 3위 경쟁\n\n#### 8. 2027년 국내 증시: 주도업종 전환, 주도주 경쟁, 시총 3위 경쟁\n\n##### (1) 주도업종 전환: 상반기는 2차전지 & IT 하드웨어, 하반기는 제약/바이오 & 자동차\n\n- **2027년 상반기 주도업종**:\n    - 2차전지\n    - IT 하드웨어\n\n- **2027년 하반기 주도업종**:\n    - 제약/바이오\n    - 자동차\n\n- **주도업종 전환의 구조적 이유**:\n    - 상반기: 2차전지와 IT 하드웨어의 이익 증가율과 주가 수익률 비율의 높은 수준\n    - 하반기: 제약/바이오와 자동차의 이익 증가율과 주가 수익률 비율의 높은 수준\n\n---\n\n##### (2) 주도주 경쟁: 상반기 2차전지 & IT 하드웨어, 하반기 제약/바이오는 삼성바이오로직스 vs. 자동차는 현대차\n\n- **2027년 상반기 주도주 경쟁**:\n    - 2차전지: LG에너지솔루션\n    - IT 하드웨어: 삼성전기\n\n- **2027년 하반기 주도주 경쟁**:\n    - 제약/바이오: 삼성바이오로직스\n    - 자동차: 현대차\n\n- **주도주 경쟁의 구조적 이유**:\n    - 상반기: 2차전지와 IT 하드웨어의 이익 증가율과 주가 수익률 비율의 높은 수준\n    - 하반기: 제약/바이오와 자동차의 이익 증가율과 주가 수익률 비율의 높은 수준\n\n---\n\n##### (3) 시총 3위 경쟁: 상반기 2차전지 & IT 하드웨어, 하반기 제약/바이오는 삼성바이오로직스 vs. 자동차는 현대차\n\n- **2027년 시총 3위 경쟁**:\n    - 상반기: LG에너지솔루션 vs. 삼성전기\n    - 하반기: 삼성바이오로직스 vs. 현대차\n\n- **시총 3위 경쟁의 구조적 이유**:\n    - 상반기: 2차전지와 IT 하드웨어의 이익 증가율과 주가 수익률 비율의 높은 수준\n    - 하반기: 제약/바이오와 자동차의 이익 증가율과 주가 수익률 비율의 높은 수준\n\n---\n\n### VII. 코스피: PER은 이익 규모와 반대 흐름, 삼성전자 주가는 고점 대비 -40% 이상 급락\n\n#### 9. 코스피의 PER: 이익 규모와 반대 흐름\n\n- **2026년 삼성전자 주가는 고점 대비 -40% 이상 급락**\n- **2000년 이후 현재와 유사한 주가 급락 이후 반등 기간 평균 5개월, 누적 수익률 40%**\n- **삼성전자와 SK하이닉스는 기술적 반등을 기반으로 2026년 연말~2027년 1분기 지수 반등을 주도할 것으로 판단**\n\n---\n\n### VIII. 코스피 2027년: 순이익 전망치 1,056조 원, 12개월 예상 PER 4.6배\n\n#### 10. 코스피 2027년: 순이익 전망치 1,056조 원, 12개월 예상 PER 4.6배\n\n- **2010년 이후 코스피 순이익 추정치 하향 조정 년도의 연간 순이익 추정치 하향 조정(연초 대비 연말) 평균 -19%**(최대 -39%)\n- **PER 최저 7.6~평균 8.0배**\n- **과거 평균 이익 추정치 하향 조정 폭과 PER 적용 시 2027년 코스피 예상 상단은 8,500p**\n- **과거 순이익 추정치 최대 하향 조정 -40% 이상 진행되지 않을 경우 2027년 코스피 예상 저점은 2026년 하반기 저점인 5,250p를 하회할 가능성도 낮다**\n\n---\n\n### IX. 2027년 KOSPI의 주도업종과 주도주: 반도체, 소프트웨어, 자본재, 제약/바이오, 하드웨어\n\n#### 11. 2027년 KOSPI의 주도업종과 주도주\n\n- **2027년 KOSPI의 주도업종**:\n    - 1분기: 자동차\n    - 2분기: 자본재\n    - 3분기: 제약/바이오\n    - 4분기: 하드웨어\n\n- **2027년 KOSPI의 주도주**:\n    - 1분기: 자동차\n    - 2분기: 자본재\n    - 3분기: 제약/바이오\n    - 4분기: 하드웨어\n\n- **2027년 KOSPI의 주도업종과 주도주의 구조적 이유**:\n    - 2027년 KOSPI의 연간 EPS 증가율 전망치 16%\n    - 이익 증가 년도의 KOSPI 지수의 고점 대비 평균 조정 폭 -9%\n    - 1990년 이후 10년물 국채금리 하락과 KOSPI EPS 5% 이상 증가 년도의 이익 증가율 대비 주가 수익률 평균 비율 1.05배\n\n---\n\n### X. 인도 NIFTY50: 미국 중간선거 이후 장기금리 하락 시 외국인 자금 유입 및 루피화 약세 완화 기대\n\n#### 12. 인도 NIFTY50: 미국 중간선거 이후 장기금리 하락 시 외국인 자금 유입 및 루피화 약세 완화 기대\n\n- **NIFTY50 지수는 연초 대비 13.5% 하락하며 신흥국 내에서도 상대적으로 부진한 흐름을 이어가고 있다(10월 28일 기준)**\n\n- **주요 요인**:\n    1. **고유가 부담**:\n        - 중동 지역의 지정학적 리스크가 장기화되어 국제유가가 높은 수준을 유지\n        - 국제유가 상승은 물가 상승과 경상수지 악화 우려를 높이고 기업의 생산비용 부담도 가중\n        - 인도는 글로벌 3위 원유 수입국으로, 수입 의존도가 약 90%에 달하여 고유가가 경제 전반에 미치는 영향이 특히 크다\n\n    2. **글로벌 AI 관련 업종으로의 자금 쏠림**:\n        - AI 투자 확대에 힘입어 반도체 중심의 글로벌 증시 강세가 이어져, 관련 산업에 대한 직접적인 노출도가 낮은 인도 증시의 소외 현상이 지속되고 있다\n\n    3. **미국 국채금리 상승에 따른 외국인 자금 이탈**:\n        - 하반기에 미국 장기금리 상승으로 인해 인도 자산의 상대적 투자 매력이 약화되어 외국인 자금 이탈이 확대되었다\n        - 이에 따른 루피화 약세는 환차손 우려를 높이며 추가적인 매도 압력으로 작용하였다\n\n---\n\n### XI. 미국 중간선거: 민주당 하원 탈환 시 2027년 S&P500의 주도업종 전환 가능성\n\n#### 13. 미국 중간선거: 민주당 하원 탈환 시 2027년 S&P500의 주도업종 전환 가능성\n\n- **미국 중간선거 이후 장기금리가 하락할 경우 인도 증시의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결과라는 점에서, 2027년 코스피의 부진이 여러 대외 악재가 복합적으로 작용한 결
