<script id="__DATA__" type="application/json">{"date": "2026-09-28", "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 하락 -2.70% (현재 6889.74, 전일 7080.92, 임계값 1.5% 초과)\n- **한국 10년 국채금리** 상승 +13.50bp (현재 4.544, 전일 4.409, 임계값 8.0bp 초과)\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### 1. 원화 환율: 1,368원은 \"평균회귀\"가 아니라 구조적 저평가\n\n2024년 하반기부터 2026년 상반기까지의 원/달러 환율은 기존 평균회귀 가정을 전제한 모델이 체계적으로 상단을 하회한 구조적 이탈 국면이다. 유안타증권에 따르면, BIS 광의 실질실효환율은 2026년 8월 89.89로 10년 이동평균(98.6) 대비 -8.8%를 기록하며 2008년 이후 하위 11%에 머물고 있다. 이동평균으로의 회귀를 가정할 경우 약 1,250원이 앵커 수준이지만, 순대외금융자산(NIIP) 기준 추정치는 2026년 2분기 1,396원, 3분기 예비치 1,406원으로 산출된다. 두 앵커 추정치 모두 단위근 및 공적분 검정에서 귀무가설을 기각하지 못해 장기 균형관계가 통계적으로 지지되지 않는다.\n\n핵심 불일치는 여기서 발생한다. 순대외금융자산 잔액 기준 환율 추정치는 2분기 말 1,264원에서 3분기 예비치 1,117원으로 -147원 급락했지만, 이는 실질 자본 유출입이 아닌 KOSPI 55% 급등에 따른 외국인 보유 주식 평가액 증가(1조 325억 달러 → 1조 8,806억 달러)의 회계적 착시에 불과하다. 즉, 잔액 기준 추정치는 자산 가격 효과를 반영한 것이지 외환 수급의 펀더멘털 변화를 반영한 것이 아니다.\n\n이로 인해 원화 강세의 근거가 \"평균회귀\"가 아닌 \"구조적 달러 수요\"로 재편된다. NIIP 기준 1,406원은 BIS 이동평균 기준 1,250원보다 높고, 실제 시장 종가 1,368원은 이 두 추정치 사이에 위치한다. 이 구간에서 달러 수요가 여전히 펀더멘털로 작동하고 있다는 것은, 단기 반등 이후의 반전(2027년) 가능성을 제한적으로 열어둔 채, 현재 원화 강세는 구조적 수요가 지지하는 펀더멘털이 아닌 \"수급 체크메이트\"로 해석해야 한다.\n\n---\n\n### 2. 한국 생산자물가: 근원 상승률 8%대 유지, 추가 인상 여지 약화\n\n8월 생산자물가는 전월대비 0.2% 상승해 7월 0.4% 하락에서 방향 전환했으나, 이는 석유제품 가격 되돌림(전월 하락분의 반전), 금융·보험 부문 낙폭 축소(특히 증시 거래대금 연동 위탁수수료), 가스요금 인상 추정분, 계절적 농산물 가격 상승 등의 일회성·계절성 요인에 기인한다. 이 요인들을 제거하면 근원 물가(식료품·에너지 제외)의 전월대비 상승률은 사실상 0%에 가까워진다.\n\n전년동월대비 기준으로는 생산자물가 7.9%, 근원 기준 8.2%로 여전히 높은 수준을 유지 중이다. 근원 상승률이 전체 상승률을 상회한다는 것은 물가 압력이 특정 품목(식료품·에너지)에 국한되지 않고 경제 전반에 넓게 퍼져 있다는 의미다. 항목별로는 공산품과 서비스 부문이 표면적으로 보합(0%)을 기록했지만, 공산품 내 석유제품이 하락에서 상승으로 전환하며 상승분의 상당 부분을 차지하고 있고, 화학·1차금속·전자표시장치 등 비에너지 품목은 여전히 가격이 하락 중이다. 서비스 부문의 보합 역시 금융·보험업 내 증시 거래대금 연동 수수료 항목의 낙폭 축소에 의존한 것으로, 물가 기조와 무관한 변동성 요인이다.\n\n---\n\n### 3. 미국 경제: 고금리-고유가 우려를 이겨낸 AI 투자 사이클의 강세\n\niM증권에 따르면, 미국 S&P 제조업·서비스업 PMI지수가 58.4로 5년여 만에 최고치를 기록했고, 항공기를 제외한 비국방 자본재 수주액은 전월비 1.6% 증가해 5개월 연속 증가세를 유지 중이다. 주간 신규실업청구건수는 19만 건대로 낮은 수준을 유지하고 있으며, 미국 애틀랜타 연준의 3분기 GDP 추정치는 9월 25일 기준 전기비연율 5%에 달한다.\n\n고금리·고유가가 경기 둔화를 유발할 수 있는 구조적 부담임에도 불구하고, AI 관련 투자 사이클과 낙수 효과가 미국 경제의 강한 성장 모멘텀을 지지하고 있다는 점에서, 미국 국채금리 급등은 경기 둔화 신호가 아닌 성장 지속성에 대한 시장의 신뢰를 반영하는 것으로 해석된다. 이는 미국 경제가 단기 금리 상승에 대한 내성성을 보유하고 있음을 시사한다.\n\n---\n\n### 4. 미국 국채금리: 6개월 내 100bp 상승이 조정 확률을 높이는 패턴\n\n대신증권에 따르면, 미국 10년물은 올해 2월 저점 대비 약 100bp, 지난 6개월 저점 대비 약 80bp 상승한 상태다. 과거 패턴을 보면 10년물 금리가 6개월 간 100bp 가량 상승하는 시점부터 주가 조정 확률이 높아지며, 최근 6개월 데이터에 이를 적용하면 10년물 기준 5.2~5.3% 수준을 넘어설 때 주가 부담이 더 강해질 수 있다.\n\n한국 10년 국채금리도 이날 4.409%에서 4.544%로 +13.50bp 급등해 임계값 8.0bp를 크게 상회했다. 2026년 9월 28일 기준 한국 10년물은 5.2%를 하회하나, 미국 10년물이 5.2%를 상회하고 있는 상황에서 글로벌 금리 경로가 한국을 하방 압박하는 구조가 유지된다. 한국 금리가 5.2%를 넘어설 때 주가 부담이 강화된다는 패턴이 성립한다면, 한국 10년물이 5.2%를 상회할 때 주가의 추가 조정 리스크가 현실화될 수 있는 구간이다.\n\n---\n\n### 5. 달러-원 환율: 반등폭 과도성과 주가 약세의 복합 압력\n\niM증권에 따르면, 달러-원 환율은 2% 넘는 하락폭을 기록해 원화 강세 흐름을 보였다. 이는 달러-원 반등폭이 펀더멘털 대비 과도했다는 점과 주가 반등이 달러-원 약세 압력으로 작용한 결과다. 달러-엔은 158엔대까지 상승했으나, 트럼프 대통령이 미-일 정상회담에서 엔화 약세 우려를 표명하면서 상승폭이 축소됐다. 위안화는 달러 강세와 가파른 상승세 이후의 숨 고르기 영향으로 약세를 보였고, 호주 달러는 달러 강세와 5년 만에 최고치를 기록한 호주 실업률의 영향으로 전주대비 큰 폭의 약세를 기록했다.\n\n---\n\n### 6. 코스피: 반도체 강세 속 외국인·개인 동반 순매도\n\n23일 코스피는 장 초반 반도체 강세에 7,153.99로 출발했으나 추석 연휴 경계감과 차익실현에 장중 하락 전환했다가 다시 오름폭을 확대해 7,080.92로 마감했다. 기관이 3,169억원 순매수하며 지수를 방어했으나, 외국인(5,047억원)과 개인(1조 4,396억원)은 동반 순매도했다. 삼성전자(+3.25%)와 SK하이닉스(+1.20%) 등 시총 상위주가 상승했고 의료·정밀기기(+3.36%), 전기·전자(+1.95%)가 강세를 보였다. 코스닥은 개인(317억원)과 기관(64억원) 순매수 속 외국인(461억원) 순매도에 844.48로 마감했다. 유가증권시장과 코스닥시장 거래대금은 각각 20조 8,502억원, 7조 6,253억원을 기록했다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. AI 투자와 공급의 금리 압력: 5%의 시대가 열리고 있다\n\n미국 10년 미 국채 공급의 절반 이상을 차지하는 AI 기업(하이퍼스케일러 5개사 + 엔비디아)의 회사채 발행은 2026년 들어 1,871억달러에 달하며, 이는 2023~2024년 4~5% 수준에서 10배 이상 급증한 규모다. 이 기간 동안 AI 기업의 회사채 발행이 미 국채 10년물 발행량 대비 비율은 1분기에 71%까지 치솟았고, 이표채 전체 발행량 대비 비율도 1% 미만에서 9.3%(1분기 11.8%)로 급등했다. 외화 표시 채권 발행을 포함하면 2026년 AI 기업의 미 국채 공급 대비 비율은 69%, 이표채 전체 대비 12.4%에 달한다.\n\n이 기업들의 회사채 발행은 일회성이 아닌 지속적 추세다. 2025년 4분기 이후 매분기 500억~820억달러가 발행 중이며, 금리 상승으로 발행물 평균 듀레이션이 2020년 13.9년에서 2026년 8.2년으로 줄어들었음에도 불구하고 발행물량 증가로 환산 공급량은 오히려 확대되고 있다. AI 투자 확대가 장기금리 상승의 구조적 원인이 되고 있다는 점에서, 이는 단순한 시장성 공급 초과를 넘어서 자산 구조 자체의 금리 촉매로 작용한다.\n\n---\n\n### 2. 연휴 중 금리 급등: 실질금리가 기대인플레이션을 압도\n\n추석 연휴 3거래일(9/23~25) 동안 미국 10년 금리는 누적 20bp 상승했으며, 2/10년 스프레드는 30bp까지 확대됐다. 금리 상승의 구조를 TIPS 금리(실질금리)와 기대인플레이션으로 분해하면, TIPS 금리가 +20bp, 기대인플레이션이 +2bp로 상승했다. 이는 연휴 기간 금리 상승이 기대인플레이션이 아니라 실질금리가 주도했다는 명확한 증거다.\n\n실질금리 상승의 세 가지 핵심 동인은 다음과 같다:\n\n1. **견조한 성장**: 9/23 S&P PMI의 투입비용이 유가 상승에 따른 연료 운송비 급등으로 4년래 최고 수준으로 상승했으며, 9/24 신규 실업수당 청구건수(197k, 예상 201k)와 9/25 애틀란타 3분기 GDPNow(5.0%, 예상 5.1%)도 금리 상방 요인으로 작용했다. 2분기 성장률 1.5%를 감안하면 하반기 성장 가속이 뚜렷하다.\n\n2. **10월 인상 가능성**: 9/23 바 이사와 9/25 해맥 클리블랜드 연은 총재의 매파적 발언으로 시장의 10월 추가 인상 확률이 한 달 전 10% 미만에서 64%로 급등했다. 정책금리 경로 상향은 단기물보다 장기물에 더 크게 반영됐으며, 추가 인상이 일회성이 아니라 \"H4L\" 경로 자체의 상향으로 해석됐다.\n\n3. **입찰 부진과 바이백 실망**: 5년·7년 입찰 모두 부진했고, 5년물은 역대 두 번째 큰 테일(+3.1bp)을 기록하며 응찰률이 2018년 12월 이후 최저치를 기록했다. 9/24 재무부 바이백에서도 한도(60억 달러)를 채우지 못해 매도 제시 물량 104.6억 달러 중 실제 매입은 40.8억 달러에 그쳤다. 이는 \"베센트 풋\"의 한계를 시장이 인식하며 금리를 추가로 높이는 구조다.\n\n---\n\n### 3. 연준의 수요 역학: 왜 5년 금리가 가장 민감한가\n\n연준은 보고서 *Estimating Yield Impacts of Treasury Demand and Supply Changes*를 통해 5년 금리 변화에 따른 13개 보유주체별 민감도(semi-elasticity: 5년 금리 100bp 상승 시 보유량 변화율)를 평가했다. 2026년 1분기 기준 미국 시장성 국채(이표채) 잔액은 총 23조 8,220억달러. 이 중 가계·헤지펀드의 보유량은 4조 9,010억달러로 전체의 20.6%를 차지하며, 이들의 민감도는 40.53(가계 및 국내펀드 26.74, 해외펀드 3.41)로 가장 높다.\n\n반면 은행은 -6.36으로 마이너스를 기록했다. 이는 은행이 규제 목적으로 국채를 보유하면서 금리 상승 시 보유량을 줄이는 구조적 특성에서 비롯된다. 연기금과 생보는 2.69, 2.45로 낮은 민감도를 보이며, 이는 만기보유형(buy-and-hold) 투자 성격 때문이다. 해외 공공기관의 낮은 민감도(2.11)는 수익률보다 안전성과 유동성을 우선시하는 준비자산 운용 성격(exorbitant privilege)에 기인한다.\n\n이 역학은 금리 상승 시 수요가 가장 급격하게 감소하는 주체가 가계·헤지펀드임을 시사한다. 이들이 5년 금리 100bp 상승 시 보유량을 40.53%p 확대한다는 의미는, 금리 상승이 지속될수록 이들의 추가 매수 압력이 금리 상승을 억제하는 방향으로 작동할 수 있음을 보여준다. 다만 현재 시장의 불안 심리와 투매로 인해 이 역동이 즉각적으로 반영되지는 않을 것으로 보인다.\n\n---\n\n### 4. 수급의 양면성: 매수 속도는 빨라졌지만 보유는 줄어들고 있다\n\n9월 기관별 채권 수급은 매수 속도는 빨라졌지만 보유는 줄어든 모습이다. 23일 기준 주요 기관의 누적 순매수는 33.96조원으로, 8월 월간 36.72조원 대비 소폭 줄었으나(추석 연휴 및 28~30일 data 미반영), 거래일당 순매수로 보면 2.00조원으로 8월 전체의 1.84조원을 상회했다. 그러나 상환을 반영한 보유증감 기준으로는 8월 +7.93조원에서 9월 -2.59조원으로 전환됐다.\n\n수급 악화의 중심은 외국인과 만기상환이었다. 외국인은 전체 채권을 2.16조원 순매도했고, 상환도 6.70조원에 달해 보유가 8.86조원 감소했다. 국고채는 0.29조원 순매도로 만기자금이 충분히 재투자되지 않은 영향이 컸다. 자산운용은 10.36조원을 순매수했지만 상환을 차감하면 보유가 2.39조원 줄었다. 외국인의 공백은 은행과 보험·기금이 상당 부분 흡수했다. 은행 보유는 5.08조원, 보험·기금은 3.51조원 증가했으며, 국고채 매수는 은행의 5~10년물 1.05조원, 보험·기금의 20년 초과 3.12조원 등 특정 구간에 집중됐다. 같은 20년 초과에서 외국인은 0.96조원을 순매도해 초장기 수급의 주체별 차이가 뚜렷했다.\n\n---\n\n### 5. 프랑스 리스크와 미중 정상회담: 금리 상승세를 막기에는 역부족\n\n프랑스 10년 금리는 4.69%까지 상승해 2008년 이후 최고치를 기록했으며, 프랑스-독일 10년 스프레드는 2012년 유로존 위기 이후 처음으로 100bp를 넘어섰다. 르코르뉘 소수 정부는 10월 초 2027년 예산안을 제출하고 11월 17일 표결할 예정이다. 앞선 두 정부가 불신임으로 무너졌고, 2026년 예산안도 2월에야 의회 표결을 우회해 통과됐다.\n\n미중 정상회담과 이란 협상은 금리 상승세를 막기에는 역부족이었다. 미중 휴전은 11월 10일 만료 예정이던 6개월 휴전을 1월 10일까지 2개월 연장했다. 그러나 시장은 6개월 이상 연장을 기대했고, 9월 28일 세부사항을 공개했다. 11월 APEC과 12월 G20에서 보다 구체적인 방향성을 기대할 수 있다.\n\n이란 협상은 유가를 흔들었지만 기대인플레이션의 유의미한 변화는 없었다. 트럼프가 이란의 7일 휴전안을 공개 거절하며 협상이 원점으로 돌아갔다. 트럼프의 거절은 토요일 발표되어 유가와 금리에 아직 반영되지 않았고, 11월 중간선거 전까지 중동 리스크가 해소되기 어렵다는 입장을 유지한다.\n\n---\n\n### 6. AI 투자와 연준 인상의 경로: 캐리의 높아짐과 리스크 관리의 필요성\n\nAI 투자와 연준 인상 기조가 합쳐진 경로는 캐리의 높아짐과 함께 불확실성이 동시에 확대되고 있다. 미국채 장기물의 캐리 매력은 높아졌지만, 시장의 극도의 변동성과 불안이 계속되고 있다. 캐리만을 보고 진입하기에는 중장기적인 시간적 여유가 있는 투자자가 아니라면 리스크 관리가 아직 필요한 시기다.\n\nAI 투자 확대와 연준의 추가 인상 기조가 지속될 경우, 금리 상승은 단순히 전쟁 때문이 아니라 경기 대응적 성격도 강해질 수 있다. 고금리와 AI 거품의 논란이 복합적으로 작용하면서, 지표가 예상을 꾸준히 상회한다면 인상 기조가 길어질 가능성도 배제할 수 없다. 이는 채권 시장의 하방 리스크를 구조적으로 높인다.\n\n---\n\n### 7. 국내 단기시장: CP와 CD의 분기말 선제적 상승과 MMF 자금 유출\n\n국내 단기시장에서는 CP금리가 분기말을 앞두고 약 10bp가량 상승하는 움직임을 보였다. CD금리는 CP보다 분기말 등을 앞두고 선제적으로 금리가 상승하는 경향이 있었기 때문에 약 일주일 선행하며 7bp가량 상승했다. 이는 단기금리가 분기말을 앞두고 선제적으로 금리인상을 선반영하고 있는 측면이 강했기 때문이다. 다만 MMF 자금이 추석 연휴와 분기말을 앞두고 선제적으로 감소하기 시작했다. 계절적 특성상 9월말 단기시장의 추가 자금 유출폭과 회복 속도가 연말 기관 북클로징과 거래량 등에 영향을 줄 수 있기 때문에, 이는 중요한 모니터링 지표다.\n\n은행의 경우 통상 분기말 법인 자금 유입으로 예금이 증가하는 경향을 보이나, 7월 들어서면서 요구불예금 등 저원가성 수신이 지속적으로 감소해온 뒤 330조원대에서 정체해 있다. 분기말 LCR 및 NSFR 등 유동성비율 준수를 위해 시중은행의 CD 등 단기조달과 함께 은행채 순발행도 최근 증가했을 가능성이 존재한다. 수신 자금의 회복 여부와 함께 가계대출 및 기업대출(여신)의 증감 및 대출태도가 향후 은행채 발행의 주요 변수 중 하나다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 한미 원전동맹: 1,200억 달러 규모의 전략적 투자와 웨스팅하우스 지분 인수\n\n한미 정부는 미국 대형 원전 최대 8기를 건설하는 방안을 협의 중이며, 이 프로젝트는 최대 1,200억 달러 규모로 추산된다. 미국은 2000억 달러 규모의 대미 전략투자와 관련해 한국에 올해 안으로 약 100억 달러를 먼저 집행할 것을 요구했다. 이는 한국이 대미 투자금을 조기에 집행하면서 원전 건설 속도를 높일 수 있고, 한국은 사업과 무관하게 현금부터 미국에 보내는 부담을 줄일 수 있는 구조다. 미국으로서는 한국의 대미 투자금을 조기에 집행하면서 원전 건설 속도를 높일 수 있고, 한국은 사업과 무관하게 현금부터 미국에 보내는 부담을 줄일 수 있을 것이다. 원전에서는 주문에서 실제 납품까지 4~5년이 소요되는 핵심 기자재가 적지 않다. 원전 프로젝트가 본격적인 건설 단계에 들어가기 전 해당 기자재를 먼저 주문하면 전체 사업 기간을 앞당길 수 있다. 미국으로서는 한국의 대미 투자금을 조기에 집행하면서 원전 건설 속도를 높일 수 있고, 한국은 사업과 무관하게 현금부터 미국에 보내는 부담을 줄일 수 있을 것이다. 이 구조는 한국 기업들이 미국 신규 원전에 들어갈 장기 납기 기자재를 공급하게 되면 대미 투자 자금이 국내 기업의 매출로 다시 돌아오는 구조가 만들어지게 된다.\n\n한국은 IPO 공모가 대비 10% 할인된 가격으로 웨스팅하우스 지분 5~10% 확보하는 계획을 가지고 있다. 이를 통해 한국은 웨스팅하우스의 전략적 주주로서 의미 있는 의결권을 행사할 수 있을 것이다. 이는 웨스팅하우스가 미국 현지 인허가와 기본 설계를 맡고, 한국은 원전 설계와 건설·운영, 기자재 공급을 담당하는 방식의 합작법인(JV) 설립을 가능하게 한다. 한전과 웨스팅하우스가 공동으로 합작법인(JV)을 설립할 수 있을 것이다. 이는 웨스팅하우스가 미국 현지 인허가와 기본 설계를 맡고, 한국은 원전 설계와 건설·운영, 기자재 공급을 담당하는 방식이다. 한전과 웨스팅하우스가 공동으로 합작법인(JV)을 설립할 수 있을 것이다. 이는 웨스팅하우스가 미국 현지 인허가와 기본 설계를 맡고, 한국은 원전 설계와 건설·운영, 기자재 공급을 담당하는 방식이다.\n\n한국은 대미 원전투자 환경하에서 웨스팅하우스 전략적 주주로서 웨스팅하우스 협력 등을 통하여 미국 원전 프로젝트 참여 기반을 넓힐 수 있을 뿐만 아니라 한전이 주축이 된 팀코리아 원전 공급망의 미국 시장 진출 통로를 마련할 수 있을 것이다. 이와 별도로 한전과 웨스팅하우스가 공동으로 합작법인(JV)을 설립할 수 있을 것이다. 이는 웨스팅하우스가 미국 현지 인허가와 기본 설계를 맡고, 한국은 원전 설계와 건설·운영, 기자재 공급을 담당하는 방식이다. 한전과 웨스팅하우스가 공동으로 합작법인(JV)을 설립할 수 있을 것이다. 이는 웨스팅하우스가 미국 현지 인허가와 기본 설계를 맡고, 한국은 원전 설계와 건설·운영, 기자재 공급을 담당하는 방식이다.\n\n---\n\n### 2. 미국 태양광 가격 상승과 OCI 홀딩스의 수혜\n\n미국의 디젤 수출금지 가능성은 점차 낮아지는 중. 다만, EU가 Energy Price Crisis를 선언하며 정제마진 강세는 지속되고 있다. 석유화학 강보합세. BDO +11%, BPA +8%, PO/천연고무 +7% 등이 눈에 띔. 천연고무는 13년래 최대치를 기록했다. 미국의 디젤 수출금지 가능성은 점차 낮아지는 중. 다만, EU가 Energy Price Crisis를 선언하며 정제마진 강세는 지속되고 있다. 석유화학 강보합세. BDO +11%, BPA +8%, PO/천연고무 +7% 등이 눈에 띔. 천연고무는 13년래 최대치를 기록했다.\n\n한화솔루션의 경우, 온쇼어링  있다고 전망한다. 특히 9월 25일 현재 미 10년물은 5.16%로 1.60%의 Core 실질금리, 2.83%의 기대인플레이션, 0.73%의 Term Premium으로 구성돼 있다. 케빈 워시 연준의 인플레이션 파이팅 시작과 중간선거 임박으로 트럼프의 시선이 외치에서 내치로 이동할 공산이 크다는 점, 스콧 베센트 재무부의 장기금리 하향 안정화 정책이 Term Premium 하락에 긍정적으로 작용할 수 있다는 점이 기대인플레이션 제어에 기여할 수 있다.\n\n이런 맥락에서 하나증권은 금리 부담 속에서 주가를 지지한 기업 특성을 분석했다. 이익과 현금흐름이 가까운 시기에 발생하는 저듀레이션 주식은 금리 상승의 영향을 덜 받는다. 실제로 최근 저듀레이션 주식이 상대적으로 견조했는지 확인한 결과, 높은 수익성이 기대되거나 이익 전망이 상향되는 기업들이 금리 부담 속에서도 주가를 지지한 것으로 나타났다. 대신증권도 고금리 환경에서 낙폭과대와 실적대비 저평가 업종 비중 확대 전략을 지속해야 한다고 강조한다.\n\n---\n\n### 2. AI/반도체: 실적 모멘텀과 주가 정상화의 축\n\n삼성전자는 9월 8일 3분기 잠정실적 발표를 앞두고 있다. 유안타증권은 삼성전자 분기 영업이익 100조원 시대 개막을 확인할 것으로 전망하며, 이는 AI/반도체 비관론을 누그러뜨리고 국내증시의 점진적 주가 정상화를 견인할 것으로 본다. 대신증권도 삼성전자, SK하이닉스, 삼성전기, 한화에어로스페이스, HD현대일렉트릭, 대덕전자, 테스, ISC, 티엘비 등을 10월 업종대안으로 제시한다. 키움증권은 미국 하이퍼스케일러 기업들의 2026년 CAPEX 추정치가 8,437억 달러로 7월 말 대비 2.1% 상향 조정, 2027년 추정치는 1.1조 달러(3.3% 상향 조정)로 전년 대비 31% 증가할 것으로 예상하고 있으며, 미국 하이퍼스케일러 CAPEX와 매출 상관계수가 높은(0.9 이상) 국내 업종은 IT하드웨어, 전력기기, 반도체다.\n\nAI 밸류체인 기업들의 실적 모멘텀은 주가 상승을 지지하는 핵심 요인이다. 키움증권의 주간 ETF 동향에 따르면, 미국 3대 지수(SPY +1.3%, QQQ +3.2%, DIA +0.3%) 모두 강세 마감했으며, IT(XLK +3.5%), 커뮤니케이션 서비스(XLC +1.9%), 헬스케어(XLV +1.4%) 등도 강세를 보였다. 반도체(SOXX +7.4%, FTXL +7.3%, XSD +6.8%), AI 밸류체인(THNQ +6.6%, LRNZ +5.9%, IGPT +5.8%), 바이오테크(GNOM +5.7%, IDNA +4.9%, BBH +4.8%), 드론(JEDI +4.2%), 건설/인프라(BULD +4.0%, EEMO +4.0%), 데이터 처리/활용(DAT +3.9%, TRFK +3.7%, XDAT +3.6%), 로봇/자동화(PBOT +3.5%, ROBO +3.3%, IBOT +3.0%) 등 테마 역시 강세를 보였다.\n\n---\n\n### 3. 유가와 지정학: 하락의 정점과 관망의 전환\n\n국제유가는 미국과 이란 간 협상 기대와 사우디 동서 송유관 재가동으로 하락세를 보였다. WTI 선물은 90달러를 하회했고, 브렌트유 선물은 100달러 아래로 내려왔다. 트럼프 대통령은 11월 중간선거 전까지 이란과 평화무드 형성, 유가 안정, 지지율 회복을 모색하겠다고 밝혔으며, 이란도 미군의 해상 봉쇄 해제를 전제로 호르무즈 해협을 개방할 수 있다는 입장을 표명했다. 사우디는 드론 공격으로 중단됐던 동서 송유관 가동을 9월 22일 재개해 원유 공급 차질 우려를 완화했다.\n\n그러나 유가 하락의 정점 여부는 아직 확정적이지 않다. 하나증권은 국제유가의 변동성 확대 리스크가 여전하다고 지적하며, 미국과 이란 간 전쟁이 발생했던 3월 중 국제유가 선물시장에서 투기적 매도 대비 매수 포지션 비율 고점이 4.1배(러/우 전쟁 당시 9.2배)까지 상승했지만, 8~9월 고점은 2.4배로 크게 낮아졌다고 분석했다. 이는 전쟁 리스크에 대한 가격 민감도가 둔화된 반증이다.\n\n---\n\n### 4. 연준 긴축의 경로와 10월 1회 인상 전망\n\n9월 FOMC 이후 시장은 10월 1회, 2027년 1월, 3월, 9월 추가 3회 등 총 100bp(Terminal rate 4.75~5.00%)의 Most/Long-term Hawkish 연준 금리인상을 상정하고 있다. 그러나 유안타증권은 연준 정책금리 변화와 밀접한 상관성을 갖는 미국 GDP Gap의 2026년 이후 음(-) 전환 전망(IMF), 추세적 수요견인(Demand-pull) 형태가 아닌 트럼프發 일시적 공급충격(Cost-push)에 기인한 상품/에너지 주도 현 인플레이션 압력의 특수성, 고용시장 질적/양적 둔화와 노동비용 하락이 역설하는 핵심/서비스 물가의 Disinflation 추세화 기대, 근원 물가의 40%가량을 차지하는 주거비의 추세적 하향 안정화 여지, 기업/가계측 자금난 및 신용경색 기류 심화 등을 고려할 경우, 실제 연준의 선택은 Less/Short-term Hawkish 수준의 1~2회 추가 인상 정도로 한정될 수 있다고 판단한다.\n\n실제로 9월 23일 미국 5년물 입찰은 부진한 수요 속 5.033%에 낙찰돼 직전 입찰(4.393%) 대비 64.0bp 급등한 수준으로, 2006년 6월 이후 최고 낙찰금리를 기록했다. 10년물 금리는 9월 23일 5.11%로 마감하며 2007년 7월 이후 최고치를 경신했다. 미국 10년물 금리가 5%를 넘어선 S&P500 기준 일드갭은 3bp로 2004년 이후 최저 수준으로 채권 대비 주식 투자 매력이 소멸되기 직전이다. 그러나 국제유가 하락이 S&P500지수의 조정 압력을 완화했다는 점은 주식 시장에 긍정적인 신호로 작용한다.\n\n---\n\n### 5. 미중 정상회담: 휴전 연장과 실질 성과의 이중성\n\n9월 23~25일 시진핑의 워싱턴 국빈 방문은 기대에는 조금 못 미쳤지만, 휴전은 일단 이어졌다. 11년 만의 국빈 방미에 의전은 5월 베이징 때보다 화려했고, 실질 성과는 세 가지로 압축된다. 11월 10일 만료 예정이던 관세 휴전이 내년 1월 10일까지 늘었고, 5월에 이름만 걸어뒀던 무역위원회가 실제로 돌아가기 시작했으며, AI 대화 채널이 열렸다. 이 중 실질적인 결과는 무역위원회를 통해 양쪽이 각각 $300억 규모 비민감 품목에 관세 우대를 주기로 한 것이다. 미국은 농산물·의료기기, 중국은 소형가전·장난감이 대상이다. 연장 기간이 시장이 바란 6개월 이상이 아닌 2개월에 그친 점은 아쉽지만, 여기에는 미국의 의도가 담겨 있다. 지난해 부산과 5월 베이징에서 받아낸 대두·보잉 등 구매 약속이 기대만큼 이행되지 않았기 때문이다. 그래서 미국은 이번에는 약속을 더 쌓는 대신 짧은 시한을 걸고 이행을 지켜보는 쪽을 택했고, 무역위원회는 그 점검을 상시화하는 창구다.\n\n성과보다 눈에 띄는 것은 빠진 항목이다. 대만·반도체·희토류가 모두 다음 회담으로 넘어갔고, 희토류 역시 공급 정상화에 대한 구체적 합의가 없었다. 지난해 봄 중국의 희토류 수출통제는 미국·유럽 자동차 생산을 멈추기 직전까지 몰고 가며 10월 휴전을 이끌어냈다. 이처럼 희토류는 중국의 주요 협상 수단이며, 구체적 합의가 없었던 것은 다른 쟁점의 진전 없이 먼저 양보하기는 어려웠을 가능성이 있다. 실제로 8월 대미 희토류 자석 수출은 전월보다 20% 줄었고, 미국 행정부도 중국의 약속 이행률을 3분의 2 정도로 평가한다. 공급을 조금씩 조이면서 1월 재협상까지 우위를 점하려는 의도인 것이다.\n\n---\n\n### 6. 인도: 연내 기준금리 인상 가능성 확대\n\n인도 역시 연내 기준금리 인상 가능성이 점차 부각되고 있다. 8월 헤드라인 CPI는 YoY 4.82% 상승해 7월 4.45% 대비 오름폭이 확대됐으며, 컨센서스 4.80%도 소폭 상회했다. 몬순 강우 부족에 따른 농산물 가격 상방 압력이 이어지는 가운데 식품 CPI는 YoY 5.95% 상승했다. 무엇보다 그동안 안정적인 흐름을 보였던 근원물가도 7월 3.8%에서 8월 4.2%로 상승하면서 물가 압력이 식품이나 에너지와 같은 변동성이 높은 품목에 국한되지 않고 점차 광범위해지는 모습이다.\n\nRBI가 과잉 유동성을 적극적으로 흡수하고 있다는 점도 주목할 필요가 있다. 6월 3~5년 만기 신규 FCNR(B) 예금에 대한 FX스왑 창구를 재도입한 이후 대규모 외화자금이 유입되면서 은행권 내 초과 유동성이 크게 확대됐다. 실제로 8월 이후 단기 시장금리가 기준금리를 지속 하회하는 흐름이 나타나면서 과잉 유동성에 대한 우려가 제기되어 왔다. 이에 RBI는 역레포(VRRR)와 OMO 매각 등을 통해 유동성 흡수에 나서고 있는데, 시장에서는 이러한 조치를 통화정책의 전달력을 높이기 위한 움직임으로 해석하고 있다.\n\n---\n\n### 7. 투자 전략: 금리 리스크 안전지대와 실적 서프라이즈\n\n금리 리스크 안전지대 투자대안 옥석 가리기는 고금리 환경에서 핵심 전략이다. 유안타증권은 高퀄리티 실적주(표 4, 5)가 시장과 연준간 시각차가 충분히 좁혀지기 전까지 당분간 Bear-Flattening 금리 환경 내 시장 대비 초과성과 확보가 가능한 투자대안으로 제시한다. 과거 Bear-Flattening 금리 환경 내 실적 모멘텀과 안정적 가격 전가력을 겸비한 투자대안이라면 관련 불확실성에 대한 충분한 대비가 가능하다는 분석이다.\n\n대신증권은 낙폭과대 및 실적대비 저평가 업종 비중 확대 전략을 지속해야 한다고 강조하며, 9월 30일 PCE 물가와 마이크론 실적 발표를 주요 이벤트로 제시한다. 8월 헤드라인 PCE 3.7%, 근원 PCE 3.4%(전년대비) 컨센서스와의 괴리가 10월 FOMC 50% 이상의 25bp 인상 확률과 채권금리 등락 결정의 핵심 변수가 될 전망이다. 마이크론 실적 시장 기대치는 매출 $52B 전후, EPS $32.5~33, 다음 분기 가이던스와 GM이 $56.9B, GM 86% 상회 여부가 관건이다.\n\n---\n\n### 8. 우주 산업: 발사체가 단기 승부처로 부상\n\n상업 우주 패권 경쟁은 과거의 단순한 도달 경쟁에서 벗어나 궤도, 주파수 등 우주 인프라를 선점하는 경쟁으로 전환되고 있다. 특히 저궤도는 통신 지연이 낮아 위성통신과 지구관측 등 다양한 분야에서 활용도가 높아 대규모 위성망 구축이 빠르게 진행되고 있다. 수천~수만 기의 위성을 단기간에 배치하기 위해서는 안정적인 발사 능력과 낮은 발사 비용이 필수적이며, 이에 따라 발사체가 우주산업의 단기적인 승부처로 부상하고 있다.\n\n중국 역시 GW와 Qianfan 등 대규모 저궤도 위성망 구축을 추진하면서 발사 수요가 빠르게 증가하고 있고, 기존 국가 주도의 창정(長征) 계열 로켓에 더해 LandSpace, Orienspace 등 민간 발사체 기업이 실제 위성 발사에 참여하면서 발사체 공급원이 다변화되고 있다. 하나증권은 우주 산업의 승부의 출발점이 로켓임을 강조한다.\n\n---\n\n### 9. ETF 포트폴리오: AI 밸류체인과 저듀레이션 주식의 이원화\n\n키움증권의 주간 ETF 동향에 따르면, 미국 3대 지수(SPY +1.3%, QQQ +3.2%, DIA +0.3%) 모두 강세 마감했으며, IT(XLK +3.5%), 커뮤니케이션 서비스(XLC +1.9%), 헬스케어(XLV +1.4%) 등도 강세를 보였다. 반도체(SOXX +7.4%, FTXL +7.3%, XSD +6.8%), AI 밸류체인(THNQ +6.6%, LRNZ +5.9%, IGPT +5.8%), 바이오테크(GNOM +5.7%, IDNA +4.9%, BBH +4.8%), 드론(JEDI +4.2%), 건설/인프라(BULD +4.0%, EEMO +4.0%), 데이터 처리/활용(DAT +3.9%, TRFK +3.7%, XDAT +3.6%), 로봇/자동화(PBOT +3.5%, ROBO +3.3%, IBOT +3.0%) 등 테마 역시 강세를 보였다.\n\n반면, 유틸리티(XLU -3.9%), 에너지(XLE -3.5%), 리츠(XLRE -2.3%) 등은 약세를 기록했다. 이 외에도 반도체(SOXX +7.4%, FTXL +7.3%, XSD +6.8%), AI 밸류체인(THNQ +6.6%, LRNZ +5.9%, IGPT +5.8%), 바이오테크(GNOM +5.7%, IDNA +4.9%, BBH +4.8%), 드론(JEDI +4.2%), 건설/인프라(BULD +4.0%, EEMO +4.0%), 데이터 처리/활용(DAT +3.9%, TRFK +3.7%, XDAT +3.6%), 로봇/자동화(PBOT +3.5%, ROBO +3.3%, IBOT +3.0%) 등 테마 강세를 기록했다. 이는 AI 밸류체인 기업들의 실적 모멘텀이 ETF 투자자들의 선호를 끌어올리는 구도를 반영한다.\n\n---\n\n### 10. 주요 이벤트: 10월 1일 FOMC, 9월 30일 PCE, 11월 3일 중간선거\n\n10월 1일 10월 FOMC가 열리며, 10월 1회 인상 확률이 시장에 반영될 예정이다. 9월 30일 PCE 물가 발표는 8월 헤드라인 PCE 3.7%, 근원 PCE 3.4%(전년대비) 컨센서스와의 괴리가 10월 FOMC 25bp 인상 확률과 채권금리 등락 결정의 핵심 변수가 될 전망이다. 11월 3일 중간선거는 트럼프의 시선이 외치에서 내치로 이동할 공산이 크다는 점에서 중동 지정학 리스크 완화 기대에 긍정적으로 작용할 수 있다. 이는 기대 인플레이션 제어에 기여할 것으로 예상된다.\n\n---\n\n### 결론: 금리 피크아웃과 AI 실적 모멘텀의 시너지\n\n10월 FOMC 금리동결과 미 재무부의 장기금리 하향 안정화 정책 총력전은 시장금리 피크아웃 전환을 자극할 수 있다. 고금리 환경에서도 AI/반도체 실적 모멘텀과 저듀레이션 주식의 견조성은 주가 정상화를 견인할 핵심 요인이다. 미국과 이란 간 협상 기대와 사우디 공급망 회복은 국제유가 하향 안정화를 이끌고 있으며, 미중 정상회담 기대감은 중동 리스크 완화와 유가 하락을 통해 주식 시장에 긍정적 영향을 미친다. 그러나 유가 하락의 정점 여부는 아직 확정적이지 않으며, 트럼프의 11월 중간선거 이후 이란과의 협상 타결 가능성이 이슈로 남아 있다. 금리 리스크 안전지대 투자대안 옥석 가리기와 AI 실적 서프라이즈 기대주는 10월 주식시장 전략의 핵심이다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n매크로, 채권, 산업섹터 분야의 요약을 종합하면, 현재 시장은 구조적 요인과 단기적 수급 변화가 복합적으로 작용하는 상황이다. 원화 강세는 구조적 달러 수요에 기반하고 있으며, 미국 경제의 AI 투자 사이클 강세와 고금리 기조가 지속되며 채권 시장에 압력이 가해지고 있다. 한편, 한미 원전 동맹과 미국 태양광 시장의 변화는 산업별 투자 기회를 제시하고 있다. 이처럼 시장은 다양한 요인의 상호작용 속에서 변동성이 커지고 있어, 단기적인 수급 체크메이트와 장기적 구조 변화의 균형을 고려한 접근이 필요하다."}]}</script>
