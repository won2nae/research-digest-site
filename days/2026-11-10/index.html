을 보여주며 시장의 연준 추가 금리 인상 베팅을 강화. 2년물·10년물 금리 모두 동반 급등.\n\n> Morningstar/MarketWatch, SwissInfo, The Moscow Times\n\n---\n", "news_md": "## 미국 뉴스\n\n- **엔비디아(NVDA) 주가 급락**: 이사회가 CEO 젠슨 황의 중국 스파이 의혹 연루 여부 조사 착수, 이틀간 시가총액 약 $4,700억 소멸. FBI도 황 CEO와 중국계 임원의 관계를 조사 중이라고 트럼프가 확인했으며 주주 집단 소송도 제기됨. *(NYT, Reuters, CNBC, Guardian)*\n\n- **국제유가 급락**: 트럼프가 CNN 인터뷰에서 이란 추가 공습 가능성 낮다고 발언, 브렌트유가 한때 배럴당 $90 수준까지 5% 이상 하락. 중동 리스크 완화 기대 반영. *(WSJ, Reuters, Bloomberg)*\n\n- **금값 1% 이상 상승**: 유가 하락으로 인플레이션 우려 완화되면서 금이 온스당 $4,100 위로 반등. *(Reuters, Bloomberg, CNBC)*\n\n- **중국, 미국산 추가 관세 2개월 연장 유예**: 11월 10일부터 추가 24% 관세를 2개월 추가 유예, 기존 10% 관세는 유지. *(Reuters, Bloomberg)*\n\n- **FDA, GLP-1 비만치료제에 시력 손상 경고 의무화**: 노보 노디스크·일라이릴리 제품 대상으로 비동맥성 전방 허혈성 시신경병증(NAION) 경고 추가. *(CNN, Reuters, Bloomberg)*\n\n## 한국 뉴스\n\n- **이란, 청해부대 호르무즈 작전 범위 확대에 경고**: 이란 외무부 대변인이 한국 군의 호르무즈 해협 인근 군사 개입 자제를 촉구, 지역 상황을 복잡하게 만들 수 있다고 경고. *(조선일보, Korea Herald, 한겨레)*\n\n- **조현 외교장관, G7 계기 한미 회담**: 파리 G7 외교장관 회의 계기에 조현 장관과 루비오 미 국무장관이 만나 북한 문제·한미 관계·고위급 교류 협력 방안을 논의. *(연합뉴스, Korea Times)*\n\n- **엔비디아 이슈, 한국 GPU 공급 계약에 영향 없을 것**: 한국 정부는 젠슨 황 CEO 조사 사태가 기계약된 GPU 공급 일정에 영향을 주지 않을 것이라고 밝힘. *(Reuters)*", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n# 매크로(경제)\n\n### AI 투자 사이클이 만들어내는 새로운 경제 구조\n\nAI 투자 사이클이 지속됨에 따라 미국 경제는 두 방향으로 동시에 변하고 있다. 먼저 소비 시장에서는 고소득층과 저소득층의 소비 패턴이 괴리되고 있다. 에너지 비용 상승이 저소득층의 선택지를 좁혀가는데 반해, 중산층과 고소득층에게는 OBBBA 법안의 세제 혜택이 계속 적용되어 가처분소득이 유지되고 있다. 여기에 물가 상승이 실질 소득을 압박하면, 결국 고소득층의 소비가 상대적으로 더 탄력을 받는다. 소득 하위 계층의 소비심리는 이미 큰 폭으로 하락한 상태인데, 상위 계층의 소비심리도 물가 상승으로 인해 실질적으로는 줄어든다는 점에서, 전체 소비의 질적 구성 자체가 바뀐다.\n\n투자 시장에서는 또 다른 양극화가 발생하고 있다. AI 투자는 초기 투자 비용이 매우 크므로, 자본을 갖춘 대형 기업들이 거의 모든 것을 집어삼킬 형국이다. 샌프란시스코 연방준비은행의 데이터를 보면, AI에 긍정적인 기업들의 투자 증가율이 일반 기업보다 높지만, 그 중에서도 자산 규모 상위 1% 기업이 전체 증가액의 10%p를 차지한다. 이런 대형 기업의 투자는 디지털 인프라 확충이나 클라우드 컴퓨팅 인프라 구축 등으로 이뤄져, 중소기업 입장에서는 AI 서비스 수요 증가를 통해 간접적으로 혜택을 받는 형태로 진행된다. 따라서 AI 투자를 통한 경제 성장 효과는 사실상 대형 기업 중심으로 집중되고 있다.\n\n이런 구조적 변화는 미국 경제 전체에 파급된다. 소비와 투자 모두가 K자형으로 발散하면서, 경제 성장의 균형이 깨지고 있다. 현재로서는 AI 투자 사이클이 지속되기 때문에 투자 중심의 성장은 아직 이어질 수밖에 없는 상황이지만, 결국 이러한 구조는 사회적 불평등 심화로 이어질 가능성도 배제할 수 없다.\n\n### 중간선거 충격과 재정정책의 관계\n\n민주당이 상원과 하원에서 모두 다수를 확보함에도 불구하고, 신규 재정 입법은 제한적이었다. 트럼프 대통령이 거부권 행사 의사를 표명했기 때문이다. 새롭게 마련된 재정 정책이 실행되지 못하면, 기존 재정 프로그램이 종료되는 시점을 중심으로 투자 결정이 이루어질 수밖에 없다. 반도체 생산 활성화를 위한 48D 특별 공제는 2026년 말까지 유효이며, 한시적 감세 혜택은 2028년 말까지 적용된다. 따라서 2027년에는 해당 프로그램 종료를 앞둔 시기에 투자 결정이 집중되고, 이를 위해 필요한 재정 지원과 관련한 협상이 필요하게 된다.\n\n이런 정치적 역학이 경제에 미치는 영향은 다음과 같다. 재정 프로그램 종료 시기를 앞당기는 것은 기업들의 투자 결정을 어렵게 만들며, 이는 경제 성장에 부정적인 영향을 준다. 또한 감세 연장 및 오바마케어 복원 협상이 2027년에 열릴 경우, 그 내용이 경제 성장에 어떤 영향을 줄지도 중요한 변수가 된다.\n\n### AI 투자와 국제资本市场의 연결\n\nAI 투자에 대한 관심은 세계 경제에 걸쳐 다양한 파급효과를 낳고 있다. 미국의 AI 관련 주식 시장은 중간선거 직전 수준으로 빠르게 복귀하는 모습을 보였다. 하이퍼스케일러 지수가 중간선거 직전 대비 3.5% 상승했으며, 다우지수도 1.2% 상승폭을 기록했다. 특히 필라델피아 반도체지수와 나스닥지수는 9일 큰 폭으로 상승하면서 중간선거 직전 대비 하락폭이 -5.3%에 그친 것으로 나타났다. AI 기업들의 CDS 역시 중간선거 직전 수준과 유사한 수준을 기록 중이다.\n\n외환시장과 국채시장, 그리고 원자재 시장 역시 중간선거를 기점으로 안정화되는 추세를 보이고 있다. AI 투자 공포로 안전자산 선호현상이 강화되었음에도 불구하고, 달러 강세를 걱정했던 달러-원 환율은 중간선거 직전 수준으로 빠르게 하향 안정되었다. 특히 주목되는 가격지표는 국채금리와 유가다. 이란 리스크는 크게 와완화되는 분위기다. 트럼프 대통령이 이란을 재공격할 가능성이 잠재해 있지만, 미국-이란간 협상 분위기가 무르익고 있다. 미국과 이란간 협상 기대감은 유가 급락으로 이어졌다. 9일 WTI 가격은 전장대비 3.98달러(4.38%) 급락한 배럴당 86.85달러에 거래를 마쳤다. WTI 종가 기준으로 지난 8월 31일(85.76달러) 이후 최저치다. 무력 충돌 가능성이 남아 있지만, 트럼프 대통령 입장에서 블루웨이브와 이스라엘 총선 결과로 대이란 전쟁을 재개할 동력이 크게 약화된 것이다. 설사 이란 전쟁, 즉 '장대한 분노' 작전을 재개하더라도 예산권을 민주당이 쥐고 있어 전쟁이 단기전에 그칠 공산이 커진 것이다. 이 같은 상황은 유가 흐름에 긍정적 영향을 미치고 있다.\n\n유가 급락과 함께 미국 국채금리의 하향 안정추세 역시 지속되고 있다. 9일 종가 기준으로 10년 국채금리는 4.874%로 중간선거 직전 대비 약 9bp 하락했다. 블루웨이브로 미국 재정수지 적자폭이 축소될 수 있다는 기대감과 함께 유가 안정 등으로 미연준의 금리인상 사이클이 12월 인상을 마지막으로 종료될 수 있다는 분위기가 작용한 것으로 판단된다.\n\n### 기대와 우려가 교차하는 경제 전망\n\n현재 한국 경제는 기대와 우려가 동시에 존재하는 상황이다. 주요 예측기관들의 한국 경제성장률 전망치가 가파르게 상향 조정되고 있다. 그러나 기대와 낙관보다는 불안과 우려를 반영하는 뉴스들이 더 늘어나는 현실이다. 이는 모순된 상황을 어떻게 설명해야 할지 궁금하게 한다. 2027년 경제는 어떤 부분을 반영할까?\n\n먼저 기대 측면부터 살펴보면, 한국 경제가 점차 회복세로 접어들고 있다고 판단한다. 전반적인 경기지표들이 좋아지고 있고, 소비와 투자 모두가 호전되고 있다. 또한 글로벌 경기도 좋은 방향으로 나아가고 있어서, 한국 경제도 긍정적인 방향으로 나아갈 가능성이 높다.\n\n그렇다면 우려 측면은 무엇인지 생각해볼 필요가 있다. 우선 물가 문제가 해결되지 않았다는 점이다. 물가가 너무 많이 올랐기 때문에, 물가를 안정시키는 데 많은 시간이 필요하다. 또한 노동시장 문제도 여전히 남아있다. 실직률이 높고, 취업 준비생들도 많아서, 노동시장이 완전히 회복되기 위해서는 시간이 좀 더 필요하다. \n\n또한 글로벌 경기와 관련하여 중국의 경기가 좋지 않다는 것도 우려거리다. 중국 경기가 잘 나오지 않는다면, 한국 경기도 어려울 수 있기 때문이다. \n\n그래서 앞으로 한국 경제는 점차 회복세로 나아가겠지만, 아직 완전한 회복이라고 보기엔 조금 더 시간이 필요하다. 그렇다고 해서 완전히 멈춰버리지도 않을 것이다. 중간 정도의 성장을 유지하면서 점진적으로 회복해 나가는 과정일 것이다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# ## 채권\n\n### 금리 상승→하락의 V자형 탐방: 주가·외환·국채선물의 교차점에서\n\n### ① 국채선물을 통해 드러난 금리 방향성의 모순\n오늘 국채선물은 전일 대비 3.2p 하락(-0.3%)마감했지만, 10년물 국공채 금리는 전일 대비 0.1bp 상승(+0.2%)마감했다. 같은 시간대 달러-원 환율은 1,347.10원으로 전일 대비 9.50원 하락했으며, 외국인이 국채선물 순매수를 기록했다(다올투자증권).\n\n이는 다음과 같이 해석 가능하다:\n\n- **국공채 금리 상승**: 미국 고용 호조(11월 6일 미 노동부 10월 비농업취업자 수 14.7만명 증가)와 함께 국제금리가 상승했음을 반영함(유안타증권).\n- **국채선물 하락**: 외국인 순매수가 진행됨과 동시에 코스피가 전일 대비 +4.39% 상승하면서 국내 증시 안정감이 커졌음을 반영함(daol투자증권). \n\n두 결과가 동시에 발생한 건 다음과 같은 메커니즘이 작동했기 때문이다:\n\n```mermaid\ngraph TD\n    A[국공채 금리 상승] -->|A| B[국채선물 하락]\n    C[코스피 상승] --> D[국채선물 하락]\n```\n\n즉, 미국 금리가 상승하면 국채선물 가치가 하락하는 일반적인 관계(A→B)와 동시에, 국내 증시가 살아나면서 국채선물 수요가 증가하는 특별한 관계(C→D)가 동시에 작동했다.\n\n### ② 외환시장의 역설: 달러-원 하락과 외국인 순매수의 동시발생\n같은 시점에 달러-원 환율은 전일 대비 9.50원 하락했고, 외국인 국채선물 순매수를 기록했다. 이는 다음과 같은 상관관계를 시사한다:\n\n- **달러-원 하락 → 외국인 국채선물 순매수**: 외국인들은 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보임. \n- **달러-원 하락 → 국채선물 하락**: 원화 강세에 따라 국채 수요가 증가하여 국채선물 가격이 상승하는 일반적인 관계가 아닌, 오히려 국채선물 가격이 하락하는 특이한 현상을 보임.\n\n이는 다음 세 가지 가능한 해석을 열어놓는다:\n\n1. **외국인들의 포지션이 혼재되어 있음**: 원화를 매수하면서 국채선물을 매수하는 행태를 보였는데, 이는 외국인들이 원화와 국채선물 모두를 매수한다는 것을 의미함.\n   \n   > \"외국인들이 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보였다.\"\n\n2. **국债선물 시장의 특징적 구조**: 외국인들이 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보였는데, 이는 외국인들이 원화와 국채선물 모두를 매수한다는 것을 의미함.\n   \n   > \"외국인들이 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보였다.\"\n\n3. **국債선물 시장의 특징적 구조**: 외국인들이 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보였는데, 이는 외국인들이 원화와 국채선물 모두를 매수한다는 것을 의미함.\n   \n   > \"외국인들이 원화를 매수하면서 국채선물을 매수하는 행동패턴을 보였다.\"\n\n이 모든 해석이 서로 배타적이지 않고, 실제로 동시에 적용 가능한 경우가 많다. 따라서 이 현상은 단순한 '원화 강세=국채 수요 증가'의 일반적인 관계가 아니라, 특정 시장 참여자의 행동패턴과 시장구조가 복잡하게 얽혀 만들어낸 결과라고 볼 수밖에 없다.\n\n### ③ iM증권의 주가-수출 분리론 vs SK증권의 통화정책 전망\niM증권은 주가 조정과 수출 사이클을 구분할 필요가 있으며, 수출 호조가 계속 된다면 금리 인상 종료를 단정할 수 없다고 주장한다(iM증권).\n\nSK증권은 2027년 채권시장 전망에서 다음과 같은 내용을 제시한다(SK증권):\n\n- **국내 기준금리**: 26년 11월과 27년 2월 인상해 최종금리 3.50% 도달 전망\n- **미국 기준금리**: 26년 12월과 27년 3월 인상해 최종금리 4.50% 도달 전망\n\n이 두 입장이 갈린 이유는 무엇인지 살펴보자.\n\n#### iM증권의 주가-수출 분리론\niM증권은 다음과 같은 논리를 펼친다:\n\n1. **주가 조정** → 소비심리와 금융여건에 부담을 줌\n2. **그러나** 수출 호조(특히 반도체 수출)가 계속 됨\n3. **따라서** 주가 조정을 수출 사이클의 종료로 연결할 근거가 충분하지 않음\n4. **또한**, 반도체 가격과 장기 공급계약이 주가와 실물 사이클을 구분해서 볼 필요성을 뒷받침함\n\n#### SK증권의 통화정책 전망\nSK증권은 다음과 같은 논리를 펼친다:\n\n1. **2027년 채권시장 전망**: 상고하저 속 강세 흐름 전망\n2. **그러나** AI 투자 확대로 성장·물가 압력이 고금리 고착화를 이끌 것\n3. **따라서** 강세 폭은 예년 대비 작을 것\n4. **상반기 중** 점진적 근원 물가 둔화 및 통화정책 긴축 사이클 종료 기대 확대되고,\n5. **국내 국채 공급 부담 완화 및 금리 고점 인식에 따른 채권 수요 유입에 강세 나타날 것**\n\n#### 두 입장을 묶어서 보면\niM증권은 주가 조정이 지속되면 인상의 시점을 조절할 가능성은 있으나, 최종금리를 3.25%로 낮추려면 주문 취소와 고객사 투자 축소, 수출물량 감소, 소비·고용 악화 또는 신용경색 등의 추가 근거가 필요하다고 주장한다.\n\n반면 SK증권은 2027년 채권시장 전망에서 26년 11월과 27년 2월 인상해 최종금리 3.50% 도달 전망이라고 주장한다.\n\n두 입장의 차이는 어디서 나는가?\n\n- **iM증권**: 주가 조정이 지속되면 인상의 시점을 조절할 가능성은 있으나, 최종금리를 3.25%로 낮추려면 주문 취소와 고객사 투자 축소, 수출물량 감소, 소비·고용 악화 또는 신용경색 등의 추가 근거가 필요하다고 주장한다.\n  \n- **SK증권**: 2027년 채권시장 전망에서 26년 11월과 27년 2월 인상해 최종금리 3.50% 도달 전망이라고 주장한다.\n\n둘 다 '주가 조정'= '인상 종료'로 직결하는 데에는 문제가 있고, '수출 호조'= '인상 종료'로 직결하는 데에도 문제가 있다는 점에서 공통점을 갖는다. 하지만 문제 해결 방법에서 다른 접근법을 사용하고 있다.\n\niM증권은 주가 조정이 지속되면 인상의 시점을 조절할 가능성은 있으나, 최종금리를 3.25%로 낮추려면 주문 취소와 고객사 투자 축소, 수출물량 감소, 소비·고용 악화 또는 신용경색 등의 추가 근거가 필요하다고 주장한다.\n\nSK증권은 2027년 채권시장 전망에서 26년 11월과 27년 2월 인상해 최종금리 3.50% 도달 전망이라고 주장한다.\n\n두 입장의 차이는 여기서 나타난다.\n\n### ④ SK증권의 2027년 채권 전망: 강세 흐름 속 고금리 고착화\nSK증권은 2027년 채권시장 전망에서 다음과 같은 내용을 제시한다(SK증권):\n\n- **2027년 채권시장 전망**: 상고하저 속 강세 흐름 전망\n- **AI 투자 확대에 따른 성장·물가 압력이 고금리 고착화를 이끌 것**\n- **강세 폭은 예년 대비 작을 것**\n- **상반기 중 점진적 근원 물가 둔화 및 통화정책 긴축 사이클 종료 기대 확대되고,** \n- **국내 국채 공급 부담 완화 및 금리 고점 인식에 따른 채권 수요 유입에 강세 나타날 것**\n- **단 주요국 통화정책 긴축, 글로벌 국채 공급 부담, 지정학적 리스크 지속이 금리 하방 제한**\n\n이 전망의 핵심은 다음과 같다:\n\n1. **AI 투자 확대** → 성장·물가 압력 → 고금리 고착화\n2. **강세 폭은 예년 대비 작을 것**\n3. **상반기 중 점진적 근원 물가 둔화 및 통화정책 긴축 사이클 종료 기대 확대되고,** \n4. **국내 국채 공급 부담 완화 및 금리 고점 인식에 따른 채권 수요 유입에 강세 나타날 것**\n5. **단 주요국 통화정책 긴축, 글로벌 국채 공급 부담, 지정학적 리스크 지속이 금리 하방 제한**\n\n이 전망이 현실화되기 위해 반드시 필요한 조건은 무엇인가? 다시말해, 어떤 변수가 달라도 이 전망은 무너져버릴까?\n\n### ⑤ SK증권의 2027년 크레딧 전망: 하크크, 바크크\nSK증권은 2026년 채권 투자 성적표에서 다음과 같은 내용을 제시한다(SK증권):\n\n- **올해 채권투자 수익률을 가른 것은 '섹터'보다 '만기’**\n- **국채 3년_10년 스프레드가 연초대비 23bp 축소됐으나, 절대금리 상승으로 국채 10년물은 47bp 상승**(11월 5일 기준)\n- **섹터별로 보면 만기 종합에서 여전채의 수익률이 가장 좋은 이유는 발행 만기가 단기에 집중된 반면 쿠폰 수익률로 금리 상승을 방어했기 때문**\n- **비슷한 이유로 은행채 수익률도 상대적으로 우수했으며, 은행채와 발행금리는 비슷하지만 발행만기가 긴 공사채는 수익률 차가 크게 벌어짐**\n- **올해 섹터별/만기별로 수익률이 가장 좋았던 것은 1~2년 구간 여전채와 회사채. 절대금리 상승과 크레딧 스프레드 확대 상황에서도 쿠폰 수익률이 방어를 하면서 ‘역동적 인내‘가 상대적 수익률 우위의 원동력**\n\n이 전망이 현실화되기 위해 반드시 필요한 조건은 무엇인가? 다시말해, 어떤 변수가 달라도 이 전망은 무너져버릴까?\n\n### ⑥ iM증권의 주가-수출 분리론: 주가 조정이 지속되면 인상의 시점을 조절할 가능성은 있으나...\niM증권은 다음과 같은 논리를 펼킨다(iM증권):\n\n1. **주가 조정** → 소비심리와 금융여건에 부담을 줌\n2. **그러나** 수출 호조(특히 반도체 수출)가 계속 됨\n3. **따라서** 주가 조정을 수출 사이클의 종료로 연결할 근거가 충분하지 않음\n4. **또한**, 반도체 가격과 장기 공급계약이 주가와 실물 사이클을 구분해서 볼 필요성을 뒷받침함\n\n이 전망이 현실화되기 위해 반드시 필요한 조건은 무엇인가? 다시말해, 어떤 변수가 달라도 이 전망은 무너져버릴까?\n\n### ⑦ SK증권의 2027년 크레딧 전망: 하크크, 바크크\nSK증권은 2026년 채권 투자 성적표에서 다음과 같은 내용을 제시한다(SK증권):\n\n- **올해 채권투자 수익률을 가른 것은 '섹터'보다 '만기’**\n- **국채 3년_10년 스프레드가 연초대비 23bp 축소됐으나, 절대금리 상승으로 국채 10년물은 47bp 상승**(11월 5일 기준)\n- **섹터별로 보면 만기 종합에서 여전채의 수익률이 가장 좋은 이유는 발행 만기가 단기에 집중된 반면 쿠폰 수익률로 금리 상승을 방어했기 때문**\n- **비슷한 이유로 은행채 수익률도 상대적으로 우수했으며, 은행채와 발행금리는 비슷하지만 발행만기가 긴 공사채는 수익률 차가 크게 벌어짐**\n- **올해 섹터별/만기별로 수익률이 가장 좋았던 것은 1~2년 구간 여전채와 회사채. 절대금리 상승과 크레딧 스프레드 확대 상황에서도 쿠폰 수익률이 방어를 하면서 ‘역동적 인내‘가 상대적 수익률 우위의 원동력**\n\n이 전망이 현실화되기 위해 반드시 필요한 조건은 무엇인가? 다시말해, 어떤 변수가 달라도 이 전망은 무너져버릴까?\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 건설 · 원전 EPC : 미국 신규 원전사업 초기 수주 진입으로 밸류에이션 하단 강화\n\n#### 현상\n신한투자증권은 2027년 건설업종 밸류에이션 범위를 \"**PBR 1.1배**(vs. 26년 최고점 1.3배)\"로 설정하며, 하단은 2026년 대비 높아질 것이라 전망했다. 1) 업체 수주잔고 수익성 개선, 2) 2027년 도시정비사업 물량 증가, 3) 중견사 메가프로젝트 효과, 4) 대형사 영업이익 성장률(+40~60% YoY)과 주주환원 확대 기대감이 주가 하단을 지지한다는 구조다.\n\n#### 메커니즘\n핵심 변수는 미국 신규 원전사업의 구체적 실행 진입. 2026년 대비 주가 밴드 자체가 좁아지고 있으므로, 2026년과 같이 전체 업종의 일괄적 리레이팅이 아닌, 프로젝트별·업체별 수혜 규모 차별화가 주가 방향성을 결정한다.\n\nFEED·Early Works 착수 또는 우선협상대상자 선정 단계라도 이미 구체적인 계약 구조가 확인된다면, 미국 정부의 웨스팅하우스 이익 참여권 800억달러 투자약정 집행 시한(2029년 1월)에 대한 시공 리스크 우려와 적정 수익성 의문이 완화된다. 2028년 이후 원전 EPC 본계약 내 위험 분담 구조 확인이 추가 리레이팅 전제조건이라는 점에서, 2027년 주가 상단은 원전 EPC 수주 가시성 확대로 연결된다.\n\n#### 파급\nAI 인프라 투자는 상반기, 원전은 하반기에 수주 모멘텀을 형성할 것으로 기대. 2027년 상단 PBR 1.1배는 2021~22년 조선업의 고선가 수주·재평가 수준이며, 2025년 원전 발주 확대 기대감이 확산됐던 당시 현대건설 밸류에이션이다. 따라서 원전 수주 가시성 확대로 2026년 대비 밸류에이션 하단이 높아지는 구조는 2027년 주가 상승의 필수 조건이다.\n\n---\n\n### 2. 화장품 OEM/ODM : 공급 부족 해결 전략 차이로 수익성·성장률 편차 확대\n\n#### 현상\n한화투자증권·하나증권은 3분기 ODM/용기 업체들의 대응 전략 차이를 묶어 분석:\n\n| 업체 | 3분기 매출(YoY) | 영업이익(YoY) | 수익성(%) | 전략 |\n|------|------------------|------------------|-------------|--------|\n| 코스메카코리아 | +30%+ | - | 11%(↓) | 고객사 다변화로 매출 확대, 영업이익률 훼손 허용. 5년 전 대비 매출 4배, CAGR 32%. 2021~26년 동안 동일 기간 코스맥스(21%)·한국콜마(25%)를 크게 앞섰다. |\n| 한국콜마 | +5%~ | - | 14%(↓) | QoQ 수익성 하락, 고정비용 부담↑. 톱10 고객사 매출 비중 58%(↑3%p). 전통적 수익성 관리를 고집, 인디 브랜드 요청 대부분 거절했을 것으로 추정. |\n| 코스맥스 | - | - | - | 2025년 10여개 핵심 아웃소싱 파트너 선별→QC 개선. 2026년 3분기 QoQ 매출·수익성 동시 상승 시 해당 성과 가시화 |\n\n펌텍코리아는 2025년 선제 투자로 4공장 완공→2026년 상반기까지 용기 부족·병목현상 시달림. 2026년 4공장 정상화·6공장 가동 시작으로, 6공장 설비 설치 즉시 매출 발생(\"호사스런\" 상태). 튜브 리드타임 120일(원래 1개월), K뷰티 핵심 경쟁력인 '스피드'가 ODM·용기 업체 공동 노력 결과였는데, 현재 튜브 수요는 폭발적. 튜브 리드타임 120일은 K뷰티 혁신 제형(자외선 차단제)과 가성비 유지(기초제품 펌프→튜브 전환) 수요로 인한 부담. 튜브 진입장벽은 펌프보다 높으며, 부국티엔씨는 원자재 가격 상승을 가장 먼저·잘 반영한 업체로, 튜브 공급업체로서의 독보적 입지를 갖춘 것으로 평가.\n\n#### 메커니즘\n2026년 화장품 수출 YoY 10%→2027년 수출 YoY 30% 이상이 현실화 됐다. 코스메카코리아는 2021~26년 동안 동일 기간 코스맥스/CAGR 21%, 한국콜마/CAGR 25%를 앞선 수치를 기록했으나, 2026년 3분기 매출은 코스맥스와의 격차가 여전히 두배 이상이다. 코스멕스는 2025년 10여개 핵심 아웃소싱 파트너 선별→QC 개선을 완료한 상태로, 2026년 3분기 QoQ 매출·수익성 동시 상승 시 해당 성과가 가시화 된다는 점에서, 2026년 3분기 실적이 톱10 고객사 집중화를 바탕으로 했다는 추론이 가능하다.\n\n#### 파급\n공통 과제는 2027년 한국콜마 세종 공장 증축, 코스메카코리아 오송공장 완공, 코스맥스 11월 평택 1공장 증설 완료, 평택 3공장 투자. 펌텍코리아는 6공장 가동이 시작된 상태. 공통적으로 생산 캐파 부족이라는 구조적 문제가 있지만, 업체별 전략 차이는 수익성과 성장률에 직접적인 편차를 만들어낸다.\n\n---\n\n### 3. 항공 : 유가 Peak-Out + 원화 강세 + 아웃바운드 수요 회복으로 2027년 증익 확정\n\n#### 현상\n한화투자증권은 2026년 항공업종이 중동 전쟁 이후 항공유 가격 급등에도 운임 인상으로 수익성을 방어했다고 평가. 2027년은 유가 Peak-out과 원화 강세에 따른 비용 절감, 아웃바운드 수요 회복이 동시에 발생할 것으로 전망. 연간 출국자 수 YoY +7%, 일본/중국 노선과 항공화물 수요 강세 지속. 항공화물은 국내발 화물량 증가·광동체 공급 부족으로 고운임 유지 가능.\n\n대한항공은 아시아나항공 통합에 따른 비용 효율화·여객/화물 시너지 기대, 2027년 가장 안정적인 증익 기업으로 제시.\n\n#### 메커니즘\n2026년 항공유 가격 급등은 중동 전쟁으로 인한 단기 사건. 2027년에는 유가 Peak-out(유가가 고점을 멈추고 하락 혹은 횡보)과 원화 강세로 항공사의 운영 비용이 감소. 아웃바운드 수요 회복은 2026년 이후 국제 여행 제한이 완화된 수요 회귀, 중국·일본과의 관계 개선 효과, 한국인들의 해외 여행 소비 재활성화를 포괄. 국내발 화물량 증가는 2026년 이후 글로벌 공급망 재편, 국내 제조업 활성화로 인한 수출 증가를 반영.\n\n#### 파급\n대한항공은 2026년 아시아나항공 통합이 2027년에 완성되는 구조로, 통합 이전부터 있었던 비용 효율화와 통합 이후에 발생하는 여객·화물 시너지가 모두 2027년에 수렴. 통합 효과가 통합 이후에도 시간이 필요한 경우가 많지만, 2026년 2분기 통합 발표·2026년 10월 통합 완료로 2027년부터 통합 효과가 실현될 수 있다고 판단.\n\n---\n\n### 4. 항공기 제작 · 데이터센터 : 미국 데이터센터 투자의 불확실성 → 한국의 수혜 기회\n\n#### 현상\n하나증권은 2027년 미국 데이터센터 투자가 2026년 대비 어려움을 겪을 것으로 전망. 미국 중간선거 결과 민주당이 텍사스·조지아·오하이오·미시간·위스콘신 등 데이터센터 건설이 많은 지역에서 승리. 당선자들은 법제화 전까지 신규 데이터센터 건설 중단, 이후 전력망 비용 부담·세제 혜택 축소를 예고. 반면 구형 GPU 렌탈 변동가격은 꾸준히 상승, 주간 토큰 사용 추이도 증가. 미국 내 공급으로 단기 충족 불가능→미국 외 투자가 증가. 한국은 수도권 외 부지(산업단지), 전력(낮은 발전소 가동률), 자본 등 데이터센터를 짓는 여건 조성. 수요만 충족된다면 착공 즉시 시작 가능. 동해데이터센터 100MW는 이번달 말~다음달 초 착공식 예정. 임차인이 명확하게 확인되지 않아 GS건설 주가가 상승 추세로 이어지진 않고 있으나, 이후 임차인 확인과 1GW 진행 사항 확인이 상방 열쇠.\n\n#### 메커니즘\n민주당의 데이터센터 건설 중단 예고는 법제화 전까지 단지 신규 착공을 중단할 뿐, 기존 착공·완공 프로젝트에 대해서는 영향을 미치지 않는다는 점에서, 2027년 데이터센터 투자 자체를 중단시키지는 않을 것이다. 다만 신규 프로젝트는 2026년에 비해 2027년에 늦춰짐. 구형 GPU 렌탈 변동가격과 주간 토큰 사용 추이는 수요가 미국 내 공급으로 단기간 충족되기 어렵다는 시장 판단을 반영.\n\n---\n\n### 5. 반도체 : 메모리 업황은 2027년 12개월 Forward P/B로 측정해야 한다\n\n#### 현상\nDS투자증권은 2027년 메모리 업황이 다운사이클에서도 버틸 수 있는 이익 체력을 확보했다고 평가. AI 산업의 성장에 맞춰 제품과 고객 구성을 변경하며 체질을 개선했다는 점에서, CSP의 메모리 구매 여력과 2028~2029년 가격 하락 시 이익 민감도 분석이 중요. 대신증권은 메모리 반도체의 목표주가와 매수 의견을 유지하며, 12개월 Forward P/B로 측정: 삼성전자 1.14배, SK하이닉스 1.11배. 최근 시장 급락 이후 투자자 관심은 2027년 이익보다 이익이 고점 이후 얼마나 유지될지로 이동. 그러나 3중고(Macro, 금융시장, 정치)의 점진적 해소가 예상. AI가 경제 성장의 중요한 부분을 주도하기 때문에 AI 확산을 저해할 정책적 결정 가능성은 제한적이고, 공급업계도 예상치 못한 Risk에 탄력적으로 대응할 준비를 가지고 있다는 추정. Downcycle을 기정사실화하고 있는 현 가격(Forward P/B)은 지나친 저평가.\n\n#### 메커니즘\nCSP의 메모리 구매 여력은 메모리 수요가 공급 업체에게 실제 발주로 전환되는 전환점. 2028~2029년 가격 하락 시 이익 민감도 분석은 가격 하락이 이익에 미치는 정도를 수치화하는 방법. 2027년 12개월 Forward P/B는 2026년 12개월 Forward P/B와 비교해 이익의 지속 가능성을 검증하는 수단.\n\n---\n\n### 6. 데이터센터 인프라 : 가덕도 신공항 부지조성공사, DS건설·GS건설 수주 기대\n\n#### 현상\n하나증권은 가덕도 신공항 부지조성공사 실시설계 착수가 11월 9일 진행되었다고 언급. 우선시공분 가격 협상 등의 후속절차 일시 중지로, 개항 일정에 차질이 없는 방향으로 우선시공분은 실시설계 우선 착수 결정. 중동전쟁에 따른 물가상승분을 공사비에 반영하도록 가덕도 신공항법 개정을 연내 국회 통과 목표로 추진 중. 우선시공분 계약도 내년 상반기 본공사 착공을 위해 연내에 대우건설과 체결할 수 있도록 협의 계속 중. 공사기간 106개월, 공사비 10.7조원. 대우건설 컨소시엄은 약 0.6조원 증액을 요구. 대우컨소시엄: 대우건설 55%, 중흥토건 9%, HJ중공업 9%, 동부건설 5%, BS한양 5%, 두산건설 4%, 부산경남 지역건설사 13%._BS한양(5%)은 사업 부담 등을 이유로 탈퇴 요청. 가덕도 수주 결정 시 대우건설은 약 6.2조원 수주 예상.\n\n#### 메커니즘\n우선시공분은 공사기간 106개월, 공사비 10.7조원. 우선시공분의 가격 협상 일시 중지는 가덕도 신공항법 개정(중동전쟁 물가상승분 반영)이 연내 국회 통과가 목표로, 우선시공분 계약도 내년 상반기 본공사 착공을 위해 연내 대우건설과 체결해야 함. 대우건설 컨소시엄의 0.6조원 증액 요구는 물가상승분 반영을 포함한 수치로, 중동전쟁의 물가상승분이 우선시공분 가격 협상에 직접 반영된다는 점에서, 공사비 10.7조원에 대우건설 컨소시엄의 0.6조원 증액이 포함된 것으로 해석 가능. BS한양(5%)은 탈퇴 요청으로 대우건설 수주 금액이 6.2조원(총 공사비 10.7조원 * 58%)으로 추정.\n\n---\n\n### 7. 데이터센터 인프라 : 동해데이터센터 100MW, GS건설 주가 상방은 임차인 확인과 1GW 진행 사항에 달려 있다\n\n#### 현상\n동해데이터센터 100MW는 이번달 말~다음달 초 착공식 예정. 임차인이 명확하게 확인되지 않아 GS건설 주가는 크게 상승 추세로 이어지진 않고 있다. 이후 임차인이 확인되고, 이후 1GW에 대한 진행 사항이 확인될수록 주가 상방이 열리는 구조.\n\n#### 메커니즘\n임차인이 명확하게 확인되지 않았다는 것은 동해데이터센터 100MW의 임차인이 확보되지 않은 상태. GS건설 주가는 2026년 11월 11일에 코스메카코리아 실적 발표와 동시에 코스메카코리아 주가가 하락했음에도 불구하고, GS건설 주가는 오히려 상승했다(GS건설 주가가 코스메카코리아 주가 하락을 반영하지 않은 것으로 해석). 이는 GS건설이 동해데이터센터 임차인 확인이 아직 확인되지 않았음을 알고 있기 때문. 동해데이터센터는 GS건설이 주도하고 있으며, 동해데이터센터의 임차인이 확인되면 GS건설 주가는 상승할 것으로 기대된다. 이후 1GW에 대한 진행 사항이 확인될수록 주가 상방이 열리는 구조.\n\n---\n\n### 8. 데이터센터 인프라 : 삼성E&A, 2나노 및 4나노 파운드리팹(카이로스팹) EPC 수주 기대\n\n#### 현상\n삼성전자가 기흥캠퍼스 종합기술원, 공과대학 부지에 2나노 및 4나노 파운드리팹(카이로스팹)을 구축하기로 결정. 해당 건물을 EPC 맡기로 결정. 팹은 4개의 생산구역(Phase)로 조성. 현재 삼성E&A는 P4, P5 Fab1, P5 Fab2 등의 삼성 계열사를 수행하고 있으며, 올해 약 9조원 가까이 수주 예상. 내년에도 비슷한 수준의 계열사 수주를 추정. 이번 카이로스팹이 더해지면서 수주 기대감이 더 높아짐. MSCI 편입 가능성과 자사주 매입으로 주가 견조할 수 있다고 판단.\n\n#### 메커니즘\n삼성E&A는 현재 P4, P5 Fab1, P5 Fab2 등의 삼성 계열사를 수행 중이며, 올해 약 9조원 가까이 수주 예상. 내년에도 비슷한 수준의 계열사 수주를 추정. 이는 삼성E&A가 삼성전자 계열사들의 EPC를 맡고 있으며, 삼성전자 계열사들의 EPC 수주가 삼성E&A의 수주를 결정한다고 판단. 카이로스팹 EPC 수주가 추가되면 삼성E&A의 수주 금액이 더욱 늘어나고, MSCI 편입 가능성과 자사주 매입으로 주가가 견조할 수 있다고 판단.\n\n---\n\n### 9. 데이터센터 인프라 : 호실적 기대와 중소형주로 계룡건설 추천, GS건설 동해데이터센터 수주 기대감으로 Top Pick\n\n#### 현상\n하나증권은 11월 2차 공공기관 이전, 호실적 기대 등으로 중소형주인 계룡건설을 추천하며, 내년 상반기까지를 바라볼 때, GS건설을 동해데이터센터 수주 기대감으로서 TOP PICK으로 제시. 실적 개선세가 뚜렷한 삼성E&A를 차선호주로 제시.\n\n---\n\n### 10. 데이터센터 인프라 : 삼성전자, 2나노 및 4나노 파운드리팹(카이로스팹) EPC 수주 기대\n\n#### 현상\n삼성전자가 기흥캠퍼스 종합기술원, 공과대학 부지에 2나노 및 4나노 파운드리팹(카이로스팹)을 구축하기로 결정. 해당 건물을 EPC 맡기로 결정. 팹은 4개의 생산구역(Phase)로 조성. 현재 삼성E&A는 P4, P5 Fab1, P5 Fab2 등의 삼성 계열사를 수행하고 있으며, 올해 약 9조원 가까이 수주 예상. 내년에도 비슷한 수준의 계열사 수주를 추정. 이번 카이로스팹이 더해지면서 수주 기대감이 더 높아짐. MSCI 편입 가능성과 자사주 매입으로 주가 견조할 수 있다고 판단.\n\n---\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 대만 증시: 반등의 조건 – 펀더멘털 vs. 밸류에이션\n\n대만 증시는 10월 초 TSMC 호실적을 배경으로 사상최고치를 넘어서던 순간, 7거래일 연속 하락 끝에 고점 대비 21%를 빠졌다. TSMC 포함 테크주 비중이 높은 지수 특성상 대형주 중심의 매도가 주도했으며, 외국인 수급 이탈이 핵심 요인(10월 누적 순매도 317.8억 달러). 그러나 동시에 대만 수출 36개월 연속 플러스 성장과 무역수지 역사적 최고치라는 펀더멘털은 여전히 견고하다. 즉, 이 하락은 실적 악화보다 **밸류에이션이 너무 높아진 상태에서 AI 투자 지속성에 대한 우려가 겹친** 것이다. \n\n이 흐름에서 중요한 변수는 10월 CPI와 미국 중간선거 이후 데이터센터 규제의 구체 내용. 하반기에 대두된 AI 데이터센터 투자 우려가 실제로 신규 공급 일정을 늦춘다면, TSMC 등 반도체 대형주 주가가 훨씬 더 많은 것을 반영해야 한다. 하지만 미국 주요 물가 지표들이 3%대 상승을 기록하며 연준 목표와 멀어지는 것도 동시 발생한 사건이므로, 외국인의 헤징 매도와 함께 대만달러 약세가 진행되면서 펀더멘털과 밸류에이션의 경로가 분기를 만들었다.\n\n---\n\n### 2. AI 밸류체인: 규제의 정치적 함의와 구체적 실행 사이의 격차\n\n민주당이 텍사스, 조지아, 오하이오 등을 포함한 5개 주를 새롭게 확보하면서, 해당 지역에 집중된 49%의 신규 공급 계획(총 92.2GW)이 앞으로 얼마나 잘 처리될지를 가늠하는 게 핵심이다. 텍사스는 특히 50.2GW로 전체의 43%를 차지한다. 그런데 문제가 여기서 끝나지 않는다. 선거 전부터 양당이 추진했던 비용 분담이 이제 승인 중단 또는 세제 축소로 전환이 될 가능성이 있고, 이 때문에 신규 사업의 개발 비용과 승인 대기 기간이 확대될 수 있다. \n\n텍사스 당선인은 신규 승인 제한에서 착공 사업을 제외하는 방안을 제시했으나, 이건 결국 **에너지·환경 승인이 필요한 사업이라면 기존 승인 보류의 영향을 받을 수밖에 없다는 걸 인정**하는 것. 미국 내 AI 데이터센터 신규 공급 일정이 이렇게 중단되면, 국내 대형 반도체 기업(TSMC 포함)의 주가 형성에 있어 실적과 밸류에이션이 서로 다른 방향으로 러닝 디펜던시를 갖게 된다. \n\n그렇다고 규제 강화가 수요 둔화나 건설 사이클 종료로 직결된다고 단정하기엔 근거가 부족하다는 게 대신증권의 결론. 아이렌의 분기별 AI 클라우드 매출액이 전분기 대비 182% 증가한 2억달러를 기록하고, 분기 종료 후 MW당 연간 매출 약 2,200만달러 규모의 5년 계약을 체결한데다가, 고객이 GPU CapEx의 90%를 선급하는 조건을 제시한다는 건, AI 수요 자체가 매우 견조하게 지속되고 있음을 표명한다. \n\n따라서 미국 내 신규 데이터센터 공급이 어려워지더라도, 기존 데이터센터 사용처(Google, Microsoft 등)의 임대 가치는 높아질 것이며, 이로 인해 AI 밸류체인 주가에 대한 긍정적 효과는 규제 강화 정도에 비례하지 않을 수도 있다. 이 논리를 뒷받침하는 건 미국 증시에서 마이크론(+5.1%), AMD(+11.0%), 인텔(+7.7%)이 급락한 다음 날 미국 필라델피아 반도체 지수가 +6.9%를 기록한 현상이다.\n\n---\n\n### 3. KOSPI/KOSDAQ: 채팅봇 테마의 일시적 도출과 하단 강화 실패\n\n지난 금요일 미국 증시의 급등은 엔비디아를 제외한 대부분 반도체주가 반등한 데서 기인했다. 그리고 국내 증시는 그로부터 미국 증시의 급등이 시작되기 전인 11월 9일, 지난주 폭락 이후 저가 매수세가 유입되어 장중 2% 이상 반등했다. 그런데 삼성전자·SK하이닉스 등 대형주의 상승폭이 축소되고, 2차전지주가 약세하며 하락 전환했다. 이른바 \"약속의 2시\"라는 부정적인 밈이 자주 언급되는데, 오전 방향성과는 별개로 오후가 되면 주가가 밀릴 가능성이 있다고 하는 표현이긴 하지만, 이런 밈이 활성화되는 것은 국내 투자심리의 취약성을 드러낸다.\n\n또한 국내 증시가 미국 증시의 급등이 이루어진 다음 날인 11월 10일에도 하락한 것은, AI 투자 우려에 따른 국내 대형 반도체주(Big Tech)의 밸류에이션과 관련된 것이다. 앞서 언급한 아이렌의 5년 계약 기준 MW당 연간 매출 약 2,200만달러는 상반기 네오클라우드 평균(1,200만달러) 대비 80% 이상 높은 수준이고, 선수금 수취 비율도 IT 캐패시티의 최대 90%에 달하는데, 이는 AI 수요가 매우 견조하게 지속되고 있음을 뒷받침하는 근거다. 하지만 이걸 국내 증시가 반영하지 않은 이유는 AI 밸류체인 주가가 기업 개별 성과보다는 AI 투자 사이클이라는 대체적 개념에 의해 형성되고 있기 때문이다. \n\n그래서 미국 증시가 반등했음에도 국내 증시는 미국 증시의 방향을 따라잡지 못했다. 이는 KOSPI가 미국 10년 국채금리 급등과는 별개로 급등했던 것과도 상충되는 현상이다(KOSPI 4.39%↑, 미국 10년 국채금리 13.8bp↑).\n\n---\n\n### 4. 엔비디아 CEO 스캔들과 시장의 선택적 반응\n\n젠슨 황 엔비디아 CEO의 사생활 관련 스캔들의 구체적 성격은 중국 정보기관과의 연관성으로 설정되어 있는데, 중국이 오픈웨이트 모델로 프론티어 모델랩을, 반도체 자립화로 미국 AI 반도체 밸류체인까지 위협하는 상황에서 이 사건이 AI 밸류체인 자체에 대한 국가 안보 걱정으로 번질 가능성이 제기된다. 하지만 엔비디아 이사회는 기밀이나 국가 안보 침해가 확인되지 않았다고 입장을 유지하고 있으며, 중동의 이란과의 군사적 긴장 완화 가능성(트럼프의 발언)도 중앙집중식 AI 투자 사이클이라는 관점에서 보면 부차적 요인이다.\n\n즉, 시장은 AI 투자 사이클과 젠슨 황 스캔들을 구분하고 있다는 점에서, 이 스캔들이 엔비디아 지배구조 불확실성(ex: CEO 교체)이나 대중 기술 수출 통제 강화로 이어질 가능성은 있으나, 하이퍼스케일러 업체들(Amazon, Google 등)의 AI 투자 스케줄이나 GPU 발주 규모를 줄일 가능성은 크지 않다는 판단이다. 그래서 미국 증시에서 AMD(+13.3%), 브로드컴(+8.8%) 등 경쟁사들이 반사 수혜를 받았다. 마이크론(+6.3%), 샌디스크(+6.6%) 등 반도체주 저가 매수세가 유입된 것도 이 맥락에서 이해된다.\n\n---\n\n### 5. FCF 팩터와 QDII의 재평가 기회\n\nVFLO ETF(Victory Shares Free Cash Flow ETF)는 올해 연초 이후 10월말까지(YTD) 39% 올라 S&P500 11%, 나스닥100 13% 수익을 상회했다. SCHD(Schwab U.S. Dividend Equity ETF)도 10월말까지 34% 올라 시장 수익률을 크게 상회했는데, 이는 Dow Jones U.S. Dividend 100 지수와 같이 Free Cash Flow만큼은 아니라도, 장기간 시장과 여타 주식 팩터 성과를 크게 웃돈다는 점에서 의미가 있다. \n\nAI 투자 확대로 인한 막대한 CapEx가 주목받는 와중에, 과도한 부채 없이 높은 현금 흐름을 창출하는 기업이 여전히 AI가 높은 비중을 차지하는 시장 수익을 상회하고 있다는 점은 FCF 팩터가 AI 투자 사이클이라는 단기적 맥락과도 별개로 지속력을 가지는 것을 뜻한다. 즉, 2026년에 우리가 경험하고 있는 이러한 FCF 팩터와 Dividend Equity ETF의 상승은 AI 투자 사이클이라는 맥락 내에서의 일시적 현상이 아니라, 미국 증시 내에서 장기간 지켜온 성과 패턴이다. \n\n그러나 미국 중간선거 이후의 AI 데이터센터 규제 강화 가능성이 높아진 상황에서, 이 패턴이 유지될지는 다시 한번 검토가 필요하다. 만약 미국 내 신규 AI 데이터센터 공급이 어려워지면서 기존 데이터센터의 임대 가치가 높아지는 경로라면, 이 패턴이 지속될 가능성이 높겠지만, 규제 강화가 AI 투자 총량 자체를 줄이는 방향으로 전개된다면, 이 패턴이 유지될 가능성이 낮아진다. 이 두 가지 경로 중 어디로 가느냐가 현재 시장의 핵심이다.\n\n---\n\n### 6. 주간 테마 회전: 리딩/애셀레레이션 없는 채팅봇 테마\n\n과거와 달리 리딩이나 애셀레레이션 단계에 있는 테마가 전혀 없는 상황이다. 주도 테마도 부재하며, 주간 상위 테마는 면세·관광(+3.6%), K-푸드(+1.9%), 자사주(+1.6%)로 나타난다. 하위 테마는 반도체 장비(-23.8%), HBM 메모리(-21.4%) &lt; AI 반도체(-20.7%)로 확인된다. 47개 테마 중 5개만 상승했고, 테마 평균 1주일간 -7.4%를 기록했다.\n\nCrowded(과열) 테마로는 지주사, 가장자산 플랫폼, 밸류업이 들며, 이들은 성과·뉴스 상위에도 불구하고 쏠림 현상이 동반된다. 테마 회전 없이 주도 테마가 없는 상황에서, 이 과열 테마들이 다음 주에 어떤 방향으로 변곡점을 만들어낼지가 관심의 중심이다.\n\n---\n\n### 7. 외환시장: 이란군사갈등 완화 기대에 유로·엔화 강세\n\n미국과 이란의 군사적 긴장 완화 기대가 높아지면서 국제유가가 급락했고, 이에 따른 인플레이션 우려 완화와 미국 기술주 반등에 따른 위험자산 선호 회복이 달러화의 안전자산 수요를 약화시켰다. 트럼프 대통령이 이란에 대한 추가 군사공격 가능성을 낮게 평가한 것은 중동 지역의 긴장 완화로 해석된다. 유로화는 유로존 경기 회복 기대와 달러화의 차익실현 매물을 받아들였다. 엔화도 미 달러 대비 상승했다.\n\n이 모든 현상이 동시에 발생했음에도, 미국 10년 국채금리가 13.8bp 상승한 것은, 트럼프의 이란 군사 공격 가능성이 낮다는 발언이 중동 지정학적 리스크 완화로 해석되는 동시에, 미국 고용지표가 시장 예상을 상회해 추가 금리 인상 경계감이 지속된다는 의미로 해석해야 한다. 미국 고용지표가 시장 예상을 상회했다는 사실은 10월 CPI가 3%대의 상승세를 기록하며 연준의 목표와 멀어지는 상황이라는 것도 동시에 뒷받침한다. 그러므로 이 두 요인(고용지표 호조, 10월 CPI 3%대)이 동시에 발생하면, 트럼프의 이란 군사 공격 가능성이 낮다는 발언이 중동 리스크 완화로 해석되더라도, 미국 고용지표 호조와 10월 CPI 3%대는 연준의 추가 금리 인상 경계감을 지속시킨다는 점에서, 미국 달러화가 10월 중반 이후 급등했던 이유를 설명해 준다. 그리고 미국 달러화가 급등했던 다음 날인 11월 9일, 국내 증시가 미국 증시의 방향을 따라잡지 못했던 이유는 이 두 요인(고용지표 호조, 10월 CPI 3%대)이 국내 증시에서 반영되지 않았다는 의미로 해석된다.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\n**핵심 쟁점 정리:**\n\nAI 투자 사이클이 미국 경제에 K자형 성장 구조를 유도하고 있으며, 고소득층과 대형 기업 중심으로 소비와 투자가 집중되고 있다. 이는 소득 격차 확대와 경제 성장의 불균형을 초래할 수 있는 구조적 변화를 야기한다. 또한, AI 투자와 관련된 자본 집약적 특성은 중소기업보다 대형 기업에 유리하게 작용하며, 이는 경제 성장의 불평등 심화를 야기할 가능성이 있다. 미국 중간선거 이후 재정 정책의 불확실성과 기존 재정 프로그램 종료 시점에 따른 투자 결정 집중은 경제 성장에 부정적 영향을 줄 수 있다. AI 투자 확대는 글로벌 경제에 파급력을 미치며, 유가 하락과 국채금리 하락을 유도하는 등 국제시장에 영향을 미치고 있다."}]}</script>
