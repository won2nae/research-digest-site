<script id="__DATA__" type="application/json">{"date": "2026-10-01", "shock_md": "## 오늘의 매크로 충격 지표\n\n- **코스피** 상승 +1.95% (현재 6971.35, 전일 6838.04, 임계값 1.5% 초과)\n- **코스닥** 상승 +4.48% (현재 894.29, 전일 855.91, 임계값 2.0% 초과)\n\n### 관련 뉴스\n\n---\n", "tabs": [{"title": "코스피 +1.95% / 코스닥 +4.48% 급등 원인", "md": "## 코스피 +1.95% / 코스닥 +4.48% 급등 원인\n\n### 1. 마이크론 어닝서프라이즈 → 반도체주 동반 급등\n\n마이크론 테크놀로지가 4분기 실적을 발표하며 매출 **전년비 +379% (540억 달러)**, EPS $33.42로 시장 기대치를 크게 상회했고, 이에 삼성전자·SK하이닉스 등 한국 반도체주가 동반 급등해 코스피·코스닥을 견인했다.\n\n> 출처: *Investors.com*, *Reuters*, *서울경제 (en.sedaily.com)*\n\n---\n\n### 2. 9월 반도체 수출 사상 최고치 기록\n\n한국 9월 반도체 수출이 사상 최고치를 경신한 것으로 집계됐고, 이는 기관투자자들의 강한 순매수와 맞물려 특히 KOSDAQ 반도체 장비주(주성엔지니어링 등)의 폭등을 이끌었다.\n\n> 출처: *서울경제 (en.sedaily.com)*, *조선비즈 (biz.chosun.com)*\n\n---\n\n**요약:** 마이크론 실적 발표(9/30 장 마감 후)가 AI 메모리 수요 확인 신호로 작용, 한국 반도체 수출 호조와 맞물려 외국인·기관의 반도체주 집중 매수가 이번 급등의 핵심 동인이다.\n\n---\n"}, {"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### 1. 미국 10년물 금리 5% 돌파: 주식-채권 수익률 역전과 금융자산 리밸런싱\n\n9월 14일 장중 미국 10년물 국채금리가 5%를 돌파하며 S&P500 지수의 12개월 선행 PER 19.17배를 기준으로 한 이익수익률(5.22%)과 수렴해 일드갭(Yield Gap)이 0%p 수준까지 축소됐다. 2023년 10월과 유사한 구도로, 주식의 채권 대비 상대적 투자 매력이 약화되고 있다. 이 시점에서 주식형과 채권형 펀드의 자금 흐름 차이가 확대됐고, 현재도 장기금리 상승에 따른 밸류에이션 부담이 지속되며 향후 주식에서 채권으로의 자금 이동이 확대될 가능성이 제기된다.\n\n과거 2000년대와 2010년대는 수요 확대와 경기 개선이 금리 상승을 이끌며 기업이익 증가가 금리 부담을 상쇄하는 구조였다. 반면 2020년대 이후 공급 측 요인(코로나 공급망 차질, 에너지 가격 상승, 관세)과 재정적자 확대에 따른 국채 발행 부담이 기간 프리미엄을 높이며 장기금리 상승 압력을 더했다. 현재는 공급 측 물가 압력이 지속되고, 금리 상승이 경기 개선 신호보다 할인율 상승에 따른 밸류에이션 부담으로 인식되는 구조로, 과거 저금리-저물가 국면보다 금리 상승에 대한 증시 부담이 커졌다.\n\n2022년과 2023년의 사례를 비교하면, 2022년은 단기실질금리 상승이 경기 둔화와 기업이익 우려와 겹치며 S&P500이 고점 대비 약 25% 하락했고, 2023년 하반기에는 견조한 경제-이익 기대가 유지되면서도 기간 프리미엄 상승에 따른 장기금리 상승이 S&P500을 7월 고점 대비 약 10% 조정했다. 두 시기 모두 금리 상승이 증시 조정으로 이어졌고, 2024년 이후 금리-PER 역관계가 이전보다 뚜렷해지며 금리 상승 국면에서 밸류에이션 확대를 통한 지수 상승에 제약이 따를 수 있음을 시사한다. 종목 차원에서는 미래 성장 기대와 현금흐름이 먼 미래에 집중된 기업이 할인율 상승에 더 민감하게 반응할 것으로 예상된다.\n\n---\n\n### 2. 미국 8월 PCE: 코어 하회, 슈퍼 코어 급등, 디젤유 가격 미반영으로 9월 PCE 상승 압력 확대\n\n8월 PCE 물가지수는 전월비 0.3%로 시장 예상치에 부합했으나 코어 PCE는 전월비 0.2%로 시장 예상치 0.3%를 소폭 하회했다. 전년동월 기준 PCE 물가 상승률은 7월과 동일했고, 에너지와 임대료를 제외한 슈퍼 코어 PCE 물가 상승률은 전월비 0.36%로 7월 0.07% 대비 급등했다. 전년동월 기준 슈퍼 코어 PCE 상승률은 3.46%로 7월 3.42% 대비 소폭 상승했다. 이는 코어 PCE 하회가 전반적인 인플레이션 압력 완화를 단정하기에는 이른 시점임을 시사한다.\n\n9월 WTI 월 평균 유가는 82.5달러에서 95.7달러로 16% 급등했고, 디젤유 가격 상승분이 8월 PCE에 제대로 반영되지 않아 9월 PCE 물가 상승률에 상승 압력으로 작용할 가능성이 커졌다. 8월 PCE 물가지수만으로 미국 인플레이션 압력 완화를 단정하는 것은 부적절하다.\n\n---\n\n### 3. 2분기 GDP: 잠정치 대비 0.7%p 상향 조정, 명목 GDP 8.5%로 고금리 방어 신호\n\n2분기 GDP 성장률 잠정치(전기비 연율 1.5%)보다 개선된 전기비 연율 2.2%를 기록했고, 민간투자와 소비지출 상향 조정이 주요 원인이다. 명목 GDP 성장률은 잠정치 8.0%에서 8.5%로 0.5%p 상향됐다. 고금리 환경 속에서도 명목 GDP 성장률이 기준금리 수준을 상회하는 것은 미국 경제가 고금리 충격을 방어 혹은 이겨내고 있음을 시사한다.\n\n비금융기관 기업이익 규모는 2분기 명목 GDP 대비 9.8%로 1966년 이후 가장 높은 수준이다. 고금리 환경 속에서도 기업 이익이 강한 모멘텀을 유지하고 있다. 이는 경기 회복 추세가 지속되고 있으며, 기업 이익이 고금리 환경에서 방어력을 보여주고 있음을 의미한다.\n\n---\n\n### 4. 한국 8월 산업활동: 광공업 생산 감소(-4.8%), 소비·설비투자 동반 하락\n\n광공업 생산은 전월대비 4.8% 감소했다. 반도체(-2.2%)가 생산 감소 전환했고, 자동차(-24.8%) 생산이 2020년 2월 이후 가장 크게 줄었다. 고무·플라스틱(-11.0%)과 의약품(-8.8%) 생산도 감소했으나, 서비스업(+0.5%) 생산 증가로 전산업 생산은 전월대비 1.3% 감소에 그쳤다.\n\n소매판매는 전월대비 1.8% 감소했다. 승용차 등을 중심으로 내구재(-4.5%) 판매가 재차 줄었고, 비내구재(-1.6%) 판매도 감소했다. 대형마트(-5.9%)와 면세점(-11.5%) 판매가 감소 전환됐다.\n\n설비투자는 전월대비 9.5% 감소했다. 기계류(+1.6%) 투자가 4개월 연속 늘었으나, 운송장비(-32.8%) 투자가 1997년 1월 이후 가장 크게 감소했고, 전기 및 전자기기 투자도 전월대비 2.7% 감소했다.\n\n---\n\n### 5. 경기 지표: 동행지수 상승 0.5p, 선행지수 소폭 하락 0.1p\n\n경기 동행지수는 0.5p 상승했으나, 선행지수는 0.1p 하락했다. 헤드라인 지표는 부진했으나, 일부 부문의 둔화가 두드러진 것이며, 경기 회복 추세는 유지된 것으로 판단된다. 광공업 생산과 소비, 설비투자 감소가 전반적인 부진의 원인이다. 그러나 서비스업 생산과 건설기성 증가, 기계류 투자 견조함 등 부문별 차별화가 나타나며, 전체 경기 회복 추세는 유지되고 있다.\n\n---\n\n### 6. 9월 반도체 수출 사상 최고치, 마이크론 어닝서프라이즈와 맞물려 KOSDAQ 반도체 장비주 급등\n\n한국 9월 반도체 수출이 사상 최고치를 경신한 것으로 집계됐다. 이는 기관투자자들의 강한 순매수와 맞물려 특히 KOSDAQ 반도체 장비주(주성엔지니어링 등)의 폭등을 이끌었다. 9월 30일 마이크론 테크놀로지가 4분기 실적을 발표하며 매출 전년비 +379% (540억 달러), EPS $33.42로 시장 기대치를 크게 상회했고, 이에 삼성전자·SK하이닉스 등 한국 반도체주가 동반 급등해 코스피·코스닥을 견인했다. 코스피는 +1.95%, 코스닥은 +4.48%로 4거래일 연속 상승 마감했다. 외국인 순매도에도 기관과 개인의 동반 매수세가 이어졌다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. 국채 공급 조절 카드: 정부의 공급 측면 대응 신호가 시장에 미치는 의미\n\n재경부는 올해 국세수입 전망을 478.6조원으로 재추계했다. 추경예산에 반영된 415.4조원 대비 63.2조원 증가한 규모로, 일반회계 법인세 수입 전망이 약 35조원 상향된 점이 크게 기여했다. 채권시장 입장에서 세수 전망의 개선은 연내 재정지출을 충당하기 위한 국채발행 필요성을 낮추고, 정부의 공급 조절 여력을 확대하는 요인이다. 따라서 연말까지 남은 발행한도를 모두 소진해야 할 필요성이 약해졌다는 점에서 향후 발행계획 조정 가능성에 주목할 필요가 있다.\n\n정부는 국고채 금리가 과도하게 상승할 경우 긴급 바이백과 초과세수 일부를 활용한 국채발행 축소 등 시장안정조치를 시행하겠다는 방침을 제시했다. 긴급 바이백은 시장에 유통되는 기존 채권을 매입해 대상 종목의 수급 부담을 완화하고, 발행 축소는 신규 채권 공급을 줄여 시장의 물량 소화 부담을 낮추는 방식이다. 두 조치가 병행될 경우 기존 채권과 신규 발행 양쪽에서 수급 개선을 기대할 수 있다.\n\n---\n\n### 2. 9월 채권 시장: 인상과 추가 인상 경계감의 충격 경로\n\n9월 국고채 시장은 국제유가 상승과 미국채 금리 급등 등 대외 요인들을 반영하며 단기물 중심 약세를 보였다. 월 초에는 7, 8월 연속 인상 이후 한국은행의 추가 인상 속도는 약화될 것으로 예상되며 금리 상승이 제한되었으나, 중순 이후 미국의 9월 인상과 한국은행 최종금리 눈높이의 변화와 함께 국내 금리도 동반 상승했다. 미국채 10년물 금리가 5.2%를 돌파하며 변동성을 확대하면서 국내 투자심리도 동반 위축됐다.\n\n미국채 10년물 금리가 5.2%를 돌파한 것은 9월 1일 발표될 10월 국고채 발행계획에 이 같은 조치로 발행규모가 축소될 것이라는 기대감도 반영된 결과다. 중동 지역 긴장 재확대에 따른 국제유가 상승은 브렌트유가 배럴당 100달러 선을 넘어서며 기대인플레 상승을 촉발시켰고, 미 연준을 비롯한 주요국 중앙은행들에서 보험성 대응의 기대인플레 통제용 금리 인상을 단행했다. 9월 미 연준은 정책금리를 3.75~4.00%로 만장일치 인상했고, 점도표를 통해 추가 인상 가능성을 열어두며 시장금리 상승을 이끌었다.\n\n---\n\n### 3. 10월 국채 시장 전망: 수요 없는 공급, 은행채의 특은채 중심 발행 지속\n\n9월 2~3주차 시중은행 중심 은행채 발행이 증가하면서 공사채와 은행채 간 3년물 금리 갭도 9월 29일 기준 +2.1bp까지 확대되었다. 8월 5일 기준으로 -0.6bp까지 역전되었던 것과 비교하면 시장 센티먼트는 공급 추이에 집중되어 있는 것으로 판단된다. 통상 공사채와 은행채의 금리 갭은 크지 않으나 단기 수급 상 차이에 따라 역전과 해소를 반복하는 패턴이 존재한다.\n\n은행채 2026년 현재까지 누적 총발행액은 209.8조원으로, 2025년 연간 총발행액 221.5조원의 94.7% 수준이다. 2025년부터 정책성 자금수요에 따른 특은채의 발행량이 상대적으로 증가했고, 2025년 특은채 연간 총발행은 137.7조원, 2026년은 1~9월까지 누적 138.4조원 수준이다. 2025년대비 2026년 특은채 누적 총발행의 기울기가 더욱 가파르게 상승했다. 시중은행채의 경우 2025년과 대체적으로 비슷한 궤적을 그리나, 9월말 기준으로 2025년 동기 대비 누적 총발행이 아웃퍼폼한 상태이다.\n\n순발행으로 보았을 때 2025년의 경우 순상환에서 연말로 갈수록 순발행으로 전환하는 패턴을 보였지만, 2026년의 경우에는 상반기 특은채 중심 순발행, 6월말부터는 시은채 또한 순발행 기조로 전환하는 패턴이 나타났다. 2025년과 2026년 모두 시은채는 상반기 순상환 구조를 보였지만, 하반기부터는 순발행 기조로 전환하는 패턴이 동시에 나타났고, 현재는 2025년대비 2026년 시은채 누적 순발행이 7.74조원으로 2025년 동기간 1.39조원 대비 큰 폭 증가했다.\n\n9월의 경우 대기업 예금 중심 만기도래가 나타나면서 분기말 유동성 비율을 맞추려는 시중은행채의 선제적 발행이 있었던 것으로 추정된다. 올해는 추석 연휴와 분기말이 겹쳐 영업일이 짧으므로 예금 만기도래에 따른 유동성 비율을 맞출 수 있는 기간이 짧아 9월간 순발행이 증가했을 가능성이 존재한다. 당사의 9월 15일 보고서에서 언급했던 바와 같이 올해는 추석 연휴와 분기말이 겹쳐 영업일이 짧으므로 예금 만기도래에 따른 유동성 비율을 맞출 수 있는 기간이 짧아 9월간 순발행이 증가했을 가능성이 존재한다.\n\n---\n\n### 4. 10월 국채 발행 계획과 시장 기대: 공급 조절 가능성과 WGBI 자금 유입\n\n10월 1일 발표될 10월 국고채 발행계획에 이 같은 조치로 발행규모가 축소될 것이라는 기대감도 반영됐다. 월말을 맞아 WGBI 자금도 유입되면서 장 후반으로 갈수록 장기물 금리 하락폭도 확대됐다. 국제유가 하락과 정부의 긴급 바이백·초과세수 활용 국채발행 축소 방침이 금리 하락 요인으로 작용해 3년물 4.011%, 10년물 4.407%로 마감됐다. 달러-원 환율은 3.90원 내린 1,352.80원에 마감됐고, 수출업체 네고와 수입업체 결제가 맞선 가운데 외국인 주식 순매도가 상방 압력을 주었다. 장중 1,359.40원까지 오른 뒤 오후 네고에 다시 낮아졌다.\n\n---\n\n### 5. 금리 방향: 하락과 스티프닝, 스프레드 변화의 구조적 의미\n\n전일 국내 채권 시장에서 금리 방향은 3년물과 10년물 모두 하락했고, 일드커브는 스티프닝됐다. 스프레드(bp)는 국5/3이 20.0 (+0.7), 국10/3이 40.0 (+0.2), 국10/5가 20.0 (-0.5), 국30/10이 11.5 (-0.7)로 나타났다. 10년물 금리가 하락하면서 10년-5년 스프레드가 0.5bp 감소했고, 30년-10년 스프레드도 0.7bp 감소했다. 10년-3년 스프레드는 0.2bp 증가했다. 이는 장기물 금리 하락이 단기물보다 더 크게 나타났다는 의미로, 10년물 금리 하락이 3년물 금리 하락보다 더 크게 나타난 것으로 해석할 수 있다. 일드커브의 스티프닝은 단기물 금리 하락이 장기물 금리 하락보다 상대적으로 느렸다는 의미이지만, 이 경우는 10년물이 3년물보다 더 크게 하락했기 때문에 스티프닝이 발생한 것이다.\n\n---\n\n### 6. 채권 시장의 구조적 배경: 공급 조절, 수요 부재, 국제유가 하락의 복합 작용\n\n국내 채권 시장 불 플래트닝 마감은 월말 WGBI 자금 유입 및 발행규모 축소 기대감과 국제유가 하락이 금리 하락을 촉진한 결과이다. 사우디의 원유 수출 경로 확보에 따라 국제유가 하락하면서 국내 금리도 하락 출발했다. 재경부의 세수 재추계 결과가 추경 예산에 반영된 전망 대비 많았고, 국채 발행물량 축소 발언 등 시장 안정화 조치 언급에 따라 금리 추가 하락했다. 10월 국고채 발행계획 발표에 이 같은 조치로 발행규모가 축소될 것이라는 기대감도 반영됐다. 월말을 맞아 WGBI 자금도 유입되면서 장 후반으로 갈수록 장기물 금리 하락폭도 확대됐다.\n\n---\n\n### 7. 코스피·코스닥 급등과 채권 시장의 연계: 반도체 호조가 채권 수요에 미치는 간접 효과\n\n9월 30일 마이크론 테크놀로지가 4분기 실적을 발표하며 매출 540억 달러(전년비 +379%), EPS $33.42로 시장 기대치를 크게 상회했다. 이에 삼성전자·SK하이닉스 등 한국 반도체주가 동반 급등해 코스피·코스닥을 견인했다. 9월 반도체 수출도 사상 최고치를 기록했고, 이는 기관투자자들의 강한 순매수와 맞물려 특히 KOSDAQ 반도체 장비주(주성엔지니어링 등)의 폭등을 이끌었다.\n\n코스피는 +1.95% 상승했고, 코스닥은 +4.48% 급등했다. 이 급등은 반도체 호조와 마이크론 실적 발표에 따른 AI 메모리 수요 확인 신호로 작용했다. 반도체 호조는 기관투자자들의 강한 순매수와 맞물려 특히 KOSDAQ 반도체 장비주(주성엔지니어링 등)의 폭등을 이끌었다. 이는 채권 시장과 직접적으로 연결되지는 않지만, 주식 시장의 강세는 자본흐름이 주식으로 집중되면서 채권 수요가 상대적으로 억제되는 구조적 배경을 제공한다. 반도체 호조와 주식 시장 강세는 채권 수요 부재를 강화하는 요인으로 작용할 수 있다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 반도체: 마이크론 어닝서프라이즈 → AI 메모리 수요 확인, 한국 반도체주 동반 급등\n\n마이크론 테크놀로지(2026년 4분기)가 **매출 $54.2B(YoY +379%, QoQ +31%)**, EPS $33.42로 시장 컨센서스 $51.5B, $31.83을 크게 상회했다. 27년 1분기 가이던스는 $61.5B(+/- $1.5B), EPS $38.15(+/-$1.0)로 시장 컨센서스 $56.8B, $36.02를 상회하는 수준이다. 이 실적은 AI 서버용 고성능 메모리 수요가 지속되고 있음을 확인하는 신호로, 한국 반도체주(삼성전자·SK하이닉스 등)가 동반 급등하며 코스피·코스닥을 견인했다. 9월 한국 반도체 수출도 사상 최고치를 기록한 점이 기관투자자들의 강한 순매수에 힘을 더했다. 주성엔지니어링 등 KOSDAQ 반도체 장비주도 수주 호조와 AI 메모리 패키징 장비 수요 확대로 급등했다.\n\n---\n\n### 2. 로봇: 이벤트의 종료와 성과의 시작, 10월 수주·사업 일정 집중\n\n9월은 정부의 로봇 예산안 발표와 국내 기업의 사업화 진전이 확인된 한 달이었다. 정부 주도의 구매·실증 지원은 초기 매출과 레퍼런스 확보에 긍정적이며, 마이크로덕 판매 확대는 휴머노이드 대량 보급 이전에도 연구·개발용 부품에서 실적 기회를 열어주는 구조다. 삼성·현대차·LG의 제조 현장 및 데이터·학습 인프라 구축도 지속 중이다. 다만 휴머노이드 서밋에서 공개된 로보티즈–엔비디아 협업은 기술 적용·고도화 중심이며, 추가적인 사업 관계 진전은 확인이 필요하다. 10월에는 UAE 정상 방한 논의, AUSA, 장거리 공대공유도탄 및 초소형위성 사업 일정이 집중될 예정이다. 단기적으로는 테슬라·오픈AI 등 글로벌 기업 동향에 따른 종목별 흐름을 예상해야 하며, 연말~연초 대기업 로봇 사업 및 공급망 구체화에 주목할 필요가 있다.\n\n---\n\n### 3. 방산: 수주 기대는 중동으로, 10월 UAE 정상 방한·AUSA·장거리 공대공유도탄 일정 집중\n\n9월 방산 업종은 크로아티아 천무 수주에 이어 중동 방공체계 도입 기대가 부각됐다. UAE와는 L-SAM·M-SAM·천무 협력의 기본 틀을 마련했고, 쿠웨이트 천궁도 초기 협상 단계에 진입했다. 미국에서는 궤도형 자주포 사업과 한화의 탄약 생산거점 투자계획이 구체화됐으며, 국내에서는 KF-21 양산 1호기 인도를 계기로 기체 양산과 후속 무장 국산화에 대한 관심이 높아졌다. 10월에는 UAE 정상 방한 논의, AUSA, 장거리 공대공유도탄 및 초소형위성 사업 일정이 집중될 예정이다. 수주 기대와 함께 3분기 납품·환율 부담 및 4분기 실적 회복 가능성을 확인할 필요가 있다.\n\n---\n\n### 4. 조선: HD현대중공업의 발전엔진·SMR 증설로 장기 수요 확인, 중동·미국 함정사업 후보 평가 및 예산·제도적 절차 남아\n\nHD현대중공업이 총 1조722억원을 투자해 발전엔진·SMR 증설을 발표하며, HiMSEN 총 생산능력을 3.0GW에서 7.2GW로 확대할 계획이다. 이는 발전엔진 장기 수요에 대한 사측의 확신을 실제 CAPEX로 보여주는 변화다. 한화오션은 9월 VLGC·컨테이너선·LNG선 총 11척을 확보하며 수주 흐름은 여전히 강했으나, 머스크의 중국향 컨테이너선 26척 발주와 중국의 LNG선 시장 진입으로 장기 관점 경쟁 부담은 지속된다. 미국 함정사업은 후보 평가와 예산·제도적 절차가 남아 있고, 태국 호위함도 우선협상대상자 선정 이후 최종계약을 확인할 필요가 있다. 단기로는 임단협 타결과 DC향 엔진 및 FDC 수주 성과에 계속 주목해야 한다.\n\n---\n\n### 5. K-뷰티 중소형주: 레거시 브랜드들의 전략적 변화와 2026년 하반기 실적의 1차 성적표\n\n브랜드 업체들의 공통적인 특징은 레거시 브랜드가 많다는 것이다. 마케팅과 영업은 채널 측면에서는 오프라인, 지역적으로는 국내 또는 고작해야 중국/일본에 맞춰져 있는 2010년대적 구조다. K뷰티 글로벌 모멘텀의 주인공들과는 거리가 있고, 소외돼 있던 기업들이 많다. 2025년 중반부터 이들의 변화가 시작됐다. 신세대 인디브랜드들처럼 미국으로 나아가, 틱톡과 아마존을 중심으로, 마케팅비를 크게 올리면서 사업구조를 일신하겠다는 전략적 의지였다. 단기적인 수익성은 급격하게 악화되었고, 주가는 하락할 수밖에 없었다. 그걸 감내하더라도 지금 변하지 않으면 중탕 속 개구리가 될 수도 있다는 위기 의식도 작용했을 것이다. 브이티/에이블씨엔씨부터 시작한 이 흐름은 네오팜과 마녀공장, 최근에는 애경산업으로까지 이어지고 있다. 정도의 차이가 있지만, 클리오와 아이패밀리에스씨, 마녀공장, 제로투세븐도 영업/마케팅 방식에 메스를 들이대고 있다. 2026년 하반기 실적은 지난 1년 동안 레거시 브랜드들의 이런 변화와 노력의 1차 성적표로 볼 수 있다. 네오팜/에이블씨엔씨는 일찍 성과를 내고 있고, 브이티도 이익이 돌아서기 시작했다. 아직 갈 길은 멀고 과제도 많다. 특히, 시대의 흐름에 맞지 않은 조직 구조와 인력풀을 벗어나지 못하고 있는 기업들이 여전히 적지 않다. 주식시장은 냉정하다. 그런 기업들에 대해 가차 없이 밸류에이션을 내렸다. 그래서 숫자가 떨어진 것보다 주가 하락폭이 훨씬 컸다. 기업은 늘 변한다. 잘 보면 주가가 바닥인, 오를 일만 남은 기업을 찾을 수 있을 지도 모른다.\n\n---\n\n### 6. 에너지: 원유는 돌아와도 제품 부족은 여전하다, 미국 내수 공급 우선 움직임으로 수출 여력 있는 국내 정유사의 상대 매력 부각\n\n9월 정제마진의 일시적 급락과 휴전 논의에도 시장을 아웃퍼폼한 것은 이번 사이클을 이익 체력의 구조적 상향으로 인식하기 시작했다는 의미다. 원유 수송은 회복 중이나 제품 공급 차질과 낮은 재고는 지속되고 있다. 미국의 내수 공급 우선 움직임까지 감안하면 수출 여력을 갖춘 국내 정유사의 상대 매력이 부각될 전망이다.\n\n---\n\n### 7. K-게임: 검증된 IP 해외로, 신규 IP는 국내서… 10월 신작 성적은 4분기 실적과 연말 시장 판도에 직접 영향\n\n엔씨와 넥슨은 검증된 IP로 해외 시장을 공략하고, 카카오게임즈는 신규 IP로 국내 시장을 정면 승부한다. 10월 신작 성적은 국내 주요 게임사의 4분기 실적과 연말 시장 판도에 직접 영향을 줄 전망이다. 장수 IP의 해외 확장성과 신규 IP의 국내 시장 안착 여부가 핵심 관전 포인트다.\n\n---\n\n### 8. 은행: 3분기 마진 부진 예상, 2026년 12월부터 원가모형 적용 토지의 공시지가 주석 공시 신설\n\n8월 은행업종 예대금리차(NIS)는 2.20%로 전월 대비 2bp, 전년 말 대비 3bp 하락했다. 신규기준 예대금리차는 1.19%(+13bp)로 7개월 만에 확대됐으나, 잔액기준 예대금리차는 2.20%(-2bp)로 축소됐다. 2026년 12월 사업연도부터 원가모형을 적용하는 토지에 대해 부동산 가격공시에 관한 법률에 따른 공시지가를 주석에 공시하도록 기업회계기준서 제1016호 '유형자산'이 개정됐다. 부동산 가격공시에 관한 법률에 따른 공시지가가 존재하지 않는 토지와 해외 소재 토지는 공시 대상에 포함되지 않으며, 재평가모형을 적용하거나 재고자산 및 투자부동산으로 분류되는 토지도 제외된다.\n\n---\n\n### 9. 여행: 연말에 바닥을 고민해봐야 하는 이유\n\n2024년 말 정치적 이슈와 항공 참사, 2026년 전쟁에 따른 고유가 지속 등으로 2년 연속 업황이 부진했다. 하나투어 기준 2년 연속 패키지 송객 수 역성장이 예상되는데, 지난 20년간 코로나 시기를 제외하면 이번이 2번째다. 패키지 여행은 역성장이 아닌 저성장 산업으로 전술한 이슈들이 내년에 반복되지 않는다는 보장은 없지만, 반드시 이연 수요가 발생한다는 산업의 특성을 감안하면 2027년에는 회복의 가능성이 높다. 가파른 원화강세가 고유가(및 높은 유류할증료)로 상쇄되고 있는데, 만약 유가 이슈만 정상화된다면 높은 이연 수요를 기대해볼 수 있다. 2027년 예상 P/E 8~9배 수준의 현 주가 수준이라면 연말쯤에 한 번 고민해 볼 필요가 있다.\n\n---\n\n### 10. 디지털 자산: 칼시, 400억 달러 밸류로 10억 달러 조달 협상\n\n예측시장 플랫폼 칼시가 세쿼이아와 웰링턴 주도로 400억 달러 밸류에이션에 10억 달러 조달을 논의 중이다. 4개월 전 220억 달러에서 82% 급등한 수준으로, 예측시장의 제도권 자금 유입이 가속되고 있다.\n\n---\n\n### 11. 배당: 의류 산업 내 주요 기업들의 배당 등 주주환원 정책은 과거에 비해 많이 주주 친화적으로 개선\n\n의류 산업 내 주요 기업들의 배당 등 주주환원 정책은 과거에 비해 많이 주주 친화적으로 개선됐다. 투자와 내부 유보를 고려하여 배당 성향을 30%까지 끌어올리고 자사주 매입, 소각 등을 통해 주주환원수익율이 5~7%에 이르는 경우들이 늘어났다. 고금리 상황에서 배당수익률에 대한 눈높이가 높아졌지만, 여전히 5%가 넘는 배당수익률은 기업의 주가 측면에서는 견고한 저점을 만들어주고, 투자자들 입장에서는 안전한 투자처라는 인식 형성에 큰 도움이 된다. 당사 커버리지 의류 기업들의 배당 등 주주환원 정책은 11월 중순 3분기 실적 시즌 마무리 이후 내년 초까지 배당이 기업들의 주가 흐름에 주요 변수가 될 가능성이 높다. 이 시기에 의류 산업내 주요 기업들의 배당을 포함하는 포괄적인 주주환원 정책에 대해 본 보고서에 자세히 기술했다.\n\n---\n\n### 12. 보험: 고이원 장기채 투자 확대가 펀더멘털 개선의 핵심\n\n현재 보험사들은 금리 상승기에 장기채 매수를 줄이고 향후 금리 고점 인식과 함께 장기채 매수를 재개할 가능성이 높은 역설적인 상황이다. 금리 상승 수혜 강도는 업계 전반으로 약한 편이다. 현 시점에서는 고이원 장기채 투자를 확대할 수 있는 압도적인 자본 여력과 현금흐름을 기반으로 펀더멘털 개선이 기대되는 보험사에 선별적 접근이 필요하다. 최선호주는 삼성생명이며, 증시 변동성 노출이 부담이라면 메리츠금융지주가 대안이다. 차선호주는 DB손해보험이다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 마이크론 어닝서프라이즈 → 반도체주 동반 급등: 기술주의 실적 가시성 재확인\n\n9월 30일(수) 미국 증시는 8월 PCE 컨센서스를 하회한 헤드라인 3.4% (YoY), 근원 3.0%로 물가 둔화를 확인했지만, 미 10년물 금리가 장중 5.3%에 달하며 금리 상승세를 이어갔다. 그러나 마이크론 테크놀로지가 FY26 3분기 매출 540억 달러 (전년비 +379%), EPS $33.42로 컨센서스를 상회하며 **매출총이익률 87.0% (컨센서스 86%)**를 기록하면서 고수익성을 입증했다.\n\n> *한화투자증권*: \"에너지 섹터가 글로벌 전반적으로 상향\"  \n> *키움증권*: \"마이크론 어닝 서프라이즈가 10년물 금리 상승 압력을 일부 완화\"\n\n마이크론의 핵심 코멘트는 FY27 1분기 매출총이익률 가이던스 86.25% (컨센서스 86.4%)가 일회성 인센티브로 인해 소폭 하회했지만, FY27 2분기 이후 상승 전망이라는 방향성 제시였다. 또한 \"26년보다 27~28년이 메모리 공급 부족 심화\", \"고객사들의 2031년까지 공급 확보 요청\", \"장기공급계약(SCA) 지난 분기 16건 → 26건 확대, 전체 매출의 약 50% 달할 가능성\" 등 수급 개선 신호를 동시에 제시했다.\n\n이 실적 발표는 AI 메모리 수요가 실제 시장에 전이되고 있다는 신호로 해석되며, 미국 장 마감 후 시간외 마이크론 주가는 약 보합세를 보였다. 이는 1) 이번 실적에 대한 스트릿 컨센서스가 이미 높아졌고, 2) FY27 1분기 매출총이익률 가이던스가 기대치를 소폭 하회했기 때문이다. 그러나 9월 한 반도체 수출이 사상 최고치를 기록한 점과, 10월 반도체·하이퍼스케일러 등 주도주들의 3분기 실적 시즌이 예정되어 있다는 점을 감안할 때, 10월 주식시장의 하방 경직성은 이미 9월 중에 확인됐다. 전일 국내 증시는 미국 반도체주 반등과 10년물 금리 급등 진정으로 반도체를 중심으로 1%대 강세를 보였으나, 8월 PCE 경계심리와 분기말 글로벌 펀드 리밸런싱 매도 물량으로 상승분을 반납하며 혼조세로 마감했다.\n\n---\n\n### 2. 9월 한 반도체 수출 사상 최고치: 수출 호조 → KOSDAQ 반도체 장비주 폭등\n\n9월 한 반도체 수출이 사상 최고치를 경신한 것으로 집계됐고, 이는 기관투자자들의 강한 순매수와 맞물려 특히 KOSDAQ 반도체 장비주(주성엔지니어링 등)의 폭등을 이끌었다.\n\n> *키움증권*: \"9월 한 반도체 수출 실적 결과에 따라 상승 탄력이 달라질 수 있다\"\n\n이 수출 호조는 AI 서버·GPU·DRAM 등 고부가가치 반도체 수요 확대의 결과로, 수출 호조는 기술주의 이익 성장 모멘텀을 직접적으로 뒷받침한다. 9월 한 반도체 수출 실적 발표가 10월 주식시장의 상승 탄력성을 결정하는 핵심 이벤트로 작용할 전망이다.\n\n---\n\n### 3. 10월 중간선거와 코스피: 과거 패턴은 선거 전 약세 → 선거 후 회복, 금리 인상기에는 제한적 회복세\n\n과거 코스피와 중간선거 패턴은 선거 전 약세를 보이다가 선거 이후 회복하는 흐름을 보였다. 다만 조정이 선거일까지 이어지기보다는, 평균적으로 선거 3~4주 전후에 저점을 형성한 뒤 하락세가 진정되는 패턴이 나타났다. 이번 선거 일정에 대입하면 10월 초중순에 해당하는 구간이다. 코스피와 S&P500의 저점 시점이 대체로 유사했다는 점은 이 조정이 국내 요인만으로 설명되기보다, 미국 정치 이벤트를 앞둔 글로벌 위험회피와 함께 나타났을 가능성을 시사한다.\n\n선거 이후에는 두 시장 모두 회복 흐름이 확인됐다. 선거 후 6개월과 12개월 수익률은 대체로 플러스였고, 저점 대비 반등폭도 코스피와 S&P500이 10% 안팎으로 비슷했다. 그러나 선거 이후 경로는 연준의 기준금리 국면에 따라 차이를 보였다. 선거 후 3개월까지는 기준금리 인상기와 비인상기의 코스피 흐름이 대체로 유사했지만, 금리 인상기였던 2018년, 2022년에는 이후 반등분을 일부 되돌리며 12개월 시점에 선거일 수준으로 복귀했다. 반면 완화/동결기에는 12개월까지 상승 흐름이 비교적 유지됐다. 이는 금리 인상기에는 선거 불확실성이 완화되더라도 고금리 부담이 코스피의 회복 지속성을 제약할 수 있음을 시사한다. 2026년 역시 인상기에 해당하고 최근 장기금리 상승 압력도 높아진 만큼, 선거 이벤트 통과만으로 추세적 상승을 기대하기보다는 금리 부담이 얼마나 완화되는지를 함께 확인할 필요가 있다.\n\n---\n\n### 4. 미국 10년물 금리 5% 돌파: 기대수익률-10년물 국채금리(일드갭) 제로 수렴 → 채권 대비 주식 매력 소멸 직전\n\n미국 10년물 국채금리가 5%를 상회하며 S&P500 기준 **일드갭(기대수익률-10년물 국채금리)이 제로 수준**에 수렴했다. 채권 대비 주식 투자 매력이 소멸되기 직전의 국면이다. 다만 국제 유가(WTI 기준)가 고점을 낮추고 있다는 점과 지정학적 리스크에 대한 가격 민감도가 낮아지고 있다는 점을 감안 시 기대인플레이션 부담이 완화되고 있다는 변화는 그나마 긍정적이다.\n\n> *하나증권*: \"미국 10년물 국채금리가 5%를 상회하며 S&P500 기준 일드갭(기대수익률-10년물 국채금리)은 제로로 수렴했다. 채권 대비 주식 투자 매력이 소멸되기 직전이다.\"\n\n---\n\n### 5. 2026년 S&P500 2분기 대비 3분기 또는 2026년 대비 2027년 ROE 상승, FCF 증가 예상 기업 선별 전략\n\n1999년에도 투자 주도 성장, 연준 기준금리 인상(하반기), 시중금리 상승이 동시에 진행되면서 주도 업종 내 주가 차별화가 심화됐다. 당시 주가 차별화를 결정했던 변수는 ROE였다.\n\n> *하나증권*: \"1999년에도 투자 주도 성장, 연준 기준금리 인상(하반기), 시중금리 상승이 동시에 진행되면서 주도 업종 내 주가 차별화가 심화됐다. 당시 주가 차별화를 결정했던 변수는 ROE였다.\"\n\n따라서 금리 5% 시대에는 업종 선택뿐 아니라 **기업 선별이 중요**하다. S&P500 내 ① 2026년 2분기 대비 3분기 또는 2026년 대비 2027년 ROE 상승, ② FCF 증가 예상 기업 중심으로 포트폴리오 구성하는 전략이 필요하다.\n\n---\n\n### 6. 코스피 할인율은 이미 상승해 있고, YoY 이익 증가율 둔화 초기 국면에서는 영업이익률 상승 여부가 주가 차별화를 결정\n\n코스피의 경우 이미 국제 유가와 시중금리 상승을 반영하며 할인율이 급등해 있다는 점은 감안할 필요가 있다. 특히 YoY 이익 증가율 둔화 초기 국면에서는 **영업이익률 상승 여부**가 주가 차별화를 결정하는 중요한 변수가 될 수 있다.\n\n> *하나증권*: \"코스피의 경우 이미 국제 유가와 시중금리 상승을 반영하며 할인율이 급등해 있다는 점은 감안할 필요가 있다. 특히 YoY 이익 증가율 둔화 초기 국면에서는 영업이익률 상승 여부가 주가 차별화를 결정하는 중요한 변수가 될 수 있다.\"\n\n따라서 코스피 내에서 ① 할인율은 이미 상승해 있고, ② 원화강세를 감안해 영업이익률을 조정하더라도 2026년 2분기보다 3분기 영업이익률 상승(2027년 전망치도 고려), ③ FCF 증가 예상 기업에 대한 비중 확대 전략이 유효하다.\n\n---\n\n### 7. AI·반도체 모멘텀에 글로벌 증시 하단 지지, 중동 리스크는 부담\n\nAI·반도체 모멘텀에 글로벌 증시 하단이 지지됐다. 미국 증시는 중동 충돌 격화와 유가, 금리 상승으로 투자심리가 위축됐지만, 연준의 긴축적인 통화정책이 상당 부분 선반영됐다는 인식 속 유가와 금리 상승세가 진정됐고, AI 투자 및 반도체 수요 기대가 재차 부각되며 기술주 중심으로 반등했다.\n\n중국 증시는 8월 수출 호조와 AI·첨단 제조업 기대가 긍정적이었으나, 내수 회복이 더딘 가운데 급등했던 로봇·첨단기술주를 중심으로 차익 매물 출회되며 하락했다.\n\n---\n\n### 8. WTI 90달러에서 80달러로 하락 시 S&P500 기대수익률 13%, 코스피 11%\n\nWTI 가격이 90달러에서 80달러까지, 10년물 국채금리 하락 시 S&P500 지수의 기대수익률은 13%, 코스피는 11%다. 4분기에는 2027년 이익 추정치 변화가 중요하다. 최근 3년간 4분기 주가 수익률이 높았던 업종의 공통점은 3분기 실적 발표 중 다음 연도 이익 추정치가 상향 조정됐다는 점이다.\n\n> *하나증권*: \"WTI 가격이 90달러에서 80달러까지, 10년물 국채금리 하락 시 S&P500 지수의 기대수익률은 13%, 코스피는 11%다. 4분기에는 2027년 이익 추정치 변화가 중요하다. 최근 3년간 4분기 주가 수익률이 높았던 업종의 공통점은 3분기 실적 발표 중 다음 연도 이익 추정치가 상향 조정됐다는 점이다.\"\n\n---\n\n### 9. 경기선행지수 순환변동치 104.2로 하락 전환: 10개월 만의 하락 전환, 경기 피크 아웃 우려 재점화\n\n8월 경기선행지수 순환변동치는 7월 104.3을 정점으로 8월 104.2로 하락 전환했다. 이는 경험적으로 매우 높은 수준에서의 하락 전환이기 때문에 순환적 하락 국면에서의 하락 전환 시그널이 될 가능성이 있다.\n\n경험적으로 경기선행지수 순환변동치는 하락 사이클에서 평균 20개월 전후로 하락했고 모두 100이하까지 하락했었다. 경기선행지수 순환변동치의 하락 국면에서 코스피는 대체로 부진한 흐름을 보인 바 있다. 금리 상승과 증시 변동성 확대가 맞물리면서 경기선행지수 순환변동치가 하락 전환 흐름을 지속할 경우 향후 27년, 28년 국내 경제 전망에 대한 눈높이는 시차를 두고 하향 조정될 가능성이 크다. 이는 현재 주식 시장에서 반영되고 있는 경기 피크 아웃 우려가 지속적으로 영향을 줄 가능성을 시사한다. 경기선행지수 순환변동치의 하락 흐름은 경기 둔화 및 기업 실적 하향 조정을 동반 야기할 수 있어 반도체 실적 전망에 대해서도 신경이 쓰일 수 있는 부분이다.\n\n---\n\n### 10. 8월 산업활동동향: 대체로 둔화, 경기선행지수 하락 전환은 경기 모멘텀 둔화 신호\n\n8월 산업활동동향에 나타난 대부분의 경제지표는 대체로 전월대비, 전년동기대비 수치에서 둔화되는 모습을 보였다. 7월과 8월 연속된 한은의 기준 금리 인상과 주식 시장 급락 등이 8월 경제 지표 둔화에 어느 정도 영향을 주었을 것으로 추정된다.\n\n세부적으로 살펴 보면 다음과 같다.\n\n- 전산업생산은 MoM -1.3%를 기록했다. 서비스업 생산은 +0.5%를 보였으나 광공업 생산은 -4.8%로 부진한데 따른 영향이다.\n- 소매판매는 MoM -1.8%를 기록했다. 승용차, 음식료품 등에서 판매가 부진했고 금리 상승 및 증시 변동성 확대 등의 영향이 소비 심리에 부정적인 영향을 주었을 것으로 추정된다.\n- 설비투자는 MoM -9.5%를 기록했다. 이 부분은 운송장비 투자가 줄어든데 따른 영향이 있으나 6~7월이 매우 좋았기 때문에 8월에는 모멘텀이 둔화된 영향도 있는 것으로 보인다.\n- 경기와 관련된 지표는 상반된 흐름을 보였다. 반도체를 중심으로 한 수출 호조에 힘입어 경기동행지수 순환변동치는 전월대비 0.5p 상승했으나, 경기선행지수 순환변동치는 전월대비 0.1%p 하락했다.\n\n특히 주식 시장과 민감도가 높은 경기선행지수의 순환변동치 하락은 예의주시할 필요가 있다. 경기선행지수 순환변동치는 작년 10월 이후 10개월 만에 하락 전환했다. 경기선행지수 순환변동치는 7월 104.3을 정점으로 8월 104.2로 하락했는데, 이는 경험적으로 매우 높은 수준에서의 하락 전환이기 때문에 순환적 하락 국면에서의 하락 전환 시그널이 될 가능성에 주시할 필요가 있다.\n\n---\n\n### 11. 8월 수출 호조는 반도체 수요 확인, 내수 부진은 경기선행지수 하락의 구조적 원인\n\n8월 수출 호조는 반도체 수요가 실제로 시장에 전이되고 있다는 신호로, 이는 AI 메모리 수요 확대의 결과이다. 그러나 내수 부진은 경기선행지수 하락의 구조적 원인으로 작용하고 있다. 8월 산업활동동향 결과는 대체로 국내 경기 피크 아웃 우려, 경기 모멘텀 둔화 등을 보여주고 있기 때문에 하반기 이후 매수 주체 부재 현상의 지속 가능성을 시사한다.\n\n---\n\n### 12. 외국인 4거래일 연속 순매도, 개인 수급도 하반기 매도 우위로 전환\n\n하반기 들어 대형 반도체 기업들의 자사주 매입에 따른 기타 법인 매수세를 제외하고 뚜렷한 매수 수급 주체가 없는 상황이어서 외국인의 매도 압력은 부정적인 영향을 줄 수 있다. 또한, 금리 상승, 원/달러 환율 재 반등 조짐, 글로벌 자금의 미국 IT 매수 확대 등의 영향도 외국인의 지속적인 매도를 자극할 수 있는 리스크 요인이다.\n\n상반기 매수 주체였던 개인 수급도 하반기 매도 우위로 돌아섰고 고객예탁금이 현저히 줄며 자금 이탈 가능성을 시사한다. 개인 자금은 높아진 금리에 따른 예금 수요로 또한 미국 증시로 이동하고 있는 것으로 보여진다.\n\n---\n\n### 13. 4분기 중국 주식시장 구조: 경기(EPS)와 미국 금리(할인율)의 조합\n\n4분기 중국 주식시장 구조도는 경기(EPS)와 미국 금리의 조합으로 압축된다. 경기 회복은 이익 Breadth를 넓히고, 할인율 하락은 기술주 리레이팅 여지를 높인다. 다만 구조적인 내수 부진을 감안하면 경기의 강한 반전을 전제로 한 1·2사분면 가능성은 높지 않다. 재정 집행이 가속되더라도 경기는 강한 반등보다 하방 압력 완화에 그칠 가능성이 높다.\n\n현실적인 경로는 ① 고금리 국면에서 기술주와 방어주가 공존하는 Barbell Market과 ② 할인율 안정 시 AI 하드웨어가 재평가되는 Tech Re-rating이다. 두 국면을 가르는 핵심 변수는 미국 10년물 금리다.\n\n---\n\n### 14. 2026년 10월 코스피 전망: 7,000pt 중후반 진입, 10년물 금리 고점 확인 이후 반등 기대\n\n10월 코스피 전망 범위는 7,185~8,050으로 설정된다. 이는 12MF EPS 402.3에 PER 17.9~20.0배를 적용한 결과이다. 하단은 사상 최고 수준의 기업 이익이 지지하고, 상단은 2008년 이후 최고인 실질금리(2.89%)가 제한하는 구도다. 다만 2년물에 추가 인상 4회가 반영된 만큼 금리는 고점에 가까워지고 있다는 판단이다. 역대 긴축기 중간선거 시즌이 금리 고점기였음도 상기할 필요가 있다.\n\n10월 중에는 실질금리 3.1~3.3%까지의 추가 상승과 그에 따른 조정 가능성을 열어둘 필요가 있다. 그러나 10/28 FOMC와 11/4 QRA를 거치며 금리 고점이 확인될 경우 회복세가 예상되며 해당 경로에 따라 ‘V’자형 흐름을 전망한다. 10월 중에는 반도체, 하이퍼스케일러 등 주도주들의 3분기 실적 시즌이 예정되어 있다는 점도 안도 요인으로 판단한다.\n\n---\n\n### 15. 대외 여건 개선에도 주요 이벤트 대기: KOSPI 방향성 탐색\n\n대외 여건 개선에도 주요 이벤트 대기 상황이다. 9월 중에는 역사적으로 부진했다는 계절적 증시 통념이 있었지만, 실제 이번 9월 주식시장은 중립 수준의 성과를 시현했다. 월 중 미국 10년물 금리 5%대 돌파, 중동발 유가 불안, AI 속도조절론 등 매크로 및 펀더멘털 상으로 불확실성이 빈번하게 증시에 부담을 가했지만, 증시 저점을 깨뜨리기 보다는 상단을 억제하는 데 그쳤다. GPT-6, 메타 뮤즈 등 에이전트 AI 내러티브 확산, 고금리 장기화에 대한 내성 생성 등과 같이 상방 모멘텀이 등장했다는 점도 위험선호심리를 지속시키는 데 기여했다. 전체적으로 보합 수준의 박스권 흐름을 보였던 9월 주식시장이었지만, 매크로 불확실성이 증폭되는 환경 속에서 이 같은 주가 방어력을 보여준 점은 긍정적이다.\n\n---\n\n### 16. 중동 충돌 격화와 사우디 공급 차질 우려 → 유가 급등, 이후 미국·이란 완화적 스탠스와 사우디 공급망 회복 기대로 상승폭 일부 반납\n\n중동 충돌 격화와 사우디 공급 차질 우려로 국제 유가가 급등했으나, 이후 미국·이란 간 완화적 스탠스와 사우디 공급망 회복 기대가 복합적으로 작용하며 상승폭 일부를 반납했다. Kpler에 따르면 9월 호르무즈 해협을 통과한 원유는 하루 평균 약 1,000만 배럴, 우회 송유관과 항만을 통한 수출은 약 600만 배럴을 기록해 중동 지역 전체 원유 수출은 하루 약 1,600만 배럴까지 확대되어 전쟁 이전의 약 80% 수준에 도달했다. 사우디의 공급망 정상화도 국제 유가 하락을 뒷받침했으며, 이달 초 하루 150만 배럴에서 현재 650만 배럴까지 회복했고, 동서 송유관을 통한 수송량도 하루 350만 배럴까지 증가했다.\n\n---\n\n### 17. 미국 8월 JOLTS 구인건수 707.9만건: 예상치·이전치를 모두 하회, 고용 둔화 신호 확인\n\n미국 8월 JOLTS 구인건수는 707.9만건으로 예상치와 이전치를 모두 하회하며 고용 둔화 신호를 확인했다. 그러나 미국채 10년물과 30년물 금리는 각각 5.21%, 5.55% 수준으로 여전히 높은 수준을 유지하며 증시에 부담으로 작용했다.\n\n---\n\n### 18. 달러인덱스 100 돌파: 연준 긴축 필요성 재부각, 달러-엔 환율은 BOJ의 25bp 금리 인상 이후 추가 긴축 신호가 제한되며 일시 반등했으나, 미·일 당국의 엔화 약세 경계와 외환시장 개입 가능성이 부각되며 재차 하락\n\n달러인덱스는 100을 돌파했다. 월 초 일부 연준 인사의 금리 동결 가능성 언급으로 약세를 보이기도 했지만, 높은 물가와 국제 유가 상승으로 긴축 필요성이 재차 부각됐다. 연준이 9월 FOMC에서 25bp 인상을 단행하고 추가 인상 가능성을 열어두면서 미국 금리 상승과 함께 달러 매수세가 확대됐다. 달러-엔 환율은 BOJ의 25bp 금리 인상 이후 추가 긴축 신호가 제한되며 일시 반등했으나, 미·일 당국의 엔화 약세 경계와 외환시장 개입 가능성이 부각되며 재차 하락했다.\n\n---\n\n### 19. 8월 수출 호조와 AI·첨단 제조업 기대가 긍정적이었으나, 내수 회복이 더딘 가운데 로봇·첨단기술주를 중심으로 차익 매물 출회되며 하락\n\n중국 증시는 8월 수출 호조와 AI·첨단 제조업 기대가 긍정적이었으나, 내수 회복이 더딘 가운데 로봇·첨단기술주를 중심으로 차익 매물 출회되며 하락했다. 10월부터 시행하는 주택구입 대출 이자보조 정책이 시장 기대에 미치지 못했다는 평가에 부동산주도 급락했다. 상해종합지수는 전 거래일 대비 0.31% 상승한 3,842.19P로 마감했다.\n\n---\n\n### 20. 금리 5% 시대, 어떤 주식을 사야 할까: 코스피 내 할인율은 이미 상승해 있고, 2026년 2분기보다 3분기 영업이익률 상승(2027년 전망치도 고려), FCF 증가 예상 기업에 대한 비중 확대 전략\n\n금리 5% 시대에는 코스피 내에서 할인율은 이미 상승해 있고, 2026년 2분기보다 3분기 영업이익률 상승(2027년 전망치도 고려), FCF 증가 예상 기업에 대한 비중 확대 전략이 유효하다. 2026년 2분기 대비 3분기 또는 2026년 대비 2027년 ROE 상승, FCF 증가 예상 기업 중심으로 포트폴리오 구성하는 전략이 필요하다.\n\n---\n\n### 21. 10월 FOMC 금리 동결 확률 55.2% 상승, 연준 긴축 기조와 중동 리스크는 부담\n\n9월 FOMC에서 25bp 인상을 단행하고 추가 인상 가능성을 열어두면서 미국 금리 상승과 함께 달러 매수세가 확대됐다. 10월 FOMC 금리 동결 확률은 55.2%로 상승했다. 연준의 긴축 기조와 중동 리스크는 여전히 부담 요인이다.\n\n---\n\n### 22. 경기선행지수 하락 전환: 10개월 만의 하락 전환, 경기 피크 아웃 우려 재점화\n\n경기선행지수 순환변동치는 작년 10월 이후 10개월 만에 하락 전환했다. 이는 경험적으로 매우 높은 수준에서의 하락 전환이기 때문에 순환적 하락 국면에서의 하락 전환 시그널이 될 가능성이 있다. 경기선행지수 하락 흐름은 경기 둔화 및 기업 실적 하향 조정을 동반 야기할 수 있어 반도체 실적 전망에 대해서도 신경이 쓰일 수 있는 부분이다.\n\n---\n\n### 23. 글로벌 EPS: 대체로 선진국이 신흥국보다 양호, 미국은 소재, 에너지 섹터 강세, 일본은 모든 섹터 상향됐으나 1% 이내 변동, 중국은 커뮤니케이션 섹터가 상승한 반면 경기소비재는 부진, 한국은 에너지 섹터 강세\n\n글로벌 EPS는 대체로 선진국이 신흥국보다 양호했다. 미국은 소재, 에너지 섹터 강세를 보였다. 일본은 모든 섹터 상향됐으나 1% 이내 변동했다. 중국은 커뮤니케이션 섹터가 상승한 반면 경기소비재는 부진했다. 한국은 에너지 섹터 강세를 보였다. 에너지 섹터가 글로벌 전반적으로 상향됐다.\n\n---\n\n### 24. 글로벌 EPS Live: 글로벌신흥국 상위에 삼성SDI, 삼성바이오로직스, 현대차, LG전자, SK하이닉스, 현대모비스, 셀트리온 진입, 하위에 LG에너지솔루션 진입, 선진국 상위에 석유, 가스 등 에너지 섹터 종목 다수 진입, 하위에 키엔스, 소니, 에어버스 진입\n\n글로벌신흥국 상위에 삼성SDI, 삼성바이오로직스, 현대차, LG전자, SK하이닉스, 현대모비스, 셀트리온이 진입했다. 하위에 LG에너지솔루션이 진입했다. 선진국 상위에 석유, 가스 등 에너지 섹터 종목이 다수 진입했다. 하위에 키엔스, 소니, 에어버스가 진입했다.\n\n---\n\n### 25. AI 기술 발전이 여러 논란에도 강세장을 지지하고 있다\n\nAI 기술 발전이 여러 논란에도 강세장을 지지하고 있다. 전쟁, 재정적자 등 부담을 주시하며 글로벌 국채금리는 계속해서 고점을 높여가고 있고, 달러지수 역시 고공 행진하는 등 매크로 부담은 가중되고 있는 상황이다. 그러나 Citi 매크로 리스크 지수가 이전 고점을 돌파하고 계속 높아지는 등 불편한 환경이 조성되고 있지만 상대적으로 S&P500 지수는 견조한 흐름을 이어가고 있다. 이는 곧 현재 증시가 강달러, 고금리라는 매크로 부담을 버틸 체력을 가지고 있다는 것을 의미한다. 국채금리가 연일 급등하며 분명 지수 상승세에 제동이 걸린 것은 맞지만 제한적인 낙폭을 고려할 때 국채 투매 현상이 완화될 시 증시 반등 폭이 클 수 있음을 시사하고 있다.\n\n---\n\n### 26. 9월 5일 GPT-6 Astra 발표: AI 사상 최초 수능 만점 기록, 밀레니엄 수학 난제 풀이에 기여\n\n9월 5일 GPT-6 Astra가 AI 사상 최초 수능 만점을 기록하고 밀레니엄 수학 난제 풀이에 기여했다. 이 발표는 온 세상이 난리였지만, 그 기대감은 3주를 넘기지 못했다. 9월 22일에는 경량 모델이지만 효율이 좋은 Sonnet 5.5가 출시되자 2026년 최고의 AI 모델 확률값이 다시 클로드로 크게 뒤집힌 것이다. 9월 28일에는 Claude 신모델 Opus 5.5가 9월 22일 출시되자 2026년 최고의 AI 모델 확률값이 다시 클로드로 크게 뒤집힌 것이다. 9월 28일에는 Claude 신모델 Opus 5.5가 9월 22일 출시되자 2026년 최고의 AI 모델 확률값이 다시 클로드로 크게 뒤집힌 것이다. Anthropic은 11월 미국 중간선거 전후 기업 공개 기대감이 모아지고 있는데, AI 성능이 너무 향상되면서 AI 보안 문제가 초미의 관심사로 부상하고 있다.\n\n---\n\n### 27. 프론티어 AI 경쟁: Claude Opus 5.5, IPO 앞두고 왕좌 수성\n\n프론티어 AI 경쟁: Claude Opus 5.5, IPO 앞두고 왕좌 수성  \n9월 5일 GPT-6 Astra가 AI 사상 최초 수능 만점을 기록하고 밀레니엄 수학 난제 풀이에 기여했다. 이 발표는 온 세상이 난리였지만, 그 기대감은 3주를 넘기지 못했다. 9월 22일에는 경량 모델이지만 효율이\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n미국 10년물 금리가 5%를 돌파하며 주식-채권 수익률 역전이 발생한 점에서 채권 대비 주식의 상대적 매력도가 하락했고, 자금 이동이 채권 쪽으로 확대될 가능성이 제기된다. 반도체 호조와 마이크론의 어닝서프라이즈는 주식 시장에 긍정적인 영향을 주었으나, 채권 시장에서는 수요 부재와 공급 조절 기대감이 주요 요인으로 작용하며 금리 변동성이 커졌다. 산업 섹터별로는 반도체, 로봇, 방산 등에서 수주와 실적 호조가 나타났으나, K-뷰티 중소형주나 여행 등은 여전히 부진한 모습을 보이며 시장 내 구조적 차별화가 두드러진다. 이러한 상황에서 투자자들은 자산 배분 전략에 유연한 접근이 필요하다."}]}</script>
