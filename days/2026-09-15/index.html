<script id="__DATA__" type="application/json">{"date": "2026-09-15", "headline": "원/달러 환율: 단기 하락 마무리, 달러 강세 전망", "market": {"KOSPI": {"label": "코스피", "value": 6627.26, "change": -0.85, "unit": "%"}, "KOSDAQ": {"label": "코스닥", "value": 812.41, "change": 0.7, "unit": "%"}, "FX_USDKRW": {"label": "원/달러 환율", "value": 1364.5, "change": 1.19, "unit": "%"}, "CLcv1": {"label": "WTI 유가", "value": 105.83, "change": 0.0, "unit": "%"}, "GCcv1": {"label": "국제 금", "value": 4332.8, "change": 0.0, "unit": "%"}, "US10YT=RR": {"label": "미국 10년 국채금리", "value": 5.006, "change": 4.5, "unit": "bp"}, "KR10YT=RR": {"label": "한국 10년 국채금리", "value": 4.588, "change": 5.6, "unit": "bp"}, ".DJI": {"label": "다우존스", "value": 52093.11, "change": -0.63, "unit": "%"}, ".INX": {"label": "S&P 500", "value": 7585.73, "change": -0.45, "unit": "%"}, ".IXIC": {"label": "나스닥", "value": 25981.57, "change": -0.78, "unit": "%"}}, "shock_md": "## 오늘의 매크로 충격 지표\n\n- **원/달러 환율** 상승 +1.19% (현재 1364.5, 전일 1348.5, 임계값 1.0% 초과)\n\n---\n", "tabs": [{"title": "매크로(경제)", "md": "## 매크로(경제)\n\n### 1. 원/달러 환율: 단기 하락 마무리, 달러 강세 전망  \n한화투자증권은 원/달러 환율이 1,320원 선 하단으로 낙폭 축소 흐름을 예상하며, 단기적으로는 1,300원 중후반으로 반등할 가능성을 제시했다. 이는 미국의 8월 Core CPI 상회와 연준의 긴축 경계심리 강화, 고유가에 따른 글로벌 인플레이션 기저 부담 등이 달러 수요를 높이고 있기 때문이라고 설명했다.  \n과거 관련 리포트에서는 9월 14일 한화투자증권이 원/달러 환율 하락을 예측했으나, 오늘은 달러 강세로 전환하며 시장 전망이 뒤바뀌었다.\n\n### 2. 코스피 급락: AI 속도 조절론과 지정학적 긴장 영향  \n키움증권은 9월 14일 코스피가 AI 속도 조절론과 지정학적 긴장으로 인해 6,600대까지 급락했다고 보고했다. 외국인과 기관의 순매도가 지수 하락을 가속화했으며, 삼성전자와 SK하이닉스 등 대형주가 주도한 하락이 관찰되었다.  \n이번 하락은 9월 14일 키움증권의 이전 리포트에서 예상했던 시장 불안감이 현실화된 것으로, AI 관련 우려와 지정학적 리스크가 지속적으로 시장을 압박하고 있다.\n\n### 3. AI 개발 속도 조절론 가능성 낮아, 경쟁 심화 예상  \niM증권은 AI 개발 속도 조절론이 현실화될 가능성은 낮으며, 오히려 AI 개발업체들이 경쟁을 위해 투자를 확대할 것으로 전망했다. 미국과 중국의 AI 패권 경쟁이 속도조절론을 저해하는 요인으로 작용하고 있으며, 트럼프 대통령 등 정치권의 AI 성장 속도에 대한 반대도 조절론을 어렵게 만들고 있다.  \n이에 따라 AI 개발은 더욱 가속화될 것으로 보이며, 데이터센터 건설 등 관련 산업에 대한 투자도 증가할 전망이다.\n\n### 4. 엔화 강세 지속, 원/엔 환율 반등 가능성  \n한화투자증권은 일본은행의 매파적 스탠스와 미-일 간 통화정책 경계심리로 인해 엔화 강세가 지속될 것으로 보고, 원/엔 환율이 점진적으로 반등할 가능성이 있다고 분석했다.  \n이에 따라 원화 투자자들은 엔화 자산 확대 전략을 고려하는 것이 유리하다고 판단했으며, 엔/달러 환율의 추가 급등 가능성은 낮다고 보았다.  \n과거 관련 리포트에서는 9월 14일 한화투자증권이 엔화 강세에 대한 우려를 제기했으나, 오늘은 원/엔 환율 반등 가능성을 강조하며 시장 전망이 변화했다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n### 1. **국내 채권 금리의 보합-하락 흐름과 미국 금리 기대의 연동 심화**\n\n국내 채권시장에서 중단기 금리는 보합, 장기 금리는 하락하는 모습을 보였으며, 일드커브는 플래트닝 구간을 유지했다. 유안타증권은 사우디 동서 송유관 피격에 따른 유가 급등 우려가 있었지만, 코스피 급락과 외국인의 10년 국채선물 매수세로 인해 금리 상승폭이 제한됐다고 분석했다. 유진투자증권도 미국의 물가지표 상승과 9월 FOMC 인상 가능성 확대에도 불구하고, 국내 금리 상승폭은 매우 제한적이었다고 강조했다. 이는 국내 금리가 이미 미국 금리에 비해 상승했다는 인식과 함께 15일 국채선물 만기 전 매수세가 영향을 미쳤다는 점에서 설명된다.\n\niM증권은 3분기 들어 국고채 금리가 지속 상승하고 있으며, 특히 미국의 고용 및 물가지표 상승으로 인한 단기물 금리 상승 압력이 커지고 있다고 지적했다. 9월 FOMC에서 25bp 인상 확률이 86%로 상승한 상황에서, 국내 금리 역시 미국 금리와의 연동이 심화되고 있다. 이는 국내 금리가 미국의 금리 정책에 따라 움직이는 ‘연동형’ 채권 시장의 특성과 맞물린다. 다만, 유진투자증권은 국내 채권시장이 장단기 방향이 엇갈리며 플래트닝 마감했다고 분석하며, 미국 금리 기대와는 별도로 국내 경제 상황이 영향을 미치고 있다고 보았다.\n\n### 2. **국내 크레딧 스프레드의 제한적 확대와 추석·분기말 유동성 압력**\n\niM증권은 추석과 분기말이 중첩되는 시기에는 단기자금 유출이 발생해 국고금리 및 크레딧 스프레드의 변동폭이 확대되는 경향이 있다고 분석했다. 실제로 3분기 들어 국고3년 금리는 4%를 돌파했으며, 국고10년 금리도 4.5%를 넘어서고 있다. 그러나 이 기간 동안 크레딧 스프레드는 보합 또는 축소하는 모습을 보였다. 공사채와 은행채는 발행량 증가로 인해 보합국면을 유지했고, 여전채는 강세를 보였다. 이는 높아진 금리 상황에서도 우량 채권에 대한 캐리 매력이 작용했기 때문으로 보인다.\n\n다만, 추석 연휴와 분기말이 겹치는 상황에서 단기자금 유출이 가속화될 가능성이 크다. 이는 단기금리의 변동폭 확대를 통해 크레딧 시장에 간접적인 부담으로 작용할 수 있으며, 특히 MMF 자금의 유출이 심화될 경우 단기자금시장의 수급 여건이 타이트해질 수 있다. 이에 따라 추석 이후에는 크레딧 스프레드가 확대될 가능성이 있다.\n\n### 3. **잠재성장률 상승과 금리 사이클의 재조정 가능성**\n\niM증권은 국내 잠재성장률이 상승했지만, 이는 금리 인상의 시점을 약간 늦추는 명분이 될 뿐, 금리 사이클 전체적으로는 오히려 인하의 문턱을 높이는 요인이라고 분석했다. 한은은 26년과 27년 성장률 전망을 각각 3.3%, 2.9%로 상향 조정했으며, 이는 반도체 수출 증가와 교역조건 개선, 기업이익·임금·자산가격 상승 등을 통해 실질 GDI가 급격히 증가한데 기반을 두고 있다.\n\n이러한 성장세는 AI 투자 → 반도체 수요 → 수출가격 상승 → 기업이익·임금·자산가격 → 소비·설비투자로 이어지는 소득경로를 통해 작용하고 있다. 한은은 이에 따라 잠재성장률 상승이 실질 균형금리(r) 상승을 유도할 수 있다고 판단했으며, 이는 중립적 기준금리 수준을 높일 수 있다. 따라서 잠재성장률 상승이 금리 인상의 시점을 늦추는 명분이 될 수 있지만, 금리 사이클 전체적으로는 오히려 인하의 문턱을 높이는 변수가 될 수 있다는 점에서 주의가 필요하다.\n\n### 4. **유럽 금리 상승의 차별화된 요인과 국내 금리 연동 가능성**\n\n신한투자증권은 유럽 주요국의 금리 상승 요인에 대해 분석하며, 독일과 영국은 유가 급등에 따른 긴축 경계 확대가 주요 원인이라고 보았다. 반면 프랑스는 재정 우려가 주된 요인으로 작용했다. 이는 유럽 내 국가별 경제 상황과 정치적 요인이 금리 결정에 다르게 반영되고 있음을 보여준다.\n\n이러한 유럽 금리 상승 동향은 국내 채권시장에도 간접적인 영향을 미칠 수 있다. 특히 미국의 금리 기대와 함께 유럽 금리 상승이 지속될 경우, 글로벌 금리 상승 기대가 국내 채권시장에도 전파될 가능성이 있다. 다만, 국내 경제 상황과 한은의 통화정책 방향이 국내 금리에 결정적인 영향을 미치기 때문에, 유럽 금리 상승이 국내 채권시장에 미치는 영향은 제한적일 수 있다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n### 1. 디지털 자산: EU 사이버복원력법 시행으로 보안 의무 강화\n유안타증권은 EU의 사이버복원력법(CRA)이 9월 12일 발효되면서, 디지털 자산 지갑 업체들이 악용 취약점을 24시간 내 조기 보고하고 72시간 내 정식 통지해야 한다고 밝혔다. 이로 인해 보안 규제가 강화되며, 지갑 업체들의 시스템 보안 및 응급 대응 능력에 대한 검증이 필요해질 것으로 예상된다.\n\n### 2. 데이터센터 건설 지출 재가속, MW 단위 증가율 상승\n교보증권은 미국 데이터센터 건설 지출이 2분기 이후 재가속되었으며, 7월 기준 SAAR $75.2bn(+57.2%)을 기록했다고 분석했다. MW당 건설비 상승률을 12%로 가정할 경우, 용량 증가율은 7월 기준 +40.4%에 달했다. 이는 빅테크 기업들의 CapEx 가이던스와 일치하며, 데이터센터 수요 확대에 따른 건설 지출 증가가 지속될 것으로 보인다.\n\n### 3. 현대차, 자율주행 로드맵 발표 및 기술 개발 진행\n하나증권은 현대차그룹이 2028년 상반기 엔비디아 기반 L2+ 자율주행, 2029년 하반기 아트리아AI 기반 L2++ 자율주행을 양산할 계획이라고 밝혔다. 또한, 데이터 수집-학습-검증-배포를 연결한 '데이터 플라이휠' 구조를 통해 AI 모델 성능을 향상시키고 있으며, 실증 차량을 통해 도심 주행 성능을 점검 중이다.\n\n### 4. 데이터센터 수주 소식, DL이앤씨와 삼성E&A 주목\n하나증권은 DL이앤씨가 11월에 100MW 규모의 AI데이터센터 착공을 앞두고 있으며, 삼성E&A가 사우디에 35억달러 규모의 암모니아 생산 시설을 수주했다고 보도했다. 이에 따라 데이터센터 건설 관련 GS건설과 DL이앤씨가 주목받고 있으며, 공공 비중이 높은 중소형 건설사도 수혜 가능성이 있다.\n\n### 5. 백화점 업체들, 3분기 실적 컨센서스 하회 가능성\n하나증권은 백화점 업체들의 3분기 실적이 컨센서스를 하회할 가능성이 크다고 분석했다. 9월 추석 연휴 영향과 환율 하락으로 인해 내국인 아웃바운드 증가와 외국인 인바운드 감소로 인해 백화점 매출이 약화될 것으로 예상된다. 특히 롯데쇼핑과 신세계, 현대백화점의 3분기 영업이익은 기대치보다 낮을 것으로 전망된다.\n\n### 6. 구리 가격 하락, 미국 정련동 관세 보류로 인한 정책 프리미엄 되돌림\n한화투자증권은 미국 정련동 관세 보류가 구리 가격 하락의 주요 원인이라고 분석했다. 관세 기대가 반영된 프리미엄이 빠져나가면서 LME 구리 가격이 3.6% 하락했으며, COMEX 12월물도 5.0% 하락했다. 그러나 구리 수급 자체는 변함이 없으며, 광산 공급 부족으로 인해 가격 하단은 지지될 것으로 예상된다.\n\n### 과거 관련 리포트\n- **데이터센터 수요**: 과거 리포트에서는 데이터센터 수요 확대에 따라 건설 지출이 증가할 것으로 예상했으나, 현재는 2분기 이후 지출 재가속으로 이어지며, MW 단위 증가율이 상승하고 있다. 이는 빅테크 기업들의 CapEx 가이던스와 일치하며, 데이터센터 수요 확대에 따른 건설 지출 증가가 지속될 것으로 보인다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n### 1. 비상장기업 투자 동향 급증, IPO 성공률은 하락\n유진투자증권에 따르면, 2026년 8월 비상장기업 투자 건수는 역대 최고 수준을 기록했다. ‘스타트업레시피’ 집계 기준으로는 전년 동월 대비 137개 증가했으며, 9년 동월 평균 대비도 크게 상승했다. 다만, IPO 성공 기업 수는 7개로, 최근 5년 동월 평균 10개 대비 감소한 것으로 나타났다. 이는 투자 열기와 IPO 성공률 간 격차가 커지고 있음을 시사한다.\n\n### 2. 슈퍼 엘니뇨로 인한 물·전력 인프라 위기 가속화\n유안타증권은 9월 10일 NOAA가 발표한 진단에 따라, 2026년 가을~겨울에 '매우 강한' 엘니뇨가 발생할 확률이 90% 이상이라고 보고, 이에 따라 물과 전력 인프라에 대한 스트레스 테스트가 진행되고 있다고 분석했다. 이는 수력 발전의 감소, 화력 발전의 저하, 폭염에 따른 전력 수요 증가 등으로 인해 물·전력 공급망에 큰 압박을 주고 있다. 유안타는 이에 따라 수처리, 냉각, 전력망, 배터리 저장 등 병목 해소 산업에 대한 투자 수요가 증가할 것으로 전망했다.\n\n### 3. AI 개발 속도 조절론으로 인한 반도체주 하락\n대신증권과 키움증권은 9월 중반 AI 개발 속도 조절 논의가 가속화되며 반도체 투자심리가 급랭했다고 분석했다. 야쿠프 파호츠키, 다리오 아모데이 등 주요 인물들의 발언과 일론 머스크, 샘 올트먼 등이 동조하면서, AI 개발의 안전장치 마련 필요성이 부각되며 반도체주가 약세를 보였다. 특히, 미국 반도체주 마이크론과 엔비디아가 각각 5.2%, 3.4% 하락하며 시장에 충격을 주었다.\n\n### 4. FOMC 금리 인상 기대감 강화, 금리 상승 압력 지속\n대신증권과 키움증권은 9월 FOMC에서 금리 인상 확률이 86~87%에 달할 정도로 기정사실화되고 있으며, 이에 따라 미국 10년물 국채금리가 5%를 돌파했다고 보고했다. 이는 금리 인상 기대감이 증시에 압력을 주고 있으며, 특히 AI 산업의 성장성에 대한 불확실성이 커지면서 반도체주에 대한 부담이 가중되고 있다. 다만, 키움증권은 추가 인상에 대한 신중한 입장을 제시하는 연준의 정책이 시장에 안정감을 줄 수 있다고 전망했다.\n\n### 5. 토큰증권 정책 확대, 주식·채권·펀드 토큰화 추진\niM증권은 금융위원회가 토큰증권 정책을 조각투자 중심에서 주식·채권·펀드 등 정형증권으로 확대 추진할 계획이라고 밝혔다. 이는 기존 자본시장의 발행·유통 인프라를 고도화하고, 토큰화 수요가 기존 자산의 접근성과 이전 편의성을 개선하려는 목적에서 비롯된 것으로 보인다. 특히, 1단계에서는 기관투자자 전용 사모 MMF와 사채의 토큰화를 우선 추진할 예정이다.\n\n### 6. 원/달러 환율 상승, 달러 강세 지속\n키움증권은 원/달러 환율이 전일 대비 1.19% 상승하며 1,364.5원으로 마감했다고 보고했다. 이는 국제유가 상승과 9월 FOMC를 앞둔 경계감, 그리고 일본은행의 금리 인상 가능성 등이 달러 강세를 부추겼기 때문이라고 분석했다. 다만, 달러 공급이 여전히 많아 상단이 무거운 흐름을 보이고 있으며, 단기 하단은 1,320원 수준까지 열어둘 필요가 있다고 전망했다.\n\n### 과거 관련 리포트\n- 과거 리포트에서 AI 모멘텀과 금리, 유가의 힘겨루기, FOMC가 시장 분기점으로 작용할 것으로 예상했으나, 실제 시장에서는 AI 개발 속도 조절 논의가 가속화되며 금리 인상 기대감과 유가 상승이 동시에 압력을 주고 있다. 이는 과거에 비해 불확실성이 더 커진 것으로 보인다.\n"}, {"title": "AI 종합의견 (참고용)", "md": "## AI 종합의견 (참고용)\n\n> **이 의견은 AI가 위 증권사 리포트들을 종합해 참고용으로 제시하는 것으로, 특정 증권사의 투자 조언이 아닙니다.**\n\n매크로, 채권, 산업섹터 분야에서 단기적으로 달러 강세와 AI 개발 가속화, 데이터센터 수요 확대 등이 주요 흐름으로 나타나고 있다. 코스피는 AI 관련 우려와 지정학적 리스크로 하락했으며, 채권시장에서는 미국 금리 인상 기대와 추석·분기말 자금 흐름으로 단기 변동성이 확대될 가능성이 있다. 산업별로는 데이터센터 건설 지출 재가속, 현대차의 자율주행 로드맵 등이 주목받고 있으나, 백화점 업체들의 실적 부진 가능성도 존재한다. 이러한 요소들을 종합하면, 다양한 시장 흐름을 고려한 포트폴리오 조정이 필요하다는 시각도 가능하다."}]}</script>
