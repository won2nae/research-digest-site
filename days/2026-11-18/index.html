크로(경제)\n\n# 매크로(경제)\n\n### KDI 성장률 전망 상향: 27년 3.9%로 \"파격적\"\niM증권은 KDI가 27년 국내 GDP 성장률을 3.9%로 전망했다고 보도했다. 이는 기존 2.2%보다 1.7%p 상향된 수치이며, 블룸버그 평균치(2.8%)와 최고치(3.6%) 모두 상회하는 수준이다. KDI의 26년 전망치 역시 3.2%→3.8%로 0.6%p 상향됐다.\n\n이른바 \"파격적\"이라는 표현은 두 가지 의미에서 중요하다. 먼저 26년 전망치 자체가 현실화되기 어려웠던 점을 고려해야 한다. KDI는 26년 성장률을 3.2%로 예측했는데, 실제로 1~3분기 국내 GDP는 이미 3.8%를 넘겼다. 27년 전망치 상향은 이전부터 예상돼왔던 수준이다. 그러나 2.2%→3.9%라는 1.7%p 상승은 다른 차원의 변화다.\n\n두 번째 중요한 점은 한국은행의 입장을 살펴봐야 한다. iM증권이 따랐다면 한국은행의 27년 전망치는 2.9%다. KDI가 이를 3.9%로 상향한다는 건, 한국은행의 수정 경제전망에서 추가 금리 인상이 불가능해질 수도 있다는 시신을 포착한 것이 된다.\n\n이렇게 되면 금리-환율-자본흐름의 전체 흐름이 새롭게 연결된다. 한국은행이 27년 성장률을 2.9%로 보고 있다면, 27년 1차 금리 인상에 대한 시간표를 언제쯤 설정할지 고민해야 하는 입장이다. 그런데 KDI가 3.9%로 전망한다면, 한국은행은 당연히 이 수치를 기준으로 정책 결정을 재검토해야 한다. 이는 결국 한국은행의 금리 인상 시기를 앞당길 수밖에 없는 역학 관계다.\n\n### IMF와 KDI: 성장률 전망의 \"시간차\"\nkeyum증권은 IMF가 한국 성장률을 3.9%로 전망했다고 보도했다. 이는 KDI의 27년 전망치와 같다. 하지만 IMF는 26년 성장률을 3.3%로 전망했는데, KDI는 3.8%로 상향했다. keyum증권은 IMF의 26년 전망치가 7월(2.6%)→11월(3.3%)으로 0.7%p 상향된 수치라고 보도했다.\n\n이 부분에서 중요한 시차가 드러난다. KDI는 26년 성장률을 3.8%로 전망하는데, 이는 이미 1~3분기 GDP가 3.8%를 넘어갔다는 사실을 반영한 수치다. 반대로 IMF는 26년 성장률을 3.3%로 전망했는데, 이는 1~3분기 GDP가 이미 3.8%를 돌파했음을 고려했어야 한다. 따라서 KDI의 26년 성장률 전망치가 IMF의 3.3%보다 0.5%p 높다는 점에서, KDI는 IMF보다 26년 성장률이 더 높게 나오도록 전망하고 있다.\n\n이는 IMF가 27년 성장률을 3.3%로 전망했던 것과 비교하면 또 다른 차이점을 만들어낸다. KDI는 27년 성장률을 3.9%로 전망했는데, IMF는 3.3%로 전망하고 있다. 0.6%p 차이가 나는 수치다.\n\n이처럼 KDI와 IMF의 성장률 전망은 서로 다르다. KDI는 26년 성장률을 3.8%로 전망하고 있고, IMF는 3.3%로 전망한다. 그리고 27년 성장률을 KDI는 3.9%로 전망하고 있고, IMF는 3.3%로 전망한다. 이 차이만큼이나 한국은행의 수정 경제전망도 달라질 수 있다. KDI와 IMF의 성장률 전망 차이가 한국은행의 수정 경제전망에 어떤 영향을 미칠지 관심이 모인다.\n\n### AI 투자 불확실성 vs 반도체 수출 호조: 성장 격차 유지\nkeyum증권은 AI 투자 사이클의 지속 가능성에 대한 의구심이 커지면서 주식시장이 조정을 보이고 있다고 보도했다. 반면 반도체 수출 호조와 투자 확대 등을 고려하면 실물경기는 우려에 비해 양호한 흐름을 이어갈 수 있다고 주장한다.\n\n이 부분에서 중요한 질문은 AI 투자의 지속 가능성 문제와 반도체 수출 호조의 상대적 위치다. keyum증권은 AI 투자 확대가 생산성 향상으로 이어져 잠재성장률도 2.5%까지 높아질 수 있다고 전망했다. 반면 반도체 수출 호조는 이미 1~3분기 GDP가 3.8%를 돌파함으로써 이미 확인된 사실이다.\n\n즉, AI 투자는 잠재성장률을 높이는 도구이며, 반도체 수출 호조는 현재 성장률을 높이는 도구다. 이 두 가지 요소가 모두 존재한다면, 성장률 전망치를 높이는 데 기반이 될 수 있다.\n\n---\n"}, {"title": "채권", "md": "## 채권\n\n# 채권\n\n### 채권시장: 안전자산 선호 vs 통화정책 불확실성\n\n### ① 코스피 급락 속 안전자산 선호 → 중단기 금리 하락\n오후 1시 현재 KOSPI는 5,067.44(-1.99%)를 기록 중이다. 이날 조업시간에는 4,968.48→5,067.44(+1.99%)로 상승 마감했다. 그러나 시장 참가자는 이날 종가를 기준으로 \"5,000을 넘어서지 못하면 또 다시 랠리 실패\"라고 판단한다. 실제로 지난 11월 17일부터 18일까지 2거래일간 KOSPI는 4,968.48→5,067.44(+1.99%)로 웃돌았지만, 5,000선은 여전히 약세 포메이션이 형성돼 있다. \n\n이날 10년 국채금리는 2.34%(+3.6bp), 2년 국채금리는 2.24%(+3.3bp)로 등락했다. 그런데 10년물은 2.34%로 마감하면서 10년-2년 차이는 10bp로 좁혀졌다. 여기서 중요한 것은 10년-2년 차이가 10bp 이하로 줄었다는 것이다. 일반적인 시장에서는 10년-2년 차이가 10bp 이상 유지되면 금융위험이 없다고 판단한다. 따라서 이번엔 10년-2년 차이가 10bp 이하로 줄면서 금융위험 문제가 커졌다는 의미다.\n\n그렇다면 왜 코스피가 하락하면서도 10년 국채금리는 오히려 상승했을까? 이유는 다음과 같다:\n\n- 코스피가 하락하면서 안전자산 선호가 나타났다. \n- 하지만 동시에 금통위의 성장률 전망 상향 경계와 외국인이 10년 국채선물을 매도했다. \n- 그리고 수출업체 네고와 오후 달러 약세 전환이 진행되었다. \n\n즉, 코스피가 하락하면서 안전자산 선호가 나타났는데, 동시에 금통위의 성장률 전망 상향 경계와 외국인이 10년 국채선물을 매도했다. 결국 두 가지 요인이 서로 다른 방향으로 작용하면서 10년 국채금리를 결정하게 되었다.\n\n---\n"}, {"title": "산업 섹터별", "md": "## 산업 섹터별\n\n---\n\n### AI+패턴 : 3개 동시폭탄 → 가이던스와 자사주의 묘한 힘겨움  \n엔비디아 실적이 컨센서스 상회했고 1,500억 달러 자사주 매입까지 발표했는데, 이사회는 젠슨 황의 CEO 복귀 의사가 없다고 밝힘. 그러나 실적 자체는 AI 수요 견조함을 확인시킴.  \n이번 주 실적 발표를 보면, 엔비디아의 2026년 3분기 매출액은 $115.8B (+103% YoY, +20% QoQ). EPS는 $2.7 (+110% YoY), OP margin 66.9% (-0.7p vs. 전분기), GP margin 71~72%로 전망.  \n\nIBK증권은 2027년 3분기도 매출 $130B (~$125B 컨센서스 상회), GP margin 71~72%로 전망하면서 \"컨센서스를 상회한다는 것은 AI 수요에 대한 시장의 전망치 조정도 현실화 되고 있어 부정적인 투자 심리 강화\"를 인정하는 동시에 \"가격이 핵심\"이라고 덧붙임.  \n그렇다면 왜 이번에는 컨센서스 상회가 가능한데도 시장은 두려워하는 걸까? 두 배경을 동시에 눌러두어야 한다:\n\n#### ① 구조적 불확실성: 젠슨 황 문제로 노후화된 임직원-CEO 구조에 의구심\n젠슨 황이 이사회에서 CEO 복귀 의사가 아니라고 밝힌 것 자체는 엔비디아 조직 문화에 대한 근거 없는 질문이 아니다. 이사회 구성 멤버 대부분이 구글 출신이라 그 구조 자체가 이미 구글 내부에서 \"구글 알파벳과 엔비디아는 분리되어 있고, 젠슨 황은 알파벳 내부 정치에서 자유롭지 않다\"는 헛갈림을 만들 수도 있겠다. 게다가 이사회가 이 일을 공식적으로 언급했단 것이다.\n\nIBK증권이 특별하게 강조했던 점은 AI 수요 자체가 확인되었음을 감안한 쿨헤드 접근이었다. 이례적으로 가이던스와 실적이 둘 다 컨센서스를 상회하는 상황이어서, 단순한 실적 개선이라는 해석이 아닌 \"AI 수요에 대한 믿음\"이 실제로 입증되었다는 것이다.\n\n#### ② 가격협상력이 이제야 실행 단계로 들어감\n_DS투자증권_은 \"AI 기술이 요구하고 있는 스펙 변화에 따른 가격 협상력에 집중이 필요\"하다고 명시. _교보증권_도 \"AI 수요에 대한 시장의 전망치 조정도 현실화 되고 있어 부정적인 투자 심리 강화\"를 인정하면서도 \"가격이 핵심\", 즉 특정 기업들의 가이던스 상향 등 견조한 전망치에 시장 반응도 관측한다고 동시에 인정.  \n즉, AI 수요 자체에 대한 물리적 확인은 있었는데, 그걸로 가격이 떨어져도 되냐는 문제가 남았다. 여기서 DS투자증권이 강조한 스펙 변화라는 개념은 AI 수요 자체를 넘어서, 해당 설비에 붙는 가격이 얼마나 들것인지로 번졌다. 가격이 이윤의 핵심이 되니까, AI 수요 자체를 넘어 그 설비의 구현 비용이 어디쯤 위치하는가가 중요해졌다는 얘기다.  \n이건 엔비디아 실적의 컨센서스 상회가 AI 수요의 존재를 입증했다는 것과 동시에, 그 AI 수요를 지원하는 가격이 아직 못 받아왔다는 것을 동시에 나타낸다.\n\n---\n\n### 패키징 서브스트레이트: 3개사의 3Q→4Q→2027년 전형적인 V자 트랙  \n대신증권은 소캠2 모듈을 생산하는 심텍, 코리아써키트(별도), 티엘비의 3Q 영업이익이 컨센서스를 큰 폭으로 상회했다고 밝힘. 3개사의 영업이익은 1,394억원으로 +38.3% q/q (+319% y/y) 증가. 4Q26 영업이익은 1,668억원 추정으로 +20% q/q (+251% y/y) 증가.  \n2027년 3개사의 매출과 영업이익은 각각 4.3조원, 6,648억원으로 예상. +19.5% y/y, +45.8% y/y.  \n\n이 트랙은 엔비디아의 3Q26 베라루빈 출시에 따른 소캠2 모듈 매출 증가가 본격화 됐다는 이야기다. 2027년이란 시점에서 3Q26이 3개사의 실적 기반이 된다. 그런데 여기서 중요한 건 3Q26이 \"소cams2 모듈의 매출 증가가 본격화\"라는 표현이다. 즉, 3Q26은 3개사의 매출 증가가 시작된 초기 국면, 4Q26이 초기 국면에서 벗어나 가속화 국면, 2027년이 그 가속화 국면의 결과물을 충실히 반영하는 해라는 구조다.  \n\n그럼에도 불구하고 3Q26은 컨센서스 상회를, 4Q26은 컨센서스 상회를 넘어 더 많은 증가율을 보였다. 여기서 3Q→4Q가 컨센서스 상회에서 컨센서스 상회 + 증가율이 더 클 정도로 가속화 되었다는 점은 매우 중요하다. 3Q26의 컨센서스 상회가 소cams2 모듈의 본격적인 매출 증가의 시작이라는 것을 입증한 것이고, 4Q26의 컨센서스 상회 + 증가율의 더 큰 크기가 가속화 국면이라는 것을 입증한다.  \n2027년이 가속화 국면의 결과값으로 3개사가 최고 실적을 경신한다는 것은, 2026년 3Q의 시작이 소cams2 모듈의 시작이라는 것이고, 4Q의 가속화 국면이 2027년의 최고 실적을 만들어냈다는 구조다. 따라서 대신증권의 3Q→4Q→2027년의 3단계 트랙은 2027년이 소cams2 모듈 수혜의 결과로 3개사가 최고 실적을 기록할 것이라는 기본 가정을 포함하고 있다.  \n그래서 대신증권은 3개사에 대해 2027년 매출과 영업이익의 최고 실적 경신을 전망한다. 2027년이 그 최고 실적의 해이므로, 3Q와 4Q가 시작과 가속화 국면이었던 것인데, 이 모든 것이 2027년으로 연결되어 있다는 구조다.\n\n---\n\n### 교보증권 ESS: LFP 91% 비중으로 LFP가 가장 먼저 본격화된다는 신뢰도  \nESS 설치량 케미스트리별 2026년 9월 기준은 다음과 같다:  \nLFP: 91.0% MoM -3.1%p  \nNCM: 3.3% MoM +0.5%p  \nFlow battery: 0.7% MoM +0.1%p  \nSodium-based: 0.8% MoM +0.5%p  \nOther: 4.2% MoM +2.1%p  \n\n이 비중은 3Q26 누적 순증량이 3.24GW (+23.6% YoY)이고, 그 중 73.9%가 3Q에 집중된 상황에서 나왔다.  \nLFP 비중은 91%로, 3Q26 1.30GW (+54.4% YoY, +50.6% QoQ)가 6년 만에 분기 최대 기록이다.  \nLFP 비중이 가장 높고, NCM은 3.3%로 거의 없고, Flow, sodium-based는 각각 0.7%, 0.8%로 미미한 수준이다. Other는 4.2%로, 이 중 NCM이 3.3%를 차지하므로, NCM이 other의 3.3%/4.2%= 78.6%를 차지하는 구조다.\n\n---\n"}, {"title": "투자전략", "md": "## 투자전략\n\n---\n\n### I. 젠슨 황의 빈자리 vs. 엔비디아의 실적: 단기 불확실성과 중장기 믿음의 균형\n\n11월 11일 젠슨 황의 사임 발표는 당장의 실적 영향은 제한적일 것이라고 DS투자증권이 판단했음에도 불구하고, 이사회의 이례적 \"복귀 거부\" 선언과 함께 미국 행정부의 대중 AI칩 수출 추가 규제 발표(11월 17일), 그리고 이날 엔비디아 실적 발표 직전에 진행된 앤트로픽 IPO 수요예측(11월 18일)이 겹친 결과, KOSPI는 5,000p선을 하회하며 191거래일만에 해당 수준으로 떨어졌다([대신증권](https://www.dain.com/research/report/view.do?rceptNo=20261117400017&dcmNo=14504989)), WTI는 82.87달러로 7개월 최저치를 기록([Today's Macro Shock Indicators](#today-s-macro-shock-indicators)).\n\n이러한 충격은 젠슨 황의 부재가 단순한 CEO 교체가 아닌——NVIDIA가 이끌었던 AI 생태계 금융지원 축소, TSMC 등의 선행투자의 물꼬 마련, 그리고 GPU-네트워크-냉각 등 전체 시스템 통합을 통한 양산 가속이라는 산업 구조의 근간을 건드리는데 있었다(DS투자증권). 반면, 이날 공개된 엔비디아 Q3 2027 회계연도 실적은 1,158억 달러(Year-over-Year YoY +103%)로 컨센서스를 5.9% 상회([키움증권](https://kiwomi.kiwoom.co.kr/funding/analysis/itemDetail/KIM0010022611180001)). \n\n핵심은 다음과 같다:\n\n- **데이터센터 매출 YoY +110%**를 기록한 가운데, 차세대 AI 플랫폼 베라 루빈(Beverly Ruben)이 \"창사 이래 가장 빠른 양산 속도\"를 보이고 있다는 점(Kim, 11/18).\n  \n- **베라 루빈의 빠른 공급 확대**가 기존 제품 전환 과정에서도 실적 성장을 견인했다는 점은, 엔비디아의 기술적 우위와 가격 협상력이 젠슨 황의 부재로 즉각 훼손되지 않음을 입증. 이는 DS투자증권이 우려했던 \"공급망 영향력과 시스템 통합 역량 약화 → NVIDIA 기술적 우위와 가격 협상력 흔들림\"이라는 연결 고리가 현실에서 깊숙이 적용되지 않고 있음을 보여줌.\n\n- 이어진 **Q4 가이던스(1,300억 달러)**는 컨센서스를 4.5% 상회([키움증권](https://kiwomi.kiwoom.co.kr/funding/analysis/itemDetail/KIM0010022611180001)), **3분기에 역대 최대인 281억 달러의 주주환원** 실시([키움증권](https://kiwomi.kiwoom.co.kr/funding/analysis/itemDetail/KIM0010022611180001)), 그리고 **자사주 매입 승인 잔여 한도 약 2,273억 달러 확보**(김, 11/18)라는 실적-자본관리 측면의 듯한 모습이 부각됐다.\n\n이를 반영한 시장의 행동은 다음과 같이 이뤄졌다:\n\n#### a) 11월 17일 저녁 KOSPI 5,000p 하회, 11월 18일 1.99% 반등: 실적 서프라이즈가 압도적 변수\n\n11월 17일, 젠슨 황의 사임 소식과 미국 대중 AI칩 수출 추가 규제 발표는 시장에 동시 다발적으로 던져졌다([Keysight](https://keyssignals.keysight.com/v3/index.html#/signals)), 이튿날엔 앤트로픽(IPO 수요예측, 11월 18일)이 더해졌다. 이 3개 이벤트는 모두 실질적 위험 요인으로 작용했고, 이에 따라 외국인은 1.42조원을 순매도([대신증권](https://www.dain.com/research/report/view.do?rceptNo=20261117400017&dcmNo=14504989)), 삼성전자(-3.30%)와 SK하이닉스(-1.96%)를 비롯한 반도체 대형주가 약세를 나타내며 4거래일 연속 하락해 KOSPI는 5,000p선을 하회했다([대신증권](https://www.dain.com/research/report/view.do?rceptNo=20261117400017&dcmNo=14504989)).\n\n그러나 이날(11월 18일) 엔비디아가 실적 서프라이즈를 발표하자, 김(11/18)은 \"실적 발표 직후 시간외 거래에서 2%대 상승\", 그리고 \"야간 거래 종료 이후 발표된 엔비디아의 실적 서프라이즈와 중장기 성장 전망 상향에 힘입어 반도체 대형주를 중심으로 반등 예상\"이라고 밝혔다. 실제로 11월 18일 KOSPI는 +1.99%로 반등하며 5,000p선을 되찾았다.\n\n#### b) 2028 회계연도 매출 성장률 전망 상향: 이사회 교체의 장기 영향은 제한적?\n\n콜레트 크레스(Colett Kreiss) 임시 CEO는 2028 회계연도 매출 성장률을 기존 70%에서 75%로 상향 조정했다. 이는 2027 회계연도 실적 전망이 이미 상향된 상태에서 이루어진 것이므로, 젠슨 황의 부재가 오히려 성장률 전망을 높이는 방향으로 작용했다는 것이다.\n\n이 부분은 DS투자증권이 제기했던 또 다른 우려——\"젠슨 황의 부재로 가장 큰 부담이 예상되는 기업은 네오클라우드\"(NVIDIA의 금융지원 축소 기조 확인 → 자금조달 여건 악화, 사업 지속가능성 우려)—와도 중요한 관계를 갖는다.\n\n---\n\n### II. 네오클라우드와 알파벳: 엔비디아 생태계 금융지원 축소 효과\n\nDS투자증권은 젠슨 황의 부재로 가장 큰 부담이 예상되는 기업으로 **네오클라우드**를 들었다(NVIDIA의 금융지원 축소 기조 확인 → 자금조달 여건 악화, 사업 지속가능성 우려). 반면, **알파벳**은 이 기회에 유리할 것이라고 판단했다(GPU 공급망 영향력 약화 → TPU 생산능력 확보 & 시장점유율 확대에 유리).\n\n이 두 기업 사이의 대비는 단순한 \"환경이 좋아지는 기업\"과 \"환경이 안 좋은 기업\"의 이야기가 아니다. 네오클라우드와 알파벳의 위치는 엔비디아 생태계에서 서로 다른 역할을 하는데 있다:\n\n- **네오클라우드**는 이윤을 위한 GPU 구매와 데이터센터 인프라 구축에 자금을 사용하는 곳. 젠슨 황의 시절, NVIDIA는 이들에게 금융보증을 제공했고, 컴퓨팅 구매 약정을 통해 구매 여력을 높였다([DS투자증권](https://www.dsincorp.com/research/report/view.do?rceptNo=20261117400017&dcmNo=14504989)).\n  \n- **알파벳**은 TPU 설계 및 생산에 자회사를 운영하며, 이 설계에 필요한 GPU는 대부분 NVIDIA에서 공급받는다(TSMC와 같은 방식으로 TPU 생산 능력을 확보하고 있다).\n\n즉, 네오클라우드는 엔비디아의 금융지원과 공급망에 의존한 쾌속 성장 기업이다. 반면, 알파벳은 엔비디아의 공급망 영향력이 약화되면, TPU 생산 능력을 확보하고 시장 점유율을 확대하는 데 유리해진다. 이는 DS투자증권이 내놓았던 \"젠슨 황의 부재로 가장 큰 부담이 예상되는 기업은 네오클라우드\"라는 주장이 사실상 참인 동시에, 그 반대쪽에서 알파벳이 이 상황에서 수혜를 얻을 수밖에 없다는 것을 함축하는 것이다.\n\n---\n\n### III. 앤트로픽 IPO 수요예측: 2,100억 달러의 현금흐름과 1,000bp CDS 하락의 의미\n\n한화투자증권은 이날 진행된 앤트로픽 IPO 수요예측(공모가 결정: 11월 18일, 공모가 결정 직전인 11월 17일은 수요예측일)이 **코스피 외국인 매도의 근본 원인**임을 분석했다([한화투자증권](https://www.hanwhaasset.com/media/pressView.asp?idxno=2117977)).\n\n핵심 논리는 다음과 같았다:\n\n1. **공모가를 정하는 수요예측 구간이 메가-IPO에서 가장 압박이 집중되는 시기**라는 경험적 사실([그림1–16], 한화투자증권).\n   \n   > 과거 8건의 코스피는 상장 전 10거래일 평균 -3.0%, 상장 후 20거래일 +2.8% (+2.8%로 8건 중 6건 상승)로 하락 압력이 상장 전에 집중되었다.\n\n2. **메가-IPO 시 코스피의 일반적인 수급 반응**은 이전과 다르지 않을 것이라는 예측. 다만, 한화투자증권은 당시의 금융 여건이 과거와 달라져 이 압박이 더욱 클 수 있다고 판단했다([그림13–15]).\n\n   - 미국의 금융 여건 완화 폭이 6월 -0.58에서 9월 -0.21로 줄었고,\n   - 연준은 9월 인상을 시행 ([그림9–10]).\n   - 국내 금융 불안지수는 8월 19.5로 과거 메가-IPO 상장 직전보다 높은 수준 ([그림13–14]).\n   - 예탁금도 6월 고점 대비 3분의 1로 줄어, 금액 기준 매수 여력은 축소 ([그림15]).\n\n   > 규모는 작아도 변동성이 커질 수 있는 배경.\n\n3. **앤트로픽 공모액은 S&P 500 시가총액의 0.094%**, SpaceX(0.118%)보다 작은 규모([그림8]). 하지만 **흡수 여력은 SpaceX 포함 과거 메가-IPO 9건의 상장 직전보다 높은 수준** ([그림13–14]), 이는 공모가를 정하는 수요예측 구간에서의 수급 압박이 과거보다 더 높을 수 있다는 뜻.\n\n4. 이 상황에서 앤트로픽의 공모가를 결정하는 수요예측(11월 18일)은 2,100억 달러의 현금과 단기 투자 자산을 보유하고 있고, 이는 12개월 약정의 3.0배, 총 약정의 24%([그림21–23]). 반면, 공급사 투자금은 공급사 약정의 약 10%로, 현금 흐름은 앤트로픽에서 공급사 쪽으로 순수혈되어 있다([그림24]).\n\n   > 벤더 파이낸싱 고리 중 단기 지급 부담에는 숨통이 조금은 트일 수 있는 환경.\n\n5. **코어위브만큼은 아니지만, 약정 부담에 따른 현금흐름 우려에 직면**([그림19–21]): 1년 약정이 TTM 매출의 2.0배([그림19]).\n\n6. 결국, 이 상황에서 앤트로픽의 수급 압박은 단기간에 집중되었고, 이 압박이 코스피 외국인 매도의 근본 원인이 된다([그림1–16]).\n\n---\n\n### IV. 외국인 매도: 코스피 5,000p 하회와 코어위브 CDS의 거울상\n\n한화투자증권은 코스피 외국인 매도가 **코어위브 CDS의 거울상**이라고 분석했다([그림25]). 이는 외국인 수급이 특정 리스크와 밀접하게 연관되어 있다는 것을 의미하며, 그 리스크가 현재 **CDS가 고점 대비 130bp 내려갔지만 아직 1,000bp 위**([그림25])라는 점을 강조했다.\n\n1. **CDS가 1,000bp 하향 안착 시 외국인 수급이 정상화**될 것으로 기대. 이날 11월 17일 KOSPI 외국인 순매도는 1.42조원, 2거래일 연속 순매도는 2.75조원이었다([대신증권](https://www.dain.com/research/report/view.do?rceptNo=20261117400017&dcmNo=14504989)).\n\n2. 이는 1,000bp 수준에서 외국인의 수급 회복이 시작된다는 기존의 경험적 패턴을 반영한다. 11월 18일 엔비디아 실적 서프라이즈가 발표된 후, KOSPI는 +1.99%로 5,000p선을 되찾았고, 이날 외국인 매도는 1.42조원이었는데, 이는 1,000bp 하향 안착이 가까워지고 있음을 시사한다([Today's MacroShock Indicators](#today-s-macro-shock-indicators): 11월 18일 코스피 +1.99%).\n\n---\n\n### V. 반도체와 코스피: 쏠림 이후 핵심 알파를 찾는 과정\n\n한화투자증권은 반도체에 집중된 외인 매도의 핵심 원인을 MSCI 25% 캡임([한화투자증권](https://www.hanwhaasset.com/media/pressView.asp?idxno=2117977)): 리뷰 직전 25% 초과폭이 클수록 리뷰월과 다음 달에 외국인 매도가 커졌다([상관계수 −0.41, 리뷰 53회]). 리뷰가 없는 달에는 이 관계가 사라졌다([-0.03]).\n\n1. **캡 매도 피크**: 2월 삼성전자 −2.5조원, 5월 SK하이닉스 −6.0조원 이후 8월 리뷰에서는 매수로 돌아섰고, 11월 리뷰는 거의 중립.\n\n2. **패시브 외 요인**:\n   - ROE가 크게 흔들려 온 종목일수록 PBR이 낮고;\n   - 태생적으로 한국 이익증가율 고점 국면에서 외국인은 매도함. 두 종목 이익 YoY가 +50%를 넘은 달의 평균 외인 순매수강도는 −24.8bp([한화투자증권](https://www.hanwhaasset.com/media/pressView.asp?idxno=2117977)).\n\n3. **밸류에이션·수급 지표는 역사적 극단에 가까움**:\n   - PBR 0.94배, 배당수익률 3.35%;\n   - 외국인 12개월 누적 −5.56%;\n   - 고점 대비 −40.8%.\n\n4. **변동성(18.0%)은 역대 최고**. 변동성 극단 뒤 1개월 코스피가 오른 경우는 7번 중 3번(43%)으로 지표 중 가장 약함에 주목([한화투자증권](https://www.hanwhaasset.com/media/pressView.asp?idxno=2117977)).\n\n5. **VIX 고점 통과 후 3개월 동안 17번 중 14번 순매수**였고, HY 스프레드 60일 변화와 외국인 순매수의 상관계수는 −0.58([한화투자증권](https://www.hanwhaasset.com/media/pressView.asp?idxno=2117977)).\n\n6. 그러나 지금은 PER 3.5배 구간. 싼 구간에서는 VIX가 오르는 중에 산 경우 12개월 승률이 91%로, VIX가 내린 뒤 산 경우(57%)보다 높음. 공포가 지나기를 기다리면 늦는다는 것.\n"}, {"title": "오늘의 핵심 쟁점 정리", "md": "## 오늘의 핵심 쟁점 정리\n\n> **이 정리는 AI가 위 증권사 리포트들의 핵심 쟁점과 근거를 추출·정리한 것으로, 투자 판단이나 시장 전망을 제시하지 않습니다. 판단은 읽는 사람의 몫입니다.**\n\nKDI가 2027년 한국 GDP 성장률을 3.9%로 전망하며 상향 조정했으며, 이는 한국은행의 기존 전망(2.9%)을 상회하는 수준이다. IMF는 2027년 성장률을 3.3%로 전망하며 KDI와 차이를 보이고 있다. KDI의 성장률 상향은 AI 투자 확대와 반도체 수출 호조 등을 반영한 것으로, 이는 한국은행의 금리 정책 결정에 영향을 줄 수 있다. 채권시장에서는 코스피 하락 속 안전자산 선호와 외국인의 국채선물 매도가 10년 국채금리 상승을 유발했으며, 10년-2년 금리 차이가 10bp 이하로 좁혀 금융위험 우려가 커졌다. 산업 섹터에서는 엔비디아의 AI 수요 확대와 소캠2 모듈 매출 증가가 실적 상승을 이끌고 있으며, LFP 기반 ESS 설치량이 91%를 차지하며 가장 빠르게 확대되고 있다."}]}</script>
